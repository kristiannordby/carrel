<style>
/* Layout: index-card study desk. Lecture rail on the left, one ruled card (or a stack of quiz slips) in the main column. */
:root{
  --paper:#eef1f0; --surface:#fbfcfb; --ink:#1c2733; --muted:#5b6774; --line:#d5dcdf;
  --rule:#bcd3e6; --margin:#c8414f; --accent:#24527a; --accent-soft:#e0eaf3;
  --good:#2f7a4f; --good-soft:#e1f1e6; --bad:#b23a3a; --bad-soft:#f7e3e1; --warn:#9a6b12;
  --shadow:0 1px 0 rgba(28,39,51,.06),0 8px 24px -12px rgba(28,39,51,.25);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11161c; --surface:#19212a; --ink:#e3e9ee; --muted:#97a4b1; --line:#2b3641;
  --rule:#26394c; --margin:#e0616c; --accent:#8cb8e0; --accent-soft:#1f3245;
  --good:#6cc28f; --good-soft:#173326; --bad:#ef8a84; --bad-soft:#3a1f1f; --warn:#e2b25a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161c; --surface:#19212a; --ink:#e3e9ee; --muted:#97a4b1; --line:#2b3641;
  --rule:#26394c; --margin:#e0616c; --accent:#8cb8e0; --accent-soft:#1f3245;
  --good:#6cc28f; --good-soft:#173326; --bad:#ef8a84; --bad-soft:#3a1f1f; --warn:#e2b25a;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:20px 48px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;display:grid;gap:24px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding-bottom:16px}
.eyebrow{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4.5vw,40px);line-height:1.05;margin:6px 0 0;text-wrap:balance;letter-spacing:-.01em}
.top-stats{font-family:var(--f-mono);font-size:13px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.top-stats b{color:var(--ink);font-weight:600}

.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:28px;align-items:start}
nav.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);display:grid;gap:2px}
.rail .rail-label{margin:0 0 6px 10px}
.lec-btn{display:grid;grid-template-columns:34px 1fr;align-items:baseline;gap:6px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.25}
.lec-btn .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.lec-btn:hover{background:var(--accent-soft)}
.lec-btn[aria-current="true"]{background:var(--surface);box-shadow:inset 3px 0 0 var(--margin),var(--shadow)}
.lec-btn .meter{grid-column:2;height:3px;background:var(--line);border-radius:2px;margin-top:6px;overflow:hidden}
.lec-btn .meter i{display:block;height:100%;background:var(--good);width:0}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 10px}

main{min-width:0;display:grid;gap:18px}
.lec-head h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3vw,30px);margin:4px 0 8px;line-height:1.15;text-wrap:balance}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--f-mono);font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);background:var(--surface)}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);margin-top:8px;overflow-wrap:anywhere}

.tabs{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:3px;background:var(--surface);gap:3px;justify-self:start}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface)}

/* Flashcards */
.fc-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.fc-bar .counts{display:flex;gap:14px;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--good);transition:width .3s}
.card{position:relative;background:var(--surface);border-radius:4px;box-shadow:var(--shadow);min-height:320px;padding:22px 26px 26px 64px;cursor:pointer;
  background-image:linear-gradient(to bottom,transparent 0,transparent 63px,var(--margin) 63px,var(--margin) 64px,transparent 64px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px);
  background-position:0 0,0 70px;background-repeat:no-repeat,repeat;background-size:100% 100%,100% calc(100% - 70px);
  display:grid;align-content:start;gap:12px;user-select:text}
.card::before{content:"";position:absolute;top:0;bottom:0;left:44px;width:1px;background:var(--margin);opacity:.55}
.card .side{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px;min-height:40px}
.card .front-text{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,32px);line-height:1.2;text-wrap:balance;margin-top:18px}
.card .answer{font-size:19px;line-height:32px;font-weight:500}
.card .why{font-size:16.5px;line-height:32px;color:var(--muted)}
.card .why b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-right:6px}
.card .hint{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:auto}
.card.flipping{animation:flip .28s ease}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.card .tag{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:999px;text-transform:none;letter-spacing:0}
.tag.known{background:var(--good-soft);color:var(--good)}
.tag.learning{background:var(--bad-soft);color:var(--bad)}
.fc-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.fc-controls .grp{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;cursor:pointer;font-family:var(--f-display);font-weight:500;font-size:14.5px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.45;cursor:default}
.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--surface);border-radius:4px;box-shadow:var(--shadow)}

/* Quiz */
.qz-bar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.score{font-family:var(--f-mono);font-size:14px;display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
.score b{color:var(--ink)}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.qlist{display:grid;gap:14px;counter-reset:q}
.q{background:var(--surface);border-radius:4px;box-shadow:var(--shadow);padding:18px 20px 20px;display:grid;gap:12px;border-left:3px solid var(--line)}
.q.right{border-left-color:var(--good)}
.q.wrong{border-left-color:var(--bad)}
.q-head{display:flex;gap:10px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
.q-num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.diff{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid currentColor}
.diff.easy{color:var(--good)} .diff.medium{color:var(--warn)} .diff.hard{color:var(--bad)}
.q-text{font-size:18px;line-height:1.45;font-weight:500;margin:0}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr 20px;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);background:transparent;border-radius:6px;padding:9px 12px;cursor:pointer;font-size:16.5px;line-height:1.4}
.opt .let{font-family:var(--f-mono);font-size:13px;color:var(--muted);padding-top:2px}
.opt .mark{font-family:var(--f-mono);font-weight:600;text-align:right}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .mark{color:var(--good)}
.opt.chosen-wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.chosen-wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
.expl{font-size:16px;line-height:1.55;background:var(--paper);border-radius:4px;padding:12px 14px;color:var(--ink)}
.expl b{font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin-right:6px}
.expl b.ok{color:var(--good)} .expl b.no{color:var(--bad)}
.q-src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent)}
.summary{background:var(--surface);border-radius:4px;box-shadow:var(--shadow);padding:18px 20px;display:grid;gap:10px}
.summary h3{font-family:var(--f-display);margin:0;font-size:20px}
.sum-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-family:var(--f-mono);font-size:13px}
.sum-grid div{border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-variant-numeric:tabular-nums}
.sum-grid strong{display:block;font-size:20px;color:var(--ink)}

@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.rail{position:static;display:flex;overflow-x:auto;gap:6px;padding-bottom:6px;scrollbar-width:thin}
  nav.rail .rail-label,nav.rail hr{display:none}
  .lec-btn{flex:0 0 auto;grid-template-columns:auto;gap:0;border:1px solid var(--line);background:var(--surface);padding:7px 11px}
  .lec-btn .full,.lec-btn .n{display:none}
  .lec-btn .short{display:inline}
  .lec-btn .meter{grid-column:1}
  .lec-btn[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--margin)}
  .card{padding:18px 16px 22px 40px;min-height:280px;background-image:linear-gradient(to bottom,transparent 0,transparent 63px,var(--margin) 63px,var(--margin) 64px,transparent 64px),repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
  .card::before{left:26px}
  body{font-size:16px}
}
@media (min-width:821px){.lec-btn .short{display:none}}
@media (prefers-reduced-motion:reduce){.card.flipping{animation:none}.progress i{transition:none}}
/* Weak-spots tracking */
[hidden]{display:none!important}
.dash>*,#panel>*{min-width:0}
.chip.t{cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chip.t:hover{border-color:var(--accent);color:var(--ink)}
.chip.t .sd{width:7px;height:7px;border-radius:50%;background:var(--line)}
.chip.t.weak{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.chip.t.weak .sd{background:var(--bad)}
.chip.t.ok .sd{background:var(--good)}
.chip.t.mixed .sd{background:var(--warn)}
.lec-btn .badge{font-family:var(--f-mono);font-size:11px;color:var(--bad);margin-left:6px}
.sync{font-family:var(--f-mono);font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--warn);display:inline-block}
.sync.on i{background:var(--good)}
.prior{font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bad-soft);color:var(--bad)}
.q-head .right-bits{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{background:var(--surface);border-radius:4px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:2px}
.tile .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .k{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile .s{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.tile.alert .v{color:var(--bad)}
.dash h3{font-family:var(--f-display);font-size:20px;margin:6px 0 2px}
.dash .lede{color:var(--muted);margin:0 0 6px;font-size:16px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.tbl-wrap{overflow-x:auto;background:var(--surface);border-radius:4px;box-shadow:var(--shadow)}

.accbar{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12.5px;white-space:nowrap}

.num-bad{color:var(--bad);font-family:var(--f-mono);font-weight:600}

.cov{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.cov button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;display:grid;gap:4px}

.cov .cl{font-family:var(--f-display);font-weight:500;font-size:14.5px}

.missed{display:grid;gap:10px}

.missed .mq{font-weight:500;font-size:16.5px;line-height:1.4}
.missed .mm{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.missed .body{display:grid;gap:6px;margin-top:10px;font-size:15.5px}
.missed .yours{color:var(--bad)} .missed .right{color:var(--good)}
.missed .body b{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.solid{font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.danger{color:var(--bad)}
@media (max-width:820px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.cov{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.cov{grid-template-columns:minmax(0,1fr)}}

/* Notes + Claude replies */
.note{display:grid;gap:6px;border-top:1px dashed var(--line);padding-top:12px}
.note-head{display:flex;justify-content:space-between;gap:8px;align-items:baseline}

.note textarea{width:100%;min-height:64px;resize:vertical;font-family:var(--f-body);font-size:16px;line-height:1.45;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.note textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.reply{display:grid;gap:6px;background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:16px;line-height:1.55}

.thinking{font-family:var(--f-mono);font-size:13px;color:var(--muted);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.linkbtn{justify-self:start;border:0;background:none;padding:0;color:var(--accent);font-family:var(--f-mono);font-size:12px;cursor:pointer;text-decoration:underline}
.notebar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:10px 12px}
.nb-status{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);min-width:0}

@media (prefers-reduced-motion:reduce){.thinking{animation:none}}

(function(){

  function blank(){ return {v:2, hist:{}, cards:{}, resetAt:0}; }
  function merge(a, b){

    const r = blank(); r.resetAt = Math.max(a.resetAt||0, b.resetAt||0);
    for (const f of ["hist","cards"]){
      const keys = new Set([...Object.keys(a[f]||{}), ...Object.keys(b[f]||{})]);
      keys.forEach(k=>{
        const x=(a[f]||{})[k], y=(b[f]||{})[k];
        const pick = !x ? y : !y ? x : ((y.t||0) > (x.t||0) ? y : x);

  }
  function stable(o){ return JSON.stringify(o, (k,v)=> v && typeof v==="object" && !Array.isArray(v) ? Object.keys(v).sort().reduce((m,kk)=>(m[kk]=v[kk],m),{}) : v); }

  // ---------- account sync via db (per-person private subtree) ----------
  const syncState = {};   // docName -> "on" | "off" | "wait"

  function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s^=s<<13; s>>>=0; s^=s>>17; s^=s<<5; s>>>=0; return s/4294967296; }; }
  function hash(str){ let x=2166136261; for(const ch of str){ x^=ch.charCodeAt(0); x=Math.imul(x,16777619);} return x>>>0; }
  function shuffle(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

  // ---------- rail ----------
  function renderRail(){
    const openTotal = allQs.filter(isOpenMiss).length;
    const learnTotal = allCards.filter(c=>cardState(c)==="learning").length;
    const items = L.map(l=>{
      const k = l.cards.filter(c=>cardState(c)==="known").length;
      const ls = lecStats(l);
      return `<button class="lec-btn" data-id="${l.id}" aria-current="${state.set===l.id}">
        <span class="n">${lab(l)}</span><span><span class="full">${esc(l.title)}</span><span class="short">${lab(l)} ${esc(l.short)}</span>${ls.open?`<span class="badge" title="${ls.open} missed question${ls.open>1?"s":""} to retry">${ls.open}✗</span>`:""}</span>
        <span class="meter" title="${k} of ${l.cards.length} cards known"><i style="width:${(k/l.cards.length*100).toFixed(0)}%"></i></span></button>`;
    }).join("");
    $("rail").innerHTML = `<div class="eyebrow rail-label">Study</div>
      <button class="lec-btn" data-id="weak" aria-current="${state.set==="weak"}"><span class="n">◎</span><span><span class="full">Weak spots</span><span class="short">◎ Weak spots</span>${openTotal?`<span class="badge">${openTotal}✗</span>`:""}</span></button>
      <button class="lec-btn" data-id="missed" aria-current="${state.set==="missed"}"><span class="n">↺</span><span><span class="full">Retry what you missed</span><span class="short">↺ Retry missed</span>${openTotal?`<span class="badge">${openTotal}✗</span>`:""}</span></button>
      <button class="lec-btn" data-id="mix" aria-current="${state.set==="mix"}"><span class="n">★</span><span><span class="full">Mixed exam review</span><span class="short">★ Mixed review</span></span></button>
      <button class="lec-btn" data-id="params" aria-current="${state.set==="params"}"><span class="n">⚙</span><span><span class="full">Parameter effects</span><span class="short">⚙ Parameters</span></span></button>
      <hr><div class="eyebrow rail-label">Lectures</div>${items}`;
    $("rail").querySelectorAll(".lec-btn").forEach(b=>b.onclick=()=>selectSet(b.dataset.id));
    const answered = allQs.filter(q=>P.hist[q.key]).length;
    const totalKnown = allCards.filter(c=>cardState(c)==="known").length;
    $("topStats").innerHTML = `<span><b>${answered}</b>/${allQs.length} questions tried</span><span><b>${totalKnown}</b>/${allCards.length} cards known</span><span><b class="${openTotal?"danger":""}">${openTotal}</b> to retry</span>`;
  }

  function selectSet(id){
    state.set = id; store.set("set", id);
    try{ history.replaceState(null,"","#"+id); }catch(e){}
    fc = null; qz = null;
    render(); window.scrollTo({top:0});
    if (window.innerWidth<=820){ const a=document.querySelector('.lec-btn[aria-current="true"]'); a && a.scrollIntoView({inline:"center",block:"nearest"}); }
  }

  function topicChip(t){
    const s = topicStats(t);
    const tip = s.n ? `${s.c}/${s.n} correct${s.open?`, ${s.open} to retry`:""}${s.learning?`, ${s.learning} cards still learning`:""}` : (s.learning? `${s.learning} cards still learning` : "Not tested yet");
    return `<button class="chip t ${s.status}" data-topic="${t.id}" title="${esc(tip)} · click to drill"><span class="sd"></span>${esc(t.name)}</button>`;
  }
  function renderHead(S){
    let chips = "";
    if (S.kind==="lec") chips = S.lec.topicObjs.map(topicChip).join("");
    else if (S.kind==="topic") chips = topicChip(S.topic) + `<button class="chip t" data-lec="${S.topic.lec.id}">← Back to ${lab(S.topic.lec)}</button>`;
    $("lecHead").innerHTML = `<div class="eyebrow">${esc(S.eyebrow)}</div><h2>${esc(S.title)}</h2>
      ${chips?`<div class="chips">${chips}</div>`:""}
      ${S.src?`<div class="src">${S.kind==="lec"||S.kind==="topic"?"Source: ":""}${esc(S.src)}</div>`:""}
      ${S.kind==="lec"?`<div class="src">Topic dots: <span style="color:var(--bad)">●</span> needs work · <span style="color:var(--warn)">●</span> some misses · <span style="color:var(--good)">●</span> solid · grey = not tested. Click a topic to drill it.</div>`:""}`;
    $("lecHead").querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>selectSet(b.dataset.topic));
    $("lecHead").querySelectorAll("[data-lec]").forEach(b=>b.onclick=()=>selectSet(b.dataset.lec));
  }

  // ---------- dashboard ----------
  function renderDash(){ keepFocus(renderDashInner); }
  function renderDashInner(){
    const answered = allQs.filter(q=>P.hist[q.key]);
    let n=0,c=0; answered.forEach(q=>{ n+=P.hist[q.key].n; c+=P.hist[q.key].c; });
    const open = allQs.filter(isOpenMiss);
    const learning = allCards.filter(c=>cardState(c)==="learning");
    const stats = TOPICS.map(t=>({t, s:topicStats(t)}));
    const focus = stats.filter(x=>x.s.status==="weak"||x.s.status==="mixed").sort((a,b)=>b.s.score-a.s.score);
    const solid = stats.filter(x=>x.s.status==="ok");
    const untested = stats.filter(x=>x.s.status==="none");
    let html = `<div class="dash" style="display:grid;gap:18px">
      <div class="tiles">
        <div class="tile"><span class="k">Questions tried</span><span class="v">${answered.length}<span style="font-size:16px;color:var(--muted)">/${allQs.length}</span></span><span class="s">${n} attempts total</span></div>
        <div class="tile"><span class="k">Quiz accuracy</span><span class="v">${n?Math.round(c/n*100)+"%":"–"}</span><span class="s">${c} of ${n} attempts correct</span></div>
        <div class="tile ${open.length?"alert":""}"><span class="k">Missed, not yet fixed</span><span class="v">${open.length}</span><span class="s">last answer was wrong</span></div>
        <div class="tile ${learning.length?"alert":""}"><span class="k">Cards still learning</span><span class="v">${learning.length}</span><span class="s">of ${allCards.length} cards</span></div>
      </div>`;
    if (!n && !learning.length && !allCards.some(c=>cardState(c))){
      html += `<div class="empty" style="text-align:left;display:grid;gap:10px">
        <strong style="color:var(--ink);font-family:var(--f-display);font-size:18px">Nothing tracked yet</strong>
        <span>Every quiz answer and every “Still learning” card mark is recorded here. Missed questions are grouped by topic so you can drill the exact ideas you are shaky on, and a question leaves the list once you answer it correctly.</span>
        <div class="actions"><button class="btn primary" data-go="l1" data-tab="quiz">Start with the Lecture 1 quiz</button><button class="btn" data-go="mix" data-tab="quiz">Take a mixed quiz</button></div></div>`;
    } else {
      html += `<div class="actions">
        <button class="btn primary" data-go="missed" data-tab="quiz" ${open.length?"":"disabled"}>Retry ${open.length} missed question${open.length===1?"":"s"}</button>
        <button class="btn" data-go="missed" data-tab="cards" ${getSet("missed").cards.length?"":"disabled"}>Review cards from weak topics</button>
        <button class="btn" data-go="mix" data-tab="quiz">Mixed quiz (weighted to weak topics)</button></div>`;
      html += `<div><h3>Topics to focus on</h3><p class="lede">Ranked by open misses, total wrong answers and cards still marked learning.</p>`;
      if (focus.length){
        html += `<div class="tbl-wrap"><table class="topics"><thead><tr><th>Topic</th><th>Quiz accuracy</th><th>To retry</th><th>Cards learning</th><th></th></tr></thead><tbody>` +
          focus.map(({t,s})=>`<tr><td><div class="tn">${esc(t.name)}</div><div class="tl">${lab(t.lec)} ${esc(t.lec.short)}</div></td>
            <td>${s.n?`<div class="accbar"><span class="b"><i style="width:${Math.round(s.acc*100)}%"></i></span>${s.c}/${s.n}</div>`:`<span class="num-0">not tested</span>`}</td>
            <td>${s.open?`<span class="num-bad">${s.open}</span>`:`<span class="num-0">0</span>`}</td>
            <td>${s.learning?`<span class="num-bad">${s.learning}</span>`:`<span class="num-0">0</span>`}</td>
            <td><button class="btn" data-go="${t.id}" data-tab="${s.open||s.w?"quiz":"cards"}">Drill</button></td></tr>`).join("") +
          `</tbody></table></div>`;
      } else html += `<div class="empty">No weak topics right now. Every topic you have tried is solid.</div>`;
      html += `<p class="solid">${solid.length} topic${solid.length===1?"":"s"} solid · ${untested.length} not tested yet</p></div>`;

      html += `<div><h3>By lecture</h3><div class="cov">` + L.map(l=>{ const s=lecStats(l); return `<button data-go="${l.id}" data-tab="quiz"><span class="cl">${lab(l)} ${esc(l.short)}</span><span class="cs">${s.seen}/${l.quiz.length} tried · ${s.acc===null?"–":Math.round(s.acc*100)+"%"}${s.open?` · <span class="danger">${s.open} to retry</span>`:""}</span></button>`; }).join("") + `</div></div>`;

      if (open.length){
        const sorted = open.slice().sort((a,b)=>(P.hist[b.key].w - P.hist[a.key].w) || (P.hist[b.key].t - P.hist[a.key].t));
        html += `<div><h3>Questions you missed</h3><p class="lede">Your last answer to each of these was wrong. Open one to see what you picked and why the right answer holds.</p><div class="missed">` +
          sorted.map(q=>{ const hh=P.hist[q.key]; return `<details><summary><span class="mq">${esc(q.q)}</span>
            <span class="mm"><span>${lab(q.lec)} · ${esc(q.topic.name)}</span><span class="diff ${q.d}" style="padding:0 6px">${q.d}</span><span>missed ${hh.w}× of ${hh.n}</span></span></summary>
            <div class="body"><div class="yours"><b>You picked</b>${esc(q.o[hh.p]||"")}</div><div class="right"><b>Correct</b>${esc(q.o[0])}</div><div>${esc(q.e)}</div></div></details>`; }).join("") + `</div></div>`;
      }
      html += `<div class="actions" style="justify-content:flex-end"><button class="btn" id="resetAll">Reset all progress</button></div>`;
    }
    const noteKeys = allQs.filter(q=>noteText(q.key).trim() || (N.items[q.key]||{}).ans).map(q=>q.key);
    if (noteKeys.length){
      html += `<div><h3>Your notes and Claude's replies</h3><p class="lede">Every note you've written on a quiz question, newest first. Edit any of them here and ask again.</p><div class="qlist">` +
        noteKeys.slice().sort((a,b)=>((N.items[b]||{}).t||0)-((N.items[a]||{}).t||0)).map(k=>{ const q=qByKey[k]; return `<article class="q" data-k="${k}">
          <div class="q-head"><span class="q-num"><span class="q-src">${lab(q.lec)}</span> · ${esc(q.topic.name)}</span><span class="right-bits"><span class="diff ${q.d}">${q.d}</span></span></div>
          <p class="q-text">${esc(q.q)}</p>
          <div class="expl"><b class="ok">Correct answer</b>${esc(q.o[0])}</div>
          ${noteBlock(q)}</article>`; }).join("") + `</div>` + noteBarHtml(noteKeys) + `</div>`;
    }
    html += `</div>`;
    $("panel").innerHTML = html;
    if ($("noteBar")){ $("noteBar")._keys = noteKeys; bindNoteBar(noteKeys); bindNotes($("panel")); }
    $("panel").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab||"quiz"; store.set("tab",state.tab); selectSet(b.dataset.go); });
    const ra = $("resetAll");
    if (ra) ra.onclick = ()=>{
      if (ra.dataset.confirm!=="1"){ ra.dataset.confirm="1"; ra.textContent="Click again to erase all quiz history and card marks"; ra.classList.add("bad"); setTimeout(()=>{ if(ra.isConnected){ ra.dataset.confirm=""; ra.textContent="Reset all progress"; ra.classList.remove("bad"); } },4000); return; }
      P = blank(); P.resetAt = now(); persist();
      try{ Object.keys(localStorage).filter(k=>k.startsWith("aae:ans:")||k.startsWith("aae:seed:")).forEach(k=>localStorage.removeItem(k)); }catch(e){}
      render();
    };
  }

  // ---------- flashcards ----------
  let fc = null;
  function initFc(S){
    const cards = S.kind==="mix" ? shuffle(S.cards, rng(now())) : S.cards.slice();
    fc = { all:cards, deck:cards, i:0, flipped:false, reviewOnly:false };
  }
  function rebuildDeck(){
    const cur = fc.deck[fc.i];
    const base = fc.reviewOnly ? fc.all.filter(c=>cardState(c)!=="known") : fc.all;
    fc.deck = base;
    const ni = cur ? base.indexOf(cur) : -1;
    fc.i = ni>=0 ? ni : Math.min(fc.i, Math.max(0, base.length-1));
  }
  function renderFc(S){
    if(!fc) initFc(S);
    const total = fc.all.length;
    if (!total){ $("panel").innerHTML = `<div class="empty">No cards here yet. Mark cards “Still learning” or miss a quiz question and the related cards collect in this set.</div>`; return; }
    const nk = fc.all.filter(c=>cardState(c)==="known").length;
    const nl = fc.all.filter(c=>cardState(c)==="learning").length;
    const c = fc.deck[fc.i];
    let cardHtml;
    if(!c){
      cardHtml = `<div class="empty">Every card in this set is marked known. Turn off “Review only unknown” to see them all.</div>`;
    } else {
      const st = cardState(c);
      const tag = st ? `<span class="tag ${st}">${st==="known"?"Known":"Still learning"}</span>` : "";
      const lecLabel = S.kind==="lec" ? ` · ${esc(c.topic.name)}` : ` · ${lab(c.lec)} ${esc(c.topic.name)}`;
      cardHtml = `<article class="card" id="card" tabindex="0" aria-live="polite" aria-label="Flashcard, click to flip">
        <div class="side"><span>${fc.flipped?"Answer":"Term"} · ${fc.i+1} / ${fc.deck.length}${lecLabel}</span>${tag}</div>
        ${fc.flipped
          ? `<div class="answer">${esc(c[1])}</div><div class="why"><b>Why</b>${esc(c[2])}</div>`
          : `<div class="front-text">${esc(c[0])}</div><div class="hint">Click or press Space to flip</div>`}
      </article>`;
    }
    $("panel").innerHTML = `
      <div style="display:grid;gap:12px">
        <div class="fc-bar">
          <div class="counts"><span><span class="dot" style="background:var(--good)"></span>${nk} known</span><span><span class="dot" style="background:var(--bad)"></span>${nl} still learning</span><span><span class="dot" style="background:var(--line)"></span>${total-nk-nl} unmarked</span></div>
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="btn" id="fcShuffle">Shuffle</button>
            <button class="btn" id="fcReview" aria-pressed="${fc.reviewOnly}">Review only unknown</button>
          </div>
        </div>
        <div class="progress" aria-hidden="true"><i style="width:${(nk/total*100).toFixed(1)}%"></i></div>
        ${cardHtml}
        <div class="fc-controls">
          <div class="grp">
            <button class="btn" id="fcPrev" ${!c||fc.i===0?"disabled":""}>← Prev</button>
            <button class="btn primary" id="fcFlip" ${!c?"disabled":""}>${fc.flipped?"Show term":"Flip"}</button>
            <button class="btn" id="fcNext" ${!c||fc.i>=fc.deck.length-1?"disabled":""}>Next →</button>
          </div>
          <div class="grp">
            <button class="btn bad" id="fcLearn" ${!c?"disabled":""}>Still learning</button>
            <button class="btn good" id="fcKnow" ${!c?"disabled":""}>Know it</button>
          </div>
        </div>
        <div class="kbd">Keys: ← → move · Space flip · 1 still learning · 2 know it. “Still learning” cards feed your Weak spots.</div>
      </div>`;
    const card = $("card");
    if (card) card.onclick = ()=>{ if (window.getSelection && String(window.getSelection()).length) return; flip(); };
    $("fcFlip").onclick = flip;
    $("fcPrev").onclick = ()=>move(-1);
    $("fcNext").onclick = ()=>move(1);
    $("fcKnow").onclick = ()=>mark("known");
    $("fcLearn").onclick = ()=>mark("learning");
    $("fcShuffle").onclick = ()=>{ fc.all = shuffle(fc.all, rng(now())); fc.flipped=false; fc.deck=fc.all; rebuildDeck(); fc.i=0; renderFc(S); };
    $("fcReview").onclick = ()=>{ fc.reviewOnly=!fc.reviewOnly; fc.flipped=false; rebuildDeck(); renderFc(S); };
  }
  function flip(){
    if(!fc || !fc.deck[fc.i]) return;
    fc.flipped=!fc.flipped; renderFc(getSet(state.set));
    const card=$("card"); if(card && !matchMedia("(prefers-reduced-motion: reduce)").matches) card.classList.add("flipping");
  }
  function move(d){ const n=fc.i+d; if(n<0||n>=fc.deck.length) return; fc.i=n; fc.flipped=false; renderFc(getSet(state.set)); }
  function mark(v){
    const c = fc && fc.deck[fc.i]; if(!c) return;
    markCard(c, v);
    const wasLast = fc.i>=fc.deck.length-1;
    if (fc.reviewOnly && v==="known"){ fc.deck = fc.all.filter(x=>cardState(x)!=="known"); if(fc.i>=fc.deck.length) fc.i=Math.max(0,fc.deck.length-1); }
    else if(!wasLast) fc.i++;
    fc.flipped=false; renderRail(); renderHead(getSet(state.set)); renderFc(getSet(state.set));
  }

  // ---------- quiz ----------
  let qz = null;
  function initQz(S){
    let seed = store.get("seed:"+S.id, 0);
    if (!seed){ seed = now()%100000 + 1; store.set("seed:"+S.id, seed); }
    let qs;
    if (S.kind==="mix"){
      const r = rng(seed);
      // weight each question by how shaky its topic is, so weak topics come up more often
      const wOf = q=>{ const s=topicStats(q.topic); const h=P.hist[q.key]; return 1 + (h&&h.last===0?3:0) + Math.max(0,s.score)*0.4; };
      const pick = (d,n)=>{ let pool=allQs.filter(q=>q.d===d).map(q=>({q, k: Math.pow(r(), 1/wOf(q))})); pool.sort((a,b)=>b.k-a.k); return pool.slice(0,n).map(x=>x.q); };
      qs = shuffle([...pick("medium",7),...pick("hard",8)], r);
    } else qs = S.quiz.slice();
    const items = qs.map(q=>({ q, order: shuffle([0,1,2,3], rng(hash(q.key)+seed)), pick:null }));
    const saved = store.get("ans:"+S.id, null);
    if (saved && saved.seed===seed) items.forEach(it=>{ if(saved.a[it.q.key]!==undefined) it.pick=saved.a[it.q.key]; });
    qz = { items, filter:"all", seed, id:S.id };
  }
  function saveQz(){ const a={}; qz.items.forEach(it=>{ if(it.pick!==null) a[it.q.key]=it.pick; }); store.set("ans:"+qz.id,{seed:qz.seed,a}); }
  function keepFocus(fn){
    const ae = document.activeElement, fid = ae && ae.id;
    const ss = ae && ae.selectionStart, se = ae && ae.selectionEnd;
    fn();
    if (fid){ const n=document.getElementById(fid); if (n && n!==document.activeElement){ n.focus({preventScroll:true}); if (ss!=null && n.setSelectionRange) try{ n.setSelectionRange(ss,se); }catch(e){} } }
  }
  function noteBarHtml(keys){
    const withText = keys.filter(k=>noteText(k).trim());
    const unsaved = keys.filter(isUnsaved).length;
    const pending = keys.filter(needsReply).length;
    const canAsk = sampleState==="ready";
    const status = replyRunning ? "Claude is replying to your notes…"
      : replyMsg ? esc(replyMsg)
      : !withText.length ? "Type a note or question under any question, then save it here."
      : `${withText.length} note${withText.length===1?"":"s"}${unsaved?` · <span class="danger">${unsaved} unsaved</span>`:" · all saved"}${pending?` · ${pending} awaiting a reply`:""}`;
    return `<div class="notebar" id="noteBar">
      <span class="nb-status">${status}</span>
      <span class="nb-actions">
        <button class="btn" id="nbSave" ${unsaved&&!replyRunning?"":"disabled"}>Save notes</button>
        ${replyRunning?`<button class="btn bad" id="nbStop">Stop</button>`:`<button class="btn primary" id="nbRespond" ${pending&&canAsk?"":"disabled"} title="${canAsk?"Claude answers each note that doesn't have a reply yet":"Claude replies aren't available in this view"}">Respond to notes${pending?` (${pending})`:""}</button>`}
      </span></div>`;
  }
  function bindNoteBar(keys){
    const s=$("nbSave"), r=$("nbRespond"), st=$("nbStop");
    if (s) s.onclick = ()=>{ saveNotes(keys); replyMsg = "Notes saved."; softRender(); };
    if (r) r.onclick = ()=>respond(keys, false);
    if (st) st.onclick = stopReplies;
  }
  function updateNoteBar(){
    const bar = $("noteBar"); if (!bar || !bar._keys) return;
    const keys = bar._keys; const tmp = document.createElement("div"); tmp.innerHTML = noteBarHtml(keys);
    const nb = tmp.firstElementChild; nb._keys = keys; bar.replaceWith(nb); bindNoteBar(keys);
  }
  function noteBlock(q){
    const k = q.key, it = N.items[k];
    const st = isUnsaved(k) ? `<span class="danger">unsaved</span>` : (it && it.text ? "saved" : "");
    return `<div class="note">
      <div class="note-head"><label for="note-${esc(k)}">Your note or question</label><span class="note-st" id="nst-${esc(k)}">${st}</span></div>
      <textarea id="note-${esc(k)}" data-note="${esc(k)}" rows="2" placeholder="What don't you get here? Ask anything about this question.">${esc(noteText(k))}</textarea>
      ${replyHtml(k)}
    </div>`;
  }
  function bindNotes(root){
    root.querySelectorAll("textarea[data-note]").forEach(ta=>{
      ta.oninput = ()=>{
        const k = ta.dataset.note; drafts[k] = ta.value; store.set("noteDrafts", drafts);
        const s = document.getElementById("nst-"+k); if (s) s.innerHTML = isUnsaved(k) ? `<span class="danger">unsaved</span>` : (savedText(k)?"saved":"");
        replyMsg = ""; updateNoteBar();
      };
    });
    root.querySelectorAll("[data-reask]").forEach(b=>b.onclick=()=>respond([b.dataset.reask], true));
  }

  function renderQz(S){ keepFocus(()=>renderQzInner(S)); }
  function renderQzInner(S){
    if(!qz) initQz(S);
    const n = qz.items.length;
    if (!n){ $("panel").innerHTML = `<div class="empty">${S.kind==="missed"?"No missed questions to retry. Anything you get wrong in a quiz shows up here until you answer it correctly.":"This topic is covered by flashcards only; switch to the Flashcards tab."}</div>`; return; }
    const done = qz.items.filter(it=>it.pick!==null);
    const right = done.filter(it=>it.pick===0).length;
    const show = qz.items.filter(it=>qz.filter==="all"||it.q.d===qz.filter);
    const fbtn = (v,label)=>`<button class="btn" data-f="${v}" aria-pressed="${qz.filter===v}">${label}</button>`;
    const counts = d=>qz.items.filter(it=>it.q.d===d).length;
    const resetLabel = S.kind==="mix"?"New mix":(S.kind==="missed"?"Start a new round":"Reset quiz");
    const keys = qz.items.map(it=>it.q.key);
    let html = `<div style="display:grid;gap:14px">
      ${S.kind==="missed"?`<p class="lede" style="margin:0;color:var(--muted)">A correct answer here clears the question from your missed list. Start a new round to drop the ones you fixed.</p>`:""}
      <div class="qz-bar">
        <div class="score"><span>Score <b>${right}</b> / ${done.length} answered</span><span><b>${n-done.length}</b> left</span></div>
        <div class="filters">${fbtn("all","All "+n)}${counts("easy")?fbtn("easy","Easy "+counts("easy")):""}${counts("medium")?fbtn("medium","Medium "+counts("medium")):""}${counts("hard")?fbtn("hard","Hard "+counts("hard")):""}
          <button class="btn" id="qzReset">${resetLabel}</button></div>
      </div>
      <div class="qlist">`;
    show.forEach(it=>{
      const idx = qz.items.indexOf(it)+1;
      const q = it.q, ans = it.pick!==null, hh = P.hist[q.key];
      const cls = ans ? (it.pick===0?"right":"wrong") : "";
      const prior = !ans && hh && hh.w ? `<span class="prior">${hh.last===0?"Missed last time":"Missed "+hh.w+"× before"}</span>` : "";
      html += `<article class="q ${cls}" data-k="${q.key}">
        <div class="q-head"><span class="q-num">Question ${idx} of ${n} · ${S.kind==="lec"?"":`<span class="q-src">${lab(q.lec)}</span> · `}${esc(q.topic.name)}</span><span class="right-bits">${prior}<span class="diff ${q.d}">${q.d}</span></span></div>
        <p class="q-text">${esc(q.q)}</p>
        <div class="opts">${it.order.map((oi,pos)=>{
          let c="", m="";
          if(ans){ if(oi===0){c="correct";m="✓";} else if(oi===it.pick){c="chosen-wrong";m="✗";} else c="dim"; }
          return `<button class="opt ${c}" data-o="${oi}" ${ans?"disabled":""}><span class="let">${"ABCD"[pos]}</span><span>${esc(q.o[oi])}</span><span class="mark">${m}</span></button>`;
        }).join("")}</div>
        ${ans?`<div class="expl"><b class="${it.pick===0?"ok":"no"}">${it.pick===0?(hh&&hh.w?"Fixed":"Correct"):"Not quite · saved to Weak spots"}</b>${it.pick===0?"":"Answer: "+esc(q.o[0])+". "}${esc(q.e)}</div>`:""}
        ${noteBlock(q)}
      </article>`;
    });
    html += `</div>`;
    if (done.length===n){
      const by = d=>{ const a=qz.items.filter(it=>it.q.d===d); return a.length?`${a.filter(it=>it.pick===0).length}/${a.length}`:"–"; };
      const missedTopics = [...new Set(qz.items.filter(it=>it.pick!==0).map(it=>it.q.topic))];
      html += `<div class="summary"><h3>${right} of ${n} correct</h3>
        <div class="sum-grid"><div>Easy<strong>${by("easy")}</strong></div><div>Medium<strong>${by("medium")}</strong></div><div>Hard<strong>${by("hard")}</strong></div></div>
        ${missedTopics.length?`<div style="display:grid;gap:8px"><span style="color:var(--muted);font-size:15px">Topics behind your misses. Click one to drill it.</span><div class="chips">${missedTopics.map(topicChip).join("")}</div></div>`:`<div style="color:var(--muted);font-size:15px">Clean sweep. Nothing from this round was added to Weak spots.</div>`}
        <div class="actions"><button class="btn" data-go="weak">Open Weak spots</button></div></div>`;
    }
    html += noteBarHtml(keys) + `</div>`;
    $("panel").innerHTML = html;
    $("noteBar")._keys = keys; bindNoteBar(keys); bindNotes($("panel"));
    $("panel").querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{ qz.filter=b.dataset.f; renderQz(S); });
    $("panel").querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{ state.tab="quiz"; store.set("tab","quiz"); selectSet(b.dataset.topic); });
    $("panel").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>selectSet(b.dataset.go));
    $("panel").querySelectorAll(".q").forEach(el=>{
      const it = qz.items.find(x=>x.q.key===el.dataset.k);
      el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
        if(it.pick!==null) return;
        it.pick=+b.dataset.o; recordAnswer(it.q, it.pick); saveQz();
        renderRail(); renderHead(S); renderQz(S);
        const again=document.querySelector(`.q[data-k="${it.q.key}"] .opt`); again && again.focus({preventScroll:true});
        // finishing the quiz is the "done" moment: save notes and have Claude reply to any that are waiting
        if (qz.items.every(x=>x.pick!==null) && sampleState==="ready" && keys.some(needsReply)) respond(keys, false);
      });
    });
    $("qzReset").onclick = (ev)=>{
      const b=ev.currentTarget;
      if (done.length && done.length<n && b.dataset.confirm!=="1"){ b.dataset.confirm="1"; b.textContent="Click again to confirm"; setTimeout(()=>{ if(b.isConnected){ b.dataset.confirm=""; b.textContent=resetLabel; } },3000); return; }
      store.set("seed:"+S.id, now()%100000 + 1); store.set("ans:"+S.id, null); qz=null; replyMsg=""; render(); window.scrollTo({top:$("main").offsetTop-10});
    };
  }

  // ---------- tabs, keys, render ----------
  function setTab(t){ state.tab=t; store.set("tab",t); render(); }
  $("tab-cards").onclick=()=>setTab("cards");
  $("tab-quiz").onclick=()=>setTab("quiz");
  document.addEventListener("keydown", e=>{
    if (state.tab!=="cards" || !fc || getSet(state.set).kind==="dash") return;
    if (e.target.closest && e.target.closest("input,textarea,select,summary")) return;
    if (e.key==="ArrowRight"){ move(1); e.preventDefault(); }
    else if (e.key==="ArrowLeft"){ move(-1); e.preventDefault(); }
    else if (e.key===" " && e.target.tagName!=="BUTTON"){ flip(); e.preventDefault(); }
    else if (e.key==="1") mark("learning");
    else if (e.key==="2") mark("known");
  });

  function render(){
    const S = getSet(state.set) || getSet("weak");
    renderRail(); renderHead(S);
    $("tabs").hidden = S.kind==="dash";
    $("tab-cards").setAttribute("aria-selected", state.tab==="cards");
    $("tab-quiz").setAttribute("aria-selected", state.tab==="quiz");
    if (S.kind==="dash") renderDash();
    else if (state.tab==="cards") renderFc(S); else renderQz(S);
  }
  // re-render after a sync from another device without disturbing an in-progress quiz or card
  function softRender(){
    const S = getSet(state.set) || getSet("weak");
    renderRail(); renderHead(S);
    if (S.kind==="dash") renderDash();
    else if (state.tab==="quiz" && qz) renderQz(S);
    else if (fc) renderFc(S);
  }
  render();
  if (window.innerWidth<=820){ const a=document.querySelector('.lec-btn[aria-current="true"]'); a && a.scrollIntoView({inline:"center",block:"nearest"}); }
})();
</script>

</body></html>
