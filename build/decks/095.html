ues. Testing those (as in CART's cost-complexity pruning) tunes $\\alpha$ to arbitrary precision.","x":"Treating $\\alpha$ like CART's `cp` path makes tuning exact and cheap.","bk":true},{"s":18,"t":"q","f":"How does IAI fit Optimal Trees by default (Rec 5 slide 36)?","b":"By local search (Book Algorithm 8.1), not the MIO: it keeps the MIO's objective, restarts from many trees (CART on random feature subsets) and keeps the best local optimum.","x":"The MIO is the definition; local search with restarts is the practical solver.","bk":false},{"s":19,"t":"term","f":"True discovery rate (synthetic trees)","b":"Proportion of the ground-truth tree's splits that appear in the learned tree.","x":"TDR measures how much of the true structure is recovered; it rewards finding real splits.","bk":false},{"s":19,"t":"term","f":"False discovery rate (synthetic trees)","b":"Proportion of the learned tree's splits that are not in the ground-truth tree.","x":"FDR measures spurious structure; lower FDR means the tree's splits can be trusted for interpretation.","bk":false},{"s":19,"t":"term","f":"ORT","b":"Optimal Regression Trees: Optimal Trees with a constant prediction in each leaf.","x":"ORT is the regression version of OCT: same splits and routing, a constant per leaf instead of a class.","bk":false},{"s":19,"t":"term","f":"ORT-L","b":"Optimal Regression Trees with a linear regression in each leaf.","x":"Linear leaves let a shallow tree capture trends within each region, combining piecewise structure with regression.","bk":false},{"s":19,"t":"term","f":"OST","b":"Optimal Survival Trees: a survival model in each leaf.","x":"The leaf model is swapped for a survival model, keeping the tree's interpretable partition.","bk":false},{"s":19,"t":"term","f":"OCT-L","b":"Optimal Classification Trees with a logistic regression in each leaf.","x":"Logistic leaves give a probability that varies with $x$ inside each region instead of one class per leaf.","bk":false},{"s":19,"t":"term","f":"ciTBI","b":"Clinically important traumatic brain injury; target of the PECARN case study (376 of 42,000 children, under 1%).","x":"ciTBI is rare (under 1%), so missing one is the costly error and specificity at fixed sensitivity is the right metric.","bk":false},{"s":19,"t":"q","f":"Main findings of the synthetic OCT vs CART experiments (Lec 9 slide 49).","b":"- OCT matches the ground-truth structure much more closely.\n- The gap grows as the problem gets harder ($n\\downarrow$, $p\\uparrow$).\n- OCT stays stronger under very large feature or label noise.\n- Small gains in true discovery, significant reductions in false discovery ⇒ better for interpretation.","x":"Lower FDR is the key interpretability argument: OCT's splits are more likely to be real.","bk":false},{"s":19,"t":"q","f":"Real-world OCT benchmark: setup and headline numbers.","b":"60 UCI datasets ($n$ 50–245,000, $p$ 2–500, $K$ 2–10), 75/25 train/test, repeated 5 times. Average accuracy gain over CART: **1.3%** for OCT (\"optimization edge\"), **3.9%** for OCT-H (\"optimization + hyperplanes\") (Lec 9 slide 76; slide 59 rounds OCT to 1%).","x":"OCT-H's 3.9% gain is roughly triple OCT's 1.3%, the extra coming from hyperplane splits.","bk":false},{"s":19,"t":"q","f":"How do OCT-H, RF and XGBoost compare across depth (Lec 9 slide 56)?","b":"XGBoost ≈ 0.84–0.86 at every depth. OCT-H rises from ≈0.75 (depth 1) to ≈0.86 by depth 3–4 and stays level with or slightly above XGBoost. RF ≈ OCT ≈ 0.84 at depth 10; CART lowest (≈0.83). State-of-the-art accuracy from a single tree.","x":"A single OCT-H tree at depth 3–4 matches boosted ensembles, the accuracy-interpretability tradeoff the course wants to break.","bk":false},{"s":19,"t":"q","f":"Interpretability comparison on Lec 9 slide 53.","b":"CART: 98.3% test, depth 7, 15 splits. OCT: 98.3% at depth 4 with 7 splits (about half the size), or 99.1% at depth 6 with 12 splits. Same accuracy with a much smaller tree, or better accuracy at similar size.","x":"The same accuracy from a tree half the size is an interpretability win even without an accuracy gain.","bk":false},{"s":19,"t":"q","f":"PECARN, children under 2: CART vs OCT.","b":"CART: 5,132 CT scans (47.9% of patients), 1 ciTBI missed. OCT: 2,856 scans (26.6%), 1 missed. Specificity up 20–25 points with the same sensitivity. Matters most for pre-verbal children, who face the highest radiation risk.","x":"Halving scans at the same sensitivity matters most for under-2s, who face the highest radiation risk.","bk":false},{"s":19,"t":"q","f":"PECARN, children 2 and older: CART vs OCT.","b":"CART: 13,928 CT scans (43.9%), 8 ciTBI missed. OCT: 11,098 scans (35.0%), 4 missed. Misses halved and specificity up (slide: 5–10%; the tables give +10.4 points train, +3.6 test).","x":"For older children OCT both cuts scans and halves misses, a gain on both sides of the tradeoff.","bk":false},{"s":19,"t":"q","f":"Why is PECARN a good real-world test of OCT?","b":"CART trees (Kuppermann et al., Lancet 2009) are already current medical practice and the data were already collected, so the comparison swaps only CART for OCT in the same pipeline. Missing a ciTBI is unacceptable and CT radiation causes about 1 lethal malignancy per 1,000–5,000 children, so specificity at fixed sensitivity is the metric.","x":"Only the learner changes, so any difference in outcomes is attributable to optimization versus greedy.","bk":false},{"s":19,"t":"q","f":"ORT MIO (Rec 5): what is removed and added relative to OCT?","b":"Kept: splits, $d_t\\le d_{p(t)}$, routing, leaf size. Removed: $c_{kt}$, $N_{kt}$, $N_t$, $L_t$ and their constraints. Added: leaf value $\\beta_{0t}$, prediction $f_i$, loss $L_i\\ge f_i-y_i$, $L_i\\ge y_i-f_i$ (or $L_i\\ge(f_i-y_i)^2$). Objective $\\frac1{\\hat L}\\sum_iL_i+\\alpha\\sum_td_t$, $\\hat L$ = loss of the best single constant.","x":"Only the leaf part of the MIO changes; the skeleton, splits and routing carry over unchanged.","bk":false},{"s":19,"t":"q","f":"How does ORT linearize $f_i=\\sum_t\\beta_{0t}z_{it}$?","b":"It is a product of variables, so use big-M: $-M(1-z_{it})\\le f_i-\\beta_{0t}\\le M(1-z_{it})$ for all $i,t$. $z_{it}=1$ forces $f_i=\\beta_{0t}$; $z_{it}=0$ leaves it free.","x":"Standard big-M pattern: when $z_{it}=1$ the pair pins $f_i$ to the leaf value; when $z_{it}=0$ the pair is slack.","bk":false},{"s":19,"t":"q","f":"ORT-L: prediction constraint and penalty (Rec 5 slide 45).","b":"When $z_{it}=1$: $f_i=\\beta_t^Tx_i+\\beta_{0t}$ (linear, since $x_i$ is data), via the same big-M pair. Objective adds $\\lambda\\sum_{t\\in\\mathcal L}\\|\\beta_t\\|_1$, so each leaf fits a lasso. Book (11.1) uses an $\\ell_0$ version with binaries $r_{jt}$.","x":"$x_i$ is data, so $\\beta_t^Tx_i$ is linear in $\\beta_t$ and the model stays a linear MIO (plus the 1-norm, which linearizes).","bk":false},{"s":19,"t":"q","f":"What does “a 1% accuracy gain” mean in practice, per Lec 9?","b":"The point of the PECARN study: swapping CART for OCT cut CT scans in under-2s from 47.9% to 26.6% of patients with no extra missed injuries, i.e. thousands of avoided scans and radiation exposures.","x":"A 1% average accuracy gain hides large practical effects when the decision is high-stakes and frequent.","bk":false},{"s":19,"t":"q","f":"OCT at depth 4 vs CART with no depth limit.","b":"OCT at maximum depth 4 achieves about the same accuracy as unrestricted CART, so the same performance with much less tree complexity.","x":"Optimization buys model simplicity: a shallower tree matches the accuracy of an unrestricted greedy tree.","bk":true},{"s":19,"t":"q","f":"Name the leaf-model extensions of Optimal Trees in Lec 9 and the prescriptive one.","b":"Constant ⇒ ORT; linear regression ⇒ ORT-L; survival model ⇒ OST; logistic regression ⇒ OCT-L; a decision in each leaf ⇒ Optimal Policy Trees (Lec 11).","x":"Changing what lives in the leaves gives a family of models built on the same tree machinery, including prescriptive policy trees.","bk":false},{"s":19,"t":"q","f":"Synthetic experiment setup (Lec 9 slide 43).","b":"Generate training and test data from a \"ground truth\" tree; fit CART and OCT on training data; compare to the truth on test data via out-of-sample accuracy, true discovery rate and false discovery rate. Repeated 400 times per setting; vary $n$, $p$, restarts, feature noise, label noise.","x":"Knowing the true tree lets you test structure recovery, not just accuracy, which is what interpretability needs.","bk":false},{"s":19,"t":"q","f":"PECARN under 2, test set: CART vs OCT specificity from the confusion matrices. (derived)","b":"CART test: CT on 995 of 2,127 non-ciTBI ⇒ specificity $1132/2127=53.2\\%$. OCT test: CT on 459 ⇒ $1668/2127=78.4\\%$. Both catch all 17 ciTBI (sensitivity 100%).","x":"Specificity is the share of no-injury children correctly spared a scan; OCT gains about 25 points at the same sensitivity.","bk":false},{"s":19,"t":"q","f":"Lec 9 slide 57: what does an interpretable model with competitive accuracy make possible?","b":"Debugging models when they fail, using domain experts' knowledge, seeing which parts of the model struggle and engineering features for them, tracking how models change over time or across datasets (stability analysis), and interpretable clustering for exploring new data.","x":"Once accuracy no longer forces a black box, interpretability brings practical benefits beyond explaining predictions.","bk":false},{"s":19,"t":"q","f":"Inside local search for ORT/ORT-L, how is each leaf fit (Rec 5 slide 45)?","b":"Constant leaves: the mean (squared loss) or the median (absolute loss) of the leaf's points. Linear leaves: a lasso on the leaf's points (Book §11.2).","x":"Given the splits, each leaf's fit is a small closed-form or convex problem, the same idea that makes OCT local search fast.","bk":false},{"s":20,"t":"term","f":"Full-information optimal decision $z^*(x)$","b":"$z^*(x)\\in\\arg\\min_{z\\in\\mathcal Z}\\mathbb E[c(z;Y)\\mid X=x]$ under the true conditional distribution. Uses $X$ fully but still faces residual uncertainty in $Y$.","x":"This is the target every data-driven prescription approximates: the best you can do knowing $X$, but $Y$ is still random given $X$.","bk":false},{"s":20,"t":"term","f":"Sample average approximation (SAA)","b":"$\\hat z^{SAA}_N\\in\\arg\\min_{z\\in\\mathcal Z}\\frac1N\\sum_{i=1}^Nc(z;y^i)$. Accounts for uncertainty, ignores the auxiliary data $X$.","x":"SAA treats every past demand as equally relevant to today, which is exactly the waste when $X$ carries information.","bk":false},{"s":20,"t":"term","f":"Point-prediction-driven decision","b":"$\\hat z^{\\text{point-pred}}_N(x)\\in\\arg\\min_{z\\in\\mathcal Z}c(z;\\hat m_N(x))$ with $\\hat m_N(x)\\approx\\mathbb E[Y\\mid X=x]$ (e.g. a random forest). Accounts for $X$, ignores uncertainty.","x":"Plugging in a single forecast throws away the spread of $Y$; with a cost nonlinear in $Y$ the spread changes the best decision.","bk":false},{"s":20,"t":"term","f":"Predictive prescription","b":"$\\hat z_N(x)\\in\\arg\\min_{z\\in\\mathcal Z}\\sum_{i=1}^Nw^i_N(x)\\,c(z;y^i)$: a weighted SAA whose weights, from an ML method, measure how relevant past observation $i$ is to today's $x$.","x":"The ML model only decides which past scenarios resemble today; the optimization still averages cost over scenarios, so uncertainty is kept.","bk":false},{"s":20,"t":"term","f":"kNN prescription weights","b":"$w^i_N(x)=\\frac1k\\mathbb 1\\{x^i\\text{ is a }k\\text{-nearest neighbor of }x\\}$: SAA over the $k$ nearest past observations.","x":"The simplest relevance measure: today looks like its $k$ closest past observations, so solve SAA on those only.","bk":false},{"s":20,"t":"term","f":"CART prescription weights","b":"$w^i_N(x)=\\mathbb 1\\{\\mathcal R(x^i)=\\mathcal R(x)\\}/\\lvert\\{j:\\mathcal R(x^j)=\\mathcal R(x)\\}\\rvert$: uniform over training points in $x$'s leaf, 0 elsewhere.","x":"Leaves act as bins: past observations in the same bin as $x$ are treated as draws from today's conditional distribution.","bk":false},{"s":20,"t":"term","f":"Random forest prescription weights","b":"Average over the $T$ trees of each tree's CART weights: $\\frac1T\\sum_t\\mathbb 1\\{R^t(x^i)=R^t(x)\\}/\\lvert\\{j:R^t(x^j)=R^t(x)\\}\\rvert$.","x":"Averaging many trees' bins gives smoother weights than one tree, which is why RF was best at nearly every $N$ in the shipment example.","bk":false},{"s":20,"t":"term","f":"Binning rule $\\mathcal R(x)$","b":"$\\mathcal R(x)=(j\\text{ s.t. }x\\in R_j)$: the index of the tree region (leaf) containing $x$.","x":"A trained tree is a partition of feature space; $\\mathcal R$ just names the cell $x$ falls in, so it can define weights.","bk":false},{"s":20,"t":"term","f":"Coefficient of prescriptiveness $P$","b":"$P=\\dfrac{\\min_z\\sum_ic(z;y^i)-\\sum_ic(\\hat z_N(x^i);y^i)}{\\min_z\\sum_ic(z;y^i)-\\sum_i\\min_zc(z;y^i)}\\le1$: fraction of the way from the best data-poor (SAA) decision to perfect foresight.","x":"An $R^2$ for decisions: 0 means no better than ignoring $X$, 1 means as good as knowing the future.","bk":false},{"s":20,"t":"term","f":"Perfect-foresight cost","b":"$\\sum_i\\min_zc(z;y^i)$: the cost if each $y^i$ were known before deciding. An unattainable lower bound; differs from the full-information optimum, which still faces uncertainty.","x":"Perfect foresight removes even the uncertainty $X$ cannot explain, so it is a ceiling nobody reaches; the full-information optimum is the realistic limit.","bk":false},{"s":20,"t":"term","f":"Right-censored demand","b":"Only sales $U=\\min\\{Y,V\\}$ are seen ($V$ = on-hand inventory). When $U=V$ (sold out) demand is only known to be $\\ge V$.","x":"A sold-out shelf hides the unmet demand, so raw sales understate demand exactly for the hottest titles.","bk":false},{"s":20,"t":"term","f":"SAA++","b":"Media benchmark: SAA computed separately by weeks on the market (uses demand-decay information); a handicap in SAA's favor.","x":"Giving SAA the weeks-on-market information makes it a tougher benchmark, so the reported gap is not inflated by a weak baseline.","bk":true},{"s":20,"t":"term","f":"Nadaraya–Watson kernel weights","b":"$w^i_N(x)=K((x^i-x)/h_N)/\\sum_jK((x^j-x)/h_N)$ with kernel $K$ and bandwidth $h_N$ (naive, Epanechnikov, tri-cubic kernels); the recursive variant uses per-point bandwidths.","x":"A smooth version of kNN: closer past points count more. Like kNN it weighs every dimension, so it degrades as $d_x$ grows.","bk":true},{"s":20,"t":"q","f":"Three primitives of the general problem in Lec 10 (p. 5).","b":"Data $y^1,\\dots,y^N$ on quantities of interest $Y$ (demands); data $x^1,\\dots,x^N$ on associated covariates $X$ (recent sales, search attention); a decision $z\\in\\mathcal Z$ that minimizes uncertain cost $c(z;Y)$ after observing $X=x$.","x":"Every Lec 10 method is a different way of combining these three: scenarios $y^i$, context $x^i$, and a cost to minimize.","bk":false},{"s":20,"t":"q","f":"What does SAA get wrong, and what does point prediction get wrong?","b":"SAA accounts for uncertainty but not the auxiliary data $X$. Point prediction accounts for $X$ but not the remaining uncertainty: it optimizes $c(z;\\mathbb E[Y\\mid x])$ instead of $\\mathbb E[c(z;Y)\\mid x]$, which differ whenever $c$ is nonlinear in $Y$ (derived).","x":"The two classical fixes each drop half of the problem; predictive prescriptions keep both covariates and uncertainty.","bk":false},{"s":20,"t":"q","f":"State the tractability theorem for predictive prescriptions and why it holds.","b":"If $c(z;y)$ is convex in $z$ and $\\mathcal Z$ is convex, $\\hat z_N(x)$ can be computed in polynomial time. The weights are nonnegative, so $\\sum_iw^ic(z;y^i)$ is a nonnegative combination of convex functions: a convex problem (reason derived).","x":"kNN, CART and RF weights are nonnegative, so the weighted SAA inherits convexity from $c$: the ML step adds no computational burden.","bk":false},{"s":20,"t":"q","f":"Write the shipment planning cost $c(z;y)$ (Lec 10 p. 12).","b":"$$c(z;y)=p_1\\sum_iz_i+\\min_{t,s}\\Big(p_2\\sum_it_i+\\sum_i\\sum_jc_{ij}s_{ij}\\Big)$$\ns.t. $t_i\\ge0$, $s_{ij}\\ge0$, $\\sum_is_{ij}\\ge y_j\\ \\forall j$, $\\sum_js_{ij}\\le z_i+t_i\\ \\forall i$. Stock $z_i$ at warehouse $i$ in advance at $p_1$; after demand, ship $s_{ij}$ at $c_{ij}$ and produce $t_i$ last-minute at $p_2>p_1$.","x":"Commit $z$ now at the cheap price, fix shortfalls later at the expensive one; the recourse makes the cost nonlinear in $y$.","bk":false},{"s":20,"t":"q","f":"Shipment example (4 warehouses, 12 locations): how do SAA and point prediction perform as $N$ grows?","b":"Both plateau above the full-information optimum (≈1,300): SAA at ≈1,700 because it ignores $X$; point prediction at ≈2,400, **worse than SAA**, because it plans for the mean as if it were certain.","x":"More data can't help SAA (it never looks at $X$) or point prediction (its error is structural: planning for the mean as if certain).","bk":false},{"s":20,"t":"q","f":"Which predictive prescriptions win in the shipment example, and which are robust to extra dimensions?","b":"kNN, CART and RF converge toward $z^*(x)$; RF is best at nearly every $N$ and no worse than SAA at small $N$; kernel regression is slowest. Adding uninformative covariates ($d_x$ from 3 to 259): kNN and kernel methods degrade, **CART and RF stay flat** because trees pick out the informative features.","x":"Trees choose which features to split on, so noise dimensions rarely enter the bins; kNN and kernel distances weigh every dimension.","bk":false},{"s":20,"t":"q","f":"When does plain SAA beat the covariate-based prescriptions?","b":"Only with very little data ($N\\lesssim64$ in the shipment example); past that, the weighted prescriptions use $X$ and do better, eventually reaching $z^*(x)$.","x":"With few samples, conditioning on $X$ leaves too few relevant scenarios; SAA's pooled average has lower variance.","bk":true},{"s":20,"t":"q","f":"Interpret $P$: its range, the value for SAA, and what $P<0$ means.","b":"$P\\le1$, tending to $[0,1]$ as data grows. SAA has $P=0$ by construction; perfect foresight would be 1. $P<0$ out of sample means the prescription is worse than ignoring $X$ (e.g. kernel regression at small $N$).","x":"Like out-of-sample $R^2$, $P$ goes negative when a method fits noise; SAA is the zero line by construction.","bk":false},{"s":20,"t":"q","f":"SAA cost 1,700, your prescription 1,400, perfect foresight 1,100. Compute $P$.","b":"$P=(1700-1400)/(1700-1100)=0.5$: halfway from the data-poor decision to perfect foresight (derived example).","x":"Numerator: savings over SAA. Denominator: total savings perfect foresight would give.","bk":false},{"s":20,"t":"q","f":"Why do the best prescriptions in the shipment example reach $P\\approx0.46$, not 1?","b":"Even the full-information optimum faces residual uncertainty after observing $X$; 0.46 is the share of the SAA-to-perfect-foresight gap that knowledge of $X$ can close in that problem.","x":"The ceiling on $P$ is set by how much of $Y$ is predictable from $X$, not by the algorithm.","bk":false},{"s":20,"t":"q","f":"How does $P$ behave if $X$ is independent of $Y$, and if $Y$ is a function of $X$?","b":"Independent: $P\\to0$ as $N$ grows (point prediction may go negative). $Y$ a function of $X$: $P\\to1$, and even point prediction approaches 1, since no uncertainty remains given $X$.","x":"These two extremes calibrate $P$: no information in $X$ means no gain over SAA; complete information means even point prediction is perfect.","bk":true},{"s":20,"t":"q","f":"Contrast $P$ with $R^2$.","b":"$R^2$: share of the way from the sample-mean prediction to perfect prediction (predictive content of $X$). $P$: share of the way from the SAA decision to the perfect-foresight decision (prescriptive content of $X$ and of the prescription), measured in cost.","x":"Same structure (baseline, ceiling, fraction of the gap closed), but $P$ is measured in decision cost, not squared prediction error.","bk":false},{"s":20,"t":"q","f":"Write the media distributor's problem per location $r$ and period $t$.","b":"$$\\max\\ \\mathbb E\\Big[\\sum_{j=1}^d\\min\\{Y_j,z_{trj}\\}\\ \\Big|\\ X=x_{tr}\\Big]\\ \\ \\text{s.t.}\\ \\ \\sum_jz_{trj}\\le K_r,\\ z_{trj}\\ge0$$\nMaximize expected units sold subject to the location's capacity $K_r$; $Y_j$ demand for title $j$, $x_{tr}$ auxiliary data.","x":"Each location-week is a capacitated multi-product newsvendor: shelf space $K_r$ binds, so overstocking one title costs sales of another.","bk":false},{"s":20,"t":"q","f":"Media case: which public signals predicted first-week sales, and what's the lesson?","b":"Correlations: US box office gross $\\rho=0.32$, IMDb rating $\\rho=0.02$, number of IMDb votes $\\rho=0.25$. Attention (votes, search volume) predicts sales; quality ratings barely do. Local Google search volume was the top RF feature.","x":"Sales follow buzz, not acclaim; that is why harvested search volume mattered more than ratings.","bk":false},{"s":20,"t":"q","f":"Media case: prediction and prescription performance.","b":"RF demand prediction for new titles: out-of-sample $R^2=0.67$. RF-weighted prescription: out-of-sample $P=0.88$ (Book: 150-week live backtest, ~20,000 locations). By city: Munich 0.89, Paris 0.90, Waterloo 0.85, The Hague 0.86.","x":"A moderate $R^2$ (0.67) still produced a high $P$ (0.88): good decisions need relevant scenarios, not perfect point forecasts.","bk":false},{"s":20,"t":"q","f":"Why does the media application need a censoring correction?","b":"Data are sales $U=\\min\\{Y,V\\}$, not demand. When a title sells out, true demand is only known to be $\\ge V$, so treating sales as demand underestimates demand for exactly the hot titles. The weights are adjusted for right-censoring (Kaplan–Meier style, Lec 10 p. 33).","x":"Without correction the weights would read 'sold out at $V$' as 'demand $=V$', biasing orders down on the best sellers.","bk":false},{"s":20,"t":"q","f":"Newsvendor $c(z;y)=0.5z-\\min(z,y)$, 5 nearest neighbors' demands 60, 70, 80, 90, 200. Prescription vs point prediction?","b":"Weighted SAA ⇒ weighted quantile at $(r-d)/r=0.5$, the median: $z=80$, average cost $-34$. Point prediction: mean 100 ⇒ $z=100$, average cost $-30$. The skewed neighbor inflates the mean; the prescription hedges.","x":"The newsvendor optimum is a quantile, not a mean; a skewed neighbor drags the mean but not the median.","bk":false},{"s":20,"t":"q","f":"Two other prescriptive methods in Ch. 13 besides weighted SAA.","b":"**Predict the objective**: regress $c(z;y)$ on $x$ in an RKHS; by the Representer Theorem $\\hat h(z,x_0)=K(X,x_0)^T(K+\\lambda nI)^{-1}c(z;Y)$, then minimize over $z$. **Predict the optimizer**: learn $z(\\cdot)$ directly by minimizing $\\frac1n\\sum_ic(z(x_i);y_i)$ + RKHS penalty. In the newsvendor test the optimizer method converged fastest.","x":"Instead of weighting past scenarios you can learn the cost surface, or learn the decision rule directly; both are kernel regressions.","bk":true},{"s":20,"t":"q","f":"Why does a CART-based prescription keep interpretability?","b":"All $x$ in the same leaf get the same weights and hence the same decision, so the prescription is a tree of if-then rules with one decision per leaf (Book §13.2). Ch. 14 builds the tree to optimize the decision directly.","x":"One decision per leaf turns the prescription into readable if-then rules, which Ch. 14 then optimizes directly.","bk":false},{"s":20,"t":"term","f":"Newsvendor predictive prescription = weighted quantile","b":"For $c(z;y)=dz-r\\min(z,y)$ with $d<r$ and no capacity, $\\arg\\min_z\\sum_iw^ic(z;y^i)$ is the weighted $(r-d)/r$ quantile of the $y^i$: the smallest $y^{(j)}$ whose cumulative weight reaches $(r-d)/r$ (derived; Book §13.7 calls each uncapacitated product problem a quantile regression).","x":"Each extra unit costs $d$ and earns $r$ only if demand exceeds it, so stop where the weighted chance of selling it, $P(Y>z)$, falls to $d/r$.","bk":false},{"s":20,"t":"q","f":"CART prescription worked example (Lec 10 pp. 19–22).","b":"10 training points; root $x_1\\le5$ sends $\\{1,4,5\\}$ left; the right child splits on $x_2$ into leaves $\\{3,8,10\\}$ and $\\{2,6,7,9\\}$. A new $x$ in the last leaf puts weight $\\tfrac14$ on $y^2,y^6,y^7,y^9$ and 0 elsewhere, so $\\hat z^{CART}_N(x)$ is SAA over those four demand vectors. (Slides list $(x^2,y^2)$ twice and show the $x_2$ threshold as 2 on p. 21 but 1 on p. 22; neither matters.)","x":"The tree is trained to predict $Y$, then its leaves are reused only to choose which past scenarios count.","bk":false},{"s":20,"t":"q","f":"Equivalent 'gap' form of the coefficient of prescriptiveness.","b":"$P=1-\\dfrac{R(\\hat z_N)-R^{\\text{PF}}}{R(\\hat z^{SAA})-R^{\\text{PF}}}$, with $R$ the total cost over the sample and PF perfect foresight: one minus the remaining gap over the total gap. The book computes it on held-out data.","x":"Reads exactly like $R^2=1-\\text{SSE}/\\text{SST}$: what's left over what there was to explain.","bk":false},{"s":20,"t":"q","f":"Why does the media distributor maximize units sold rather than profit?","b":"Cost is mostly content production, so the binding constraint is retail shelf capacity: overstocking one title costs the sales of another that sold out. Hence $\\max\\mathbb E[\\sum_j\\min\\{Y_j,z_{trj}\\}\\mid x_{tr}]$ s.t. $\\sum_jz_{trj}\\le K_r$ (Book §13.7).","x":"When the scarce resource is shelf space, units sold is the right currency; per-unit margins barely differ across titles.","bk":true},{"s":21,"t":"term","f":"Policy learning problem","b":"Features $x\\in\\mathbb R^p$, $m$ mutually exclusive treatments, a real-valued outcome; learn $\\pi(x)$ that assigns the treatment optimizing the outcome for new $x$.","x":"Unlike classification, the label (best treatment) is never observed; only one outcome per observation is.","bk":false},{"s":21,"t":"term","f":"Counterfactual outcome","b":"The outcome observation $i$ would have had under a treatment it did not receive; never observed in observational data.","x":"The fundamental problem of causal inference: each unit reveals only one of its potential outcomes.","bk":false},{"s":21,"t":"term","f":"Treatment assignment bias","b":"Treatment depends on features related to the outcome (e.g. invasive drugs go to sicker patients), so groups receiving different treatments aren't comparable.","x":"When sicker patients get the stronger drug, raw comparisons confuse the drug's effect with the patients' baseline risk.","bk":false},{"s":21,"t":"term","f":"Propensity score $p_{it}$","b":"Probability that observation $i$ receives treatment $t$ given $x_i$; estimated by a classifier predicting $T$ from $X$.","x":"It measures how expected the observed treatment was for that patient; rare assignments carry the most information.","bk":false},{"s":21,"t":"term","f":"Direct method (DM)","b":"$\\Gamma_{it}=f_t(x_i)$, where $f_t$ is trained only on observations that received treatment $t$.","x":"A separate model per arm forces the comparison across treatments, but each model only sees its own, possibly unrepresentative, population.","bk":false},{"s":21,"t":"term","f":"Inverse propensity weighting (IPW)","b":"$\\Gamma_{it}=\\mathbb 1\\{T_i=t\\}\\cdot\\dfrac{y_i}{p_{it}}$: reweights observed outcomes so treatment populations look alike.","x":"Dividing by the propensity reweights each arm to look like the whole population, the same idea as survey weighting.","bk":false},{"s":21,"t":"term","f":"Doubly robust (DR) estimator","b":"$\\Gamma_{it}=f_t(x_i)+\\mathbb 1\\{T_i=t\\}\\cdot\\dfrac{1}{p_{it}}\\big(y_i-f_t(x_i)\\big)$: DM prediction plus an IPW correction of its error.","x":"Start from the model's guess and add back the propensity-weighted error on the observed arm; if either piece is right, the bias cancels.","bk":false},{"s":21,"t":"term","f":"Reward estimation","b":"Using DM, IPW or DR to turn observational data $(X,T,Y)$ into a complete $n\\times m$ reward matrix $\\Gamma$.","x":"Once $\\Gamma$ is complete, policy learning is a deterministic optimization over a known table.","bk":false},{"s":21,"t":"term","f":"Cross-fitting","b":"Split data into $k$ folds; produce propensity/outcome predictions for each fold from models trained on the other folds, so all estimates are out-of-sample.","x":"Same mechanics as cross-validation, but the goal is honest plug-in predictions, not hyperparameter selection.","bk":false},{"s":21,"t":"term","f":"Causal inference","b":"Capturing the true causal dependence of the outcome on the treatment (Imbens shared the 2021 economics Nobel for work in this field).","x":"Prediction asks what $y$ will be; causal inference asks what $y$ would be if we changed $t$.","bk":false},{"s":21,"t":"q","f":"Why not just average outcomes per treatment and rank treatments?","b":"No personalization (one treatment for everyone), and vulnerable to biases in observational data: who got which treatment depended on their features (Lec 11 slide 8).","x":"A single ranking ignores that the best treatment differs by patient, and the averages themselves are confounded.","bk":false},{"s":21,"t":"q","f":"COVID ICU data: 22 never-ventilated patients all survived vs 76% of 109 ventilated; survivors ventilated 14 days vs 8.5 for non-survivors. Why are both naive readings wrong?","b":"Ventilation went to the sickest patients (confounding by indication), so lower survival reflects prognosis, not treatment. Patients who died early couldn't accumulate ventilator days (survivorship / reverse causation), so longer ventilation doesn't cause survival.","x":"Both readings mistake who got treated (and who lived long enough) for what the treatment does.","bk":false},{"s":21,"t":"q","f":"Why does training one model $f(x,t)$ on $[X\\ T]$ fail to capture the effect of $t$?","b":"No guarantee the model learns the true dependence of $y$ on $t$: model class (e.g. RF may rarely split on $t$), regularization bias (shrinks the dependence on $t$), overfitting (exaggerates it) (Chernozhukov et al. 2018).","x":"Nothing in a predictive loss forces the $t$-dependence to be causal; a flexible model may ignore $t$ or overreact to it.","bk":false},{"s":21,"t":"q","f":"When does the direct method work, and what is its weakness?","b":"If and only if each $f_t$ is highly accurate. Each $f_t$ is trained only on the subpopulation that got $t$, so it may generalize poorly to others: extremely susceptible to treatment assignment bias. Low variance.","x":"DM extrapolates each arm's model to patients unlike those who received that arm, so assignment bias becomes prediction error.","bk":false},{"s":21,"t":"q","f":"Give the slide example of treatment assignment bias in the direct method.","b":"A more invasive medication is given to sicker patients. For the same $x$, the model trained on treated patients may predict worse outcomes than the untreated model, not because the drug fails but because its population was sicker to begin with (slide 19).","x":"The treated model is right about the treated population, but that population differs, so comparing arms compares patients, not drugs.","bk":false},{"s":21,"t":"q","f":"What does IPW correct, and why is it high variance?","b":"It upweights outcomes where the observed treatment was unlikely (a treatment usually given to the sick, seen on a healthy patient), correcting assignment bias. Dividing by small $p_{it}$ makes estimates very sensitive to errors in the propensity estimates.","x":"A propensity of 0.05 becomes a weight of 20, so small propensity errors produce large reward errors.","bk":false},{"s":21,"t":"q","f":"DM vs IPW in one line each, and what DR achieves.","b":"DM: low variance, susceptible to assignment bias. IPW: corrects bias, high variance. DR: DM estimate plus IPW correction; high quality if **either** the propensity or the outcome model is good.","x":"DR is the default because it pairs a stable baseline with a bias correction: two chances to be right.","bk":false},{"s":21,"t":"q","f":"Compute DM, IPW, DR rewards: patient got A, $y=8$, $p_A=0.8$, $f_A=7$, $f_B=6$.","b":"DM: $(7,6)$. IPW: A $=8/0.8=10$, B $=0$. DR: A $=7+(8-7)/0.8=8.25$, B $=6$ (no correction for the unobserved arm).","x":"DR equals DM on unobserved arms; on the observed arm it shifts the prediction by the residual divided by the propensity.","bk":false},{"s":21,"t":"q","f":"Recommended train/test protocol for policy learning (Lec 11 slide 39).","b":"1. Split train/test. 2. Reward estimation on train. 3. Train policy trees on train data + train rewards. 4. A **new** reward estimation on the test set. 5. Evaluate prescriptions with test rewards. Use a 50/50 split because the test set needs enough data for its own reward estimation.","x":"Test rewards must be estimated independently, or the policy is graded on the same estimates it was trained to exploit.","bk":false},{"s":21,"t":"q","f":"How does reward estimation generalize beyond discrete treatments and numeric outcomes?","b":"Outcomes: numeric (regression model), binary (classifier for the probability), survival (survival model; censoring needs extra care). Numeric treatments (doses): replace the indicator $\\mathbb 1\\{T_i=t\\}$ with a kernel measuring treatment proximity (slides 42–43).","x":"Only the outcome model type and the treatment-proximity measure change; the DM/IPW/DR logic stays the same.","bk":false},{"s":21,"t":"q","f":"IAI reward estimation call from Lec 11 slide 44: key arguments.","b":"`IAI.CategoricalClassificationRewardEstimator(propensity_estimator=IAI.RandomForestClassifier(), outcome_estimator=IAI.RandomForestClassifier(), reward_estimator=:doubly_robust)` then `IAI.fit_predict!(reward_lnr, train_X, train_treatments, train_outcomes)`. Categorical treatment, binary outcome, DR rewards, cross-fitting built in.","x":"Read the class name as treatment type + outcome type; the RF classifiers estimate both propensities and outcome probabilities.","bk":false},{"s":21,"t":"q","f":"Why do in-sample (not cross-fitted) nuisance predictions hurt IPW/DR rewards?","b":"Models predicting on their own training data are overfit: outcome predictions sit too close to $y_i$ and propensities are too extreme, which distorts the correction terms and the $1/p_{it}$ weights. Cross-fitting makes every estimate out-of-sample.","x":"Overfit propensities near 0 or 1 blow up or kill the $1/p$ weights, and overfit outcomes make the residual correction vanish.","bk":false},{"s":21,"t":"q","f":"Why does DR need only one of its two models to be right?","b":"If $f_t$ is correct, the correction $\\mathbb 1\\{T_i=t\\}(y_i-f_t(x_i))/p_{it}$ has mean zero, so DR averages to DM, which is right. If $p_{it}$ is correct, the IPW term reweights the residuals $y_i-f_t(x_i)$ so that on average it exactly cancels $f_t$'s bias. Either way the expectation is right (derived).","x":"Two-sided insurance: the outcome model sets the baseline and the propensity model repairs its bias.","bk":false},{"s":21,"t":"q","f":"What do the four panels of Lec 11 slide 15 show?","b":"The true dependence of $y$ on $t$ is a smooth curve. RF (model choice): nearly flat, misses it. CV-tuned boosting (regularization): dependence damped. Unregularized boosting (overfitting): jagged, exaggerated dependence.","x":"Visual proof that a good predictive fit of $y$ on $[X\\ T]$ need not recover the causal effect of $t$.","bk":false},{"s":21,"t":"q","f":"How do IPW rewards estimate the value of a whole policy?","b":"Sum (or average) $\\Gamma_{it}$ over observations for the treatment the policy assigns. With correct propensities, $\\mathbb E[\\mathbb 1\\{T_i=t\\}y_i/p_{it}\\mid x_i]=\\mathbb E[Y(t)\\mid x_i]$, so column sums are unbiased even though each row is zero in every unobserved column (derived).","x":"IPW is built for aggregate comparisons; any single row is noisy and mostly zeros.","bk":false},{"s":22,"t":"term","f":"Regress-and-compare (R&C)","b":"Prescribe $\\arg\\max_t\\Gamma_{it}$ separately for each observation $i$.","x":"The obvious plug-in rule: estimate every outcome, pick the best per row. Its problems are interpretability, noise and IPW/DR incompatibility.","bk":false},{"s":22,"t":"term","f":"Policy tree","b":"A decision tree that assigns one treatment to all observations in each leaf.","x":"One treatment per leaf means the policy is a few readable rules and similar observations get the same treatment.","bk":false},{"s":22,"t":"term","f":"Optimal Policy Trees (Amram, Dunn, Zhuo 2022)","b":"Policy trees trained with the Optimal Trees framework (global optimization via local search), using the policy objective on estimated rewards.","x":"Same objective as greedy policy trees, solved with the Optimal Trees local search that beat CART in Lec 9.","bk":false},{"s":22,"t":"term","f":"`policytree`","b":"R package that grows policy trees with a greedy heuristic; the benchmark Optimal Policy Trees improve on.","x":"Greedy splitting has CART's myopia: each split is chosen without regard to the splits below it.","bk":false},{"s":22,"t":"term","f":"Optimal Prescriptive Trees (Ch. 14)","b":"Bertsimas–Dunn–Mundru trees that estimate counterfactuals inside each leaf (mean outcome of same-leaf samples with that treatment) and minimize $\\mu\\cdot$prescription error $+(1-\\mu)\\cdot$prediction error.","x":"An older design that estimates counterfactuals inside the tree's own leaves instead of in a separate causal step.","bk":true},{"s":22,"t":"term","f":"Prescription factor $\\mu$","b":"Weight in Optimal Prescriptive Trees between prescription error ($\\mu$) and squared prediction error ($1-\\mu$); $\\mu=1$ gives optimistic, inaccurate counterfactuals; best around 0.5–0.8 in the book's example.","x":"Pure prescription error lets the tree invent flattering counterfactuals; the prediction term keeps them anchored to observed outcomes.","bk":true},{"s":22,"t":"q","f":"Write the policy-learning objective on a reward matrix.","b":"$$\\max_\\pi\\ \\sum_i\\sum_t\\mathbb 1\\{\\pi(x_i)=t\\}\\cdot\\Gamma_{it}$$\nFor a tree: maximize over $\\text{Tree}(\\cdot)$; each leaf assigns the treatment with the largest summed reward over its points.","x":"Given $\\Gamma$, the policy's value is a sum of table entries it selects; a tree picks one column per leaf.","bk":false},{"s":22,"t":"q","f":"Three drawbacks of regress-and-compare (Lec 11 slide 28).","b":"1. No interpretability: must understand each reward model to see why a treatment won.\n2. \"Overfitting\": similar observations can get different treatments.\n3. Only valid with the direct method: IPW/DR rewards are only meaningful in aggregate, so a per-row argmax doesn't make sense.","x":"All three stem from deciding row by row instead of over groups of observations.","bk":false},{"s":22,"t":"q","f":"How do policy trees address R&C's drawbacks?","b":"The tree is interpretable; it regularizes (similar observations get the same treatment, robust to outcome noise); and it sums rewards over leaves, so IPW and DR rewards can be used.","x":"Pooling observations in a leaf both regularizes the policy and makes aggregate-only rewards (IPW, DR) usable.","bk":false},{"s":22,"t":"q","f":"Show that classification is a special case of the policy-tree problem.","b":"Set $\\Gamma_{it}=0$ if point $i$ is class $t$, else 1, and minimize: the objective counts misclassifications. So the policy tree problem is a **weighted** classification tree problem, solvable by modifying classification tree methods (greedy or Optimal Trees).","x":"A misclassification is one unit of reward lost; policy trees let that loss vary by observation and treatment.","bk":false},{"s":22,"t":"q","f":"Four patients' IPW rewards (A,B): (10, 0), (10, 0), (0, 11.25), (0, 10). What does per-row argmax give, and why is it meaningless?","b":"It prescribes exactly the treatment each patient already received (A, A, B, B), since IPW puts all reward in the observed column. IPW is unbiased only when summed over many observations, so it can compare policies, not pick per-row winners.","x":"IPW is zero in every unobserved column, so a row-wise argmax can only echo the historical treatment.","bk":false},{"s":22,"t":"q","f":"Synthetic policy-tree results (Lec 11 slide 33): what do they show?","b":"Mean regret vs training size in 4 experiments with biased treatment assignment: optimal policy trees have regret at or below greedy policy trees throughout (clearly lower in Exp 1–2). Regress-and-compare is lowest at small $n$ and causal forests catch up with more data (read off the chart).","x":"Global optimization of the same tree objective lowers regret versus greedy; non-tree methods can do better still but aren't interpretable.","bk":false},{"s":22,"t":"q","f":"Optimal Policy Trees in diabetes management (Lec 11 slide 36).","b":"~50,000 visits, 13 treatment combinations, goal: reduce HbA1c. Estimated reduction **0.11**, well above the clinically meaningful threshold of 0.05. Tree splits on past HbA1c (7.85), time since diagnosis, HbA1c percentile, number of visits.","x":"The estimated benefit is about twice the clinical threshold, from a tree a clinician can read.","bk":false},{"s":22,"t":"q","f":"Optimal Policy Trees for marketing channels (Lec 11 slide 37).","b":"Financial services provider; recommend the best interaction mode per customer (phone calls, in-person meetings, emails, or \"little impact\"). Estimated **8–15% lift** in fund flow.","x":"Same pipeline outside medicine: treatments are contact channels, the outcome is fund flow.","bk":false},{"s":22,"t":"q","f":"Job training application (Lec 11 slide 35).","b":"Observational data. Features: age, education, ethnicity, marital status, 1975 salary; treatment: training or not; outcome: 1978 salary. The tree ($n=506$) splits first on 1975 earnings < 5359, then on age and education.","x":"A classic observational causal dataset; the tree targets training by prior earnings, then age and education.","bk":false},{"s":22,"t":"q","f":"How are policies evaluated on real data without true counterfactuals?","b":"Run an independent reward estimation on the test data and score prescriptions with those test rewards. Only an actual experiment truly measures the impact of a new policy (slide 34).","x":"Out-of-sample evaluation still relies on estimated counterfactuals, so it is an estimate; only an experiment is ground truth.","bk":false},{"s":22,"t":"q","f":"Lec 11's two-step recipe for prescriptions from observational data.","b":"1. Estimate rewards under all treatments with causal inference (DM, IPW, DR, cross-fitted).\n2. Train Optimal Policy Trees to assign treatments maximizing those rewards.","x":"Separating what would happen from what to do lets each step use its best tool: causal estimators, then optimal trees.","bk":false},{"s":22,"t":"q","f":"How do Optimal Prescriptive Trees estimate a counterfactual $\\hat y_i(t)$?","b":"Mean outcome of the training samples in the same leaf as $i$ that received $t$ (OPT-L: a per-treatment lasso fit in the leaf). A minimum count $n_{\\text{treatment}}$ of $t$-samples is required before a leaf may prescribe $t$.","x":"Leaf-level averaging is a crude matching estimator; the minimum count stops a leaf from prescribing a treatment it has barely seen.","bk":true},{"s":22,"t":"q","f":"Why not set the prescription factor $\\mu=1$?","b":"With only the prescription error, the tree's counterfactual estimates needn't match reality: high prediction error and an optimistic prescription error not supported out of sample. Mixing in prediction error ($\\mu\\approx0.5$–0.8) improved both.","x":"Optimizing only the prescription term rewards optimistic estimates, which do not hold up out of sample.","bk":true},{"s":22,"t":"q","f":"Optimal Prescriptive Trees (book) vs Optimal Policy Trees (lecture).","b":"Book OPT: counterfactuals estimated inside each leaf during training; objective $\\mu\\cdot$prescription $+(1-\\mu)\\cdot$prediction error; no propensity weighting. Lecture: separate cross-fitted reward estimation (DM/IPW/DR), then $\\max\\sum_i\\sum_t\\mathbb 1\\{\\text{Tree}(x_i)=t\\}\\Gamma_{it}$; bias handled by IPW/DR.","x":"The lecture separates causal estimation from the tree search; the book couples them inside the tree.","bk":true},{"s":22,"t":"q","f":"Main synthetic and warfarin findings for Optimal Prescriptive Trees.","b":"Synthetic: OPT(0.5)-L ≥ OPT(0.5) > OPT(1) > greedy PT; joint learners (OPT, causal forests) generally beat regress-and-compare. Warfarin (3 dose groups): OPT beat greedy PT by ~0.6–1.2%, but regress-and-compare did best on that dataset.","x":"Joint learners generally beat R&C on synthetic data, but no method dominates on every real dataset.","bk":true},{"s":22,"t":"q","f":"How does a policy tree choose the treatment in a leaf?","b":"For each treatment $t$, sum $\\Gamma_{it}$ over the leaf's observations; assign the treatment with the largest sum (smallest, if minimizing). Not a majority vote over row-wise winners.","x":"The leaf analog of OCT's majority-class label, but weighted by reward magnitudes.","bk":false},{"s":22,"t":"q","f":"Lec 11 slide 6: what if we knew the best treatment, or every outcome?","b":"Knowing the best treatment per observation turns policy learning into multiclass classification (predict the best treatment from $x$). Knowing outcomes under every treatment lets you do better than classification, because magnitudes say how costly each wrong choice is; policy trees work with these.","x":"Classification only knows right versus wrong; rewards also know by how much.","bk":false},{"s":22,"t":"q","f":"Diabetes policy tree on Lec 11 slide 36: the splits.","b":"Past HbA1c $<7.85$ ⇒ metformin. Otherwise split on time since diagnosis (1.292): below, past-HbA1c 25th percentile $<10.21$ ⇒ metformin, else insulin + metformin + oral; above, number of visits $<2.5$ ⇒ 3 oral, else insulin + metformin.","x":"Well-controlled patients get the mildest drug; escalation follows severity and history, which a clinician can read and check.","bk":false},{"s":22,"t":"q","f":"Marketing channel tree on Lec 11 slide 37: the splits.","b":"Fund performance index (Y15Q1) $\\ge4.3$ ⇒ little impact. Otherwise assets under management (Y15Q2) $\\ge410{,}852.5$ ⇒ emails; else total redemptions (Y14Q4) $<2014.7$ ⇒ phone calls, $\\ge2014.7$ ⇒ in-person meetings.","x":"Each leaf is a channel, so the policy reads as a contact playbook for account managers.","bk":false},{"s":23,"t":"term","f":"Inductive bias","b":"The assumption a model uses to fill the gaps between data points (line: linear world; tree: flat on boxes; convex regression: each extra mile saves less). Every method has one; pick it on purpose (Rec 3 slide 20).","x":"Without an assumption nothing predicts between data points; choosing a method is choosing the assumption.","bk":false},{"s":23,"t":"q","f":"Rec 3 apartments: LS on all ten says $1442+2.61x$. Why isn't that verdict on a 1,300 sq ft listing trustworthy?","b":"Which 5 listings you train on matters: across the 252 splits the slope runs from 1.50 to 3.65 per sq ft, so the verdict on the listing (priced at 4,900) flips between overpriced by 332 and a deal by 215 depending on the seed.","x":"A 5/5 split is one of 252 possible choices, and the verdict depends on which one the seed picked.","bk":false},{"s":23,"t":"q","f":"Rec 3: the stable regression line and its worst-five score; why isn't it just the fit to the hardest split?","b":"$1500+2.50x$ with worst-five absolute error 1,300, better than LS (1,338), the best of all 252 split fits (1,304), and the hardest split's own fit ($1860+2.37x$: 2,154). Each split's fit is tuned to its five listings; stable regression is the single line whose error on **any** five listings is at most 1,300.","x":"Each split's fit is tuned to its own five listings; stable regression optimizes the worst case over all of them at once.","bk":false},{"s":23,"t":"q","f":"Why is the worst set of a stable regression fit balanced above and below the line?","b":"The subgradient of the top-$k$ absolute-residual sum w.r.t. $\\beta_0$ is (# worst-set points below) − (# above). At the optimum 0 must lie in it, so the worst $k$ weigh the same on both sides (Rec 3 slide 12: two over, two under, three-way tie at 200).","x":"If more worst-set points sat on one side, shifting the intercept toward them would lower the top-$k$ sum, so the optimum must be balanced.","bk":false},{"s":23,"t":"q","f":"When can one-sided outliers move a stable regression line (Rec 3 slide 13)?","b":"Only when they make up more than half of the worst $k$. Two luxury units: $k=5$ ⇒ line barely moves ($1468+2.54x$); $k=3$ ⇒ they are the majority of the worst three and pull it up ($1940+2.60x$). LS is dragged to $1134+3.31x$.","x":"Same subgradient logic: a minority of the worst set cannot outweigh the majority on the other side.","bk":false},{"s":23,"t":"q","f":"What does stable regression become at $k=n$?","b":"$\\sum z_i=n$ with binary $z$ forces $z=\\mathbf 1$: one feasible point, so the objective is plain $\\ell_1$ (LAD) regression on all data. Small $k$ grades the model on a small hard core.","x":"With nothing left to choose, the adversary keeps every point and the loss is the plain sum of absolute residuals.","bk":false},{"s":23,"t":"q","f":"Besides accuracy, what does stable regression buy, and how can $z^*$ be used?","b":"Much lower run-to-run variability: the split no longer depends on a seed. $z^*$ labels every point as hard or not; fit a classification tree on $z^*$ to explain who is hard (Book §17.5 diabetes: inconsistent HbA1c histories, non-responders).","x":"Removing seed dependence is often the bigger practical gain, and $z^*$ doubles as a diagnostic label.","bk":false},{"s":23,"t":"q","f":"Rec 3 Red Line data: what do the LS residuals $+383,+87,-108,\\dots,+118,+272$ tell you?","b":"They smile (positive at both ends, negative in the middle) every time: the shape is wrong, not noise. Chord slopes $-1000,\\dots,-100$ per mile are increasing, so the data are exactly convex.","x":"Residuals with a systematic pattern signal misspecification; noise would scatter randomly around zero.","bk":false},{"s":23,"t":"q","f":"Rec 3: what extrapolation does convexity justify for Quincy (8 mi) that LS can't?","b":"LS says 551 (and the landlord pays you at 10 mi). Past 5 mi any convex curve through the data falls at most 100 per mile (last chord slope), so Quincy rent $\\ge2050-3\\cdot100=1{,}750$.","x":"Convexity bounds how fast the curve can fall beyond the data: no faster than the last chord slope.","bk":false},{"s":23,"t":"q","f":"Convex regression on non-convex data: infeasible, ignored, or what?","b":"Never infeasible (a line is convex, so the feasible set is nonempty) and it doesn't ignore the bump: $\\theta=y$ becomes infeasible, the squared error goes positive, and the fit is the closest convex function (bump shaved flat). Large structured residuals signal the shape assumption is wrong.","x":"The feasible set always contains linear functions, so a wrong shape shows up as residuals, never as infeasibility.","bk":false},{"s":23,"t":"q","f":"Rec 3: stable vs convex regression, what each doubts and which Rec 1 tool makes it tractable.","b":"Stable: doubts the split; adds $z$ = worst $k$; minimax + LP duality. Convex: doubts the shape; replaces the functional form with $\\theta,\\xi$; max-of-linear + separation oracle (cutting planes).","x":"Both turn a modeling worry into decision variables, then use one of Rec 1's two reformulation moves to stay tractable.","bk":false},{"s":23,"t":"q","f":"Rec 4: why is LQAD with $q=n$ the least robust choice?","b":"$\\lvert r_{(n)}\\rvert=\\max_i\\lvert r_i\\rvert$: the Chebyshev ($\\ell_\\infty$) fit, which a single outlier controls. Smaller $q$ ignores more points; $q$ trades efficiency for robustness; $q=\\lceil n/2\\rceil$ is LMAD.","x":"Minimizing the maximum residual lets one bad point dictate the fit, the opposite of what robust regression wants.","bk":false},{"s":23,"t":"q","f":"Geometric picture of LQAD (Rec 4 slide 8).","b":"$\\lvert r_{(q)}\\rvert\\le\\gamma$ ⇔ at least $q$ points lie within $\\gamma$ of the line, so LQAD finds the thinnest band containing $q$ points. The other $n-q$ points can move anywhere without widening the band.","x":"Points outside the band are ignored, so up to $n-q$ points can be arbitrarily bad without moving the solution.","bk":false},{"s":23,"t":"q","f":"$n=100$ points, up to 30 may be arbitrarily corrupted. Which $q$ for LQAD?","b":"$q=70$: the band must be able to contain only clean points ($q\\le70$), and smaller $q$ discards data that may be clean (Rec 4 slide 9).","x":"Pick the largest $q$ whose band can still be filled with clean points only.","bk":false},{"s":23,"t":"q","f":"Rec 4: how big must $M$ be in the LQAD MIO, and why?","b":"At least the largest residual (at the optimal $\\beta$): a dropped point's excuse $\\mu_i\\le M$ must fully cover its residual, otherwise $\\gamma\\ge\\lvert r_i\\rvert-M$ binds and the MIO returns a wrong solution (Rec 2 showed the failure).","x":"Big-M must be valid for the residuals at the optimum; too small silently changes the problem being solved.","bk":false},{"s":23,"t":"q","f":"Write $\\lvert r_{(q)}\\rvert$ as a difference of convex functions and say how it's used.","b":"$\\lvert r_{(q)}\\rvert$ = (sum of the $n-q+1$ largest $\\lvert r_i\\rvert$) − (sum of the $n-q$ largest). Linearize the subtracted convex term at the current $\\beta$, solve the LP, repeat (monotone improvement). Gives the MIO a warm start; subgradient descent is the cheaper first stage.","x":"Linearizing the subtracted convex term gives a convex upper model, so each LP step can only decrease the objective.","bk":false},{"s":23,"t":"q","f":"Rec 4 stores example: 12 stores on $y\\approx1+0.5x$, three bad records at $x\\approx9.5$. What do LS, LAD, LMAD do?","b":"LS flips the sign of the slope; LAD does no better (bad points still pull); LMAD fits the twelve and ignores the three, since the worst half of residuals never enters the median.","x":"LAD still lets every point pull; only quantile-type objectives let a minority of bad points be ignored entirely.","bk":false},{"s":23,"t":"q","f":"Rec 4: why is replacing $f_i(\\Delta y_i)$ by its chord exact for the label adversary?","b":"$f_i(\\Delta y_i)=-\\log(1+e^{-(1-2\\Delta y_i)m_i})$ is concave in $\\Delta y_i$, and on $\\{0,1\\}$ the chord equals $f_i$. A concave function on $[0,1]$ is minimized at an endpoint, so minimizing the chord over the relaxed set gives the binary answer: relaxation loses nothing.","x":"Concavity puts the adversary's best response at a vertex, where chord and function agree, so the LP relaxation is exact.","bk":false},{"s":23,"t":"q","f":"Rec 4 slide 17: what does flipping label $i$ cost, and what does the adversary target?","b":"$c_i=\\log\\frac{1+e^{-m_i}}{1+e^{m_i}}=-m_i$: exactly the margin. The adversary flips the $\\Gamma$ points with the largest positive margins (most confidently correct), and the counterpart constraint $\\mu+\\nu_i\\le-m_i$ is linear in $\\beta$.","x":"The adversary punishes confidence: the most confidently correct points cost the most when flipped.","bk":false},{"s":23,"t":"q","f":"Holistic regression (Rec 4): constraint so interaction $x_1x_2$ enters only with both parents.","b":"$z_{12}\\le z_1$ and $z_{12}\\le z_2$. ($z_{12}=z_1=z_2$ drags the interaction in with the parents; $z_{12}\\ge z_1+z_2-1$ is the converse implication.)","x":"Child-needs-parent is the implication $z_{12}=1\\Rightarrow z_1=1$, which is exactly $z_{12}\\le z_1$.","bk":false},{"s":23,"t":"q","f":"Holistic regression (Rec 4): feature $j$ costs $c_j$ to measure, budget $C$ per patient.","b":"$\\sum_jc_jz_j\\le C$: cost is paid when a feature is used ($z_j=1$), regardless of coefficient size. $\\sum_jz_j\\le C$ is the unweighted sparsity constraint.","x":"Measurement cost depends on whether a feature is used, so it constrains support binaries, not coefficient sizes.","bk":false},{"s":23,"t":"q","f":"$HC=\\{(1,2),(2,3),(3,4),(4,5)\\}$: what is $k_{\\max}$ (Rec 4 slide 26)?","b":"3, e.g. $\\{1,3,5\\}$: the maximum independent set of a 5-vertex path. In general $k_{\\max}$ is a maximum independent set in the high-correlation graph: NP-hard, small in practice.","x":"Collinearity constraints are edges of a graph; a feasible support is an independent set.","bk":false},{"s":23,"t":"q","f":"Lec 7 slide 13 prints $t_{sign}=T^{-1}((1-\\alpha)/2)$. What is the correct cutoff?","b":"$t_\\alpha=T^{-1}_{n-p}(1-\\alpha/2)$, the two-sided critical value (≈1.96 for large $n$, $\\alpha=0.05$). $T^{-1}(0.475)$ would be negative.","x":"The two-sided cutoff lives in the upper tail; a quantile below 0.5 is negative and cannot be a cutoff for $|t|$.","bk":false},{"s":23,"t":"q","f":"Rec 3 slide 8: the two honest responses to split dependence.","b":"Average over splits (cross-validation: the typical case) or guard against every split (stable regression: the worst case).","x":"The same contrast as averaged versus worst-case uncertainty in robust regression (Lec 2).","bk":false},{"s":23,"t":"q","f":"What does convex regression assume, and what does it not need (Rec 3 slide 22)?","b":"Only the shape (convexity). No degree, knots, kernel or bandwidth. Domain knowledge enters as a constraint; production functions, utility, cost curves and delay vs load are typically convex.","x":"One defensible shape assumption replaces a stack of tuning choices.","bk":false},{"s":23,"t":"q","f":"Convex regression constraint counts and the cutting-plane loop (Rec 3 slide 25).","b":"$n(n-1)$ pairwise constraints: 90 for ten listings, 999,000 for 1,000. Start from $n$ pairs, solve, for each $i$ add the most violated $j(i)=\\arg\\max_k\\{\\hat\\theta_i-\\hat\\theta_k+\\hat\\xi_i^T(x_k-x_i)\\}$ if above tolerance $\\epsilon$, re-solve; stop when nothing is violated (then optimal for the full problem).","x":"Most pairwise constraints are slack at the optimum, so generating only violated ones keeps the QP small.","bk":false},{"s":23,"t":"q","f":"Rec 3: how many 70/30 splits does Abalone (4,177 rows) have?","b":"About $10^{1106}$. Choosing a split is a decision among astronomically many, and the random seed makes it for you.","x":"The count makes the point of slide 7: 'change the seed, change your verdict'.","bk":false},{"s":24,"t":"q","f":"Recurring move: structure as constraints on binaries. Where in Lec 7–9?","b":"Holistic regression: sparsity, groups, collinearity, transforms, significance are all linear constraints on support binaries $z$ (plus sign binaries $b$). OCT: tree structure ($d_t\\le d_{p(t)}$), routing, leaf size, labels and errors are linear constraints on $a,d,z,l,c$.","x":"Once structure is a linear constraint on binaries, the solver enforces all of it jointly instead of through sequential manual steps.","bk":false},{"s":24,"t":"q","f":"Greedy heuristic vs global optimization: the three pairs the course has shown.","b":"Lasso / stepwise ⇒ best-subset and holistic regression (Lec 3, 7); CART ⇒ Optimal Classification Trees (Lec 8–9); greedy `policytree` ⇒ Optimal Policy Trees (Lec 11). Each time: same objective, solved globally (or by a much stronger local search), better or equal accuracy, more interpretable output.","x":"The course thesis three times over: the heuristic was never the problem definition, only a way to approximate it.","bk":false},{"s":24,"t":"q","f":"Where does “fast heuristic warm start, then MIO certifies” show up in Lec 5–9?","b":"LQAD: subgradient + LP steps, then MIO (Lec 5, Rec 4). OCT: CART warm start for the MIO (Book §8.2). At scale, OCT drops the MIO and keeps only the (much stronger) local search, giving up the certificate.","x":"Heuristics find good solutions fast; MIO spends most of its time proving optimality, so a warm start shortens both.","bk":false},{"s":24,"t":"q","f":"Prediction vs prescription: what does Lec 10 add over Lec 8–9, and what does Lec 11 add over Lec 10?","b":"Lec 10: decisions $z$ (often continuous) with a known cost $c(z;y)$ where $z$ doesn't affect $Y$; ML only supplies weights over past $y$'s. Lec 11: discrete treatments that change the outcome, so counterfactuals must be estimated (DM/IPW/DR) before optimizing a policy.","x":"Lec 10's decisions don't change $Y$, so past $y$'s are valid scenarios; Lec 11's treatments do, which forces counterfactual estimation.","bk":false},{"s":24,"t":"q","f":"Trees appear in three roles in Lec 9–11. Name them.","b":"Predictor (OCT/ORT: label or value per leaf); binning rule for weights (Lec 10: CART/RF leaves define which past observations count); policy (Lec 11: one treatment per leaf).","x":"The same partition structure can predict, define relevance weights, or assign actions.","bk":false},{"s":24,"t":"q","f":"Measuring against a data-poor baseline: three instances in the course.","b":"$R^2$ vs the sample mean; OCT's error divided by $\\hat L$, the no-split tree's error; $P$ vs the SAA decision (with perfect foresight as the ceiling).","x":"Each score is the fraction of the gap closed between a do-nothing baseline and a perfect ceiling.","bk":false},{"s":24,"t":"q","f":"What does the course claim about the interpretability–accuracy tradeoff after Lec 9?","b":"With Optimal Trees it largely disappears: OCT-H matches XGBoost/RF accuracy from depth 3–4 while remaining a single tree; OCT matches CART accuracy with about half the splits. Ensembles are no longer the only route to state-of-the-art accuracy.","x":"The claim is that the tradeoff came from greedy training, not from trees themselves.","bk":false},{"s":24,"t":"q","f":"Why is IAI's local search, not Gurobi, the practical engine for optimal trees?","b":"The MIO needs $n\\cdot2^D$ routing binaries and fails to improve on CART within hours past depth 2–3 on modest data; local search over splits only is independent of $n$, runs within 1–2 orders of magnitude of CART, and finds better trees. MIO remains the formulation and the certificate on small instances.","x":"MIO size grows with $n$; local search over splits does not, so it scales, at the cost of the optimality certificate.","bk":false},{"s":24,"t":"q","f":"Censoring appears twice in Lec 10–11. Where?","b":"Lec 10: sales $U=\\min\\{Y,V\\}$ censor demand when titles sell out; the prescription weights get a Kaplan–Meier-style correction. Lec 11: survival outcomes in reward estimation are right-censored and need extra care (causal survival forests, slide 42).","x":"Whenever data collection truncates the outcome, treat the observation as a lower bound, not the value.","bk":false},{"s":24,"t":"q","f":"Data-splitting choices across the course and why they differ.","b":"Holistic regression: 50/25/25 train/validation/test. Stable regression: guard against the worst split instead of trusting one. Policy learning: 50/50 train/test, because the test set needs its own reward estimation. Cross-fitting: $k$ folds for out-of-sample nuisance predictions.","x":"Each choice answers one worry: are the numbers you report, or plug in, honest out of sample?","bk":false},{"s":24,"t":"q","f":"Why is the Lec 10 shipment cost convex in $z$? Which Rec 1 fact is it?","b":"The recourse term is the optimal value of an LP in which $z$ appears only in the right-hand side. By LP duality it is a max over dual vertices of functions linear in $z$, and a max of linear functions is convex; the first-stage $p_1\\sum_iz_i$ is linear (derived).","x":"The same max-of-linear move as convex regression and the robust counterparts.","bk":false},{"s":24,"t":"q","f":"Where does reweighting training points appear across the course?","b":"Lec 4: stable regression's $z$ puts 0/1 weights on the hardest $k$ points. Lec 10: predictive prescriptions weight past scenarios by $w^i_N(x)$. Lec 11: IPW reweights outcomes by $1/p_{it}$; policy trees are weighted classification trees.","x":"Many methods differ only in how much each training point counts in the loss.","bk":false}],"mc":[{"sec":1,"q":"Which three optimization \"lenses\" structure 15.095?","x":"The course applies convex, robust and mixed integer optimization to ML. SDO and SOCP appear as special cases of convex optimization, and the last option lists algorithms, not modeling lenses.","o":["Convex, robust, and mixed integer optimization","Linear, quadratic, and semidefinite optimization","Stochastic, robust, and dynamic optimization","Gradient descent, Newton, and interior point methods"],"a":0},{"sec":1,"q":"According to the Lec 1 slides, the total MIO speedup (software × hardware, 1991–2022) is roughly:","x":"Software ≈ 4.7 million× times hardware ≈ 8 million× gives ≈ 37.6 trillion×. 29,000× is CPLEX 1.2→11 alone, and 2 trillion× is the older figure in the 2019 textbook.","o":["29,000×","4,700,000×","37.6 trillion×","2 trillion×"],"a":2},{"sec":1,"q":"A problem is \"practable\" when:","x":"Practability is defined relative to the application's time budget and instance sizes, regardless of P/NP-hard status. Convexity and polynomial time are neither necessary nor sufficient.","o":["it can be solved in polynomial time","it is convex","it can be solved in times and sizes appropriate for its application","a heuristic finds a feasible solution quickly"],"a":2},{"sec":1,"q":"Which example does Bertsimas use to argue that complexity theory can mislead about practical difficulty?","x":"Simplex (and the NP-hard TSP solved at a million cities) are the course's examples of theory and practice diverging. The other options do not illustrate a mismatch.","o":["The simplex method, exponential in the worst case but fast in practice","Gradient descent, which converges linearly on strongly convex problems","Interior point methods, which are polynomial","Branch and bound, which is always fast on small problems"],"a":0},{"sec":1,"q":"An SOCP constraint $\\|A_i x + b_i\\|_2 \\le f_i^\\top x + d_i$ becomes a linear constraint when:","x":"With $A_i = 0$ the left side is the constant $\\|b_i\\|_2$, so the constraint is linear in $x$. With $f_i = 0$ you get a convex quadratic constraint instead.","o":["$A_i = 0$","$f_i = 0$","$d_i = 0$","$b_i = 0$"],"a":0},{"sec":1,"q":"An SDO problem reduces to a linear optimization problem when:","x":"A diagonal $X$ is PSD exactly when its diagonal is nonnegative, and $\\langle C, X\\rangle$ becomes linear in those diagonal entries, giving an LO.","o":["$C$ is the identity","$X$ is restricted to be diagonal","all $A_i$ are PSD","$b = 0$"],"a":1},{"sec":1,"q":"Why does the course say ML/statistics historically avoided MIO?","x":"The belief was justified by the computing of its era. The solver and hardware speedups since then were never folded back into ML practice.","o":["MIO cannot model sparsity","MIO was too slow when many ML methods were developed (1970s–90s), and the belief was never updated","MIO solutions are not interpretable","MIO requires probabilistic assumptions"],"a":1},{"sec":1,"q":"\"Robustness is more important than optimality\" means:","x":"A solution that is optimal for the exact training data can be fragile to small data errors. The course prefers solutions that stay good under perturbation.","o":["robust models are always optimal out of sample","a robust solution is preferable to a brittle optimal one","you should never solve problems to optimality","robust optimization is faster than nominal optimization"],"a":1},{"sec":1,"q":"Which is the course's main example (so far) of \"optimization over randomization\"?","x":"Stable regression (Lec 4) replaces the random train/validation split with an adversarial, optimized one. Random forests are the randomized method that optimal trees are compared against later.","o":["Stochastic gradient descent","Random forests","Stable regression, which picks the training set by optimization instead of a random split","Bootstrap confidence intervals"],"a":2},{"sec":1,"q":"The Lec 1 preview of matrix completion has which constraint?","x":"Matrix completion fits observed entries with a low-rank matrix. The rank constraint plays the role $\\|\\beta\\|_0 \\le k$ plays for vectors.","o":["$\\|\\Theta\\|_1 \\le k$","$\\mathrm{rank}(\\Theta) \\le r$","$\\Theta \\succeq 0$","$\\Theta$ diagonal"],"a":1},{"sec":1,"q":"What does the course say about the time to solve robust optimization problems?","x":"Reformulating the inner worst case (often via duality or dual norms) gives a deterministic problem of similar size, so robustness is cheap.","o":["They are always NP-hard","For many problems they solve in the same order of time as the nominal problem","They require sampling scenarios","They are only tractable for linear problems"],"a":1},{"sec":2,"q":"In the exam LP (max $4x_1 + 7x_2$, $5x_1 + 10x_2 \\le 60$, $x_1 \\le 8$, $x \\ge 0$), what is the optimal solution?","x":"Type 1 earns 0.8 pts/min vs. 0.7 for Type 2, so take all 8 Type 1 (40 min) then 2 Type 2 (20 min): 46. $(8,1.5)$ is the 55-minute LP optimum.","o":["$(0, 6)$ with score 42","$(8, 2)$ with score 46","$(8, 1.5)$ with score 42.5","$(4, 4)$ with score 44"],"a":1},{"sec":2,"q":"With a 55-minute exam, what is the best integer plan?","x":"$(8,2)$ needs 60 minutes (infeasible); $(8,1)$ scores 39 and wastes 5 minutes; $(7,2)$ uses exactly 55 minutes for 42 points. Rounding the LP solution does not find it.","o":["$(8, 1)$, rounding down","$(8, 2)$, rounding up","$(7, 2)$, scoring 42","$(8, 1.5)$"],"a":2},{"sec":2,"q":"Which dual weights prove the tight bound of 46 in the exam LP?","x":"$0.7(5x_1 + 10x_2) + 0.5x_1 = 4x_1 + 7x_2 \\le 0.7\\cdot60 + 0.5\\cdot8 = 46$. $(0.8,0)$ only proves 48.","o":["$p = (0.8, 0)$","$p = (0.7, 0.5)$","$p = (0.4, 0.7)$","$p = (1, 1)$"],"a":1},{"sec":2,"q":"For a minimization primal, a constraint $a_i^\\top x \\le b_i$ corresponds to a dual variable that is:","x":"In the min-primal recipe: $\\ge$ gives $p_i \\ge 0$, $\\le$ gives $p_i \\le 0$, and $=$ gives a free $p_i$.","o":["$p_i \\ge 0$","$p_i \\le 0$","free","zero"],"a":1},{"sec":2,"q":"The dual of $\\min c^\\top x$ s.t. $Ax = b$, $x \\ge 0$ is:","x":"Equality constraints give free dual variables, and $x \\ge 0$ gives dual constraints $A^\\top p \\le c$.","o":["$\\max p^\\top b$ s.t. $A^\\top p \\ge c$, $p \\ge 0$","$\\max p^\\top b$ s.t. $A^\\top p \\le c$, $p$ free","$\\min p^\\top b$ s.t. $A^\\top p \\le c$","$\\max c^\\top p$ s.t. $Ap \\le b$"],"a":1},{"sec":2,"q":"If a primal LP is unbounded, its dual is:","x":"Weak duality: any dual feasible point would bound the primal, which contradicts unboundedness.","o":["unbounded","optimal with the same value","infeasible","degenerate"],"a":2},{"sec":2,"q":"Which constraint models \"we never sit day 2 without sitting day 1\"?","x":"$z_2 = 1$ must force $z_1 = 1$, while $z_1 = 1$ alone is allowed. That is $z_2 \\le z_1$.","o":["$z_2 \\ge z_1$","$z_2 \\le z_1$","$z_1 = z_2$","$z_1 + z_2 \\le 1$"],"a":1},{"sec":2,"q":"How do you linearize $z_3 = z_1 z_2$ for binaries?","x":"The two upper bounds forbid $z_3 = 1$ unless both are 1, and $z_3 \\ge z_1 + z_2 - 1$ forces $z_3 = 1$ when both are 1.","o":["$z_3 \\ge z_1$, $z_3 \\ge z_2$","$z_3 \\le z_1$, $z_3 \\le z_2$, $z_3 \\ge z_1 + z_2 - 1$","$z_3 = (z_1 + z_2)/2$","$z_3 \\le z_1 + z_2$"],"a":1},{"sec":2,"q":"For $x_{2j} \\le M z_j$ where $10x_{2j} \\le 60$, which $M$ is best?","x":"All three are valid, but the solver relaxes $z_j$; only the tight $M = 6$ keeps the LP relaxation strong. Correctness and tractability differ.","o":["$10^6$","60","6","Any valid $M$ performs identically"],"a":2},{"sec":2,"q":"Linearize $\\min |y_1| + |y_2|$:","x":"$t_j \\ge \\pm y_j$ means $t_j \\ge |y_j|$, and minimization pushes $t_j$ down to equality.","o":["$\\min t_1 + t_2$ s.t. $t_j \\ge y_j$, $t_j \\ge -y_j$","$\\min t_1 + t_2$ s.t. $t_j \\le y_j$, $t_j \\le -y_j$","$\\min y_1 + y_2$ s.t. $y \\ge 0$","It requires binary variables"],"a":0},{"sec":2,"q":"Which property does convex optimization have that general nonlinear optimization lacks?","x":"Convexity gives local = global (plus polynomial-time solvability and strong duality under Slater). Vertex optimality is specific to LP.","o":["Every problem has an integer optimum","Any local optimum is a global optimum","The optimum is always at a vertex","The dual is always unbounded"],"a":1},{"sec":2,"q":"Maximizing a concave quadratic over a polyhedron: where can the optimum be?","x":"Curved level sets can touch the region along an edge (Rec 1: $(4.47, 3.76)$). The problem is still in P.","o":["Only at a vertex","On an edge or interior point where a level curve is tangent","Only at the unconstrained maximum","Nowhere; the problem is NP-hard"],"a":1},{"sec":2,"q":"With integer variables, what remains of the minimax exchange?","x":"Strong duality and the exchange need convexity; with integers only the weak inequality survives.","o":["Equality $\\min\\max = \\max\\min$","Only the inequality $\\max\\min \\le \\min\\max$","Nothing at all","The reverse inequality $\\min\\max \\le \\max\\min$"],"a":1},{"sec":3,"q":"Robust regression with $\\mathcal U_{F(2)} = \\{\\|\\Delta\\|_{F_2} \\le \\rho\\}$ and $\\ell_2$ loss is equivalent to:","x":"For Frobenius sets the penalty is the dual of the loss index: $q = 2 \\Rightarrow q^* = 2$. This is ridge's robustness interpretation (global perturbations).","o":["$\\min_\\beta \\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_2$ (ridge-type)","$\\min_\\beta \\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$ (Lasso-type)","$\\min_\\beta \\|y - X\\beta\\|_2^2$","$\\min_\\beta \\|y - X\\beta\\|_1 + \\rho\\|\\beta\\|_\\infty$"],"a":0},{"sec":3,"q":"Robust regression with $\\mathcal U_{(1,2)}$ and $\\ell_2$ loss is equivalent to:","x":"For induced sets the penalty uses the first index $r = 1$ directly, with no dual. $\\mathcal U_{(1,2)}$ caps each column's $\\ell_2$ norm.","o":["ridge","Lasso: $\\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$","elastic net","OLS"],"a":1},{"sec":3,"q":"For an induced uncertainty set $\\mathcal U_{(r,q)}$ with $\\ell_q$ loss, the regularizer is:","x":"$\\|\\Delta\\beta\\|_q \\le \\|\\Delta\\|_{(r,q)}\\|\\beta\\|_r$, attained by a rank-one $\\Delta$. No dual appears. Writing $r^*$ is the classic HW1 trap.","o":["$\\rho\\|\\beta\\|_{q^*}$","$\\rho\\|\\beta\\|_{r^*}$","$\\rho\\|\\beta\\|_r$","$\\rho\\|\\beta\\|_q$"],"a":2},{"sec":3,"q":"Which set equals $\\mathcal U_{(1,2)}$?","x":"$\\|\\Delta\\|_{(1,q)} = \\max_j\\|\\Delta_j\\|_q$ because the $\\ell_1$ ball's vertices map to the columns.","o":["$\\{\\Delta : \\sum_{ij}\\Delta_{ij}^2 \\le \\rho^2\\}$","$\\{\\Delta : \\|\\Delta_j\\|_2 \\le \\rho$ for every column $j\\}$","$\\{\\Delta : \\|\\delta_i\\|_2 \\le \\rho$ for every row $i\\}$","$\\{\\Delta : |\\Delta_{ij}| \\le \\rho\\}$"],"a":1},{"sec":3,"q":"Averaging the squared loss uniformly over a box, diamond, ellipsoidal or budget uncertainty set yields:","x":"All four averaged problems give $\\|y - X\\beta\\|_2^2 + f(n,k,\\rho)\\|\\beta\\|_2^2$. Only the constant changes.","o":["Ridge regression, with a constant depending on the set","Lasso","Elastic net","A different penalty for each set"],"a":0},{"sec":3,"q":"The dual norm of $\\ell_\\infty$ is:","x":"$\\max_{\\|x\\|_\\infty \\le 1}\\beta^\\top x = \\sum_j|\\beta_j|$, so $\\ell_\\infty$ and $\\ell_1$ are a dual pair. $\\ell_2$ is self-dual and $\\ell_0$ is not a norm.","o":["$\\ell_1$","$\\ell_\\infty$","$\\ell_2$","$\\ell_0$"],"a":0},{"sec":3,"q":"In the elastic net's robust interpretation $\\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_1 + \\mu\\|\\beta\\|_2$:","x":"The $\\ell_1$ term comes from $\\mathcal U_{(1,2)}$ (per-column) and the $\\ell_2$ term from the Frobenius ball (global). HW1 Q1(b) swapped them.","o":["$\\lambda$ controls global perturbations, $\\mu$ feature-wise","$\\lambda$ controls feature-wise perturbations, $\\mu$ global perturbations","both control label noise","neither has a robust interpretation"],"a":1},{"sec":3,"q":"Robustifying $\\ell_2$ regression against label noise $\\|\\delta\\|_2 \\le \\lambda$ gives:","x":"The worst $\\delta$ points along the residual and adds exactly $\\lambda$, which doesn't depend on $\\beta$ and so doesn't regularize.","o":["$\\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_2$","$\\|y - X\\beta\\|_2 + \\lambda$, a constant shift","$\\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_1$","an NP-hard problem"],"a":1},{"sec":3,"q":"Rec 2 poll: 50 features from different sources, each possibly off by up to $\\rho$ at the same time. The right set is:","x":"Each feature needs its own budget, which is the per-column set $\\mathcal U_{(1,2)}$. The Frobenius ball's shared budget would force most columns to be nearly exact.","o":["$\\|\\Delta\\|_{F_2} \\le \\rho$","$\\|\\Delta\\|_{(1,2)} \\le \\rho$","either one","$\\|\\Delta\\|_{\\sigma_2} \\le \\rho$"],"a":1},{"sec":3,"q":"How does the solver-ready form of $\\min_\\beta \\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$ look?","x":"The epigraph gives a second-order cone constraint and the absolute values become two linear constraints each. No binaries are needed.","o":["$\\min t + \\rho\\sum_j a_j$ s.t. $\\|y - X\\beta\\|_2 \\le t$, $-a_j \\le \\beta_j \\le a_j$","$\\min t$ s.t. $t \\ge \\|y - X\\beta\\|_2^2 + \\rho\\|\\beta\\|_1$ with binaries","an LP with $\\|y - X\\beta\\|_2$ linearized by $\\pm$ constraints","a semidefinite program"],"a":0},{"sec":3,"q":"HW1's set $\\mathcal B = \\{\\|\\delta_i\\|_1 \\le \\rho\\ \\forall i\\}$ combined with $\\ell_\\infty$ loss produces which penalty?","x":"$\\mathcal B = \\mathcal U_{(\\infty,\\infty)}$, so the penalty uses first index $\\infty$. Intuitively, a liar with an $\\ell_1$ budget dumps it all on the largest coefficient.","o":["$\\rho\\|\\beta\\|_1$","$\\rho\\|\\beta\\|_2$","$\\rho\\|\\beta\\|_\\infty$","$n\\rho\\|\\beta\\|_\\infty$"],"a":2},{"sec":3,"q":"For $n = 1$, $p = 2$, when is the box $\\mathcal A$ ($|\\Delta_{1j}| \\le \\lambda$) contained in the diamond $\\mathcal B$ ($\\|\\delta_1\\|_1 \\le \\rho$)?","x":"The box corner $(\\lambda, \\lambda)$ has $\\ell_1$ norm $2\\lambda$; it lies in the diamond iff $2\\lambda \\le \\rho$. With $p$ features this becomes $p\\lambda \\le \\rho$.","o":["$\\rho \\le \\lambda$","$2\\lambda \\le \\rho$","$\\lambda = \\rho$","never"],"a":1},{"sec":3,"q":"(Book) With $\\ell_2$ loss and a box ($F_\\infty$) uncertainty set, robustness and regularization are:","x":"Example 2.1: equivalence holds only for matching norms or $r \\in \\{1,\\infty\\}$. Here the discrepancy factor $\\delta_n(2,\\infty) = \\sqrt n$ separates the bounds.","o":["exactly equivalent with penalty $\\lambda\\|\\beta\\|_1$","not equivalent; the robust problem lies between penalties $\\lambda\\|\\beta\\|_1$ and $\\lambda\\sqrt n\\|\\beta\\|_1$","equivalent to ridge","unrelated"],"a":1},{"sec":3,"q":"Which statement about the Lec 2 experiments is correct?","x":"Robustness improved out-of-sample MSE across UCI datasets, Rob 2-2 was best in 6 of 8, and the computational cost was small.","o":["OLS won on most datasets","All robust variants beat OLS out of sample, with the ridge-type (2-2) best on most datasets","Lasso won every dataset","Robust models were much slower to train"],"a":1},{"sec":4,"q":"Why does the big-M formulation of sparse regression have a weak LP relaxation?","x":"In the relaxation, the cardinality constraint barely binds because each $z_j$ can be very small, so the lower bound sits far below the true optimum.","o":["$M$ must be an integer","With $z_j \\in [0,1]$, a tiny $z_j = |\\beta_j|/M$ makes a coefficient fully active at almost no cost","The objective is nonconvex","SOS-1 constraints are dropped"],"a":1},{"sec":4,"q":"Rec 2 poll: if big-M is chosen smaller than $|\\beta_j^*|$, the solver:","x":"$\\beta = 0$ is always feasible, so the problem silently becomes \"no coefficient exceeds $M$\" and the solver proves optimality for that problem.","o":["reports infeasible","returns the true optimum, just slower","returns a suboptimal solution and reports it as optimal","issues a warning"],"a":2},{"sec":4,"q":"The hard-thresholding operator $H_k(u)$:","x":"$H_k$ is the exact Euclidean projection onto $\\{\\|\\beta\\|_0 \\le k\\}$. Soft thresholding (shrink) is the Lasso's opera
