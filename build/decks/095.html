H_{q+1}$ at $\\beta_k$ with a subgradient, giving an LP whose solution is $\\beta_{k+1}$. Objective values decrease monotonically and converge to a stationary point at rate $O(1/K)$.","k":["DC decomposition H_q − H_{q+1}","H_m is a top-k sum, convex","LP dual of H_m","Linearize H_{q+1} with subgradient","Solve LP each iteration","Monotone decrease, O(1/K)"],"x":"The same top-$k$ dual from stable regression appears here, a nice cross-lecture connection."},{"sec":7,"q":"Compare LS, LAD, LMS/LMAD and LQAD in terms of robustness and computational difficulty.","m":"LS minimizes squared residuals: closed form but breakdown point 0, since one outlier can move it arbitrarily. LAD minimizes absolute residuals: an LP, more resistant to $y$ outliers but still breakdown 0 because of leverage points. LMS (Rousseeuw) and LMAD minimize the median residual: 50% limiting breakdown point but NP-hard (Bernholt), with exact enumeration $O(n^p)$ only feasible for tiny problems. LQAD generalizes to the $q$-th quantile. The course solves LQAD with an MIO warm-started by heuristics, scaling to $n \\approx 10^4$.","k":["LS: easy, breakdown 0","LAD: LP, breakdown 0 (leverage points)","LMS/LMAD: 50% breakdown, NP-hard","Enumeration O(n^p)","LQAD generalizes with q","MIO + heuristics scales"],"x":"Robustness and tractability trade off, and MIO shifts the frontier."},{"sec":9,"q":"Derive the robust counterpart of logistic regression under feature uncertainty $\\mathcal U_x = \\{\\|\\Delta x_i\\|_q \\le \\rho\\ \\forall i\\}$.","m":"The robust problem is $\\max_{\\beta,\\beta_0}\\min_{\\Delta X\\in\\mathcal U_x}\\sum_i g(\\omega_i)$ with $\\omega_i = y_i(\\beta^\\top(x_i + \\Delta x_i) + \\beta_0)$ and $g(\\omega) = -\\log(1 + e^{-\\omega})$. Since $g'(\\omega) = 1/(1 + e^\\omega) > 0$, $g$ is increasing, so the inner min decouples into minimizing each margin over $\\|\\Delta x_i\\|_q \\le \\rho$. That is $y_i(\\beta^\\top x_i + \\beta_0) - \\max_{\\|\\Delta x_i\\|_q \\le \\rho} y_i\\beta^\\top\\Delta x_i = y_i(\\beta^\\top x_i + \\beta_0) - \\rho\\|\\beta\\|_{q^*}$ by the dual norm definition. Substituting: $\\max_{\\beta,\\beta_0} -\\sum_i\\log(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0) + \\rho\\|\\beta\\|_{q^*}})$.","k":["Write margin with perturbation","Loss increasing in margin","Decouple into per-point margin minimization","Dual norm gives ρ||β||_{q*}","Penalty inside the exponent"],"x":"The shape of the result (dual norm, inside the loss) is the key thing to remember."},{"sec":9,"q":"Explain how label-robust logistic regression ($\\le\\Gamma$ flipped labels) becomes a single convex problem with no integer variables.","m":"Write a flipped label as $y_i(1 - 2\\Delta y_i)$ with $\\Delta y_i\\in\\{0,1\\}$. Each loss term $f_i(\\Delta y_i)$ takes only two values, so $f_i(\\Delta y_i) = [f_i(1) - f_i(0)]\\Delta y_i + f_i(0)$, linear in $\\Delta y_i$, with $f_i(1) - f_i(0) = \\log\\frac{1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)}}{1 + e^{y_i(\\beta^\\top x_i + \\beta_0)}}$. The set $\\{0 \\le \\Delta y \\le 1, \\sum\\Delta y_i \\le \\Gamma\\}$ has integer vertices, so the binary inner min equals its LP relaxation. By strong duality, replace it with the dual max using $\\mu \\le 0$ (budget) and $\\nu_i \\le 0$ (upper bounds): objective $-\\sum\\log(1 + e^{-y_i(\\cdot)}) + \\Gamma\\mu + \\sum\\nu_i$ s.t. $\\mu + \\nu_i \\le f_i(1) - f_i(0)$. Merging with the outer max gives one continuous problem.","k":["Flip as y_i(1 − 2Δy_i)","Each term linear in binary Δy_i","Integral polytope → LP relaxation exact","Strong duality with μ, ν_i","Merge max–max","No integers remain"],"x":"This is the same relax–dualize recipe as stable regression, applied to labels."},{"sec":9,"q":"Summarize the empirical findings on robust classification and the rule for when to use it.","m":"Across 75 UCI datasets (60/20/20 splits, five repeats), feature-, label- and both-robust LR and SVM beat their nominal versions more often than they lost; robust-in-both was strongest, and robust LR was about twice as likely to be best. Gains were largest when nominal in-sample accuracy was low (e.g. +7.7% for LR below 60% accuracy) and near zero above 90%. The rule $\\log_{10}(p) \\ge 0.05a - 2.5$ (high dimension $p$, low nominal accuracy $a$) identifies datasets where robust-in-both LR went 17–2–1 with ~4% improvement. Robust methods also beat regularized ones in that region, at a cost of up to 1–2 orders of magnitude more time for label robustness.","k":["75 UCI datasets, validation-tuned","Robust beats nominal more often","Robust-in-both best","Gains largest at low nominal accuracy","Decision rule log10(p) ≥ 0.05a − 2.5","~4% gain above line","Label robustness slower"],"x":"The rule is useful because it uses only training-time information."},{"sec":8,"q":"Define sensitivity, specificity, accuracy, baseline and AUC, and explain how the threshold $t$ affects them using the quality-of-care example.","m":"Sensitivity $= TP/(TP+FN)$, specificity $= TN/(TN+FP)$, accuracy $= (TP+TN)/n$, baseline = share of the majority class (74.8% good care), AUC = area under the ROC curve (TPR vs. FPR over all thresholds), equal to the probability that a random positive outranks a random negative. Raising $t$ predicts poor care less often: at $t = 0.2$ sens 0.64/spec 0.73, at $0.5$ sens 0.40/spec 0.95, at $0.7$ sens 0.32/spec 0.99. Train accuracy at $t = 0.5$ is 80.8% vs. a 74.8% baseline; test accuracy is 81.3%.","k":["Sensitivity and specificity formulas","Accuracy and baseline","AUC definition and ranking interpretation","Higher t → higher spec, lower sens","Numbers at t = 0.2, 0.5, 0.7","Compare with baseline"],"x":"Always compare accuracy with the baseline; the gain over 74.8% is the model's real value."},{"sec":10,"q":"(Book) Explain how the dual method from sparse regression extends to sparse classification when no closed form exists.","m":"Regularized classification $\\min_\\beta\\sum_i\\ell(y_i, \\beta^\\top x_i) + \\tfrac1{2\\gamma}\\|\\beta\\|^2$ has (for convex $\\ell$) the dual $\\max_\\alpha -\\sum_i\\hat\\ell(y_i, \\alpha_i) - \\tfrac\\gamma2\\alpha^\\top XX^\\top\\alpha$ s.t. $e^\\top\\alpha = 0$, with $\\hat\\ell$ the Fenchel conjugate. Adding $\\|\\beta\\|_0 \\le k$ via support $s$ replaces $XX^\\top$ by $\\sum_j s_jX_jX_j^\\top$, giving $\\min_{s\\in S_k}c(s)$ with $c$ convex. For each $s$, $c(s)$ is evaluated by solving the dual numerically, and the gradient comes free: $\\partial c/\\partial s_j = -\\tfrac\\gamma2(\\alpha^{*\\top}X_j)^2$. Outer approximation with lazy constraints then solves it exactly, with a Lasso warm start.","k":["Regularized classification dual with Fenchel conjugate","Support s enters via Σ s_j X_j X_jᵀ","c(s) convex","Evaluate c numerically per s","Gradient from optimal α","Outer approximation with lazy constraints"],"x":"The method only needs function values and gradients, not a closed form, which is why it generalizes."},{"sec":11,"q":"Write the full holistic regression MIO (including significance) and explain what each constraint enforces.","m":"$\\min_{\\beta,z,b}\\tfrac12\\|y - X\\beta\\|_2^2 + \\Gamma\\|\\beta\\|_1$ s.t. $z_i, b_i\\in\\{0,1\\}$; $-Mz_i \\le \\beta_i \\le Mz_i$ (big-M link); $\\sum_iz_i \\le k$ (sparsity); $z_i = z_l$ for $i,l\\in GS_m$ (group sparsity); $z_i + z_j \\le 1$ for $(i,j)\\in HC$ (limited pairwise multicollinearity); $\\sum_{i\\in T_m}z_i \\le 1$ (at most one transformation); $\\frac{\\beta_j}{\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}} + Mb_j \\ge t_\\alpha z_j$ and $-\\frac{\\beta_j}{\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}} + M(1 - b_j) \\ge t_\\alpha z_j$ (significance, with $b_j$ choosing the sign). The $\\ell_1$ term gives robustness. (Book adds $\\sum_{i\\in\\mathrm{Supp}(a)}z_i \\le |\\mathrm{Supp}(a)| - 1$ for global multicollinearity.)","k":["Objective with Γ||β||_1 for robustness","Big-M link","Sparsity Σz ≤ k","Group sparsity equality","Pairwise collinearity exclusion","One transformation per variable","Significance with sign binary b_j"],"x":"Every property becomes a linear constraint on binaries, so the problem stays an MIQO that commercial solvers handle."},{"sec":11,"q":"Explain how statistical significance is modeled in holistic regression and why it requires a binary variable beyond $z_j$.","m":"Under $\\epsilon \\sim N(0, \\sigma^2I)$, $(\\hat\\beta_j - \\beta_j)/(\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}) \\sim t_{n-p}$, with $\\tilde\\sigma^2 = Y^\\top(I - X(X^\\top X)^{-1}X^\\top)Y/(n - p)$. A selected variable must satisfy $|\\beta_j|/\\text{se}_j \\ge t_\\alpha$, where $t_\\alpha = T^{-1}_{n-p}(1 - \\alpha/2)$. Requiring an absolute value to be large is nonconvex (two disjoint regions), so binary $b_j$ selects the region: with $b_j = 0$ the first constraint forces $\\beta_j/\\text{se}_j \\ge t_\\alpha$; with $b_j = 1$ the second forces $-\\beta_j/\\text{se}_j \\ge t_\\alpha$. Big-M deactivates the other one, and $z_j = 0$ makes both vacuous.","k":["t-statistic distribution under Gaussian errors","σ̃² formula","t_α two-sided cutoff","|β_j|/se ≥ t_α is nonconvex","Binary b_j selects the sign","Big-M deactivates the other branch","z_j = 0 relaxes both"],"x":"Significance constraints depend on the Gaussian assumption; synthetic results show more false positives with heavy-tailed errors."},{"sec":11,"q":"Compare the manual model-building process with holistic regression, using the Croq'Pain and Ames examples.","m":"Manual practice transforms variables, inspects correlations, drops correlated and insignificant variables one at a time, examines residuals and iterates. It has no guarantee of satisfying all goals and doesn't scale. Croq'Pain: with 14 variables manual analysis (sequential $t$-test pruning) reaches SIZE, P15, INC, NREST, PRICE; holistic regression finds the same 5 in about a minute, all significant, with validation $R^2 = 0.80$. Ames (2,271 × 315): manual work gives either a 2-variable model ($R^2 = 0.8$) or a 36-variable model after a day ($R^2 = 0.92$); holistic regression gives 20 significant variables with test $R^2 = 0.92$. So holistic regression saves time on small problems and improves outcomes on large ones.","k":["Manual steps applied sequentially","No guarantee / doesn't scale","Croq'Pain: same 5 variables in ~1 min","Ames: 20 variables, R² 0.92 vs 36-variable manual","Time savings and better models at scale"],"x":"The point is not just accuracy; it's reaching a model that satisfies all properties with a guarantee."},{"sec":11,"q":"(Book) Describe how holistic regression handles global multicollinearity beyond pairwise correlations.","m":"An $\\varepsilon$-multicollinear relationship is $a$ with $\\|a\\| = 1$ and $\\|\\sum_ja_jX_j\\| \\le \\varepsilon$. Theorem 5.1 links such relationships to the span $V$ of eigenvectors of $X^\\top X$ with small eigenvalues: relationships lie within $O(\\sqrt\\varepsilon)$ of $\\mathrm{Span}(V)$, and vice versa. Algorithm 5.1 repeatedly solves an MIO for a minimum-support vector $a \\in \\mathrm{Span}(V)$ (nonzero, enforced by a lower bound on $\\sum|\\lambda_i|$), adds $\\sum_{i\\in\\mathrm{Supp}(a)}z_i \\le |\\mathrm{Supp}(a)| - 1$, and repeats until infeasible. Minimum support gives the most stringent constraints; different bases of $V$ would give weaker, non-equivalent constraints.","k":["ε-multicollinear definition","Small eigenvalues of XᵀX","Span(V) characterizes relationships","MIO for minimum-support a","Constraint excludes full support","Iterate until infeasible"],"x":"This catches dependencies such as $x_1 + x_2 \\approx x_3$ that a pairwise threshold misses."},{"sec":12,"q":"Name the recurring algorithmic and modeling patterns from Lectures 2–7 and give at least one example of where each is used.","m":"(1) Robustness → regularization via dual/induced norms (ridge, Lasso, feature-robust logistic). (2) Relax an inner binary problem with integral vertices, then dualize (stable regression, label-robust logistic, top-$k$ sums in SLO). (3) Cutting planes / delayed constraint generation (robust regression scenarios, sparse regression outer approximation, sparse classification, convex regression, holistic multicollinearity). (4) Heuristic warm start + MIO certification (hard thresholding, SLO + subgradient, Lasso warm start). (5) Binary modeling with big-M and logical constraints (best subset, LQAD, holistic regression). Plus the primal vs. dual trade-off: flexible big-M vs. scalable binary-convex reformulations.","k":["Robustness ↔ regularization","Relax + dualize over integral polytopes","Cutting planes / constraint generation","Heuristic + MIO certification","Binary/big-M logic","Primal vs. dual trade-off"],"x":"Organizing the course by these patterns makes it much easier to tackle unseen exam problems."},{"sec":13,"q":"Formulate the HW1 Part B robust sparse regression problem as an MILP, explaining every variable, starting from $\\min_\\beta\\max_{\\Delta\\in\\mathcal A,\\Delta'\\in\\mathcal B}\\|y - (X + \\Delta + \\Delta')\\beta\\|_\\infty$ s.t. $\\|\\beta\\|_0 \\le k$.","m":"$\\mathcal A = \\mathcal U_{(1,\\infty)}$ (radius $\\lambda$) gives $\\lambda\\|\\beta\\|_1$ and $\\mathcal B = \\mathcal U_{(\\infty,\\infty)}$ (radius $\\rho$) gives $\\rho\\|\\beta\\|_\\infty$, so the objective is $\\|y - X\\beta\\|_\\infty + \\lambda\\|\\beta\\|_1 + \\rho\\|\\beta\\|_\\infty$. MILP: $\\min u + \\lambda\\sum_jt_j + \\rho w$ s.t. $-u \\le y_i - x_i^\\top\\beta \\le u$ for all $i$ ($u$ is the max residual); $-t_j \\le \\beta_j \\le t_j$ ($t_j = |\\beta_j|$); $-w \\le \\beta_j \\le w$ for all $j$ ($w = \\|\\beta\\|_\\infty$); $-M_js_j \\le \\beta_j \\le M_js_j$, $\\sum_js_j \\le k$, $s_j\\in\\{0,1\\}$ (sparsity).","k":["Identify A and B as induced sets","Penalties λ||β||_1 and ρ||β||_∞","u for ℓ∞ loss (one scalar)","t_j per coefficient for ℓ1","single w for ℓ∞ penalty","Big-M sparsity with Σs ≤ k"],"x":"The sum/max distinction decides how many auxiliary variables you need."},{"sec":13,"q":"Explain why an infeasible primal LP does not imply an unbounded dual, using HW1 Q1(a).","m":"Duality theory allows four combinations: both optimal (equal values), primal unbounded and dual infeasible, primal infeasible and dual unbounded, or both infeasible. In Q1(a), $x \\le y$ and $y \\le x - 1$ make the primal infeasible. The dual of $\\max c^\\top x$, $Ax \\le b$, $x \\ge 0$ is $\\min b^\\top p$, $A^\\top p \\ge c$, $p \\ge 0$: here $p_1 - p_2 \\ge 1$ and $-p_1 + p_2 \\ge 2$, which sum to $0 \\ge 3$, so the dual is infeasible too, not unbounded.","k":["Four primal–dual status combinations","Primal infeasible here","Write the dual correctly","Dual constraints contradict","Both infeasible"],"x":"Always write and check the dual instead of relying on a single implication."},{"sec":4,"q":"Explain why the big-M formulation of best subset selection is hard for solvers, and describe two ways the course addresses this.","m":"Big-M needs a valid bound $M \\ge |\\beta_j^*|$ that isn't known in advance, and its LP relaxation is weak because tiny fractional $z_j = |\\beta_j|/M$ let coefficients be fully active at little cost, so lower bounds are poor and branch-and-bound is slow. Too small an $M$ silently gives a suboptimal answer. The course addresses this by (1) computing tight data-driven $M$ via convex bounding problems and warm-starting the MIO with the discrete first-order method, so the MIO mainly certifies; and (2) the dual reformulation $\\min_{s\\in S_k}\\tfrac12y^\\top(I + \\gamma\\sum_js_jK_j)^{-1}y$, which removes $\\beta$ and big-M entirely and is solved by outer approximation at $n,p \\sim 10^5$.","k":["M must be known in advance","Weak LP relaxation via tiny fractional z","Too-small M silently suboptimal","Tight M from convex bounding problems","Warm start with first-order method","Dual binary-convex reformulation removes big-M"],"x":"The contrast between these two routes is the core of Lec 3."},{"sec":4,"q":"Explain why exact sparse regression via the dual can be faster than Lasso at large $n$, and why this matters statistically.","m":"Above the phase-transition threshold (large $n/k$), the outer approximation needs very few cuts (often one), and each cut costs about $O(k^3 + nk)$ with tailored computation, so total time is seconds to minutes, which the book shows is faster than glmnet at $n, p \\sim 10^5$. Statistically, the same regime gives perfect support recovery with near-zero false discoveries, whereas Lasso keeps many false features. So the main computational argument for using Lasso as a substitute for best subset disappears, while exact methods give more interpretable and correct models.","k":["Few cuts above the threshold","Cheap tailored cuts O(k³ + nk)","Faster than Lasso in experiments","Perfect support recovery, low false discovery","Lasso adds false features","Removes the computational case for Lasso"],"x":"\"More data makes it easier\" is the counterintuitive complexity point of Lec 3."},{"sec":5,"q":"Why does stable regression improve stability more than accuracy, and why do its gains shrink as the training fraction grows?","m":"With random splits, coefficients, support and $\\lambda$ vary from split to split; stable regression replaces that random choice with a deterministic worst case, so most of the split-to-split variance disappears, giving large stability gains (20–80%). Accuracy only improves modestly (3–5%) because the fitted model is similar on average. As the training fraction grows, random training sets overlap more and resemble the full data, so there is less room for an unlucky split, and the advantage over randomization shrinks (book: 15.1% at 50/50 vs 5.5% at 70/30 for unregularized MSE).","k":["Random splits cause variance","Optimization removes split dependence","Large stability, modest accuracy gains","Larger training fractions reduce split variability","Gains shrink with training fraction"],"x":"The method attacks variance from randomization, which is why stability metrics move the most."},{"sec":6,"q":"List the extensions of convex regression covered in Lec 5 and the book and how each is modeled.","m":"(1) Monotone in each coordinate: sign constraints $\\xi_i \\ge 0$ (or $\\le 0$) for all $i$. (2) Bounded subgradients / Lipschitz: $\\|\\xi_i\\|_r \\le L$, conic for $r\\in\\{1,2,\\infty\\}$, and can be added lazily as violated. (3) Sparse convex regression: subgradients share a support of size $\\le k$; primal MIQO with binaries $z_j$ and $|(\\xi_i)_j| \\le Mz_j$, $\\sum z_j \\le k$, or the dual binary-convex reformulation solved with cutting planes ($(n,p,k) = (10^4,10^2,10)$ in minutes).","k":["Monotone via sign constraints","Lipschitz via norm bounds on ξ","Conic constraints, lazy addition","Sparse via common support of size k","Primal MIQO with z_j","Dual approach with cuts"],"x":"All shape requirements are constraints on the slope variables, which keeps them easy to add."},{"sec":6,"q":"Explain why the convex regression QP is solved with delayed constraint generation instead of directly, and why the final solution is optimal for the full problem.","m":"The full QP has $n(n-1)$ dense constraints, about $10^{10}$ at $n = 10^5$, too many to build or solve, yet most are slack at the optimum. Starting from a small set (a chain), the reduced QP is a relaxation, so its optimal value is a lower bound. Each round, a cheap separation scan finds for each point the constraint its tangent violates most and adds it. When no constraint is violated beyond $\\varepsilon$, the reduced solution is feasible for the full problem; being optimal for a relaxation and feasible for the original, it is optimal for the original (up to $\\varepsilon$).","k":["n(n−1) constraints too many","Most constraints slack","Reduced problem is a relaxation (lower bound)","Separation adds most violated constraints","Feasible for full problem at termination","Relaxation optimum + feasibility ⇒ optimal"],"x":"This relaxation-plus-feasibility argument is the general correctness proof for constraint generation."},{"sec":7,"q":"Explain why LQAD is described as \"subset selection over samples,\" and contrast it with stable regression.","m":"LQAD's objective $\\min_\\beta|r_{(q)}|$ equals $\\min_{|I| = q}\\min_\\beta\\|y_I - X_I\\beta\\|_\\infty$: it chooses the best $q$ samples and fits them in the Chebyshev sense, ignoring the other $n - q$ (potential outliers). This is a minimization over subsets, nonconvex in $\\beta$ and NP-hard, so it needs MIO. Stable regression instead maximizes over subsets (the hardest $k$ samples), which for fixed $\\beta$ is a linear problem over an integral polytope and can be dualized into a convex problem.","k":["Equivalence with best-q Chebyshev fit","Min over subsets of samples","Nonconvex, NP-hard → MIO","Stable regression maxes over subsets","Max is LP-dualizable → convex"],"x":"Same \"subset of samples\" idea, opposite direction, very different tractability."},{"sec":8,"q":"Explain why logistic regression uses $\\pm1$ labels and a margin-based loss, and compare the logistic, hinge and 0–1 losses.","m":"With $y\\in\\{-1,+1\\}$, $P(Y = y_i) = 1/(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)})$ for both classes, so the negative log-likelihood is $\\sum_i\\log(1 + e^{-m_i})$ with margin $m_i = y_i(\\beta^\\top x_i + \\beta_0)$. The 0–1 loss $\\mathbb 1\\{m_i \\le 0\\}$ is what we want but is nonconvex and discontinuous. The logistic loss is smooth and convex, positive for all margins, and roughly linear for very negative margins. The hinge loss $\\max(0, 1 - m_i)$ is convex and piecewise linear, zero for $m_i \\ge 1$ (only support vectors matter), and leads to LPs.","k":["±1 labels make one formula for both classes","Margin definition","0–1 loss nonconvex","Logistic smooth convex surrogate","Hinge zero beyond margin 1","Hinge gives LP structure"],"x":"The margin form is what makes the robust counterparts simple: the feature adversary just reduces each margin."},{"sec":8,"q":"A classifier has 81% test accuracy on data where 75% of cases are negative. How should you evaluate it, and which metrics would you report?","m":"Compare it with the baseline (predict the majority class), which gets 75%, so the real gain is only about 6 points. Report the confusion matrix with sensitivity $TP/(TP+FN)$ and specificity $TN/(TN+FP)$, because accuracy can hide poor detection of the minority class. Report AUC for threshold-free discrimination, and choose the threshold from the ROC curve according to the relative costs of false negatives and false positives.","k":["Compare against majority baseline","Gain over baseline is what matters","Confusion matrix","Sensitivity and specificity","AUC threshold-free","Threshold from costs via ROC"],"x":"This mirrors the quality-of-care example: 81.3% test accuracy vs. a 74.8% baseline."},{"sec":9,"q":"Compare how robustness enters linear regression (Lec 2) and logistic regression (Lec 6).","m":"In linear regression, robustness against $\\Delta X$ in a norm ball becomes an additive penalty on the loss: $\\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_{q^*}$ (Frobenius) or $+\\rho\\|\\beta\\|_r$ (induced). In logistic regression, feature robustness (row-wise $\\ell_q$ balls) reduces each margin by $\\rho\\|\\beta\\|_{q^*}$, so the penalty appears inside the exponent of the logistic loss rather than as an additive $\\ell_1$ term. Label robustness has no regression analogue in Lec 2: it requires relaxing the binary flip set and dualizing. In both cases the dual norm of the perturbation norm appears.","k":["Regression: additive norm penalty","Frobenius → dual norm, induced → r-norm","Logistic: margin shrinks by ρ||β||_{q*}","Penalty inside the loss","Label robustness via relaxation + duality","Dual norm in both"],"x":"The book stresses that RO for classification does not reduce to the usual $\\ell_1$-penalized logistic regression."},{"sec":12,"q":"Contrast the primal (big-M) and dual (binary convex) approaches to discrete ML problems, with examples of when each is preferred.","m":"Primal: model $\\beta$ and binaries $z$ directly with big-M links; flexible, so easy to add side constraints (groups, collinearity, transformations, significance in holistic regression; sparse convex regression's MIQO; stable regression support recovery). It scales to $n,p$ in the thousands and depends on a tight $M$ and warm starts. Dual: eliminate continuous variables in closed form or via a dual problem and optimize a convex function over binary supports with outer approximation (sparse regression, sparse classification, sparse convex regression). Much more scalable ($n,p \\sim 10^5$) but needs structure (closed-form or cheap dual evaluation of $c(s)$ and its gradient).","k":["Primal: β and z with big-M","Flexible for side constraints","Scales to thousands","Dual: convex function of support s","Outer approximation","Scales to 10^5 but needs structure"],"x":"Choosing between them is a standard design question for any new sparse ML problem."},{"sec":14,"q":"Describe how CART builds a classification tree: the growing criterion, the stopping rules and pruning. Compute the misclassification, Gini and entropy impurity of a node with 2 blue and 5 red points, and explain why CART grows with Gini or entropy instead of misclassification.","m":"CART grows greedily top-down: at each node it tries every feature $j$ and threshold $b$ and takes the split $x_j<b$ with the largest gain $n_tI(t)-n_LI(L)-n_RI(R)$, then recurses. It stops at a pure node, at depth $D$, or when a child would get fewer than $N_{\\min}$ (`minbucket`) points. It then prunes bottom-up, collapsing subtrees that remove fewer than $\\alpha$ errors per split, with $\\alpha$ (`cp`) tuned on validation data. For $p=(2/7,5/7)$: misclassification $1-5/7\\approx0.29$, Gini $1-(4+25)/49\\approx0.41$, entropy $\\approx0.60$ (natural log). Misclassification gain counts errors removed, which is zero whenever both children keep the parent's majority class, so growth can stall before a split that sets up a later good one. Gini and entropy are strictly concave in the class proportions, so any purer child earns positive gain and later splits turn that purity into fewer errors.","k":["Greedy top-down: best split by impurity gain over all features/thresholds","Stopping: pure node, depth $D$, $N_{\\min}$","Prune by error $+\\ \\alpha\\cdot$splits, $\\alpha$ tuned on validation","Impurities 0.29 / 0.41 / 0.60","Misclassification gain zero when majority unchanged; concave impurities reward purity"],"x":"Graders want the three numbers right and the concavity argument, not just \"Gini works better\"."},{"sec":14,"q":"Compare random forests and gradient-boosted trees: how each builds and combines trees, what each new tree fits, and what both give up relative to a single CART tree.","m":"A random forest grows many deep CART trees in parallel, each on a bootstrap sample ($n$ rows drawn with replacement) and with only a random subset of features available (Book: $\\sqrt p$ per split); it predicts by majority vote or average. The randomness decorrelates the trees, so averaging reduces variance. `ntree` must not be too small because each bootstrap sample misses about $e^{-1}\\approx37\\%$ of rows. Boosting grows small trees in sequence: $f$ is the current sum, each new tree $h$ fits the residuals $y-f(x)$ and is added at learning rate $\\eta$: $f\\leftarrow f+\\eta h$. For classification $f$ is the log-odds and each tree fits $y-\\hat p(x)$. Boosting reduces bias by correcting the ensemble's current mistakes. Both are much more accurate than CART but are sums or votes over hundreds of trees, so they lose the single interpretable tree (Breiman: forests are A+ predictors, F on interpretability).","k":["RF: deep trees, parallel, bootstrap rows + random features, vote/average","Boosting: small trees, sequential, fit residuals, add with $\\eta$","Classification boosting fits $y-\\hat p$ on log-odds scale","RF reduces variance; boosting reduces bias","Both lose interpretability"],"x":"Look for the parallel/sequential and bootstrap/residual contrasts and the interpretability cost."},{"sec":14,"q":"Summarize the SCOTUS case from Lec 8: the prediction task, Martin's model, the comparison with experts and its result. Then explain why selecting `minbucket` by test-set accuracy is wrong and how $k$-fold cross-validation fixes it.","m":"Task: predict whether Justice Stevens (and the Court) reverses or affirms the lower court, using cases from 1994–2001, when the same nine justices served, with coarse features: circuit of origin, issue area, petitioner and respondent type, ideological direction of the lower-court decision, and whether the petitioner argued a law was unconstitutional. CART was chosen over logistic regression because a tree is a readable decision rule. Martin trained on 628 cases and predicted the 68 cases of October 2002 in advance: two trees for unanimous liberal/conservative outcomes, then per-justice trees with a majority vote. Against 83 experts, the model got 75% of case outcomes vs 59%; on individual justices it roughly tied (67% vs 68%). Choosing `minbucket` by test accuracy uses the test set for model selection, so the reported accuracy is optimistic. $k$-fold CV splits the training set into $k$ folds, trains on $k-1$ and scores the held-out fold for each candidate value, averages over folds, picks the best, refits on all training data, and only then evaluates once on the test set.","k":["Same nine justices 1994–2001; coarse case features","Two-stage CART: unanimity trees, then per-justice trees with majority vote","75% vs 59% case outcomes; 67% vs 68% justices","Test-set selection leaks information, biasing accuracy upward","$k$-fold CV procedure and final refit"],"x":"Both parts are needed; the 75/59 vs 67/68 distinction is a common slip."},{"sec":15,"q":"Using Lec 9's quadrant example (objective $0.25$ with no split, $0.25+\\alpha$ with one, $0+2\\alpha$ with two), explain how a strong split can hide behind a weak one. What does greedy growth return, when is the two-split tree optimal, and how does grow-then-prune partly fix this?","m":"Greedy growth under error $+\\ \\alpha\\cdot$complexity adds a split only if that split by itself lowers the objective. In the quadrant data the first split leaves the error at 0.25 and adds $\\alpha$, so for every $\\alpha>0$ greedy stops at the empty tree, even though a second split would remove all error. The two-split tree beats the empty tree when $2\\alpha<0.25$, i.e. $\\alpha<0.125$; the one-split tree is never optimal. CART's fix is to grow first with an impurity measure, ignoring $\\alpha$, until no more splits are possible, which exposes the strong second split, and then prune bottom-up by error $+\\ \\alpha\\cdot$splits. With $\\alpha=0.1$, pruning keeps both splits (cost 0.2 vs 0.25). The fix is partial: pruning only searches subtrees of the greedy tree, and growth still optimizes an impurity, not the error.","k":["Greedy needs each split to pay for itself immediately","Greedy returns the empty tree for all $\\alpha>0$","Two-split tree optimal for $\\alpha<0.125$","Grow deep (impurity) then prune by error $+\\ \\alpha$","Pruning limited to subtrees of greedy tree"],"x":"The $\\alpha<0.125$ threshold and the reason pruning is only a partial fix are the discriminating points."},{"sec":15,"q":"Why is CART greedy at all, and why does the course argue that this reason no longer holds? Address Breiman's 1984 remarks, the MIO speedup figures, and the NP-hardness of optimal trees.","m":"Breiman et al. acknowledged that the tree procedure is only one-step optimal and said that \"at this stage of computer technology, an overall optimal tree growing procedure does not appear feasible for any reasonably sized data set\". The greedy design, and the impurity measure that patches it (misclassification \"does not seem to appropriately reward splits that are more desirable in the context of the continued growth of the tree\"), were practical choices for 1984 computing, not claims that greedy is better. Since then MIO has become about 3.3 trillion times faster (Lec 9: software 2,117,000× from CPLEX 1.2 to Gurobi 7.5, hardware about 1,560,000×; Lec 1 updates this to 37.6 trillion). Optimal tree construction is NP-hard, but in the course's practability view that is a worst-case statement: what matters is solving real instances in useful time, which MIO and local search now do.","k":["Breiman: global optimum infeasible with 1984 technology","Impurity measure is a patch for one-step optimization","MIO speedup ~3.3 trillion× (Lec 9)","NP-hard is worst-case; practability is the criterion","Constraint was computational, so it has lapsed"],"x":"Credit the historical framing plus at least one quantitative speedup figure."},{"sec":15,"q":"Rec 5's ten-point example: describe the greedy tree, the XOR tree and why greedy cannot find the latter. Then explain what CART pruning can and cannot reach, and answer the objection that a globally optimal tree would simply overfit.","m":"Greedy picks root $x_1<0.25$ (2 errors, the pure corner of three blues), then $x_2<0.65$ on the right child, giving 1 error (point 7) at depth 2. The XOR tree uses root $x_2<0.5$ and $x_1<0.5$ on both sides and has 0 errors; in fact three distinct depth-2 trees reach 0 errors and none uses greedy's root. Greedy cannot find XOR because the root $x_2<0.5$ alone leaves 5 errors, no better than no split, while $x_1<0.25$ leaves 2; greedy scores one split at a time and commits to the wrong root. Pruning optimizes error $+\\ \\alpha\\cdot$splits but only over subtrees of the greedy tree (full tree for $\\alpha<1$, root only for $1<\\alpha<3$, single leaf for $\\alpha>3$), so the XOR tree is unreachable. On overfitting: complexity is controlled by $D$, $N_{\\min}$ and $\\alpha$ tuned on validation, exactly as for CART. In synthetic experiments with a known true tree, OCT recovers the structure better than CART with much lower false discovery, and the gap grows as $n$ falls or $p$ rises.","k":["Greedy: $x_1<0.25$ then $x_2<0.65$, 1 error","XOR: 0 errors; root $x_2<0.5$ alone has 5 errors","Pruning only searches subtrees of greedy tree","Overfitting controlled by $D$, $N_{\\min}$, $\\alpha$ on validation","Synthetic results: better recovery, lower FDR"],"x":"A strong answer uses the actual numbers (2 vs 5 errors) and separates search quality from overfitting control."},{"sec":16,"q":"Write the complete parallel OCT MIO (Rec 5 / Book (8.9) version) with index sets, and explain the role of each constraint block.","m":"$$\\min\\ \\frac1{\\hat L}\\sum_{t\\in\\mathcal L}L_t+\\alpha\\sum_{t\\in\\mathcal B}d_t$$ subject to: **errors** $L_t\\ge N_t-N_{kt}-n(1-c_{kt})$, $L_t\\le N_t-N_{kt}+n\\,c_{kt}$, $L_t\\ge0$ for $k\\in[K]$, $t\\in\\mathcal L$; **counts and labels** $N_{kt}=\\sum_{i:y_i=k}z_{it}$, $N_t=\\sum_iz_{it}$, $\\sum_kc_{kt}=l_t$ for $t\\in\\mathcal L$; **routing** $a_m^Tx_i+\\varepsilon\\le b_m+(1+\\varepsilon)(1-z_{it})$ for $m\\in A_L(t)$ and $a_m^Tx_i\\ge b_m-(1-z_{it})$ for $m\\in A_R(t)$, $i\\in[n]$, $t\\in\\mathcal L$; $\\sum_{t\\in\\mathcal L}z_{it}=1$ for $i\\in[n]$; **leaf size** $z_{it}\\le l_t$, $\\sum_iz_{it}\\ge N_{\\min}l_t$; **splits** $\\sum_ja_{jt}=d_t$, $0\\le b_t\\le d_t$ for $t\\in\\mathcal B$; **hierarchy** $d_t\\le d_{p(t)}$ for $t\\in\\mathcal B\\setminus\\{1\\}$; $z,l,c,a,d$ binary. The objective is normalized misclassification ($\\hat L$ = errors of the no-split tree) plus $\\alpha$ per split. Splits pick one feature and a threshold in $[0,1]$ or switch the node off ($d_t=0$ sends all points right). Routing forces each point into one leaf consistent with every test on its path. Leaf size applies $N_{\\min}$ only to used leaves. The error block linearizes $L_t=N_t-\\max_kN_{kt}$, with one label per used leaf.","k":["Normalized objective with $\\hat L$ and $\\alpha\\sum d_t$","Split block $\\sum_j a_{jt}=d_t$, $0\\le b_t\\le d_t$; hierarchy on $\\mathcal B\\setminus\\{1\\}$","Routing with $\\varepsilon$, $M=1+\\varepsilon$ / $1$, $\\sum_t z_{it}=1$","Leaf size via $l_t$","Error linearization with $\\sum_k c_{kt}=l_t$ and $M=n$"],"x":"Index sets ($A_L$/$A_R$, $\\mathcal B\\setminus\\{1\\}$) and the $\\sum_k c_{kt}=l_t$ constraint separate full from partial credit."},{"sec":16,"q":"Explain the OCT routing constraints in detail: why $\\varepsilon$ is needed and how it is chosen, why the big-M values $1+\\varepsilon$ and $1$ are valid, and how $d_t=0$ is handled. Verify the constraints for point 9 at $(0.8,0.3)$ in leaf 5 of Rec 5's XOR tree.","m":"For each point $i$ and leaf $t$: $a_m^Tx_i+\\varepsilon\\le b_m+(1+\\varepsilon)(1-z_{it})$ for every $m\\in A_L(t)$ and $a_m^Tx_i\\ge b_m-(1-z_{it})$ for every $m\\in A_R(t)$, with $\\sum_tz_{it}=1$. If $z_{it}=1$ the big-M terms vanish and the point must pass every test on the path; if $z_{it}=0$ both lines are slack. Going left is strict ($a^Tx<b$) and solvers need $\\le$; without $\\varepsilon$ a point exactly on a threshold satisfies both tests and could go either way. $\\varepsilon$ is chosen below the smallest gap between distinct values of a feature, so no valid split is lost (the Book uses per-feature gaps $\\epsilon_j$). Features are scaled to $[0,1]$ and $a_m$ is a 0/1 unit vector, so $a_m^Tx_i,b_m\\in[0,1]$: the left violation is at most $1+\\varepsilon$, the right at most 1. If $d_t=0$, then $a_t=0$ and $b_t=0$, the left test reads $\\varepsilon\\le0$ (impossible) and the right $0\\ge0$ (always), so all points go right. Point 9: $A_L(5)=\\{1\\}$, $A_R(5)=\\{2\\}$. Node 1 ($x_2<0.5$): $0.3+\\varepsilon\\le0.5$. Node 2 ($x_1<0.5$): $0.8\\ge0.5$. Both hold; all other leaves have $z_{9,t}=0$ and slack constraints.","k":["Constraint form with $A_L(t)$, $A_R(t)$ and $\\sum_t z_{it}=1$","$\\varepsilon$: strict inequality, below smallest feature gap","Big-M from $[0,1]$ scaling: $1+\\varepsilon$, $1$","$d_t=0$ ⇒ all points right","Point 9 check: $0.3+\\varepsilon\\le0.5$, $0.8\\ge0.5$"],"x":"The point-9 check must use the correct ancestor sets for leaf 5."},{"sec":16,"q":"Show how OCT linearizes the leaf error $L_t=N_t-\\max_kN_{kt}$. Justify $M=n$, explain whether the upper constraint is needed, work the Rec 5 leaf with points 4, 5, 7, and explain what goes wrong in Lec 9 slide 26's version.","m":"With binaries $c_{kt}$ and $\\sum_kc_{kt}=l_t$: $L_t\\ge N_t-N_{kt}-n(1-c_{kt})$ and $L_t\\le N_t-N_{kt}+n\\,c_{kt}$ for all $k$, and $L_t\\ge0$. For the predicted class ($c_{kt}=1$) the first line gives $L_t\\ge N_t-N_{kt}$; for other classes it is slack. For each non-predicted class the second line gives $L_t\\le N_t-N_{kt}$, so the predicted class must be a most common one. $M=n$ works because $0\\le N_t-N_{kt}\\le n$. The upper line does not change the optimum, since minimizing already prefers a majority label, but it removes minority-label solutions and tightens the formulation. Leaf with points 4, 5, 7 ($N_B=2$, $N_R=1$, $N_t=3$, $n=10$): predicting B gives $L\\ge1$ and $L\\le2$, minimized to $L=1$ (point 7); predicting R gives $L\\ge2$ and $L\\le1$, infeasible. Lec 9 slide 26 omits $\\sum_kc_{kt}=l_t$: with all $c_{kt}=0$ every first line is slack and only $0\\le L_t\\le\\min_k(N_t-N_{kt})$ remains, so $L_t=0$ is feasible and the error term vanishes. It also writes $d_t\\le d_{p(t)}$ for all $t\\in\\mathcal B$, though the root has no parent.","k":["Two big-M lines plus $L_t\\ge0$ and $\\sum_k c_{kt}=l_t$","$M=n$ since $0\\le N_t-N_{kt}\\le n$","Upper line: optimum unchanged, formulation tighter","Leaf 4,5,7: B gives $L=1$; R infeasible","Slide 26 erratum: all $c_{kt}=0$ gives $L_t=0$"],"x":"The erratum explanation must show why $L_t=0$ becomes feasible, not just say a constraint is missing."},{"sec":17,"q":"List every change needed to turn the parallel OCT MIO into OCT-H, and justify each one (coefficients, threshold, big-M, $\\varepsilon$, complexity term).","m":"Coefficients: $a_t\\in[-1,1]^p$ continuous with $\\sum_j\\lvert a_{jt}\\rvert\\le d_t$, linearized by $\\hat a_{jt}\\ge a_{jt}$, $\\hat a_{jt}\\ge-a_{jt}$, $\\sum_j\\hat a_{jt}\\le d_t$; this relaxes integrality and replaces $\\sum_ja_{jt}=1$ by a 1-norm bound, chosen because it linearizes easily, while $d_t=0$ still forces a zero split. Threshold: $-d_t\\le b_t\\le d_t$, since $a_t^Tx$ can now be negative. Big-M: with $\\|a_t\\|_1\\le1$ and $x\\in[0,1]^p$, $a_t^Tx_i$ and $b_t$ lie in $[-1,1]$, so their difference lies in $[-2,2]$ and $M=2$. $\\varepsilon$: a hyperplane can pass arbitrarily close to any point, so there is no smallest gap to compute; use a small constant (Book: $\\mu=0.005$, left constraint $a_m^Tx_i+\\mu\\le b_m+(2+\\mu)(1-z_{it})$). Complexity: penalize features used, $\\alpha\\sum_t\\sum_js_{jt}$, with $-s_{jt}\\le a_{jt}\\le s_{jt}$, $s_{jt}\\le d_t$, $\\sum_js_{jt}\\ge d_t$, because one hyperplane split can use many features. Everything else (hierarchy, routing structure, leaf size, labels, errors) is unchanged, which is why OCT-H is about as easy for the MIO as OCT.","k":["$a_t\\in[-1,1]^p$, $\\|a_t\\|_1\\le d_t$ linearized with $\\hat a$","$-d_t\\le b_t\\le d_t$","$M=2$ from range $[-2,2]$","Small constant $\\mu$ instead of feature gap","Penalty on features used via $s_{jt}$"],"x":"Each change needs its reason; listing constraints without justification earns partial credit."},{"sec":17,"q":"Are hyperplane trees less interpretable than parallel trees? Discuss using Lec 9 and Rec 5 evidence, the role of the complexity penalty, and why feature scaling matters more for OCT-H.","m":"Each hyperplane split is harder to read than a single-feature threshold. But a hyperplane can replace a whole staircase of axis-parallel splits: in Rec 5, classes separated by $x_1+x_2=1$ need many parallel splits but one hyperplane at depth 1. Lec 9 slide 54 shows OCT at 99.5% test accuracy with depth 5 versus OCT-H at 99.5% with depth 2, two splits, one of them parallel. A much smaller tree can be easier to understand overall. The OCT-H penalty $\\alpha\\sum_{t,j}s_{jt}$ charges per feature used, so dense hyperplanes are expensive and most splits stay sparse, sometimes reducing to parallel splits. On accuracy, OCT-H gains about 3.9% over CART on average and matches XGBoost from depth 3–4. Scaling matters more because axis-parallel splits are invariant to monotone rescaling, while rescaling a feature changes which hyperplanes satisfy $\\|a_t\\|_1\\le1$ and how coefficients compare, so IAI scales features to $[0,1]$ by default.","k":["Individual splits less interpretable","Tree can be much smaller (99.5% at depth 2 vs 5)","Staircase vs one hyperplane","Feature penalty keeps splits sparse","Scaling changes feasible hyperplanes; parallel splits invariant"],"x":"A balanced answer cites the depth comparison and the sparsity mechanism."},{"sec":17,"q":"Explain the OCT-H complexity term. Why does it penalize features rather than splits, what does each constraint linking $s_{jt}$ do, and what is the term for a tree whose root uses 3 features and whose two children use 1 feature each, at $\\alpha=0.01$?","m":"In parallel OCT each split uses exactly one feature, so counting splits ($\\alpha\\sum_td_t$) measures complexity. A hyperplane split can use many features, so counting splits would let a dense, unreadable hyperplane cost the same as a single threshold. OCT-H therefore uses binaries $s_{jt}$ (feature $j$ used at node $t$) and the term $\\alpha\\sum_{t\\in\\mathcal B}\\sum_js_{jt}$. Constraints: $-s_{jt}\\le a_{jt}\\le s_{jt}$ forces $a_{jt}=0$ unless the feature is marked used, so the penalty counts features actually in the split; $s_{jt}\\le d_t$ turns all indicators off when the node does not split; $\\sum_js_{jt}\\ge d_t$ makes a splitting node use at least one feature. If every split uses one feature the term equals $\\alpha\\times$(number of splits), recovering OCT's penalty. Example: $3+1+1=5$ features used, so the term is $0.01\\times5=0.05$ (a split count would give 0.03).","k":["Hyperplane splits vary in how many features they use","$\\alpha\\sum_t\\sum_j s_{jt}$","$-s\\le a\\le s$ links coefficients to indicators","$s_{jt}\\le d_t$ and $\\sum_j s_{jt}\\ge d_t$","Example: 0.05"],"x":"Graders check the role of each linking constraint and the arithmetic."},{"sec":18,"q":"Why does the OCT MIO scale poorly? Give the size of the formulation for $n=10{,}000$, $p=20$, $K=2$, $D=4$, explain the observation on Lec 9 slide 33, and say what it implies for how to solve the problem.","m":"The MIO needs one routing binary $z_{it}$ per point per leaf: $n\\cdot2^D=10{,}000\\times16=160{,}000$, out of 160,442 variables in total. Routing constraints number $n\\cdot2^D\\cdot D=640{,}000$ of about 810,173. Both are linear in $n$ and double with each level of depth; the Book reports that doubling the $z$ count costs about an order of magnitude in solve time, and on Banknote ($n=1372$) plain Gurobi hit the 2-hour limit for every tree versus 0.12 s for CART. Slide 33's observation: only the split variables $a,b$ need optimizing. Given the splits, everything else is closed form: route points, label each leaf by majority, count errors. The real problem is $\\min_T$ error $+\\ \\alpha\\cdot$complexity over splits, whose decision space is independent of $n$ and linear in $p$ and the number of splits. That motivates a local search over splits with random restarts, which gives better trees than the MIO in a fraction of the time but no certificate.","k":["$z$ count $n2^D=160{,}000$; 160,442 variables","Routing $n2^DD=640{,}000$ constraints; ~810,173 total","Linear in $n$, doubling per depth; ~10× time per doubling","Given splits, routing/labels/error closed form","Search over splits only: independent of $n$ ⇒ local search"],"x":"The numbers plus the closed-form argument; the conclusion should mention the loss of the certificate."},{"sec":18,"q":"Describe the Optimal Trees local search algorithm: the overall loop, how each node type is re-optimized, the moves at a node, and why random restarts are needed. Illustrate with Rec 5's two starting trees.","m":"Start from a tree. Visit nodes in random order; at node $t$, with the rest of the tree fixed, re-optimize $t$ and keep the best move if it lowers the objective, then start a new pass on the improved tree. Stop when a full pass changes nothing (a local optimum). Re-optimization by node type: a leaf is split into two new leaves with CART; a branch node with leaves on both sides gets a new split and two leaves via CART; a branch node with subtrees uses modified CART: try every split location, route points into the fixed subtrees, relabel leaves, compute the error, keep the best. The moves at $t$ (Book Alg. 8.2) are: replace the split with the best new split, replace $t$ by its left subtree, or replace it by its right subtree. Restarts: from Rec 5's greedy tree (1 error) no move lowers the error, so it is stuck. From \"root $x_2<0.5$, two leaves\" (5 errors), a new split $x_1<0.5$ at node 2 gives 2 errors and the same move at node 3 gives 0 (the XOR tree). Same moves, different start, different local optimum, so IAI restarts from many CART trees on random feature subsets and keeps the best. Banknote: 100 restarts in 0.98 s vs 0.12 s for CART, beating CART and the MIO.","k":["Random node order, accept improving moves, stop at no-improvement pass","Leaf / branch-with-leaves: CART; branch-with-subtrees: modified CART","Moves: new split, left subtree, right subtree","Rec 5: greedy start stuck at 1; $x_2<0.5$ start reaches 0 (5 → 2 → 0)","Restarts from CART on random feature subsets; no certificate"],"x":"The Rec 5 illustration with the 5 → 2 → 0 sequence is the expected evidence for restarts."},{"sec":18,"q":"Compare what the OCT MIO and local search each guarantee and cost. Explain warm starts (with the Book's Wine numbers), why stopping the MIO early is reasonable, and how $\\alpha$ is tuned.","m":"The MIO is exact and gives a certificate (an optimality proof or a gap), but its size grows with $n\\cdot2^D$ and it rarely proves optimality beyond small depths. Local search optimizes the same objective over splits only, is roughly a $\\log n$ factor slower than CART ($O(npK\\log^2n)$ vs $O(npK\\log n)$ realistically), parallelizes across restarts, and returns only a local optimum. A warm start gives the MIO an integer-feasible incumbent (CART's tree pruned to depth $D$, or a local-search tree), an immediate upper bound that lets branch-and-bound prune more. On Wine at $D=2$: optimum found at 105 s vs 270 s and proven 230 s later vs 1,360 s, about 5× faster in total; most time goes to proving optimality. Stopping early is reasonable because the incumbent usually stabilizes long before the lower bound catches up, and competing methods make no optimality claim. $\\alpha$ is continuous but has a discrete effect: each tree is optimal on an interval, so only critical values need testing (batch cost-complexity pruning), inside a grid over $D$, with $N_{\\min}$ fixed at 1 at little loss.","k":["MIO: certificate, poor scaling; local search: fast, local optimum","Warm start = incumbent/upper bound ⇒ more pruning","Wine: 105 s vs 270 s found, +230 vs +1,360 proven, ~5×","Early stopping: proving dominates time","$\\alpha$ tuned at critical values within grid over $D$"],"x":"Expect the guarantee contrast stated clearly, with the Wine numbers as supporting evidence."},{"sec":19,"q":"Describe the synthetic experiments comparing OCT and CART: how the data are generated, which metrics are used, the main findings, and how they answer the concern that optimal trees overfit.","m":"Training and test data are generated from a random \"ground truth\" tree, which gives full control over $n$, $p$, noise and the number of restarts; each setting is repeated 400 times. CART and OCT are trained and compared with the truth on three metrics: out-of-sample accuracy; true discovery rate, the share of the truth's splits that appear in the learned tree; and false discovery rate, the share of the learned tree's splits not in the truth. Findings (Lec 9 slide 49): OCT matches the true structure much more closely; the OCT–CART gap grows as the problem gets harder ($n$ smaller, $p$ larger); OCT stays stronger even with very large feature or label noise; it gives small gains in true discovery and large reductions in false discovery, so it is much better for interpretation. These results answer the overfitting worry: complexity is controlled by $D$, $N_{\\min}$ and $\\alpha$ tuned on validation data, and better optimization finds the real structure more often rather than fitting noise.","k":["Data from a known ground-truth tree; 400 repeats","Metrics: accuracy, TDR, FDR (definitions)","Gap grows as $n\\downarrow$, $p\\uparrow$; robust to noise","Small TDR gain, large FDR reduction ⇒ interpretability","Overfitting controlled by tuned $D$, $N_{\\min}$, $\\alpha$"],"x":"Correct TDR/FDR definitions and the link to interpretability are the core."},{"sec":19,"q":"Present the PECARN pediatric head trauma case study: the clinical problem, the baseline, what was changed, the results for both age groups, and why a \"1% accuracy gain\" understates the impact.","m":"Children arrive at the ER with head injuries; doctors must detect clinically important traumatic brain injury (ciTBI), which needs acute intervention and cannot be missed, but CT scans carry radiation risk (about 1 lethal malignancy per 1,000–5,000 children, higher at younger ages) and cost. The data cover 42,000 children, 376 with ciTBI (under 1%). Kuppermann et al. (Lancet 2009) built CART trees that are now medical practice. The study used exactly the same approach with OCT in place of CART. Under 2: CART scans 5,132 children (47.9%), OCT 2,856 (26.6%), both missing 1 ciTBI, so specificity rises 20–25 points at the same sensitivity. Aged 2 and older: CART 13,928 scans (43.9%) and 8 missed; OCT 11,098 (35.0%) and 4 missed, so scans fall and misses halve. The biggest gain is for pre-verbal children, who face the highest radiation risk. OCT's average gain over CART across datasets is only about 1%, but in a high-stakes, high-volume decision it means thousands of avoided scans with no added missed injuries.","k":["ciTBI must not be missed; CT radiation risk","Baseline: Kuppermann CART trees in practice; swap in OCT","Under 2: 47.9% → 26.6% scans, 1 vs 1 missed","2+: 43.9% → 35.0%, misses 8 → 4","Small accuracy gain ⇒ large practical impact"],"x":"The four headline numbers per group and the same-pipeline design are expected."},{"sec":19,"q":"Starting from the OCT MIO, derive the Optimal Regression Tree (ORT) formulation from Rec 5, then explain ORT-L. What is kept, removed and added, and how is the leaf prediction linearized?","m":"Kept: split variables $a_t,b_t,d_t$ with $\\sum_ja_{jt}=d_t$, $0\\le b_t\\le d_t$, $d_t\\le d_{p(t)}$; routing $z_{it},l_t$ with $\\sum_tz_{it}=1$ and the routing constraints; leaf size. Removed: $c_{kt}$, $N_{kt}$, $N_t$, $L_t$, $\\sum_kc_{kt}=l_t$ and both error lines. Added: a leaf value $\\beta_{0t}$, a prediction $f_i$ and a loss $L_i$ per point. The prediction $f_i=\\sum_t\\beta_{0t}z_{it}$ is a product of variables, so it is linearized as $-M(1-z_{it})\\le f_i-\\beta_{0t}\\le M(1-z_{it})$ for all $i,t$: $z_{it}=1$ forces $f_i=\\beta_{0t}$, $z_{it}=0$ leaves it free. Loss: $L_i\\ge f_i-y_i$, $L_i\\ge y_i-f_i$ (absolute) or $L_i\\ge(f_i-y_i)^2$ (squared). Objective: $\\min\\frac1{\\hat L}\\sum_iL_i+\\alpha\\sum_{t\\in\\mathcal B}d_t$, with $\\hat L$ the loss of the best single constant. ORT-L puts a linear model in each leaf: when $z_{it}=1$, $f_i=\\beta_t^Tx_i+\\beta_{0t}$ (still linear, because $x_i$ is data), via the same big-M pair, and the objective adds $\\lambda\\sum_{t\\in\\mathcal L}\\|\\beta_t\\|_1$, so each leaf fits a lasso. Book (11.1) uses an $\\ell_0$ version with binaries $r_{jt}$.","k":["Keep splits, hierarchy, routing, leaf size","Remove $c_{kt}$, $N_{kt}$, $N_t$, $L_t$ and their constraints","Big-M pair for $f_i=\\beta_{0t}$ when $z_{it}=1$","Loss constraints; $\\hat L$ = best constant's loss","ORT-L: $f_i=\\beta_t^Tx_i+\\beta_{0t}$, $\\lambda\\sum\\|\\beta_t\\|_1$"],"x":"Explain why the product $\\beta_{0t}z_{it}$ needs big-M; that is the modeling point being tested."},{"sec":20,"q":"State the Lec 10 predictive prescription problem. Compare SAA, point prediction and the weighted-SAA predictive prescription, and explain why point prediction can do worse than SAA in the shipment example.","m":"Target: $z^*(x)\\in\\arg\\min_{z\\in\\mathcal Z}\\mathbb E[c(z;Y)\\mid X=x]$ from data $S_N=\\{(x^i,y^i)\\}$, producing a rule $\\hat z_N:\\mathcal X\\to\\mathcal Z$. SAA, $\\arg\\min_z\\frac1N\\sum_ic(z;y^i)$, hedges over the spread of $Y$ but ignores $X$. Point prediction, $\\arg\\min_zc(z;\\hat m_N(x))$ with $\\hat m_N\\approx\\mathbb E[Y\\mid x]$, uses $X$ but treats the forecast as certain. The predictive prescription $\\arg\\min_z\\sum_iw^i_N(x)c(z;y^i)$ does both: ML weights (kNN, CART leaf, RF average of leaves) say which past scenarios resemble today, and the weighted SAA keeps the uncertainty. It is tractable when $c$ is convex in $z$ and $\\mathcal Z$ convex, since $w\\ge0$. Point prediction can lose to SAA because the cost is nonlinear in $y$ (recourse at $p_2>p_1$, shipping): $c(z;\\mathbb E[Y\\mid x])\\ne\\mathbb E[c(z;Y)\\mid x]$, so it under-hedges. In the shipment example it plateaus near 2,400 versus SAA's 1,700 and $z^*$'s 1,300; more data sharpens $\\hat m_N$ but never adds the missing spread.","k":["Full-information target $z^*(x)$ and the data-driven rule $\\hat z_N(x)$","SAA: uncertainty yes, covariates no","Point prediction: covariates yes, uncertainty no","Weighted SAA with nonnegative ML weights; convex ⇒ tractable","Nonlinear cost ⇒ point prediction under-hedges (≈2,400 vs 1,700 vs 1,300)"],"x":"Graders want the three formulas, the 'which half each drops' contrast, and nonlinearity in $y$ as the reason, not just 'point prediction is noisy'."},{"sec":20,"q":"Define the coefficient of prescriptiveness $P$, interpret each term, compute it for SAA cost 2,400, prescription cost 1,800 and perfect-foresight cost 1,400, and contrast $P$ with $R^2$.","m":"$P=\\dfrac{\\min_z\\sum_ic(z;y^i)-\\sum_ic(\\hat z_N(x^i);y^i)}{\\min_z\\sum_ic(z;y^i)-\\sum_i\\min_zc(z;y^i)}$. First term: cost of the best single data-poor decision (SAA). Second: cost of the prescription. Third: perfect foresight, each $y^i$ known before deciding. So $P$ is the fraction of the SAA-to-perfect-foresight gap the prescription closes. Here $P=(2400-1800)/(2400-1400)=0.6$. $P\\le1$, SAA has $P=0$, and out of sample $P<0$ means worse than ignoring $X$. Because even the full-information decision faces residual uncertainty, the attainable ceiling is below 1 (≈0.46 in the shipment example; 0.88 in the media case). $R^2$ has the same structure but measures prediction error from the sample-mean baseline to perfect prediction; $P$ measures decision cost from the SAA baseline to perfect foresight, so it captures the prescriptive content of $X$ and of the method.","k":["Formula with the three terms named","Fraction of SAA-to-perfect-foresight gap closed","Correct value 0.6","Range: ≤1, SAA = 0, negative possible out of sample","Contrast with $R^2$: baseline, ceiling, units"],"x":"A common slip is using full-information cost in the denominator; the slide uses perfect foresight, which is why $P$ rarely nears 1."},{"sec":20,"q":"Describe the Lec 10 media distributor application end to end: the decision problem, the data, the censoring issue, and the prediction and prescription results.","m":"A Fortune-100 media company (about 1 billion units/year, 0.5 million titles, 50,000+ retailers) must choose which titles to stock and how many under limited shelf space and very uncertain demand for new releases. Per location $r$ and period $t$: $\\max\\mathbb E[\\sum_j\\min\\{Y_j,z_{trj}\\}\\mid X=x_{tr}]$ s.t. $\\sum_jz_{trj}\\le K_r$, $z\\ge0$ (maximize units sold, since shelf capacity binds). Data: internal sales by item/location since 2010 (~50 GB after weekly aggregation), geocoded locations, disambiguated titles, plus harvested public data (IMDb/Rotten Tomatoes ratings and vote counts, box office, awards, actors, plot, genre, MPAA, Google search volume). Attention, not quality, predicts sales: box office $\\rho=0.32$, votes 0.25, rating 0.02. Censoring: only sales $U=\\min\\{Y,V\\}$ are observed, so sold-out titles reveal only $Y\\ge V$; weights are adjusted Kaplan–Meier style. An RF predicts new-title demand with out-of-sample $R^2=0.67$ (top features: search volume at release, mean location sales). The RF-weighted prescription reaches out-of-sample $P=0.88$ (Munich 0.89, Paris 0.90, Waterloo 0.85, The Hague 0.86), tracking perfect foresight near capacity while SAA++ sits far lower.","k":["Capacitated multi-product newsvendor per location-period","Internal + harvested public data; attention beats quality","Right-censoring: sales = min(demand, inventory), corrected weights","RF prediction $R^2=0.67$","RF prescription $P=0.88$ (city values)"],"x":"Full credit needs the censoring explanation and the point that moderate $R^2$ still gave high $P$."},{"sec":21,"q":"Write the DM, IPW and DR reward estimators, explain each one's bias/variance tradeoff, and compute all three for a patient who received A with $y=12$, $p_A=0.6$, $f_A(x)=10$, $f_B(x)=11$.","m":"DM: $\\Gamma_{it}=f_t(x_i)$, with $f_t$ trained only on observations that received $t$. Low variance, but each $f_t$ sees a possibly unrepresentative population, so it is very susceptible to treatment-assignment bias; it works if and only if the $f_t$ are accurate. IPW: $\\Gamma_{it}=\\mathbb 1\\{T_i=t\\}y_i/p_{it}$, with propensities from a classifier $T\\sim X$. It reweights so treatment groups look alike, correcting assignment bias, but dividing by small $p_{it}$ gives high variance. DR: $\\Gamma_{it}=f_t(x_i)+\\mathbb 1\\{T_i=t\\}(y_i-f_t(x_i))/p_{it}$: DM plus an IPW correction of its residual; high quality if either the outcome or the propensity model is good. Numbers: DM $=(10,11)$; IPW $=(12/0.6,0)=(20,0)$; DR $=(10+2/0.6,\\ 11)=(13.33,\\ 11)$. Note DR equals DM on the unobserved arm.","k":["Three correct formulas","DM: low variance, assignment bias","IPW: corrects bias, high variance via 1/p","DR: good if either model is good","Numbers (10,11), (20,0), (13.33,11)"],"x":"Check that students leave the unobserved arm at 0 for IPW and at $f_B$ for DR."},{"sec":21,"q":"Using the COVID ICU example, explain why observational data can't be analyzed by averaging outcomes per treatment, or by training one model on $[X\\ T]$.","m":"Of 131 ICU patients, 109 were ventilated (83 survived, 76%) and 22 were not (all survived). Averaging says ventilation hurts, but ventilation went to the sickest patients: confounding by indication, i.e. treatment-assignment bias. Among the ventilated, survivors averaged 14 days versus 8.5 for non-survivors; that suggests longer ventilation helps, but patients who died early couldn't accumulate days (survivorship / reverse causation). Averaging also gives no personalization: one treatment for everyone. A single model $f(x,t)$ on $[X\\ T]$ predicts $y$ well but isn't forced to capture the causal dependence on $t$: the model class may rarely use $t$ (RF), regularization shrinks the $t$-effect, and overfitting exaggerates it (Chernozhukov et al. 2018; slide 15 panels). Hence causal-inference estimators (DM per arm, IPW, DR) that account for how treatments were assigned.","k":["Confounding by indication (sickest get ventilated)","Survivorship / reverse causation for duration","No personalization from averaging","Single model: model class, regularization bias, overfitting","Motivates DM/IPW/DR"],"x":"Graders look for two distinct biases in the ICU data, not one."},{"sec":21,"q":"Describe Lec 11's best practices for reward estimation and evaluation: cross-fitting, the train/test protocol, and extensions to other outcome and treatment types.","m":"Cross-fitting: split into $k$ folds and predict propensities and outcomes for each fold with models trained on the other folds, so every nuisance estimate is out-of-sample; in-sample predictions are overfit (outcomes too close to $y_i$, propensities too extreme), corrupting IPW/DR rewards. IAI's reward estimators do this automatically. Protocol: (1) split train/test; (2) estimate rewards on train; (3) train policy trees on train data and train rewards; (4) run a new, independent reward estimation on test; (5) evaluate prescriptions with test rewards. Use about 50/50 because the test set must support its own reward estimation; even so this is an estimate, and only an experiment truly measures impact. Extensions: numeric outcomes (regression model), binary (classifier for the probability), survival (survival model; censoring needs care, e.g. causal survival forests); numeric treatments such as doses replace the indicator $\\mathbb 1\\{T_i=t\\}$ with a kernel on treatment proximity. Example call: `IAI.CategoricalClassificationRewardEstimator(propensity_estimator=..., outcome_estimator=..., reward_estimator=:doubly_robust)`.","k":["Cross-fitting: k folds, out-of-sample nuisance predictions","Why in-sample fails: overfit outcomes and extreme propensities","Five-step protocol with independent test rewards","50/50 split rationale; experiments as ground truth","Outcome types and kernel for numeric treatments"],"x":"The independent test-set reward estimation is the point most often missed."},{"sec":22,"q":"Write the policy-learning objective, describe regress-and-compare and its three drawbacks, explain how policy trees address each, and show that classification is a special case.","m":"Given a reward matrix $\\Gamma$ from reward estimation, learn $\\pi$ maximizing $\\sum_i\\sum_t\\mathbb 1\\{\\pi(x_i)=t\\}\\Gamma_{it}$. Regress-and-compare takes $\\arg\\max_t\\Gamma_{it}$ per row. Drawbacks: (1) no interpretability, since you must understand each reward model to see why a treatment won; (2) 'overfitting', since similar observations can get different treatments; (3) only valid with DM, since IPW/DR rewards are meaningful only in aggregate and a per-row argmax on IPW just returns the observed treatment. Policy trees, $\\max_{\\text{Tree}}\\sum_i\\sum_t\\mathbb 1\\{\\text{Tree}(x_i)=t\\}\\Gamma_{it}$, fix all three: a tree is readable; one treatment per leaf regularizes and resists outcome noise; leaf sums aggregate rewards, so IPW and DR work. Special case: set $\\Gamma_{it}=0$ if point $i$ is class $t$, else 1, and minimize; the objective counts misclassifications. So policy trees are weighted classification trees, trainable greedily (`policytree`) or with Optimal Trees (Optimal Policy Trees).","k":["Objective $\\max\\sum_i\\sum_t\\mathbb 1\\{\\pi(x_i)=t\\}\\Gamma_{it}$","R&C = per-row argmax","Three drawbacks: interpretability, overfitting, DM-only","Tree fixes: readable, regularizes, aggregates rewards","Classification as 0/1 rewards ⇒ weighted classification tree"],"x":"Students should explain why IPW breaks R&C (zeros in unobserved columns), not just state it."},{"sec":22,"q":"Four patients. IPW rewards (A, B): (10, 0), (10, 0), (0, 11.25), (0, 10). DR rewards: (8.25, 6), (4, 7), (6, 9.25), (5, 2.5). (a) What does a per-row argmax on the IPW rewards give, and why is it meaningless? (b) Compare the policies 'all A', 'all B' and (A, B, B, A) under DR, and say which IPW supports.","m":"(a) IPW puts $y_i/p_{it}$ in the observed column and 0 elsewhere, so the per-row argmax returns A, A, B, B: exactly the historical treatments (total 41.25, which is meaningless). IPW is unbiased only when summed over many observations, so it can compare policies but not pick per-row winners. (b) DR totals: all A $=8.25+4+6+5=23.25$; all B $=6+7+9.25+2.5=24.75$; (A, B, B, A) $=8.25+7+9.25+5=29.5$, the best of the three. IPW totals for the same policies: 20, 21.25, 21.25. Comparing column sums under a fixed policy is what IPW and DR support; a policy tree does this leaf by leaf, which is why it can use them.","k":["Per-row IPW argmax echoes observed treatments","IPW valid only in aggregate","DR totals 23.25, 24.75, 29.5","(A, B, B, A) best under DR","Policy trees aggregate within leaves"],"x":"Arithmetic must be right; the conceptual point is aggregate vs per-row validity."},{"sec":22,"q":"(Book) Compare the lecture's Optimal Policy Trees with the book's Optimal Prescriptive Trees (Ch. 14): how each obtains counterfactuals, its objective, how it handles assignment bias, and the role of the prescription factor $\\mu$.","m":"Lecture (Amram, Dunn, Zhuo 2022): two steps. First, cross-fitted reward estimation (DM, IPW or DR) fills the reward matrix; propensity weighting in IPW/DR handles assignment bias. Then a tree is trained with the Optimal Trees local search to maximize $\\sum_i\\sum_t\\mathbb 1\\{\\text{Tree}(x_i)=t\\}\\Gamma_{it}$, a weighted classification objective. Book (Bertsimas, Dunn, Mundru): no separate step; the counterfactual $\\hat y_i(t)$ is the mean outcome of training samples in $i$'s leaf that got $t$ (OPT-L: per-treatment lasso in the leaf), with a minimum count $n_{\\text{treatment}}$ before a leaf may prescribe $t$. Objective: $\\mu\\cdot$prescription error $+(1-\\mu)\\cdot$squared prediction error. Assignment bias is handled only by leaf-level matching, not propensities. $\\mu=1$ yields optimistic, inaccurate counterfactuals; $\\mu\\approx0.5$–0.8 did best. Findings: joint learners beat R&C on synthetic data, but on warfarin R&C did best while OPT beat greedy trees by about 0.6–1.2%.","k":["Lecture: separate cross-fitted DM/IPW/DR, then max reward tree","Book: counterfactuals estimated inside leaves","Book objective mixes prescription and prediction error via μ","Bias: propensities (lecture) vs leaf matching (book)","μ = 1 optimistic; μ ≈ 0.5–0.8 best"],"x":"Book-only material; graders check that the two designs aren't conflated."},{"sec":23,"q":"Using Rec 3's ten apartment listings, explain why the train/test split is a decision, how stable regression removes it, and why the stable line is not the fit to the hardest split.","m":"With 5 of 10 listings for training there are $\\binom{10}{5}=252$ splits; LS slopes range from 1.50 to 3.65 per sq ft, so the verdict on a 1,300 sq ft listing at 4,900 flips from overpriced by 332 (small-listing fit $1686+2.22x$) to a deal by 215 (large-listing fit $370+3.65x$). Cross-validation averages over splits; stable regression guards against every split: $\\min_\\beta\\max_{z:\\sum z_i=k,z\\in\\{0,1\\}}\\sum_iz_i|y_i-\\beta_0-\\beta^Tx_i|$. The inner problem is totally unimodular, so relax and dualize: $\\min k\\theta+\\sum u_i$ s.t. $\\theta+u_i\\ge|r_i|$, $u\\ge0$, one LP. Here it gives $1500+2.50x$ with worst-five sum 1,300 ($\\theta=200$), beating LS (1,338), the best of all 252 split fits (1,304) and the hardest split's own fit $1860+2.37x$ (2,154). Each split's fit is tuned to its five points; the stable line bounds the error on any five points at 1,300. At the optimum the worst set is balanced above and below the line (subgradient in $\\beta_0$), so one-sided outliers matter only when they are over half the worst $k$; at $k=n$ it is LAD.","k":["252 splits; slope 1.50–3.65 flips the verdict","Average (CV) vs guard against worst split (stable)","TU relaxation + LP dual ⇒ single LP","Stable 1500+2.5x scores 1,300 vs 1,338 / 1,304 / 2,154","Balance condition; k = n ⇒ LAD"],"x":"The distinction 'worst case over all subsets' vs 'fit to one hard subset' carries the most weight."},{"sec":23,"q":"For Rec 3's Red Line data, show how the LS residuals reveal the wrong shape, what convexity lets you say about rent beyond the data, how convex regression is solved, and what happens if the data aren't convex.","m":"LS gives $3822-409x$; residuals $+383,+87,-108,-204,-225,-195,-116,-12,+118,+272$ smile (positive at the ends, negative in the middle) every time: systematic misspecification, not noise. Chord slopes $-1000,-800,\\dots,-100$ per mile increase, so the data are exactly convex. LS extrapolates absurdly (Quincy at 8 mi: 551; at 10 mi the landlord pays you). Any convex curve through the data falls at most 100 per mile past 5 mi, so Quincy rent $\\ge2050-3\\cdot100=1750$. Convex regression: variables $\\theta_i$ (fitted values) and $\\xi_i$ (subgradients), constraints $\\theta_i+\\xi_i^T(x_j-x_i)\\le\\theta_j$ for all pairs (linear), fit $f(x)=\\max_i\\{\\theta_i+\\xi_i^T(x-x_i)\\}$, with a slope penalty. With $n(n-1)$ constraints (999,000 at $n=1000$) use cutting planes: start with $n$ pairs, add the most violated $j(i)$ for each $i$, stop when none is violated. On non-convex data the problem is still feasible (lines are convex); it returns the closest convex fit, shaving the bump, and large structured residuals flag the wrong shape.","k":["Smiling residuals ⇒ wrong shape","Increasing chord slopes ⇒ convex","Extrapolation bound ≥ 1,750 at 8 mi","θ/ξ formulation, max-of-linear, cutting planes","Never infeasible; closest convex fit on non-convex data"],"x":"Look for the bound argument via the last chord slope, not just 'convex fits are better'."},{"sec":23,"q":"LQAD in practice (Rec 4): explain how to choose $q$, why $q=n$ is a bad choice, how large $M$ must be in the MIO, and how to warm-start it. Use the 15-store example to compare LS, LAD and LMAD.","m":"Twelve stores follow $y\\approx1+0.5x$; three bad records sit at $x\\approx9.5$. LS (every point pulls, outliers squared) flips the slope's sign; LAD (every point pulls) does no better; LMAD fits the twelve and ignores the three because the worst half of residuals never enters the median. LQAD minimizes $|r_{(q)}|$: the thinnest band containing $q$ points; the other $n-q$ can move anywhere. Choose the largest $q$ that could be all clean: with $n=100$ and up to 30 corrupted, $q=70$; smaller $q$ discards clean data. $q=n$ minimizes the maximum residual (Chebyshev fit), which one outlier controls, the least robust choice; $q=\\lceil n/2\\rceil$ is LMAD. MIO: $\\min\\gamma$ s.t. $\\gamma\\ge\\pm r_i-\\mu_i$, $\\mu_i\\le M(1-z_i)$, $\\sum z_i=q$; $M$ must be at least the largest residual at the optimum, or a dropped point can't be fully excused and the MIO returns a wrong solution. Warm start: $|r_{(q)}|$ = (sum of $n-q+1$ largest) − (sum of $n-q$ largest), a DC function; linearize the second term, solve an LP, repeat (monotone), after cheap subgradient steps. Heuristic first, MIO certifies.","k":["LS flips slope, LAD no better, LMAD ignores the three","Band picture: thinnest band through q points","q = n − (max corrupted); q = n is Chebyshev","M ≥ largest residual at optimum","DC/LP warm start after subgradient"],"x":"Complements the existing LQAD derivation question; credit goes to the practical choices (q, M, warm start)."},{"sec":24,"q":"The course repeatedly replaces a greedy heuristic with global optimization. Describe the three pairs, what is gained each time, what it costs, and how heuristics stay useful.","m":"(1) Lasso/stepwise vs best-subset and holistic regression (Lec 3, 7): the same sparse least-squares objective solved exactly by MIO; fewer false features, all statistical properties (groups, collinearity, transforms, significance) imposed jointly, similar $R^2$ with fewer variables. (2) CART vs Optimal Classification Trees (Lec 8–9): CART splits greedily top-down; OCT optimizes the whole tree (MIO with routing, structure and leaf binaries, or IAI local search), matching CART accuracy with about half the splits and, with hyperplanes, approaching ensembles. (3) Greedy `policytree` vs Optimal Policy Trees (Lec 11): same reward-weighted objective, lower regret in synthetic tests, still interpretable. Cost: computation, since MIO size grows with data (OCT needs $n\\cdot2^D$ routing binaries), so at scale local search replaces the MIO and the optimality certificate is lost. Heuristics stay useful as warm starts: subgradient + DC/LP steps for LQAD, CART for OCT, then the MIO certifies on small instances.","k":["Lasso/stepwise → best subset & holistic","CART → OCT","policytree → Optimal Policy Trees","Same objective, better or equal accuracy, interpretable","Cost: scale; local search drops certificate; heuristics as warm starts"],"x":"Strong answers name the shared objective in each pair and the scalability tradeoff."},{"sec":24,"q":"Trace the move from prediction to prescription across Lec 8–11: what each lecture adds, the role trees play in each, and why Lec 11 needs causal inference while Lec 10 doesn't.","m":"Lec 8–9: prediction. Trees (CART, then OCT/OCT-H) map $x$ to a label or value per leaf. Lec 10: decisions $z$ with a known cost $c(z;y)$ where $z$ doesn't change $Y$. Past $y^i$ are valid scenarios for any $z$, so ML only supplies weights $w^i_N(x)$; trees act as binning rules (CART leaf, RF average of leaves) and the decision is a weighted SAA, measured by $P$ against SAA and perfect foresight. Lec 11: discrete treatments that change the outcome. Each observation shows only one outcome, and treatments were assigned with bias, so the missing counterfactuals must be estimated (DM, IPW, DR, cross-fitted) before optimizing. Trees become policies: one treatment per leaf, maximizing summed rewards, which makes them a weighted classification problem solved by Optimal Trees. Throughout, interpretability is kept: one prediction, decision or treatment per leaf.","k":["Lec 8–9: trees as predictors","Lec 10: trees as binning rules for weights; z doesn't affect Y","Lec 11: treatments change Y ⇒ counterfactuals","Reward estimation then policy tree (weighted classification)","Interpretability preserved per leaf"],"x":"The key discriminator is the 'decision affects outcome' distinction."},{"sec":24,"q":"'Write the structure as linear constraints on binaries' is a recurring modeling move. Illustrate it with holistic regression, LQAD and OCT, and discuss the big-M pitfall and warm starts.","m":"Holistic regression: support binaries $z_j$ with $-Mz_j\\le\\beta_j\\le Mz_j$; sparsity $\\sum z_j\\le k$; groups $z_i=z_l$; collinearity $z_i+z_j\\le1$; one transform $\\sum_{T_m}z_i\\le1$; interactions $z_{12}\\le z_1,z_2$; significance via a sign binary $b_j$. LQAD: keep/drop binaries $z_i$ with $\\mu_i\\le M(1-z_i)$ and $\\sum z_i=q$, so $\\gamma^*=|r_{(q)}|$. OCT: split binaries $d_t$ with $d_t\\le d_{p(t)}$ (child splits only if parent does, the same child ⇒ parent pattern as $z_{12}\\le z_1$), one feature per split, point-to-leaf assignment $z_{it}$, leaf size $\\ge N_{\\min}l_t$, label and error constraints. Big-M: $M$ must bound the true quantity at the optimum; too small cuts off the optimum (Rec 2's LQAD failure), too large weakens the LP relaxation and slows the solve. Warm starts: a heuristic solution (subgradient/DC for LQAD, CART for OCT) gives a strong incumbent, and the MIO's work shifts to proving optimality.","k":["Holistic: z constraints for sparsity, groups, collinearity, transforms, significance","LQAD: keep/drop binaries with big-M","OCT: d_t ≤ d_p(t) and routing/leaf constraints","Big-M too small vs too large","Warm starts from heuristics"],"x":"Connecting $z_{12}\\le z_1$ to $d_t\\le d_{p(t)}$ is the cross-lecture insight graders reward."}]}</script>
