<style>
/* Layout: a solver console. Left = the working card or question; right = section progress like a B&B log. One card object per screen. */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface-2:#F6F8FA; --ink:#161E2B; --muted:#5A6577; --line:#D4DAE2;
  --accent:#2E43C4; --accent-soft:#E3E7FB; --on-accent:#FFFFFF;
  --bound:#9A6412; --bound-soft:#F6EBD9;
  --good:#1D7349; --good-soft:#DDF1E6; --bad:#B0281F; --bad-soft:#F8E1DF;
  --shadow:0 1px 2px rgba(22,30,43,.06),0 8px 24px rgba(22,30,43,.07);
  --f-display:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-body:"Source Serif 4",Georgia,"Times New Roman",serif;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131A; --surface:#161D27; --surface-2:#1B2330; --ink:#E4E9F0; --muted:#97A2B4; --line:#2A3443;
  --accent:#8E9DFF; --accent-soft:#232C52; --on-accent:#0E131A;
  --bound:#E2AA55; --bound-soft:#3A2C17;
  --good:#58C690; --good-soft:#163428; --bad:#F2776E; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131A; --surface:#161D27; --surface-2:#1B2330; --ink:#E4E9F0; --muted:#97A2B4; --line:#2A3443;
  --accent:#8E9DFF; --accent-soft:#232C52; --on-accent:#0E131A;
  --bound:#E2AA55; --bound-soft:#3A2C17;
  --good:#58C690; --good-soft:#163428; --bad:#F2776E; --bad-soft:#3D1D1B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 48px;display:flex;flex-direction:column;gap:18px}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
mjx-container{color:inherit}
mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;margin:.5em 0!important}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding-bottom:14px}
.brand{min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,4vw,40px);line-height:1.05;margin:4px 0 2px;letter-spacing:-.01em;text-wrap:balance}
.scope{color:var(--muted);font-size:13.5px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.field{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted)}
select{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%;color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13.5px;color:var(--muted)}
.toggle input{accent-color:var(--accent);width:16px;height:16px}

/* main grid */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}

/* solver log strip */
.log{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 18px;font-variant-numeric:tabular-nums}
.log b{color:var(--ink);font-weight:500}
.log .inc b{color:var(--good)} .log .bnd b{color:var(--bound)}

/* card */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:clamp(18px,3vw,30px);display:flex;flex-direction:column;gap:16px;min-width:0}
.card-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tags{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tag{font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);white-space:nowrap}
.tag.kind{background:var(--surface-2)}
.tag.book{border-color:var(--bound);color:var(--bound);background:var(--bound-soft)}
.tag.st-k{border-color:var(--good);color:var(--good);background:var(--good-soft)}
.tag.st-l{border-color:var(--bad);color:var(--bad);background:var(--bad-soft)}
.prompt{font-family:var(--f-body);font-size:clamp(19px,2.3vw,23px);line-height:1.45;font-weight:600;text-wrap:pretty;min-width:0;overflow-wrap:anywhere}
.prompt.term{font-size:clamp(22px,3vw,28px)}
.ans{font-family:var(--f-body);font-size:17px;line-height:1.6;min-width:0;overflow-wrap:break-word}
.why{border-top:1px dashed var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.why .lbl,.lbl{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.why p{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.55;color:var(--ink)}
code{font-family:var(--f-mono);font-size:.88em;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.cover{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px;text-align:center;color:var(--muted);cursor:pointer;background:var(--surface-2)}
.cover:hover{border-color:var(--accent);color:var(--ink)}

/* buttons */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 15px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.good{border-color:var(--good);color:var(--good)} .btn.good:hover{background:var(--good-soft)}
.btn.bad{border-color:var(--bad);color:var(--bad)} .btn.bad:hover{background:var(--bad-soft)}
.btn.sel.good{background:var(--good);color:var(--surface)} .btn.sel.bad{background:var(--bad);color:var(--surface)}
.btn.sel.mid{background:var(--bound);color:var(--surface);border-color:var(--bound)}
.btn.mid{border-color:var(--bound);color:var(--bound)} .btn.mid:hover{background:var(--bound-soft)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.kbd{font-family:var(--f-mono);font-size:11px;border:1px solid currentColor;border-radius:4px;padding:0 4px;opacity:.7}
.hint{font-size:12.5px;color:var(--muted)}

/* side panel */
aside.side{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
aside h2{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0;font-weight:500}
.secrow{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:6px 6px;border-radius:8px;cursor:pointer;border:1px solid transparent;background:transparent;text-align:left;width:100%}
.secrow:hover{background:var(--surface-2)}
.secrow[aria-current="true"]{border-color:var(--accent);background:var(--accent-soft)}
.secrow .n{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.secrow .nm{font-size:13.5px;line-height:1.25;overflow:hidden;text-overflow:ellipsis}
.secrow .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{grid-column:2 / 4;height:4px;background:var(--line);border-radius:3px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .k{background:var(--good)} .bar .l{background:var(--bad)}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
.legend .k::before{background:var(--good)} .legend .l::before{background:var(--bad)} .legend .u::before{background:var(--line)}

/* quiz */
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice{border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px}
.choice[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.choice strong{font-size:16px}
.choice span{color:var(--muted);font-size:13.5px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr) 22px;gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px;cursor:pointer;font-family:var(--f-body);font-size:16.5px;line-height:1.5}
.opt:hover:not([disabled]){border-color:var(--ink)}
.opt .ltr{font-family:var(--f-mono);font-size:13px;color:var(--muted);border:1px solid var(--line);border-radius:6px;text-align:center;line-height:24px;height:26px}
.opt .mark{font-family:var(--f-mono);font-weight:600;text-align:right}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--good);background:var(--good-soft)} .opt.right .mark{color:var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .mark{color:var(--bad)}
.opt.dim{opacity:.6}
.verdict{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em;text-transform:uppercase;font-weight:500}
.verdict.good{color:var(--good)} .verdict.bad{color:var(--bad)} .verdict.mid{color:var(--bound)}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2);font-family:var(--f-body);font-size:16px;line-height:1.5}
.block{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.block .ans{font-size:16px}
.kp{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.kp label{display:grid;grid-template-columns:20px minmax(0,1fr);gap:8px;align-items:start;cursor:pointer;font-size:14.5px}
.kp input{accent-color:var(--good);margin-top:3px}
.kp .hit{color:var(--good)}
.claude-out{display:flex;flex-direction:column;gap:6px;font-family:var(--f-body);font-size:15.5px}
.claude-out ul{margin:0;padding-left:20px}
.meter{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.meter .g{background:var(--good)} .meter .m{background:var(--bound)} .meter .b{background:var(--bad)}
table.res{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.res th,table.res td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
table.res th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
table.res td.num{text-align:right;font-family:var(--f-mono)}
.tablewrap{overflow-x:auto}
.review{display:flex;flex-direction:column;gap:12px}
.review details{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:12px 14px}
.review summary{cursor:pointer;font-family:var(--f-body);font-weight:600;font-size:15.5px;line-height:1.45}
.review details > div{display:flex;flex-direction:column;gap:8px;margin-top:10px;font-family:var(--f-body);font-size:15px}
.big{font-family:var(--f-display);font-weight:700;font-size:clamp(36px,6vw,56px);line-height:1}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
@media (max-width:520px){.opt{grid-template-columns:24px minmax(0,1fr) 18px;padding:11px 12px;font-size:16px}.btn{padding:9px 12px}}
@media (prefers-reduced-motion:no-preference){.card{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

 is the natural language for discrete ML choices: which features, which samples, which tree splits.","x":"MIO is the right lens whenever the ML question is \"which ones?\" (features, samples, splits), since those choices are inherently 0/1. Continuous relaxations like Lasso answer a nearby question instead of the real one.","bk":false},{"s":1,"t":"term","f":"Mixed integer quadratic optimization (QMIO / MIQO)","b":"MIO with a quadratic objective term: $\\max\\ x^\\top Q x + c^\\top x + h^\\top y$ s.t. $Ax+By\\le b$, $x\\in\\mathbb{Z}^n_+$, $y\\in\\mathbb{R}^m_+$. Best subset selection with squared loss is an MIQO.","x":"The quadratic term lets the objective score interactions (e.g. squared loss expands into $\\beta^\\top X^\\top X\\beta$). Squared-loss best subset is the textbook example: a convex quadratic objective with binary support variables.","bk":false},{"s":1,"t":"term","f":"Convex optimization (CO)","b":"$\\min f(x)$ s.t. $g_j(x) \\le 0,\\ j\\in[m]$ with $f, g_j$ all convex. Recent progress comes from first-order methods (GD, SGD): they scale to very high dimensions with low memory and fast running times.","x":"Convexity guarantees any local optimum is global, so gradient-type methods actually solve the problem. That is why ridge, Lasso, logistic regression and SVMs are \"solved\" problems while their discrete cousins were not.","bk":false},{"s":1,"t":"term","f":"Robust optimization (RO)","b":"Optimize against the worst case over an uncertainty set, e.g. $\\min c^\\top x$ s.t. $a_i^\\top x \\ge b_i\\ \\ \\forall a_i \\in \\mathcal{U}_i$. For many problems the robust version solves in the same order of time as the nominal problem ($\\mathcal U_i=\\{a_i\\}$).","x":"RO swaps a probability model of the noise for a set of plausible data and protects against the worst member. The key practical fact is that for many sets the robust counterpart is a single deterministic problem of the same type and size.","bk":false},{"s":1,"t":"term","f":"Semidefinite optimization (SDO)","b":"$\\min \\langle C, X\\rangle$ s.t. $\\langle A_i, X\\rangle \\ge b_i$, $X \\succeq 0$, where $\\langle C,X\\rangle = \\mathrm{Tr}(C^\\top X) = \\sum_{ij} c_{ij}x_{ij}$. Scales to $X$ with dimensions in the 100s.","x":"The inner product $\\mathrm{Tr}(C^\\top X)$ is just the sum of elementwise products, so SDO is \"LP over matrices\" with a PSD cone constraint. The PSD constraint is what makes it more expressive and harder to scale.","bk":false},{"s":1,"t":"term","f":"$X \\succeq 0$ (positive semidefinite)","b":"$u^\\top X u \\ge 0$ for every $u \\in \\mathbb{R}^n$.","x":"PSD means every quadratic form is nonnegative, equivalently all eigenvalues are $\\ge 0$. It is the matrix analogue of \"nonnegative\".","bk":false},{"s":1,"t":"term","f":"Second order cone problem (SOCP)","b":"$\\min c^\\top x$ s.t. $\\|A_i x + b_i\\|_2 \\le f_i^\\top x + d_i\\ \\forall i$, $Dx = b$. A special case of SDO, solved by interior point methods, and it scales to millions of dimensions.","x":"The norm-ball constraint is a cone, so SOCP sits between LP and SDO in both modeling power and scalability. Robust regression with an $\\ell_2$ loss lands exactly here ($\\|y - X\\beta\\|_2 \\le t$).","bk":false},{"s":1,"t":"term","f":"Practical tractability (practability)","b":"A problem is practable if it can be solved in times and for sizes that are appropriate for the application that motivated it. Polynomial solvability or NP-hardness is not the criterion.","x":"Practability ties tractability to the application's real time budget and instance sizes. A problem that is NP-hard can still be practable, and a polynomial algorithm can still be useless if its constants or degree are too big.","bk":false},{"s":1,"t":"term","f":"Theoretical tractability (complexity theory view)","b":"Solvable by a polynomial-time algorithm in the number of bits of the input (class P). NP-hard problems are deemed intractable unless P = NP.","x":"This is the classical computer-science definition. The course's point is that it is about worst-case asymptotics and says little about the instances you actually face.","bk":false},{"s":1,"t":"term","f":"Support of a vector, $\\mathrm{Supp}(x)$","b":"$\\{i : x_i \\neq 0\\}$. Also $\\|x\\|_0 = |\\mathrm{Supp}(x)|$, the number of nonzeros.","x":"Support notation shows up everywhere in sparse methods: accuracy and false discovery rates are both defined through intersections and differences of supports.","bk":false},{"s":1,"t":"term","f":"$[n]$ (book notation)","b":"Shorthand for the index set $\\{1,\\dots,n\\}$.","x":"Pure notation, but it appears in every formulation ($i \\in [n]$ for samples, $j \\in [p]$ for features).","bk":false},{"s":1,"t":"q","f":"What are the three optimization lenses the course applies to ML?","b":"Convex, robust, and mixed integer optimization. SDO and SOCP enter as important special cases of convex optimization.","x":"Each lens answers a different need: CO for tractable continuous fitting, RO for protection against data errors, MIO for discrete structure like sparsity and trees.","bk":false},{"s":1,"t":"q","f":"Why do the slides and book say central ML problems \"have not really been solved\"?","b":"They have been attacked with heuristics (Lasso for sparse regression, CART for trees, etc.) even though each is a well-defined optimization problem. With a heuristic you cannot certify you solved the problem, so you don't know what you're leaving on the table.","x":"A heuristic returns an answer without a certificate. Optimization gives you a lower bound too, so you know how far from optimal you are, and the course shows the gap is often material out of sample.","bk":false},{"s":1,"t":"q","f":"Why did ML/statistics come to believe MIO is intractable, and why is that belief outdated?","b":"Many ML methods were developed in the 1970s–90s, when MIO could only solve small instances, so the belief was justified then. It was never updated, even though solver plus hardware speedups since then are in the trillions.","x":"The belief was accurate when it formed, and the field simply never re-tested it. The whole course is an argument that the computational premise behind heuristics has changed.","bk":false},{"s":1,"t":"q","f":"MIO speedup numbers from the Lec 1 slides?","b":"CPLEX 1.2 (1991) → CPLEX 11 (2007): 29,000×. Gurobi 1.0 (2009) ≈ CPLEX 11. Gurobi 1.0 → 9.0: 160×. Software total 1991–2022 ≈ 4,700,000×. Hardware (59.7 GFlop/s in 1993 → 450 PFlop/s in 2016) ≈ 8,000,000×. Total ≈ **37.6 trillion×**.","x":"The multiplicative structure is the thing to remember: software (~4.7 million×) times hardware (~8 million×) gives ~37.6 trillion×. Either factor alone would already be enormous.","bk":false},{"s":1,"t":"q","f":"Translate the MIO speedup into wall-clock terms (Lec 1).","b":"A MIO that took 55 days 30 years ago now solves in under a second on the same 25-year-old computer (software only). A MIO that would have taken 1.2 million years 25 years ago solves in under a second on a modern computer (software × hardware).","x":"55 days to under a second is the software-only effect on fixed hardware. 1.2 million years to under a second combines both factors. These numbers make \"MIO is too slow\" an outdated claim rather than a law.","bk":false},{"s":1,"t":"q","f":"How does the 2019 textbook state the MIO speedup?","b":"About 1,250,000× machine-independent solver speedup (1991–2015) × about 1,560,000× hardware ≈ **2 trillion**. The slides use updated numbers (37.6 trillion). Know both exist.","x":"The book was written in 2019 with older Gurobi benchmarks, so its total is smaller. Exams usually ask about the idea (trillion-scale speedup), not the exact factor.","bk":true},{"s":1,"t":"q","f":"What drove the MIO solver speedups?","b":"Cutting plane theory, disjunctive programming for branching rules, better heuristics, MIO preprocessing, using LP as a black box inside MIO, and faster LP methods.","x":"Most of the speedup is algorithmic: better cuts, better branching, better presolve, better LP engines. That is why the same old computer gets so much faster.","bk":true},{"s":1,"t":"q","f":"Two examples showing complexity theory can be negatively correlated with practice?","b":"(1) The simplex method has exponential worst-case instances yet routinely solves LOs with millions of variables and constraints. (2) The TSP is NP-hard, yet instances with a million cities are solved in minutes.","x":"Simplex is exponential in the worst case but fast in practice; TSP is NP-hard but routinely solved at a million cities. Both show worst-case complexity can be a poor guide to practical difficulty.","bk":false},{"s":1,"t":"q","f":"What requirement does Bertsimas put on any theory of tractability?","b":"It must be **positively correlated with empirical evidence**. Asymptotic polynomial solvability vs NP-hardness fails that test, hence practability.","x":"This is the scientific standard Bertsimas applies to complexity theory itself: if its predictions disagree with what solvers actually do, the theory is the thing to revise.","bk":false},{"s":1,"t":"q","f":"Give practability examples (required time/size depend on the application).","b":"Online trading: milliseconds for 500–1,000 securities. Regression for planning: minutes or hours. Optimal tree for medical diagnosis: built in hours/days on 100,000s of patients, but must score a new patient in seconds.","x":"The examples show that tractability depends on the use case. A millisecond budget and a days-long budget lead to completely different method choices for similar problems.","bk":false},{"s":1,"t":"q","f":"When does an SOCP reduce to an LO? To a convex quadratically constrained problem?","b":"$A_i = 0\\ \\forall i$ gives an LO. $f_i = 0\\ \\forall i$ gives a convex quadratically constrained problem.","x":"Setting $A_i = 0$ leaves $0 \\le f_i^\\top x + d_i$, a linear constraint. Setting $f_i = 0$ leaves $\\|A_i x + b_i\\|_2 \\le d_i$, a convex quadratic constraint after squaring.","bk":false},{"s":1,"t":"q","f":"When does an SDO reduce to an LO?","b":"When $X$ is diagonal. LO then scales to millions of dimensions vs. 100s for general SDO.","x":"A diagonal PSD matrix just means nonnegative diagonal entries, so $\\langle C, X\\rangle$ and the constraints become linear in those entries.","bk":false},{"s":1,"t":"q","f":"What three things does the course claim modern optimization delivers on large central ML problems?","b":"Solutions that (a) are found in seconds/minutes, (b) are certified optimal in minutes/hours, and (c) outperform classical heuristics out of sample on real and synthetic data.","x":"Three claims: speed (seconds/minutes), proof (certified optimality), and payoff (better out-of-sample results). The third is what justifies the first two.","bk":false},{"s":1,"t":"q","f":"List the course's eight philosophical principles.","b":"(a) Interpretability. (b) The link between ML and optimization (statistics was historically tied to probability). (c) Robustness matters more than optimality. (d) Randomization vs. optimization. (e) Practability. (f) Prescriptive methods. (g) Deep learning and multimodal ML. (h) Debiasing observational data.","x":"These principles explain why each lecture exists: sparsity and trees for interpretability, robust formulations for robustness, optimal splits instead of random ones, and prescriptive methods later.","bk":false},{"s":1,"t":"q","f":"What does \"robustness is more important than optimality\" mean, and where does it show up?","b":"A robust solution is preferable to a brittle optimal one. Robust solutions are emphasized in Lec 2 (robust regression), Lec 3 (sparse), Lec 6 (robust classification), and Lec 7 (holistic).","x":"An optimal solution tuned to noisy data can be fragile. A slightly suboptimal but robust one generalizes better, which is what Lec 2 shows empirically.","bk":false},{"s":1,"t":"q","f":"What does \"randomization versus optimization\" refer to?","b":"Replacing randomized procedures with optimization. Examples: optimal trees match random forests in performance (Lec 9), and stable regression picks the training split by optimization instead of a random draw (Lec 4).","x":"Random choices (splits, bootstrap, forests) introduce variance you can remove by optimizing. Stable regression is the cleanest example so far.","bk":false},{"s":1,"t":"q","f":"What is the course's (and book's) stance on probability models?","b":"Statistics used probability models as a primitive assumption, which was justified in a data-poor past. In a data-rich world that is unnecessary and can mislead. Start from data and use formal optimization. (\"The only objective reality is data; models exist in our imagination.\" — Preface)","x":"Rather than assuming a distribution and deriving an estimator, the course starts from the data and defines what a good model must satisfy, then optimizes that directly.","bk":false},{"s":1,"t":"q","f":"Preview: write robust regression as introduced in Lec 1.","b":"Nominal: $\\min_\\beta \\|y - X\\beta\\|_2$. With data errors $X + \\Delta X$, $\\Delta X \\in \\mathcal U = \\{\\Delta X : \\|\\Delta X\\| \\le \\lambda\\}$, solve\n$$\\min_\\beta \\max_{\\Delta X \\in \\mathcal U} \\|y - (X+\\Delta X)\\beta\\|_2.$$\nProgress in RO: it solves in the same order of time as the nominal problem.","x":"This min–max preview sets up Lec 2: the inner max turns out to equal a regularization penalty, so robustness costs almost nothing computationally.","bk":false},{"s":1,"t":"q","f":"Lec 1 \"why this class\": which convex-optimization successes does it cite, and what does it say about MIO and RO in ML?","b":"CO has grown in importance over two decades (compressed sensing, matrix completion). MIO and RO are widely unknown in ML, and people in ML believe MIO is intractable, yet MIO, RO, and CO have all advanced dramatically.","x":"CO already had big wins in ML (compressed sensing, matrix completion). The course's claim is that MIO and RO deserve the same adoption.","bk":false},{"s":1,"t":"q","f":"Preview (Lec 1): the SVM formulation.","b":"$$\\min_{w,b}\\ \\tfrac12\\|w\\|_2^2 + C\\sum_{i\\in[n]}\\max\\{1 - y_i(w^\\top x_i - b),\\ 0\\}$$\nMargin term plus hinge loss.","x":"$\\tfrac12\\|w\\|^2$ maximizes the margin and the hinge sum penalizes violations. The hinge loss reappears in Ch. 6 (sparse/robust SVM).","bk":false},{"s":1,"t":"q","f":"Preview (Lec 1): what is an optimal tree?","b":"Partition the feature space with hyperplanes (splits) chosen by optimization to minimize misclassification error, as opposed to CART's greedy top-down splits. Covered in Lec 8–9.","x":"CART grows a tree greedily one split at a time; an optimal tree chooses all splits jointly with MIO. This is the \"optimization vs. heuristic\" theme applied to trees.","bk":false},{"s":1,"t":"q","f":"Preview (Lec 1): matrix completion.","b":"$\\min_\\Theta \\sum_{(i,j)\\in\\Omega}(x_{ij} - \\theta_{ij})^2$ s.t. $\\mathrm{rank}(\\Theta) \\le r$, fitting the observed entries $\\Omega$ with a low-rank matrix. Tensor completion generalizes it. (Lec 22.)","x":"The rank constraint is the matrix analogue of $\\|\\beta\\|_0 \\le k$: low rank is sparsity of singular values. The same binary-convex ideas from sparse regression extend to it later.","bk":false},{"s":1,"t":"q","f":"Key historical milestones in optimization?","b":"Dantzig invents simplex (1947); the earliest problems had ~45 constraints and 70 variables and took ~8 hours. Karmarkar, interior point methods for LO (mid-1980s). Nesterov & Nemirovski, interior point methods for conic problems (late 1980s). RO: Ben-Tal, El Ghaoui, Nemirovski for convex problems (late 1990s); Bertsimas & Sim for discrete problems (early 2000s).","x":"The timeline shows each lens maturing: LP (1947), interior point methods (1980s), conic optimization (late 1980s), RO (late 1990s/2000s). MIO's speedups are the most recent change.","bk":true},{"s":2,"t":"term","f":"Decision variables","b":"What you choose, e.g. $x = (x_1, x_2)$ = how many Type 1 and Type 2 exam questions to attempt.","x":"Choosing the decision variables is the first and most consequential modeling step: everything else is written in terms of them.","bk":false},{"s":2,"t":"term","f":"Objective function","b":"What you care about, e.g. $f(x) = c^\\top x = 4x_1 + 7x_2$ (score), to be maximized or minimized.","x":"The objective encodes what \"best\" means. In ML it is usually a loss plus a penalty.","bk":false},{"s":2,"t":"term","f":"Constraints","b":"What you must guarantee, e.g. time limit $5x_1 + 10x_2 \\le 60$, question bank $x_1 \\le 8$, nonnegativity.","x":"Constraints encode what must hold. In ML formulations they carry structure such as sparsity, group logic or convexity.","bk":false},{"s":2,"t":"term","f":"Feasible solution","b":"Any $x$ that satisfies all constraints, e.g. $(4,3)$ in the exam LP.","x":"Feasibility only means the plan is allowed, not that it is good. Heuristics typically deliver feasible solutions without proof of optimality.","bk":false},{"s":2,"t":"term","f":"Feasible set","b":"The set of all feasible solutions (the shaded region).","x":"The shape of the feasible set (polyhedron, convex set, discrete points) largely decides how hard the problem is.","bk":false},{"s":2,"t":"term","f":"Optimal solution","b":"A feasible $x^*$ with the best objective value, e.g. $x^* = (8,2)$, $f^* = 46$.","x":"Optimality is a statement relative to the whole feasible set, which is why proving it needs a bound (e.g. from duality).","bk":false},{"s":2,"t":"term","f":"Infeasible problem","b":"Empty feasible set (e.g. demand 100 points; nothing qualifies).","x":"Infeasibility often signals contradictory constraints. In HW1 Q1(a), $x \\le y$ and $y \\le x - 1$ cannot both hold.","bk":false},{"s":2,"t":"term","f":"Unbounded problem","b":"The objective can be pushed to $\\pm\\infty$ over the feasible set (e.g. remove the time limit).","x":"Unbounded means a feasible direction improves the objective forever. By weak duality, an unbounded primal implies an infeasible dual.","bk":false},{"s":2,"t":"term","f":"Roles of $c$, $A$, $b$ in an LP","b":"$c$: what each decision is worth. $b$: the resources available. $A$: how much of each resource (row) one unit of each decision (column) consumes.","x":"Reading an LP this way lets you write it in matrix form and interpret duals: each dual variable prices one resource (row of $A$).","bk":false},{"s":2,"t":"term","f":"Convex function","b":"$f(tx + (1-t)y) \\le t f(x) + (1-t) f(y)$ for all $x, y$ and $t \\in [0,1]$.","x":"Geometrically, the chord between two points lies on or above the graph. Convex objectives have no spurious local minima.","bk":false},{"s":2,"t":"term","f":"Convex set","b":"The segment between any two points in the set stays in the set.","x":"Convex feasible sets plus convex objectives give convex problems, where local search finds the global optimum.","bk":false},{"s":2,"t":"term","f":"Separation oracle","b":"A routine that takes a point $y$ and, if $y$ is not in the set, returns a hyperplane with $y$ on one side and the whole set on the other. For cutting planes on a convex $f$, the oracle returns $(f(x_0), \\nabla f(x_0))$.","x":"Cutting-plane methods only need this oracle: evaluate at a point, get a cut, add it. That is exactly how sparse regression and convex regression are solved at scale.","bk":false},{"s":2,"t":"term","f":"Slater's condition","b":"A strict-feasibility condition under which a convex problem has strong duality.","x":"Slater (a strictly feasible point) rules out degenerate cases where the primal and dual optimal values differ for convex nonlinear problems.","bk":false},{"s":2,"t":"term","f":"Shadow price (dual value)","b":"The marginal objective value of one more unit of a resource. In the exam LP: 0.7 points per extra minute, 0.5 per extra Type 1 question in the bank.","x":"Shadow prices come from the optimal dual solution. They tell you what an extra unit of a resource is worth, e.g. 0.7 points per minute in the exam LP.","bk":false},{"s":2,"t":"term","f":"Big-M constraint","b":"$x \\le M z$ with binary $z$: $z = 0$ forces $x = 0$, while $z = 1$ leaves $x$ free up to $M$. Links a yes/no decision to a how-much variable.","x":"Big-M is the standard link between a binary decision and a continuous quantity. Its weakness is that a loose $M$ makes the LP relaxation weak.","bk":false},{"s":2,"t":"term","f":"Epigraph variable","b":"Scalar $t$ standing in for $\\max\\{f_1,\\dots,f_n\\}$ via $t \\ge f_j\\ \\forall j$ inside a minimization.","x":"Minimizing $t$ with $t \\ge f_j$ for all $j$ forces $t$ down to the largest $f_j$, so $t$ equals the max at the optimum.","bk":false},{"s":2,"t":"term","f":"Hypograph variable","b":"Scalar $t$ standing in for $\\min\\{f_1,\\dots,f_n\\}$ via $t \\le f_j\\ \\forall j$ inside a maximization.","x":"Maximizing $t$ with $t \\le f_j$ pushes $t$ up to the smallest $f_j$. It is the mirror image of the epigraph trick.","bk":false},{"s":2,"t":"q","f":"Formulate and solve the \"last hour of the exam\" LP (Type 1: 5 min, 4 pts, 8 available; Type 2: 10 min, 7 pts, plenty; 60 min).","b":"$\\max\\ 4x_1 + 7x_2$ s.t. $5x_1 + 10x_2 \\le 60$, $x_1 \\le 8$, $x_1, x_2 \\ge 0$. Optimum $x^* = (8, 2)$, score 46.","x":"The optimum uses all 8 Type 1 questions (best points per minute: 0.8 vs 0.7), then spends the remaining 20 minutes on two Type 2 questions: $4\\cdot 8 + 7\\cdot 2 = 46$.","bk":false},{"s":2,"t":"q","f":"How do you convert a max problem or a $\\ge$ constraint to standard min / $\\le$ form?","b":"$\\max f(x) = -\\min(-f(x))$. Multiply a $\\ge$ constraint by $-1$ to get $\\le$. One general form covers everything.","x":"Solvers and duality recipes assume one standard form; these sign flips let you convert any problem into it.","bk":false},{"s":2,"t":"q","f":"Geometric picture of an LP objective?","b":"Plans with score $k$ lie on the line $c^\\top x = k$. Changing $k$ slides the line parallel to itself, and $c$ is the normal pointing toward higher scores. Push the line along $c$ until it last touches the feasible region; for an LP that happens at a corner.","x":"Because the objective is linear, its level sets are parallel lines, and the last point they touch when pushed along $c$ is an extreme point. That is why simplex only checks corners.","bk":false},{"s":2,"t":"q","f":"Name the five problem types from Rec 1 and what makes each one hard or easy.","b":"**Linear**: $f, g_i$ linear (easy). **Convex**: all convex (tractable). **Nonlinear**: some $f$ or $g_i$ nonconvex (multiple local optima). **Integer**: some variables integer (NP-hard in general). **Robust**: data uncertain (often no harder than nominal after reformulation).","x":"The categories differ in structure: linear and convex are tractable, nonconvex has local optima, integer is combinatorial, and robust adds a worst case that can often be reformulated away.","bk":false},{"s":2,"t":"q","f":"Three reasons convex problems are tractable?","b":"(1) With a separation oracle and a bounded feasible set, you can get within $\\varepsilon$ of optimal in time polynomial in $n$ and $\\log(1/\\varepsilon)$. LP and convex QP with rational data are in P outright. (2) Any local optimum is global. (3) Strong duality holds under Slater's condition.","x":"Polynomial-time solvability, local = global, and strong duality together mean you can both find and certify the optimum.","bk":false},{"s":2,"t":"q","f":"Maximizing a concave objective: what changes compared with the LP picture?","b":"Maximizing concave $f$ = minimizing convex $-f$. Level sets become nested rings around the unconstrained optimum, and the optimum can be tangent to an edge rather than at a corner (Rec 1: $(4.47, 3.76)$). A concave quadratic over a polyhedron is still in P.","x":"A concave objective has curved level sets, so the optimum can be where a level curve is tangent to an edge, not at a corner. Simplex-style corner reasoning no longer applies, but the problem is still easy.","bk":false},{"s":2,"t":"q","f":"Non-concave objective: what is the risk?","b":"Several hills (separate families of level-set rings). Local ascent converges to whichever hill you start near and may never see the better one. That is why \"we trained it\" is not \"we solved it\" for many ML problems.","x":"With multiple local optima, where you end up depends on where you start. Training a neural net is this situation: a good loss is not a certificate.","bk":false},{"s":2,"t":"q","f":"Exam is 55 minutes instead of 60. Why does rounding the LP solution fail?","b":"Continuous optimum $(8, 1.5)$ scores 42.5. Rounding up to $(8, 2)$ needs 60 min, so it is infeasible. Rounding down to $(8, 1)$ scores 39 and wastes 5 min. The true integer optimum is $(7, 2)$ = 42, which is not adjacent to the continuous solution. Rounding is not a strategy.","x":"Integer feasibility changes which points are allowed, and the best integer point can be far from the LP optimum. That is why MIO solvers branch rather than round.","bk":false},{"s":2,"t":"q","f":"Robust optimization in the exam example: what changes when point values are uncertain?","b":"Uncertainty in $c$ tilts the normal, so the level lines tilt and the optimal corner can jump: under $c = (4,7)$ the best plan is $(8,2)$, under $(2,8)$ it is $(0,6)$. RO asks for the plan that is good for every $c$ in the uncertainty range.","x":"The optimal corner depends on $c$; small changes in $c$ can make the optimum jump. RO picks a plan that performs well across all $c$ in the set.","bk":false},{"s":2,"t":"q","f":"Duality intuition: how do you prove nobody can score more than 48 in the exam LP without solving it?","b":"Weight the constraints and add them. 0.8 × clock gives $4x_1 + 8x_2 \\le 48$. Since $x_2 \\ge 0$, $4x_1 + 7x_2 \\le 4x_1 + 8x_2 \\le 48$. Nonnegative weights on the constraints give upper bounds, and searching for the best weights is the dual problem.","x":"Any nonnegative combination of $\\le$ constraints is still a valid inequality. If its left side dominates the objective coefficient by coefficient, its right side bounds the objective.","bk":false},{"s":2,"t":"q","f":"What is the best dual bound in the exam LP, and what does it mean?","b":"$p^* = (0.7, 0.5)$: $0.7(5x_1 + 10x_2) + 0.5x_1 = 4x_1 + 7x_2 \\le 0.7(60) + 0.5(8) = 46$, which equals the optimal score (strong duality). The weights are shadow prices: one more minute is worth 0.7 pts and one more Type 1 question is worth 0.5.","x":"The best weights make the combined inequality match the objective exactly and give 46, the true optimum. That equality is strong duality, and the weights are the shadow prices.","bk":false},{"s":2,"t":"q","f":"Primal–dual conversion table (primal = min).","b":"Primal constraint $a_i^\\top x \\ge b_i$ → dual $p_i \\ge 0$. $\\le b_i$ → $p_i \\le 0$. $= b_i$ → $p_i$ free.\nPrimal variable $x_j \\ge 0$ → dual constraint $p^\\top A_j \\le c_j$. $x_j \\le 0$ → $p^\\top A_j \\ge c_j$. $x_j$ free → $p^\\top A_j = c_j$.\nDual objective: $\\max p^\\top b$. The only sign flip to remember sits between primal variables and dual constraints.","x":"The pattern: constraint type in the primal sets the dual variable's sign, and the primal variable's sign sets the dual constraint's direction. Memorize via the standard form.","bk":false},{"s":2,"t":"q","f":"The standard-form primal–dual pair worth memorizing?","b":"Primal: $\\min c^\\top x$ s.t. $Ax = b$, $x \\ge 0$. Dual: $\\max p^\\top b$ s.t. $A^\\top p \\le c$, $p$ free. Primal has $n$ variables and $m$ constraints; dual has $m$ variables and $n$ constraints.","x":"From this one pair you can derive every other case by converting to standard form, so it is the only one you need to memorize.","bk":false},{"s":2,"t":"q","f":"Weak duality (min primal).","b":"If $x$ is primal feasible and $p$ is dual feasible, then $p^\\top b \\le c^\\top x$. Any dual feasible point bounds the primal optimum.","x":"Weak duality is immediate: $p^\\top b = p^\\top A x \\le c^\\top x$ when $A^\\top p \\le c$ and $x \\ge 0$. Every dual feasible point is a bound.","bk":false},{"s":2,"t":"q","f":"Strong duality (LP).","b":"If the primal LP has an optimal solution, so does its dual, and the optimal values are equal.","x":"Strong duality says the best bound is tight. This is what lets you replace an inner max with its dual min in robust and stable regression.","bk":false},{"s":2,"t":"q","f":"Strong duality and minimax: when can you swap min and max?","b":"When strong duality holds (convexity), $\\min_x \\max_y f(x,y) = \\max_y \\min_x f(x,y)$. With integer variables only the inequality $\\max_y\\min_x \\le \\min_x\\max_y$ survives.","x":"Swapping min and max is exactly the step used in robust formulations. It requires convexity; for integer problems you only get the weak inequality.","bk":false},{"s":2,"t":"q","f":"Three practical uses of duality?","b":"(1) A feasible primal and a feasible dual sandwich the optimum. (2) A dual solution certifies optimality of a primal solution. (3) An unbounded primal implies an infeasible dual.","x":"Bounds, certificates and infeasibility detection are why duality matters both in theory and in solver logs.","bk":false},{"s":2,"t":"q","f":"Does dualizing twice always return the original problem?","b":"Only for convex (e.g. linear) problems. Dualize an integer problem twice and you do not get it back.","x":"Convex duality is symmetric: the dual of the dual is the primal. Integer problems lose information on dualization, so this fails.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we always sit days 1 and 2 together.\"","b":"$z_1 = z_2$.","x":"Equality forces the two binaries to take the same value: both days or neither.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we always sit day 2 when we sit day 1 (but day 2 alone is allowed).\"","b":"$z_2 \\ge z_1$.","x":"$z_2 \\ge z_1$: if $z_1 = 1$ then $z_2$ must be 1; if $z_1 = 0$ there is no restriction.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we never sit day 2 without day 1.\"","b":"$z_2 \\le z_1$. Day 2 forces day 1, and day 1 alone is fine. ($z_1 + z_2 \\le 1$ would mean \"at most one of the two days.\")","x":"$z_2 \\le z_1$: $z_2 = 1$ forces $z_1 = 1$. It is the converse direction of the previous card.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we sit day 3 if we sit day 1 or day 2.\"","b":"$z_3 \\ge \\frac{z_1 + z_2}{2}$. (Equivalently $z_3 \\ge z_1$ and $z_3 \\ge z_2$.)","x":"If either $z_1$ or $z_2$ is 1, the right side is at least $1/2$, which forces binary $z_3$ to 1.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we sit day 3 if and only if we sit day 1 or day 2.\"","b":"$z_3 \\le z_1 + z_2$ and $z_3 \\ge \\frac{z_1 + z_2}{2}$.","x":"The lower bound forces $z_3 = 1$ when either day is taken, and the upper bound forbids $z_3 = 1$ when neither is.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we can't sit day 3 unless we sit both days 1 and 2.\"","b":"$z_3 \\le z_1 z_2$, linearized as $z_3 \\le z_1$, $z_3 \\le z_2$.","x":"$z_3 \\le z_1$ and $z_3 \\le z_2$ allow $z_3 = 1$ only if both are 1. It is the standard linearization of a product of binaries (upper side).","bk":false},{"s":2,"t":"q","f":"Binary logic: \"we sit day 3 if and only if we sit days 1 and 2\" (linearized product).","b":"$z_3 \\le \\frac{z_1 + z_2}{2}$ and $z_3 \\ge z_1 + z_2 - 1$ (i.e. $z_3 = z_1 z_2$).","x":"Together the constraints make $z_3$ exactly the product $z_1 z_2$: $z_3 \\ge z_1 + z_2 - 1$ forces 1 when both are 1, and the averaged upper bound forces 0 otherwise.","bk":false},{"s":2,"t":"q","f":"Binary logic: \"if at least $k$ of $z_1, \\dots, z_n$ equal 1, then $y = 1$.\"","b":"$\\dfrac{z_1 + \\cdots + z_n - (k-1)}{n} \\le y$.","x":"If at least $k$ of the $z_j$ are 1, the numerator is $\\ge 1$ and the left side is positive, so binary $y$ must be 1. If fewer, the left side is $\\le 0$ and $y$ is free.","bk":false},{"s":2,"t":"q","f":"Model \"if $z_j = 0$ then $x_{ij} = 0$\" and choose $M$.","b":"$x_{ij} \\le M_i z_j$. Use the tightest valid bound: $x_{1j} \\le 8$ (bank), $x_{2j} \\le 6$ (since $10x_{2j} \\le 60$). So $M_2 = 6$, not 60 or $10^6$.","x":"Choose $M$ from bounds the problem already gives you: the bank caps Type 1 at 8 and the clock caps Type 2 at 6.","bk":false},{"s":2,"t":"q","f":"Why use the smallest valid big-M even though any valid $M$ gives a correct model?","b":"The solver relaxes $z_j \\in [0,1]$. With a huge $M$, $x$ can be large while $z_j \\approx 0$, so the LP relaxation bound is useless and the branch-and-bound tree explodes. Correctness and tractability are different questions.","x":"The LP relaxation lets $z$ be fractional; with a huge $M$, $z = x/M$ is tiny and costs almost nothing, so the relaxation bound is weak and branch-and-bound explores far more nodes.","bk":false},{"s":2,"t":"q","f":"Linearize $\\max \\min\\{f_1, \\dots, f_n\\}$ (maximin).","b":"Introduce hypograph $t$: $\\max t$ s.t. $t \\le f_j\\ \\forall j$.","x":"The hypograph variable turns a nonsmooth min into linear constraints.","bk":false},{"s":2,"t":"q","f":"Linearize $\\min \\max\\{f_1, \\dots, f_n\\}$ (minimax).","b":"Introduce epigraph $t$: $\\min t$ s.t. $t \\ge f_j\\ \\forall j$.","x":"The epigraph variable turns a nonsmooth max into linear constraints. Stable regression's dual and $\\ell_\\infty$ losses both use this.","bk":false},{"s":2,"t":"q","f":"Linearize $\\min f(|y_1|, \\dots, |y_n|)$ (absolute values in a minimized objective).","b":"Introduce $t_j$: $\\min f(t_1,\\dots,t_n)$ s.t. $t_j \\ge y_j$, $t_j \\ge -y_j$. Since $|y| = \\max\\{y, -y\\}$, this is the max/epigraph trick in disguise. Minimization squeezes $t_j$ down to $|y_j|$. (This needs $f$ nondecreasing in each $t_j$.)","x":"The trick relies on minimization pushing $t_j$ down. It works whenever the objective is nondecreasing in each $|y_j|$.","bk":false},{"s":2,"t":"q","f":"Linearize the constraint $|f(x)| \\le g(x)$.","b":"No new variable: $f(x) \\le g(x)$ and $-f(x) \\le g(x)$.","x":"$|f| \\le g$ is the same as $-g \\le f \\le g$, two linear constraints when $f$ and $g$ are linear.","bk":false},{"s":2,"t":"q","f":"Why does the $t \\ge y,\\ t \\ge -y$ trick break if you *maximize* $|y|$ or need $|y| \\ge c$?","b":"Nothing pushes $t$ down to $|y|$, so $t$ runs off. \"$|y|$ large\" is a nonconvex (reverse-convex) requirement; modeling it exactly needs binaries (e.g. split $y = y^+ - y^-$ with a binary choosing the sign). See HW1 Q1(c) in §13.","x":"\"$|y|$ must be large\" describes a nonconvex set (two disjoint rays). Convex constraints can't represent it, so you need a binary to choose which side.","bk":false},{"s":3,"t":"term","f":"Uncertainty set $\\mathcal U$","b":"The set of perturbations $\\Delta \\in \\mathbb{R}^{n\\times p}$ to $X$ you protect against. Usually a norm ball $\\{\\Delta : \\|\\Delta\\| \\le \\rho\\}$: the norm encodes what kind of error you expect, and the radius $\\rho$ encodes how much.","x":"The set is a modeling choice: its norm says how errors are distributed, and its radius how large they can be. The set then determines which regularizer appears.","bk":false},{"s":3,"t":"term","f":"Ellipsoidal uncertainty ($\\mathcal U_1$)","b":"$\\{\\Delta : \\|\\Delta\\|_2 \\le \\rho\\}$ (entrywise $\\ell_2$ on $\\mathrm{vec}(\\Delta)$): total squared error over the whole matrix is capped.","x":"An $\\ell_2$ ball on all entries allows errors spread smoothly across the matrix. Big errors in one entry use up budget for all others.","bk":false},{"s":3,"t":"term","f":"Box uncertainty ($\\mathcal U_2$)","b":"$\\{\\Delta : \\|\\Delta\\|_\\infty \\le \\rho\\}$, where $\\|\\Delta\\|_\\infty = \\max_{ij}|\\Delta_{ij}|$: every entry can independently move up to $\\rho$.","x":"Every entry gets its own independent $\\pm\\rho$ interval. It is the most permissive of the four sets for a given $\\rho$ when there are many entries.","bk":false},{"s":3,"t":"term","f":"Diamond uncertainty ($\\mathcal U_3$)","b":"$\\{\\Delta : \\|\\Delta\\|_1 \\le \\rho\\}$: one total absolute-error budget shared by all entries.","x":"An $\\ell_1$ ball favors sparse error patterns: the adversary can put a lot of error in a few entries or spread a little everywhere.","bk":false},{"s":3,"t":"term","f":"Budget uncertainty ($\\mathcal U_4$)","b":"$\\{\\Delta : \\|\\Delta\\|_1 \\le \\Gamma,\\ \\|\\Delta\\|_\\infty \\le \\rho\\}$: per-entry cap $\\rho$ plus a total budget $\\Gamma$ (\"not everything is wrong at once\").","x":"Intersecting the box with an $\\ell_1$ budget is the realistic middle ground: individual errors are capped, and not everything is wrong at once.","bk":false},{"s":3,"t":"term","f":"Norm (three axioms)","b":"(a) $\\|v\\| = 0 \\Rightarrow v = 0$. (b) $\\|\\alpha v\\| = |\\alpha|\\,\\|v\\|$ (absolute homogeneity). (c) $\\|v + w\\| \\le \\|v\\| + \\|w\\|$ (triangle inequality).","x":"These axioms are what make the triangle-inequality step in the robustness proof work, and homogeneity is why $\\|\\beta\\|_0$ fails to be a norm.","bk":false},{"s":3,"t":"term","f":"Seminorm","b":"Satisfies homogeneity and the triangle inequality but not definiteness, so a nonzero $v$ can have $\\|v\\| = 0$.","x":"Seminorms appear because the book allows the loss $g$ to be a seminorm in Theorem 2.1, and because $h(\\beta) = \\max_\\Delta g(\\Delta\\beta)$ may vanish on some directions.","bk":false},{"s":3,"t":"term","f":"Dual norm","b":"$\\|\\beta\\|_* = \\max_{x \\ne 0} \\dfrac{\\beta^\\top x}{\\|x\\|}$ (equivalently $\\max_{\\|x\\|\\le 1}\\beta^\\top x$). The dual of the dual is the original norm.","x":"The dual norm measures the largest inner product against unit vectors. It is exactly what the adversary computes when it aligns a perturbation with $\\beta$.","bk":false},{"s":3,"t":"term","f":"Conjugate exponent $q^*$","b":"$1/q + 1/q^* = 1$. $\\ell_{q^*}$ is the dual of $\\ell_q$: $\\ell_2 \\leftrightarrow \\ell_2$, $\\ell_1 \\leftrightarrow \\ell_\\infty$.","x":"Hölder's inequality $|a^\\top b| \\le \\|a\\|_q\\|b\\|_{q^*}$ is tight for conjugate pairs, which is why $q^*$ shows up in Frobenius-ball penalties.","bk":false},{"s":3,"t":"term","f":"$q$-Frobenius norm $\\|\\Delta\\|_{F_q}$","b":"Entrywise $\\ell_q$ norm: $\\big(\\sum_{ij}|\\Delta_{ij}|^q\\big)^{1/q}$. Usual Frobenius = $F_2$. $F_{q^*}$ is dual to $F_q$.","x":"Frobenius norms treat the matrix as one long vector, so they model a single shared error budget across all $np$ entries.","bk":false},{"s":3,"t":"term","f":"$r$-spectral (Schatten) norm $\\|\\Delta\\|_{\\sigma_r}$","b":"$\\ell_r$ norm of the vector of singular values $\\mu(\\Delta)$. $\\sigma_{r^*}$ is dual to $\\sigma_r$.","x":"Schatten norms look at singular values, so they measure \"directional\" size of the matrix. With $\\ell_2$ loss they always give ridge.","bk":false},{"s":3,"t":"term","f":"Induced norm $\\|\\Delta\\|_{(r,q)}$","b":"$\\max_{x \\ne 0} \\dfrac{\\|\\Delta x\\|_q}{\\|x\\|_r}$, the worst-case gain of $\\Delta$. First index = input / $\\beta$ / penalty norm; second = output / residual / loss norm. So $\\|\\Delta x\\|_q \\le \\|\\Delta\\|_{(r,q)}\\|x\\|_r$.","x":"Induced norms describe how much $\\Delta$ can amplify a vector. Remember the index order: first index = norm on the input $\\beta$ (the penalty), second = norm on the output (the loss).","bk":false},{"s":3,"t":"term","f":"Ridge regression (regularized least squares, RLS)","b":"$\\min_\\beta \\|y - X\\beta\\|_2^2 + \\lambda\\|\\beta\\|_2^2$. In the robust view the course uses the unsquared version $\\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_2$.","x":"Ridge shrinks all coefficients smoothly toward zero but never sets them exactly to zero. In the course's robust view it is protection against global perturbations.","bk":false},{"s":3,"t":"term","f":"Lasso","b":"Least absolute shrinkage and selection operator: $\\min_\\beta \\|y - X\\beta\\|_2^2 + \\lambda\\|\\beta\\|_1$ (Tibshirani 1996). In the robust view: $\\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$.","x":"The $\\ell_1$ penalty's corners produce exact zeros, which is why Lasso is used for selection. The course's view is that its real strength is robustness to feature-wise errors.","bk":false},{"s":3,"t":"term","f":"Least absolute deviation (LAD)","b":"Regression with $\\ell_1$ loss: $\\min_\\beta \\|y - X\\beta\\|_1$.","x":"LAD is less sensitive to outlying $y$ values than least squares but, like LS, has breakdown point 0 because of leverage points in $X$.","bk":false},{"s":3,"t":"term","f":"Elastic net","b":"Ridge + Lasso hybrid: $\\min_\\beta \\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_1 + \\mu\\|\\beta\\|_2$.","x":"Elastic net mixes ridge and Lasso; in the robust view each penalty corresponds to a different kind of perturbation added together.","bk":false},{"s":3,"t":"term","f":"Averaged uncertainty","b":"Average the loss over all perturbations in $\\mathcal U$ (integral over $\\mathcal U$) instead of taking the worst case.","x":"Averaging instead of taking the worst case is a softer form of caution. The surprise is that it still yields a regularizer (ridge).","bk":false},{"s":3,"t":"term","f":"Discrepancy function $\\delta_n(a,b)$","b":"$\\max\\{\\|u\\|_a : u \\in \\mathbb{R}^n, \\|u\\|_b = 1\\}$, which equals $n^{1/a - 1/b}$ if $a < b$ and $1$ if $a \\ge b$. Measures how much switching norms can inflate a vector.","x":"$\\delta_n$ measures how much a vector's norm can grow when you switch from the $b$-norm to the $a$-norm. It is the factor separating the upper and lower regularization bounds when robustness and regularization are not equivalent.","bk":true},{"s":3,"t":"term","f":"Error-in-variables / total least squares","b":"$\\min_{\\beta,\\Delta} \\|y - (X+\\Delta)\\beta\\|_2 + \\gamma\\|\\Delta\\|_F$. An **optimistic** view (choose the most favorable $\\Delta$), the opposite of RO's pessimistic $\\max_\\Delta$.","x":"Error-in-variables picks the most favorable correction to $X$, which is optimistic and can overfit. RO picks the least favorable, which is pessimistic and regularizes.","bk":true},{"s":3,"t":"q","f":"Motivating example (diabetes, $n=350$, $p=55$): what goes wrong with OLS?","b":"Perturbing the 10 baseline measurements by just 1% flips coefficients: LDL $2.91 \\to -2.62$, HDL $-2.75 \\to 2.18$ (Age, Sex unchanged). OLS is not robust to small errors in $X$.","x":"A 1% perturbation flipping the signs of LDL and HDL shows OLS coefficients are unstable when features are correlated. This motivates protecting against perturbations of $X$.","bk":false},{"s":3,"t":"q","f":"Write the robust linear regression problem.","b":"$$\\min_\\beta \\max_{\\Delta \\in \\mathcal U} \\|y - (X + \\Delta)\\beta\\|_q$$\nThe inner max is the worst-case loss over plausible data matrices $X + \\Delta$; the outer min picks $\\beta$ against that adversary.","x":"The inner max computes the worst loss over the uncertainty set for a given $\\beta$; the outer min chooses $\\beta$ to make that worst case small.","bk":false},{"s":3,"t":"q","f":"Regularization view of linear regression and the standard special cases?","b":"$\\min_\\beta \\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_r$, $q, r \\in \\{1,2\\}$. $q = r = 2$: ridge. $q = 2$, $r = 1$: Lasso.","x":"Regularization adds a penalty to the loss. The lecture's thesis is that these familiar penalties are exactly robust counterparts for suitable uncertainty sets.","bk":false},{"s":3,"t":"q","f":"Averaged uncertainty theorem (Lec 2).","b":"$$\\int_{\\Delta\\in\\mathcal U} \\|y - (X+\\Delta)\\beta\\|_2^2\\, d\\mathcal U = \\|y - X\\beta\\|_2^2 + f(n,k,\\rho)\\,\\|\\beta\\|_2^2$$\nAveraging over any of the four sets gives **ridge regression**; only the constant differs. Box: $f = \\rho^2 n/3$. Diamond: $f = 2\\rho^2 n/((nk+2)(nk+1))$. Budget: a longer closed form. (The slide prints the ellipsoidal constant as $1/k$, which looks off since every other row scales like $\\rho^2 n$; check before quoting.)","x":"Averaging the squared loss over a symmetric set kills the cross terms and leaves $E\\|\\Delta\\beta\\|^2$, which is proportional to $\\|\\beta\\|_2^2$. That is why every set gives a ridge term.","bk":false},{"s":3,"t":"q","f":"Takeaway of averaged vs. worst-case uncertainty?","b":"Even average-case caution gives ridge. Worst-case (robust) caution gives regularization with a norm determined by the uncertainty set: ridge, Lasso, or others.","x":"Average-case caution gives ridge regardless of the set; worst-case caution gives a penalty whose norm depends on the set. That is the extra modeling power of RO.","bk":false},{"s":3,"t":"q","f":"Dual norm pairs to know cold.","b":"$\\ell_2 \\leftrightarrow \\ell_2$. $\\ell_1 \\leftrightarrow \\ell_\\infty$ ($\\|t\\|_* = \\max_j|t_j|$). $\\ell_\\infty \\leftrightarrow \\ell_1$ ($\\sum_j|t_j|$). $\\ell_p \\leftrightarrow \\ell_{p/(p-1)}$. Same pairing for $F_q \\leftrightarrow F_{q^*}$ and $\\sigma_r \\leftrightarrow \\sigma_{r^*}$.","x":"These pairs come from Hölder's inequality. Getting the dual pair right is the most common place to slip in robust counterparts.","bk":false},{"s":3,"t":"q","f":"Equivalence theorem for Frobenius uncertainty $\\mathcal U_{F(q)} = \\{\\|\\Delta\\|_{F_q} \\le \\rho\\}$.","b":"$$\\min_\\beta \\max_{\\Delta \\in \\mathcal U_{F(q)}} \\|y - (X+\\Delta)\\beta\\|_q = \\min_\\beta \\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_{q^*}$$\nThe loss norm and the Frobenius index match ($q$); the penalty is the **dual** norm $q^*$.","x":"The adversary's best move against the $q$-loss under an $F_q$ budget costs exactly $\\rho\\|\\beta\\|_{q^*}$, by Hölder's inequality applied to the residual and $\\beta$.","bk":false},{"s":3,"t":"q","f":"Equivalence theorem for induced uncertainty $\\mathcal U_{(r,q)} = \\{\\|\\Delta\\|_{(r,q)} \\le \\rho\\}$.","b":"$$\\min_\\beta \\max_{\\Delta \\in \\mathcal U_{(r,q)}} \\|y - (X+\\Delta)\\beta\\|_q = \\min_\\beta \\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_r$$\nThe penalty uses the first index $r$, with **no dual**. (HW1 trap: don't write $r^*$.)","x":"The induced norm is defined so that $\\|\\Delta\\beta\\|_q \\le \\rho\\|\\beta\\|_r$ for every $\\Delta$ in the ball, and the bound is attained, so the penalty is $\\|\\beta\\|_r$ directly.","bk":false},{"s":3,"t":"q","f":"General form of the induced-norm equivalence (Theorem 2.1).","b":"If $g:\\mathbb{R}^n\\to\\mathbb{R}$ is a seminorm (not identically zero) and $h:\\mathbb{R}^p\\to\\mathbb{R}$ is a norm, then for any $z, \\beta$:\n$$\\max_{\\Delta \\in \\mathcal U_{(h,g)}} g(z + \\Delta\\beta) = g(z) + \\lambda h(\\beta),\\quad \\mathcal U_{(h,g)} = \\{\\Delta : \\|\\Delta\\|_{(h,g)} \\le \\lambda\\}.$$","x":"This general version covers any seminorm loss and any norm penalty. Corollary 2.1 (ridge and Lasso) are special cases.","bk":true},{"s":3,"t":"q","f":"Which robust problem is ridge, and what does it protect against?","b":"$\\mathcal U_{F(2)}$ with $\\ell_2$ loss: $\\min_\\beta \\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_2$. Ridge protects against **global** perturbations: one budget $\\sqrt{\\sum_{ij}\\Delta_{ij}^2} \\le \\rho$ shared over all $np$ entries (diffuse noise such as rounding).","x":"The Frobenius ball caps total squared error over all entries, a single global budget, and its robust counterpart is the unsquared ridge problem.","bk":false},{"s":3,"t":"q","f":"Which robust problem is Lasso, and what does it protect against?","b":"$\\mathcal U_{(1,2)}$ with $\\ell_2$ loss: $\\min_\\beta \\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$. Lasso protects against **feature-wise** perturbations: each column $\\Delta_j$ gets its own budget $\\|\\Delta_j\\|_2 \\le \\rho$.","x":"$\\mathcal U_{(1,2)}$ caps each column separately, i.e. each feature's measurement error. That is the interpretation that explains Lasso's out-of-sample strength.","bk":false},{"s":3,"t":"q","f":"Show $\\mathcal U_{(1,2)} = \\{\\Delta : \\|\\Delta_j\\|_2 \\le \\rho\\ \\forall j\\}$ (columns $\\Delta_j$).","b":"(⊆) Plug in $x = e_j$: $\\|\\Delta e_j\\|_2 = \\|\\Delta_j\\|_2 \\le \\rho\\|e_j\\|_1 = \\rho$.\n(⊇) $\\|\\Delta\\beta\\|_2 = \\|\\sum_j \\beta_j\\Delta_j\\|_2 \\le \\sum_j |\\beta_j|\\,\\|\\Delta_j\\|_2 \\le \\rho\\|\\beta\\|_1$, so $\\|\\Delta\\|_{(1,2)} \\le \\rho$.","x":"Testing $x = e_j$ shows each column is bounded; the triangle inequality over columns shows the bound holds for all $x$. Both directions together prove equality of the sets.","bk":false},{"s":3,"t":"q","f":"Geometric reason $\\|\\Delta\\|_{(1,2)} = \\max_j\\|\\Delta_j\\|_2$ (Rec 2).","b":"The $\\ell_1$ unit ball is the convex hull of $\\pm e_j$, and $\\Delta$ maps those vertices to the columns $\\pm\\Delta_j$. A convex function (a norm) is maximized over a polytope at a vertex, so the max gain is the longest column. The same logic gives $\\|\\Delta\\|_{(1,q)} = \\max_j\\|\\Delta_j\\|_q$ for any $q$.","x":"Norms are convex, and the $\\ell_1$ ball's extreme points are $\\pm e_j$, so the worst-case gain is attained at one of them, giving the longest column.","bk":false},{"s":3,"t":"q","f":"Proof idea of the induced-norm equivalence (two directions).","b":"(≤) Triangle inequality plus the induced-norm bound: $\\|y - (X+\\Delta)\\beta\\|_q \\le \\|y - X\\beta\\|_q + \\|\\Delta\\beta\\|_q \\le \\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_r$.\n(≥) Construct one worst case: a rank-one $\\Delta_0 = -\\rho\\, u v^\\top$ with $u = r/\\|r\\|_q$ ($r = y - X\\beta$) and $v$ the dual-norm maximizer ($v^\\top\\beta = \\|\\beta\\|_r$, $\\|v\\|_{r^*} = 1$). It pushes the residual further along its own direction by exactly $\\rho\\|\\beta\\|_r$, and $\\Delta_0 \\in \\mathcal U$.","x":"The upper bound is easy (triangle inequality). The work is the lower bound: one explicit rank-one perturbation that pushes the residual further in its own direction achieves the bound, so the max equals it.","bk":false},{"s":3,"t":"q","f":"Proving a max-type identity: what is different about the two directions?","b":"$\\le$ is **universal**: bound an arbitrary feasible point. $\\ge$ is **existential**: construct one witness, check it is feasible, and evaluate it. Don't write the $\\le$ argument twice.","x":"For a $\\max$, $\\le$ needs to hold for every feasible point and $\\ge$ needs just one witness. Treating both as universal arguments is a common proof error.","bk":false},{"s":3,"t":"q","f":"Robust interpretation of the elastic net.","b":"$$\\min_\\beta \\max_{\\Delta \\in \\mathcal U_{(1,2)}(\\lambda),\\ \\Delta' \\in \\mathcal U_{F_2}(\\mu)} \\|y - (X + \\Delta + \\Delta')\\beta\\|_2 = \\min_\\beta \\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_1 + \\mu\\|\\beta\\|_2$$\n$\\lambda$ controls **feature-wise** perturbations $\\Delta$; $\\mu$ controls **global** (Frobenius) perturbations $\\Delta'$. Perturbations from two sets added to $X$ contribute both penalties.","x":"Perturbations from two sets added together contribute the sum of their penalties. The $\\ell_1$ term is feature-wise and the $\\ell_2$ term is global.","bk":false},{"s":3,"t":"q","f":"Robustness to row-wise perturbations (Theorem 2.3): $\\mathcal U = \\{\\Delta : \\|\\delta_i\\|_q \\le \\lambda\\ \\forall i\\}$ ($\\delta_i$ = row $i$).","b":"For $\\ell_1$ and $\\ell_\\infty$ losses robustness again equals regularization with the dual norm $\\|\\beta\\|_{q^*}$: the $\\ell_\\infty$ loss gets $+\\lambda\\|\\beta\\|_{q^*}$ and the $\\ell_1$ loss gets $+n\\lambda\\|\\beta\\|_{q^*}$ (book Table 2.2: $\\lambda n^{1/r}\\|\\beta\\|_{q^*}$, exact only for $r \\in \\{1, \\infty\\}$). This set is an induced ball: $\\mathcal U = \\mathcal U_{(q^*, \\infty)}$.","x":"Row-wise sets model per-sample corruption. With $\\ell_\\infty$ loss only the worst row matters, so the penalty is $\\lambda\\|\\beta\\|_{q^*}$; with $\\ell_1$ loss every row contributes, so it is multiplied by $n$.","bk":true},{"s":3,"t":"q","f":"Is robustness always equivalent to regularization?","b":"No, only for a narrow set of parameters. Example (Thm 2.4): $\\ell_r$ loss with an $F_q$ ball is exact iff $r = q$ or $r \\in \\{1, \\infty\\}$. For $r \\in (1,\\infty)$, $r \\ne q$, regularization only gives upper and lower bounds (with the discrepancy factor $\\delta_n$), and the upper bound is strict for almost all $z$.","x":"Equivalence needs a match between the loss and the uncertainty geometry. Outside those cases regularization only brackets the robust problem.","bk":true},{"s":3,"t":"q","f":"Example 2.1: bounds for $\\ell_2$ loss with an $F_\\infty$ (box) ball.","b":"$$\\min_\\beta \\|y-X\\beta\\|_2 + \\lambda\\|\\beta\\|_1 \\ \\le\\ \\min_\\beta \\max_{\\Delta} \\|y-(X+\\Delta)\\beta\\|_2 \\ \\le\\ \\min_\\beta \\|y-X\\beta\\|_2 + \\lambda\\sqrt n\\,\\|\\beta\\|_1$$\nNot equivalent; the gap can be large when $n$ is large.","x":"The gap factor $\\sqrt n$ comes from $\\delta_n(2,\\infty)$: switching from $\\ell_\\infty$ to $\\ell_2$ on $n$-vectors can multiply norms by up to $\\sqrt n$.","bk":true},{"s":3,"t":"q","f":"If robustness and regularization are not equivalent, can they give different solutions?","b":"Yes (Thm 2.5). The robust optimum need not solve the regularized problem for any $\\lambda$, and vice versa. The regularization path and the robustness path can differ structurally.","x":"When the two problems differ, choosing $\\lambda$ for regularization is not the same as choosing a robustness radius; they can select different models.","bk":true},{"s":3,"t":"q","f":"Proposition 2.1: what does any compact uncertainty set always give you?","b":"$h(\\beta) := \\max_{\\Delta\\in\\mathcal U} g(\\Delta\\beta)$ is a seminorm and $\\max_{\\Delta\\in\\mathcal U} g(z + \\Delta\\beta) \\le g(z) + h(\\beta)$, with equality when $z = 0$. Regularization always upper-bounds the robust problem; \"equivalence\" means the bound is tight for all $(z, \\beta)$.","x":"For any compact set, the worst-case damage is subadditive and homogeneous in $\\beta$, so it defines a seminorm. The robust problem is always upper-bounded by this regularized problem.","bk":true},{"s":3,"t":"q","f":"Spectral uncertainty: what happens with $\\ell_2$ loss and any Schatten ball $\\mathcal U_{\\sigma_q}$?","b":"It always gives ridge: $\\min_\\beta \\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_2$ for every $q \\in [1,\\infty]$. This \"universality of RLS\" holds because $\\ell_2$ underlies the SVD. For $\\ell_r$ loss with $r \\notin \\{1,2,\\infty\\}$ it is no longer exact.","x":"Spectral balls constrain singular values, and the $\\ell_2$ loss is exactly what singular values control, so the worst case always lines up with $\\|\\beta\\|_2$.","bk":true},{"s":3,"t":"q","f":"How do you handle uncertainty in $y$ as well as $X$?","b":"Fold it into the loss: $\\bar g(v) := \\max_{\\delta \\in \\mathcal V} g(v + \\delta)$, which is convex if $g$ is. Then solve $\\min_\\beta \\max_{\\Delta\\in\\mathcal U} \\bar g(y - (X+\\Delta)\\beta)$, with uncertainty only in $X$.","x":"Uncertainty in $y$ can be absorbed into a new convex loss, so the analysis can focus on uncertainty in $X$ without loss of generality.","bk":true},{"s":3,"t":"q","f":"Label noise $\\|\\delta\\|_2 \\le \\lambda$ with $\\ell_2$ loss: what does robustifying give? (HW1 Q1d)","b":"$\\max_{\\|\\delta\\|_2\\le\\lambda} \\|y + \\delta - X\\beta\\|_2 = \\|y - X\\beta\\|_2 + \\lambda$ (align $\\delta$ with the residual). That is a constant shift, not $\\lambda\\|\\beta\\|_2$, so it does not change the minimizer. The claimed ridge equivalence is **false**.","x":"The adversary just inflates the residual by $\\lambda$ in its own direction. A constant added to the objective does not change the argmin, so label noise of this kind gives no regularization.","bk":false},{"s":3,"t":"q","f":"How do you solve $\\min_\\beta \\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$ in a solver?","b":"Epigraph plus an SOC constraint: $\\min\\ t + \\rho\\sum_j a_j$ s.t. $\\|y - X\\beta\\|_2 \\le t$ (second-order cone), $\\beta_j \\le a_j$, $-\\beta_j \\le a_j$. Easily solved in JuMP.","x":"The epigraph turns the nonsmooth norm into a second-order cone constraint and the $\\ell_1$ term into linear constraints, so any SOCP solver handles it.","bk":false},{"s":3,"t":"q","f":"Cutting-plane approach to a robust regression problem.","b":"1. Pick $\\Delta_1 \\in \\mathcal U$; set $\\mathcal U_1 = \\{\\Delta_1\\}$.\n2. Solve $\\min_\\beta \\max_{\\Delta\\in\\mathcal U_t}\\|y - (X+\\Delta)\\beta\\|_2$ to get $\\beta_t^*$.\n3. Find the worst case $\\Delta_t^* \\in \\arg\\max_{\\Delta\\in\\mathcal U}\\|y - (X+\\Delta)\\beta_t^*\\|_2$. If it beats the max over $\\mathcal U_t$, set $\\mathcal U_{t+1} = \\mathcal U_t \\cup \\{\\Delta_t^*\\}$ and repeat; otherwise stop.","x":"This is the generic RO cutting-plane loop: optimize against a finite set of scenarios, find the worst scenario for the current solution, add it, repeat until no scenario is worse.","bk":false},{"s":3,"t":"q","f":"Lec 2 experiments: setup and results.","b":"UCI data (Abalone, Auto MPG, Comp Hard, Concrete, Housing, Space Shuttle, WPBC, Forest Fires). \"Rob $q$-$r$\" = $\\min\\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_r$, $q, r \\in \\{1,2\\}$. Split 50/25/25 train/val/test; $\\rho$ picked by validation MSE. Every robust variant beat OLS out of sample; Rob 2-2 (ridge-like) was best in 6/8 (book: average MSE improvement ≈ 4.3% over 30 random splits).","x":"Every robust variant beating OLS across UCI datasets is the empirical support for \"robustness improves out-of-sample performance.\"","bk":false},{"s":3,"t":"q","f":"Lec 2 conclusions (4).","b":"(1) Averaged uncertainty gives ridge. (2) Robustness improves regression out of sample. (3) Robustness can be achieved by adding regularization. (4) The computational cost of robustness is small (easily solvable in JuMP).","x":"These four conclusions are the lecture's argument in one line each: robustness helps, it equals regularization, and it is cheap.","bk":false},{"s":3,"t":"q","f":"Why does the book say regularized regression does well out of sample?","b":"In the reported settings regularization **is** robustness: it protects against data perturbations, which naturally improves out-of-sample performance. Corollary from Ch. 3: Lasso's success comes mainly from robustness, not sparsity.","x":"Regularized models generalize well because they are robust to data perturbations, which ties a statistical practice to an optimization principle.","bk":true},{"s":3,"t":"q","f":"Robust statistics vs. robust optimization?","b":"Robust statistics takes a distributional perspective (e.g. contamination models). RO models uncertainty deterministically with uncertainty sets and optimizes the worst case.","x":"The difference is philosophical: robust statistics assumes a contamination distribution; RO only assumes a set of possible errors and protects against the worst.","bk":true},{"s":3,"t":"q","f":"Rec 2: what kind of noise does a $q$-Frobenius ball describe vs. an induced $(r,q)$ ball?","b":"**Frobenius**: one total error budget shared across all $np$ entries; error spent in one cell is unavailable elsewhere (diffuse noise: rounding, a slightly-off instrument). **Induced**: a cap on the worst-case gain $\\|\\Delta x\\|_q / \\|x\\|_r$; with $r = 1$, every column gets its own budget.","x":"Frobenius = one shared budget across all entries; induced with $r=1$ = a separate budget per column. Match the set to how errors arise in your data.","bk":false},{"s":3,"t":"q","f":"Rec 2 poll: $p = 50$ features, each scraped from a different source; any could be off by up to $\\rho$, possibly several at once. Which set: $\\|\\Delta\\|_{F_2} \\le \\rho$ or $\\|\\Delta\\|_{(1,2)} \\le \\rho$?","b":"$\\|\\Delta\\|_{(1,2)} \\le \\rho$. The $F_2$ ball is one shared budget, so spending it on one column forces the other 49 to be exact. $\\|\\Delta\\|_{(1,2)} = \\max_j\\|\\Delta_j\\|_2$ gives every column its own $\\rho$.","x":"Because every feature can be off by $\\rho$ simultaneously, you need a per-column budget. A shared Frobenius budget would force most columns to be nearly exact.","bk":false},{"s":3,"t":"q","f":"HW1 set $\\mathcal A = \\{\\Delta : \\|\\Delta_j\\|_\\infty \\le \\lambda\\ \\forall j\\}$: what is it as an induced ball and as a region, and what penalty does it give with $\\ell_\\infty$ loss?","b":"$\\mathcal A = \\mathcal U_{(1,\\infty)}$ with radius $\\lambda$ (using $\\|\\Delta\\|_{(1,q)} = \\max_j\\|\\Delta_j\\|_q$). Capping every column in $\\ell_\\infty$ caps every entry, so it is the **box** $|\\Delta_{ij}| \\le \\lambda$. Penalty (first index 1): $\\lambda\\|\\beta\\|_1$.","x":"A box on entries is the same as an $\\ell_\\infty$ cap on every column. The induced first index 1 means \"per column,\" so the penalty is $\\ell_1$.","bk":false},{"s":3,"t":"q","f":"HW1 set $\\mathcal B = \\{\\Delta : \\|\\delta_i\\|_1 \\le \\rho\\ \\forall i\\}$ (row budget): what induced ball is it, and what penalty does it give with $\\ell_\\infty$ loss?","b":"$\\mathcal B = \\mathcal U_{(\\infty,\\infty)}$ with radius $\\rho$, since $\\|\\Delta\\|_{(\\infty,\\infty)} = \\max_i\\|\\delta_i\\|_1$. Penalty (first index $\\infty$): $\\rho\\|\\beta\\|_\\infty$.","x":"A per-row $\\ell_1$ budget lets each listing distort its features in total up to $\\rho$. The induced norm is $(\\infty, \\infty)$, so the penalty is $\\ell_\\infty$.","bk":false},{"s":3,"t":"q","f":"Prove $\\|\\Delta\\|_{(\\infty,\\infty)} = \\max_i \\|\\delta_i\\|_1$.","b":"(≤) $\\|\\Delta x\\|_\\infty = \\max_i|\\delta_i^\\top x| \\le \\max_i \\|\\delta_i\\|_1\\|x\\|_\\infty$ (Hölder).\n(≥) Witness: fix $i^\\star \\in \\arg\\max_i\\|\\delta_i\\|_1$ first, then set $x^\\star_j = \\mathrm{sign}(\\Delta_{i^\\star j})$. Then $\\|x^\\star\\|_\\infty = 1$ and $\\|\\Delta x^\\star\\|_\\infty \\ge \\delta_{i^\\star}^\\top x^\\star = \\|\\delta_{i^\\star}\\|_1$.","x":"The $\\le$ step is Hölder per row; the $\\ge$ step builds a sign vector matched to the worst row. Picking the row first is what makes the witness work.","bk":false},{"s":3,"t":"q","f":"Why does a row budget measured in $\\ell_1$ show up as first index $\\infty$? Which row budget gives first index 2?","b":"Duality: $\\max_{\\|x\\|_\\infty \\le 1}\\delta_i^\\top x = \\|\\delta_i\\|_1$, so $\\ell_1$ on rows pairs with $\\ell_\\infty$ on the input $x$. In general a row budget $\\|\\delta_i\\|_s \\le \\rho$ is $\\mathcal U_{(s^*,\\infty)}$. First index 2 needs an $\\ell_2$ row budget ($\\ell_2$ is self-dual).","x":"The row budget's norm and the input norm are dual: $\\max_{\\|x\\|_\\infty\\le1}\\delta^\\top x = \\|\\delta\\|_1$. So an $\\ell_s$ row budget corresponds to first index $s^*$.","bk":false},{"s":3,"t":"q","f":"HW1: one listing, two features ($n=1$, $p=2$). When is $\\mathcal B \\subseteq \\mathcal A$, $\\mathcal A \\subseteq \\mathcal B$, or neither?","b":"$\\mathcal A$ = square $[-\\lambda,\\lambda]^2$; $\\mathcal B$ = diamond $|\\Delta_{11}| + |\\Delta_{12}| \\le \\rho$.\n$\\mathcal B \\subseteq \\mathcal A$ iff $\\rho \\le \\lambda$ (diamond vertices inside the square).\n$\\mathcal A \\subseteq \\mathcal B$ iff $2\\lambda \\le \\rho$ (square corner $(\\lambda,\\lambda)$ inside the diamond).\nNeither iff $\\lambda < \\rho < 2\\lambda$.","x":"Compare the extreme points: the diamond's vertices $(\\pm\\rho, 0)$ fit in the square iff $\\rho \\le \\lambda$, and the square's corner $(\\lambda,\\lambda)$ fits in the diamond iff $2\\lambda \\le \\rho$.","bk":false},{"s":3,"t":"q","f":"HW1: same containment conditions with general $p$ features?","b":"$\\mathcal B \\subseteq \\mathcal A$ iff $\\rho \\le \\lambda$ (unchanged, since the diamond's vertices are axis points). $\\mathcal A \\subseteq \\mathcal B$ iff $p\\lambda \\le \\rho$ (the box corner has $\\ell_1$ norm $p\\lambda$). The box gets relatively bigger as $p$ grows.","x":"The diamond's vertices stay on the axes, so the first condition doesn't change. The box corner's $\\ell_1$ norm is $p\\lambda$, so containing the box needs $\\rho \\ge p\\lambda$.","bk":false},{"s":3,"t":"q","f":"What do the $\\ell_1$ penalty (from $\\mathcal A$) and the $\\ell_\\infty$ penalty (from $\\mathcal B$) do differently to $\\beta$? (HW1 Q3b)","b":"**$\\ell_1$**: shrinking *any* coefficient by one unit saves $\\lambda$, a flat price. All coefficients shrink, and any that can't beat $\\lambda$ in fit go to **zero** (sparsity).\n**$\\ell_\\infty$**: only the largest $|\\beta_j|$ is priced. Shrinking non-max coefficients saves nothing, and shrinking the max stalls when it meets the runner-up. So $\\ell_\\infty$ gives no sparsity; coefficients **tie at a common ceiling** (beds = laundry = $w$ = 145.81 in the B-only run).","x":"The $\\ell_1$ penalty prices every unit of every coefficient equally, so weak coefficients go to zero. The $\\ell_\\infty$ penalty prices only the peak, so coefficients pile up at a shared ceiling instead.","bk":false},{"s":3,"t":"q","f":"Adversary story behind the $\\ell_1$ vs. $\\ell_\\infty$ penalties.","b":"Box $\\mathcal A$: every recorded number is independently off by up to $\\lambda$, so the adversary matches each error to $\\mathrm{sign}(\\beta_j)$ and the damage sums over all features, $\\lambda\\|\\beta\\|_1$. Row budget $\\mathcal B$: a poster has a total distortion budget and dumps it all on the feature with the largest $|\\beta_j|$, so the damage is $\\rho\\|\\beta\\|_\\infty$. An $\\ell_1$-budgeted liar concentrates, so the defense flattens the peak.","x":"The penalty mirrors where the adversary concentrates damage: a per-entry adversary hits all features (sum of magnitudes), while a budgeted adversary hits the single largest coefficient (max magnitude).","bk":false},{"s":4,"t":"term","f":"Best subset selection","b":"$\\min_\\beta \\tfrac12\\|y - X\\beta\\|_2^2$ s.t. $\\|\\beta\\|_0 \\le k$. The course/book version adds a ridge term: $\\min_\\beta \\tfrac12\\|y - X\\beta\\|_2^2 + \\tfrac{1}{2\\gamma}\\|\\beta\\|_2^2$ s.t. $\\|\\beta\\|_0 \\le k$.","x":"The ridge term $\\tfrac1{2\\gamma}\\|\\beta\\|_2^2$ is there for robustness (Ch. 2) and also makes the inner problem strongly convex, which gives the closed form the dual method relies on.","bk":false},{"s":4,"t":"term","f":"$\\ell_0$ \"norm\" $\\|\\beta\\|_0$","b":"Number of nonzero entries. Not a true norm because it fails absolute homogeneity: $\\|2\\beta\\|_0 = \\|\\beta\\|_0$.","x":"Because scaling $\\beta$ doesn'
