 tuned one at a time in sequence.","bk":false},{"s":11,"t":"term","f":"Group sparsity","b":"Groups of variables whose coefficients must be all zero or all nonzero (e.g. dummies for one categorical variable): $z_i = z_l\\ \\forall i, l\\in GS_m$.","x":"Dummy variables of one categorical feature only make sense together, so they should enter or leave the model as a group.","bk":false},{"s":11,"t":"term","f":"Limited pairwise multicollinearity","b":"Never select two variables whose absolute correlation exceeds $\\rho$: $z_i + z_j \\le 1\\ \\forall (i,j)\\in HC$.","x":"Two highly correlated features make coefficients unstable and can flip signs; allowing only one of them keeps coefficients interpretable.","bk":false},{"s":11,"t":"term","f":"$HC$ (or $HC_\\rho$)","b":"The set of variable pairs with pairwise correlation above the threshold $\\rho$ (default 0.8).","x":"$HC$ is computed once in preprocessing from the training correlation matrix with threshold $\\rho$ (default 0.8).","bk":false},{"s":11,"t":"term","f":"$T_m$ (transformation set)","b":"Variable $x_m$ together with its candidate nonlinear transforms (defaults $x^2$, $\\sqrt x$, $\\log x$). At most one may enter: $\\sum_{i\\in T_m}z_i \\le 1$.","x":"Allowing at most one transformation of each variable avoids redundant, highly correlated versions of the same feature.","bk":false},{"s":11,"t":"term","f":"$k_{\\max}$","b":"The largest subset size for which the selective-sparsity constraints are still feasible: $\\max\\sum_i z_i$ s.t. $z_i + z_j \\le 1\\ \\forall(i,j)\\in HC$, $z$ binary (a maximum independent set in the \"high correlation\" graph).","x":"If too many features conflict pairwise, the feasible support size is limited; $k_{\\max}$ tells you the largest $k$ worth trying.","bk":false},{"s":11,"t":"term","f":"$t$-statistic for $\\beta_j$","b":"$\\dfrac{\\hat\\beta_j - \\beta_j}{\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}} \\sim t_{n-p}$ when $\\epsilon\\sim N(0,\\sigma^2I)$.","x":"The $t$-statistic standardizes a coefficient by its standard error; under normal errors it follows a $t_{n-p}$ distribution.","bk":false},{"s":11,"t":"term","f":"$\\tilde\\sigma^2$","b":"Least-squares error variance estimate: $\\dfrac{Y^\\top(I_n - X(X^\\top X)^{-1}X^\\top)Y}{n - p}$.","x":"$\\tilde\\sigma^2$ is the residual variance from the least-squares fit with $n - p$ degrees of freedom.","bk":false},{"s":11,"t":"term","f":"$t_\\alpha$ (significance cutoff)","b":"$T^{-1}_{n-p}(1 - \\alpha/2)$, the inverse CDF of $t_{n-p}$ at $1 - \\alpha/2$.","x":"For a two-sided test of size $\\alpha$, a coefficient is significant when $|t| \\ge t_\\alpha$.","bk":false},{"s":11,"t":"term","f":"$\\varepsilon$-multicollinear relationship","b":"Variables $X_1,\\dots,X_p$ with some $a$, $\\|a\\| = 1$, such that $\\|\\sum_j a_jX_j\\| \\le \\varepsilon$: a near-linear dependence that can involve many variables.","x":"Near-dependencies can involve several variables at once, so they won't necessarily show up as large pairwise correlations.","bk":true},{"s":11,"t":"term","f":"Condition number (of the selected design)","b":"Ratio of the largest to smallest singular value of $X_S$. Large means multicollinearity and unstable coefficients. Reported as \"Cond\".","x":"A large condition number means some combination of selected columns is nearly zero, which inflates coefficient variance.","bk":false},{"s":11,"t":"q","f":"The \"art\" of building regression models today (manual steps).","b":"Transform variables. Look at pairwise scatterplots and the correlation matrix. Delete highly correlated variables. Delete variables with insignificant $t$-tests. Examine residuals. Try dropping or adding variables. Validate the final model. Done one property at a time, by trial and error, with no optimality guarantee.","x":"Each manual step is reasonable but the order matters and nothing guarantees the final model satisfies all goals together.","bk":false},{"s":11,"t":"q","f":"Aspiration of holistic regression (\"from art to science\").","b":"An algorithmic, automated process: express every desirable statistical property as an MIO constraint, then find a model satisfying all of them, or get a proof that it is not possible.","x":"Turning modeling goals into constraints converts \"craft\" into an optimization problem that either succeeds or proves infeasibility.","bk":false},{"s":11,"t":"q","f":"What makes a good regression model (Lec 7 list)?","b":"Sparsity; selective sparsity (group sparsity and limited pairwise multicollinearity); appropriate nonlinear transformations; robustness; statistical significance. (Book adds low **global** multicollinearity.)","x":"Each property maps to a type of MIO constraint: cardinality, equality/exclusion logic, one-of-a-group, a penalty, and a $t$-test constraint.","bk":false},{"s":11,"t":"q","f":"Holistic regression preprocessing steps.","b":"Split 50/25/25 train/val/test. Normalize training columns to zero mean and unit $\\ell_2$ norm. Set the robustness parameter $\\Gamma$ and the max pairwise correlation $\\rho$. Build $HC$. The modeler specifies group-sparse sets $GS_m$ and the variables to transform ($T_m$). Compute $k_{\\max}$.","x":"Standardizing columns makes coefficients and correlations comparable, and the train/validation/test split is used to choose $\\Gamma$ and $k$.","bk":false},{"s":11,"t":"q","f":"Write the base holistic regression MIO (before significance).","b":"For $k = 1,\\dots,k_{\\max}$:\n$$\\min_{\\beta,z}\\ \\tfrac12\\|y - X\\beta\\|_2^2 + \\Gamma\\|\\beta\\|_1$$\ns.t. $z_l\\in\\{0,1\\}$; $-Mz_l \\le \\beta_l \\le Mz_l$; $\\sum_l z_l \\le k$ (sparsity); $z_i = z_l\\ \\forall i,l\\in GS_m$ (group sparsity); $z_i + z_j \\le 1\\ \\forall(i,j)\\in HC$ (pairwise collinearity); $\\sum_{i\\in T_m}z_i \\le 1$ (nonlinear transforms).","x":"All structural properties are linear constraints on the binaries $z$, linked to $\\beta$ by big-M, so the model is an MIQO.","bk":false},{"s":11,"t":"q","f":"Which term gives robustness in holistic regression, and why that form?","b":"$\\Gamma\\|\\beta\\|_1$ in the objective (or an elastic net). By Ch. 2, an $\\ell_1$ penalty equals robustness to feature-wise perturbations of $X$.","x":"By the Ch. 2 equivalence, the $\\ell_1$ penalty protects against feature-wise perturbations of $X$.","bk":false},{"s":11,"t":"q","f":"Why is the significance constraint nonconvex, and how is it modeled?","b":"The requirement \"if $z_j = 1$ then $|\\beta_j|/(\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}) \\ge t_\\alpha$\" puts an absolute value on the large side of an inequality (reverse convex). Add binary $b_j$ to pick the sign:\n$\\dfrac{\\beta_j}{\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}} + Mb_j \\ge t_\\alpha z_j$ and $-\\dfrac{\\beta_j}{\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}}} + M(1 - b_j) \\ge t_\\alpha z_j$.\nWith $b_j = 0$ the first forces $\\beta_j$ significantly positive; with $b_j = 1$ the second forces it significantly negative. $z_j = 0$ makes both vacuous.","x":"\"$|\\beta_j| \\ge c$ when selected\" is a reverse-convex condition, so a binary picks which sign must satisfy it, and big-M turns off the other side.","bk":false},{"s":11,"t":"q","f":"What distributional assumption underlies the significance constraint?","b":"$Y = X\\beta + \\epsilon$ with $\\epsilon\\sim N(0,\\sigma^2I)$, so $(\\hat\\beta_j - \\beta_j)/(\\tilde\\sigma\\sqrt{(X^\\top X)^{-1}_{jj}})\\sim t_{n-p}$. (Synthetic results degrade with heavy-tailed $t_5$ errors: 95% accuracy, 35% FPR at $n = 500$.)","x":"The $t$-test is only valid under the Gaussian linear model, which is why heavy-tailed errors raise the false positive rate.","bk":false},{"s":11,"t":"q","f":"Four parameters a modeler sets for holistic regression.","b":"Robustness $\\Gamma$ (default: 10 values tried), sparsity $k$, max pairwise correlation $\\rho$ (default 0.8), significance level $\\alpha$ (e.g. 0.05).","x":"These four knobs control robustness, size, multicollinearity and significance; the defaults make the method usable out of the box.","bk":false},{"s":11,"t":"q","f":"Why is holistic regression better than the manual (sequential) process?","b":"All properties are enforced **simultaneously**, so the MIO doesn't have to favor some properties by applying them in a particular order. It handles datasets with more variables than a person can manage, and it saves substantial modeler time.","x":"Joint optimization avoids order effects and scales to many variables, which is where manual model building breaks down.","bk":false},{"s":11,"t":"q","f":"Croq'Pain example: manual vs. holistic.","b":"Manual: all 14 variables give $R^2 = 0.867$, but only 5 are significant, EMPL and TOTAL have counterintuitive negative coefficients, and P35–TOTAL correlation is 0.96. Dropping insignificant variables one at a time leaves SIZE, P15, INC, NREST, PRICE (train $R^2 = 0.856$, correlations < 0.18). Holistic ($\\rho = 0.8$, 10 $\\Gamma$ values): the same 5 variables in **~1 minute**, four significant at 0.001 and one at 0.01, validation $R^2 = 0.80$.","x":"Here holistic regression matches a careful manual analysis in about a minute, so the benefit is time saved.","bk":false},{"s":11,"t":"q","f":"Ames Housing example: manual vs. holistic.","b":"2,271 observations, 315 variables after dummy expansion. Manual: neighborhood + total sq ft gives $R^2 = 0.8$; a day of work gives a 36-variable model with $R^2 = 0.92$. Holistic ($\\rho = 0.8$, $\\alpha = 0.05$, $k = 20$): 20 variables, all significant, test $R^2 = 0.920$, simpler and just as predictive.","x":"With hundreds of candidate variables, manual search is impractical, and holistic regression finds a simpler model with the same test $R^2$.","bk":false},{"s":11,"t":"q","f":"Holistic regression vs. Lasso on real and synthetic data.","b":"Similar out-of-sample $R^2$, but holistic selects fewer variables with much lower max pairwise correlation and condition number. Synthetic sparsity: Lasso finds the 10 true variables but adds ~24 noise variables ($n > p$) or ~45 ($n < p$); holistic adds 0–2. Exception: Pyrimidines, where holistic loses $R^2$ (0.175 vs. 0.367); that is the price of insisting on interpretability with few observations per variable.","x":"Comparable prediction with fewer, less correlated variables shows the gain is interpretability, not accuracy.","bk":false},{"s":11,"t":"q","f":"Nonlinear transformations example (Concrete strength).","b":"Original 8 variables: holistic and Lasso both use all of them, test $R^2 = 0.609$. Adding $x^2$, $\\sqrt x$, $\\log x$ (at most one per variable, 32 candidates): holistic picks 6 (slag, water, log fly ash, log superplasticizer, log age, $\\sqrt{\\text{cement}}$), all significant at 0.001, test $R^2 = 0.823$. Lasso picks 12 with $R^2 = 0.834$. Holistic took the same ~1 min for 8 or 32 variables.","x":"Offering transformations as candidates lets the MIO choose the right scale per variable, giving a big $R^2$ gain with a small model.","bk":false},{"s":11,"t":"q","f":"Group sparsity example (Energy Efficiency).","b":"768 buildings; 6 continuous + 2 categorical variables expanded to 14. Holistic: wall area, overall height, glazing area for both heating ($R^2 = 0.88$) and cooling ($R^2 = 0.85$); no categoricals. Group Lasso: 13 of 14 variables (all but surface area), $R^2 = 0.91$ / $0.86$.","x":"Group constraints keep categorical variables whole; here the MIO chose to drop them entirely and keep three continuous variables.","bk":false},{"s":11,"t":"q","f":"Synthetic significance results: what affects accuracy and false positives?","b":"At $\\alpha = 0.05$, accuracy is ~100% throughout. FPR falls as $n$ grows (7.4% at $n = 100$ to 0% at $n \\ge 500$ with $N(0, 0.1)$ noise), rises with noise ($N(0,1)$ at $n = 500$: 26%), and is worst with heavy tails ($t_5$: 35% at $n = 500$, 21% at $n = 1000$). Times go from under 1 s to ~40 s.","x":"Significance constraints behave as expected: more data reduces false positives, and violating the Gaussian assumption increases them.","bk":false},{"s":11,"t":"q","f":"Why isn't the pairwise correlation constraint enough to rule out multicollinearity?","b":"Multicollinearity can involve three or more variables (e.g. $x_1 + x_2 \\approx x_3$) without any pair being highly correlated. You need to detect near-linear dependencies globally: $\\det(X^\\top X) \\approx 0$, i.e. small eigenvalues.","x":"A three-way dependency like $x_1 + x_2 \\approx x_3$ can exist with modest pairwise correlations, so a pairwise screen misses it.","bk":true},{"s":11,"t":"q","f":"Link between multicollinear relationships and eigenvalues (Thm 5.1).","b":"Let $V$ = eigenvectors of $X^\\top X$ with eigenvalues below $\\varepsilon$. If $\\|\\sum_ja_jX_j\\| \\le \\varepsilon$ ($\\|a\\| = 1$), then $a$ is within $O(\\sqrt\\varepsilon)$ of $\\mathrm{Span}(V)$; conversely, vectors near $\\mathrm{Span}(V)$ are $O(\\sqrt\\varepsilon)$-multicollinear. Small eigenvalues pinpoint the dependencies.","x":"A near-zero linear combination of columns is a near-null direction of $X^\\top X$, so small eigenvalues and their eigenvectors locate the dependencies.","bk":true},{"s":11,"t":"q","f":"How does Algorithm 5.1 turn global multicollinearity into constraints?","b":"Find a **minimum-support** vector $a\\in\\mathrm{Span}(V)$ by MIO ($\\min\\sum_jz_j$ s.t. $a = \\sum_i\\lambda_iv_i$, $\\sum_i|\\lambda_i| \\ge \\delta$, $|a_j| \\le Mz_j$), then forbid selecting its whole support: $\\sum_{i\\in\\mathrm{Supp}(a)}z_i \\le |\\mathrm{Supp}(a)| - 1$. Add that cut to the search MIO and repeat until it is infeasible (all independent relationships found). Minimum support gives the most stringent constraints, and different bases of $\\mathrm{Span}(V)$ give non-equivalent constraints.","x":"Minimum-support vectors in the small-eigenvalue span identify the tightest dependencies, and the constraint forbids selecting all variables in one.","bk":true},{"s":11,"t":"q","f":"Combined synthetic example in Lec 7: setup and result.","b":"$n = 100$, $p = 500$ plus $\\sqrt x$ of each (so $p = 1000$), $\\rho = 0.8$. Truth: 7 original + 3 transformed variables with $\\beta = 1$. $X$ is perturbed by $\\Delta X\\sim U(0,f)$. The modeler knows one true index and two 4-variable groups (one all-nonzero, one all-zero). Holistic picks ~10 variables with the right true positives, max correlation ~0.4–0.55, condition number ~4–7. Lasso picks ~40–70 variables with correlation ~0.8 and condition numbers in the hundreds to thousands, at similar or worse $R^2$.","x":"The combined example puts all properties together; holistic regression keeps the model small and well-conditioned while Lasso includes many variables.","bk":false},{"s":11,"t":"q","f":"Holistic regression conclusions.","b":"MIO imposes all statistical properties simultaneously and systematically. It is generally applicable, saves substantial modeler time, and is scalable, fast, and reliable (minutes for typical datasets).","x":"The method works at practical scale and saves modeler time, which is its main pitch.","bk":false},{"s":11,"t":"q","f":"Extensions of holistic regression noted in the book.","b":"Bertsimas & King introduced it; Bertsimas & Li added significance and global multicollinearity; Bertsimas & King extended it to logistic regression.","x":"The framework has been extended beyond linear regression, e.g. to logistic regression.","bk":true},{"s":12,"t":"q","f":"Recurring move #1: how does robustness turn into regularization?","b":"Inner max over a norm-ball uncertainty set → a dual-norm (or induced-norm) computation → a penalty on $\\beta$. Regression: $+\\rho\\|\\beta\\|_{q^*}$ (Frobenius) or $+\\rho\\|\\beta\\|_r$ (induced). Logistic: margin shrinks by $\\rho\\|\\beta\\|_{q^*}$ inside the loss.","x":"This is the single most reused idea in Lec 2 and Lec 6: compute the adversary's best response in closed form via a dual norm, and it shows up as a penalty.","bk":false},{"s":12,"t":"q","f":"Recurring move #2: how do you collapse an inner max/min over a *binary* set?","b":"If the inner objective is linear in the binaries and the polytope's vertices are integral (e.g. $\\{\\sum z_i = k, 0\\le z\\le1\\}$, or a TU matrix), relax to the convex hull and take the **LP dual**. The min–max becomes a single min (stable regression, label-robust LR, the SLO step of median regression).","x":"\"Relax, then dualize\" works whenever the inner problem is linear over an integral polytope. Recognizing that structure is the key exam skill.","bk":false},{"s":12,"t":"q","f":"Recurring move #3: cutting planes / delayed constraint generation. Where does it appear?","b":"Robust regression (add worst-case $\\Delta$), sparse regression (outer approximation cuts on $c(s)$), sparse classification (OA with dual-evaluated $c(s)$), convex regression (add violated pairwise constraints), holistic multicollinearity (add support cuts). Each time: solve a small problem, call a separation oracle, add the violated constraint or cut, repeat.","x":"Every large-scale method in the course avoids writing all constraints or cuts up front. A separation oracle plus re-solving is the common engine.","bk":false},{"s":12,"t":"q","f":"Recurring move #4: the heuristic + MIO playbook.","b":"Fast first-order / nonlinear heuristics give high-quality upper bounds (warm starts). The MIO then certifies optimality by closing the lower bound. Used for sparse regression (hard thresholding), median regression (SLO + subgradient), and sparse classification (Lasso warm start).","x":"Heuristics are good at finding solutions; MIO is good at proving them. Combining them is how the course solves NP-hard problems at scale.","bk":false},{"s":12,"t":"q","f":"Recurring move #5: modeling discrete logic with binaries.","b":"Big-M ($|\\beta_j| \\le Mz_j$), cardinality ($\\sum z \\le k$), logical implications ($z_i + z_j \\le 1$, $z_i = z_j$), sign selection for reverse-convex constraints ($b_j$ in significance, splitting $|x|$ for $\\|x\\|_1 \\ge c$), and quantile selection ($z_i$ in LQAD). Keep $M$ as tight as possible.","x":"Most modeling questions reduce to a handful of binary patterns. Knowing them lets you write any of the course's MIOs from scratch.","bk":false},{"s":12,"t":"q","f":"Primal vs. dual approaches to discrete ML problems: tradeoff.","b":"**Primal** (big-M MIO on $\\beta$): direct, flexible, easy to add constraints (holistic regression), scales to $n,p$ in the 1,000s. **Dual / binary convex** (eliminate $\\beta$, optimize over supports $s$ with OA): much more scalable ($n,p$ in the 100,000s) but needs structure (closed form or cheap dual evaluation of $c(s)$).","x":"Primal formulations are flexible; dual formulations are fast. Holistic regression uses the primal because it needs many side constraints.","bk":false},{"s":12,"t":"q","f":"Subset selection over features vs. samples across Lec 3–5.","b":"Features: best subset (Lec 3), sparse convex regression, sparse classification. Samples: hardest $k$ (stable regression, a max, handled by duality) and best $q$ (LQAD, a min, handled by MIO). A \"sum of $k$ largest\" is easy (convex, LP dual); \"$k$-th smallest\" or \"sum of $k$ smallest\" is nonconvex in $\\beta$.","x":"Whether the selection is a max or a min over samples decides the method: a max dualizes into an LP, while a min (e.g. the $q$-th smallest) is nonconvex and needs MIO.","bk":false},{"s":12,"t":"q","f":"Why does the course keep comparing against Lasso?","b":"Lasso is the canonical heuristic proxy for sparsity. The course's message: Lasso works because it is **robust** (Ch. 2), but as a selector it includes many false features. Exact MIO/CIO methods match or beat its prediction with sparser, more interpretable, more correct supports at comparable or better speed.","x":"Lasso is the default heuristic, so it is the natural benchmark. The course's critique is specific: good prediction (robustness), poor selection (false positives).","bk":false},{"s":12,"t":"q","f":"Interpretability threads so far.","b":"Sparsity (Lec 3, 6), stable regression's consistent supports and the interpretable hardest subset (Lec 4), holistic regression's significance and low multicollinearity (Lec 7). Later: optimal trees (Lec 9), prescriptive trees (Lec 11), interpretable clustering, matrix completion, optimization.","x":"Interpretability is a design goal throughout the course, achieved by sparsity, stability, significance and trees.","bk":false},{"s":13,"t":"q","f":"HW1 Q1(a): $\\max x + 2y$ s.t. $x \\le y$, $-x + y \\le -1$, $x,y\\ge0$. Is the dual unbounded?","b":"**False.** The primal is infeasible: $x \\le y$ and $y \\le x - 1$ give $x \\le x - 1$. The dual ($\\min -p_2$ s.t. $p_1 - p_2 \\ge 1$, $-p_1 + p_2 \\ge 2$, $p\\ge0$) is infeasible too, since adding the two constraints gives $0 \\ge 3$. Both infeasible is possible; an infeasible primal does not force an unbounded dual.","x":"An infeasible primal does not force an unbounded dual; both can be infeasible, as here. Checking the dual directly settles it.","bk":false},{"s":13,"t":"q","f":"HW1 Q1(b): Elastic net $\\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_1 + \\mu\\|\\beta\\|_2$ protects against global perturbations bounded by $\\lambda$ and feature-wise perturbations bounded by $\\mu$?","b":"**False: the roles are swapped.** $\\lambda\\|\\beta\\|_1$ comes from feature-wise ($\\mathcal U_{(1,2)}$) perturbations, and $\\mu\\|\\beta\\|_2$ from global ($F_2$ / Frobenius) perturbations.","x":"Matching each penalty to its uncertainty set is the core skill from Lec 2; the statement simply swapped them.","bk":false},{"s":13,"t":"q","f":"HW1 Q1(c): $\\min\\|x - y\\|_1$ s.t. $\\|x\\|_1 + \\|y\\|_1 \\ge 2$, $\\|y\\|_0 \\le 5$, $\\|x\\|_\\infty, \\|y\\|_\\infty \\le M$. Can it be a mixed-integer *linear* problem?","b":"**True.** Objective: $t_i \\ge \\pm(x_i - y_i)$. The reverse-convex $\\|x\\|_1 + \\|y\\|_1 \\ge 2$: split $x_i = x_i^+ - x_i^-$ with a binary sign selector ($x_i^+ \\le Mb_i$, $x_i^- \\le M(1 - b_i)$) so $|x_i| = x_i^+ + x_i^-$ exactly (same for $y$). Then $\\|y\\|_0 \\le 5$: $|y_i| \\le Mz_i$, $\\sum z_i \\le 5$. The bounds $M$ make every big-M valid. All linear plus binaries.","x":"Reverse-convex constraints like $\\|x\\|_1 \\ge 2$ are not convex, but bounded variables plus binary sign selection make them exactly representable with linear constraints.","bk":false},{"s":13,"t":"q","f":"HW1 Q2 Part B: formulate $\\min_\\beta\\max_{\\Delta\\in\\mathcal A,\\Delta'\\in\\mathcal B}\\|y - (X + \\Delta + \\Delta')\\beta\\|_\\infty$ s.t. $\\|\\beta\\|_0 \\le k$ as an MIO.","b":"Robust counterpart: $\\|y - X\\beta\\|_\\infty + \\lambda\\|\\beta\\|_1 + \\rho\\|\\beta\\|_\\infty$. MILP:\n$\\min\\ u + \\lambda\\sum_jt_j + \\rho w$ s.t. $-u \\le y_i - x_i^\\top\\beta \\le u\\ \\forall i$ ($u$ = max residual); $-t_j \\le \\beta_j \\le t_j$ ($t_j = |\\beta_j|$); $-w \\le \\beta_j \\le w$ ($w = \\|\\beta\\|_\\infty$); $-M_js_j \\le \\beta_j \\le M_js_j$, $\\sum_js_j \\le k$, $s_j\\in\\{0,1\\}$ (sparsity).","x":"Each auxiliary variable has a clear job: $u$ is the worst residual, $t_j$ the absolute coefficients, $w$ the largest coefficient, and $s_j$ the selected support.","bk":false},{"s":13,"t":"q","f":"Linearizing a sum of absolute values vs. a max of absolute values: how many auxiliary variables?","b":"$\\sum_j|\\beta_j|$: one auxiliary **per element** ($t_j \\ge \\pm\\beta_j$). $\\max_j|\\beta_j|$ or $\\max_i|r_i|$: **one scalar** for the whole vector ($w \\ge \\pm\\beta_j\\ \\forall j$). Mixing these up is the fastest way to a wrong MIO.","x":"A sum needs one variable per term because each term must be tracked; a max needs only one, since a single number bounds all terms.","bk":false},{"s":13,"t":"q","f":"HW1 Q3(a) results (sublets, $n = 30$, $p = 7$, $\\lambda = 0.25$, $\\rho = 0.5$, $k = 3$, $M = 10^3$).","b":"Objective 404.51, $u = 196.83$. Selected: sqft ($\\beta = 137.25$), beds (188.61), laundry (127.65).","x":"These are your notebook results; use them to sanity-check intuition about how the two penalties interact.","bk":false},{"s":13,"t":"q","f":"HW1 Q3(b): A-only vs. B-only vs. both ($k = 3$).","b":"A only ($\\lambda = 0.25$, $\\rho = 0$): sqft 120.43, beds 215.20, laundry 122.15. B only ($\\lambda = 0$, $\\rho = 1$): sqft 137.25, beds 145.81, laundry 145.81 (tie at $w$). Both: sqft 137.25, beds 188.61, laundry 127.65. Fingerprints: the B-only tie at the ceiling, and sqft rising once the $\\ell_1$ price is removed.","x":"The B-only tie at 145.81 is the visible signature of the $\\ell_\\infty$ penalty pricing only the maximum.","bk":false},{"s":13,"t":"q","f":"Why is $w$ (or $\\sum t_j$) meaningless in the output when its penalty weight is 0?","b":"With $\\rho = 0$, $w$ is unpriced, so the solver can leave it anywhere above $\\max_j|\\beta_j|$ (it reported 216.0). The same goes for $\\sum_jt_j$ when $\\lambda = 0$. Only priced auxiliaries are pinned to their intended values at the optimum.","x":"An unpriced auxiliary variable can take any value consistent with its constraints, so reading it as a meaningful quantity is a mistake.","bk":false},{"s":13,"t":"q","f":"HW1 Q3(c): sparse ($k = 3$) vs. dense ($k = 7$) rule — the general tradeoff.","b":"The dense model's feasible set contains the sparse one, so its optimal **objective** can only be lower or equal. ($u$ itself usually drops too, but that isn't guaranteed, because the penalties trade off against $u$.) The sparse rule gives up some worst-case fit in exchange for a rule a student can read and apply with three features. Check your notebook's $k = 7$ numbers.","x":"A larger feasible set can only improve the objective; whether the worst residual specifically improves depends on how the penalties shift.","bk":false},{"s":13,"t":"q","f":"Ratio form vs. normalized form of an induced norm: what's the trap?","b":"In $\\max_{x\\ne0}\\|\\Delta x\\|_\\infty/\\|x\\|_\\infty$ the denominator disappears by **cancellation** (scale invariance). Only after restricting to $\\|x\\|_\\infty \\le 1$ (or $=1$) can you say \"because $\\|x\\|_\\infty \\le 1$\". Don't mix the two routes mid-proof.","x":"The ratio form is scale invariant; only after normalizing can you use the bound on $\\|x\\|_\\infty$. Mixing the two steps makes the argument circular.","bk":false},{"s":13,"t":"q","f":"JuMP: ranged constraints and broadcasting.","b":"Ranged constraints need **constant** bounds, so split $-v \\le \\beta_j \\le v$ into two constraints when $v$ is a variable. Use either an index prefix `@constraint(m, [j in 1:p], ...)` or broadcasting `.<=` — never both.","x":"JuMP's ranged syntax `a <= expr <= b` needs constants on both ends; with a variable bound, write two separate constraints.","bk":false},{"s":13,"t":"q","f":"JuMP: extracting values.","b":"`value.(β)` (broadcast) for arrays; `value(u)` for scalars; `objective_value(model)`; check `termination_status(model) == MOI.OPTIMAL`.","x":"`value` works on scalars; broadcasting with `value.` applies it elementwise to arrays of variables.","bk":false},{"s":13,"t":"q","f":"JuMP: declaring binaries and the cardinality constraint.","b":"`@variable(model, s[1:p], Bin)`; `@constraint(model, sum(s) <= k)`; big-M as `@constraint(model, β .<= M .* s)` and `@constraint(model, -M .* s .<= β)`.","x":"`Bin` declares binaries, and broadcasting builds all big-M constraints in one line.","bk":false},{"s":13,"t":"q","f":"How is the sparse regression cutting-plane loop implemented in the Rec 2 notebook?","b":"As a JuMP **lazy constraint callback**: whenever Gurobi finds an integer-feasible $s$, the callback evaluates $c(s)$ and $\\nabla c(s)$ and adds the cut $\\eta \\ge c(s) + \\nabla c(s)^\\top(s' - s)$ inside a single branch-and-bound tree.","x":"The callback runs inside the solver: each new integer solution triggers a cut, so the branch-and-bound tree is built only once.","bk":false},{"s":14,"t":"term","f":"CART","b":"Classification and Regression Trees (Breiman et al. 1984): recursively partition the feature space with axis-parallel splits $x_j<b$ chosen greedily top-down; each leaf predicts the majority class (classification) or the mean (regression).","x":"CART is a greedy one-step heuristic for $\\min$ error $+\\ \\alpha\\cdot$complexity; Lec 9 and the OCT lectures attack exactly this weakness.","bk":false},{"s":14,"t":"term","f":"`minbucket` ($N_{\\min}$)","b":"Minimum number of training points in each leaf. Smaller ⇒ more splits; too small overfits, too large gives a model that is too simple (Lec 8 slide 11).","x":"`minbucket` is CART's version of OCT's $N_{\\min}$: a floor on leaf size that caps how finely the tree can carve up the data.","bk":false},{"s":14,"t":"term","f":"Complexity parameter $\\alpha$ (R's `cp`)","b":"Price per split in error $+\\ \\alpha\\cdot$(number of splits): a split survives pruning only if it removes more than $\\alpha$ errors. Smaller `cp` ⇒ bigger tree (Lec 8 slide 33).","x":"$\\alpha$ is a price per split, the same knob OCT puts in its objective as $\\alpha\\sum_t d_t$. A split must buy more than $\\alpha$ in error reduction to be worth keeping.","bk":false},{"s":14,"t":"term","f":"Misclassification impurity","b":"$I(t)=1-\\max_k p_k$, with $p_k$ the fraction of node $t$ in class $k$.","x":"Misclassification is the quantity you actually care about, but as a growth criterion it is flat whenever the majority class does not change.","bk":false},{"s":14,"t":"term","f":"Gini impurity","b":"$I(t)=\\sum_k p_k(1-p_k)=1-\\sum_k p_k^2$. Zero when the node is pure.","x":"Gini is strictly concave in the class proportions, so any split that makes a child purer earns positive gain even if no error is removed.","bk":false},{"s":14,"t":"term","f":"Entropy impurity","b":"$I(t)=-\\sum_k p_k\\log p_k$ (natural log on the Rec 5 slide).","x":"Entropy behaves like Gini (strictly concave, zero at purity); Rec 5 uses the natural log, giving 0.60 for a 2/7 vs 5/7 node.","bk":false},{"s":14,"t":"term","f":"Impurity gain of a split","b":"$\\text{gain}=n_tI(t)-n_LI(L)-n_RI(R)$. CART tries every feature and threshold and takes the split with the largest gain.","x":"Impurities are weighted by node size, so the gain compares total impurity before and after the split rather than averages.","bk":false},{"s":14,"t":"term","f":"Regression-tree impurity","b":"Within-node squared error $\\sum_{i\\in t}(y_i-\\bar y_t)^2$; each leaf predicts its mean, so the fitted function is a step function of $x$ (Rec 5 slide 42).","x":"Squared error is the regression analogue of impurity; the leaf mean minimizes it, which is why each leaf predicts its mean.","bk":false},{"s":14,"t":"term","f":"Pruning (cost-complexity)","b":"Bottom-up: collapse any subtree whose splits remove fewer than $\\alpha$ errors per split. $\\alpha$ is tuned on validation data.","x":"Pruning is a patch for greedy growth: grow deep so strong splits behind weak ones appear, then cut back with the true objective error $+\\ \\alpha\\cdot$splits.","bk":false},{"s":14,"t":"term","f":"Bagging (bootstrap aggregating)","b":"Train each tree on $n$ rows drawn with replacement from the training set (e.g. 1 2 3 4 5 → 2 3 1 2 5), then combine by vote or average.","x":"Each bootstrap sample is a slightly different dataset, so trees built on them disagree; averaging the disagreement reduces variance.","bk":false},{"s":14,"t":"term","f":"Random forest","b":"Ensemble of many CART trees, each grown on a bootstrap sample and allowed to split only on a random subset of features (Book: typically $\\sqrt p$ per split); predict by majority vote / average.","x":"Two sources of randomness (rows and features) decorrelate the trees, which is what makes averaging effective. The cost is the single interpretable tree.","bk":false},{"s":14,"t":"term","f":"`nodesize` and `ntree` (randomForest in R)","b":"Minimum observations per leaf, and number of trees. `ntree` shouldn't be too small because bootstrap samples miss observations; more trees take longer.","x":"These are the RF analogues of `minbucket` and number of trees; too few trees leaves some rows almost never used.","bk":false},{"s":14,"t":"term","f":"Gradient-boosted trees","b":"Trees built in sequence: each new small tree $h$ fits the residuals $y-f(x)$ of the current ensemble and is added at learning rate $\\eta$: $f(x)\\leftarrow f(x)+\\eta h(x)$.","x":"Boosting reduces bias by correcting the ensemble's current mistakes step by step; a small $\\eta$ makes each correction cautious.","bk":false},{"s":14,"t":"term","f":"Boosting for classification","b":"$f$ is the log-odds; each new tree fits $y-\\hat p(x)$, the 0/1 label minus the predicted probability (Rec 5 slide 13).","x":"In classification the residual lives on the probability scale ($y-\\hat p$) while the ensemble adds up log-odds, the same link as logistic regression.","bk":false},{"s":14,"t":"term","f":"$k$-fold cross-validation","b":"Split the training set into $k$ folds; for each candidate parameter value train on $k-1$ folds and score the held-out fold; repeat over all folds; pick the value with the best average; refit on all training data.","x":"CV reuses the training data for model selection, so the test set stays untouched until the single final evaluation.","bk":false},{"s":14,"t":"q","f":"Why did Martin et al. predict Supreme Court votes with CART instead of logistic regression?","b":"Logistic regression coefficients show importance and direction of effects but give no simple explanation of how a decision is made. A tree is a few yes/no questions anyone can follow, needs no linearity assumption, and captures interactions (Lec 8 slides 5, 8).","x":"The case is chosen to sell interpretability: a judge or lawyer can read the tree and see why it predicts reverse or affirm.","bk":false},{"s":14,"t":"q","f":"SCOTUS case: data, target and features (Lec 8).","b":"Cases 1994–2001, when the same nine justices served (longest stable court in 180+ years). Target: did Justice Stevens vote to reverse (1) or affirm (0) the lower court. Features: circuit of origin, issue area, petitioner and respondent type, ideological direction of the lower-court decision, whether the petitioner argued a law was unconstitutional.","x":"A stable court (same nine justices for 8 terms) means past votes are informative about future ones; the features are coarse case attributes, not legal detail.","bk":false},{"s":14,"t":"q","f":"Describe Martin's two-stage CART model and its test.","b":"Trained on 628 cases (1994–2001), predicted the 68 cases of October 2002 before the term. Stage 1: one tree for \"unanimous liberal\", one for \"unanimous conservative\". If they conflict or both say no, stage 2: one tree per justice, majority vote. Compared against 83 legal experts (71 academics, 12 attorneys).","x":"The two-stage design first catches the easy unanimous cases with two trees, then falls back on nine per-justice trees and a majority vote.","bk":false},{"s":14,"t":"q","f":"SCOTUS results: model vs experts.","b":"Case outcomes: model **75%**, experts **59%**. Individual justices: model 67%, experts 68%. A tree on very high-level case features beat experts who could use far more detailed information.","x":"The headline is case outcomes (75% vs 59%); on individual justices the model only ties the experts, so its edge comes from aggregation.","bk":false},{"s":14,"t":"q","f":"Justice Souter's tree splits first on what, and why is that notable?","b":"On Justice Ginsburg's **predicted** decision (then on whether the lower court decision was liberal). Per-justice trees can use other justices' predictions as features.","x":"Using one justice's predicted vote as a feature captures voting blocs, an interaction a single linear model would not express easily.","bk":false},{"s":14,"t":"q","f":"Why is choosing `minbucket` by the best test-set accuracy wrong?","b":"It uses the test set for model selection, so the reported test accuracy is optimistically biased. Select on a validation set or by $k$-fold cross-validation, then evaluate once on the test set.","x":"Any choice made by looking at test accuracy turns the test set into a validation set, and the reported number is then optimistic.","bk":false},{"s":14,"t":"q","f":"A leaf holds 10 affirm and 2 reverse cases. Leaf probability of affirm and the prediction at threshold 0.5?","b":"$10/12=0.833$ (Lec 8 slide 13 misprints 0.867). Predict affirm; threshold 0.5 means the majority class.","x":"$10/12=0.833$; the slide's 0.867 is an arithmetic slip. A threshold of 0.5 on the leaf frequency is the same as the majority vote.","bk":false},{"s":14,"t":"q","f":"Node with 2 blue, 5 red points: misclassification, Gini and entropy impurity?","b":"$p=(2/7,5/7)$. Misclassification $2/7\\approx0.29$; Gini $1-(4+25)/49\\approx0.41$; entropy $\\approx0.60$ (natural log). (Rec 5 slide 5.)","x":"For a two-class node misclassification < Gini < entropy (nats) is typical; all three are 0 only when the node is pure.","bk":false},{"s":14,"t":"q","f":"Why can growth by misclassification gain stall, while Gini or entropy keeps going?","b":"Misclassification gain = errors removed, which is 0 whenever both children keep the parent's majority class, even if one child became much purer. Gini/entropy are strictly concave in the class proportions, so any purer child gives positive gain; later splits turn that purity into fewer errors.","x":"This is why CART grows with Gini or entropy and not with the error itself: the impurity rewards progress the error cannot yet see.","bk":false},{"s":14,"t":"q","f":"Rec 5 ten points: what tree does greedy CART build at depth 2, and what does it miss?","b":"Root $x_1<0.25$ (2 errors, the pure corner of blues), then $x_2<0.65$ on the right child: 1 error (point 7). It misses the XOR tree (root $x_2<0.5$, then $x_1<0.5$ on both sides) with 0 errors, because $x_2<0.5$ alone has 5 errors. Three different depth-2 trees reach 0 errors; none uses greedy's root.","x":"The ten-point example is the course's running counterexample: greedy finds 1 error, optimization finds 0 at the same depth.","bk":false},{"s":14,"t":"q","f":"Rec 5 greedy tree: for which $\\alpha$ is each pruned subtree optimal?","b":"Full tree: $1+2\\alpha$, best for $\\alpha<1$. Root split only: $2+\\alpha$, best for $1<\\alpha<3$. Single leaf: $5$, best for $\\alpha>3$. ($x_2<0.65$ removes 1 error, $x_1<0.25$ removes 3.)","x":"Each subtree's cost is a line in $\\alpha$; the optimal subtree switches where the lines cross ($\\alpha=1$ and $\\alpha=3$).","bk":false},{"s":14,"t":"q","f":"Random forests vs boosted trees: how are trees built and combined?","b":"RF: deep trees in **parallel**, each on a bootstrap sample with random feature subsets; vote/average. Variance reduction through decorrelated trees.\nBoosting: small trees in **sequence**, each fit to the current residuals and added with learning rate $\\eta$. Both are accurate and uninterpretable.","x":"RF averages many low-bias, high-variance trees; boosting adds many high-bias small trees that each fix what is left. Neither is a single readable tree.","bk":false},{"s":14,"t":"q","f":"Probability that a given row is absent from one bootstrap sample of size $n$? (derived)","b":"$(1-1/n)^n\\to e^{-1}\\approx0.368$. Each tree misses about a third of the rows, one reason `ntree` must not be too small.","x":"$1-e^{-1}\\approx63.2\\%$ of distinct rows appear in each bootstrap sample, so about a third are out-of-bag for any given tree.","bk":false},{"s":14,"t":"q","f":"State the accuracy–interpretability tradeoff of tree methods.","b":"CART is interpretable (\"on interpretability, trees rate an A+\", Breiman) but not state-of-the-art accurate. RF and boosting are state-of-the-art accurate but are black-box averages of many trees (\"forests are A+ predictors… on interpretability, they rate an F\"). Optimal Trees aim to remove the tradeoff.","x":"The tradeoff is the motivation for Optimal Trees: get ensemble-level accuracy from one tree.","bk":true},{"s":14,"t":"q","f":"Gini gain and misclassification gain of the Rec 5 root split $x_1<0.25$?","b":"Root $10\\times0.5=5$; left 3B pure: 0; right 2B/5R: $7\\times0.408=2.857$. Gini gain $\\approx2.14$; misclassification gain $5-0-2=3$.","x":"The two criteria agree here but differ in scale: Gini gain is fractional impurity mass, misclassification gain is a count of errors removed.","bk":false},{"s":14,"t":"q","f":"Justice O'Connor's tree (Lec 8 slide 18): root question and its first answer?","b":"Root: \"Is the lower court decision liberal?\" Yes ⇒ **reverse**. No ⇒ further questions on circuit of origin (2nd, 3rd, DC, Federal ⇒ affirm), whether the respondent is the US, and the primary issue area.","x":"The ideological direction of the lower court is the single most useful feature: a conservative-leaning justice tends to reverse liberal decisions.","bk":false},{"s":14,"t":"q","f":"Node with 4 points of class A and 2 of class B: misclassification, Gini and entropy impurity? (derived)","b":"$p=(2/3,1/3)$. Misclassification $1/3\\approx0.333$; Gini $2\\cdot\\frac23\\cdot\\frac13=4/9\\approx0.444$; entropy $-(\\frac23\\ln\\frac23+\\frac13\\ln\\frac13)\\approx0.637$.","x":"For two classes Gini is $2p(1-p)$, a quick check. The ordering misclassification < Gini < entropy (nats) holds again.","bk":false},{"s":14,"t":"q","f":"When does CART stop growing a branch (Rec 5 slide 6)?","b":"At a pure node, at the maximum depth $D$, or when a child would get fewer than $N_{\\min}$ points (`minbucket`). Then pruning works back up by error $+\\ \\alpha\\cdot$splits.","x":"The stopping rules are deliberately loose so the tree grows deep; $\\alpha$ does the real complexity control during pruning.","bk":false},{"s":14,"t":"q","f":"Why trees at all? Two properties Rec 5 slide 4 highlights.","b":"**Interpretable**: a prediction is a few yes/no questions anyone can follow. **Nonlinear**: thresholds and interactions (\"old and high blood pressure\") with no hand-built features.","x":"A linear model needs an explicit interaction term to express \"age ≥ 60 and BP ≥ 140\"; a depth-2 tree gets it for free.","bk":false},{"s":14,"t":"q","f":"How does the Book describe boosting and random forests beyond the slides?","b":"Boosting: each tree's weight is chosen to minimize the ensemble's training error, so it iteratively focuses on points with the largest current error; XGBoost is the optimized implementation. RF: trivially parallel, runtime comparable to CART.","x":"Both ensembles are accurate and practical to train, which is why the Book frames the open problem as interpretability, not accuracy.","bk":true},{"s":15,"t":"term","f":"Optimal tree problem (Book (8.1))","b":"$\\min_T\\ R(T)+\\alpha\\lvert T\\rvert$ s.t. $N(\\ell)\\ge N_{\\min}$ for every leaf $\\ell$; $R(T)$ = training misclassification, $\\lvert T\\rvert$ = number of branch nodes. The problem CART approximates with growing and pruning.","x":"This is the problem both CART and OCT target; CART approximates it by growing and pruning, OCT solves it directly.","bk":false},{"s":15,"t":"term","f":"Strong split hidden behind a weak split","b":"A split that only pays off after a first split that by itself does not reduce error. With a complexity penalty, greedy never takes the first split, so never reaches the second.","x":"With a complexity penalty, the first split must pay for itself alone, so splits whose value comes only from what follows are never taken.","bk":false},{"s":15,"t":"term","f":"Split selection bias (CART)","b":"All else equal, CART is more likely to split on a feature with more candidate thresholds (100 distinct values vs 10). OCT is much less susceptible; XGBoost/SHAP assign importance to many irrelevant features (Lec 9 slide 50).","x":"More candidate thresholds give more chances to fit noise, so CART's greedy search favors high-cardinality features; this distorts feature importance.","bk":false},{"s":15,"t":"term","f":"Oblique (hyperplane) decision tree","b":"Tree whose splits are $a^Tx<b$ on a linear combination of features. Greedy construction faces exponentially many candidate hyperplanes (Book: $2^p\\binom{n}{p}$).","x":"Oblique splits can replace a staircase of axis-parallel splits with one cut, but greedy enumeration over hyperplanes explodes combinatorially.","bk":false},{"s":15,"t":"q","f":"Three complications of CART's one-step growing procedure (Lec 9 slide 12).","b":"1. Splits are only locally optimal; the overall tree can be far from optimal.\n2. Requires a two-stage grow-then-prune process.\n3. Requires an impurity measure instead of the misclassification error you care about.","x":"All three trace back to choosing one split at a time; solving the whole tree at once removes them together.","bk":false},{"s":15,"t":"q","f":"Quadrant (AND) data, Lec 9 slide 8: objective 0.25 with no split, $0.25+\\alpha$ with one, $0+2\\alpha$ with two. What does greedy return, and when is the 2-split tree optimal?","b":"Greedy adds a split only if it lowers the objective; the first split leaves error at 0.25 and adds $\\alpha$, so for any $\\alpha>0$ it stops at the empty tree. The 2-split tree is optimal when $2\\alpha<0.25$, i.e. $\\alpha<0.125$ (derived). The strong second split is hidden behind the weak first one.","x":"The first split leaves the error unchanged, so greedy sees only its cost $\\alpha$ and stops. The payoff appears only after the second split.","bk":false},{"s":15,"t":"q","f":"Why does CART use an impurity measure to grow rather than misclassification (Breiman 1984)?","b":"\"The [misclassification] criterion does not seem to appropriately reward splits that are more desirable in the context of the continued growth of the tree… largely caused by the fact that our tree growing structure is based on a one-step optimization procedure.\" The impurity is a patch for greediness, so the grown tree doesn't directly optimize error.","x":"Breiman admits the impurity criterion is a workaround for the one-step procedure, not an objective worth optimizing in itself.","bk":false},{"s":15,"t":"q","f":"Why did Breiman not pursue globally optimal trees?","b":"\"At this stage of computer technology, an overall optimal tree growing procedure does not appear feasible for any reasonably sized data set.\" A practical limitation of 1984, not a claim that greedy is better (Lec 9 slide 13).","x":"The objection was computational (1984 hardware and solvers), so it weakens as MIO gets faster.","bk":false},{"s":15,"t":"q","f":"MIO speedup figures quoted in Lec 9 (slide 14).","b":"CPLEX 1.2 → 11 (1991–2007): 29,000×; Gurobi 1.0 → 7.5: 73×; software total 2,117,000×; hardware $10^{6.2}=1{,}560{,}000$×; total **3.3 trillion**×. (Lec 1 uses updated figures: 37.6 trillion.)","x":"Lec 9 uses the older 3.3 trillion figure; Lec 1 updates it to 37.6 trillion. Either way the point is that the 1984 constraint no longer binds.","bk":false},{"s":15,"t":"q","f":"What does CART pruning search over, compared with OCT?","b":"Pruning only considers subtrees of the single greedy tree. OCT searches all trees of depth $\\le D$ with $\\ge N_{\\min}$ points per leaf, for the same objective error $+\\ \\alpha\\cdot$complexity (Rec 5 slide 15).","x":"Pruning can only remove splits that greedy chose, so a tree with a different root, like the XOR tree, is out of reach.","bk":false},{"s":15,"t":"q","f":"Is optimal tree construction NP-hard, and does that settle the question?","b":"Yes, constructing optimal binary decision trees is NP-hard. In the course's practability view that is irrelevant: what matters is solving real instances in useful time, which MIO speedups and local search now allow.","x":"NP-hardness is a worst-case statement about growth rates; practability asks whether real instances solve in useful time.","bk":true},{"s":15,"t":"q","f":"What do lookahead heuristics (IDX, LSID3, ID3-k) try to fix, and what is the concern?","b":"They choose splits by optimizing deeper trees rooted at the current leaf, to stop strong splits hiding behind weak ones. It is unclear they generalize better, and they can suffer the \"look-ahead pathology\".","x":"Lookahead is a partial fix: it looks a few levels deeper but is still greedy beyond that horizon.","bk":true},{"s":15,"t":"q","f":"Wouldn't a globally optimal tree just overfit? What did the experiments find?","b":"No. On synthetic data from a known tree, OCT recovers the true structure more closely than CART, with much lower false discovery rate, and the gap grows as $n$ falls or $p$ rises; it stays ahead under heavy label/feature noise. Overfitting is controlled by $D$, $N_{\\min}$, $\\alpha$ tuned on validation, as for CART.","x":"Overfitting is controlled by the complexity knobs, not by how well the optimizer solves the problem; better optimization finds the true structure more often.","bk":false},{"s":15,"t":"q","f":"Why can't greedy find the Rec 5 XOR tree?","b":"In XOR neither feature helps alone: the needed root $x_2<0.5$ has 5 errors, worse than other roots ($x_1<0.25$: 2 errors). Greedy scores one split at a time, so it commits to $x_1<0.25$ and can't recover the 0-error structure.","x":"XOR is the extreme case of a strong split hidden behind a weak one: each single split is useless, the pair is perfect.","bk":false},{"s":15,"t":"q","f":"Lec 9 slide 7: what goes wrong when greedy growth uses the penalized objective error $+\\ \\alpha\\cdot$complexity?","b":"Greedy only takes a split that reduces error by more than $\\alpha$. Strong splits can hide behind weaker ones; $\\alpha$ too large ⇒ early stopping misses good trees; $\\alpha$ too small ⇒ overfitting.","x":"No single $\\alpha$ fixes greedy growth: large values stop too early, small values grow noise. Hence grow-then-prune, or OCT.","bk":false},{"s":15,"t":"q","f":"Grow-then-prune (Lec 9 slide 9): what does each step do and what does it prevent?","b":"Grow: choose splits that locally maximize an impurity measure, recursively until no more splits are possible; the deep tree probably overfits. Prune: work back up and remove splits that do not reduce misclassification by at least $\\alpha$. Prevents a weak split from hiding a strong one.","x":"Growing past weak splits exposes the strong ones; pruning then judges subtrees by the real objective.","bk":false},{"s":15,"t":"q","f":"Rec 5 poll: how many depth-2 trees classify all ten points correctly?","b":"**Three** (counting by leaf contents). All have leaves $\\{1,2,3\\}$ and $\\{4,5\\}$; the other two leaves are $\\{6,7\\},\\{8,9,10\\}$ (XOR: root $x_2<0.5$), $\\{6,7,8\\},\\{9,10\\}$ (root $x_1<0.65$), or $\\{6,8,9,10\\},\\{7\\}$ (root $x_2<0.65$). None uses greedy's root $x_1<0.25$; $N_{\\min}=2$ rules out the last.","x":"Greedy's 1-error tree is not a near miss: several perfect trees exist and greedy's first choice excludes them all.","bk":false},{"s":15,"t":"q","f":"Rec 5 slide 15: \"A strong decision maker is better than a committee.\" What is being contrasted?","b":"One tree with all splits chosen together (optimal tree) versus ensembles (RF, boosting) that average many greedy trees to make up for each tree's errors.","x":"The slogan frames OCT as an alternative to ensembles: fix the single tree by optimization instead of averaging away its mistakes.","bk":false},{"s":16,"t":"term","f":"$\\mathcal B$ and $\\mathcal L$ (OCT skeleton)","b":"Branch nodes $\\{1,\\dots,2^D-1\\}$ and leaves $\\{2^D,\\dots,2^{D+1}-1\\}$ of the full tree of depth $D$. $D=2$: $\\mathcal B=\\{1,2,3\\}$, $\\mathcal L=\\{4,5,6,7\\}$.","x":"Fixing a full skeleton of depth $D$ turns tree learning into choosing values for a finite set of variables on known nodes.","bk":false},{"s":16,"t":"term","f":"$A_L(t)$, $A_R(t)$","b":"Ancestors of node $t$ whose left (right) branch lies on the path to $t$; Lec 9 writes $\\mathcal P^L_t$, $\\mathcal P^R_t$. Fixed by the skeleton. Leaf 5: $A_L(5)=\\{1\\}$, $A_R(5)=\\{2\\}$.","x":"The ancestor sets come from the skeleton and are data, which is why the routing constraints can be written before solving.","bk":false},{"s":16,"t":"term","f":"$a_t,\\ b_t$ (OCT)","b":"Split at branch node $t$: a point goes left iff $a_t^Tx<b_t$. Parallel OCT: $a_t\\in\\{0,1\\}^p$ with exactly one 1 when splitting, $b_t\\in[0,1]$.","x":"Because $x_i$ is data, $a_t^Tx_i$ is linear in the variable $a_t$, so routing stays linear.","bk":false},{"s":16,"t":"term","f":"$d_t$ (OCT)","b":"Binary: 1 if branch node $t$ applies a split.","x":"$d_t$ is the on/off switch that lets the fixed skeleton represent shallower trees.","bk":false},{"s":16,"t":"term","f":"$z_{it}$ (OCT)","b":"Binary: 1 if point $i$ is assigned to leaf $t$.","x":"$z_{it}$ is where the formulation gets big: $n\\cdot2^D$ binaries, one per point per leaf.","bk":false},{"s":16,"t":"term","f":"$l_t$ (OCT)","b":"Binary: 1 if leaf $t$ contains any points.","x":"$l_t$ exists to make the minimum leaf size conditional: only nonempty leaves must hold $N_{\\min}$ points.","bk":false},{"s":16,"t":"term","f":"$c_{kt}$ (OCT)","b":"Binary: 1 if leaf $t$ predicts class $k$.","x":"The labels are decided jointly with the splits, so the MIO can trade a slightly worse split for a cleaner labeling.","bk":false},{"s":16,"t":"term","f":"$N_{kt},\\ N_t$ (OCT)","b":"Number of class-$k$ points and of all points in leaf $t$: $N_{kt}=\\sum_{i:y_i=k}z_{it}$, $N_t=\\sum_iz_{it}$.","x":"These counts are linear in $z$, which is what lets the leaf error be written with linear constraints.","bk":false},{"s":16,"t":"term","f":"$L_t$ (OCT)","b":"Misclassified points in leaf $t$: $L_t=N_t-\\max_kN_{kt}=\\min_k\\{N_t-N_{kt}\\}$.","x":"$L_t$ is a min over classes, which is not linear; the $c_{kt}$ binaries and big-M constraints linearize it.","bk":false},{"s":16,"t":"term","f":"$\\hat L$ (OCT objective)","b":"Baseline error of the tree with no splits (root predicts the majority class). Dividing the error by $\\hat L$ keeps $\\alpha$ comparable across datasets.","x":"Without normalization the same $\\alpha$ would mean different things on a 100-point and a 100,000-point dataset.","bk":false},{"s":16,"t":"term","f":"$\\varepsilon$ in OCT routing","b":"Small constant (below the smallest gap between distinct values of a feature) that turns the strict left test $a^Tx<b$ into $a^Tx+\\varepsilon\\le b$.","x":"Solvers cannot handle strict inequalities; $\\varepsilon$ turns the strict left test into a $\\le$ without cutting off any valid split.","bk":false},{"s":16,"t":"term","f":"OCT hyperparameters","b":"Maximum depth $D$, minimum leaf size $N_{\\min}$, complexity parameter $\\alpha$; tuned on validation as in CART.","x":"The same three knobs as CART ($D$, `minbucket`, `cp`), but now they parameterize an exact problem rather than a heuristic.","bk":false},{"s":16,"t":"q","f":"Write the OCT objective.","b":"$$\\min\\ \\frac1{\\hat L}\\sum_{t\\in\\mathcal L}L_t+\\alpha\\sum_{t\\in\\mathcal B}d_t$$\nNormalized misclassification plus $\\alpha$ times the number of splits.","x":"Normalized misclassification plus a split price; this is exactly the problem CART approximates, now written as a linear objective.","bk":false},{"s":16,"t":"q","f":"Write the split constraints for parallel (axis-aligned) OCT.","b":"$\\sum_{j=1}^pa_{jt}=d_t$, $0\\le b_t\\le d_t$, $a_{jt}\\in\\{0,1\\}$, for all $t\\in\\mathcal B$. With $d_t=1$ exactly one feature is used and the threshold lies in $[0,1]$ like the scaled features.","x":"The sum ties the number of features used to the on/off switch, so a node either tests one feature or nothing.","bk":false},{"s":16,"t":"q","f":"How does OCT represent “node $t$ does not split”, and where do its points go?","b":"$d_t=0$ forces $a_t=0$ and $b_t=0$. The left test becomes $0<0$, never true, so **every point goes right**. No extra variables are needed for stopping early.","x":"Making the left test impossible ($0<0$) is a cheap way to express no split with no extra variables.","bk":false},{"s":16,"t":"q","f":"Write the hierarchy constraint and say what $d_1=0$ implies.","b":"$d_t\\le d_{p(t)}$ for $t\\in\\mathcal B\\setminus\\{1\\}$: a split needs a split above it (chained, all ancestors). $d_1=0$ forces every $d_t=0$; all points go right repeatedly and land in the rightmost leaf: a tree with no splits.","x":"Because the root has no parent, the constraint is written for $t\\in\\mathcal B\\setminus\\{1\\}$; chained, it propagates through all ancestors.","bk":false},{"s":16,"t":"q","f":"Write the OCT routing constraints with valid big-M values (Rec 5 form).","b":"$a_m^Tx_i+\\varepsilon\\le b_m+(1+\\varepsilon)(1-z_{it})$ for $m\\in A_L(t)$;\n$a_m^Tx_i\\ge b_m-(1-z_{it})$ for $m\\in A_R(t)$;\nfor all $i\\in[n]$, $t\\in\\mathcal L$. If $z_{it}=1$ point $i$ passes every test on the path to $t$; if $z_{it}=0$ both are slack.","x":"With $z_{it}=1$ the big-M terms vanish and the point must satisfy every test on its path; with $z_{it}=0$ both constraints relax.","bk":false},{"s":16,"t":"q","f":"Why does OCT need $\\varepsilon$ in the left-branch constraint?","b":"Solvers can't handle strict inequalities. Without $\\varepsilon$, a point with $x_{i2}=0.5$ satisfies both $x_{i2}\\le0.5$ and $x_{i2}\\ge0.5$ at the XOR root and could go either way. With $\\varepsilon$ below the smallest feature gap no valid split is lost.","x":"Without $\\varepsilon$, a point lying exactly on the threshold could be routed either way, which breaks the tree semantics.","bk":false},{"s":16,"t":"q","f":"Why are $M=1+\\varepsilon$ (left) and $M=1$ (right) valid big-Ms in OCT?","b":"Features are scaled to $[0,1]$ and $a_t$ is a 0/1 unit vector, so $a_m^Tx_i\\in[0,1]$ and $b_m\\in[0,1]$. Hence $a_m^Tx_i+\\varepsilon-b_m\\le1+\\varepsilon$ and $b_m-a_m^Tx_i\\le1$.","x":"Valid big-M values come from bounds on the data and variables; scaling features to $[0,1]$ is what makes $M=1$ possible.","bk":false},{"s":16,"t":"q","f":"Write the OCT leaf-size constraints and explain the empty-leaf case.","b":"$l_t\\ge z_{it}$ for all $i$ (any point forces $l_t=1$) and $\\sum_iz_{it}\\ge N_{\\min}l_t$. A used leaf holds at least $N_{\\min}$ points; an empty leaf gives $0\\ge N_{\\min}l_t$, forcing $l_t=0$.","x":"The pair $l_t\\ge z_{it}$ and $\\sum_i z_{it}\\ge N_{\\min}l_t$ is the standard on/off pattern: the switch turns the size requirement on only when the leaf is used.","bk":false},{"s":16,"t":"q","f":"Linearize $L_t=N_t-\\max_kN_{kt}$ in OCT.","b":"$\\sum_kc_{kt}=l_t$;\n$L_t\\ge N_t-N_{kt}-n(1-c_{kt})$ for all $k$;\n$L_t\\le N_t-N_{kt}+n\\,c_{kt}$ for all $k$;\n$L_t\\ge0$.\nPredicted class: the first line binds. Non-predicted classes: the second line caps $L_t$, so the predicted class must be a most common one.","x":"The first line fixes $L_t$ from below for the predicted class; the second keeps the solver from labeling a leaf with a minority class.","bk":false},{"s":16,"t":"q","f":"Why is $M=n$ valid in the OCT error constraints?","b":"$0\\le N_t-N_{kt}\\le n$, so subtracting $n$ makes the \"$\\ge$\" line vacuous when $c_{kt}=0$, and adding $n$ makes the \"$\\le$\" line vacuous when $c_{kt}=1$.","x":"A big-M must exceed the largest possible value of the expression it relaxes; counts can never exceed $n$.","bk":false},{"s":16,"t":"q","f":"Is the upper constraint $L_t\\le N_t-N_{kt}+n\\,c_{kt}$ needed for the optimum?","b":"No. Minimizing already picks a majority label, since a minority label only adds errors. It removes those minority-label solutions from the feasible set, which tightens the formulation (Rec 5 slide 28).","x":"Redundant-at-optimum constraints are still useful: they cut fractional and suboptimal solutions, tightening the relaxation.","bk":false},{"s":16,"t":"q","f":"Leaf with points 4, 5, 7 ($N_B=2$, $N_R=1$, $n=10$): show OCT can't label it R.","b":"Predict R ($c_R=1$, $c_B=0$): first line for R gives $L\\ge3-1=2$; second line for B gives $L\\le3-2=1$. Infeasible. Predict B: $L\\ge1$, $L\\le2$, minimized to $L=1$ (point 7).","x":"Worked check of the linearization: the two lines conflict for a minority label, so only the majority label is feasible.","bk":false},{"s":16,"t":"q","f":"Lec 9 writes $N_{kt}=\\sum_i\\frac12(1+Y_{ik})z_{it}$. What is $Y_{ik}$?","b":"$Y_{ik}=+1$ if $y_i=k$ and $-1$ otherwise, so $\\frac12(1+Y_{ik})$ is the indicator $\\mathbb 1\\{y_i=k\\}$; identical to $\\sum_{i:y_i=k}z_{it}$.","x":"The $\\pm1$ coding is just an algebraic way to write the class indicator; nothing changes in the model.","bk":false},{"s":16,"t":"q","f":"What does Lec 9's complete formulation (slide 26) omit, and why does it matter? (derived)","b":"It omits $\\sum_kc_{kt}=l_t$ (present in Rec 5 slide 31 and Book (8.9)). With all $c_{kt}=0$ the \"$\\ge$\" lines are slack and $0\\le L_t\\le\\min_k(N_t-N_{kt})$, so $L_t=0$ is feasible: the error term vanishes. It also writes $d_t\\le d_{p(t)}$ for all $t\\in\\mathcal B$, though the root has no parent.","x":"Lec 9 slide 26 is missing $\\sum_k c_{kt}=l_t$; on an exam write the Rec 5 / Book (8.9) version.","bk":false},{"s":16,"t":"q","f":"How does Book (8.9) write the left-routing constraint, and how are $\\epsilon_j$ chosen?","b":"$a_m^T(x_i+\\boldsymbol\\epsilon-\\epsilon_{\\min})+\\epsilon_{\\min}\\le b_m+(1+\\epsilon_{\\max})(1-z_{it})$. $\\epsilon_j$ = smallest nonzero gap between adjacent sorted values of feature $j$ (as big as possible without cutting valid splits, avoiding numerical trouble); $\\epsilon_{\\max}=\\max_j\\epsilon_j$.","x":"Per-feature gaps let each feature use the largest safe $\\varepsilon$, which reduces numerical trouble compared with one tiny global constant.","bk":true},{"s":16,"t":"q","f":"Why does the OCT MIO use misclassification, not Gini or entropy?","b":"Gini and entropy are nonlinear in $N_{kt}/N_t$, which breaks the linear MIO. Misclassification linearizes with binaries $c_{kt}$ and big-M. And since the MIO is global, the greedy-growth reason for impurities disappears. Local search can use either criterion.","x":"The MIO needs a linear objective; misclassification linearizes, Gini and entropy do not. Being global, it no longer needs the impurity crutch anyway.","bk":false},{"s":16,"t":"q","f":"How many $z_{it}$ variables for $n=10{,}000$, $D=4$? (Rec 5 poll)","b":"$n\\cdot2^D=10{,}000\\cdot16=160{,}000$. All other variables add a few hundred (total 160,442 with $p=20$, $K=2$).","x":"The routing binaries scale as $n\\cdot2^D$ and dominate every other block, which is why the MIO struggles at large $n$ or $D$.","bk":false},{"s":16,"t":"q","f":"Which constraints dominate the OCT MIO size, and how do they scale?","b":"Routing: $n\\cdot2^D\\cdot D$ constraints (640,000 for $n=10^4$, $D=4$), linear in $n$ and doubling with each level of depth. Total about 810,173 constraints in that example.","x":"Routing constraints grow with $n$, $2^D$ and $D$; this is the computational bottleneck that motivates local search.","bk":false},{"s":16,"t":"q","f":"In “point $i$ goes left iff $a_t^Tx_i<b_t$”, which quantities does the solver choose? (Rec 5 poll)","b":"$a_t$ and $b_t$. $x_i$ is data and $D$ is a hyperparameter. Because $x_i$ is fixed, $a_t^Tx_i$ is linear in $a_t$, so the constraints stay linear.","x":"The poll checks the data-vs-variable distinction that keeps every constraint linear.","bk":false},{"s":16,"t":"q","f":"Rec 5: XOR tree vs greedy tree in the OCT objective; when does the MIO prefer XOR?","b":"XOR: 3 splits, all leaves pure: $0+3\\alpha$. Greedy: 2 splits, 1 error, $\\hat L=5$: $\\frac15+2\\alpha$. XOR wins iff $3\\alpha<\\frac15+2\\alpha$, i.e. $\\alpha<0.2$.","x":"The MIO compares whole trees: XOR pays one extra split but removes the remaining error, worth $1/\\hat L=0.2$.","bk":false},{"s":16,"t":"q","f":"Four discrete decisions in tree construction that the OCT MIO models jointly.","b":"1. At each node, branch or stop.\n2. For each leaf, which label to assign.\n3. For each branch, which variable to split on.\n4. For each training point, which leaf it falls into, consistent with the splits.","x":"Modeling all four decisions jointly is what makes the tree globally optimal rather than greedy.","bk":true},{"s":16,"t":"q","f":"Three reasons to formulate trees as an MIO (Rec 5 slide 17).","b":"**Certificate**: proof of optimality or a bound on the gap; greedy and local search give neither. **Flexible**: depth, leaf size, caps on features used are a few linear constraints. **Tractable now**: MIO solvers ~3.3×10¹² faster 1991–2017, while CART dates from 1984.","x":"The certificate is the key advantage over greedy and local search; flexibility and solver speed make it usable.","bk":false},{"s":16,"t":"q","f":"Routing check in Rec 5: point 9 at $(0.8,0.3)$ in leaf 5 of the XOR tree.","b":"$A_L(5)=\\{1\\}$, $A_R(5)=\\{2\\}$. Node 1 ($x_2<0.5$), left: $0.3+\\varepsilon\\le0.5$ ✓. Node 2 ($x_1<0.5$), right: $0.8\\ge0.5$ ✓. For every other leaf $z_{9,t}=0$ and its constraints are slack.","x":"A concrete routing check shows exactly which constraints bind for a point and why all other leaves' constraints are slack.","bk":false},{"s":16,"t":"q","f":"$D=2$ skeleton: $A_L(t)$ and $A_R(t)$ for leaves 4, 6 and 7.","b":"Leaf 4: $A_L=\\{1,2\\}$, $A_R=\\varnothing$. Leaf 6: $A_L=\\{3\\}$, $A_R=\\{1\\}$. Leaf 7: $A_L=\\varnothing$, $A_R=\\{1,3\\}$. (Leaf 5: $A_L=\\{1\\}$, $A_R=\\{2\\}$.) Each ancestor is in exactly one of the two sets.","x":"Node $t$'s children are $2t$ (left) and $2t+1$ (right), so the path to a leaf reads off its ancestors and directions.","bk":false},{"s":16,"t":"q","f":"Encode Rec 5's greedy tree ($x_1<0.25$; node 2 no split; node 3 $x_2<0.65$) in OCT variables.","b":"$d=(1,0,1)$; $a_1=(1,0)$, $b_1=0.25$; $a_2=0$, $b_2=0$; $a_3=(0,1)$, $b_3=0.65$. Leaf 4 empty ($l_4=0$); leaf 5 $=\\{1,2,3\\}$ (B), leaf 6 $=\\{6,8,9,10\\}$ (R), leaf 7 $=\\{4,5,7\\}$ (B, $L_7=1$). Objective $\\frac15+2\\alpha$.","x":"Node 2 not splitting sends points 1, 2, 3 right into leaf 5, so leaf 4 is empty; this is how the fixed skeleton represents a shallower branch.","bk":false},{"s":16,"t":"q","f":"How does Lec 9 slide 26 write the left-routing constraint, versus Rec 5?","b":"Lec 9: $a_m^T(x_i+\\boldsymbol\\epsilon)\\le b_m+(1+\\epsilon_{\\max})(1-z_{it})$ for $m\\in\\mathcal P^L_t$, with $\\boldsymbol\\epsilon$ the vector of per-feature gaps. Rec 5: $a_m^Tx_i+\\varepsilon\\le b_m+(1+\\varepsilon)(1-z_{it})$ with one $\\varepsilon$.","x":"Since $a_m$ is a unit vector, $a_m^T\\boldsymbol\\epsilon=\\epsilon_j$ for the chosen feature: the same idea with a feature-specific gap.","bk":false},{"s":16,"t":"q","f":"OCT MIO size for the Rec 5 example ($n=10$, $p=2$, $K=2$, $D=2$) and for $n=10^4$, $p=20$, $D=4$.","b":"Variables: $p(2^D-1)+2(2^D-1)+n2^D+3\\cdot2^D+2K2^D$ = **80** and **160,442**. Constraints: $n2^DD+n2^D+n+(3K+5)2^D-3$ = **171** and **810,173** (bounds not counted).","x":"In both cases the $z_{it}$ and routing terms dominate; everything else is a few hundred at most.","bk":false},{"s":17,"t":"term","f":"OCT-H","b":"Optimal Classification Trees with hyperplane splits: $a_t\\in[-1,1]^p$ continuous, so each split $a_t^Tx<b_t$ may combine several features.","x":"Continuous coefficients let one split combine features, often replacing several axis-parallel splits.","bk":false},{"s":17,"t":"term","f":"$s_{jt}$ (OCT-H)","b":"Binary: 1 if feature $j$ is used in the split at node $t$. The complexity term penalizes $\\sum_t\\sum_js_{jt}$, the total number of features used.","x":"Penalizing features used rather than splits keeps hyperplane splits sparse and comparable in cost to parallel splits.","bk":false},{"s":17,"t":"term","f":"$\\mu$ in OCT-H","b":"Small constant ($0.005$) replacing $\\varepsilon$: $a_m^Tx_i+\\mu\\le b_m+(2+\\mu)(1-z_{it})$. Too small ⇒ numerical issues; too large ⇒ cuts valid hyperplanes.","x":"There is no natural minimum separation for hyperplanes, so $\\mu$ is a fixed tuning constant balancing numerical stability against lost splits.","bk":true},{"s":17,"t":"q","f":"Write the OCT-H split constraints.","b":"$a_t\\in[-1,1]^p$, $\\sum_j\\lvert a_{jt}\\rvert\\le d_t$, linearized as $\\hat a_{jt}\\ge a_{jt}$, $\\hat a_{jt}\\ge-a_{jt}$, $\\sum_j\\hat a_{jt}\\le d_t$; threshold $-d_t\\le b_t\\le d_t$. $d_t=0$ still forces a zero split (all points right).","x":"The same on/off logic as OCT: $d_t=0$ forces $a_t=0$ and $b_t=0$, so every point goes right.","bk":false},{"s":17,"t":"q","f":"Why is the routing big-M 2 in OCT-H instead of 1?","b":"With $\\|a_t\\|_1\\le1$ and $x\\in[0,1]^p$, $a_t^Tx_i\\in[-1,1]$ and $b_t\\in[-1,1]$, so $a_t^Tx_i-b_t\\in[-2,2]$.","x":"Big-M values must cover the widest possible range of $a_t^Tx_i-b_t$, which doubles once coefficients and thresholds can be negative.","bk":false},{"s":17,"t":"q","f":"Why can't OCT-H use the smallest feature gap as $\\varepsilon$?","b":"A hyperplane separating two points can be rotated to pass arbitrarily close to either, so there is no minimum separation to compute without enumerating all hyperplanes. Use a small constant instead (Book: $\\mu=0.005$).","x":"Hyperplanes can be rotated continuously, so any positive gap can be shrunk; a fixed small constant is the practical answer.","bk":false},{"s":17,"t":"q","f":"Write the OCT-H complexity penalty and the constraints linking $s_{jt}$.","b":"Objective $\\frac1{\\hat L}\\sum_tL_t+\\alpha\\sum_{t\\in\\mathcal B}\\sum_{j=1}^ps_{jt}$, with $-s_{jt}\\le a_{jt}\\le s_{jt}$, $s_{jt}\\le d_t$, $\\sum_js_{jt}\\ge d_t$. A split using more features costs more; for parallel splits this equals the number of splits.","x":"A split using three features costs three times a single-feature split, which discourages dense, hard-to-read hyperplanes.","bk":false},{"s":17,"t":"q","f":"Is OCT-H much harder than OCT for MIO? (Lec 9 slide 29)","b":"No: allowing hyperplanes doesn't meaningfully change the problem size or difficulty; hyperplane trees are about as easy to find as axis-parallel ones with MIO. Greedy methods, by contrast, face exponentially many candidate hyperplanes.","x":"The MIO has the same structure and a similar number of variables, so the solver's difficulty barely changes; greedy methods have no such luck.","bk":false},{"s":17,"t":"q","f":"How do you recover OCT from the OCT-H model?","b":"Restore the binary constraints on $a_t$ (and $\\sum_ja_{jt}=d_t$, $b_t\\ge0$). The closeness of the two formulations is the Book's argument that MIO is the natural language for trees.","x":"Parallel splits are a special case of hyperplane splits, so the formulations nest.","bk":true},{"s":17,"t":"q","f":"Are hyperplane trees less interpretable than parallel trees? (Lec 9 slide 54)","b":"Each hyperplane split is less interpretable, but the tree can be far smaller. Slide 54: OCT 99.5% test at depth 5 vs OCT-H 99.5% at depth 2 (two splits, one of them parallel). OCT-H penalizes features per split, so most splits stay sparse.","x":"Fewer, more expressive splits can make the whole tree easier to read even if each split is harder.","bk":false},{"s":17,"t":"q","f":"Why does feature scaling matter more for OCT-H than OCT?","b":"Rescaling a feature changes which hyperplanes satisfy $\\|a_t\\|_1\\le1$ and how the penalty treats coefficients, so it changes the available splits. Parallel splits are invariant to monotone rescaling. IAI scales to $[0,1]$ by default.","x":"The constraint $\\|a_t\\|_1\\le1$ and the penalty are not scale-invariant, so the units of each feature affect which hyperplanes are feasible and cheap.","bk":false},{"s":17,"t":"q","f":"Lec 9 slide 27: how do you turn the parallel split constraints into hyperplane ones, and why the 1-norm?","b":"Relax integrality of $a_{jt}$ and replace $\\sum_ja_{jt}=1$ with $\\|a_t\\|_1\\le1$. The 1-norm linearizes easily with auxiliary variables (Rec 5 and the Book use $\\le d_t$ to keep the on/off switch).","x":"The 1-norm constraint is linear after splitting each coefficient into a bound $\\hat a_{jt}\\ge\\pm a_{jt}$; a 2-norm would make the model a conic MIO.","bk":false},{"s":17,"t":"q","f":"Rec 5 slide 39: classes separated by the line $x_1+x_2=1$. Parallel tree vs OCT-H?","b":"Parallel splits need a staircase, one level per step, to approximate the diagonal. One hyperplane split $x_1+x_2<1$ separates them at depth 1.","x":"Hyperplanes give shallower trees on diagonal boundaries; the price is a split that combines features.","bk":false},{"s":17,"t":"q","f":"Which parts of the OCT formulation are kept unchanged in OCT-H?","b":"The $d_t\\in\\{0,1\\}$ on/off switch, $d_t\\le d_{p(t)}$, routing (with $M=2$ and a small constant $\\varepsilon$), leaf size, labels and errors. Only the split block, threshold range, big-M and complexity term change.","x":"Only the split block changes; the routing, leaf and error machinery carries over, which is why OCT-H is no harder for the MIO.","bk":false},{"s":18,"t":"term","f":"Warm start (MIO)","b":"An integer-feasible solution given to the solver before branch-and-bound: immediate upper bound, more pruning, a starting point for heuristics. OCT uses CART's tree, pruned to depth $D$.","x":"A warm start helps the solver find and prune faster; it never changes the optimal value.","bk":false},{"s":18,"t":"term","f":"Local search (Optimal Trees)","b":"Heuristic over split variables only: visit nodes in random order, re-optimize one node with the rest of the tree fixed, accept the best improving move, stop when a full pass changes nothing; repeat from many starting trees.","x":"Local search trades the certificate for speed: it optimizes the same objective over splits only.","bk":false},{"s":18,"t":"term","f":"Random restarts (Optimal Trees)","b":"Run local search from many starting trees (CART grown on random $\\sqrt p$ feature subsets, no bootstrap) and keep the best local optimum.","x":"Different starts reach different local optima, so many restarts are a cheap substitute for global search.","bk":false},{"s":18,"t":"term","f":"Batch cost-complexity pruning","b":"Tune $\\alpha$ by testing only its critical values (where the tree changes), inside a grid search over depth $D$ (Algorithm 8.4); $N_{\\min}$ fixed at 1 with little loss.","x":"Since $\\alpha$ only changes the tree at a few critical values, all of them can be tested from one sequence of trees.","bk":true},{"s":18,"t":"q","f":"How did plain Gurobi do on OCT for Banknote ($n=1372$, $p=4$)?","b":"Small improvements over CART, but hit the 2-hour limit for every tree vs 0.12 s for CART (Lec 9 slide 31). Book: optimality proven only at depth 1; at depth 6 Gurobi did not get past the root node.","x":"Even on a small dataset the plain MIO times out, showing that the formulation, not the hardware, is the bottleneck.","bk":false},{"s":18,"t":"q","f":"What observation makes local search possible (Lec 9 slide 33)?","b":"Given the splits $a,b$, everything else is closed form: route points, label leaves by majority, count errors. The real problem is $\\min_T$ error $+\\ \\alpha\\cdot$complexity over splits only; its size is independent of $n$ and linear in $p$ and the number of splits, while the MIO carries $n\\cdot2^D$ binaries $z_{it}$.","x":"Once the splits are fixed, routing, labels and errors follow mechanically, so only the splits need searching.","bk":false},{"s":18,"t":"q","f":"How is a node re-optimized in OCT local search, by node type?","b":"Leaf: apply CART to split it into two new leaves. Branch with leaves on both sides: apply CART to choose a new split and two leaves. Branch with subtrees: modified CART: try every split location, route points into the fixed subtrees, relabel leaves, compute error, keep the best (Lec 9 slides 35–38).","x":"Each node type reduces to a one-dimensional CART-style search; the only change is that the error must be computed through fixed subtrees.","bk":false},{"s":18,"t":"q","f":"Three moves at node $t$ in Optimal Trees local search (Rec 5 / Book Alg. 8.2).","b":"1. Replace the split with the best new split $x_{j'}<b'$ (children kept).\n2. Replace node $t$ with its left subtree.\n3. Replace node $t$ with its right subtree.\nKeep the best if it lowers the objective.","x":"Deleting a node in favor of one of its subtrees lets local search shrink the tree as well as change splits.","bk":false},{"s":18,"t":"q","f":"Local search vs CART vs MIO on Banknote.","b":"100 random restarts take 0.98 s (vs 0.12 s CART) and beat both CART and the Gurobi MIO at higher depths (Lec 9 slide 39); Book: 0% training error at depth 6, ~4 orders of magnitude faster than the MIO.","x":"Local search is about an order of magnitude slower than CART but orders of magnitude faster than the MIO, and finds better trees than both.","bk":false},{"s":18,"t":"q","f":"Rec 5: why does local search need random restarts?","b":"From the greedy tree no move lowers the error: stuck at 1 error. From \"$x_2<0.5$, two leaves\" (5 errors), \"new split at node 2\" gives $x_1<0.5$ (2 errors), then node 3 gives 0 errors (the XOR tree). Same moves, different start, different local optimum.","x":"A local optimum depends on the starting point; restarts from diverse trees escape the greedy tree's basin.","bk":false},{"s":18,"t":"q","f":"Does OCT local search give an optimality certificate?","b":"No; it returns a local optimum. Only the MIO gives a proof or gap. In practice local search finds better trees much faster than the time-limited MIO.","x":"Local search's output is good in practice, but only the MIO's bound can prove how good.","bk":false},{"s":18,"t":"q","f":"Wine dataset: effect of a CART warm start on the OCT MIO ($D=2$).","b":"Without: optimum found at 270 s, proven after 1,360 more. With: found at 105 s, proven after 230 more; about 5× faster overall. Most time goes to proving optimality, and the optimal tree had about half CART's training error.","x":"Proving optimality, not finding the tree, dominates MIO run time; a strong incumbent speeds up both.","bk":true},{"s":18,"t":"q","f":"Why are local-search starting trees CART on random feature subsets, and why no bootstrap?","b":"Random $\\sqrt p$ feature subsets (like RF) give individually good but diverse starts; CART itself is deterministic, so it gives one start only. No bootstrap so that every starting tree satisfies $N_{\\min}$ on the real training set (feasible start).","x":"Diverse starting trees explore different basins; skipping the bootstrap keeps every starting tree feasible for $N_{\\min}$.","bk":true},{"s":18,"t":"q","f":"How does local search handle hyperplane splits (Lec 9 slide 40)?","b":"Coordinate descent on one hyperplane: optimize coefficients one at a time (each 1-D search is CART-like over critical values), also try deleting a coefficient, repeat until no improvement. Restart from random hyperplanes (Book: $H=5$–10) with the best parallel split as the first start. Matches Gurobi-based local search on small problems.","x":"Each coordinate step is a 1-D search like a CART threshold search, so hyperplane local search stays fast.","bk":false},{"s":18,"t":"q","f":"Complexity of OCT local search vs CART.","b":"Worst case $O(n^2pK)$ vs $O(npK)$; under realistic assumptions $O(npK\\log^2n)$ vs $O(npK\\log n)$, only a $\\log n$ factor. Restarts are independent, so runtime falls linearly with cores.","x":"Local search costs only a $\\log n$ factor more than CART under realistic assumptions, and restarts parallelize perfectly.","bk":true},{"s":18,"t":"q","f":"How does MIO solve time scale with the number of $z_{it}$ variables?","b":"Doubling them (one more level of depth, or $2n$) increases solve time by roughly an order of magnitude. Real problems with $n$ in the 100,000s and depth 10+ would need over 100 million binaries.","x":"Each level of depth doubles the $z$ variables and costs about 10× time, so depth 10+ on large $n$ is out of reach for the MIO.","bk":true},{"s":18,"t":"q","f":"Why is it reasonable to stop the OCT MIO before optimality is proven?","b":"Most of the time is spent raising the lower bound; once the incumbent has been stable for a while it is usually optimal or close. Other methods make no optimality claims either.","x":"The incumbent usually stabilizes long before the lower bound catches up, so early stopping loses little.","bk":true},{"s":18,"t":"q","f":"Why can $\\alpha$ be tuned exactly despite being continuous?","b":"It has a discrete effect: each tree is optimal on an interval of $\\alpha$, and the tree only changes at critical val
