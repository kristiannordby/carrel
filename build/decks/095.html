ables are removed?","o":["$a_t$, $b_t$ and $d_t$","$c_{kt}$, $N_{kt}$, $N_t$ and $L_t$","$z_{it}$ and $l_t$","$\\beta_{0t}$, $f_i$ and $L_i$"],"a":1,"x":"Splits and routing stay. Class labels, counts and leaf errors go; leaf values $\\beta_{0t}$, predictions $f_i$ and per-point losses $L_i$ are added."},{"sec":19,"q":"ORT needs $f_i=\\beta_{0t}$ when point $i$ is in leaf $t$. How is this linearized?","o":["$f_i=\\sum_t\\beta_{0t}z_{it}$ directly as a linear constraint","$f_i\\le\\beta_{0t}+Mz_{it}$ only","$f_i-\\beta_{0t}=M(1-z_{it})$ for all $i,t$","$-M(1-z_{it})\\le f_i-\\beta_{0t}\\le M(1-z_{it})$ for all $i,t$"],"a":3,"x":"$\\sum_t\\beta_{0t}z_{it}$ multiplies two variables, so it is not linear. The big-M pair pins $f_i$ when $z_{it}=1$ and is slack when $z_{it}=0$."},{"sec":19,"q":"ORT with absolute loss on $y=(1,2,3,10)$. $\\hat L$, the loss of the best single constant, is:","o":["12","4","2.5","10"],"a":3,"x":"The best constant under absolute loss is a median (any value in $[2,3]$): $1+0+1+8=10$. 12 uses the mean 4; 4 and 2.5 are the constants themselves, not losses."},{"sec":19,"q":"ORT-L (Rec 5 slide 45) differs from ORT by:","o":["$f_i=\\beta_{0t}$ as in ORT, but with a squared loss instead of the absolute loss","Hyperplane splits with a constant in each leaf","$f_i=\\beta_t^Tx_i$ with no intercept and a penalty on the number of leaves","Leaf prediction $\\beta_t^Tx_i+\\beta_{0t}$, plus $\\lambda\\sum_t\\|\\beta_t\\|_1$"],"a":3,"x":"Each leaf fits a lasso; $x_i$ is data, so the prediction stays linear. Book (11.1) uses an $\\ell_0$ version with binaries $r_{jt}$."},{"sec":19,"q":"Which leaf model gives which Optimal Trees variant?","o":["Survival model ⇒ ORT-L; logistic regression ⇒ OST; a decision ⇒ OCT-H","Linear regression ⇒ OCT-L; constant ⇒ OST; decision ⇒ ORT","Survival ⇒ OST; logistic ⇒ OCT-L; decision ⇒ policy trees","Logistic regression ⇒ ORT; survival model ⇒ OCT-L; a decision ⇒ OST"],"a":2,"x":"Constant ⇒ ORT, linear regression ⇒ ORT-L, survival ⇒ OST, logistic ⇒ OCT-L, decision ⇒ policy trees (Lec 11). OCT-H is about splits, not leaves."},{"sec":19,"q":"(Book) OCT limited to maximum depth 4 compared with CART with no depth limit:","o":["About 4% lower accuracy, but much faster to train and evaluate","Higher accuracy but deeper trees","About the same accuracy with much less complexity","Identical trees on most datasets, since both are depth-limited in practice"],"a":2,"x":"Optimization buys simplicity: the same performance from a much shallower tree."},{"sec":19,"q":"Inside local search for regression trees, how is a constant leaf fit (Rec 5 slide 45)?","o":["Median for squared loss; mean for absolute loss","Mean for squared loss; median for absolute loss","A lasso on the leaf's points, for both squared and absolute loss","The overall training mean, shared by every leaf of the tree"],"a":1,"x":"The mean minimizes squared error and the median minimizes absolute error. A lasso is the fit for linear leaves (ORT-L)."},{"sec":20,"q":"Which statement describes the sample average approximation $\\hat z^{SAA}_N$ in the Lec 10 setting?","o":["Uses $X$ but plans for a single demand forecast","Hedges over the spread of past demands, ignores $X$","Uses $X$ and the demand spread via weights $w^i_N(x)$","Needs the true conditional distribution of $Y$ given $X$"],"a":1,"x":"SAA averages cost over all past $y^i$ equally: uncertainty yes, covariates no. Using $X$ with a single forecast is point prediction."},{"sec":20,"q":"Which formula is the point-prediction-driven decision?","o":["$\\arg\\min_zc(z;\\hat m_N(x))$, $\\hat m_N(x)\\approx\\mathbb E[Y\\mid x]$","$\\arg\\min_{z\\in\\mathcal Z}\\frac1N\\sum_{i=1}^Nc(z;y^i)$ over all past demands","$\\arg\\min_{z\\in\\mathcal Z}\\sum_{i=1}^Nw^i_N(x)\\,c(z;y^i)$ with ML weights","$\\arg\\min_{z\\in\\mathcal Z}\\mathbb E[c(z;Y)\\mid X=x]$ under the true law"],"a":0,"x":"Point prediction plugs one forecast into the cost. The others are SAA, the predictive prescription and the full-information problem."},{"sec":20,"q":"Even with a perfect forecast $\\hat m(x)=\\mathbb E[Y\\mid X=x]$, the point-prediction decision matches the full-information $z^*(x)$ for every distribution only when:","o":["$c(z;y)$ is convex in $z$","$\\mathcal Z$ is a convex polyhedron","$Y$ is independent of $X$","$c(z;y)$ is affine in $y$"],"a":3,"x":"Point prediction minimizes $c(z;\\mathbb E[Y\\mid x])$, the target is $\\mathbb E[c(z;Y)\\mid x]$; they agree for all $z$ when $c$ is affine in $y$. Convexity in $z$ is about tractability, not this equivalence."},{"sec":20,"q":"The Lec 10 theorem: if $c(z;y)$ is convex in $z$ and $\\mathcal Z$ is convex, $\\hat z_N(x)$ is computable in polynomial time. What property of kNN, CART and RF weights does it rely on?","o":["They sum to one, so the objective is an expectation","They are binary, so each prescription is a plain SAA","They are bounded by $1/k$, limiting each scenario's influence","Nonnegativity: a nonnegative sum of convex costs is convex"],"a":3,"x":"A nonnegative combination of convex functions is convex. Summing to one doesn't change the argmin (the RF slide drops the $1/T$), and RF weights aren't binary."},{"sec":20,"q":"A CART tree is trained on 10 points. A new $x$ lands in the leaf holding training points $\\{2,6,7,9\\}$. What weights does the CART prescription put on $y^6$ and on $y^3$?","o":["$\\tfrac1{10}$ on each","1 on $y^6$, 0 on $y^3$","$\\tfrac14$ on $y^6$, 0 on $y^3$","$\\tfrac14$ on $y^6$, $\\tfrac1{10}$ on $y^3$"],"a":2,"x":"CART weights are uniform over the training points in $x$'s leaf, $1/|\\text{leaf}|$, and zero elsewhere. $\\tfrac1{10}$ everywhere is SAA."},{"sec":20,"q":"A random forest has $T=2$ trees. In tree 1, $x$'s leaf holds training points $\\{1,2,3,4\\}$; in tree 2 it holds $\\{2,5\\}$. What is the RF weight $w^2_N(x)$?","o":["0.75","0.5","0.25","0.375"],"a":3,"x":"$w^2=\\tfrac12(\\tfrac14+\\tfrac12)=0.375$. 0.75 forgets the $1/T$ average (harmless for the argmin, but not the weight as defined)."},{"sec":20,"q":"Out of sample: SAA cost 1,800, your prescription 1,500, perfect foresight 1,000. What is $P$?","o":["0.625","0.375","0.167","0.2"],"a":1,"x":"$P=(1800-1500)/(1800-1000)=300/800=0.375$. 0.625 is the remaining gap $(1500-1000)/800=1-P$."},{"sec":20,"q":"Out of sample, a kernel-regression prescription costs 1,850, SAA 1,700 and perfect foresight 1,100. Which reading is correct?","o":["$P=0.25$: a quarter of the gap is closed","$P=-0.25$ is impossible, so the costs must be wrong","$P=-0.25$: worse than ignoring $X$","$P=1.25$: better than perfect foresight"],"a":2,"x":"$(1700-1850)/(1700-1100)=-0.25$. $P\\le1$ always but can be negative out of sample (Lec 10 p. 29 shows KR below 0 at small $N$)."},{"sec":20,"q":"What is the coefficient of prescriptiveness of the SAA decision itself?","o":["1, by construction","The $R^2$ of the sample-mean forecast","0, by construction","Undefined, since SAA ignores $X$"],"a":2,"x":"The numerator compares your cost with the SAA cost, so SAA scores 0; perfect foresight would score 1."},{"sec":20,"q":"In the shipment example at large $N$ (Lec 10 p. 25), which ordering of true risk (lower is better) is right?","o":["$z^*(x)<$ point prediction $<$ SAA $<$ RF, CART, kNN","SAA $<$ RF, CART, kNN $<$ point prediction $<z^*(x)$","$z^*(x)<$ SAA $\\approx$ point prediction $<$ RF, CART, kNN","$z^*(x)\\approx$ RF, CART, kNN $<$ SAA $<$ point prediction"],"a":3,"x":"Tree and kNN prescriptions converge to the full-information optimum (≈1,300); SAA plateaus near 1,700; point prediction near 2,400, worse than SAA because it ignores residual uncertainty."},{"sec":20,"q":"With $N=16{,}384$, uninformative covariates are added ($d_x$ from 3 to 259). What happens (Lec 10 p. 26)?","o":["All methods degrade at about the same rate","kNN and kernel methods degrade; CART and RF stay nearly flat","CART and RF degrade; kNN stays flat","Only the random forest degrades, because of feature subsampling"],"a":1,"x":"Trees choose which features to split on, so noise dimensions rarely enter the bins. kNN and kernel distances use every dimension equally."},{"sec":20,"q":"Newsvendor $c(z;y)=0.25z-\\min(z,y)$. The 5 nearest neighbors (equal weights) had demands 40, 50, 60, 70, 180. What does the kNN predictive prescription order?","o":["80","70","60","180"],"a":1,"x":"The weighted SAA optimum is the $(r-d)/r=0.75$ quantile: cumulative weights 0.2, 0.4, 0.6, 0.8 first reach 0.75 at 70 (average cost $-40.5$). 80 is the point-prediction order from mean demand (average cost $-40$)."},{"sec":20,"q":"Media case: first-week sales correlated with US box office ($\\rho=0.32$), number of IMDb votes ($\\rho=0.25$) and IMDb rating ($\\rho=0.02$). The lesson:","o":["Quality ratings are the strongest public predictor","Public data add nothing beyond internal sales history","Attention predicts sales; quality ratings barely do","Box office gross alone explains most of the variance"],"a":2,"x":"Votes and search volume measure attention; rating measures quality and is nearly uncorrelated. Local Google search volume was the top RF feature."},{"sec":20,"q":"Which pair of numbers did Lec 10 report for the media distributor?","o":["$R^2=0.67$ (RF prediction); $P=0.88$ (RF prescription)","$R^2=0.88$ (RF prediction); $P=0.67$ (RF prescription)","$R^2=0.46$ (RF prediction); $P=0.88$ (RF prescription)","$R^2=0.67$ (RF prediction); $P=0.46$ (RF prescription)"],"a":0,"x":"0.67 is the RF's $R^2$ on new titles, 0.88 the prescription's $P$. 0.46 is the ceiling in the synthetic shipment example, a different problem."},{"sec":20,"q":"Why does the media application correct its weights for right-censoring?","o":["Sales are $\\min\\{Y,V\\}$: a sold-out title's demand is only known to be $\\ge V$","Demand is observed exactly, but sales go missing for newly released titles","Inventory $V$ is unknown, so recorded sales overstate true demand","Weekly aggregation discards the largest daily sales values"],"a":0,"x":"When $U=V$ the shelf emptied and true demand could be higher. Treating sales as demand understates the hot titles; the weights get a Kaplan–Meier-style correction."},{"sec":20,"q":"In the shipment example the best prescriptions approach $P\\approx0.46$, not 1, as $N$ grows. Why?","o":["The training samples are still too small for convergence","Residual uncertainty remains even given $X$","Random forest weights are biased in high dimensions","The shipment cost is nonconvex in $z$"],"a":1,"x":"The denominator uses perfect foresight, which removes all uncertainty. 0.46 is the share of the SAA-to-foresight gap that information in $X$ can close; more data can't exceed it."},{"sec":20,"q":"How does $P$ differ from $R^2$?","o":["$P$ scores decision cost against SAA; $R^2$ scores prediction error against the mean","$P$ is simply $R^2$ computed on the decisions $z$ rather than on the outcomes $y$","$P$ can never be negative out of sample, while out-of-sample $R^2$ can drop below 0","$P$ uses the point-prediction decision instead of SAA as its zero baseline"],"a":0,"x":"Both are 'fraction of the gap closed', but with different baselines and units. Both can be negative out of sample."},{"sec":20,"q":"(Book) As $N$ grows, how does $P$ behave when $X$ is independent of $Y$, and when $Y$ is a deterministic function of $X$?","o":["$P\\to1$ when independent; $P\\to0$ when $Y$ is a function of $X$","$P\\to0.5$ in both cases","$P\\to0$ when independent; $P\\to1$ when $Y$ is a function of $X$","$P\\to0$ in both cases, since SAA is consistent"],"a":2,"x":"With no information in $X$ the best you can do is SAA ($P=0$); with no residual uncertainty even point prediction reaches perfect foresight ($P=1$)."},{"sec":20,"q":"Why is the shipment cost $c(z;y)$ convex in $z$, so the Lec 10 theorem applies?","o":["Its recourse term is an LP value with $z$ in the right-hand side, convex in $z$","It is linear in $z$, because all shipping and production costs are linear","It is convex only when demand is normally distributed around its forecast","Emergency production at $p_2>p_1$ makes it concave, so the theorem uses $-c$"],"a":0,"x":"By LP duality the second-stage value is a max over dual vertices of functions linear in $z$, hence convex; $p_1\\sum z_i$ keeps it convex. It isn't linear: the recourse min creates kinks."},{"sec":20,"q":"Why is a CART-based predictive prescription interpretable?","o":["CART weights are sparse, so a single past observation decides each prescription","The prescription is a linear function of $x$ with few nonzero coefficients","CART prescriptions avoid solving any optimization problem at prediction time","All $x$ in a leaf get the same weights, hence the same decision: if-then rules"],"a":3,"x":"One decision per leaf. A leaf still averages over all its training points, and an optimization is still solved per leaf."},{"sec":21,"q":"In observational data with $m$ treatments, how many potential outcomes are observed per observation?","o":["One: the outcome under the treatment received","All $m$, though each is measured with noise","None; only the propensities are observed directly","$m-1$: every outcome except the received treatment's"],"a":0,"x":"Only $y_{i,t_i}$ is seen; the other $m-1$ are counterfactuals that reward estimation fills in."},{"sec":21,"q":"COVID ICU study: all 22 never-ventilated patients survived versus 76% of the 109 ventilated. The main reason this doesn't show ventilation is harmful:","o":["The sickest patients were ventilated, so survival reflects prognosis","131 patients are too few to support any causal conclusion","Ventilated patients stayed longer and so had more time to die","Survival is binary, so comparing average survival rates is meaningless"],"a":0,"x":"Confounding by indication: assignment depended on severity. Sample size isn't the core issue; the comparison is biased at any size."},{"sec":21,"q":"Among ventilated ICU patients, survivors averaged 14 ventilator days versus 8.5 for non-survivors. Why doesn't this show longer ventilation causes survival?","o":["Ventilator days were recorded with substantial measurement error","Non-survivors were placed on a different, older type of ventilator","Early deaths cut ventilation short (survivorship / reverse causation)","A 5.5-day difference is too small to be statistically significant here"],"a":2,"x":"Death cuts the treatment duration short, so duration depends on survival rather than the reverse."},{"sec":21,"q":"Lec 11 lists reasons a single model $f(x,t)$ trained on $[X\\ T]$ may miss the true dependence of $y$ on $t$. Which is one of them?","o":["Propensity scores near zero inflate the variance","The outcome must be binary for $f$ to be consistent","Regularization bias shrinks the dependence on $t$","Cross-fitting removes the treatment column"],"a":2,"x":"The listed causes are model class (e.g. an RF rarely splitting on $t$), regularization bias (dependence damped) and overfitting (dependence exaggerated). Small propensities are IPW's problem."},{"sec":21,"q":"In the direct method, each outcome model $f_t$ is trained on:","o":["all observations, with $t$ added as a feature","all observations, each weighted by $1/p_{it}$","only observations that received treatment $t$","only observations that did not receive $t$"],"a":2,"x":"DM fits one model per arm and predicts $\\Gamma_{it}=f_t(x_i)$ for everyone. Using $t$ as a feature is the single-model approach slides 13–15 reject."},{"sec":21,"q":"Bias/variance profile of DM and IPW according to Lec 11:","o":["DM: high variance but unbiased. IPW: low variance but assignment-biased","Both have low variance; only IPW is susceptible to assignment bias","DM: bias-correcting, high variance. IPW: low variance, assignment-biased","DM: low variance, assignment-biased. IPW: bias-correcting, high variance"],"a":3,"x":"DM extrapolates smooth models (stable, but biased under selection); IPW divides by propensities (unbiased if they're right, but small $p_{it}$ inflate variance)."},{"sec":21,"q":"How are the propensity scores $p_{it}$ estimated?","o":["Fit a classifier of $T$ on $X$; use its predicted probabilities","Regress $Y$ on $X$ within each treatment arm and normalize","Use the overall share of patients receiving $t$, the same for all $i$","Fit $Y$ on $[X\\ T]$ and read off the coefficient on $t$"],"a":0,"x":"The propensity is the probability of receiving $t$ given $x_i$, a classification problem. A constant fraction ignores $x$ and corrects nothing."},{"sec":21,"q":"Patient $i$ received B with outcome $y_i=6$ and propensity $p_{iB}=0.25$. What are the IPW rewards $(\\Gamma_{iA},\\Gamma_{iB})$?","o":["$(0,\\ 1.5)$","$(0,\\ 24)$","$(6,\\ 24)$","$(18,\\ 6)$"],"a":1,"x":"$\\Gamma_{it}=\\mathbb 1\\{T_i=t\\}y_i/p_{it}$: B gets $6/0.25=24$, A gets 0. 1.5 multiplies by $p$ instead of dividing."},{"sec":21,"q":"Patient received A: $y=10$, $p_A=0.4$, outcome models $f_A=7$, $f_B=9$. What are the DR rewards $(\\Gamma_A,\\Gamma_B)$?","o":["$(25,\\ 0)$","$(14.5,\\ 9)$","$(7,\\ 9)$","$(8.2,\\ 9)$"],"a":1,"x":"$\\Gamma_A=7+(10-7)/0.4=14.5$; B is unobserved, so $\\Gamma_B=f_B=9$. $(25,0)$ is IPW, $(7,9)$ is DM, and 8.2 multiplies the residual by $p$."},{"sec":21,"q":"Patient received B: $y=4$, $p_B=0.5$, $f_B=6$. What is the DR reward $\\Gamma_B$?","o":["8","6","5","2"],"a":3,"x":"$6+(4-6)/0.5=6-4=2$. The correction is negative because the outcome model over-predicted; 8 flips the residual's sign."},{"sec":21,"q":"Why is IPW typically high variance?","o":["It discards half of the data when forming rewards","It ignores the observed outcomes and uses only propensities","Small propensities in the denominator amplify estimation errors","It needs a separately trained outcome model for every treatment arm"],"a":2,"x":"A propensity of 0.05 becomes a weight of 20, so small errors in $p$ cause large swings. IPW uses only the observed outcomes, not none."},{"sec":21,"q":"The doubly robust guarantee: DR rewards are high quality if","o":["both the propensity and the outcome models are good","either the propensity or the outcome model is good","propensities stay away from 0 and 1, whatever the models","treatments were randomly assigned in the original data"],"a":1,"x":"Two chances: a correct outcome model makes the correction mean-zero; correct propensities make the correction undo the model's bias."},{"sec":21,"q":"Suppose $f_t(x)=\\mathbb E[Y\\mid X=x,T=t]$ exactly. On average, what does the IPW correction term in DR contribute?","o":["It doubles the DM estimate on the observed arm","Zero: the residual has mean zero given $x_i$ and $T_i=t$","It removes all remaining variance from the reward","It turns the DR reward into the IPW reward $y_i/p_{it}$"],"a":1,"x":"With a correct outcome model the residuals average out, so DR equals DM in expectation (derived). It still adds some variance."},{"sec":21,"q":"A more invasive drug goes to sicker patients. Under the direct method, the treated model predicts worse outcomes than the untreated model for the same $x$. The right interpretation:","o":["The drug is harmful for these patients and should be withheld","The outcome models are overfit and need stronger regularization","Possibly bias: the treated were sicker; the drug may still work","The propensity scores must have been estimated incorrectly"],"a":2,"x":"Slide 19: the treated model learns from a sicker population and extrapolates poorly; the gap need not be a treatment effect."},{"sec":21,"q":"What is cross-fitting in reward estimation?","o":["Choosing hyperparameters by $k$-fold cross-validation error","Fitting outcome models on test data and propensities on training data","Averaging the DM and IPW rewards separately within each fold","Predicting each fold with models trained on the other folds"],"a":3,"x":"Cross-fitting makes every nuisance prediction out-of-sample. Mechanically like CV, but the goal is honest plug-in estimates, not tuning."},{"sec":21,"q":"Propensities are predicted in-sample by an overfit classifier. What goes wrong with IPW/DR rewards?","o":["Propensities get too extreme, distorting the $1/p_{it}$ weights","The rewards become identical to the direct-method rewards","All estimated rewards turn negative for every treatment","Nothing changes; overfitting only matters for test accuracy"],"a":0,"x":"An overfit classifier gives the observed treatment probability near 1 (others near 0), so weights collapse or explode. Cross-fitting fixes this."},{"sec":21,"q":"In Lec 11's recommended evaluation protocol, how are test-set prescriptions scored?","o":["With the training reward models applied to test observations","With observed test outcomes only, ignoring counterfactuals","With the training rewards of each test point's nearest neighbor","With a new reward estimation fit on the test set alone"],"a":3,"x":"Steps 4–5: re-estimate rewards independently on the test data to avoid leakage. That is also why a 50/50 split is recommended."},{"sec":21,"q":"For a numeric treatment such as a dose, how does reward estimation change?","o":["The dose is discretized into exactly two levels first","A kernel on treatment proximity replaces $\\mathbb 1\\{T_i=t\\}$","The propensity score is replaced by the dose itself","Only the direct method remains valid, since IPW needs categories"],"a":1,"x":"Slide 43: with continuous doses, exact matches have probability zero, so a kernel weights observations by how close their dose is to $t$."},{"sec":21,"q":"In `IAI.CategoricalClassificationRewardEstimator(..., reward_estimator=:doubly_robust)`, what do 'Categorical' and 'Classification' refer to?","o":["Features are categorical; the treatment is predicted by a classifier","Outcomes are categorical; propensities use a regression","The policy tree will be a classification tree with categorical splits","Treatments are categorical; the outcome is binary (classifier)"],"a":3,"x":"Pick the treatment type (categorical or numeric) and the outcome type (numeric, binary, survival). Both nuisance models on the slide are RF classifiers."},{"sec":21,"q":"Four patients. Patients 1 and 2 received A with outcomes 6 and 9 and propensities $p_A=0.5$ and $0.75$; patients 3 and 4 received B. What is the IPW estimate of the total reward of 'give everyone A'?","o":["24","15","7.5","9.75"],"a":0,"x":"Sum $\\Gamma_{iA}$: $6/0.5+9/0.75+0+0=24$. 15 sums raw outcomes, 7.5 is their mean, 9.75 multiplies by $p$."},{"sec":22,"q":"The Lec 11 policy-learning objective on a reward matrix $\\Gamma$ is:","o":["$\\min_\\pi\\sum_i\\sum_t\\big(y_i-\\Gamma_{it}\\big)^2\\mathbb 1\\{\\pi(x_i)=t\\}$","$\\max_\\pi\\sum_i\\sum_t\\mathbb 1\\{T_i=t\\}\\,\\Gamma_{it}$","$\\max_\\pi\\sum_i\\mathbb 1\\{\\pi(x_i)=T_i\\}\\,y_i$","$\\max_\\pi\\sum_i\\sum_t\\mathbb 1\\{\\pi(x_i)=t\\}\\,\\Gamma_{it}$"],"a":3,"x":"Total estimated reward of the assigned treatments. $\\sum_i\\sum_t\\mathbb 1\\{T_i=t\\}\\Gamma_{it}$ doesn't depend on $\\pi$; the last option only rewards copying the historical treatment."},{"sec":22,"q":"Regress-and-compare prescribes:","o":["the treatment with the best average observed outcome, for everyone","$\\arg\\max_t\\Gamma_{it}$ separately for each observation $i$","the treatment assigned by a tree fit to $\\Gamma$","the treatment with the highest propensity"],"a":1,"x":"R&C is a per-row argmax. One treatment for everyone is the naive averaging approach of slide 8."},{"sec":22,"q":"Why can't regress-and-compare be used with IPW or DR rewards?","o":["IPW and DR rewards can be negative, which breaks the argmax","IPW and DR rewards are only defined for continuous treatments","They are undefined in the column of the observed treatment","IPW/DR rewards are valid only in aggregate, not row by row"],"a":3,"x":"IPW and DR are unbiased only on average over many observations; single rows are noisy (IPW is zero in every unobserved column)."},{"sec":22,"q":"IPW rewards (A, B) for four patients: (10, 0), (10, 0), (0, 11.25), (0, 10). What does a per-row argmax prescribe?","o":["A for everyone, since A's column sum is larger","B for everyone, since 11.25 is the largest entry","A, B, A, B, alternating to balance the two arms","Each patient's historical treatment: A, A, B, B"],"a":3,"x":"IPW puts all reward in the observed column, so the argmax echoes the historical assignment. Hence R&C needs DM rewards."},{"sec":22,"q":"A policy-tree leaf holds three observations with rewards (A, B): (5, 3), (4, 2), (1, 9). Which treatment does the leaf assign (maximizing)?","o":["A, because two of the three observations prefer A","B, because its summed reward 14 exceeds A's 10","A, because A has the higher median reward","Either one; the objective is tied in this leaf"],"a":1,"x":"The leaf maximizes $\\sum_i\\Gamma_{it}$: A $=10$, B $=14$. A majority vote over row-wise winners ignores magnitudes."},{"sec":22,"q":"How does Lec 11 show that classification is a special case of the policy-tree problem?","o":["Set $\\Gamma_{it}=0$ if point $i$ is class $t$, else 1, and minimize","Set $\\Gamma_{it}=y_i$ for all $t$ and maximize","Set $\\Gamma_{it}=p_{it}$ and maximize","Set $\\Gamma_{it}=1$ if point $i$ is class $t$, else 0, and minimize"],"a":0,"x":"The objective then counts misclassifications, so policy trees are weighted classification trees. The last option would minimize correct classifications."},{"sec":22,"q":"Because the policy-tree problem is a weighted classification-tree problem, Lec 11 trains it by","o":["training a regression tree on $y$ and prescribing the leaf's mean","training one classification tree per treatment and comparing them","plugging the rewards into a classification-tree loss as weights","solving a separate LP for each candidate leaf of the tree"],"a":2,"x":"Both greedy and Optimal Trees classifiers adapt directly once the loss is reward-weighted."},{"sec":22,"q":"What distinguishes Optimal Policy Trees from the R package `policytree`?","o":["Same objective, but Optimal Trees global optimization replaces greedy splitting","Optimal Policy Trees accept only direct-method rewards, not IPW or DR","`policytree` uses hyperplane splits; Optimal Policy Trees use axis-parallel ones","Optimal Policy Trees skip reward estimation and use raw outcomes"],"a":0,"x":"The gain is in the search (global/local search vs greedy), echoing OCT vs CART. Both work on estimated rewards."},{"sec":22,"q":"How does Lec 11 evaluate policies on real data, where counterfactuals are unknown?","o":["Compare the prescriptions with the treatments clinicians actually gave","Apply the training-set reward models to the test observations directly","Re-estimate rewards on the test set alone; only an experiment is definitive","Report in-sample policy value, which upper-bounds the test value anyway"],"a":2,"x":"Slide 34: independent test reward estimation gives an estimate, not ground truth; a real experiment is the only definitive measure."},{"sec":22,"q":"Synthetic experiments (Lec 11 slide 33): what does the mean-regret chart show?","o":["Greedy policy trees beat optimal policy trees at every training size","Causal forests have the highest regret at every training size","All four methods reach identical regret at large $n$","Optimal ≤ greedy policy trees; regress-and-compare lowest at small $n$"],"a":3,"x":"Read off the chart: optimal ≤ greedy in all four experiments (clearly in Exp 1–2); R&C lowest at small $n$, causal forests catch up with more data."},{"sec":22,"q":"Optimal Policy Trees for diabetes (about 50,000 visits, 13 treatment combinations) reported:","o":["an estimated HbA1c reduction of 0.05, exactly the clinical threshold","an estimated 0.11 HbA1c reduction vs a 0.05 clinical threshold","an estimated 8–15% relative reduction in patients' HbA1c","an estimated 0.11 gain in one-year survival probability"],"a":1,"x":"0.11 is about twice the 0.05 threshold. 8–15% is the marketing-channel lift."},{"sec":22,"q":"The financial-services marketing application of Optimal Policy Trees reported:","o":["an estimated 0.11 reduction in customer churn","an estimated 8–15% lift in fund flow","a 50% cut in total marketing spend","an out-of-sample $P$ of 0.88"],"a":1,"x":"Leaves recommend phone calls, in-person meetings, emails, or 'little impact'. $P=0.88$ belongs to Lec 10's media case."},{"sec":22,"q":"In the job-training policy tree (Lec 11 slide 35, $n=506$), what is the root split?","o":["Age $<42.5$ years","Education $<8.5$ years","1975 earnings $<5359$","1978 salary $<5359$"],"a":2,"x":"The root splits on 1975 earnings, then age and education. 1978 salary is the outcome, so it can't be a feature."},{"sec":22,"q":"Lec 11's two-step approach to prescriptions from observational data:","o":["train Optimal Policy Trees on observed outcomes, then estimate propensities in each leaf","run a randomized experiment, then apply regress-and-compare","causal-inference reward estimation, then Optimal Policy Trees on the rewards","fit an OCT predicting the observed treatment, then prescribe its prediction"],"a":2,"x":"Reward estimation (DM/IPW/DR, cross-fitted) first, then policy learning. Predicting the observed treatment would just copy historical practice."},{"sec":22,"q":"Lec 11 says a policy tree 'regularizes' the policy relative to regress-and-compare. In what sense?","o":["Similar observations share a treatment, damping outcome noise","It adds an $\\ell_1$ penalty on the rewards to the tree objective","It shrinks every propensity toward 0.5 before the tree is fit","It restricts the policy to two treatments to limit variance"],"a":0,"x":"Pooling a leaf averages out reward noise, while R&C can give neighbors different treatments on noise alone."},{"sec":22,"q":"Four patients aged 30, 40, 50, 60 have DR rewards (A, B): (8, 5), (3, 7), (6, 6.5), (2, 9). Which depth-1 policy has the highest estimated total reward?","o":["Age $<35$ ⇒ A, else B (total 30.5)","Age $<45$ ⇒ A, else B (total 26.5)","Age $<55$ ⇒ A, else B (total 26)","Age $<35$ ⇒ B, else A (total 16)"],"a":0,"x":"Sum the selected entries: $8+7+6.5+9=30.5$. The age-45 split gives $8+3+6.5+9=26.5$."},{"sec":22,"q":"(Book) How do Bertsimas–Dunn–Mundru Optimal Prescriptive Trees estimate the counterfactual $\\hat y_i(t)$?","o":["With doubly robust rewards estimated before tree training","With one random forest trained on $[X\\ T]$","Mean outcome of $i$'s leaf-mates that received $t$","With the outcome of $i$'s nearest neighbor that received $t$"],"a":2,"x":"Book OPT estimates counterfactuals inside each leaf (OPT-L: per-treatment lasso in the leaf). Separate DR estimation is the lecture's Optimal Policy Trees."},{"sec":22,"q":"(Book) What happens with prescription factor $\\mu=1$ in Optimal Prescriptive Trees?","o":["Only prediction error is optimized, so the tree ignores treatments","The tree becomes identical to regress-and-compare","The training problem becomes infeasible for most data","Only prescription error counts, so counterfactuals turn optimistic"],"a":3,"x":"Without the prediction term, leaf estimates can flatter the tree's own prescriptions. $\\mu\\approx0.5$–0.8 worked best."},{"sec":22,"q":"(Book) How do the lecture's Optimal Policy Trees and the book's Optimal Prescriptive Trees handle treatment-assignment bias?","o":["Lecture: leaf-level matching only. Book: IPW/DR propensity weighting","Lecture: IPW/DR propensity weighting. Book: leaf-level matching only","Neither method addresses treatment-assignment bias at all","Both use cross-fitted doubly robust rewards before training"],"a":1,"x":"The lecture separates causal estimation (with propensities) from tree search; the book estimates counterfactuals within leaves during training."},{"sec":22,"q":"(Book) On the warfarin dosing data (3 dose groups), which method did best?","o":["Regress-and-compare","Greedy prescriptive trees","Optimal Prescriptive Trees with $\\mu=1$","Causal forests"],"a":0,"x":"OPT beat greedy trees by about 0.6–1.2%, but R&C did best on that dataset, unlike the synthetic results where joint learners won."},{"sec":23,"q":"Rec 3: ten apartment listings, train on 5. How many 5-listing training sets exist, and how far does the LS slope range across them?","o":["120; from 2.22 to 2.61 per sq ft","252; from 2.50 to 2.61 per sq ft","1,024; from 1.50 to 3.65 per sq ft","252; from 1.50 to 3.65 per sq ft"],"a":3,"x":"$\\binom{10}{5}=252$. That slope range flips the 1,300 sq ft verdict from overpriced to a deal."},{"sec":23,"q":"Rec 3 grades each line by the sum of its 5 largest absolute residuals. Which scores best?","o":["LS on all ten, $1442+2.61x$: 1,338","The fit to the hardest split, $1860+2.37x$: 2,154","Stable regression $1500+2.50x$: 1,300","The best of all 252 split fits: 1,304"],"a":2,"x":"Stable regression minimizes exactly this score (LP optimum 1,300, $\\theta=200$). LS and even the best split fit do worse."},{"sec":23,"q":"Why is stable regression not the same as 'train on the hardest split'?","o":["It is the same; stable regression just finds the hardest split faster by LP","Each split's fit suits its five points; stable bounds the error on any five","Stable regression averages the fitted lines over all 252 possible splits","Stable regression trains on the easiest split, which has the least noise"],"a":1,"x":"The hardest split's own fit scores 2,154 on its worst five; the stable line scores 1,300 on any five. Averaging over splits is cross-validation's view."},{"sec":23,"q":"At an unregularized stable-regression optimum, why are the worst-$k$ points balanced above and below the line?","o":["Subgradient in $\\beta_0$: (#below − #above) in the worst set must contain 0","Because the residuals of any fitted line always sum to zero","Because the dual variable $\\theta$ equals the median absolute residual","Because the uncertainty set $\\mathcal Z$ is symmetric under flipping signs"],"a":0,"x":"If one side dominated, shifting the intercept toward it would cut the objective (Rec 3 slide 12: two over, two under, a tie at 200). Zero-sum residuals belong to least squares with an intercept, not to this objective."},{"sec":23,"q":"Two luxury units sit far above an otherwise linear trend among ten listings. What do stable regressions with $k=5$ and $k=3$ do (Rec 3 slide 13)?","o":["Both lines are pulled up about as much as the least-squares line","$k=5$: barely moves; $k=3$: the pair is 2 of the worst 3 and lifts it","$k=5$: pulled up by the pair; $k=3$: the line barely moves at all","Neither moves, since stable regression ignores outliers at any $k$"],"a":1,"x":"One-sided outliers move the line only when they are more than half the worst $k$: 2 of 5 can't, 2 of 3 can ($1940+2.60x$). LS is dragged to $1134+3.31x$."},{"sec":23,"q":"What does stable regression reduce to at $k=n$?","o":["Least squares ($\\ell_2$) on all data","Chebyshev ($\\ell_\\infty$) regression on all data","LAD ($\\ell_1$) regression on all data","LMAD (median) regression on all data"],"a":2,"x":"$\\sum z_i=n$ with binary $z$ forces $z=\\mathbf 1$, so the objective is the sum of all absolute residuals. Chebyshev is LQAD with $q=n$."},{"sec":23,"q":"The stable line $1500+2.5x$ has residuals $+60,+300,-80,-300,+200,-200,-250,+250,+100,+200$. What is its worst-$k$ objective for $k=3$?","o":["1,300","800","300","850"],"a":3,"x":"Three largest absolute residuals: $300+300+250=850$. 1,300 is the $k=5$ value; 800 skips the 250s."},{"sec":23,"q":"LS residuals on the Red Line data: $+383,+87,-108,-204,-225,-195,-116,-12,+118,+272$. The diagnosis:","o":["Heteroskedastic noise, so use weighted least squares","Two outliers at the ends, so drop them","The residuals sum to zero, so the linear fit is adequate","A smile: the shape is wrong (convex), not noise"],"a":3,"x":"A smile is systematic misspecification. Chord slopes $-1000,\\dots,-100$ per mile increase, so the data are exactly convex."},{"sec":23,"q":"Red Line rents fall to 2,050 at 5 mi, and the last chord slope is $-100$ per mile. What does convexity imply for a one-bed at 7 mi?","o":["Rent $\\le1{,}850$","Rent $\\ge1{,}850$","Rent $\\approx960$, the LS extrapolation","Rent $\\ge2{,}050$"],"a":1,"x":"Beyond the data a convex curve falls no faster than the last chord: $2050-2\\cdot100=1850$ is a lower bound. A line can't flatten, so LS predicts about 960."},{"sec":23,"q":"You run convex regression on data with a non-convex bump. What happens?","o":["Feasible; the closest convex fit, with the bump shaved flat","The QP becomes infeasible because no convex function fits","The solver drops the bump points from the fit entirely","The fit still interpolates every point, the bump included"],"a":0,"x":"Linear functions are convex, so the feasible set is never empty; $\\theta=y$ just stops being feasible and the error term goes positive."},{"sec":23,"q":"Rec 3 defines inductive bias as","o":["the intercept term $\\beta_0$ that shifts a linear model up or down","the assumption a model uses to fill gaps between data points","the systematic error caused by training on too small a sample","the bias a particular train/test split introduces into the fit"],"a":1,"x":"Line: linear world; tree: flat on boxes; convex regression: each extra mile saves less. Every method has one; pick it on purpose."},{"sec":23,"q":"Rec 3 pairs stable and convex regression with Rec 1 tools. Which pairing is right?","o":["Stable: cutting planes on pairs. Convex: minimax + LP duality","Both: big-M constraints on binary selection variables","Stable: minimax + duality. Convex: max-of-linear + separation oracle","Stable: max-of-linear oracle. Convex: total unimodularity + duality"],"a":2,"x":"Stable regression dualizes the inner top-$k$ max; convex regression writes $f$ as a max of linear pieces and adds violated pairs on demand."},{"sec":23,"q":"Which estimator is LQAD with $q=n$?","o":["LAD, minimizing the sum of absolute residuals","LMAD, minimizing the median absolute residual","Chebyshev ($\\ell_\\infty$): minimize the largest residual","Least squares, minimizing the sum of squared residuals"],"a":2,"x":"$|r_{(n)}|=\\max_i|r_i|$: one outlier controls the fit, the least robust choice. LMAD is $q=\\lceil n/2\\rceil$."},{"sec":23,"q":"You have $n=150$ points and believe up to 45 may be arbitrarily corrupted. Which $q$ should LQAD use?","o":["105","45","75","150"],"a":0,"x":"The band must be able to hold only clean points, so $q\\le150-45=105$; smaller $q$ discards data that may be clean. 75 (LMAD) is needlessly conservative here."},{"sec":23,"q":"Geometrically, $|r_{(q)}|\\le\\gamma$ means:","o":["at least $q$ points lie within $\\gamma$ of the fitted line","at most $q$ points lie within $\\gamma$ of the line","the $q$ largest residuals sum to at most $\\gamma$","every point lies within $\\gamma$ of the line"],"a":0,"x":"LQAD finds the thinnest band holding $q$ points; the other $n-q$ can move anywhere without widening it."},{"sec":23,"q":"In the LQAD MIO ($\\gamma\\ge|r_i|-\\mu_i$, $\\mu_i\\le M(1-z_i)$, $\\sum z_i=q$), what goes wrong if $M$ is below the largest residual at the optimal $\\beta$?","o":["The MIO becomes infeasible because $\\gamma$ has no valid value","Dropped points aren't fully excused, so the MIO solves the wrong problem","The relaxation tightens, so the MIO solves faster with the same answer","Nothing changes except the solve time, which grows"],"a":1,"x":"Too-small $M$ cuts off the true optimum (Rec 2 showed the failure). Too-large $M$ only weakens the relaxation."},{"sec":23,"q":"Rec 4's warm start for LQAD writes $|r_{(q)}|$ as:","o":["top-$(n-q+1)$ sum − top-$(n-q)$ sum; linearize the second, solve LPs","(sum of the $q$ smallest $|r_i|$) − (sum of the $q-1$ smallest), one QP","the median of $|r_i|$ scaled by $q/n$, minimized by gradient descent","the largest residual after deleting $q$ points, found by enumeration"],"a":0,"x":"Both sums of largest absolute residuals are convex; linearizing the subtracted one gives an LP whose solution can only improve the objective."},{"sec":23,"q":"Logistic margins $m=(2.0,\\ 0.5,\\ -1.0,\\ 3.0)$ for four points. An adversary flips $\\Gamma=2$ labels to minimize the log-likelihood. Which points, and how much does the log-likelihood drop?","o":["Points 4 and 1; it drops by 2.5","Points 3 and 2; it drops by 0.5","Points 3 and 4; it drops by 2.0","Points 4 and 1; it drops by 5.0"],"a":3,"x":"Flipping $i$ changes the log-likelihood by $c_i=-m_i$, so the adversary flips the largest margins: $-(3.0+2.0)=-5.0$. Flipping a misclassified point ($m<0$) would raise the likelihood."},{"sec":23,"q":"Holistic regression with interaction $x_1x_2$ (binary $z_{12}$): which constraints let the interaction enter only if both parents are selected?","o":["$z_{12}\\ge z_1+z_2-1$","$z_{12}=z_1$ and $z_{12}=z_2$","$z_{12}\\le z_1$ and $z_{12}\\le z_2$","$z_{12}\\le z_1+z_2$ and $z_{12}\\le1$"],"a":2,"x":"Interaction ⇒ both parents. $z_{12}\\ge z_1+z_2-1$ is the converse; equality drags the interaction in with its parents; $z_{12}\\le z_1+z_2$ allows it with just one parent."},{"sec":23,"q":"High-correlation pairs $HC=\\{(1,2),(1,3),(1,4),(1,5)\\}$ (variable 1 correlated with all others, no other pairs). What is $k_{\\max}$?","o":["1","2","5","4"],"a":3,"x":"$k_{\\max}$ is a maximum independent set of the HC graph, here a star: $\\{2,3,4,5\\}$ has no edges. Including variable 1 allows only $\\{1\\}$."},{"sec":24,"q":"Holistic regression's $z_{12}\\le z_1$ (an interaction needs its parent) has a direct structural analog in the OCT MIO. Which?","o":["$\\sum_ja_{jt}=d_t$: one split feature per active branch node","$\\sum_kc_{kt}=l_t$: one label per used leaf","$d_t\\le d_{p(t)}$: a node splits only if its parent splits","$\\sum_tz_{it}=1$: each point lands in one leaf"],"a":2,"x":"Both are child ⇒ parent implications written as child $\\le$ parent on binaries. The others are assignment constraints."},{"sec":24,"q":"Which list pairs each greedy method with the global-optimization counterpart the course presented?","o":["Lasso → OCT; CART → holistic regression; regress-and-compare → Optimal Policy Trees","Stepwise/Lasso → best subset; CART → OCT; `policytree` → Optimal Policy Trees","Random forest → OCT; boosting → OCT-H; causal forest → Optimal Policy Trees","Ridge → Lasso; CART → random forest; direct method → doubly robust estimation"],"a":1,"x":"Each pair keeps the objective and replaces greedy construction with MIO or strong local search. Ensembles and estimator upgrades aren't greedy-vs-global pairs."},{"sec":24,"q":"CART warm-starts the OCT MIO. Which earlier method uses the same 'fast heuristic, then MIO certifies' pattern?","o":["LQAD: subgradient and DC/LP steps warm-start its MIO","Ridge regression: closed-form solution, then MIO","Convex regression: cutting planes first, then an MIO","Stable regression: LP dual first, then an MIO"],"a":0,"x":"Rec 4: 'heuristic for a good solution fast, MIO to certify it. We will use it again for trees.' Convex and stable regression are solved exactly as a QP/LP, with no MIO."},{"sec":24,"q":"Which three course metrics share the 'fraction of the gap closed relative to a data-poor baseline' structure?","o":["$R^2$, OCT's error over $\\hat L$, and $P$","RMSE, condition number, and $P$","$R^2$, mean regret, and the propensity score","Accuracy, AUC, and the coefficient of variation"],"a":0,"x":"$R^2$ is measured against the sample mean, OCT's normalized error against the no-split tree's $\\hat L$, and $P$ against the SAA decision: each is the gap closed versus a no-features baseline."},{"sec":24,"q":"Trees play three roles in Lec 9–11. Which list is right?","o":["Predictor; propensity estimator; cutting-plane separation oracle","Feature selector; kernel bandwidth rule; warm start for the LQAD MIO","Predictor; reward estimator; baseline for the SAA decision","Predictor (OCT); binning rule for weights (Lec 10); policy (Lec 11)"],"a":3,"x":"Same partition, different use of the leaves: a label or value, a set of relevant past scenarios, or one treatment."},{"sec":24,"q":"Lec 11 says policy trees 'robustify against noise in outcomes' compared with regress-and-compare. Which earlier course idea is closest?","o":["Totally unimodular constraints give integral LP relaxation solutions","Big-M constraints linking support binaries to coefficients","Restricting structure regularizes, which buys robustness (Lec 2)","The pointwise max of linear functions is always convex (Rec 1)"],"a":2,"x":"Forcing similar observations to share a treatment limits how much noise in single rewards can move the policy, the regularization-for-robustness tradeoff."},{"sec":24,"q":"Cross-fitting (Lec 11) and cross-validation both split data into $k$ folds. How do their purposes differ?","o":["Cross-fitting selects tree depth; cross-validation estimates propensities","Cross-fitting: honest plug-in predictions. CV: hyperparameter choice","They are the same procedure under two different names","Cross-fitting uses the test set; cross-validation never touches it"],"a":1,"x":"Cross-fitting's output is the rewards themselves, built from models that never saw the row they predict."},{"sec":24,"q":"Lec 10's weighted SAA stays convex for kNN, CART and RF weights. Which basic fact from Rec 1 is used?","o":["The maximum of convex functions is concave","An LP with a totally unimodular matrix has integral vertices","A nonnegative combination of convex functions is convex","Strong duality holds for every convex problem"],"a":2,"x":"$\\sum_iw^ic(z;y^i)$ with $w^i\\ge0$ is convex if each term is. The max of convex functions is convex, not concave."},{"sec":24,"q":"The shipment cost contains $\\min_{t,s}(\\cdots)$, the optimal value of a recourse LP with $z$ in the right-hand side. Why is that term convex in $z$?","o":["Minimizing over $t,s$ always yields a concave function of $z$","By duality, a max over dual vertices of functions linear in $z$","Its constraint matrix is totally unimodular","Nonnegative $c_{ij}$ make it linear in $z$"],"a":1,"x":"The dual turns it into max-of-linear, the pattern from convex regression and robust counterparts (derived). A partial min of a jointly convex function is convex, not concave."},{"sec":24,"q":"Why do CART/RF prescriptions survive uninformative covariates while kNN degrades? Which earlier course theme explains it?","o":["Trees are robust to label flips, like robust logistic regression","Trees minimize a convex loss, unlike kNN's nonconvex one","Trees do implicit feature selection, like sparse regression","Trees use larger effective training sets than kNN does"],"a":2,"x":"kNN distances weigh every dimension equally; trees split only on informative features, much like a sparse support."},{"sec":24,"q":"At scale, OCT replaces the MIO with local search. What is given up?","o":["Interpretability of the final tree, which becomes an ensemble","The MIO's optimality certificate (lower bound)","The ability to optimize the same objective as the MIO","Axis-parallel splits, which local search can't handle"],"a":1,"x":"Local search optimizes the same objective and still yields one tree, but can't prove no better tree exists; the MIO remains the certificate on small instances."},{"sec":24,"q":"What separates Lec 11's setting from Lec 10's and forces counterfactual estimation?","o":["Lec 11 has continuous decisions while Lec 10 has discrete ones","Lec 10 uses observational data while Lec 11 uses experiments","Lec 11 ignores the covariates, so it cannot weight past scenarios","In Lec 11 the decision changes the outcome; in Lec 10 it doesn't"],"a":3,"x":"Past demands are valid scenarios for any order $z$. A patient's outcome depends on the treatment received, so unobserved arms must be estimated."},{"sec":24,"q":"Robust SAA (Bertsimas, Gupta, Kallus), mentioned in Lec 10, connects to which earlier course idea?","o":["Sparse regression: limit how many decision components are nonzero","Robust optimization over an uncertainty set around the data (Lec 2)","Convex regression: impose a convex shape on the decision rule $z(x)$","Cross-validation: average the SAA decision over random data splits"],"a":1,"x":"Robust SAA guards the empirical distribution against sampling error, as Lec 2 guards $\\beta$ against perturbations of $X$. Like SAA, it still ignores covariates."},{"sec":24,"q":"For a cost convex in $y$, $c(z;\\mathbb E[Y\\mid x])\\le\\mathbb E[c(z;Y)\\mid x]$. What does this imply for point-prediction-driven decisions?","o":["They underestimate their own decision's expected cost (Jensen)","They overestimate their own cost, so they systematically over-hedge","Their cost estimates are unbiased, since $\\hat m$ is unbiased","They are optimal whenever $c$ is convex in both $z$ and $y$"],"a":0,"x":"Plugging in the mean ignores spread, so a convex cost looks cheaper than it is and the decision under-hedges, as in the shipment example (derived)."},{"sec":24,"q":"Holistic regression's $-Mz_i\\le\\beta_i\\le Mz_i$, LQAD's $\\mu_i\\le M(1-z_i)$ and OCT's routing constraints share which modeling risk?","o":["$M$ too large makes the problem infeasible; too small slows it","$M$ must equal the number of data points for validity","$M$ affects only interpretability, never the optimal solution","$M$ too small cuts off the true optimum; $M$ too large weakens the relaxation"],"a":3,"x":"A valid $M$ must bound the quantity at the optimum (Rec 2 showed the LQAD failure); an oversized $M$ slows the solver."},{"sec":24,"q":"Once a policy tree's splits are fixed, the best treatment in each leaf is found by","o":["solving a small MIO in each leaf over the treatments","a per-row argmax within the leaf, then a majority vote","choosing the treatment with the best propensity-weighted median","an argmax of summed rewards in the leaf, like OCT's majority label"],"a":3,"x":"With fixed splits the objective separates by leaf; each leaf picks its best column sum, the reward-weighted analog of majority labeling."},{"sec":24,"q":"Which Lec 11 extension faces the same data issue as Lec 10's sold-out titles?","o":["Numeric treatments, which need a proximity kernel","Binary outcomes, which need a classifier","Survival outcomes, which are right-censored","Cross-fitting, which needs folds"],"a":2,"x":"Both observe a lower bound instead of the value: demand $\\ge V$ when sold out, survival time $\\ge$ censoring time."},{"sec":24,"q":"Why does Lec 11 recommend a 50/50 train/test split, unlike holistic regression's 50/25/25?","o":["The test set needs enough data for its own reward estimation","Policy trees have no hyperparameters that need validation","Propensity models overfit when given more training data","Optimal Policy Trees require balanced treatment arms"],"a":0,"x":"Evaluation needs counterfactuals on test data, estimated from test data alone, and that estimation needs a large test set."},{"sec":24,"q":"Rec 3 fits a classification tree on stable regression's $z^*$; Lec 11 fits a tree on estimated rewards $\\Gamma$. What idea do they share?","o":["Both trees must be grown greedily, never with Optimal Trees","Both trees predict the raw outcome $y$ from the features","Both trees require IPW weights computed from propensities","A tree fit to derived targets ($z^*$, $\\Gamma$) for interpretability"],"a":3,"x":"$z^*$ (hard-or-not labels) and $\\Gamma$ (completed rewards) are derived targets; the tree explains who is hard or who gets which treatment."},{"sec":24,"q":"Which two course metrics can be negative when computed out of sample?","o":["$R^2$ and $P$","Accuracy and AUC","Mean regret and condition number","$P$ and the propensity score"],"a":0,"x":"Both measure improvement over a baseline (sample mean, SAA decision); a model worse than the baseline on new data scores below zero."}],"wr":[{"sec":1,"q":"Explain the difference between theoretical tractability and practical tractability (practability), and give two examples from the course showing why the distinction matters.","m":"Theoretical tractability means polynomial-time solvability in the input size (class P); NP-hard problems are deemed intractable. Practability means a problem can be solved in the times and sizes its application requires. The two diverge: the simplex method has exponential worst cases yet solves LPs with millions of variables, and the NP-hard TSP is solved at a million cities in minutes. Practability is application-dependent: online trading needs milliseconds for 500–1,000 securities, while a planning regression can take hours.","k":["Theoretical: polynomial time / P vs NP-hard","Practable: solvable in time and size the application needs","Simplex counterexample","TSP counterexample","Application-dependent time budgets (e.g. trading vs. planning)"],"x":"The course uses this distinction to justify MIO: NP-hardness of best subset or optimal trees does not make them impractical at real sizes."},{"sec":1,"q":"Why does the course argue that the ML community's view of MIO as intractable is outdated? Use the speedup figures.","m":"The belief formed in the 1970s–90s when MIO could only handle small instances. Since then, solver software improved about 4.7 million× (CPLEX 1.2 to 11 alone was 29,000×; Gurobi 1.0 to 9.0 was 160×) and hardware about 8 million×, a combined ~37.6 trillion×. A MIO that took 1.2 million years 25 years ago now solves in under a second, so problems once dismissed are now solvable and certifiable at practical sizes.","k":["Belief formed when MIO only solved small instances","Software speedup ~4.7M×","Hardware speedup ~8M×","Combined ~37.6 trillion×","Belief never updated"],"x":"The key reasoning is multiplicative: algorithmic and hardware gains compound."},{"sec":1,"q":"Write the general forms of MIO, SDO and SOCP, and state the special cases under which SDO and SOCP reduce to LO.","m":"MIO: $\\max c^\\top x + h^\\top y$ s.t. $Ax + By \\le b$, $x \\in \\mathbb{Z}_+^n$, $y \\in \\mathbb{R}_+^m$. SDO: $\\min \\langle C, X\\rangle$ s.t. $\\langle A_i, X\\rangle \\ge b_i$, $X \\succeq 0$; it reduces to LO when $X$ is diagonal. SOCP: $\\min c^\\top x$ s.t. $\\|A_i x + b_i\\|_2 \\le f_i^\\top x + d_i$, $Dx = b$; it reduces to LO when all $A_i = 0$ and to a convex QCQP when all $f_i = 0$.","k":["MIO form with integer and continuous variables","SDO form with PSD constraint","SDO→LO when X diagonal","SOCP form","SOCP→LO when A_i = 0","SOCP→QCQP when f_i = 0"],"x":"Knowing these reductions helps you recognize which solver class a reformulated ML problem falls into."},{"sec":1,"q":"List and briefly explain at least five of the course's philosophical principles.","m":"(1) Interpretability: decision-makers need to understand models (sparsity, trees). (2) The ML–optimization link: formulating ML problems as optimization gives better methods. (3) Robustness over optimality: prefer solutions that survive data errors. (4) Optimization over randomization: optimal trees vs. random forests, optimized splits. (5) Practability: judge methods by real-world solvability. (6) Prescriptive methods: aim for decisions, not just predictions. (7) Deep learning and multimodal ML. (8) Debiasing observational data.","k":["Interpretability","ML–optimization link","Robustness over optimality","Optimization vs. randomization","Practability","Prescriptive methods","Deep learning / multimodal","Debiasing observational data"],"x":"Each principle maps to specific lectures, which is a useful way to organize the course."},{"sec":1,"q":"What does it mean for a central ML problem to be \"solved\" in the course's sense, and why don't heuristics like Lasso or CART meet that standard?","m":"A problem is solved when you have an optimal solution together with a certificate (a matching lower bound) for the actual formulation. Heuristics return a solution with no guarantee of optimality for the original problem: Lasso solves a convex relaxation of best subset and CART builds trees greedily. You can't tell how much you are leaving on the table, and the course shows exact solutions often generalize better.","k":["Solved = optimal solution plus certificate/bound","Lasso solves a relaxation, not best subset","CART is greedy","Heuristics give no optimality gap","Exact solutions often perform better out of sample"],"x":"This framing explains why every later lecture pairs a fast heuristic upper bound with an MIO lower bound."},{"sec":2,"q":"Explain how weighting and adding constraints gives an upper bound on an LP maximization, and how this idea leads to the dual problem and strong duality. Use the Rec 1 exam LP.","m":"Multiply each $\\le$ constraint by a nonnegative weight and add them. If the resulting coefficients are at least the objective coefficients (and $x \\ge 0$), the combined right-hand side bounds the objective. In the exam LP, $0.8\\times$ the clock constraint gives $4x_1 + 8x_2 \\le 48 \\Rightarrow$ score $\\le 48$. Choosing the weights to make the bound as small as possible is itself an LP, the dual. The best weights $(0.7, 0.5)$ give exactly 46, the primal optimum; that equality is strong duality, and the weights are shadow prices (0.7 per minute, 0.5 per extra Type 1 question).","k":["Nonnegative weights on constraints","Combined coefficients must dominate objective","Gives an upper bound (weak duality)","Finding best weights is the dual LP","Best bound 46 equals optimum (strong duality)","Weights are shadow prices"],"x":"This bound-building view is the same reasoning used to dualize inner maximizations in stable regression and label-robust logistic regression."},{"sec":2,"q":"Why does big-M choice matter even though any valid $M$ yields a correct model? What goes wrong if $M$ is too large, and (from Rec 2) what if it is too small?","m":"A solver relaxes binaries to $[0,1]$ to compute bounds. With a large $M$, a tiny fractional $z = x/M$ permits a large $x$ at almost no cost, so the relaxation is weak, lower bounds are loose, and branch-and-bound explodes. If $M$ is smaller than the true optimal magnitude, the model silently becomes a different problem (it forbids the true optimum) and the solver reports a suboptimal solution as optimal, with no warning, since a feasible point like $\\beta = 0$ still exists.","k":["Solvers relax binaries","Large M weakens the LP relaxation","Loose bounds slow branch-and-bound","Too-small M cuts off the true optimum","Solver reports suboptimal as optimal without warning"],"x":"Choose the tightest bound the problem structure gives you, or compute one (e.g. by solving bounding convex problems as in Ch. 3)."},{"sec":2,"q":"Write linear constraints for: (a) \"day 3 if and only if day 1 or day 2\"; (b) \"day 3 if and only if days 1 and 2\"; (c) \"if at least $k$ of $z_1,\\dots,z_n$ are 1 then $y = 1$\". Explain why each works.","m":"(a) $z_3 \\le z_1 + z_2$ and $z_3 \\ge (z_1+z_2)/2$: if either is 1, $z_3$ must be 1; if neither, $z_3 \\le 0$. (b) $z_3 \\le (z_1+z_2)/2$ (or $z_3 \\le z_1$, $z_3 \\le z_2$) and $z_3 \\ge z_1 + z_2 - 1$: this makes $z_3 = z_1 z_2$. (c) $(z_1 + \\dots + z_n - (k-1))/n \\le y$: when $k$ or more are 1 the left side is positive, forcing binary $y = 1$; otherwise it is $\\le 0$ and $y$ is free.","k":["(a) upper bound z3 ≤ z1+z2 and lower bound (z1+z2)/2","(b) product linearization with z3 ≥ z1+z2−1","(c) counting constraint divided by n","Binary values make fractional bounds force 0/1"],"x":"These patterns recur in holistic regression (group and collinearity logic) and in any MIO with if-then structure."},{"sec":2,"q":"Show how to linearize (i) $\\min \\max_j f_j(x)$, (ii) $\\min \\sum_j |y_j|$, and (iii) the constraint $|f(x)| \\le g(x)$. When does the absolute-value trick fail?","m":"(i) $\\min t$ s.t. $t \\ge f_j(x)\\ \\forall j$. (ii) $\\min \\sum_j t_j$ s.t. $t_j \\ge y_j$, $t_j \\ge -y_j$. (iii) $f(x) \\le g(x)$ and $-f(x) \\le g(x)$. The trick fails when the absolute value must be large: maximizing $|y|$ or requiring $|y| \\ge c$, since nothing pushes $t$ down to $|y|$ and the feasible set is nonconvex. That needs binaries to select the sign.","k":["Epigraph variable for max","Two inequalities per absolute value","Minimization squeezes t to |y|","Constraint version needs no new variable","Fails for maximizing |y| or |y| ≥ c (nonconvex)"],"x":"The same mechanics underlie $\\ell_1$ and $\\ell_\\infty$ penalties in HW1 and the significance constraints in holistic regression."},{"sec":2,"q":"State weak duality, strong duality, and the minimax consequence, and explain why the minimax exchange matters for robust ML formulations.","m":"Weak: for a min primal, any dual feasible $p$ satisfies $p^\\top b \\le c^\\top x$ for any primal feasible $x$. Strong: if the primal LP has an optimum, so does the dual with equal value. Minimax: under strong duality, $\\min_x\\max_y f = \\max_y\\min_x f$. Robust formulations have an inner max over an uncertainty set; replacing it with its dual (a min) turns the min–max into a single min problem, as in stable regression and label-robust logistic regression.","k":["Weak duality inequality","Strong duality equal optimal values","Minimax exchange requires convexity","Inner max replaced by dual min","Gives single-level tractable problem"],"x":"With integer inner problems the exchange fails, which is why the course first shows the inner polytope has integral vertices before dualizing."},{"sec":3,"q":"State and prove (both directions) the equivalence $\\max_{\\Delta\\in\\mathcal U_{(r,q)}}\\|y - (X+\\Delta)\\beta\\|_q = \\|y - X\\beta\\|_q + \\rho\\|\\beta\\|_r$.","m":"Let $r_0 = y - X\\beta$. (≤) For any $\\Delta$ in the set, $\\|r_0 - \\Delta\\beta\\|_q \\le \\|r_0\\|_q + \\|\\Delta\\beta\\|_q \\le \\|r_0\\|_q + \\|\\Delta\\|_{(r,q)}\\|\\beta\\|_r \\le \\|r_0\\|_q + \\rho\\|\\beta\\|_r$. (≥) Let $u = r_0/\\|r_0\\|_q$ (any unit vector if $r_0 = 0$) and $v$ with $\\|v\\|_{r^*} = 1$, $v^\\top\\beta = \\|\\beta\\|_r$. Take $\\Delta_0 = -\\rho uv^\\top$. Then $\\|\\Delta_0x\\|_q = \\rho|v^\\top x| \\le \\rho\\|x\\|_r$, so $\\Delta_0$ is feasible, and $r_0 - \\Delta_0\\beta = r_0 + \\rho\\|\\beta\\|_r u$, whose norm is $\\|r_0\\|_q + \\rho\\|\\beta\\|_r$.","k":["Triangle inequality for upper bound","Induced-norm bound ||Δβ|| ≤ ρ||β||_r","Rank-one witness Δ0 = −ρ u vᵀ","v is the dual-norm maximizer","Check Δ0 is in the set","Witness attains the bound"],"x":"The two directions have different characters: $\\le$ is universal over the set, $\\ge$ needs one constructed witness."},{"sec":3,"q":"Explain the robustness interpretations of ridge and Lasso: which uncertainty sets produce them, what kind of data errors each set describes, and why the distinction matters in practice.","m":"Ridge comes from the Frobenius ball $\\|\\Delta\\|_{F_2} \\le \\rho$ with $\\ell_2$ loss: one shared error budget across all entries, appropriate for diffuse noise like rounding or a slightly miscalibrated instrument. Lasso comes from $\\mathcal U_{(1,2)}$, i.e. each column (feature) has $\\|\\Delta_j\\|_2 \\le \\rho$: every feature can be wrong simultaneously, appropriate when features come from separate sources. Choosing the penalty is therefore a statement about how your data is corrupted, and it explains why Lasso generalizes well (robustness), independent of its sparsity.","k":["Ridge ↔ Frobenius ball, global shared budget","Lasso ↔ U(1,2), per-column budget","Diffuse noise vs. per-feature errors","Penalty choice encodes belief about errors","Lasso's success attributed to robustness"],"x":"Rec 2's poll about 50 scraped features is exactly this distinction."},{"sec":3,"q":"Prove that $\\mathcal U_{(1,2)} = \\{\\Delta : \\|\\Delta_j\\|_2 \\le \\rho\\ \\forall j\\}$.","m":"(⊆) If $\\|\\Delta\\|_{(1,2)} \\le \\rho$, take $x = e_j$: $\\|\\Delta_j\\|_2 = \\|\\Delta e_j\\|_2 \\le \\rho\\|e_j\\|_1 = \\rho$. (⊇) If every column satisfies $\\|\\Delta_j\\|_2 \\le \\rho$, then for any $\\beta$, $\\|\\Delta\\beta\\|_2 = \\|\\sum_j\\beta_j\\Delta_j\\|_2 \\le \\sum_j|\\beta_j|\\|\\Delta_j\\|_2 \\le \\rho\\|\\beta\\|_1$, so $\\|\\Delta\\|_{(1,2)} \\le \\rho$.","k":["Test with standard basis vectors e_j","Gives column bound","Write Δβ as sum of columns","Triangle inequality","Get ρ||β||_1, so induced norm ≤ ρ"],"x":"Geometrically, the $\\ell_1$ ball's vertices are $\\pm e_j$, and a convex function's max over a polytope is at a vertex."},{"sec":3,"q":"Compare averaged uncertainty and worst-case uncertainty in regression. What does each yield, and what does the comparison tell you about regularization?","m":"Averaging the squared loss over a uniform draw from the box, diamond, ellipsoidal or budget set gives $\\|y - X\\beta\\|_2^2 + f(n,k,\\rho)\\|\\beta\\|_2^2$: ridge, with only the constant depending on the set. Worst-case (robust) uncertainty gives a penalty whose norm depends on the set: Frobenius sets give $\\|\\beta\\|_{q^*}$ and induced sets give $\\|\\beta\\|_r$ (ridge, Lasso and others). Regularization therefore arises naturally from accounting for data uncertainty, and the worst-case view gives more control over which penalty arises.","k":["Averaged → ridge for all four sets","Only constant f(n,k,ρ) changes","Worst-case → set-dependent norm","Frobenius gives dual norm, induced gives r-norm","Regularization = accounting for uncertainty"],"x":"The averaging result is the course's first hint that regularization is about data uncertainty, not just a prior on coefficients."},{"sec":3,"q":"In HW1, the box set $\\mathcal A$ gives an $\\ell_1$ penalty and the row-budget set $\\mathcal B$ gives an $\\ell_\\infty$ penalty. Explain both the adversary story and the effect each penalty has on the fitted coefficients.","m":"Box: each entry can be off by $\\lambda$ independently, so the adversary signs each error to match $\\beta_j$, and the damage sums over features: $\\lambda\\|\\beta\\|_1$. Row budget: each listing has a total $\\ell_1$ distortion budget and spends it all on the feature with the largest $|\\beta_j|$, giving $\\rho\\|\\beta\\|_\\infty$. Effects: $\\ell_1$ charges a flat price per unit of every coefficient, shrinking all and zeroing weak ones (sparsity). $\\ell_\\infty$ charges only the largest, so shrinking others saves nothing; coefficients tie at a common ceiling (beds = laundry = $w$ in the B-only run) and there is no sparsity pressure.","k":["Box adversary hits every feature → ℓ1","Row-budget adversary concentrates on largest coefficient → ℓ∞","ℓ1 flat marginal price → zeros","ℓ∞ prices only the max → ties at ceiling","No sparsity from ℓ∞"],"x":"The marginal-price reasoning (\"what does shrinking one unit save?\") is the reliable way to predict a penalty's effect."},{"sec":3,"q":"(Book) When is robustness not equivalent to regularization? Give the characterization for the Frobenius case and the example with $\\ell_2$ loss.","m":"For $\\ell_r$ loss with an $F_q$ ball, Theorem 2.4 gives $\\max_\\Delta\\|z + \\Delta\\beta\\|_r \\le \\|z\\|_r + \\lambda\\delta_n(r,q)\\|\\beta\\|_{q^*}$, with equality for all $(z,\\beta)$ only when $r = q$ or $r \\in \\{1, \\infty\\}$. For $r \\in (1,\\infty)$, $r \\ne q$, the inequality is strict for almost all $z$, and regularization only gives upper and lower bounds. Example: $\\ell_2$ loss with a box ($q = \\infty$): $\\min\\|y - X\\beta\\|_2 + \\lambda\\|\\beta\\|_1 \\le$ robust $\\le \\min\\|y - X\\beta\\|_2 + \\lambda\\sqrt n\\|\\beta\\|_1$. When not equivalent, the robust and regularized solutions (and their paths) can differ.","k":["Equivalence only for r = q or r ∈ {1,∞}","Otherwise only bounds","Discrepancy factor δ_n","Example ℓ2 loss with box: √n gap","Different optimal solutions possible"],"x":"The practical upshot: the regularization parameter is no longer the uncertainty radius once equivalence fails."},{"sec":4,"q":"Derive the binary convex reformulation of sparse regression $\\min \\tfrac12\\|y - X\\beta\\|_2^2 + \\tfrac1{2\\gamma}\\|\\beta\\|_2^2$ s.t. $\\|\\beta\\|_0 \\le k$, and explain why it is preferable to the big-M MIO.","m":"Introduce $s \\in S_k = \\{s\\in\\{0,1\\}^p : e^\\top s \\le k\\}$ and $S = \\mathrm{Diag}(s)$, replacing $\\beta$ by $S\\beta$. For fixed $s$, minimize $\\tfrac12\\|y - XS\\beta\\|^2 + \\tfrac1{2\\gamma}\\|\\beta\\|^2$ over $\\beta$: setting the gradient to zero gives $\\beta^*(s) = (I_p/\\gamma + SX^\\top XS)^{-1}SX^\\top y$. Substituting and applying the matrix inversion lemma gives $c(s) = \\tfrac12 y^\\top(I_n + \\gamma\\sum_j s_jK_j)^{-1}y$ with $K_j = X_jX_j^\\top$. So the problem is $\\min_{s\\in S_k} c(s)$, convex in $s$. It needs no big-M, avoids the weak relaxation, and depends on $X$ via $n\\times n$ kernels.","k":["S = Diag(s), β → Sβ","Inner ridge problem has closed form","Matrix inversion lemma","c(s) = ½ yᵀ(I + γΣ s_j K_j)⁻¹ y","Convex in s","No big-M, no weak relaxation"],"x":"This is the foundation for the cutting-plane method; the same idea extends to sparse classification and sparse convex regression."},{"sec":4,"q":"Describe the outer approximation (cutting-plane) algorithm for $\\min_{s\\in S_k} c(s)$. Why does it give exact solutions, and how is it implemented efficiently?","m":"Start from a support $s_1$ (e.g. from a warm start). At each iteration solve the MIO $\\min\\eta$ s.t. $\\eta \\ge c(s_i) + \\nabla c(s_i)^\\top(s - s_i)$ for all evaluated points $s_i$, $s \\in S_k$. Evaluate $c$ and $\\nabla c$ at the new $s$ and add the cut. Stop when $\\eta = c(s_t)$. Since $c$ is convex, cuts underestimate it, so $\\eta$ is a lower bound; termination with $\\eta = c(s_t)$ proves optimality, and finiteness of $S_k$ guarantees termination. Efficiency: lazy constraints add cuts inside one branch-and-bound tree, and cuts can be computed in $O(k^3 + nk)$.","k":["Piecewise-linear lower bound from tangent cuts","Minimize η over S_k","Evaluate c and gradient at new s","Stop when η = c(s_t)","Convexity → valid lower bound","Finite termination","Lazy constraints / single tree"],"x":"In practice, especially above the phase-transition threshold, very few cuts are needed."},{"sec":4,"q":"Explain the discrete first-order method for sparse regression: its derivation, update rule, and role in the overall MIO strategy.","m":"With $g(\\beta) = \\tfrac12\\|y - X\\beta\\|^2 + \\tfrac1{2\\gamma}\\|\\beta\\|^2$, $\\nabla g$ is $\\ell$-Lipschitz, so for $L \\ge \\ell$, $g(\\beta) \\le g(\\beta_0) + \\nabla g(\\beta_0)^\\top(\\beta - \\beta_0) + \\tfrac L2\\|\\beta - \\beta_0\\|^2$. Minimizing this upper bound subject to $\\|\\beta\\|_0 \\le k$ is, after completing the square, $\\min\\|\\beta - u\\|^2$ s.t. $\\|\\beta\\|_0 \\le k$ with $u = \\beta_0 - \\nabla g(\\beta_0)/L$, solved by hard thresholding $H_k(u)$. Iterate $\\beta_{m+1} = H_k(\\beta_m - \\nabla g(\\beta_m)/L)$ until progress stalls. It converges to a stationary point in $O(1/\\varepsilon)$ iterations and gives high-quality warm starts; the MIO then mainly certifies optimality.","k":["Lipschitz gradient → quadratic upper bound","Complete the square","Hard thresholding H_k solves the subproblem","Iterate projected gradient","Converges to stationary point","Used as warm start for MIO"],"x":"Warm starts matter: in the diabetes table, the warm-started MIO reached and proved the optimum while the cold start hit the time limit."},{"sec":4,"q":"Discuss the phase-transition results for exact sparse regression vs. Lasso and the course's \"remark on complexity\".","m":"As $n$ grows, exact sparse regression shows three simultaneous transitions: accuracy jumps to 100%, false discovery drops to 0%, and solve time collapses (often one cut). Exact needs fewer samples than Lasso (book: ~125 vs ~180 for $p=2000$, $k=10$; Lasso theory $(2k+\\sigma^2)\\log(p-k) = 152$). The governing quantity is $n/k$, with logarithmic dependence on $p$ and later transitions under more noise. Lasso keeps many false features even when accurate. The remark: unlike classical complexity intuition, more data makes this NP-hard problem easier and its solution more correct; with too little data it is slow and doesn't recover the truth anyway.","k":["Accuracy, false-discovery and time transitions coincide","Exact needs fewer samples than Lasso","n/k governs, log p dependence","Lasso has high false discovery","More data → easier problem"],"x":"This is the strongest empirical argument in Lec 3 for replacing Lasso with exact methods."},{"sec":5,"q":"Derive the single-level stable regression formulation starting from $\\min_\\beta\\max_{z\\in\\mathcal Z}\\sum_i z_i|y_i - x_i^\\top\\beta| + \\lambda\\sum_j\\Gamma(\\beta_j)$.","m":"For fixed $\\beta$, the inner objective is linear in $z$, so the max over $\\mathcal Z$ equals the max over $\\mathrm{conv}(\\mathcal Z) = \\{\\sum z_i = k, 0 \\le z_i \\le 1\\}$, whose vertices are binary. Its LP dual (multiplier $\\theta$ free on the equality, $u_i \\ge 0$ on $z_i \\le 1$) is $\\min k\\theta + \\sum u_i$ s.t. $\\theta + u_i \\ge |y_i - x_i^\\top\\beta|$, $u_i \\ge 0$, with equal value by strong duality. Substituting and merging the mins: $\\min_{\\beta,\\theta,u} k\\theta + \\sum_i u_i + \\lambda\\sum_j\\Gamma(\\beta_j)$ s.t. $\\theta + u_i \\ge \\pm(y_i - x_i^\\top\\beta)$, $u_i \\ge 0$. This is an LP for Lasso and a convex QP for ridge.","k":["Inner objective linear in z","Convex hull has binary vertices","LP dual with θ and u_i","Strong duality","Merge min–min","± split for absolute value","LP / QP result"],"x":"The same relax-then-dualize recipe appears in label-robust logistic regression and in the SLO step of median regression."},{"sec":5,"q":"Interpret the dual variables $\\theta$ and $u_i$ in stable regression and explain why $k\\theta + \\sum_i u_i$ equals the sum of the $k$ largest residuals.","m":"$\\theta$ acts as a threshold and $u_i = \\max(r_i - \\theta, 0)$ as the excess of residual $i$ above it. If $\\theta$ is set to the $k$-th largest residual, exactly the top-$k$ residuals (at most) have positive excess, and $k\\theta + \\sum u_i = \\sum_{\\text{top }k}(\\theta + (r_i - \\theta)) = $ sum of top-$k$ residuals. Any other $\\theta$ gives a larger value, so the minimum equals the top-$k$ sum, matching the primal by strong duality.","k":["θ = threshold (k-th largest residual)","u_i = excess above threshold","Only top-k have positive u_i","Sum reconstructs top-k residuals","Matches primal by duality"],"x":"Being able to explain a dual this way is a good check that you didn't flip signs."},{"sec":5,"q":"What problem does stable regression solve, what are its empirical benefits and costs, and how can its output be interpreted?","m":"Standard training depends on a random train/validation split, so coefficients, supports and tuned $\\lambda$ vary with the seed. Stable regression chooses the hardest training set of size $k$ by robust optimization and fits against it, giving robustness to all size-$k$ subpopulations. Empirically: modest accuracy gains (~3–5%), much higher stability of predictions, coefficients and hyperparameters (~20–80%), and better support recovery, at about 2–3× the compute. The hardest set itself can be labeled and explained with an optimal tree, revealing meaningful hard subpopulations (e.g. inconsistent HbA1c histories, ED arrivals on certain game days).","k":["Random splits cause instability","Optimize the training set adversarially","Robust to all size-k subpopulations","Small accuracy gain, large stability gain","Better support recovery","2–3× compute","Interpret hardest set with optimal tree"],"x":"This lecture is the course's clearest case of \"optimization over randomization.\""},{"sec":5,"q":"Explain how the stable regression idea is adapted to time series, and why the resulting problem remains tractable.","m":"Instead of individual points, the adversary selects contiguous segments (anchors followed by consecutive points) for an autoregressive model. The contiguity requirement is moved into the objective as a penalty $-\\lambda\\sum_t|z_{t+1} - z_t|$, the absolute values are linearized with auxiliary variables, and the cardinality constraint is also moved into the objective. The resulting constraint matrix is totally unimodular, so the binary set can be replaced by its convex hull, and the inner LP is dualized into a single robust counterpart. Results on hospital datasets: better accuracy and structural stability, especially with infrequent refitting and in turbulent regimes.","k":["Contiguous segments for time series","Penalize changes in z","Linearize absolute values","Totally unimodular → convex hull exact","Dualize inner LP","Gains largest with rare refits / turbulent periods"],"x":"TU is the general tool that lets more complex binary selection sets be relaxed without loss."},{"sec":6,"q":"Formulate convex regression as a finite-dimensional QP and justify why the pairwise constraints are necessary and sufficient for a convex fit.","m":"$\\min_{\\theta,\\xi}\\tfrac12\\sum_i(y_i - \\theta_i)^2 + \\tfrac1{2\\gamma}\\sum_i\\|\\xi_i\\|^2$ s.t. $\\theta_i + \\xi_i^\\top(x_j - x_i) \\le \\theta_j$ for all $i, j$. Necessary: if $f$ is convex with subgradient $\\xi_i$ at $x_i$, its tangent plane lies below $f$ everywhere, in particular at each $x_j$. Sufficient: given values satisfying the constraints, $f(x) = \\max_i\\{\\theta_i + \\xi_i^\\top(x - x_i)\\}$ is convex (a max of affine functions) and equals $\\theta_i$ at $x_i$ (the $i$-th term gives $\\theta_i$ and the constraints say no other term exceeds it).","k":["QP objective with fit + slope penalty","Pairwise tangent-below constraints","Necessity from subgradient inequality","Sufficiency via max of affine functions","f(x_i) = θ_i because constraints bound other terms"],"x":"This reduction from \"all convex functions\" to finitely many variables is what makes convex regression an optimization problem at all."},{"sec":6,"q":"Describe the cutting-plane / delayed constraint generation algorithm for convex regression, including initialization, separation and termination.","m":"Initialize a reduced master problem with $n$ constraints along a chain: sort points when $p = 1$, or for $p > 1$ link each point to its nearest unused neighbor, closing the chain at the end. Solve the QP to get $(\\hat\\theta, \\hat\\xi)$. For each $i$, compute $j(i) = \\arg\\max_k\\{\\hat\\theta_i - \\hat\\theta_k + \\hat\\xi_i^\\top(x_k - x_i)\\}$; if the violation exceeds $\\varepsilon$, add $\\theta_i + \\xi_i^\\top(x_{j(i)} - x_i) \\le \\theta_{j(i)}$. Re-solve with all constraints so far. Stop when no violation exceeds $\\varepsilon$: the solution then satisfies all $n(n-1)$ constraints and is optimal for the full problem. It converges finitely and scales to $(10^4, 10)$ in minutes and $(10^5, 10^2)$ in hours.","k":["Chain initialization (sorting / nearest neighbors)","Solve reduced QP","Separation: worst overshoot per point","Add violated constraints","Repeat until max violation ≤ ε","Optimal for full problem","Scale figures"],"x":"Separation is a cheap scan; the expensive part, the QP, stays small."},{"sec":7,"q":"Formulate LQAD as an MIO and explain why the optimal $\\gamma$ equals $|r_{(q)}|$.","m":"$\\min\\gamma$ s.t. $r = y - X\\beta$, $\\gamma \\ge |r_i| - \\mu_i$, $M(1 - z_i) \\ge \\mu_i$, $\\sum_i z_i = q$, $\\mu_i \\ge 0$, $z_i\\in\\{0,1\\}$. With $M \\ge \\max|r_i|$, $q$ points have $z_i = 1$ and thus $\\mu_i = 0$, so $\\gamma$ must be at least $q$ of the residuals, i.e. $\\gamma \\ge |r_{(q)}|$ if the $q$ smallest are chosen. The other $n - q$ residuals can be forgiven via $\\mu_i$. Minimizing $\\gamma$ chooses the $q$ smallest residuals and gives $\\gamma^* = |r_{(q)}|$.","k":["Variables β, r, γ, z, μ","γ ≥ |r_i| − μ_i","Big-M ties μ_i = 0 to z_i = 1","Σ z_i = q","q residuals must be covered","Minimization picks smallest q → γ* = |r_(q)|"],"x":"The book's version adds two-sided slack to pin $\\gamma$ from both sides; the logic is the same."},{"sec":7,"q":"Explain the sequential linear optimization (SLO) heuristic for LQAD: the DC decomposition, how each piece is handled, and its convergence.","m":"Write $|r_{(q)}| = H_q(\\beta) - H_{q+1}(\\beta)$ where $H_m(\\beta)$ = sum of the $n - m + 1$ largest absolute residuals. $H_m$ is convex because it equals $\\max_w\\sum_i w_i|r_i|$ over $\\{\\sum w_i = n - m + 1, 0 \\le w \\le 1\\}$. Its LP dual is $\\min\\theta(n - m + 1) + \\sum\\nu_i$ s.t. $\\theta + \\nu_i \\ge |r_i|$, $\\nu \\ge 0$. Each iteration keeps $H_q$ in this dual form and linearizes $
