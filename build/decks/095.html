ssion, the $\\ell_1$ penalty corresponds to robustness against feature perturbations and tends to over-select. Exact sparsity needs $\\|\\beta\\|_0 \\le k$, solved by outer approximation."},{"sec":10,"q":"(Book) In Theorem 6.2, choosing a support $s$ changes the dual of regularized classification by replacing the Gram matrix $XX^\\top$ with:","o":["$X^\\top X$ restricted to the selected rows","$\\sum_j s_jX_jX_j^\\top$","$(I_n + \\gamma\\sum_j s_jX_jX_j^\\top)^{-1}$","$\\mathrm{Diag}(s)\\,X^\\top X\\,\\mathrm{Diag}(s)$"],"a":1,"x":"Only selected columns enter, so $\\alpha^\\top XX^\\top\\alpha$ becomes $\\sum_j s_j\\alpha^\\top X_jX_j^\\top\\alpha$, still $n\\times n$. The inverse $(I_n + \\gamma\\sum s_jK_j)^{-1}$ is the squared-loss closed form, and $SX^\\top XS$ is $p\\times p$."},{"sec":10,"q":"(Book) Why is $c(s) = \\max_{\\alpha: e^\\top\\alpha=0}\\big[-\\sum_i\\hat\\ell(y_i,\\alpha_i) - \\tfrac\\gamma2\\sum_js_j\\alpha^\\top X_jX_j^\\top\\alpha\\big]$ convex in $s$?","o":["The Fenchel conjugate $\\hat\\ell$ is itself convex in $s$","Each $X_jX_j^\\top$ is PSD, so the bracket is convex in $\\alpha$","It is a pointwise max over $\\alpha$ of functions affine in $s$","Any function restricted to binary vectors is convex"],"a":2,"x":"The bracket is linear in $s$ with coefficients $-\\tfrac\\gamma2(\\alpha^\\top X_j)^2$, and maximizing over $\\alpha$ preserves convexity in $s$. PSD-ness makes the bracket concave in $\\alpha$, which concerns the inner max, not convexity in $s$."},{"sec":10,"q":"(Book) In the dual-based method for sparse classification, the dual vector $\\alpha$ solved for at each support $s$ lives in:","o":["$\\mathbb R^p$, one entry per feature","$\\mathbb R^k$, one entry per selected feature","$\\{0,1\\}^p$, like $s$","$\\mathbb R^n$, one entry per data point"],"a":3,"x":"The dual of regularized classification has one variable per sample, and $\\beta^* = -\\gamma X^\\top\\alpha^*$ maps it back to $p$ coefficients. Each evaluation of $c(s)$ is an $n$-dimensional concave maximization; $p$ enters only through the $X_jX_j^\\top$ terms."},{"sec":10,"q":"(Book) At a support $s$ the dual optimum is $\\alpha^* = (0.5, -0.2, -0.3)$, feature column $X_j = (1, 2, -1)$, and $\\gamma = 2$. Then $\\partial c/\\partial s_j$ is:","o":["$-0.16$","$-0.4$","$-0.32$","$+0.16$"],"a":0,"x":"$\\alpha^{*\\top}X_j = 0.5 - 0.4 + 0.3 = 0.4$, so $\\partial c/\\partial s_j = -\\tfrac\\gamma2(0.4)^2 = -0.16$. Forgetting the square gives $-0.4$, dropping the $\\tfrac12$ gives $-0.32$, and the sign is never positive."},{"sec":10,"q":"(Book) A cut from support $\\bar s = (1,1,0,0)$ has $c(\\bar s) = 10$ and $\\nabla c(\\bar s) = (-2,-1,0,-3)$. At the candidate $s = (1,0,0,1)$ the cut imposes $\\eta \\ge$:","o":["12","8","6","10"],"a":1,"x":"$\\eta \\ge c(\\bar s) + \\nabla c(\\bar s)^\\top(s - \\bar s) = 10 + (-1)(-1) + (-3)(1) = 8$. Dropping feature 2 raises the bound by 1 and adding feature 4 lowers it by 3; 6 forgets that dropping a feature adds back $+1$."},{"sec":10,"q":"(Book) The hinge loss conjugate is $\\hat\\ell(y,\\alpha) = y\\alpha$ for $y\\alpha \\in [-1,0]$ and $+\\infty$ otherwise. For $y = 1$, which is correct?","o":["$\\hat\\ell(1,-0.4) = 0.4$ and $\\hat\\ell(1,0.3) = 0.3$","$\\hat\\ell(1,-0.4) = +\\infty$ and $\\hat\\ell(1,0.3) = 0.3$","$\\hat\\ell(1, -0.4) = -0.4$ and $\\hat\\ell(1, 0.3) = +\\infty$","$\\hat\\ell(1,-0.4) = 0$ and $\\hat\\ell(1,0.3) = 0$"],"a":2,"x":"$y\\alpha = -0.4$ is in $[-1,0]$, so $\\hat\\ell = y\\alpha = -0.4$; $y\\alpha = 0.3$ is outside the domain, giving $+\\infty$. In the dual this domain condition becomes the linear constraints $-1 \\le y_i\\alpha_i \\le 0$."},{"sec":10,"q":"(Book) The logistic loss conjugate is $\\hat\\ell(y,\\alpha) = (1+y\\alpha)\\log(1+y\\alpha) - y\\alpha\\log(-y\\alpha)$ for $y\\alpha \\in [-1,0]$. Its value at $y\\alpha = -0.5$ is:","o":["$0$","$+0.693$","$-0.347$","$-0.693$"],"a":3,"x":"Both terms equal $0.5\\log0.5 \\approx -0.347$, so the sum is $\\log 0.5 \\approx -0.693$, the minimum of the conjugate on its domain. $-0.347$ keeps only one term; 0 is the value at $y\\alpha = 0$."},{"sec":10,"q":"(Book) Lung cancer data ($n = 1{,}145$ patients, $p = 14{,}858$ genes): how did exact sparse SVM compare with Lasso SVM?","o":["30 genes vs 172, with AUC 0.975 vs 0.970","172 genes vs 30, with higher AUC for Lasso","30 genes vs 172, with clearly lower AUC (0.90 vs 0.97)","50 genes vs 171, with identical AUC"],"a":0,"x":"Exact sparse SVM used about a sixth of the genes at equal or better AUC. 50 vs 171 is the sparse logistic regression comparison, which had similar accuracy."},{"sec":10,"q":"(Book) Comparing sparse SVM (hinge loss) with sparse logistic regression, the book reports that the hinge version needs:","o":["about 3× more cuts, because hinge is nonsmooth","about 3× fewer cuts","the same number of cuts","no cuts, because its dual is an LP"],"a":1,"x":"Both run outer approximation with cuts from dual-evaluated $c(s)$; empirically hinge loss needed roughly a third as many cuts as logistic loss. In both, the number of cuts falls as $n$ grows."},{"sec":10,"q":"(Book) Where does most of the sparse classification algorithm's run time go?","o":["Finding a feasible support","Computing the Lasso warm start","Proving the lower bound","Inverting $X^\\top X$"],"a":2,"x":"As in sparse regression and LQAD, the incumbent (Lasso warm start plus early cuts) is near-optimal early, and closing the gap is the expensive part. No $p\\times p$ inverse is needed: the dual is $n$-dimensional."},{"sec":10,"q":"(Book) How are the hyperparameters $\\gamma$ and $k$ of sparse classification chosen?","o":["$\\gamma = 1$ fixed; $k$ equal to the Lasso support size","Both read off the optimal dual variables $\\alpha^*$","$k = \\sqrt p$ by default; $\\gamma$ by training-set AUC","$\\gamma$ on a log-spaced grid and $k$, both by CV"],"a":3,"x":"Both are tuned on held-out data. The Lasso (GLMNet) supplies the warm start, not $k$, and choosing anything on training AUC would overfit."},{"sec":10,"q":"(Book) Theorem 6.1 (strong duality for regularized classification $\\min_\\beta\\sum_i\\ell(y_i,\\beta^\\top x_i) + \\tfrac1{2\\gamma}\\|\\beta\\|_2^2$) requires:","o":["the loss $\\ell(y,\\cdot)$ to be convex","the data to be linearly separable","the loss to be differentiable","more samples than features ($n > p$)"],"a":0,"x":"Convexity of $\\ell(y,\\cdot)$ is the stated condition. The hinge loss is not differentiable but is convex, so the SVM qualifies; separability and $n > p$ play no role."},{"sec":10,"q":"(Book) For the hinge loss with a sample labeled $y_i = -1$, which values of the dual variable $\\alpha_i$ are feasible?","o":["$\\alpha_i \\in [-1, 0]$","$\\alpha_i \\in [0, 1]$","$\\alpha_i \\in \\{-1, 0\\}$","Any $\\alpha_i \\le 0$"],"a":1,"x":"The conjugate is finite only for $y_i\\alpha_i \\in [-1,0]$; with $y_i = -1$ that means $-\\alpha_i \\in [-1,0]$, i.e. $\\alpha_i \\in [0,1]$. $[-1,0]$ is the answer for $y_i = +1$."},{"sec":10,"q":"(Book) In Theorem 6.2, what does $c(\\mathbf 1)$ (every $s_j = 1$, ignoring the cardinality limit) equal?","o":["Zero, because every feature is then selected at once","The Lasso objective at the GLMNet solution","The full-feature regularized classification optimum","The value of the hardest $k$-subset of samples"],"a":2,"x":"With $s = \\mathbf 1$, $\\sum_j s_jX_jX_j^\\top = XX^\\top$ and $c$ is the dual of the full regularized problem; strong duality makes it equal to the primal optimum. Since $\\partial c/\\partial s_j \\le 0$, this is the smallest value $c$ can take."},{"sec":10,"q":"(Book) Sparse classification with $\\|\\beta\\|_0 \\le k$ is NP-hard. What does the book conclude from its experiments?","o":["Only instances with $p \\le 30$ are solvable, as with `leaps`","It is actually polynomial, because the dual problem is concave","Beyond a few hundred features it must fall back on the $\\ell_1$ relaxation","Exact solutions at real scale, sparser than Lasso at similar accuracy"],"a":3,"x":"NP-hardness is a worst-case statement; with dual-evaluated cuts, lazy constraints and a Lasso warm start, the exact problem solves at real sizes (e.g. $p = 14{,}858$ genes). The `leaps` ceiling refers to 1970s enumeration for regression."},{"sec":11,"q":"Holistic regression with $p = 6$ and $HC = \\{(1,2),(1,3),(2,3),(4,5)\\}$. What is $k_{\\max}$?","o":["3","2","4","6"],"a":0,"x":"$k_{\\max}$ is a maximum independent set: at most one from the triangle $\\{1,2,3\\}$, at most one from $\\{4,5\\}$, plus variable 6, which has no edges (e.g. $\\{1,4,6\\}$). Four would need two from the triangle or from the pair."},{"sec":11,"q":"You add an interaction $x_1x_2$ with binary $z_{12}$ and require that it enter only if both parents are selected. Which constraints do this?","o":["$z_{12} \\ge z_1$ and $z_{12} \\ge z_2$","$z_{12} \\le z_1$ and $z_{12} \\le z_2$","$z_{12} \\ge z_1 + z_2 - 1$","$z_1 + z_2 + z_{12} \\le 1$"],"a":1,"x":"Each parent bounds the interaction from above. $z_{12} \\ge z_1$, $z_{12} \\ge z_2$ drags the interaction in with either parent, $z_{12} \\ge z_1+z_2-1$ forces it in whenever both parents are, and $z_1+z_2+z_{12}\\le1$ forbids it with either parent."},{"sec":11,"q":"Each feature $j$ costs $c_j$ to measure, and total cost per patient must not exceed $C$. Which constraint belongs in the holistic MIO?","o":["$\\sum_j c_j|\\beta_j| \\le C$","$\\sum_j z_j \\le C$","$\\sum_j c_jz_j \\le C$","$c_jz_j \\le C$ for each $j$"],"a":2,"x":"Cost is incurred by measuring a feature at all, which is the support indicator $z_j$, not the size of $\\beta_j$. $\\sum c_j|\\beta_j|$ is weighted-$\\ell_1$ shrinkage, and $\\sum z_j \\le C$ ignores the costs."},{"sec":11,"q":"HW2 Q1(c): two highly correlated variables could equivalently be handled by putting them in one group ($z_i = z_j$) instead of $z_i + z_j \\le 1$. True or false?","o":["True: both constraints stop one variable entering without the other","True: both force the pair's coefficients to be equal","False: group constraints cannot be written with binaries","False: $z_i = z_j$ admits the pair together, which HC forbids"],"a":3,"x":"Collinearity needs 'at most one' ($z_i + z_j \\le 1$); groups need 'all or none'. The group constraint admits exactly the collinear pair that the HC constraint forbids."},{"sec":11,"q":"In the significance constraints $t_j + Mb_j \\ge t_\\alpha z_j$ and $-t_j + M(1-b_j) \\ge t_\\alpha z_j$, what do $z_j = 1$, $b_j = 1$ enforce?","o":["$t_j \\le -t_\\alpha$","$t_j \\ge t_\\alpha$","$|t_j| \\le t_\\alpha$","No restriction: both are slack"],"a":0,"x":"With $b_j = 1$ the first constraint is relaxed by $M$ and the second reads $-t_j \\ge t_\\alpha$. With $b_j = 0$ the roles swap and $t_j \\ge t_\\alpha$ binds; with $z_j = 0$ both are slack."},{"sec":11,"q":"Rec 4's multicollinearity example: if $x_1 = 3x_3$ in the data, which model is identical to $y = 2x_1 + x_2 - x_3$?","o":["$y = x_2 + 6x_3$","$y = x_2 + 5x_3$","$y = 2x_1 + x_2 + 3x_3$","$y = 5x_1 + x_2$"],"a":1,"x":"Substituting $x_1 = 3x_3$ gives $6x_3 + x_2 - x_3 = x_2 + 5x_3$; $x_2 + 6x_3$ forgets the $-x_3$. The data cannot tell these coefficient vectors apart, so individual coefficients mean nothing, hence $z_i + z_j \\le 1$ for highly correlated pairs."},{"sec":11,"q":"Holistic regression solves one MIO per pair $(k, \\Gamma)$. With $k_{\\max} = 12$ and the default 10 candidate $\\Gamma$ values, how many MIOs are solved before validation picks the best?","o":["22","12","120","10"],"a":2,"x":"$k = 1,\\dots,k_{\\max}$ for each of the 10 $\\Gamma$ values gives $12\\times10 = 120$ models; the best on the validation set is kept."},{"sec":11,"q":"The significance constraint uses $\\tilde\\sigma$ and $(X^\\top X)^{-1}_{jj}$ computed before solving. What caveat does this create?","o":["It makes the significance constraints nonlinear in $\\beta$","It is only valid when there are fewer samples than candidate features","It forces every selected coefficient to be positive","True $t$-stats depend on the chosen subset; this is a linear proxy"],"a":3,"x":"Fixing those constants keeps the constraint linear in $\\beta_j$, but the standard errors of a refit on the chosen support differ from those of the full model. The sign is chosen by $b_j$, not fixed."},{"sec":12,"q":"Lec 3, 4 and 5 each select a subset. Which pairing of subset type and solution technique is correct?","o":["Features: MIO; worst samples: LP duality; best samples: MIO","Features: LP duality; worst samples: MIO; best samples: LP duality","All three: LP duality after relaxing to the convex hull","Features: Lasso; worst samples: MIO; best samples: hard thresholding"],"a":0,"x":"Picking the worst $k$ samples is an inner max whose LP relaxation is exact (TU), so it dualizes. Picking the best $q$ samples (LQAD) or the best $k$ features is a min over subsets, nonconvex, so binaries remain."},{"sec":12,"q":"Which of these is convex in $\\beta$ and can therefore be written as an LP-dual min?","o":["The sum of the $k$ smallest absolute residuals","The sum of the $k$ largest absolute residuals","The $q$-th smallest absolute residual","The median absolute residual"],"a":1,"x":"The sum of the $k$ largest is $\\max_z\\sum z_i|r_i|$, a max of convex functions. The others are order statistics or sums of smallest values, minima over subsets, which need an MIO (HW2 Q1(b), LQAD)."},{"sec":12,"q":"The course's recipe for robust counterparts: continuous norm-ball uncertainty and combinatorial budget uncertainty produce, respectively:","o":["LP-dual variables; a dual-norm term","a ridge penalty in both cases","a dual-norm term; LP-dual variables","binary variables; a dual-norm term"],"a":2,"x":"Norm balls (Lec 2, Lec 6 features) collapse through the dual-norm definition. Budgets over selections or flips (Lec 4, Lec 6 labels) relax to integral polytopes and are dualized, adding $\\theta, u$ or $\\mu, \\nu$."},{"sec":12,"q":"Big-M appears in best subset (Lec 3), LQAD (Lec 5) and holistic regression (Lec 7). What does choosing $M$ too large cost in all three?","o":["A suboptimal solution that is reported as optimal","Infeasibility, since $\\beta = 0$ is cut off","The binaries become redundant, so the MIO collapses to an LP","Still correct, but a weaker relaxation and slower B&B"],"a":3,"x":"Too large an $M$ is a tractability problem; too small is a correctness problem that silently cuts off the optimum. Rec 1's $M_2 = 6$ poll makes the same distinction."},{"sec":12,"q":"Which method does NOT rely on relaxing a binary set to a polytope with integral vertices?","o":["Convex regression","Stable regression","Time-series stable regression","Label-robust logistic regression"],"a":0,"x":"Convex regression has no binaries; its difficulty is the $n(n-1)$ constraints, handled by constraint generation. The other three relax a binary selection set to an integral polytope and then dualize."},{"sec":12,"q":"The epigraph trick (replace a function in the objective by a variable plus a constraint) appears in which pair?","o":["Hard thresholding and the SLO linearization step","$\\|y-X\\beta\\|_2 \\le t$ in the SOCP, and $\\min\\eta$ over cuts","The flip $y_i(1-2\\Delta y_i)$ and group sparsity $z_i = z_l$","Rec 1's maximin (written with $t \\ge f_j$) and the LQAD band $\\gamma$"],"a":1,"x":"Both minimize $t$ or $\\eta$ subject to $t \\ge$ a norm or $\\eta \\ge$ each cut. Rec 1's maximin uses a hypograph ($t \\le f_j$), not $t \\ge f_j$."},{"sec":12,"q":"In Lec 3's $k = 6$ run and Lec 5's warm-started HBK run, the upper bound hit the optimum early. What used the rest of the solver time?","o":["Searching for a first feasible solution to the MIO","Tuning the big-M values between nodes","Raising the lower bound to certify optimality","Generating and polishing the warm start"],"a":2,"x":"The incumbent was already optimal; branch-and-bound then spent its time proving nothing better exists. The certificate, not the solution, is the expensive part."},{"sec":12,"q":"Which method's full formulation has a number of constraints quadratic in $n$, motivating constraint generation?","o":["Stable regression","Best subset via the dual $c(s)$","Label-robust logistic regression","Convex regression"],"a":3,"x":"Convex regression has $n(n-1)$ pairwise constraints. Stable regression adds $n + 1$ variables and $O(n)$ constraints, and label-robust LR adds $n + 1$ dual variables."},{"sec":12,"q":"Feature-noise robustness gives an additive penalty in linear regression. What changes in logistic regression?","o":["The term moves inside the loss, shrinking each margin","It stays an additive $\\rho\\|\\beta\\|_{q^*}$ outside the log","It becomes an $\\ell_0$ cardinality constraint","No closed-form robust counterpart exists for it"],"a":0,"x":"Because $-\\log(1+e^{-\\omega})$ is increasing, the worst case just lowers each margin, so the term sits in the exponent and matters most for points near the boundary. The book stresses this is not the usual $\\ell_1$-penalized form."},{"sec":12,"q":"Which of these is a pure linear optimization problem?","o":["$\\min_\\beta\\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_1$ (Rob 2-1, Lasso)","$\\min_\\beta\\|y - X\\beta\\|_1 + \\rho\\|\\beta\\|_1$ (Rob 1-1)","$\\min_\\beta\\|y - X\\beta\\|_2 + \\rho\\|\\beta\\|_2$ (Rob 2-2)","Feature-robust logistic regression"],"a":1,"x":"An $\\ell_1$ loss and an $\\ell_1$ penalty both linearize with auxiliary variables and linear inequalities. Any $\\ell_2$ norm term needs a second-order cone constraint, and the logistic loss is nonlinear."},{"sec":12,"q":"Match each problem to the heuristic the course uses for its upper bound (warm start):","o":["Best subset: Lasso; LQAD: hard thresholding; sparse classification: SLO then MIO","Best subset: SLO; LQAD: Lasso; sparse classification: subgradient descent","Best subset: hard thresholding; LQAD: subgradient + SLO; sparse classification: Lasso","Best subset: subgradient; LQAD: Lasso; sparse classification: hard thresholding"],"a":2,"x":"Lec 3 warm-starts with the discrete first-order method ($H_k$), Lec 5 with Algorithm 3 (subgradient then SLO), and the book's sparse classification with GLMNet's Lasso. In each, the MIO then certifies."},{"sec":12,"q":"Lec 3's remark on complexity says sparse regression gets easier as $n$ grows. What does this illustrate?","o":["Sparse regression is in P whenever $n > p$","More samples shrink the big-M constants","The Lasso relaxation becomes exact for large $n$, so the MIO is unnecessary","Practability: worst-case NP-hardness says little about real instances"],"a":3,"x":"More data tightens the bounds, so solve time and support recovery improve together, the opposite of 'harder with size'. This is Lec 1's practability argument applied."},{"sec":12,"q":"The separation oracles in robust-regression cutting planes, convex-regression constraint generation and sparse-regression outer approximation return, respectively:","o":["the worst $\\Delta$; the most violated pair $(i, j(i))$; $c(s)$ and $\\nabla c(s)$","$c(s)$ and $\\nabla c(s)$; the worst $\\Delta$; the most violated pair $(i, j(i))$","the most violated pair $(i, j(i))$; $c(s)$ and $\\nabla c(s)$; the worst $\\Delta$","the worst $\\Delta$; $c(s)$ and $\\nabla c(s)$; the most violated pair $(i, j(i))$"],"a":0,"x":"Each method solves a small master problem, asks an oracle what it got wrong, and adds that constraint or cut: a worst-case perturbation, a violated tangent-plane pair, or a tangent cut of $c$ at the incumbent support."},{"sec":13,"q":"HW1 Q2(b), $n = 1$, $p = 2$: when is the diamond $\\mathcal B$ ($|\\Delta_{11}| + |\\Delta_{12}| \\le \\rho$) contained in the box $\\mathcal A$ ($|\\Delta_{1j}| \\le \\lambda$)?","o":["$\\rho \\le 2\\lambda$","$\\rho \\le \\lambda$","$2\\rho \\le \\lambda$","$\\rho \\le \\lambda/\\sqrt2$"],"a":1,"x":"The diamond's vertices $(\\pm\\rho, 0)$ and $(0,\\pm\\rho)$ are its extreme points in each coordinate, so it fits in the box iff $\\rho \\le \\lambda$. $2\\lambda \\le \\rho$ is the condition for the opposite containment, $\\mathcal A \\subseteq \\mathcal B$."},{"sec":13,"q":"Same setting ($n = 1$, $p = 2$): when is neither $\\mathcal A$ nor $\\mathcal B$ contained in the other?","o":["$\\rho < \\lambda$","$\\rho > 2\\lambda$","$\\lambda < \\rho < 2\\lambda$","$\\lambda/2 < \\rho < \\lambda$"],"a":2,"x":"For $\\rho > \\lambda$ the diamond's vertices stick out of the box; for $\\rho < 2\\lambda$ the box corner $(\\lambda,\\lambda)$, with $\\ell_1$ norm $2\\lambda$, sticks out of the diamond."},{"sec":13,"q":"HW1 Q2(c): one listing, general $p$ features. How do the containment conditions change?","o":["Both conditions are unchanged","$\\mathcal B \\subseteq \\mathcal A$ iff $\\rho \\le p\\lambda$; $\\mathcal A \\subseteq \\mathcal B$ iff $2\\lambda \\le \\rho$","$\\mathcal B \\subseteq \\mathcal A$ iff $\\rho \\le \\lambda/p$; $\\mathcal A \\subseteq \\mathcal B$ iff $p\\lambda \\le \\rho$","$\\mathcal B \\subseteq \\mathcal A$ still iff $\\rho \\le \\lambda$; $\\mathcal A \\subseteq \\mathcal B$ now iff $p\\lambda \\le \\rho$"],"a":3,"x":"The diamond's vertices stay at $\\pm\\rho e_j$, so the first condition does not depend on $p$. The box corner $(\\lambda,\\dots,\\lambda)$ has $\\ell_1$ norm $p\\lambda$, so the box fits in the diamond only if $\\rho \\ge p\\lambda$."},{"sec":13,"q":"HW1 Q2(a) shows the row budget $\\|\\delta_i\\|_1 \\le \\rho$ is the induced ball $\\mathcal U_{(\\infty,\\infty)}$. Which budget gives first index 2, i.e. $\\mathcal U_{(2,\\infty)}$?","o":["$\\|\\delta_i\\|_2 \\le \\rho$ for every row $i$","$\\|\\delta_i\\|_\\infty \\le \\rho$ for every row $i$","$\\|\\Delta_j\\|_2 \\le \\rho$ for every column $j$","$\\|\\Delta\\|_{2\\text{-}F} \\le \\rho$"],"a":0,"x":"$\\|\\Delta\\|_{(r,\\infty)} = \\max_i\\max_{\\|x\\|_r\\le1}\\delta_i^\\top x = \\max_i\\|\\delta_i\\|_{r^*}$, so the row norm is the dual of the first index ($\\ell_1 \\leftrightarrow \\infty$, $\\ell_2 \\leftrightarrow 2$). Column budgets correspond to first index 1, by $(\\star)$."},{"sec":13,"q":"In proving $\\|\\Delta\\|_{(\\infty,\\infty)} \\ge \\max_i\\|\\delta_i\\|_1$, with $i^\\star$ the row of largest $\\|\\delta_i\\|_1$, which witness works?","o":["Take $x^\\star = e_{j^\\star}$, where $|\\Delta_{ij^\\star}|$ is the largest entry","Pick row $i^\\star$ first, then $x^\\star_j = \\mathrm{sign}(\\Delta_{i^\\star j})$","Choose $x^\\star_j = \\mathrm{sign}(\\Delta_{ij})$ separately for each row $i$","Set $x^\\star = \\delta_{i^\\star}/\\|\\delta_{i^\\star}\\|_1$ for the largest row"],"a":1,"x":"With $\\|x^\\star\\|_\\infty = 1$, row $i^\\star$ gives $\\delta_{i^\\star}^\\top x^\\star = \\|\\delta_{i^\\star}\\|_1$, so the max is at least that. One $x$ must serve all rows, which is why $i^\\star$ is fixed before the signs are chosen; $e_{j^\\star}$ recovers a single entry."},{"sec":13,"q":"In HW1 Part B, how is the loss $\\|y - X\\beta\\|_\\infty$ linearized?","o":["One $u_i$ per listing with $u_i \\ge \\pm(y_i - x_i^\\top\\beta)$, minimizing $\\sum_i u_i$","A binary per listing selecting the largest residual","One scalar $u$ with $u \\ge \\pm(y_i - x_i^\\top\\beta)$ for every $i$","A cone constraint $\\|y - X\\beta\\|_2 \\le u$"],"a":2,"x":"A max needs one epigraph scalar and $2n$ inequalities. Per-listing $u_i$ with $\\sum_i u_i$ is the $\\ell_1$ loss; the sum-versus-max mix-up is a flagged weak spot."},{"sec":13,"q":"The HW1 Part B MIO (box $\\mathcal A$ with radius $\\lambda$, row budget $\\mathcal B$ with radius $\\rho$, $\\ell_\\infty$ loss, $\\|\\beta\\|_0 \\le k$) has objective:","o":["$u + \\lambda w + \\rho\\sum_j t_j$","$\\sum_i u_i + \\lambda\\sum_j t_j + \\rho w$","$u + (\\lambda + \\rho)\\sum_j t_j$","$u + \\lambda\\sum_j t_j + \\rho w$"],"a":3,"x":"$\\mathcal A = \\mathcal U_{(1,\\infty)}$ contributes $\\lambda\\|\\beta\\|_1$ and $\\mathcal B = \\mathcal U_{(\\infty,\\infty)}$ contributes $\\rho\\|\\beta\\|_\\infty$; $u$ is the $\\ell_\\infty$ loss. Swapping $\\lambda$ and $\\rho$ attaches each penalty to the wrong set."},{"sec":13,"q":"HW1 Q1(f): 'Lasso is not equivalent to sparse regression.' True or false?","o":["True: Lasso is robustness to feature-wise noise, not a cardinality limit","False: Lasso is the convex hull relaxation, hence equivalent","False: for a suitable $\\lambda$ Lasso always returns the best subset exactly","True, but only in the high-dimensional case $n < p$"],"a":0,"x":"The two generally select different supports: Lasso shrinks and over-selects. A relaxation is not an equivalence, and the course's view is that Lasso is robust rather than sparse."},{"sec":13,"q":"HW1 Q3: going from A only $(\\lambda,\\rho) = (0.25, 0)$ to B only $(0, 1)$, sqft rose from 120.43 to 137.25. Why can sqft grow when the $\\ell_1$ charge is removed?","o":["The $\\ell_\\infty$ penalty rewards the largest coefficient","Below the max, $\\ell_\\infty$ prices nothing, so fit alone sets sqft","Removing $\\lambda$ also removes the sparsity constraint","The $\\ell_\\infty$ penalty pushes all coefficients to a common value"],"a":1,"x":"$\\rho\\max_j|\\beta_j|$ charges only the peak; shrinking a non-maximal coefficient saves nothing. sqft sits below $w = 145.81$, while beds and laundry tie at that ceiling."},{"sec":13,"q":"In the HW1 model, what coefficient pattern should you expect with only the $\\ell_1$ penalty ($\\rho = 0$) versus only the $\\ell_\\infty$ penalty ($\\lambda = 0$)?","o":["$\\ell_1$ only: ties at a ceiling; $\\ell_\\infty$ only: zeros, no ties","Both penalties produce zeros; they differ only in how large the survivors are","$\\ell_1$ only: zeros, no forced ties; $\\ell_\\infty$ only: ties, no push to zero","Both produce ties; only $\\ell_1$ adds zeros, and only when $k$ binds"],"a":2,"x":"$\\ell_1$ charges every coefficient at rate $\\lambda$, so those not worth $\\lambda$ drop to zero. $\\ell_\\infty$ prices only the max, so shrinking stalls when the peak meets the runner-up, giving ties like beds = laundry = 145.81."},{"sec":13,"q":"HW1 Q3(c): compare the $k = 3$ and $k = 7$ models at $(\\lambda,\\rho) = (0.25, 0.5)$. Which statement is guaranteed?","o":["The $k = 7$ residual level $u$ is strictly smaller","The $k = 7$ model has all seven coefficients nonzero","The $k = 3$ model has the smaller objective because its penalties are smaller","The $k = 7$ optimal objective is at most the $k = 3$ objective"],"a":3,"x":"The $k = 3$ feasible set lies inside the $k = 7$ one, so the optimal objective can only fall or stay. $u$ usually drops too, but the penalties trade off against it, so that is not guaranteed."},{"sec":13,"q":"Per the HW1 JuMP notes, what is redundant in `@constraint(m, [j in 1:p], t[j] .>= β[j])`?","o":["Index set and broadcasting do the same job; use only one","Ranged constraints need constant bounds, so split it in two","`t[j]` must be declared `Bin` for a linear constraint","It should reference `value.(β)` instead of `β[j]`"],"a":0,"x":"Write either `@constraint(m, [j in 1:p], t[j] >= β[j])` or `@constraint(m, t .>= β)`. The split-in-two rule applies to $-v \\le \\beta_j \\le v$ with a variable $v$, and `value.()` is only for reading results after solving."},{"sec":13,"q":"Why does the HW1 starter notebook fit the sublet model without an intercept?","o":["The big-M constant $M = 10^3$ absorbs the intercept","It centers $y$ and standardizes the columns of $X$","The $\\ell_\\infty$ loss ignores constant shifts","An intercept column is one of the seven features"],"a":1,"x":"The notebook centers the response and standardizes the features, and states that no intercept is needed. $M$ only bounds coefficients, the $\\ell_\\infty$ loss does change under shifts, and the seven features are sqft, beds, baths, walk_t, laundry, parking and floor."},{"sec":14,"q":"Why did Martin et al. use CART rather than logistic regression to predict Supreme Court votes?","o":["Logistic regression cannot model a binary outcome such as reverse vs affirm, so a classifier tree was required","CART gives higher training accuracy than logistic regression on any dataset","Logistic regression needs more than 628 observations to estimate its coefficients reliably","A tree is a few readable yes/no questions; LR coefficients give importance and direction but no decision rule"],"a":3,"x":"Lec 8 slide 5: LR coefficients show importance and relative effect but do not explain how a decision is made; trees are interpretable and assume no linearity. LR handles binary outcomes fine, which is the point of logistic regression."},{"sec":14,"q":"For the 68 cases of October 2002, what were the case-outcome accuracies?","o":["Model 67%, experts 68%","Model 75%, experts 59%","Model 59%, experts 75%","Model 75%, experts 68%"],"a":1,"x":"75% vs 59% is for overall case outcomes. 67% vs 68% is the individual-justice comparison, where the model only ties the experts."},{"sec":14,"q":"(Book) How does Breiman grade trees and random forests?","o":["Trees: A+ on accuracy and interpretability. Forests: A+ on accuracy only","Trees: F on interpretability. Forests: A+ on interpretability","Trees: A+ on interpretability. Forests: A+ predictors, F on interpretability","Forests: A+ on both accuracy and interpretability, making trees obsolete"],"a":2,"x":"This is the accuracy-interpretability tradeoff Optimal Trees aim to remove. Averaging hundreds of trees destroys the readable single-tree structure."},{"sec":14,"q":"Justice Souter's tree in Martin's model splits first on:","o":["Justice Ginsburg's predicted decision","Whether the lower court decision was liberal","The circuit court of origin","Whether the respondent is the United States"],"a":0,"x":"Per-justice trees can use other justices' predictions as features; Souter's root is Ginsburg's predicted vote. The lower-court direction is O'Connor's root (and Souter's second level)."},{"sec":14,"q":"A student picks `minbucket` as the value with the best test-set accuracy and reports that accuracy. What is wrong?","o":["`minbucket` should instead be chosen to maximize training accuracy, which is unbiased","Nothing, as long as the test set is larger than the training set","`minbucket` only affects run time, so tuning it on any data set is unnecessary","Test data were used for model selection, so the reported accuracy is optimistic"],"a":3,"x":"Lec 8 slide 12: \"This is not right!\" Use a validation set or $k$-fold CV, then evaluate once on the test set. Maximizing training accuracy would just pick the smallest `minbucket` and overfit."},{"sec":14,"q":"In R's `rpart`, lowering the complexity parameter `cp` typically:","o":["Produces a smaller tree that may underfit","Produces a bigger tree that may overfit","Has no effect on tree size, only on the split criterion","Increases the minimum number of points per leaf"],"a":1,"x":"`cp` is the price per split ($\\alpha$): a lower price lets more splits survive pruning (Lec 8 slide 33). Raising it, not lowering it, gives smaller trees."},{"sec":14,"q":"A CART leaf holds 10 affirm and 2 reverse training cases. What is the leaf's affirm frequency, and what does it predict at threshold 0.5?","o":["0.833; affirm","0.867; affirm","0.167; reverse","0.200; reverse"],"a":0,"x":"$10/12=0.833$. Lec 8 slide 13 prints 0.867, an arithmetic slip. A 0.5 threshold is the majority class, so affirm. 0.200 is $2/10$, the odds of reverse, not a frequency."},{"sec":14,"q":"A node holds 3 points of class A and 1 of class B. Its Gini impurity is:","o":["0.25","0.562","0.1875","0.375"],"a":3,"x":"$1-(0.75^2+0.25^2)=0.375$, equivalently $2p(1-p)$. 0.25 is the misclassification impurity, 0.562 is entropy (nats), and 0.1875 is $p(1-p)$ without the factor 2."},{"sec":14,"q":"Parent node: 4A/4B. A split sends 3A/0B left and 1A/4B right. What is the Gini gain $n_tI(t)-n_LI(L)-n_RI(R)$?","o":["3","2.4","0.3","1.6"],"a":1,"x":"Parent $8\\times0.5=4$; left pure, 0; right $5\\times(1-0.2^2-0.8^2)=1.6$. Gain $=4-1.6=2.4$. 3 is the misclassification gain (errors 4 → 1), and 0.3 divides by $n_t$."},{"sec":14,"q":"Why can tree growth by misclassification gain stall even when a split would help later?","o":["It is undefined for nodes that contain more than two classes, so growth must stop there","It always prefers the split with the most distinct thresholds","Its gain is zero when both children keep the parent's majority class, even if one is purer","It is negative for any split that increases child purity, so such splits are rejected"],"a":2,"x":"Misclassification gain counts errors removed. Gini and entropy are strictly concave in the class proportions, so a purer child earns positive gain that later splits convert into fewer errors."},{"sec":14,"q":"In the Rec 5 ten-point example (5B, 5R), how many errors does the single root split $x_2<0.5$ leave?","o":["2, the best root split","0, since it is the XOR root","3, the same as $x_1<0.35$","5, no better than no split"],"a":3,"x":"It sends 3B/3R left and 2B/2R right, so 3 + 2 = 5 errors. That is why greedy never picks it, even though it is the root of the 0-error XOR tree. Greedy's $x_1<0.25$ leaves 2."},{"sec":14,"q":"Rec 5 greedy tree: full tree 2 splits/1 error, root-only 1 split/2 errors, single leaf 0 splits/5 errors. With $\\alpha=2$, pruning returns:","o":["The full greedy tree","The root split only","The single leaf","A tie between the full tree and the single leaf"],"a":1,"x":"Costs: full $1+2\\cdot2=5$, root-only $2+2=4$, leaf $5$. Root-only wins, consistent with its range $1<\\alpha<3$. The full tree and the leaf tie at 5, but neither is optimal."},{"sec":14,"q":"For large $n$, the probability that a given training row is absent from one bootstrap sample is about:","o":["0.632","0.5","0.368","$1/n$"],"a":2,"x":"$(1-1/n)^n\\to e^{-1}\\approx0.368$. 0.632 is the probability the row is included at least once."},{"sec":14,"q":"(Book) A random forest on data with $p=100$ features uses the typical feature-subset size at each split. How many features does each split consider?","o":["50","100","10","7"],"a":2,"x":"The Book's typical choice is $\\sqrt p=10$. Using all 100 would remove the feature randomization; 7 is roughly $\\log_2 100$."},{"sec":14,"q":"Why should `ntree` in a random forest not be too small (Lec 8 slide 16)?","o":["Each tree must see every feature at least once, which needs at least $p$ trees in total","Fewer trees make each individual tree deeper and more likely to overfit","Each bootstrap sample misses some rows, so with few trees some rows are barely used","The forest's majority vote is undefined for fewer than 100 trees"],"a":2,"x":"About 37% of rows are left out of each bootstrap sample. More trees cost more time but ensure every row contributes."},{"sec":14,"q":"In gradient boosting with learning rate $\\eta$, the next small tree $h$ is fit to:","o":["A fresh bootstrap sample of the original labels $y$, then averaged with the other trees","The residuals $y-f(x)$ of the current ensemble, then added as $f\\leftarrow f+\\eta h$","The original labels $y$ using a random subset of features, then added as $f\\leftarrow f+h$","Only the misclassified points, each given equal weight, then majority-voted"],"a":1,"x":"Boosting builds trees in sequence, each correcting what is left (Rec 5 slide 13). Bootstrap samples and voting describe random forests."},{"sec":14,"q":"Boosted classification: a point has $y=1$ and the current ensemble log-odds is $f(x)=0$. What target does the next tree fit for this point?","o":["0.5","1","0","−0.5"],"a":0,"x":"$\\hat p=1/(1+e^{0})=0.5$, and each tree fits $y-\\hat p(x)=1-0.5=0.5$. Fitting 1 ignores the current prediction; −0.5 flips the sign."},{"sec":14,"q":"Which pairing of ensemble and construction is correct?","o":["Random forest: small trees in sequence on residuals; boosting: deep trees in parallel on bootstrap samples","Random forest: deep trees in sequence on residuals; boosting: small trees in parallel on bootstrap samples","Both: deep trees in parallel, combined by weighted sum","Random forest: deep trees in parallel on bootstrap samples; boosting: small trees in sequence on residuals"],"a":3,"x":"RF reduces variance by averaging decorrelated deep trees; boosting reduces bias by adding small corrective trees. Both give up the single interpretable tree."},{"sec":14,"q":"A regression-tree leaf contains $y=1,2,6$. Its prediction and its impurity $\\sum_{i\\in t}(y_i-\\bar y_t)^2$ are:","o":["Prediction 3, impurity 14","Prediction 3, impurity 4.67","Prediction 2, impurity 17","Prediction 2, impurity 14"],"a":0,"x":"The leaf predicts the mean 3; squared deviations $4+1+9=14$. 4.67 divides by $n$ (a variance); 2 and 17 use the median."},{"sec":14,"q":"5-fold cross-validation over 4 candidate `cp` values. How many models are trained before the final refit?","o":["20","5","4","9"],"a":0,"x":"Each candidate is trained on 4 folds and scored on the fifth, for every fold: $5\\times4=20$. Then the best value is refit once on all training data."},{"sec":15,"q":"Lec 9 slide 8 (quadrant/AND data): objective $0.25$ with no split, $0.25+\\alpha$ with one split, $0+2\\alpha$ with two. What does greedy growth return for any $\\alpha>0$?","o":["The empty tree","The one-split tree","The two-split tree","The two-split tree if $\\alpha<0.25$"],"a":0,"x":"Greedy adds a split only if it lowers the objective now; the first split leaves the error at 0.25 and adds $\\alpha$, so it stops. The good second split is never reached."},{"sec":15,"q":"Same quadrant data. For which $\\alpha$ is the two-split tree globally optimal?","o":["$\\alpha<0.25$","$\\alpha<0.125$","$\\alpha<0.0625$","$\\alpha>0.125$"],"a":1,"x":"Two splits beat no split when $2\\alpha<0.25$, i.e. $\\alpha<0.125$ (the one-split tree is never best). 0.25 forgets that two splits are charged."},{"sec":15,"q":"Which is NOT one of the complications of CART's one-step growing procedure listed on Lec 9 slide 12?","o":["Splits are only locally optimal, so the tree can be far from optimal","It needs a two-stage grow-then-prune process","It cannot split on categorical features","It needs an impurity measure instead of misclassification error"],"a":2,"x":"Slide 12 lists exactly the other three, all consequences of choosing one split at a time. Handling categorical features is not part of the critique."},{"sec":15,"q":"According to Breiman et al. (1984), CART grows with an impurity measure instead of misclassification because:","o":["Impurity measures are provably better predictors of test error than misclassification counts","Misclassification error cannot be computed for nodes with more than two classes","Impurity measures are cheaper to compute than error counts","Misclassification fails to reward splits that help later growth, because growth is one-step"],"a":3,"x":"The Lec 9 slide 10 quote ties the impurity to the one-step (greedy) structure. It is a workaround, so the grown tree does not directly optimize the error you care about."},{"sec":15,"q":"What reason did Breiman give for not pursuing globally optimal trees?","o":["He proved that greedy trees generalize better than globally optimal ones on real data","An overall optimal procedure did not seem computationally feasible in 1984","Optimal trees always overfit the training data","The optimal tree problem has no well-defined objective function to optimize"],"a":1,"x":"\"At this stage of computer technology\": a practical limitation of the time (Lec 9 slide 13), not a claim that greedy is better."},{"sec":15,"q":"Lec 9 slide 14 quotes the total MIO speedup (software × hardware, 1991–2017) as:","o":["37.6 trillion×","2,117,000×","29,000×","3.3 trillion×"],"a":3,"x":"Software 2,117,000× times hardware $10^{6.2}\\approx1{,}560{,}000$× ≈ 3.3 trillion. 37.6 trillion is Lec 1's updated figure; 29,000× is CPLEX 1.2 → 11 alone."},{"sec":15,"q":"What set of trees does CART's cost-complexity pruning search?","o":["All trees of depth at most $D$ with at least $N_{\\min}$ points per leaf","Only subtrees of the single greedy tree","All trees whose root is the best single split","All trees with the same number of leaves as the grown tree"],"a":1,"x":"Pruning optimizes the same error $+\\ \\alpha\\cdot$splits objective, but only by removing splits greedy chose (Rec 5 slide 15). OCT searches all depth-$\\le D$ trees."},{"sec":15,"q":"Lec 9 slide 7 problem with greedy growth under error $+\\ \\alpha\\cdot$complexity: greedy considers a split only if:","o":["It reduces the Gini impurity by more than $\\alpha$ summed over the subtree","It reduces the error by more than $\\alpha$ by itself","It is followed by a split that reduces error by more than $\\alpha$","It uses a feature not yet used higher in the tree"],"a":1,"x":"Each split must pay for itself immediately, so strong splits hidden behind weak ones are missed; $\\alpha$ too large stops early, too small overfits."},{"sec":15,"q":"Split selection bias (Lec 9 slide 50) means that CART:","o":["All else equal, prefers a feature with 100 distinct values over one with 10","Prefers whichever features appear earliest in the data matrix when gains are close","Prefers binary features over continuous ones","Is biased toward predicting the majority class at every leaf, regardless of the split"],"a":0,"x":"More candidate thresholds give more chances to look good by chance. OCT is much less susceptible; XGBoost and SHAP assign importance to many irrelevant features."},{"sec":15,"q":"The feature-selection experiments cited on Lec 9 slide 50 found that XGBoost and SHAP:","o":["Recover the relevant features exactly","Assign zero importance to all continuous features","Agree perfectly with OCT's split features","Assign importance to many irrelevant features"],"a":3,"x":"They are \"very imprecise at assigning importance to relevant features\", one argument for interpretable models over post-hoc explanations."},{"sec":15,"q":"(Book) With $n=10$ points and $p=2$ features, how many candidate hyperplane splits must a greedy oblique-tree method consider by the Book's count $2^p\\binom{n}{p}$?","o":["90","40","180","20"],"a":2,"x":"$2^2\\binom{10}{2}=4\\times45=180$. 90 uses $2\\binom{n}{p}$, 40 is $n\\cdot2^p$, 20 is $np$. The count grows exponentially in $p$."},{"sec":15,"q":"(Book) Optimal tree construction is NP-hard. In the course's view this means:","o":["Optimal trees can only be found for datasets with fewer than 100 points","Greedy trees are provably within a constant factor of the optimal objective value","Little for practice: what matters is solving real instances in useful time","The MIO formulation must have exponentially many constraints"],"a":2,"x":"Practability, not worst-case complexity, is the criterion. MIO speedups and local search make realistic instances solvable."},{"sec":15,"q":"(Book) What is the main concern with lookahead heuristics such as IDX, LSID3 and ID3-k?","o":["They cannot handle more than two classes without a separate tree per class","They require solving an MIO at every node","Unclear benefit to generalization, and the look-ahead pathology","They always produce deeper trees than CART, which then overfit badly"],"a":2,"x":"They optimize deeper subtrees at each node to stop strong splits hiding, but remain heuristics with mixed evidence."},{"sec":15,"q":"\"A globally optimal tree will just overfit.\" How does Lec 9 answer this?","o":["OCT always uses fewer splits than CART, so it cannot overfit by construction","OCT is only ever applied at depth 1, where overfitting cannot occur","On data from a known tree, OCT recovers the true structure better, with lower false discovery","OCT holds out a separate test set inside the MIO and optimizes test error directly"],"a":2,"x":"Overfitting is controlled by $D$, $N_{\\min}$, $\\alpha$ tuned on validation, as with CART. Better optimization then finds real structure more often."},{"sec":15,"q":"Why does greedy CART fail to find the Rec 5 XOR tree?","o":["The XOR root $x_2<0.5$ alone leaves 5 errors vs 2 for $x_1<0.25$, so greedy picks the latter","The XOR tree needs depth 3, which exceeds the depth limit used in the example","The XOR tree violates $N_{\\min}=2$","Gini picks $x_2<0.5$ at the root but misclassification does not, and CART uses misclassification"],"a":0,"x":"Neither feature helps alone in XOR. The XOR tree has depth 2 and leaves of sizes 3, 3, 2, 2, so it is feasible; Gini also picks $x_1<0.25$."},{"sec":15,"q":"Rec 5 poll: how many depth-2 trees classify all ten points correctly (counting trees by leaf contents)?","o":["Three, of which two satisfy $N_{\\min}=2$","One, the XOR tree","None, since greedy reaches only 1 error","Two, both using greedy's root $x_1<0.25$"],"a":0,"x":"The XOR tree, a tree with root $x_1<0.65$, and one with root $x_2<0.65$ that isolates point 7 in its own leaf ($N_{\\min}=2$ rules it out). None uses greedy's root."},{"sec":15,"q":"In the Book's optimal tree problem $\\min_T R(T)+\\alpha\\lvert T\\rvert$, $\\lvert T\\rvert$ counts:","o":["Branch (split) nodes","Leaves","Tree depth","Training points per leaf"],"a":0,"x":"The complexity term counts splits, matching CART's cost-complexity and OCT's $\\alpha\\sum_t d_t$. Leaf count is splits + 1 in a binary tree, but the stated definition uses branch nodes."},{"sec":15,"q":"Quadrant data, normalized error: CART grows both splits, then prunes with $\\alpha=0.1$. Greedy forward growth with the same $\\alpha$ returns the empty tree. What does grow-then-prune return?","o":["The empty tree","The one-split tree","It depends on whether Gini or entropy was used to grow","The full two-split tree"],"a":3,"x":"Pruning compares whole subtrees: two splits cost $0+0.2=0.2$ vs $0.25$ for the empty tree and $0.35$ for one split. Growing first exposes the hidden split, which is the point of grow-then-prune."},{"sec":15,"q":"Lec 9 slide 15 states the Optimal Trees aspiration as trees that are:","o":["Provably optimal and found in time polynomial in the number of training points","Globally optimal or near-optimal, found in times suited to the application","More accurate than every ensemble on every dataset","Always shallower than the corresponding CART tree grown on the same data"],"a":1,"x":"The aspiration is stated in practability terms: (near-)optimality within the application's time budget, not polynomial-time guarantees."},{"sec":15,"q":"Rec 5's slogan \"A strong decision maker is better than a committee\" contrasts:","o":["Gini impurity versus entropy as the splitting criterion for growth","Validation-set tuning versus $k$-fold cross-validation for choosing $\\alpha$","Axis-parallel splits versus hyperplane splits","One tree with all splits chosen jointly vs ensembles of greedy trees"],"a":3,"x":"Ensembles (RF, boosting) make up for a greedy tree's errors by averaging; Optimal Trees fix the single tree by optimizing it."},{"sec":16,"q":"For an OCT skeleton of depth $D=3$, the branch and leaf sets are:","o":["$\\mathcal B=\\{1,\\dots,7\\}$, $\\mathcal L=\\{8,\\dots,15\\}$","$\\mathcal B=\\{1,\\dots,8\\}$, $\\mathcal L=\\{9,\\dots,16\\}$","$\\mathcal B=\\{1,2,3\\}$, $\\mathcal L=\\{4,\\dots,7\\}$","$\\mathcal B=\\{1,\\dots,7\\}$, $\\mathcal L=\\{8,\\dots,14\\}$"],"a":0,"x":"$\\mathcal B=\\{1,\\dots,2^D-1\\}$ and $\\mathcal L=\\{2^D,\\dots,2^{D+1}-1\\}$, so 7 branch nodes and 8 leaves. $\\{1,2,3\\}$, $\\{4,\\dots,7\\}$ is $D=2$."},{"sec":16,"q":"In the $D=2$ skeleton, what are $A_L(6)$ and $A_R(6)$?","o":["$A_L(6)=\\{3\\}$, $A_R(6)=\\{1\\}$","$A_L(6)=\\{1\\}$, $A_R(6)=\\{3\\}$","$A_L(6)=\\{1,3\\}$, $A_R(6)=\\varnothing$","$A_L(6)=\\{2\\}$, $A_R(6)=\\{1\\}$"],"a":0,"x":"Leaf 6 is the left child of node 3, which is the right child of node 1: right at node 1, left at node 3. Swapping the sets is the common slip."},{"sec":16,"q":"In parallel OCT, what happens to the points at a branch node with $d_t=0$?","o":["All go left, because the threshold $b_t$ is 0 and every feature is at least 0","They are split evenly between the two children","All go right: $a_t=0$, $b_t=0$ make the left test impossible","They are dropped from the objective and counted as misclassified"],"a":2,"x":"$\\sum_j a_{jt}=d_t=0$ and $0\\le b_t\\le0$ give the left test $0<0$ (with $\\varepsilon$: $\\varepsilon\\le0$), never true, while $0\\ge0$ always holds."},{"sec":16,"q":"Which is the correct OCT hierarchy constraint?","o":["$d_t\\ge d_{p(t)}$ for $t\\in\\mathcal B\\setminus\\{1\\}$","$d_t\\le d_{p(t)}$ for $t\\in\\mathcal L$","$d_t\\le d_{p(t)}$ for $t\\in\\mathcal B\\setminus\\{1\\}$","$\\sum_{t\\in\\mathcal B}d_t\\le D$"],"a":2,"x":"A node may split only if its parent splits; the root has no parent, so it is excluded (Lec 9 slide 26 writes $\\forall t\\in\\mathcal B$, a slip). Leaves never split."},{"sec":16,"q":"With features scaled to $[0,1]$, valid big-M values in the parallel OCT routing constraints are:","o":["$n$ for both","$2$ for both","$1+\\varepsilon$ for left-branch constraints and $1$ for right-branch constraints","$1$ for left-branch constraints and $1+\\varepsilon$ for right-branch constraints"],"a":2,"x":"$a_m^Tx_i\\in[0,1]$ and $b_m\\in[0,1]$, so $a_m^Tx_i+\\varepsilon-b_m\\le1+\\varepsilon$ and $b_m-a_m^Tx_i\\le1$. $M=n$ is for the error constraints; $M=2$ is OCT-H."},{"sec":16,"q":"Why does the left-branch routing constraint contain $\\varepsilon$?","o":["To make the big-M constraint tighter","To penalize splits that fall near the edges of the scaled feature range $[0,1]$","To guarantee that at least $N_{\\min}$ points are routed left at every split node","Left is strict ($a^Tx<b$) but solvers need $\\le$; a point on the threshold could go either way"],"a":3,"x":"Without $\\varepsilon$, a point with $x_{i2}=0.5$ satisfies both $\\le0.5$ and $\\ge0.5$ at the XOR root (Rec 5 slide 26)."},{"sec":16,"q":"A scaled feature takes values $\\{0, 0.2, 0.25, 0.7, 1\\}$. Following Rec 5, $\\varepsilon$ should be:","o":["Below 0.05, the smallest gap between distinct values","Below 0.2, the smallest nonzero value","Below 0.45, the largest gap","Exactly 0.5, the midpoint of the range"],"a":0,"x":"An $\\varepsilon$ at or above a gap could make a valid split between two adjacent values impossible. The smallest gap is $0.25-0.2=0.05$."},{"sec":16,"q":"Leaf $t$ receives no points. Which constraint forces $l_t=0$?","o":["$l_t\\ge z_{it}$ for all $i$","$\\sum_i z_{it}\\ge N_{\\min}\\,l_t$","$\\sum_{t\\in\\mathcal L}z_{it}=1$","$L_t\\ge0$"],"a":1,"x":"With no points the left side is 0, so $0\\ge N_{\\min}l_t$ forces $l_t=0$. $l_t\\ge z_{it}$ forces $l_t=1$ when a point is present; it allows $l_t=0$ but does not force it."},{"sec":16,"q":"Leaf with $N_t=3$, $N_{Bt}=2$, $N_{Rt}=1$, $n=10$. If OCT sets $c_{Rt}=1$, $c_{Bt}=0$, the error constraints give:","o":["Infeasibility, since $L_t\\ge2$ and $L_t\\le1$","$L_t=2$","$L_t=1$","$L_t=0$"],"a":0,"x":"First line for R: $L_t\\ge3-1=2$. Second line for B: $L_t\\le3-2+0=1$. A leaf cannot predict a minority class (Rec 5 slide 29). Predicting B gives $L_t=1$."},{"sec":16,"q":"Lec 9 slide 26 omits $\\sum_k c_{kt}=l_t$. What can the solver then do?","o":["Assign two classes to the same leaf, which doubles that leaf's error count","Nothing changes, since the constraint is redundant","Route a single point to two leaves at once","Set every $c_{kt}=0$, so $L_t=0$ is feasible and errors vanish"],"a":3,"x":"With all $c_{kt}=0$ the \"$\\ge$\" lines are slack and only $0\\le L_t\\le\\min_k(N_t-N_{kt})$ remains, so $L_t=0$. Use the Rec 5 / Book (8.9) version."},{"sec":16,"q":"Why is $M=n$ a valid big-M in the OCT leaf-error constraints?","o":["There are at most $n$ leaves in the tree","The total error of the whole tree can never exceed $n/2$ for two classes","Each point appears in at most $n$ routing constraints across all leaves","$0\\le N_t-N_{kt}\\le n$, so $\\pm n$ makes each line vacuous when needed"],"a":3,"x":"The big-M must cover the largest value of the expression being relaxed, here the count $N_t-N_{kt}$, which never exceeds $n$."},{"sec":16,"q":"What is the role of the upper constraint $L_t\\le N_t-N_{kt}+n\\,c_{kt}$?","o":["Without it the optimal tree would label leaves with minority classes","It leaves the optimum unchanged but cuts minority-label solutions","It forces every leaf to contain at least one misclassified training point","It replaces the need for the $\\sum_t z_{it}=1$ constraint in the routing block"],"a":1,"x":"Minimizing already prefers a majority label, since a minority label only adds errors (Rec 5 slide 28). Removing those solutions from the feasible set helps the solver."},{"sec":16,"q":"Why does the OCT MIO minimize misclassification instead of Gini or entropy?","o":["Gini and entropy give worse test accuracy than misclassification in every experiment","Gini and entropy are nonlinear in $N_{kt}/N_t$; misclassification linearizes","Misclassification is strictly concave, which the MIO requires","Gini and entropy cannot be computed for leaves with few points"],"a":1,"x":"A linear MIO needs a linear objective. Since the MIO is global, the greedy-growth reason for impurities also disappears; local search can use either."},{"sec":16,"q":"An OCT MIO with $n=2000$ and $D=3$ has how many $z_{it}$ variables?","o":["6,000","14,000","16,000","48,000"],"a":2,"x":"$n\\cdot2^D=2000\\times8=16{,}000$. 6,000 is $nD$, 14,000 counts branch nodes $n(2^D-1)$, and 48,000 is the routing-constraint count $n2^DD$."},{"sec":16,"q":"How many routing constraints does the OCT MIO have for $n=1000$, $D=3$?","o":["8,000","3,000","24,000","48,000"],"a":2,"x":"Each point has one constraint per ancestor ($D$) per leaf ($2^D$): $1000\\times8\\times3=24{,}000$. 8,000 is the $z$ count; 48,000 double-counts by writing both a left and a right constraint for each ancestor, when each ancestor is in exactly one of $A_L(t)$, $A_R(t)$."},{"sec":16,"q":"In \"point $i$ goes left iff $a_t^Tx_i<b_t$\", which quantities does the solver choose?","o":["$a_t$, $b_t$ and $x_i$","$a_t$ and $b_t$","$x_i$ only","$a_t$, $b_t$ and the depth $D$"],"a":1,"x":"$x_i$ is data and $D$ is a hyperparameter. With $x_i$ fixed, $a_t^Tx_i$ is linear in $a_t$, so the constraints stay linear (Rec 5 poll)."},{"sec":16,"q":"Variant of Rec 5: $\\hat L=5$, the XOR tree has 3 splits and 0 errors, and some other tree has 2 splits and 2 errors. The MIO prefers the XOR tree iff:","o":["$\\alpha<0.2$","$\\alpha<2$","$\\alpha>0.4$","$\\alpha<0.4$"],"a":3,"x":"XOR $3\\alpha$ vs $\\frac25+2\\alpha$: XOR wins iff $\\alpha<0.4$. With 1 error (the actual greedy tree) the threshold is 0.2; forgetting $\\hat L$ gives 2."},{"sec":16,"q":"1000 training points, 700 of class 1 and 300 of class 2. A tree with 2 splits misclassifies 60 points. With $\\alpha=0.01$, its OCT objective is:","o":["0.08","0.22","0.20","60.02"],"a":1,"x":"$\\hat L=300$ (errors of the no-split tree predicting the majority). $60/300+0.01\\times2=0.22$. 0.08 divides by $n$; 60.02 forgets to normalize."},{"sec":16,"q":"Lec 9 writes $N_{kt}=\\sum_i\\frac12(1+Y_{ik})z_{it}$. Here $Y_{ik}$ is:","o":["$+1$ if $y_i=k$ and $-1$ otherwise","$1$ if $y_i=k$ and $0$ otherwise","The predicted probability of class $k$ for point $i$","$+1$ if point $i$ is in leaf $k$ and $-1$ otherwise"],"a":0,"x":"Then $\\frac12(1+Y_{ik})$ is the 0/1 indicator of $y_i=k$, matching $\\sum_{i:y_i=k}z_{it}$. If $Y_{ik}$ were already 0/1, the formula would give 1/2 for other classes."},{"sec":16,"q":"Which advantage does the OCT MIO offer that greedy CART and local search do not?","o":["Faster training than CART on large datasets","The use of an impurity measure during tree growth","Automatic selection of the depth $D$ without validation","A certificate: proof of optimality or a gap bound"],"a":3,"x":"Rec 5 slide 17: certificate, flexibility, tractability now. Local search is much faster than the MIO but gives only a local optimum; $D$ remains a hyperparameter."},{"sec":17,"q":"In OCT-H, the split coefficients $a_t$ satisfy:","o":["$a_t\\in\\{0,1\\}^p$ with $\\sum_j a_{jt}=d_t$","$a_t\\in[0,1]^p$ with $\\sum_j a_{jt}=1$","$a_t\\in[-1,1]^p$ with $\\sum_j\\lvert a_{jt}\\rvert\\le d_t$","$a_t\\in\\mathbb R^p$ with $\\|a_t\\|_2\\le d_t$"],"a":2,"x":"Integrality is relaxed and the sum is replaced by a 1-norm bound tied to $d_t$. The binary version is parallel OCT; a 2-norm would not linearize."},{"sec":17,"q":"In OCT-H, the threshold $b_t$ is constrained by:","o":["$0\\le b_t\\le d_t$","$-d_t\\le b_t\\le d_t$","$0\\le b_t\\le1$","$-1\\le b_t\\le1$ regardless of $d_t$"],"a":1,"x":"With negative coefficients allowed, $a_t^Tx$ ranges over $[-1,1]$, so the threshold must too; tying it to $d_t$ keeps $b_t=0$ when the node does not split. $0\\le b_t\\le d_t$ is parallel OCT."},{"sec":17,"q":"Why is the routing big-M equal to 2 in OCT-H?","o":["Each hyperplane split uses at least two features, each contributing up to 1","The tree has two children per node","$a_t^Tx_i$ and $b_t$ both lie in $[-1,1]$, so $a_t^Tx_i-b_t\\in[-2,2]$","$\\varepsilon$ is replaced by $\\mu=1$, which adds 1 to the usual big-M"],"a":2,"x":"The big-M must cover the largest possible violation $a_t^Tx_i-b_t$. In parallel OCT both terms are in $[0,1]$, so $M=1$ (or $1+\\varepsilon$)."},{"sec":17,"q":"Why can't OCT-H set $\\varepsilon$ to the smallest gap between feature values, as OCT does?","o":["Feature gaps are not defined once features are scaled to $[0,1]$","OCT-H uses no strict inequalities, so $\\varepsilon$ is not needed at all in routing","A hyperplane can pass arbitrarily close to a point, so no minimum gap exists","The smallest gap would always exceed the big-M of 2, making the constraint invalid"],"a":2,"x":"For axis-parallel splits only the gaps along one coordinate matter. For hyperplanes, separation depends on the direction, which can be tuned continuously; use a small constant (Book: $\\mu=0.005$)."},{"sec":17,"q":"(Book) The Book's OCT-H left-routing constraint is:","o":["$a_m^Tx_i+\\mu\\le b_m+(2+\\mu)(1-z_{it})$","$a_m^Tx_i+\\mu\\le b_m+(1+\\mu)(1-z_{it})$","$a_m^Tx_i\\ge b_m-(2+\\mu)(1-z_{it})$","$a_m^T(x_i+\\boldsymbol\\epsilon)\\le b_m+(1+\\epsilon_{\\max})(1-z_{it})$"],"a":0,"x":"The big-M is 2 plus the margin $\\mu$. $1+\\mu$ is the parallel-split big-M; the per-feature $\\boldsymbol\\epsilon$ form is Lec 9's parallel OCT constraint."},{"sec":17,"q":"The OCT-H complexity term penalizes:","o":["Features used across all splits, $\\alpha\\sum_t\\sum_j s_{jt}$","The number of splits, $\\alpha\\sum_t d_t$","The sum of absolute coefficients over all splits, $\\alpha\\sum_t\\|a_t\\|_1$","The depth of the tree, $\\alpha D$"],"a":0,"x":"One hyperplane split can use many features, so each feature used costs $\\alpha$. When every split uses one feature, this reduces to OCT's split count."},{"sec":17,"q":"An OCT-H tree has a root split using 3 features and one child split using 1 feature. With $\\alpha=0.01$, its complexity term is:","o":["0.02","0.04","0.03","0.01"],"a":1,"x":"$\\alpha\\sum_{t,j}s_{jt}=0.01\\times(3+1)=0.04$. 0.02 counts splits, as in parallel OCT."},{"sec":17,"q":"Which constraint guarantees that a node with $d_t=1$ uses at least one feature in OCT-H?","o":["$s_{jt}\\le d_t$","$\\sum_j s_{jt}\\ge d_t$","$-s_{jt}\\le a_{jt}\\le s_{jt}$","$\\sum_j\\hat a_{jt}\\le d_t$"],"a":1,"x":"$s_{jt}\\le d_t$ turns all $s$ off when the node does not split; $-s\\le a\\le s$ zeroes unused coefficients; $\\sum_j s_{jt}\\ge d_t$ forces at least one feature on when it splits."},{"sec":17,"q":"Together with $\\sum_j\\hat a_{jt}\\le d_t$, which constraints correctly model $\\sum_j\\lvert a_{jt}\\rvert\\le d_t$?","o":["$\\hat a_{jt}\\le a_{jt}$ and $\\hat a_{jt}\\le-a_{jt}$","$\\hat a_{jt}=a_{jt}$","$\\hat a_{jt}\\ge a_{jt}$ only","$\\hat a_{jt}\\ge a_{jt}$ and $\\hat a_{jt}\\ge-a_{jt}$"],"a":3,"x":"$\\hat a_{jt}\\ge\\lvert a_{jt}\\rvert$, so bounding $\\sum\\hat a$ bounds $\\sum\\lvert a\\rvert$. With $\\hat a\\ge a$ only, large negative coefficients would escape the bound."},{"sec":17,"q":"How much harder is the OCT-H MIO than the parallel OCT MIO, per Lec 9 slide 29?","o":["Exponentially harder, because there are exponentially many candidate hyperplanes","About $p$ times harder, since it needs one MIO per feature","Unsolvable, because the coefficients are continuous","About as easy: size and difficulty barely change"],"a":3,"x":"Exponentially many candidates is the problem for greedy enumeration, not for MIO, where the formulation keeps a similar structure and size."},{"sec":17,"q":"Two classes are separated by the line $x_1+x_2=1$. Which describes the shallowest exact trees?","o":["OCT-H: depth 1; parallel: a staircase of many splits","Both need depth 1","OCT-H needs depth 2, because each split may use only one feature at a time","A parallel tree needs depth 1 with the single threshold $x_1<0.5$"],"a":0,"x":"One hyperplane $x_1+x_2<1$ separates the classes; axis-parallel splits approximate the diagonal with one level per step (Rec 5 slide 39)."},{"sec":17,"q":"Lec 9 slide 54 compares a parallel OCT and an OCT-H tree at 99.5% test accuracy. Their depths are:","o":["OCT depth 5, OCT-H depth 2","OCT depth 2, OCT-H depth 5","OCT depth 7, OCT-H depth 4","Both depth 4"],"a":0,"x":"The hyperplane tree is far smaller (two splits, one of them parallel). Each hyperplane split is harder to read, but the tree as a whole may be easier."},{"sec":17,"q":"Rec 5 says feature scaling matters for OCT-H. Why does rescaling a feature leave the partitions available to axis-parallel splits unchanged but not those of OCT-H?","o":["Parallel splits are chosen by Gini, which is scale-invariant, while OCT-H uses misclassification","OCT-H measures squared distances from points to the hyperplane, which depend on units","A parallel threshold just rescales; the hyperplanes allowed by $\\|a_t\\|_1\\le1$ change","Rescaling changes the class labels seen by OCT-H but not by OCT"],"a":2,"x":"Monotone rescaling preserves the order of values along one axis, so the same splits exist. A hyperplane's coefficients trade features off against each other under a fixed 1-norm budget, so units matter; IAI scales to $[0,1]$ by default."},{"sec":17,"q":"(Book) How do you recover parallel OCT from the OCT-H model?","o":["Set $\\alpha=0$ in the OCT-H objective so no feature is penalized","Restore binary $a_{jt}$ with $\\sum_j a_{jt}=d_t$, $b_t\\ge0$","Set $\\mu=0$ in the routing constraints","Fix $s_{jt}=1$ for every feature $j$ and every branch node $t$"],"a":1,"x":"The two formulations nest; restoring integrality gives OCT. $\\alpha=0$ only removes the penalty, and $s_{jt}=1$ would force every feature into every split."},{"sec":17,"q":"What reason does Lec 9 slide 27 give for using the 1-norm in $\\|a_t\\|_1\\le1$?","o":["The 1-norm can be linearized easily","The 1-norm is the only norm that keeps $a_t$ binary","The 1-norm makes the split thresholds unique","The 1-norm equals the number of features used"],"a":0,"x":"With auxiliary variables $\\hat a_{jt}\\ge\\pm a_{jt}$ the bound becomes linear, keeping a linear MIO. The 1-norm is not a count; the count is $\\sum_j s_{jt}$."},{"sec":17,"q":"In OCT-H, the constraint $-s_{jt}\\le a_{jt}\\le s_{jt}$ enforces:","o":["Every coefficient $a_{jt}$ is either $-1$ or $1$","The split at node $t$ uses exactly one feature","Feature $j$ is used at a node whenever it is used at that node's parent","$s_{jt}=0$ forces $a_{jt}=0$"],"a":3,"x":"It links the continuous coefficient to the binary usage indicator so the penalty $\\alpha\\sum s_{jt}$ counts features actually in the split."},{"sec":17,"q":"OCT-H node with $a_t=(0.5,-0.5)$ and $b_t=0.2$. Point $x=(0.9,0.1)$ goes:","o":["Left, since $a_t^Tx=0.4<0.5$","Left, since $a_t^Tx=-0.4<0.2$","Right, since $a_t^Tx=0.5\\ge0.2$","Right, since $a_t^Tx=0.4\\ge0.2$"],"a":3,"x":"$0.5\\times0.9-0.5\\times0.1=0.4$. The left test needs $0.4+\\mu\\le0.2$, which fails; the right test $0.4\\ge0.2$ holds. −0.4 flips the sign of the product."},{"sec":17,"q":"Moving from OCT to OCT-H, which component changes?","o":["The hierarchy constraint $d_t\\le d_{p(t)}$","The minimum-leaf-size constraints","The big-M in the routing constraints","The linearization of the leaf errors $L_t$"],"a":2,"x":"Kept: $d_t$ switch, hierarchy, routing structure, leaf size, labels and errors (Rec 5 slide 40). Changed: split block, threshold range, big-M (1 → 2), $\\varepsilon$, complexity term."},{"sec":17,"q":"(Book) In OCT-H, what is the tradeoff in choosing the margin $\\mu$?","o":["Too small cuts off valid hyperplanes; too large causes numerical issues","Too small causes numerical issues; too large cuts off valid hyperplanes","Too small makes the big-M invalid; too large makes the MIO infeasible","Too small increases the number of features used; too large decreases it"],"a":1,"x":"The Book uses $\\mu=0.005$. A large margin forbids hyperplanes passing close to points; a tiny one makes the strict inequality numerically meaningless."},{"sec":17,"q":"Which statement about OCT-H interpretability matches Lec 9?","o":["Hyperplane trees are always more interpretable than parallel trees of any depth","Hyperplane trees cannot be drawn or read as trees at all","OCT-H gives up about 3% accuracy relative to CART in exchange for interpretability","Each split is harder to read, but the tree can be much smaller and splits stay sparse"],"a":3,"x":"Slide 54: OCT-H reaches the same 99.5% at depth 2 vs 5. OCT-H gains about 3.9% accuracy over CART on average; it does not give up accuracy."},{"sec":18,"q":"Running the OCT MIO directly with Gurobi on Banknote ($n=1372$, $p=4$) gave:","o":["Large improvements over CART at every depth, each tree solved in under a second","Small gains over CART, but each tree hit the 2-hour limit (CART: 0.12 s)","Worse training error than CART at every depth","Proven optimal trees at all depths within a few minutes per tree"],"a":1,"x":"Lec 9 slide 31. The Book adds that optimality was proven only at depth 1 and at depth 6 Gurobi did not get past the root node."},{"sec":18,"q":"The key observation behind OCT local search (Lec 9 slide 33) is that:","o":["Given the splits, routing, labels and error are closed form","The LP relaxation of the OCT MIO is always integral at depth 2 or less","Gini impurity is a valid lower bound on misclassification","Leaf labels determine the splits uniquely, so only labels need to be searched"],"a":0,"x":"Route points by the splits, label each leaf by majority, count errors. The decision space is the splits."},{"sec":18,"q":"The reduced decision space searched by local search scales:","o":["Independent of $n$; linear in $p$ and the number of splits","Linearly in $n$ and exponentially in the depth $D$, like the MIO","Quadratically in $n$","Exponentially in $p$, since every feature subset is a candidate"],"a":0,"x":"Only $a$, $b$ are searched. The MIO, by contrast, carries $n\\cdot2^D$ binaries $z_{it}$, terrible scaling in both $n$ and $D$."},{"sec":18,"q":"In local search, how is a branch node whose children are subtrees re-optimized?","o":["Modified CART: try each split, route points into the fixed subtrees, relabel, keep the best","Apply standard CART to replace the node and its subtrees with two new leaves","Solve the full MIO restricted to that node's subtree","Delete the subtree below the node and regrow it greedily using Gini impurity"],"a":0,"x":"Same search as CART but with a more complicated error calculation (Lec 9 slide 38). Plain CART is used for leaves and for branch nodes with two leaf children."},{"sec":18,"q":"When local search visits a leaf node, it:","o":["Relabels the leaf with the minority class","Merges it with its sibling leaf","Leaves it unchanged, since only branch nodes are re-optimized","Applies CART to split the leaf into two new leaves"],"a":3,"x":"Lec 9 slide 36: a leaf can grow a new split, chosen CART-style; it is kept only if it improves the objective."},{"sec":18,"q":"Which is NOT one of the moves at node $t$ in Optimal Trees local search (Book Alg. 8.2)?","o":["Replace the split at $t$ with the best new split $x_{j'}<b'$","Swap the left and right subtrees of a different node","Replace node $t$ with its left subtree","Replace node $t$ with its right subtree"],"a":1,"x":"The three moves are new split, left subtree, right subtree (Rec 5 slide 36). Moves act on the visited node only."},{"sec":18,"q":"On Banknote, 100 random restarts of local search took:","o":["2 hours, the same as the MIO","0.98 s, vs 0.12 s for CART","0.12 s, the same as CART","About 100 s, 1 s per restart"],"a":1,"x":"About 10× CART's time and far below the MIO's 2-hour limit, while beating both CART and the Gurobi-based method (Lec 9 slide 39)."},{"sec":18,"q":"Rec 5: local search started from the greedy tree (1 error) stops immediately. Why?","o":["Local search is not allowed to change the root split of its starting tree","No single move lowers its error: it is already a local optimum","The greedy tree violates $N_{\\min}$","Local search only accepts moves that reduce the number of splits in the tree"],"a":1,"x":"Any other root split gives at least 2 errors and $x_2<0.65$ is already best at node 3. Different starts reach different local optima, hence restarts."},{"sec":18,"q":"Rec 5: start from \"root $x_2<0.5$, two leaves\" (5 errors). After visiting node 2 and applying \"new split\" $x_1<0.5$, how many errors remain?","o":["0","1","2","5"],"a":2,"x":"Node 2's leaves become $\\{1,2,3\\}$ (B) and $\\{8,9,10\\}$ (R), both pure; the right child of the root still holds 2B/2R, so 2 errors. Visiting node 3 next gives 0 (the XOR tree)."},{"sec":18,"q":"What does OCT local search guarantee about its output?","o":["A global optimum for depth up to 4","A bound on the optimality gap","Only a local optimum; no optimality certificate","A tree at least as good as the MIO's at the same time limit"],"a":2,"x":"Only the MIO gives a proof or gap. Local search beats the time-limited MIO in practice, but that is an empirical result, not a guarantee."},{"sec":18,"q":"How does a CART warm start help the OCT MIO?","o":["It supplies an incumbent at once, so branch-and-bound prunes more","It tightens the LP relaxation by adding valid cuts derived from CART's splits","It reduces the number of $z_{it}$ variables","It changes the optimal objective value of the MIO to CART's value"],"a":0,"x":"An incumbent is an upper bound; nodes whose relaxation is worse are pruned. The optimum is unchanged."},{"sec":18,"q":"(Book) Wine, $D=2$: without a warm start the optimum was found at 270 s and proven 1,360 s later; with a CART warm start, found at 105 s and proven 230 s later. Total speedup is about:","o":["2.6×","5.9×","4.9×","1.6×"],"a":2,"x":"$(270+1360)/(105+230)=1630/335\\approx4.9$. 2.6× compares only time-to-find, 5.9× only proof time. Most time goes to proving optimality."},{"sec":18,"q":"(Book) Local-search starting trees are CART trees grown on random feature subsets without bootstrapping. Why no bootstrap?","o":["Bootstrapping would make CART deterministic and give identical starting trees","Bootstrapped trees are always deeper than $D$","So every start satisfies $N_{\\min}$ on the real training set","Bootstrapping would remove the need for random feature subsets in the starts"],"a":2,"x":"Random $\\sqrt p$ feature subsets give diverse, good starts (CART alone is deterministic: one start). Bootstrapped rows could produce leaves that violate $N_{\\min}$ on the actual data."},{"sec":18,"q":"How does local search optimize a single hyperplane split (Lec 9 slide 40)?","o":["Solve an LP over all coefficients jointly at the node","Enumerate all $2^p\\binom{n}{p}$ candidate hyperplanes and keep the best","Fit a logistic regression at the node and use its coefficients as the split","Coordinate descent, one coefficient at a time, with random restarts"],"a":3,"x":"A one-node MIO works but does not scale. Coordinate descent repeats until no improvement and restarts from random hyperplanes (Book: including the best parallel split)."},{"sec":18,"q":"(Book) Under realistic assumptions, OCT local search runs in $O(npK\\log^2n)$. How does that compare with CART?","o":["A factor $n$ slower than CART's $O(npK\\log n)$","Only a $\\log n$ factor slower than CART's $O(npK\\log n)$","Exponentially slower in $D$","Faster than CART, which is $O(n^2pK)$"],"a":1,"x":"The worst case is $O(n^2pK)$ vs $O(npK)$, but realistically the gap is one $\\log n$ factor, and restarts parallelize linearly."},{"sec":18,"q":"(Book) Each extra level of depth doubles the $z_{it}$ count and costs roughly an order of magnitude in MIO solve time. Going from depth 3 to depth 5 costs about:","o":["4× the time","10× the time","100× the time","2× the time"],"a":2,"x":"Two doublings of $z$, each about 10×, give roughly 100×. 4× is the growth in $z$ itself, not in time."},{"sec":18,"q":"(Book) Why is it reasonable to stop the OCT MIO before optimality is proven?","o":["The MIO's first feasible solution is always optimal once a warm start is supplied","The lower bound is always tight after the root node","Stopping early prevents overfitting by design, acting as a form of regularization","Most time goes to raising the bound; a stable incumbent is usually near-optimal"],"a":3,"x":"Finding good trees is fast; proving them optimal is slow. Other methods make no optimality claim at all."},{"sec":18,"q":"(Book) $\\alpha$ is continuous. Why can it nonetheless be tuned exactly?","o":["Only integer values of $\\alpha$ are meaningful in the OCT objective","The MIO's dual variables give the optimal $\\alpha$ directly","$\\alpha$ has no effect on the tree once the depth $D$ is fixed in advance","The tree changes only at critical values, which can all be tested"],"a":3,"x":"Each tree is optimal on an interval of $\\alpha$, as in CART's cost-complexity pruning, so testing the breakpoints covers all of them."},{"sec":18,"q":"(Book) What tuning procedure does the Book recommend for Optimal Trees (Alg. 8.4)?","o":["Grid search over $N_{\\min}$ with $D$ and $\\alpha$ held fixed at default values","Random search over $\\alpha$ only, with $D$ unlimited","Bayesian optimization over $(D, N_{\\min}, \\alpha)$ jointly","Grid over $D$, batch cost-complexity pruning for $\\alpha$, $N_{\\min}=1$"],"a":3,"x":"Fixing $N_{\\min}=1$ loses little, and the $\\alpha$ path comes almost free from critical values."},{"sec":18,"q":"When does a single local search run terminate?","o":["When a full pass over the nodes finds no improving move","After a fixed number of nodes have been visited, set as a hyperparameter","When the tree reaches maximum depth $D$","When the training error reaches 0 or the time limit is hit, whichever comes first"],"a":0,"x":"Each improvement restarts the pass on the new tree; a pass with no improvement means a local optimum. Restarts are then independent, so they parallelize."},{"sec":19,"q":"A true tree has 4 splits. A learned tree has 5 splits, 3 of which appear in the true tree. Its true and false discovery rates are:","o":["TDR 0.6, FDR 0.25","TDR 0.75, FDR 0.25","TDR 0.6, FDR 0.4","TDR 0.75, FDR 0.4"],"a":3,"x":"TDR = truth splits recovered / truth splits $=3/4$. FDR = learned splits not in truth / learned splits $=2/5$. Swapping denominators gives 0.6 and 0.25."},{"sec":19,"q":"In the synthetic experiments, OCT's advantage over CART in discovering the true tree was mainly:","o":["Large gains in true discovery and no change in false discovery","Small gains in true discovery and large reductions in false discovery","Lower test accuracy but fewer splits","No difference in structure, only in run time"],"a":1,"x":"Lec 9 slide 49: fewer spurious splits is what makes OCT \"significantly better for interpretation\"."},{"sec":19,"q":"In the synthetic experiments, the OCT–CART performance gap:","o":["Grows as the problem gets harder, with fewer points or more features","Shrinks as the problem gets harder, with fewer points or more features","Disappears once label noise exceeds 5%","Is constant across all settings"],"a":0,"x":"As $n\\downarrow$ or $p\\uparrow$ the gap widens, and OCT stays stronger even under very large feature or label noise."},{"sec":19,"q":"The Lec 9 real-world benchmark used:","o":["60 UCI datasets with a single 50/50 train/test split per dataset","60 UCI datasets, 75/25 splits, 5 repeats","10 synthetic datasets, 400 repeats","60 UCI datasets evaluated by 10-fold cross-validation only"],"a":1,"x":"$n$ from 50 to 245,000, $p$ from 2 to 500, $K$ from 2 to 10. The Book version uses 61 datasets and a 50/25/25 split with validation tuning; 400 repeats are the synthetic experiments."},{"sec":19,"q":"Lec 9 slide 76 reports average accuracy gains over CART of:","o":["OCT 3.9%, OCT-H 1.3%","OCT 1%, OCT-H 1.3%","OCT 0.5%, OCT-H 10%","OCT 1.3%, OCT-H 3.9%"],"a":3,"x":"\"Optimization edge: 1.3%\"; \"Optimization + hyperplanes: 3.9%\". Slide 59 rounds the OCT gain to 1%."},{"sec":19,"q":"On Lec 9 slide 56 (accuracy vs maximum depth, 60 datasets), which describes XGBoost and OCT-H?","o":["OCT-H beats XGBoost at every depth, including depth 1, by a wide margin","XGBoost improves steadily with depth while OCT-H stays flat","XGBoost is flat near 0.84–0.86; OCT-H starts lower and catches it by depth 3–4","OCT-H never reaches XGBoost's accuracy at any depth up to 10"],"a":2,"x":"OCT-H is about 0.75 at depth 1 and about 0.86 by depth 3–4. OCT and RF reach about 0.84 at depth 10; CART is lowest."},{"sec":19,"q":"Lec 9 slide 53 compares trees on one dataset. Which is correct?","o":["CART 98.3% at depth 4 with 7 splits; OCT 98.3% at depth 7 with 15 splits","CART 99.1% at depth 6; OCT 98.3% at depth 4","CART 98.3% at depth 7 with 15 splits; OCT 98.3% at depth 4 with 7 splits","CART and OCT both 99.5% at depth 5"],"a":2,"x":"OCT matches CART's accuracy with a tree about half the size, or reaches 99.1% at depth 6 with 12 splits."},{"sec":19,"q":"PECARN, children under 2: CT scans ordered under CART vs OCT, and ciTBI missed?","o":["CART 47.9% of patients, OCT 26.6%; 1 missed by each","CART 26.6%, OCT 47.9%; 1 missed by each","CART 43.9%, OCT 35.0%; 8 vs 4 missed","CART 47.9%, OCT 26.6%; 8 vs 4 missed"],"a":0,"x":"5,132 vs 2,856 scans with the same sensitivity. 43.9% vs 35.0% and 8 vs 4 misses are the 2-and-older group."},{"sec":19,"q":"PECARN, children aged 2 and older: what happened to missed ciTBI?","o":["Unchanged at 1 for both","Halved, from 8 under CART to 4 under OCT","Doubled, from 4 to 8","Eliminated, from 8 to 0"],"a":1,"x":"OCT also cut scans from 43.9% to 35.0% of patients. The 1-vs-1 result is the under-2 group."},{"sec":19,"q":"Under-2 test set, OCT: of 2,127 children without ciTBI, 459 got a CT and 1,668 did not. OCT's specificity is:","o":["78.4%","21.6%","53.2%","100%"],"a":0,"x":"Specificity = true negatives / all negatives $=1668/2127=78.4\\%$. 21.6% is the false-positive rate, 53.2% is CART's test specificity, 100% is the sensitivity (17/17)."},{"sec":19,"q":"Aged ≥2, OCT confusion matrices: training CT = 241 ciTBI + 9,020 no ciTBI; test CT = 33 + 1,804. Total CT scans?","o":["11,098","9,261","1,837","13,928"],"a":0,"x":"$241+9020+33+1804=11{,}098$, 35.0% of 31,694 children. 9,261 is training only, 1,837 test only, 13,928 is CART's total."},{"sec":19,"q":"Why is PECARN a clean real-world test of OCT?","o":["OCT was used to collect the data prospectively in the emergency departments","The data are synthetic, so the true tree is known","CART is already practice and the data exist, so only the learner changes","Doctors cannot read CART trees but can read OCT trees, so adoption is easier"],"a":2,"x":"Kuppermann et al. (Lancet 2009) built CART trees now used in practice; applying OCT in exactly the same approach isolates the effect of optimization."},{"sec":19,"q":"Why is specificity at fixed sensitivity the right lens for the PECARN study?","o":["Missed ciTBI is unacceptable, and CT radiation carries real cancer risk","ciTBI is the majority class, so overall accuracy is uninformative here","Sensitivity cannot be estimated when fewer than 1% of patients are positive","CT scans have no medical risk, only a monetary cost"],"a":0,"x":"Detection must stay near 100%, so the gain is in avoided scans. Risk rises as age decreases, so the under-2 gain matters most."},{"sec":19,"q":"Moving from OCT to ORT (Rec 5), which vari
