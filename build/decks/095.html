<script>
(function(){
const D = JSON.parse(document.getElementById('data').textContent);
const SECS = D.sections, CARDS = D.cards, MC = D.mc, WR = D.wr;
const $ = (s, el=document) => el.querySelector(s);
const main = $('#main'), side = $('#side');

// ---------- storage (per-viewer convenience) ----------
const store = {
  get(k, d){ try { const v = localStorage.getItem('sd.'+k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('sd.'+k, JSON.stringify(v)); } catch(e){} }
};
const S = Object.assign({ mode:'cards', sec:'all', book:true, filter:'all', shuffle:false, qtype:'mc', qcount:10 }, store.get('settings', {}));
let progress = store.get('progress', {});   // card index -> 'k' | 'l'
const save = () => { store.set('settings', S); store.set('progress', progress); };

// ---------- text rendering ----------
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function md(s){
  const parts = s.split(/(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$)/g);
  return parts.map((p,i) => {
    if (i % 2) return esc(p);
    let h = esc(p);
    h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
    h = h.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    h = h.replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\*)/g, '$1<em>$2</em>');
    h = h.replace(/\n/g, '<br>');
    return h;
  }).join('');
}
function typeset(el){
  if (!el || !window.MathJax || !MathJax.typesetPromise) return;
  try { MathJax.typesetClear && MathJax.typesetClear([el]); } catch(e){}
  MathJax.typesetPromise([el]).catch(()=>{});
}
const secName = n => { const s = SECS.find(x => x.id === n); return s ? s.name : ''; };
const shuffleArr = a => { const b = a.slice(); for (let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const pct = (a,b) => b ? (100*a/b).toFixed(1) : '0.0';

// ---------- filters ----------
const isBookQ = q => /^\(Book\)/.test(q.q);
const cardIdx = () => CARDS.map((c,i)=>i).filter(i => (S.sec==='all' || CARDS[i].s===+S.sec) && (S.book || !CARDS[i].bk));
const pool = arr => arr.filter(q => (S.sec==='all' || q.sec===+S.sec) && (S.book || !isBookQ(q)));

// ---------- toolbar ----------
const secSel = $('#sec'), bookCb = $('#book');
function fillSections(){
  const cnt = n => CARDS.filter(c => c.s===n && (S.book || !c.bk)).length;
  const all = CARDS.filter(c => S.book || !c.bk).length;
  secSel.innerHTML = `<option value="all">All sections (${all} cards)</option>` +
    SECS.map(s => `<option value="${s.id}">${s.id}. ${esc(s.name)} (${cnt(s.id)})</option>`).join('');
  secSel.value = String(S.sec);
}
secSel.addEventListener('change', () => { S.sec = secSel.value==='all' ? 'all' : +secSel.value; save(); resetDeck(); render(); });
bookCb.checked = S.book;
bookCb.addEventListener('change', () => { S.book = bookCb.checked; save(); fillSections(); resetDeck(); render(); });
$('#m-cards').addEventListener('click', () => setMode('cards'));
$('#m-quiz').addEventListener('click', () => setMode('quiz'));
function setMode(m){ S.mode = m; save(); $('#m-cards').setAttribute('aria-pressed', m==='cards'); $('#m-quiz').setAttribute('aria-pressed', m==='quiz'); render(); }

// ---------- side panel ----------
function renderSide(){
  if (S.mode === 'quiz' && Q.run) { renderQuizSide(); return; }
  const rows = SECS.map(s => {
    const idx = CARDS.map((c,i)=>i).filter(i => CARDS[i].s===s.id && (S.book || !CARDS[i].bk));

      <span class="ct">${k}/${n}</span>
      <span class="bar"><i class="k" style="width:${n?100*k/n:0}%"></i><i class="l" style="width:${n?100*l/n:0}%"></i></span></button>`;
  }).join('');
  const allIdx = cardIdx();
  side.innerHTML = `<h2>Sections · cards known</h2>
    <div class="legend"><span class="k">Got it</span><span class="l">Learning</span><span class="u">Unseen</span></div>
    <div>${rows}</div>
    <button class="secrow" type="button" data-s="all" aria-current="${S.sec==='all'}"><span class="n">∑</span><span class="nm">All sections</span><span class="ct">${CARDS.filter((c,i)=>progress[i]==='k'&&(S.book||!c.bk)).length}/${CARDS.filter(c=>S.book||!c.bk).length}</span></button>
    <p class="hint">Progress is saved in this browser only.</p>`;
  side.querySelectorAll('.secrow').forEach(b => b.addEventListener('click', () => {

// ---------- flashcards ----------
let deck = [], pos = 0, flipped = false;
function resetDeck(){
  let idx = cardIdx();
  if (S.filter === 'learning') idx = idx.filter(i => progress[i]==='l');
  if (S.filter === 'unseen') idx = idx.filter(i => !progress[i]);
  if (S.filter === 'notknown') idx = idx.filter(i => progress[i]!=='k');
  deck = S.shuffle ? shuffleArr(idx) : idx;
  pos = 0; flipped = false;
  if (Q.run && S.mode==='quiz') {} // quiz keeps its own run
}
function renderCards(){
  const all = cardIdx();
  const k = all.filter(i=>progress[i]==='k').length, l = all.filter(i=>progress[i]==='l').length;
  const head = `
    <div class="row spread">
      <div class="row">
        <label class="field" for="filt">Show

            <option value="all">All cards</option>

            <option value="learning">Still learning</option>
            <option value="unseen">Unseen</option>

      </div>

    </div>
    <div class="log"><span>cards <b>${all.length}</b></span><span class="inc">got it <b>${k}</b></span><span>learning <b>${l}</b></span><span>unseen <b>${all.length-k-l}</b></span><span>mastery <b>${pct(k,all.length)}%</b></span></div>`;
  if (!deck.length){
    main.innerHTML = head + `<div class="card"><div class="empty">No cards match this view. Switch "Show" back to All cards or pick another section.</div></div>`;

  }

  main.innerHTML = head + `
    <article class="card" aria-live="polite">
      <div class="card-head">
        <div class="tags">
          <span class="tag kind">${c.t==='term'?'Term':'Question'}</span>

      ${flipped ? `
        <div class="ans">${md(c.b)}</div>

      ` : `<div class="cover" id="flip" role="button" tabindex="0">${c.t==='term'?'Recall the definition, then':'Answer it in your head, then'} reveal <span class="kbd">Space</span></div>`}
      <div class="row spread">
        <div class="row">
          <button class="btn" id="prev" type="button" ${pos===0?'disabled':''}>← Prev</button>

        </div>
        ${flipped ? `<div class="row">
          <button class="btn bad" id="r-l" type="button">Still learning <span class="kbd">1</span></button>
          <button class="btn good" id="r-k" type="button">Got it <span class="kbd">2</span></button>
        </div>` : `<button class="btn primary" id="show" type="button">Show answer</button>`}
      </div>
    </article>

  wireCardHead();
  const f = () => { flipped = true; renderCards(); };
  $('#flip') && $('#flip').addEventListener('click', f);
  $('#flip') && $('#flip').addEventListener('keydown', e => { if (e.key==='Enter') f(); });

function wireCardHead(){
  const fs = $('#filt'); fs.value = S.filter;
  fs.addEventListener('change', () => { S.filter = fs.value; save(); resetDeck(); render(); });
  $('#shuf').addEventListener('change', e => { S.shuffle = e.target.checked; save(); resetDeck(); render(); });
  const rb = $('#reset');
  rb.addEventListener('click', () => {
    if (rb.dataset.armed){ cardIdx().forEach(i => delete progress[i]); save(); resetDeck(); render(); return; }

function move(d){ const n = pos + d; if (n < 0 || n >= deck.length) return; pos = n; flipped = false; renderCards(); }
function rate(v){
  progress[deck[pos]] = v; save();
  if (pos < deck.length - 1){ pos++; flipped = false; }
  render();
}

// ---------- quiz ----------
const Q = { run:null };
let sampleFn = null;
try { if (window.claude && typeof window.claude.use === 'function') window.claude.use('sample').then(f => { sampleFn = f; if (S.mode==='quiz' && Q.run && Q.run.type==='wr') renderQuiz(); }).catch(()=>{}); } catch(e){}

function renderQuizSetup(){
  const mcN = pool(MC).length, wrN = pool(WR).length;
  const avail = S.qtype==='mc' ? mcN : wrN;

        <button class="choice" type="button" data-t="wr" aria-pressed="${S.qtype==='wr'}"><strong>Written</strong><span>${wrN} questions in this view. Write your answer, then compare with a model answer and key points${sampleFn?', or have Claude grade it':''}.</span></button>
      </div>
      <div class="row">

      </div>

  qn.addEventListener('change', () => { S.qcount = qn.value==='all' ? 'all' : +qn.value; save(); });
  $('#start').addEventListener('click', () => startQuiz(S.qtype, qn.value==='all' ? Infinity : +qn.value));

function startQuiz(type, n, items){
  const src = type==='mc' ? pool(MC) : pool(WR);
  const qs = items || shuffleArr(src).slice(0, Math.min(n, src.length));
  Q.run = { type, items: qs.map(q => ({ q, order: type==='mc' ? shuffleArr([0,1,2,3]) : null, pick:null, score:null, text:'', revealed:false, checks:[], claude:null })), i:0, done:false };
  renderQuiz();
}
function quizStats(){
  const r = Q.run, n = r.items.length;
  const inc = r.items.reduce((a,it)=>a+(it.score??0),0);
  const lost = r.items.reduce((a,it)=>a+(it.score==null?0:1-it.score),0);
  const bound = n - lost;
  return { n, inc, bound, gap: bound ? 100*(bound-inc)/bound : 0, answered: r.items.filter(it=>it.score!=null).length };
}
function logStrip(){
  const s = quizStats(), r = Q.run;
  return `<div class="log"><span>question <b>${Math.min(r.i+1,s.n)}</b> / ${s.n}</span><span class="inc">incumbent <b>${fmt(s.inc)}</b></span><span class="bnd">best bound <b>${fmt(s.bound)}</b></span><span>gap <b>${s.gap.toFixed(1)}%</b></span></div>`;
}
const fmt = x => Number.isInteger(x) ? String(x) : x.toFixed(1);
function renderQuiz(){
  if (!Q.run){ renderQuizSetup(); return; }
  if (Q.run.done){ renderSummary(); return; }
  Q.run.type==='mc' ? renderMC() : renderWR();
  renderSide();
}
function quizNav(canNext){
  const r = Q.run, last = r.i === r.items.length - 1;
  return `<div class="row spread">
    <button class="btn" id="quit" type="button">End quiz</button>
    <button class="btn primary" id="qnext" type="button" ${canNext?'':'disabled'}>${last?'See results':'Next question →'}</button></div>`;
}
function wireNav(){
  $('#qnext').addEventListener('click', () => { const r = Q.run; if (r.i < r.items.length-1) r.i++; else r.done = true; renderQuiz(); });
  const qb = $('#quit');
  qb.addEventListener('click', () => {
    if (qb.dataset.armed){ Q.run.done = true; Q.run.items = Q.run.items.filter(it => it.score!=null); if (!Q.run.items.length){ Q.run = null; } renderQuiz(); return; }
    qb.dataset.armed='1'; qb.textContent='Click again to end'; qb.classList.add('bad');
    setTimeout(()=>{ if(qb.isConnected){ delete qb.dataset.armed; qb.textContent='End quiz'; qb.classList.remove('bad'); } },3000);
  });
}
function renderMC(){
  const r = Q.run, it = r.items[r.i], q = it.q, answered = it.pick != null;
  const L = 'ABCD';
  const opts = it.order.map((oi, k) => {
    let cls = '', mark = '';
    if (answered){
      if (oi === q.a){ cls = 'right'; mark = '✓'; }
      else if (oi === it.pick){ cls = 'wrong'; mark = '✗'; }
      else cls = 'dim';
    }
    return `<button class="opt ${cls}" type="button" data-o="${oi}" ${answered?'disabled':''}><span class="ltr">${L[k]}</span><span>${md(q.o[oi])}</span><span class="mark">${mark}</span></button>`;
  }).join('');
  const ok = answered && it.pick === q.a;
  main.innerHTML = logStrip() + `
    <article class="card">
      <div class="card-head"><div class="tags"><span class="tag kind">Multiple choice</span><span class="tag">§${q.sec} ${esc(secName(q.sec))}</span>${isBookQ(q)?'<span class="tag book">Textbook</span>':''}</div></div>
      <div class="prompt">${md(q.q.replace(/^\(Book\)\s*/,''))}</div>
      <div class="opts">${opts}</div>
      ${answered ? `<div class="why"><span class="verdict ${ok?'good':'bad'}">${ok?'Correct':'Not quite. Correct answer: '+L[it.order.indexOf(q.a)]}</span><span class="lbl">Explanation</span><p>${md(q.x)}</p></div>` : `<p class="hint">Keys: 1–4 or A–D to answer, Enter for next.</p>`}
      ${quizNav(answered)}
    </article>`;
  main.querySelectorAll('.opt').forEach(b => b.addEventListener('click', () => pickMC(+b.dataset.o)));
  wireNav(); typeset(main);
}
function pickMC(o){ const it = Q.run.items[Q.run.i]; if (it.pick != null) return; it.pick = o; it.score = o === it.q.a ? 1 : 0; renderQuiz(); }

let gradeCtl = null;
function renderWR(){
  const r = Q.run, it = r.items[r.i], q = it.q;
  const g = it.claude;
  const covered = new Set(g && g.covered ? g.covered : []);
  const gradeBtns = [['1','Got it','good'],['0.5','Partial','mid'],['0','Missed','bad']].map(([v,t,c]) =>
    `<button class="btn ${c} ${it.score===+v?'sel':''}" type="button" data-g="${v}">${t}</button>`).join('');
  main.innerHTML = logStrip() + `
    <article class="card">
      <div class="card-head"><div class="tags"><span class="tag kind">Written</span><span class="tag">§${q.sec} ${esc(secName(q.sec))}</span>${isBookQ(q)?'<span class="tag book">Textbook</span>':''}</div></div>
      <div class="prompt">${md(q.q.replace(/^\(Book\)\s*/,''))}</div>
      <label for="wa" class="lbl">Your answer</label>
      <textarea id="wa" placeholder="Write your answer. Math as plain text or LaTeX ($\\|\\beta\\|_1$) both work." ${it.revealed?'readonly':''}></textarea>
      <div class="row">
        ${!it.revealed ? `${sampleFn?'<button class="btn primary" id="grade" type="button">Grade with Claude</button>':''}<button class="btn ${sampleFn?'':'primary'}" id="reveal" type="button">Show model answer</button>` : ''}
        <span class="hint" id="gstat"></span>
      </div>
      ${g && g.feedback ? `<div class="block"><span class="lbl">Claude's grade</span>
        <div class="row"><span class="verdict ${g.verdict==='correct'?'good':g.verdict==='partial'?'mid':'bad'}">${esc(String(g.verdict||''))} · ${Math.round(100*(+g.score||0))}%</span></div>
        <div class="claude-out"><p style="margin:0">${md(String(g.feedback))}</p>
        ${Array.isArray(g.errors)&&g.errors.length?`<div><span class="lbl">Incorrect statements</span><ul>${g.errors.map(e=>`<li>${md(String(e))}</li>`).join('')}</ul></div>`:''}
        ${Array.isArray(g.missing)&&g.missing.length?`<div><span class="lbl">Missing</span><ul>${g.missing.map(e=>`<li>${md(String(e))}</li>`).join('')}</ul></div>`:''}</div></div>` : ''}
      ${it.revealed ? `
        <div class="block"><span class="lbl">Model answer</span><div class="ans">${md(q.m)}</div></div>
        <div class="block"><span class="lbl">Key points · tick the ones you covered</span>
          <ul class="kp">${q.k.map((k,j)=>`<li><label><input type="checkbox" data-k="${j}" ${it.checks[j]?'checked':''}><span class="${covered.has(j)?'hit':''}">${md(k)}${covered.has(j)?' <span class="hint">(Claude: covered)</span>':''}</span></label></li>`).join('')}</ul>
        </div>
        <div class="why"><span class="lbl">Why this matters</span><p>${md(q.x)}</p></div>
        <div class="row"><span class="hint">Score yourself${g?' (preset from Claude, change it if you disagree)':''}:</span>${gradeBtns}</div>` : ''}
      ${quizNav(it.score != null)}
    </article>`;
  const ta = $('#wa'); ta.value = it.text;
  ta.addEventListener('input', () => { it.text = ta.value; });

  $('#grade') && $('#grade').addEventListener('click', () => gradeWithClaude(it));
  main.querySelectorAll('.kp input').forEach(cb => cb.addEventListener('change', () => {
    it.checks[+cb.dataset.k] = cb.checked;
    if (!it.claude){ const c = it.checks.filter(Boolean).length, n = q.k.length; it.score = c===n ? 1 : c===0 ? 0 : 0.5; renderQuiz(); }
  }));
  main.querySelectorAll('[data-g]').forEach(b => b.addEventListener('click', () => { it.score = +b.dataset.g; renderQuiz(); }));
  wireNav(); typeset(main);
}
async function gradeWithClaude(it){
  const q = it.q, ans = ($('#wa').value || '').trim();
  it.text = ans;
  const st = $('#gstat'), btn = $('#grade');
  if (!ans){ st.textContent = 'Write an answer first, or use Show model answer.'; return; }
  btn.disabled = true; st.innerHTML = 'Claude is grading… <button class="btn" id="stopg" type="button">Stop</button>';
  gradeCtl = new AbortController();
  $('#stopg').addEventListener('click', () => gradeCtl && gradeCtl.abort());
  const prompt = `You are grading a student's written answer for MIT course 15.095 (Machine Learning under a Modern Optimization Lens, Bertsimas). Grade against the model answer and key points. Accept equivalent reasoning, notation, or wording. Penalize mathematically incorrect statements. Be concise and specific.

QUESTION:
${q.q}

MODEL ANSWER:
${q.m}

KEY POINTS (0-indexed):
${q.k.map((k,j)=>j+'. '+k).join('\n')}

STUDENT ANSWER:
${ans.slice(0, 6000)}

Reply with only a JSON object of this shape:
{"verdict":"correct"|"partial"|"incorrect","score":<number from 0 to 1>,"covered":[<indices of key points the student covered>],"missing":[<short strings naming important missing ideas>],"errors":[<short strings naming incorrect statements, empty if none>],"feedback":"<2-4 sentences addressed to the student; use $...$ for math>"}`;
  try {
    const g = await sampleFn.json(prompt, { signal: gradeCtl.signal, modelTier: 'default' });
    if (!g || typeof g !== 'object') throw { code:'invalid_json' };
    g.covered = Array.isArray(g.covered) ? g.covered.map(Number).filter(n => n>=0 && n<q.k.length) : [];
    it.claude = g; it.revealed = true;
    it.checks = q.k.map((_,j) => g.covered.includes(j));
    const sc = +g.score; it.score = g.verdict==='correct' || sc >= 0.85 ? 1 : (g.verdict==='incorrect' || sc < 0.35) ? 0 : 0.5;
    renderQuiz();
  } catch(e){
    const code = e && e.code;
    if (code === 'cancelled'){ st.textContent = 'Grading stopped.'; }
    else if (['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)){ sampleFn = null; renderQuiz(); return; }
    else if (code === 'rate_limited'){ st.textContent = 'Claude is busy or your usage limit was reached. Try again later, or use Show model answer.'; }
    else if (code === 'invalid_json'){ st.textContent = 'Claude\'s reply could not be read. Try again, or use Show model answer.'; }
    else { st.textContent = 'Grading failed. Try again, or use Show model answer.'; }
    if ($('#grade')) $('#grade').disabled = false;
  }
}
function renderSummary(){
  const r = Q.run;

    }
    return `<details><summary>${md(q.q.replace(/^\(Book\)\s*/,''))} <span class="hint">(${it.score===0.5?'partial':'missed'})</span></summary><div>
      <div><span class="lbl">Your answer</span><br>${it.text?esc(it.text).replace(/\n/g,'<br>'):'—'}</div>
      <div><span class="lbl">Model answer</span><br>${md(q.m)}</div>
      <div><span class="lbl">Explanation</span><br>${md(q.x)}</div></div></details>`;
  }).join('');
  main.innerHTML = `
    <section class="card">
      <span class="lbl">${r.type==='mc'?'Multiple-choice':'Written'} quiz · results</span>
      <div class="row" style="align-items:baseline;gap:16px"><span class="big">${fmt(s.inc)} / ${s.n}</span><span class="log"><span class="inc">incumbent <b>${fmt(s.inc)}</b></span><span>status <b>optimal</b></span><span>score <b>${pct(s.inc,s.n)}%</b></span></span></div>
      <div class="meter" aria-hidden="true"><i class="g" style="width:${100*r.items.filter(i=>i.score===1).length/s.n}%"></i><i class="m" style="width:${100*r.items.filter(i=>i.score===0.5).length/s.n}%"></i><i class="b" style="width:${100*r.items.filter(i=>!i.score).length/s.n}%"></i></div>
      <div class="tablewrap"><table class="res"><thead><tr><th>Section</th><th style="text-align:right">Questions</th><th style="text-align:right">Score</th></tr></thead><tbody>
        ${Object.keys(bySec).map(Number).sort((a,b)=>a-b).map(k=>`<tr><td>§${k} ${esc(secName(k))}</td><td class="num">${bySec[k].n}</td><td class="num">${pct(bySec[k].sc,bySec[k].n)}%</td></tr>`).join('')}
      </tbody></table></div>
      <div class="row">
        ${miss.length?'<button class="btn primary" id="retry" type="button">Retry the ones I missed</button>':''}
        <button class="btn" id="newq" type="button">New quiz</button>
      </div>
    </section>
    ${miss.length?`<section class="review"><span class="lbl">Review · ${miss.length} to go over</span>${rev}</section>`:'<p class="hint">Everything correct. Try another section or the other quiz type.</p>'}`;
  $('#retry') && $('#retry').addEventListener('click', () => startQuiz(r.type, 0, shuffleArr(miss.map(it=>it.q))));
  $('#newq').addEventListener('click', () => { Q.run = null; renderQuiz(); });
  renderSide(); typeset(main);
}
function renderQuizSide(){
  const r = Q.run;
  const rows = r.items.map((it, j) => {
    const st = it.score==null ? '·' : it.score===1 ? '✓' : it.score===0.5 ? '½' : '✗';
    const col = it.score==null ? 'var(--muted)' : it.score===1 ? 'var(--good)' : it.score===0.5 ? 'var(--bound)' : 'var(--bad)';
    return `<div class="secrow" style="cursor:default" ${j===r.i&&!r.done?'aria-current="true"':''}><span class="n">${String(j+1).padStart(2,'0')}</span><span class="nm">§${it.q.sec} ${esc(secName(it.q.sec))}</span><span class="ct" style="color:${col}">${st}</span></div>`;
  }).join('');
  const s = quizStats();
  side.innerHTML = `<h2>Solver log</h2>
    <div class="log" style="flex-direction:column;gap:2px"><span>nodes explored <b>${s.answered}</b> / ${s.n}</span><span class="inc">incumbent <b>${fmt(s.inc)}</b></span><span class="bnd">best bound <b>${fmt(s.bound)}</b></span><span>gap <b>${s.gap.toFixed(1)}%</b></span></div>
    <p class="hint">Incumbent = points earned. Best bound = the most you can still finish with. The gap closes as you answer.</p>
    <div>${rows}</div>`;
}

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (['textarea','input','select'].includes(tag) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (tag === 'button' && (e.key === ' ' || e.key === 'Enter')) return;
  if (S.mode === 'cards' && deck.length){
    if (e.key === ' ' ){ e.preventDefault(); flipped = !flipped; renderCards(); }
    else if (e.key === 'ArrowRight') move(1);
    else if (e.key === 'ArrowLeft') move(-1);
    else if (flipped && e.key === '1') rate('l');
    else if (flipped && e.key === '2') rate('k');
  } else if (S.mode === 'quiz' && Q.run && !Q.run.done && Q.run.type === 'mc'){
    const it = Q.run.items[Q.run.i];
    const m = {'1':0,'2':1,'3':2,'4':3,'a':0,'b':1,'c':2,'d':3}[e.key.toLowerCase()];
    if (m != null && it.pick == null){ pickMC(it.order[m]); }
    else if (e.key === 'Enter' && it.pick != null){ $('#qnext') && $('#qnext').click(); }
  }
});

function render(){
  fillSections();
  if (S.mode === 'cards'){ renderCards(); renderSide(); }
  else renderQuiz();
}
$('#m-cards').setAttribute('aria-pressed', S.mode==='cards'); $('#m-quiz').setAttribute('aria-pressed', S.mode==='quiz');
resetDeck(); render();
})();
</script>

</body></html>
