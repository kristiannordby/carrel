tor.","o":["sets entries below a threshold $\\lambda$ to zero and shrinks the rest","keeps the $k$ largest-magnitude entries of $u$ and zeroes the rest","returns the $k$ smallest entries","solves the Lasso"],"a":1},{"sec":4,"q":"The discrete first-order update is:","x":"Take a gradient step of size $1/L$, then project onto the sparsity set by hard thresholding.","o":["$\\beta_{m+1} = H_k\\big(\\beta_m - \\tfrac1L\\nabla g(\\beta_m)\\big)$","$\\beta_{m+1} = \\beta_m - \\tfrac1L\\nabla g(\\beta_m)$","$\\beta_{m+1} = H_k(\\beta_m) - \\tfrac1L\\nabla g(\\beta_m)$","$\\beta_{m+1} = \\arg\\min g$ over the current support"],"a":0},{"sec":4,"q":"In the dual reformulation, sparse regression becomes:","x":"Substituting $\\beta \\to S\\beta$ and minimizing out $\\beta$ (ridge closed form plus the matrix inversion lemma) gives this convex function of $s$, with $K_j = X_jX_j^\\top$.","o":["$\\min_{s\\in S_k}\\tfrac12 y^\\top(I_n - \\gamma\\sum_j s_jK_j)y$","$\\min_{s\\in S_k}\\tfrac12 y^\\top(I_n + \\gamma\\sum_j s_jK_j)^{-1}y$","$\\min_\\beta \\tfrac12\\|y - X\\beta\\|^2 + \\lambda\\|\\beta\\|_1$","an LP in $s$"],"a":1},{"sec":4,"q":"Why is the cutting-plane (outer approximation) bound a valid lower bound?","x":"Convexity: $c(s) \\ge c(\\bar s) + \\nabla c(\\bar s)^\\top(s - \\bar s)$. Minimizing the max of cuts over $S_k$ therefore underestimates $\\min c$.","o":["Each cut is a tangent plane of the convex $c$, so the max of cuts never exceeds $c$","Cuts are upper bounds from feasible solutions","The MIO is solved only approximately","It is not a lower bound"],"a":0},{"sec":4,"q":"The dual approach scales with $n$ rather than $p$ because:","x":"The regression loss depends on $X$ only through $XX^\\top$ (Lemma 3.1, kernel dual), so cost is driven by $n$.","o":["its key quantities are $n\\times n$ kernels ($XX^\\top$, $\\sum_j s_jK_j$)","it drops most features at the start","it uses stochastic gradients","it solves an LP"],"a":0},{"sec":4,"q":"What is a \"single-tree\" implementation of outer approximation?","x":"Lazy constraint callbacks avoid rebuilding the B&B tree after each cut. The Rec 2 notebook implements the loop this way in JuMP.","o":["Solving one MIO with all cuts added up front","Adding cuts as lazy constraints inside one branch-and-bound tree whenever an integer solution is found","Using a decision tree to pick features","Running a single gradient step"],"a":1},{"sec":4,"q":"Which describes the phase-transition phenomenon in exact sparse regression?","x":"Accuracy, false-discovery and complexity transitions coincide. Exact needs fewer samples than Lasso (~125 vs ~180 in the book's example), and $p$ matters only logarithmically.","o":["More samples always make the MIO slower","Past a sample-size threshold, support recovery becomes perfect and solve time drops sharply","Lasso recovers the support with fewer samples than exact methods","Phase transitions depend mainly on $p$"],"a":1},{"sec":4,"q":"Accuracy $A\\%$ and false discovery $F\\%$ of a support estimate are defined as:","x":"Accuracy is \"the whole truth\" (found all true features); false discovery is \"nothing but the truth\" (share of selections that are fake).","o":["$A = |\\text{true} \\cap \\text{selected}|/k$ and $F = |\\text{selected} \\setminus \\text{true}|/|\\text{selected}|$","$A = |\\text{selected}|/p$ and $F = 1 - A$","$A$ = prediction $R^2$ and $F$ = test MSE","$A = |\\text{selected}\\cap\\text{true}|/|\\text{selected}|$ and $F = |\\text{true}\\setminus\\text{selected}|/k$"],"a":0},{"sec":4,"q":"What is the main reason the course gives for Lasso's good out-of-sample performance?","x":"Ch. 2–3: Lasso's strength is robustness, not sparsity; as a selector it adds many false features.","o":["It finds the exact sparse support","It is robust (equivalent to protection against feature-wise perturbations)","It is unbiased","It is a Bayesian MAP estimate"],"a":1},{"sec":4,"q":"HW1 Q1(e): to scale best subset to $n,p$ in the 100,000s, you should:","x":"The scalable algorithm cuts on the convex function $c(s)$, which has no $\\beta$ and no big-M. The big-M primal tops out around thousands.","o":["run cutting planes on the big-M formulation","run cutting planes on the binary convex reformulation in $s$","enumerate all supports in parallel","use Lasso and round"],"a":1},{"sec":4,"q":"For $n = 200$ and $p = 20{,}000$, how many coefficient vectors fit the training data exactly with OLS?","x":"$\\mathrm{rank}(X) \\le 200$, so the null space has dimension at least 19,800; adding any null vector keeps a perfect fit.","o":["None","Exactly one","About 200","Infinitely many"],"a":3},{"sec":4,"q":"Which sign do the entries of $\\nabla c(s)$ have?","x":"Each entry is minus a square, so turning on a feature can only lower (or keep) the regression loss, as you'd expect.","o":["Nonpositive: $[\\nabla c(s)]_j = -\\tfrac\\gamma2(X_j^\\top A(s)^{-1}y)^2$","Nonnegative","Either sign","Always zero at the optimum"],"a":0},{"sec":5,"q":"In stable regression, $z_i = 1$ means:","x":"$z$ encodes the train/validation assignment, with $\\sum z_i = k$ points in training. The adversary picks the hardest such assignment.","o":["point $i$ is in the training set","point $i$ is an outlier to be removed","point $i$ is in the test set","feature $i$ is selected"],"a":0},{"sec":5,"q":"Why can $\\mathcal Z = \\{z\\in\\{0,1\\}^n : \\sum z_i = k\\}$ be replaced by its convex hull?","x":"A linear function over a polytope attains its max at a vertex, and $\\{\\sum z = k, 0\\le z\\le1\\}$ has integral vertices.","o":["Because $k$ is an integer","Because the inner objective is linear in $z$ and the hull's vertices are binary","Because $\\beta$ is continuous","It can't; the relaxation is a heuristic"],"a":1},{"sec":5,"q":"For fixed $\\beta$, the inner max of stable regression equals:","x":"Weights in $[0,1]$ summing to $k$ are best placed on the $k$ largest residuals.","o":["the average absolute residual","the sum of the $k$ largest absolute residuals","the $k$-th smallest residual","the median residual"],"a":1},{"sec":5,"q":"The LP dual of $\\max_z\\sum_i z_ir_i$ s.t. $\\sum z_i = k$, $0 \\le z \\le 1$ is:","x":"$\\theta$ (free) prices the equality and $u_i \\ge 0$ prices $z_i \\le 1$. At the optimum $\\theta$ is the $k$-th largest residual and $u_i$ the excess above it.","o":["$\\min k\\theta + \\sum_i u_i$ s.t. $\\theta + u_i \\ge r_i$, $u_i \\ge 0$","$\\min k\\theta$ s.t. $\\theta \\ge r_i$","$\\max k\\theta + \\sum_i u_i$ s.t. $\\theta + u_i \\le r_i$","$\\min\\sum_i u_i$ s.t. $u_i \\ge r_i$"],"a":0},{"sec":5,"q":"With a Lasso penalty, the final stable regression problem is:","x":"Objective $k\\theta + \\sum u_i + \\lambda\\sum|\\beta_j|$ with linear constraints (after splitting absolute values) is an LP; ridge or elastic net give a convex QP.","o":["a linear optimization problem","a mixed-integer QP","a semidefinite program","a nonconvex problem"],"a":0},{"sec":5,"q":"The reported computational cost of stable regression relative to standard training is about:","x":"The lecture and book report optimization takes about 2–3× as long, even at large scale.","o":["100× slower","the same","2–3× slower","10× faster"],"a":2},{"sec":5,"q":"Which gains are largest for stable regression?","x":"Accuracy improves modestly (~3–5%); stability metrics improve much more.","o":["Prediction accuracy (+40–80%)","Stability of predictions, coefficients and hyperparameters (+20–80%)","Training speed","Number of features selected"],"a":1},{"sec":5,"q":"How is the \"hardest training set\" interpreted in the lecture?","x":"The tree's splits describe which feature values make points hard, e.g. inconsistent HbA1c histories in the diabetes data.","o":["By looking at its average residual","By using $z^*$ as labels and fitting an optimal classification tree on the features","By clustering the points","By plotting residuals against fitted values"],"a":1},{"sec":5,"q":"In the time-series extension, the uncertainty set selects:","x":"Selecting contiguous stretches preserves temporal structure; a penalty on $|z_{t+1} - z_t|$ and total unimodularity keep it tractable.","o":["random individual time points","contiguous segments (anchors plus following points)","the most recent $k$ points","every other point"],"a":1},{"sec":5,"q":"Why does the time-series formulation remain solvable as an LP?","x":"TU means optimizing over the convex hull gives binary solutions, after which LP duality removes the inner max.","o":["The data are stationary","Its constraint matrix is totally unimodular, so the LP relaxation has integer vertices","It uses a big-M","It only has two variables"],"a":1},{"sec":5,"q":"Training against the hardest size-$k$ set gives what guarantee?","x":"The worst case over all size-$k$ subsets dominates each one, so the model is robust to every subpopulation of that size.","o":["Zero test error","The training loss bound holds for every subpopulation of size $k$","The model is unbiased","The validation set is optimal"],"a":1},{"sec":6,"q":"Convex regression imposes which constraint for all pairs $(i,j)$?","x":"The tangent plane at $x_i$ must lie below the fitted value at every other point; that is necessary and sufficient for a convex interpolant.","o":["$\\theta_i + \\xi_i^\\top(x_j - x_i) \\le \\theta_j$","$\\theta_i \\le \\theta_j$ whenever $x_i \\le x_j$","$\\xi_i \\le \\xi_j$","$\\theta_j + \\xi_j^\\top(x_i - x_j) \\ge \\theta_i$ only for adjacent pairs"],"a":0},{"sec":6,"q":"How is the fitted convex function recovered from $(\\theta_i, \\xi_i)$?","x":"The pointwise max of affine functions is convex and piecewise linear, and it passes through the fitted values.","o":["Linear interpolation between points","$f(x) = \\max_i\\{\\theta_i + \\xi_i^\\top(x - x_i)\\}$","$f(x) = \\min_i\\{\\theta_i + \\xi_i^\\top(x - x_i)\\}$","A cubic spline"],"a":1},{"sec":6,"q":"Why add $\\tfrac1{2\\gamma}\\sum\\|\\xi_i\\|^2$?","x":"Without it, boundary subgradients can blow up and aren't unique; the penalty regularizes them.","o":["To make the problem an LP","To avoid huge, non-unique slopes at the edges of the data","To enforce monotonicity","To reduce the number of constraints"],"a":1},{"sec":6,"q":"In delayed constraint generation for convex regression, the separation step for point $i$ finds:","x":"That $k$ is where $i$'s tangent overshoots the most; if the overshoot exceeds $\\varepsilon$, the constraint $(i, j(i))$ is added.","o":["$j(i) = \\arg\\max_k\\{\\hat\\theta_i - \\hat\\theta_k + \\hat\\xi_i^\\top(x_k - x_i)\\}$","the nearest neighbor of $x_i$","the point with the largest residual","the steepest slope"],"a":0},{"sec":6,"q":"How many convexity constraints does the full convex regression QP have?","x":"One per ordered pair of distinct points, which is why cutting planes are needed at scale.","o":["$n$","$n\\log n$","$n(n-1)$","$np$"],"a":2},{"sec":7,"q":"Which estimator has a 50% limiting breakdown point?","x":"LS and LAD have breakdown point 0; LMAD/LMS can tolerate up to half the data being outliers.","o":["Least squares","Least absolute deviation","Least median of absolute deviations (LMAD)","Ridge regression"],"a":2},{"sec":7,"q":"LQAD is equivalent to:","x":"$\\min_\\beta|r_{(q)}| = \\min_{|I|=q}\\min_\\beta\\|y_I - X_I\\beta\\|_\\infty$: subset selection over samples.","o":["choosing the best $q$ samples and fitting them with minimum $\\ell_\\infty$ (Chebyshev) error","LAD on all samples","least squares on the median sample","Lasso with $q$ nonzeros"],"a":0},{"sec":7,"q":"In the LQAD MIO, what does $z_i = 1$ force?","x":"$M(1 - z_i) \\ge \\mu_i$ forces $\\mu_i = 0$ when $z_i = 1$; with $\\sum z_i = q$, $\\gamma$ must cover $q$ residuals.","o":["$\\mu_i \\ge M$","$\\mu_i = 0$, so $\\gamma \\ge |r_i|$","$r_i = 0$","point $i$ is removed"],"a":1},{"sec":7,"q":"The SLO algorithm for LQAD rests on which decomposition?","x":"$H_m$ is the sum of the $n - m + 1$ largest absolute residuals (convex). Linearize $H_{q+1}$, dualize $H_q$, and solve an LP each iteration.","o":["$|r_{(q)}| = \\sum_i |r_i| / n$","$|r_{(q)}| = H_q(\\beta) - H_{q+1}(\\beta)$, a difference of convex functions","$|r_{(q)}| = \\max_i|r_i|$","$|r_{(q)}| = $ median of $r_i^2$"],"a":1},{"sec":7,"q":"Which upper-bound method performed best for LQAD?","x":"The hybrid reached 0% relative error on all test cases; MASS was fast but 10–150% worse.","o":["SLO alone","Subgradient descent alone","Subgradient descent followed by SLO (Algorithm 3)","R's MASS LQS"],"a":2},{"sec":6,"q":"Extending convex regression to coordinate-wise monotone functions requires:","x":"Monotonicity is a sign condition on slopes, which is linear in $\\xi_i$.","o":["sign constraints on the subgradients, e.g. $\\xi_i \\ge 0$","binary variables per point","a different loss function","removing the convexity constraints"],"a":0},{"sec":8,"q":"In logistic regression with $y \\in \\{-1,+1\\}$, the MLE problem is:","x":"With $\\pm1$ labels, $P(Y = y_i) = 1/(1 + e^{-y_i(\\cdot)})$ for both classes. The last option is the SVM hinge loss.","o":["$\\max_{\\beta,\\beta_0} -\\sum_i\\log(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)})$","$\\min_{\\beta}\\sum_i(y_i - \\beta^\\top x_i)^2$","$\\max_\\beta\\sum_i y_i\\beta^\\top x_i$","$\\min_\\beta\\sum_i\\max(0, 1 - y_i\\beta^\\top x_i)$"],"a":0},{"sec":8,"q":"Sensitivity is:","x":"Sensitivity (recall, TPR) is the share of actual positives caught. $TN/(TN+FP)$ is specificity; $TP/(TP+FP)$ is precision.","o":["$TP/(TP + FN)$","$TN/(TN + FP)$","$TP/(TP + FP)$","$(TP + TN)/n$"],"a":0},{"sec":8,"q":"Raising the threshold $t$ generally:","x":"Higher $t$ means predicting $+1$ less often: fewer false positives (spec ↑), more false negatives (sens ↓). Quality-of-care: $t=0.7$ gives sens 0.32, spec 0.99.","o":["raises sensitivity and lowers specificity","lowers sensitivity and raises specificity","raises both","has no effect on the confusion matrix"],"a":1},{"sec":8,"q":"AUC equals:","x":"That ranking interpretation is why AUC is threshold-free. AUC = 0.5 means random guessing; 1 is perfect.","o":["the accuracy at $t = 0.5$","the probability a random positive is scored higher than a random negative","sensitivity minus specificity","the area under the precision–recall curve"],"a":1},{"sec":8,"q":"The quality-of-care baseline accuracy (predict \"good care\" for everyone) is:","x":"98 of 131 patients received good care. 80.8% is training accuracy at $t = 0.5$ and 81.3% is test accuracy.","o":["50%","74.8% (98/131)","80.8%","81.3%"],"a":1},{"sec":9,"q":"Robustifying logistic regression against $\\|\\Delta x_i\\|_q \\le \\rho$ yields:","x":"The adversary reduces each margin by $\\rho\\|\\beta\\|_{q^*}$ (dual norm). The penalty appears inside the exponent, not as an additive $\\ell_1$ term.","o":["$-\\sum\\log(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)}) - \\rho\\|\\beta\\|_1$ always","$-\\sum\\log(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0) + \\rho\\|\\beta\\|_{q^*}})$","the nominal problem unchanged","an MIO with binary variables"],"a":1},{"sec":9,"q":"Why does the proof reduce the inner minimization to minimizing each margin?","x":"$g'(\\omega) = 1/(1 + e^\\omega) > 0$, so the worst case for each term is the smallest possible margin, a dual-norm calculation.","o":["Because $g(\\omega) = -\\log(1 + e^{-\\omega})$ is increasing in the margin $\\omega$","Because the loss is linear","Because $\\rho$ is small","Because the margins are independent of $\\beta$"],"a":0},{"sec":9,"q":"In the label uncertainty set, a flipped label is written as:","x":"$\\Delta y_i = 0$ keeps $y_i$ and $\\Delta y_i = 1$ gives $-y_i$, which keeps the margin linear in $\\Delta y_i$.","o":["$y_i + \\Delta y_i$","$y_i(1 - 2\\Delta y_i)$","$-\\Delta y_i$","$y_i\\Delta y_i$"],"a":1},{"sec":9,"q":"Which step makes the label-robust inner problem solvable by LP duality?","x":"Linear objective plus integral polytope means the LP relaxation is exact, and its dual (with $\\mu$, $\\nu_i$) merges with the outer max.","o":["Replacing labels with probabilities","Showing each term is linear in $\\Delta y_i$ and the budget polytope has integer vertices","Dropping the budget constraint","Using the hinge loss"],"a":1},{"sec":9,"q":"According to the decision rule $\\log_{10}(p) \\ge 0.05a - 2.5$, robust classification is most likely to help when:","x":"High-dimensional, poorly fit (hard, noisy) problems are where robustness gave ~4% (LR) and ~5% (SVM) improvements.","o":["$p$ is small and nominal accuracy is high","$p$ is large and nominal in-sample accuracy is low","the data are balanced","$n$ is very large"],"a":1},{"sec":9,"q":"(Book) Why is label-robust SVM much slower than label-robust logistic regression?","x":"The hinge loss's piecewise structure needs binaries to linearize, turning an LP into an MIO.","o":["It has more data","Its robust counterpart requires binary variables, so the LP becomes an MIO","It uses a nonconvex loss","It needs kernels"],"a":1},{"sec":8,"q":"(Book) In the dual of regularized classification, $\\beta^* = -\\gamma X^\\top\\alpha^*$ implies:","x":"Only points with $\\alpha_i \\ne 0$ contribute, hence \"support vectors,\" and $XX^\\top$ can be replaced by any kernel.","o":["$\\beta^*$ is a combination of data points (support vectors) and data enter via $XX^\\top$, enabling kernels","$\\beta^*$ is always sparse","the dual has $p$ variables","the problem is nonconvex"],"a":0},{"sec":10,"q":"(Book) Compared with Lasso, exact sparse logistic regression / SVM:","x":"With $k$ chosen by CV, Lasso's support stays too large while the exact method converges to $k_{\\text{true}}$ (lung cancer: 30 vs 172 genes for SVM).","o":["selects more features","converges to the true support with far fewer false features","is always faster","cannot be cross-validated"],"a":1},{"sec":11,"q":"Holistic regression differs from the manual approach mainly because it:","x":"Manual practice applies properties one at a time in some order; the MIO enforces them jointly or proves they can't all hold.","o":["uses a different loss function","imposes all desired properties simultaneously in one MIO","always selects more variables","doesn't need a validation set"],"a":1},{"sec":11,"q":"Group sparsity for group $GS_m$ is enforced by:","x":"Group members are all selected or all excluded. $\\sum \\le 1$ is the transformation constraint, $\\sum \\ge 1$ would only force at least one member in, and equal coefficients is a different (and wrong) requirement.","o":["$z_i = z_l$ for all $i, l \\in GS_m$","$\\sum_{i\\in GS_m} z_i \\le 1$","$\\sum_{i\\in GS_m} z_i \\ge 1$","$\\beta_i = \\beta_l$"],"a":0},{"sec":11,"q":"The nonlinear transformation constraint $\\sum_{i\\in T_m}z_i \\le 1$ means:","x":"Allowing at most one version avoids redundant, highly correlated copies of the same variable.","o":["at least one transformation must be used","at most one of $x$, $x^2$, $\\sqrt x$, $\\log x$ for a variable can enter","all transformations enter together","transformations are forbidden"],"a":1},{"sec":11,"q":"The robustness component of holistic regression is:","x":"By the Ch. 2 equivalence, $\\Gamma\\|\\beta\\|_1$ gives robustness to feature-wise perturbations.","o":["an $\\ell_1$ penalty $\\Gamma\\|\\beta\\|_1$ in the objective","a constraint $\\|\\beta\\|_2 \\le \\Gamma$","a big-M constraint","the significance constraint"],"a":0},{"sec":11,"q":"Why does the significance constraint need an extra binary $b_j$?","x":"An absolute value on the large side of an inequality defines a nonconvex set; one binary chooses the positive or negative branch.","o":["To enforce sparsity","Because $|\\beta_j| \\ge c$ (when selected) is nonconvex, so $b_j$ picks which sign must satisfy the bound","To model group sparsity","To compute $\\tilde\\sigma$"],"a":1},{"sec":11,"q":"The significance cutoff $t_\\alpha$ is:","x":"It is the two-sided critical value of the $t_{n-p}$ distribution, valid under Gaussian errors.","o":["$\\Phi^{-1}(1 - \\alpha)$","$T_{n-p}^{-1}(1 - \\alpha/2)$","$1.96$ always","$T_{n-p}^{-1}(\\alpha)$"],"a":1},{"sec":11,"q":"$k_{\\max}$ in holistic regression is:","x":"It solves $\\max\\sum z_i$ s.t. $z_i + z_j \\le 1$ for highly correlated pairs (a maximum independent set).","o":["the number of features $p$","the largest support size still feasible under the pairwise collinearity constraints","chosen by cross-validation only","always 10"],"a":1},{"sec":11,"q":"In the Croq'Pain example, holistic regression:","x":"The benefit there was time saved; on larger datasets like Ames it also beats what manual search finds.","o":["found a very different model from the manual approach","found the same 5 variables as the careful manual analysis in about a minute","selected all 14 variables","could not satisfy the significance constraints"],"a":1},{"sec":11,"q":"Compared with Lasso, holistic regression typically produces:","x":"Real and synthetic results show comparable prediction with sparser, better-conditioned models; Pyrimidines is an exception where interpretability cost accuracy.","o":["similar out-of-sample $R^2$ with fewer variables and lower multicollinearity","much higher $R^2$ with more variables","the same model","lower $R^2$ on every dataset"],"a":0},{"sec":11,"q":"(Book) Why is a pairwise correlation threshold not enough to rule out multicollinearity?","x":"Global multicollinearity is detected through small eigenvalues of $X^\\top X$, handled by the book's Algorithm 5.1.","o":["Correlations are hard to compute","A dependency like $x_1 + x_2 \\approx x_3$ can exist without any large pairwise correlation","Pairwise correlation is always 1","Because of nonlinear transformations"],"a":1},{"sec":11,"q":"(Book) The constraint added for each detected multicollinear relationship $a$ is:","x":"You can't select every variable involved in a near-dependency; at least one must be left out.","o":["$\\sum_{i\\in\\mathrm{Supp}(a)} z_i = 0$","$\\sum_{i\\in\\mathrm{Supp}(a)} z_i \\le |\\mathrm{Supp}(a)| - 1$","$z_i + z_j \\le 1$ for all pairs in $\\mathrm{Supp}(a)$","$\\beta^\\top a = 0$"],"a":1},{"sec":11,"q":"What happened to the significance results with heavy-tailed $t_5$ errors?","x":"The $t$-test assumes Gaussian errors; heavy tails violate it and inflate false positives.","o":["Nothing changed","False positive rates rose (e.g. 35% at $n = 500$)","Accuracy dropped to 0","The MIO became infeasible"],"a":1},{"sec":12,"q":"Which pairing of course methods and the \"relax then dualize\" move is correct?","x":"Both have an inner optimization that is linear over an integral polytope (choosing $k$ samples, flipping $\\le\\Gamma$ labels), so the relaxation is exact and the inner problem is dualized.","o":["Stable regression and label-robust logistic regression","Ridge and Lasso","Hard thresholding and SLO","Convex regression and holistic regression"],"a":0},{"sec":12,"q":"Where does the course use cutting planes / delayed constraint generation?","x":"The same \"solve small, separate, add, repeat\" loop appears across lectures, with different separation oracles.","o":["Only in sparse regression","Robust regression, sparse regression and classification, convex regression, and holistic multicollinearity detection","Only in convex regression","Nowhere; all problems are solved in one shot"],"a":1},{"sec":12,"q":"Why does holistic regression use the primal (big-M) formulation rather than the dual binary-convex approach?","x":"The dual is more scalable but needs special structure; the primal is flexible for adding constraints on $z$ and $\\beta$.","o":["The dual is always slower","The primal easily accommodates many side constraints (groups, collinearity, transformations, significance)","The dual cannot handle sparsity","The primal has no binaries"],"a":1},{"sec":12,"q":"The \"heuristic + MIO\" playbook means:","x":"Sparse regression (hard thresholding), median regression (SLO + subgradient) and sparse classification (Lasso warm start) all follow it.","o":["using a heuristic instead of MIO","using fast heuristics for good upper bounds (warm starts), then MIO to certify optimality","running MIO first, then a heuristic","averaging several heuristics"],"a":1},{"sec":13,"q":"HW1 Q1(a): $\\max x + 2y$ s.t. $x \\le y$, $-x + y \\le -1$, $x, y \\ge 0$. The dual is:","x":"The primal constraints imply $x \\le x - 1$. The dual constraints $p_1 - p_2 \\ge 1$ and $p_2 - p_1 \\ge 2$ sum to $0 \\ge 3$, so both are infeasible.","o":["unbounded","optimal","infeasible (the primal is also infeasible)","degenerate but feasible"],"a":2},{"sec":13,"q":"How many auxiliary variables does it take to linearize $\\lambda\\sum_j|\\beta_j| + \\rho\\max_j|\\beta_j|$?","x":"Each absolute value in a sum needs its own $t_j \\ge \\pm\\beta_j$; the max needs a single $w \\ge \\pm\\beta_j$ for all $j$.","o":["One for each term in both","One scalar for both","$p$ variables $t_j$ for the sum and one scalar $w$ for the max","None"],"a":2},{"sec":13,"q":"In JuMP, how should you write $-v \\le \\beta_j \\le v$ when $v$ is a variable?","x":"Ranged constraints require constant bounds; with a variable bound, split it into two inequalities.","o":["`@constraint(m, -v <= β[j] <= v)`","Two constraints: `β[j] <= v` and `-v <= β[j]`","`@constraint(m, abs(β[j]) <= v)`","It cannot be written in JuMP"],"a":1},{"sec":13,"q":"In the HW1 B-only run, beds and laundry both equal 145.81 because:","x":"Shrinking a non-maximal coefficient saves nothing under $\\ell_\\infty$, so the optimum pushes several coefficients to a shared maximum.","o":["the data are duplicated","the $\\ell_\\infty$ penalty only prices the largest coefficient, so coefficients tie at the ceiling $w$","the $\\ell_1$ penalty zeroed the others","the solver hit a time limit"],"a":1},{"sec":13,"q":"HW1 Q1(c) ($\\min\\|x - y\\|_1$ with $\\|x\\|_1 + \\|y\\|_1 \\ge 2$, $\\|y\\|_0 \\le 5$, bounded variables) can be written as an MILP because:","x":"The $\\ge$ constraint is reverse-convex, but splitting $x_i = x_i^+ - x_i^-$ with a binary allowing only one side positive gives $|x_i| = x_i^+ + x_i^-$ exactly.","o":["the constraint $\\|x\\|_1 + \\|y\\|_1 \\ge 2$ is convex","binary sign selection with big-M (valid thanks to the bounds) represents $|x_i|$ exactly, and big-M handles $\\|y\\|_0$","all norms are linear","it can't; the statement is false"],"a":1},{"sec":6,"q":"In convex regression, the variable $\\theta_i$ represents:","x":"$\\theta_i$ is the function's value at $x_i$; the slopes are the separate variables $\\xi_i$.","o":["the fitted value $f(x_i)$","the residual $y_i - f(x_i)$","the slope of $f$ at $x_i$","a binary selection indicator"],"a":0},{"sec":6,"q":"What does the reduced master problem in convex regression provide?","x":"Dropping constraints can only lower (or keep) the minimum. Its solution becomes optimal for the full problem once no constraints are violated.","o":["An upper bound on the full problem's optimal value","A lower bound, since it has fewer constraints than the full problem","The exact optimum immediately","A feasible convex function by construction"],"a":1},{"sec":6,"q":"Sparse convex regression requires:","x":"A common support across all $\\xi_i$ means the fitted function depends on only $k$ features. The MIQO uses one binary $z_j$ per feature with $|(\\xi_i)_j| \\le Mz_j$.","o":["each $\\xi_i$ to have at most $k$ nonzeros independently","the union of supports of all subgradients $\\xi_i$ to have at most $k$ features","at most $k$ data points","$\\theta$ to be $k$-sparse"],"a":1},{"sec":6,"q":"Bounding subgradients $\\|\\xi_i\\|_r \\le L$ corresponds to requiring that $f$ is:","x":"Bounded slopes limit how fast $f$ can change. With $r\\in\\{1,2,\\infty\\}$ these are conic constraints that can also be added lazily.","o":["monotone","strongly convex","Lipschitz with constant $L$ (in the dual norm sense)","differentiable"],"a":2},{"sec":7,"q":"Why does least absolute deviation (LAD) still have breakdown point 0?","x":"LAD is more resistant to outliers in $y$ but not to large deviations in the covariates.","o":["It is equivalent to least squares","A single leverage point (extreme $x$) can still pull the fit arbitrarily","It ignores outliers in $y$ completely","Its objective is nonconvex"],"a":1},{"sec":7,"q":"$H_m(\\beta)$ in the SLO algorithm is defined as:","x":"Top-$k$ sums are convex in $\\beta$, and $|r_{(q)}| = H_q - H_{q+1}$ writes the quantile as a difference of two of them.","o":["the $m$-th smallest absolute residual","the sum of the $n - m + 1$ largest absolute residuals","the median residual","the sum of all residuals"],"a":1},{"sec":7,"q":"Which statement about LQAD complexity is correct?","x":"Bernholt (2005) showed NP-hardness; enumeration only scales to about $n = 50$, $p = 5$, which is why the course uses MIO with warm starts.","o":["LMS/LQAD is NP-hard, and exact enumeration costs $O(n^p)$","LQAD is an LP","LQAD can be solved by sorting residuals once","LQAD is convex in $\\beta$"],"a":0},{"sec":7,"q":"What is the typical behavior of the warm-started LQAD MIO?","x":"As with sparse regression, upper bounds from heuristics are near-optimal, and the MIO certifies optimality.","o":["It never finds the optimum","It reaches the optimum quickly and spends most time proving optimality via the lower bound","It is slower than cold start","It requires no lower bound"],"a":1},{"sec":8,"q":"Odds in logistic regression equal:","x":"Odds $= P(Y=1)/P(Y=-1) = e^{\\beta_0 + \\beta^\\top x}$. The linear score is the logit, and the sigmoid is the probability.","o":["$e^{\\beta_0 + \\beta^\\top x}$","$\\beta_0 + \\beta^\\top x$","$1/(1 + e^{-(\\beta_0 + \\beta^\\top x)})$","$\\log P(Y = 1)$"],"a":0},{"sec":8,"q":"Specificity is:","x":"Specificity is the share of actual negatives correctly classified. $FP/(FP+TN)$ is the false positive rate, $1 -$ specificity.","o":["$TP/(TP+FN)$","$TN/(TN+FP)$","$FP/(FP+TN)$","$(TP+TN)/n$"],"a":1},{"sec":8,"q":"The ROC curve plots:","x":"Each threshold gives one (FPR, TPR) point; the curve shows the full trade-off.","o":["precision vs. recall","true positive rate vs. false positive rate across all thresholds","accuracy vs. threshold","sensitivity vs. specificity at $t = 0.5$ only"],"a":1},{"sec":8,"q":"Which loss charges nothing for points with margin $\\ge 1$?","x":"$\\max(0, 1 - yu) = 0$ when $yu \\ge 1$. Logistic loss is positive for every margin, though small for large margins.","o":["Logistic loss","Hinge loss","Squared loss","0–1 loss"],"a":1},{"sec":8,"q":"In the quality-of-care model, the coefficients on OfficeVisits and Narcotics are positive. This means:","x":"Poor care is coded $+1$, and positive coefficients raise the logit and so $P(Y = 1)$.","o":["more visits/narcotics increase the odds of poor care","more visits/narcotics increase the odds of good care","the variables are insignificant","the model is misspecified"],"a":0},{"sec":9,"q":"In robust-in-both logistic regression, how are feature and label robustness combined?","x":"The feature adversary's effect is to reduce each margin by $\\rho\\|\\beta\\|_{q^*}$; plugging the shrunk margin into the label-robust counterpart gives robustness to both.","o":["By averaging the two robust counterparts","By using the label-robust formulation with every margin shrunk by $\\rho\\|\\beta\\|_{q^*}$","By adding an $\\ell_1$ penalty","They cannot be combined"],"a":1},{"sec":9,"q":"How are $\\rho$ and $\\Gamma$ chosen in practice?","x":"The experiments pick them on a 20% validation split, then retrain on train + validation.","o":["They are always 1","By domain knowledge or cross-validation on a validation set","By maximizing training accuracy","From the Fenchel conjugate"],"a":1},{"sec":9,"q":"In which region of nominal in-sample accuracy did robust-in-both LR help least?","x":"Improvements fell from 7.7% (below 60%) to about 0.2% (90–100%). Robustness helps most on hard, noisy problems.","o":["0–60%","60–70%","70–80%","90–100%"],"a":3},{"sec":9,"q":"The integer label set $\\mathcal U_y$ can be relaxed to $\\{0 \\le \\Delta y \\le 1, \\sum\\Delta y_i \\le \\Gamma\\}$ because:","x":"A linear objective over a polytope with integral vertices attains its optimum at an integer point, so the relaxation is exact.","o":["$\\Gamma$ is small","the objective is linear in $\\Delta y$ and the relaxed polytope has integer extreme points","labels are continuous","logistic loss is linear"],"a":1},{"sec":10,"q":"(Book) The gradient of $c(s)$ in sparse classification is obtained:","x":"Evaluating $c(s)$ by solving the dual gives $\\alpha^*(s)$, which yields every gradient entry with no extra cost, enabling outer approximation.","o":["for free from the optimal dual variables: $\\partial c/\\partial s_j = -\\tfrac\\gamma2(\\alpha^{*\\top}X_j)^2$","by finite differences","from a closed-form matrix inverse only","it is not needed"],"a":0},{"sec":10,"q":"(Book) As sample size $n$ grows in sparse logistic regression, the number of cuts needed:","x":"As in sparse regression, more data makes the problem easier: thousands of cuts at small $n$, very few at large $n$.","o":["grows exponentially","drops sharply (a phase transition), to fewer than twenty","stays constant","is always one"],"a":1},{"sec":10,"q":"(Book) What initial solution does the sparse classification algorithm use?","x":"Lasso gives a cheap, reasonable support to start outer approximation, consistent with the heuristic-plus-MIO playbook.","o":["All zeros","A random support","The Lasso estimator (GLMNet)","The full model"],"a":2},{"sec":12,"q":"Which lecture's main computational step is \"sum of the $k$ largest residuals\" via LP duality?","x":"The top-$k$ sum $\\max\\{\\sum z_ir_i : \\sum z_i = k, 0\\le z\\le1\\}$ has dual $\\min k\\theta + \\sum u_i$; it is used in stable regression and inside $H_m$ for median regression.","o":["Lec 3, sparse regression","Lec 4, stable regression (and the SLO step of Lec 5)","Lec 6, feature-robust logistic regression","Lec 7, holistic regression"],"a":1},{"sec":12,"q":"Which method is NOT an example of solving a large problem by generating constraints or cuts on demand?","x":"Hard thresholding is a projected gradient heuristic that produces feasible solutions; the other three iteratively add cuts or constraints.","o":["Outer approximation for sparse regression","Delayed constraint generation for convex regression","Worst-case scenario generation for robust regression","Hard thresholding for best subset"],"a":3},{"sec":12,"q":"The course's view of Lasso is best summarized as:","x":"Ch. 2 explains its predictive success through robustness, while Ch. 3, 5 and 6 show high false-discovery rates compared with exact methods.","o":["good predictor because it is robust, but a poor selector because it adds false features","a poor predictor and a poor selector","an exact solution to best subset","strictly dominated by OLS"],"a":0},{"sec":13,"q":"In JuMP, how do you read the values of an array of variables `β` after solving?","x":"`value` acts on a single variable; the dot broadcasts it over the array.","o":["`value(β)`","`value.(β)`","`β.value`","`getvalue(β)` only for scalars"],"a":1},{"sec":13,"q":"When $\\rho = 0$ in the HW1 B-only/A-only experiments, the reported $w$:","x":"An auxiliary variable is only pinned to its intended value when it appears in the objective with positive weight.","o":["equals $\\max_j|\\beta_j|$ exactly","is meaningless, since it is unpriced and can be anything $\\ge \\max_j|\\beta_j|$","is always zero","equals $u$"],"a":1},{"sec":1,"q":"Lec 1 lists a 29,000× speedup from CPLEX 1.2 (1991) to CPLEX 11 (2007) and a 160× speedup from Gurobi 1.0 to Gurobi 9.0. Combined, the software-only speedup is about:","o":["about 4.6 million×","about 29,160×, since the gains add","about 8 million×","about 37.6 trillion×"],"a":0,"x":"Speedups from consecutive solver generations multiply: $29{,}000 \\times 160 \\approx 4.64$ million. Adding them (29,160) is the common slip; 8 million is the hardware factor and 37.6 trillion is software × hardware."},{"sec":1,"q":"Using only the software speedup (about 4.7 million×), an MIO that took 55 days to solve in 1991 now takes roughly:","o":["about 55 minutes","about one second","about 12 seconds","under a microsecond"],"a":1,"x":"55 days is 4,752,000 s, and $4{,}752{,}000 / 4{,}700{,}000 \\approx 1$ s, the slide's 'less than one second on the same 25-year-old computer'. A fraction of a microsecond would need the 8 million× hardware factor too."},{"sec":1,"q":"(Book) The 2019 textbook quotes an earlier total MIO speedup than the Lec 1 slides. Which figure is it?","o":["About 37.6 trillion× (4.7 million× Gurobi solver × 8 million× hardware)","About 4.7 million× (solver speedup only, 1991–2022)","About 2 trillion× (≈1.25 million× solver × ≈1.56 million× hardware)","About 29,000× (CPLEX 1.2 to CPLEX 11)"],"a":2,"x":"The book (data through 2015) gives $1{,}250{,}000 \\times 1{,}560{,}000 \\approx 2$ trillion. The slides update this to 37.6 trillion with 2022 solver and 2016 hardware numbers."},{"sec":1,"q":"According to Lec 1, which statement about the sizes each problem class scales to is correct?","o":["SDO and SOCP to millions; LO to hundreds of thousands","LO to millions; SOCP and SDO to the hundreds","all three to millions, via interior point methods","LO and SOCP to millions; SDO to the hundreds"],"a":3,"x":"The slides say SOCPs scale to millions of dimensions and SDO to $X$ with dimensions in the 100s; diagonal $X$ (LO) scales to millions. The PSD constraint is what makes SDO expensive, not conic structure in general."},{"sec":1,"q":"A trading desk needs a portfolio MIO solved in milliseconds; a planning team can wait hours for a regression MIO of the same size. Under Bertsimas's definition of practability:","o":["the same problem can be practable for planning but not for trading","both are intractable because the MIO is NP-hard","both are practable because MIO solvers are 37.6 trillion× faster","practability depends only on the asymptotic running time of the best algorithm"],"a":0,"x":"Practable means solvable at the sizes and times the application needs, so it depends on the application. The slide states that asymptotic polynomial solvability or NP-hardness is not relevant under this definition."},{"sec":1,"q":"Best subset selection $\\min_\\beta \\tfrac12\\|y-X\\beta\\|_2^2$ s.t. $\\|\\beta\\|_0 \\le k$, written with binary indicators $z_j$, belongs to which Lec 1 problem class?","o":["Second order cone optimization","Mixed integer quadratic optimization (QMIO)","Semidefinite optimization","Linear optimization after relaxing $z$ to $[0,1]$"],"a":1,"x":"Binary support indicators plus a convex quadratic objective give a QMIO (MIQO). Relaxing $z$ to $[0,1]$ is not equivalent; that weak relaxation is exactly the big-M problem from Lec 3."},{"sec":1,"q":"In the Lec 1 SVM preview $\\min_{w,b}\\tfrac12\\|w\\|_2^2 + C\\sum_i\\max\\{1-y_i(w^\\top x_i-b),0\\}$, increasing $C$:","o":["widens the margin $2/\\|w\\|$ by shrinking $w$ harder","switches the loss from hinge to logistic","trades margin width for fewer margin violations","has no effect, since the hinge term is already convex"],"a":2,"x":"$C$ multiplies the hinge term, so a larger $C$ trades margin width (the $\\|w\\|^2$ term) for fewer points inside or beyond the margin. Widening the margin is what a smaller $C$ does."},{"sec":1,"q":"Lec 1 attributes the recent progress in convex optimization mainly to:","o":["interior point methods for SDO, which now scale to millions of dimensions","branch-and-bound, which certifies global optimality","the 37.6 trillion× hardware and software speedup of MIO","first-order methods, which give fast running times in high dimensions"],"a":3,"x":"The CO slide says the use of first-order methods enables fast running times in high dimensions. SDO still scales only to the hundreds, and the trillion× figure is about MIO."},{"sec":1,"q":"The Lec 1 preview contrasts optimal classification trees with CART. The key difference is that optimal trees:","o":["optimize all splits jointly in one MIO","use only axis-aligned splits, unlike CART","minimize squared error, not misclassification","average many randomized trees"],"a":0,"x":"CART is greedy and myopic, so it can miss a split that only pays off deeper in the tree; an optimal tree optimizes the whole partition at once. Averaging randomized trees describes random forests."},{"sec":2,"q":"Using Rec 1's patterns for binaries, which constraint models 'if at least $k$ of $z_1,\\dots,z_n$ equal 1, then $y = 1$'?","o":["$z_1+\\dots+z_n \\le k\\,y$","$z_1+\\dots+z_n-(k-1) \\le n\\,y$","$k\\,y \\le z_1+\\dots+z_n$","$n\\,y \\ge z_1+\\dots+z_n-k$"],"a":1,"x":"With $k$ or more ones the left side is at least 1, so $ny \\ge 1$ forces binary $y = 1$; with $k-1$ or fewer it is $\\le 0$ and $y$ is free. $k\\,y \\le \\sum z_j$ is the converse (y = 1 only if at least $k$), $\\sum z_j \\le k\\,y$ forces $y = 1$ as soon as any $z_j$ is 1, and $n\\,y \\ge \\sum z_j - k$ misses exactly $k$."},{"sec":2,"q":"Which constraint models 'we sit day 3 if we sit day 1 or day 2' (sitting day 3 alone stays allowed)?","o":["$z_3 \\le z_1 + z_2$","$z_3 \\ge z_1 + z_2 - 1$","$z_3 \\ge \\tfrac12(z_1 + z_2)$","$z_3 \\le \\tfrac12(z_1 + z_2)$"],"a":2,"x":"If either $z_1$ or $z_2$ is 1 the right side is at least $1/2$, forcing $z_3 = 1$; if both are 0 nothing is imposed. $z_3 \\le z_1+z_2$ is the converse (day 3 only if day 1 or 2), $z_3 \\ge z_1+z_2-1$ fires only when both are 1, and $z_3 \\le \\tfrac12(z_1+z_2)$ allows day 3 only with both."},{"sec":2,"q":"Rec 1's maximin objective $\\max\\min\\{f_1,f_2,f_3\\}$ (make your worst exam day as good as possible) is linearized as:","o":["$\\max t$ s.t. $t \\ge f_j$ for all $j$","$\\min t$ s.t. $t \\le f_j$ for all $j$","$\\max \\sum_j t_j$ s.t. $t_j \\le f_j$, $t_j \\le -f_j$","$\\max t$ s.t. $t \\le f_j$ for all $j$"],"a":3,"x":"$t$ is a hypograph variable: being below every $f_j$ makes it at most the minimum, and maximizing pushes it up to equal the minimum. $t \\ge f_j$ is the epigraph form for min–max; with a max objective it is unbounded."},{"sec":2,"q":"How do you linearize a constraint $|f(x)| \\le g(x)$, with $f$ and $g$ linear?","o":["$f(x) \\le g(x)$ and $-f(x) \\le g(x)$, with no new variable","Replace it by $f(x)^2 \\le g(x)$","Add a binary $b$ and big-M to choose the sign of $f(x)$","It cannot be linearized, because the absolute value is nonconvex"],"a":0,"x":"$|f| \\le g$ is exactly the pair $f \\le g$ and $-f \\le g$, since $|f| = \\max\\{f,-f\\}$. A sign binary is only needed for a reverse-convex constraint like $|f| \\ge g$, as in holistic regression's significance constraint."},{"sec":2,"q":"In the exam LP the point values become uncertain, and the objective could be $2x_1 + 8x_2$ instead of $4x_1 + 7x_2$ (same constraints). The optimal plan under $c = (2,8)$ is:","o":["$(8, 2)$, scoring 32","$(0, 6)$, scoring 48","$(8, 1)$, scoring 24","$(4, 4)$, scoring 40"],"a":1,"x":"Per minute, Type 2 now earns 0.8 versus 0.4 for Type 1, so all 60 minutes go to six Type 2 questions. The nominal optimum $(8,2)$ scores only 32 under this tilt, which is Rec 1's motivation for robust optimization: tilting $c$ moves the optimal corner."},{"sec":2,"q":"The exam LP ($\\max 4x_1+7x_2$, $5x_1+10x_2 \\le 60$, $x_1 \\le 8$) has dual solution $p^* = (0.7, 0.5)$. With 61 minutes instead of 60, the LP optimum becomes:","o":["46.5","47","46.7","53"],"a":2,"x":"The dual price of a minute is 0.7, so one more minute adds 0.7 (the LP gives $x = (8, 2.1)$, score 46.7). 46.5 uses the question bank's price 0.5, and 53 adds a whole Type 2 question."},{"sec":2,"q":"For $\\max 4x_1+7x_2$ s.t. $5x_1+10x_2 \\le 60$, $x_1 \\le 8$, $x \\ge 0$, which weight vector $(p_1, p_2)$ does NOT give a valid upper bound by weighting and adding the constraints?","o":["$(0.8, 0)$","$(0.75, 0.3)$","$(1, 0)$","$(0.6, 1.5)$"],"a":3,"x":"A valid certificate needs $p \\ge 0$, $5p_1+p_2 \\ge 4$ and $10p_1 \\ge 7$. $(0.6,1.5)$ has $10p_1 = 6 < 7$, so its weighted sum does not dominate $4x_1 + 7x_2$ even though it would 'prove' 48. The others prove 48, 47.4 and 60."},{"sec":3,"q":"Robust regression with an entrywise $\\ell_1$ budget $\\mathcal U_{F(1)} = \\{\\Delta : \\sum_{ij}|\\Delta_{ij}| \\le \\rho\\}$ and $\\ell_1$ loss is equivalent to:","o":["$\\min_\\beta \\|y-X\\beta\\|_1 + \\rho\\|\\beta\\|_\\infty$","$\\min_\\beta \\|y-X\\beta\\|_1 + \\rho\\|\\beta\\|_1$","$\\min_\\beta \\|y-X\\beta\\|_1 + \\rho\\|\\beta\\|_2$","$\\min_\\beta \\|y-X\\beta\\|_\\infty + \\rho\\|\\beta\\|_1$"],"a":0,"x":"For Frobenius sets the penalty is the conjugate norm: $q = 1$ gives $q^* = \\infty$. Writing $\\|\\beta\\|_1$ forgets the conjugation, which is skipped only for induced sets $\\mathcal U_{(r,q)}$."},{"sec":3,"q":"For the Frobenius set $\\mathcal U_{F(3)}$ with $\\ell_3$ loss, the equivalent penalty is $\\rho\\|\\beta\\|_s$ with $s =$:","o":["$3$","$3/2$","$1/3$","$2/3$"],"a":1,"x":"Conjugate exponents satisfy $1/3 + 1/s = 1$, so $s = 3/2$. $s = 3$ would be right for an induced set $\\mathcal U_{(3,3)}$, where the penalty uses the first index $r$ directly."},{"sec":3,"q":"Take $\\beta = (3, -5, 1)$. The adversary's best damage $\\max_{\\|\\delta\\|_1 \\le 2}\\delta^\\top\\beta$ equals:","o":["18","11.83","10","6"],"a":2,"x":"$\\max_{\\|\\delta\\|_1\\le\\rho}\\delta^\\top\\beta = \\rho\\|\\beta\\|_\\infty = 2\\cdot5$: an $\\ell_1$ budget is spent entirely on the largest $|\\beta_j|$. 18 is $\\rho\\|\\beta\\|_1$ (the box answer) and 11.83 is $\\rho\\|\\beta\\|_2$."},{"sec":3,"q":"Same $\\beta = (3,-5,1)$, now a box budget: $\\max_{\\|\\delta\\|_\\infty \\le 0.5}\\delta^\\top\\beta$ equals:","o":["2.5","2.96","1.5","4.5"],"a":3,"x":"In a box each entry moves independently, $\\delta_j = 0.5\\,\\mathrm{sign}(\\beta_j)$, giving $0.5\\|\\beta\\|_1 = 0.5\\cdot9$. 2.5 is $0.5\\|\\beta\\|_\\infty$, the $\\ell_1$-budget answer; the dual of $\\ell_\\infty$ is $\\ell_1$."},{"sec":3,"q":"In the proof that $\\max_{\\Delta\\in\\mathcal U_{(r,q)}}\\|y-(X+\\Delta)\\beta\\|_q = \\|y-X\\beta\\|_q + \\rho\\|\\beta\\|_r$, which step establishes the $\\ge$ direction?","o":["Exhibiting one $\\Delta_0 \\in \\mathcal U$ that attains the bound","Applying the triangle inequality to split off $\\|\\Delta\\beta\\|_q$","Using $\\|\\Delta\\beta\\|_q \\le \\|\\Delta\\|_{r,q}\\|\\beta\\|_r$ for every $\\Delta \\in \\mathcal U$","Taking the LP dual of the inner maximization"],"a":0,"x":"The triangle inequality and the induced-norm inequality give the universal $\\le$ bound. The $\\ge$ direction is existential: construct a feasible witness and evaluate it. Writing the $\\le$ argument twice is the flagged mistake."},{"sec":3,"q":"In the cutting-plane approach to robust regression, when is a new perturbation $\\Delta_t^*$ added to the list $\\mathcal U_t$?","o":["When the worst case over $\\mathcal U_t$ beats the true worst case at $\\beta_t^*$","When the true worst case at $\\beta_t^*$ beats the worst case over $\\mathcal U_t$","At every iteration, until $\\mathcal U_t$ holds $n$ perturbations","When $\\beta_t^*$ moves more than $\\epsilon$ from $\\beta_{t-1}^*$"],"a":1,"x":"$\\mathcal U_t \\subseteq \\mathcal U$, so the list adversary can never beat the true one; a strict gap means the list is too optimistic and $\\Delta_t^* \\in \\arg\\max_{\\Delta\\in\\mathcal U}$ joins it. The reversed inequality can never hold."},{"sec":3,"q":"In Lec 2's averaged-uncertainty theorem, the box set $\\mathcal U_2 = \\{\\|\\Delta\\|_\\infty \\le \\rho\\}$ gives a ridge penalty with weight $f(n,k,\\rho) = \\rho^2 n/3$. For $n = 30$ and $\\rho = 0.3$ the weight is:","o":["0.09","2.7","0.9","0.3"],"a":2,"x":"$0.3^2\\cdot30/3 = 0.09\\cdot10 = 0.9$. Averaging (not worst-casing) the squared loss over any of the four sets gives a squared $\\ell_2$ penalty; only this constant changes."},{"sec":4,"q":"One iteration of the discrete first-order method with $k = 2$ and $L = 2$: $\\beta_m = (1, 0, 0.5, -1)$ and $\\nabla g(\\beta_m) = (1, -4, 3, -1)$. Then $\\beta_{m+1}$ is:","o":["$(1, 0, 0, -1)$","$(0.5, 2, 0, 0)$","$(0, 1.5, -0.5, 0)$","$(0, 2, -1, 0)$"],"a":3,"x":"$u = \\beta_m - \\tfrac1L\\nabla g = (0.5, 2, -1, -0.5)$ and $H_2$ keeps the two largest $|u_j|$. Thresholding $\\beta_m$ instead of $u$ gives $(1,0,0,-1)$; shrinking the survivors by 0.5 is soft thresholding, Lasso's step."},{"sec":4,"q":"In the Lec 3 diabetes experiment ($n=350$, $p=64$, 500 s cap), what did warm-starting the MIO with the first-order solution mainly change?","o":["It proved optimality in time (77 s at $k=20$); cold starts ended unproven","The answer improved from about 15% off optimal to optimal, at the same solve time","The first-order solution was already optimal, so the MIO only confirmed it","The lower bound became tight at the root node, so no branching was needed at all"],"a":0,"x":"Cold-start MIO reached about 0.4% relative accuracy but hit the 500 s cap without a proof; warm-started it reached 0 and terminated. A good incumbent prunes the tree, so warm starts buy the certificate. The first-order solution alone was 13–19% off."},{"sec":4,"q":"Why is an MIO still needed after the hard-thresholding algorithm converges?","o":["Hard thresholding can return iterates with more than $k$ nonzeros","It certifies only a fixed point, not global optimality","The iterates diverge unless the step uses $L < \\ell$","The method is only defined when $n$ exceeds $p$"],"a":1,"x":"The bound $\\min_m\\|\\beta_{m+1}-\\beta_m\\|^2 \\le 2(g(\\beta_1)-g(\\bar\\beta))/(M(L-\\ell))$ controls step size, so it certifies $\\bar\\beta = H_k(\\bar\\beta - \\nabla g(\\bar\\beta)/L)$ only. It needs $L > \\ell$, and every iterate is $k$-sparse by construction."},{"sec":4,"q":"For $p = 100$ and $k = 10$, the number of supports in $S_k = \\{s \\in \\{0,1\\}^p : e^\\top s \\le k\\}$ is about:","o":["$1.7 \\times 10^{13}$","$1{,}000$","$1.9 \\times 10^{13}$","$1.3 \\times 10^{30}$"],"a":2,"x":"$|S_k| = \\sum_{j\\le 10}\\binom{100}{j} \\approx 1.94\\times10^{13}$ (Rec 2's table). $1.7\\times10^{13}$ is $\\binom{100}{10}$ alone (exactly 10 features) and $1.3\\times10^{30}$ is $2^{100}$. Each support costs a matrix inverse, so enumeration is out."},{"sec":4,"q":"In Rec 2's cutting-plane algorithm for $\\min_{s\\in S_k}c(s)$, the loop stops when:","o":["$\\eta_t$ exceeds $c(s_t)$ by more than $\\epsilon$","the support $s_t$ has exactly $k$ ones","the gradient $\\nabla c(s_t)$ vanishes","the bound $\\eta_t$ reaches $c(s_t)$"],"a":3,"x":"The loop runs while $\\eta_t < c(s_t)$, i.e. while the piecewise-linear model underestimates $c$ at its own minimizer. When they meet the model is exact there, so $s_t$ is optimal. $\\eta_t$ can never exceed $c(s_t)$, and $\\nabla c$ is nonpositive, rarely zero."},{"sec":4,"q":"Lec 3's diabetes design matrix has $p = 64$ columns. Where does 64 come from?","o":["10 baseline + 45 interactions + 9 squares (sex² dropped)","10 baseline + 45 interactions + 10 squares − 1 intercept","10 baseline + 54 interaction and square terms of all 10 variables","$2^6$ dummy combinations of six serum measures"],"a":0,"x":"$x_{\\text{sex}}$ is binary, so $x_{\\text{sex}}^2 = x_{\\text{sex}}$ would be a perfectly collinear column; dropping it leaves 9 squares and $10+45+9 = 64$. The intercept version reaches 64 for the wrong reason."},{"sec":4,"q":"In the Lec 3 experiment with $n = 50$, $p = 2000$, how did Lasso's selected support compare with the truth as SNR rose from 3 to 10?","o":["It matched the true support once SNR reached 7","It kept over-selecting, and the gap did not close","It selected too few features because of shrinkage","It matched MIO's support size but predicted worse"],"a":1,"x":"Soft thresholding biases survivors toward zero, so Lasso compensates by admitting extra features; First Order + MIO tracked the true count and predicted better, with the gap widening at high SNR."},{"sec":5,"q":"Rec 3, ten listings, $k = 5$: the line $1500 + 2.5x$ has residuals $+60, +300, -80, -300, +200, -200, -250, +250, +100, +200$. Its stable-regression objective (no regularizer) is:","o":["1,940","1,100","1,300","1,500"],"a":2,"x":"The inner max returns the sum of the 5 largest $|r_i|$: $300+300+250+250+200 = 1300$. 1,940 sums all ten (plain LAD), 1,100 stops at four and 1,500 takes six."},{"sec":5,"q":"At that LP optimum the dual variable $\\theta$ equals 200. What is $\\theta$?","o":["The mean of the worst $k$ residuals","The largest absolute residual","The intercept shift balancing the residuals","The $k$-th largest absolute residual"],"a":3,"x":"At the optimum $\\theta = |r|_{(k)}$ and $u_i = \\max(|r_i| - \\theta, 0)$, so $k\\theta + \\sum u_i = 5\\cdot200 + (100+100+50+50) = 1300$. The average over the worst five would be 260."},{"sec":5,"q":"What does stable regression reduce to when $k = n$?","o":["LAD regression on all points","Ordinary least squares on all points","The Chebyshev ($\\ell_\\infty$) fit","Training on one random split"],"a":0,"x":"$\\sum z_i = n$ forces $z = \\mathbf 1$, leaving $\\sum_i|y_i - x_i^\\top\\beta|$ plus the regularizer. Stable regression uses absolute residuals, so it is LAD, not OLS; the Chebyshev fit is LQAD with $q = n$."},{"sec":5,"q":"Two luxury units sit far above an otherwise linear rent trend among ten listings. Rec 3 found stable regression barely moves at $k=5$ but is pulled up at $k=3$. Why?","o":["At $k=3$ the regularizer is weaker relative to the total loss","They're a minority of the worst 5 but a majority of the worst 3","Squared residuals give the two outliers more weight at small $k$","At $k=5$ the luxury units drop out of the worst set entirely"],"a":1,"x":"At the optimum the worst set must balance points above and below the line (the optimality condition for $\\beta_0$). Two above against three below can't tip it at $k=5$; at $k=3$ they are the majority. Residuals are absolute, not squared."},{"sec":5,"q":"Rec 3 stresses that the stable line is not 'the fit to the hardest split'. Which numbers show this?","o":["Its worst-five error, 2,154, equals the hardest split's fit","Its worst-five error, 1,338, equals least squares on all ten","Its worst-five error, 1,300, beats the best split fit's 1,304","It coincides with the least-squares fit to the five large listings"],"a":2,"x":"Graded on its own worst five, every split's fit scores at least 1,304, and the hardest split's fit scores 2,154. Stable regression minimizes the worst case directly, so it beats all of them."},{"sec":5,"q":"In Lec 4's results, the improvement in hyperparameter ($\\lambda$) stability grew toward 80/20 and 90/10, the reverse of the other metrics. Why?","o":["Large training sets make the adversary's choice of $z$ arbitrary","At 90/10 the stable problem becomes an MIO that fixes $\\lambda$","Prediction gains vanish, so stability gains rise by construction","Random-split $\\lambda$ gets noisy as the validation set shrinks"],"a":3,"x":"$\\lambda$ is chosen on the validation set, which shrinks at 80/20 and 90/10, so random-split $\\lambda$ varies a lot between runs. Prediction-error and coefficient gains shrink instead, since large random training sets already contain most hard points."},{"sec":5,"q":"In the time-series extension with free segment length, what does subtracting $\\lambda\\sum_t |z_{t+1} - z_t|$ from the adversary's objective do?","o":["Each switch costs $\\lambda$, favoring few, long segments","It forces exactly $k$ segments, each of length $h$","It penalizes the learner for large AR coefficients","It breaks total unimodularity, so the binaries must be kept"],"a":0,"x":"$\\sum_t|z_{t+1}-z_t|$ counts segment boundaries, so pricing it discourages fragmented selections without hard-coding $h$. After linearizing with $v_{1t}, v_{2t}$ the matrix is still TU, so relaxation and dualization still apply."},{"sec":5,"q":"HW2 Q2(c): stable classification with hinge loss becomes $\\min k\\theta + \\sum_i u_i$ s.t. $\\theta + u_i \\ge \\max\\{1 - y_i(\\beta^\\top x_i + \\beta_0), 0\\}$, $u_i \\ge 0$. How many continuous variables does the LP have?","o":["$n + p + 1$","$n + p + 2$","$2n + p + 2$","$p + 2$"],"a":1,"x":"$\\beta \\in \\mathbb R^p$, $\\beta_0$, $\\theta$ and $u \\in \\mathbb R^n$ give $p + 1 + 1 + n$. The hinge max splits into two linear constraints per point ($\\theta + u_i \\ge 1 - m_i$ and $\\theta + u_i \\ge 0$) without new variables."},{"sec":5,"q":"HW2 Q2(b): with the misclassification loss $\\mathbb 1\\{y_i(\\beta^\\top x_i + \\beta_0) \\le 0\\}$, is the top-$k$ dual reformulation still valid, and can it go straight to a solver?","o":["Invalid, because the LP duality step requires a loss convex in $\\beta$","Valid and solver-ready: it is an LP in $(\\theta, u)$","Valid, but not solver-ready: the indicator is nonconvex in $\\beta$","Invalid: tied losses break the sorting argument of part (a)"],"a":2,"x":"Relaxing and dualizing happens for fixed $(\\beta,\\beta_0)$ and only treats the $c_i$ as numbers, so equivalence holds for any loss. But $\\theta + u_i \\ge \\mathbb 1\\{\\cdot\\}$ is discontinuous in $\\beta$ and would need binaries and big-M."},{"sec":5,"q":"HW2 Q2(d): in the cutting-plane route for stable classification, the separation problem at an incumbent $(\\beta^1, \\beta_0^1)$ is solved by:","o":["an MIO over $z$, enumerating up to $\\binom nk$ candidates","solving the dual LP (2.2) from scratch, $O(n^3)$","evaluating one random feasible $z$, which costs $O(n)$","a sort: sum the $k$ largest losses, $O(n\\log n)$"],"a":3,"x":"By part (a), $\\max_{z\\in Z}\\sum z_ic_i$ is the sum of the $k$ largest $c_i$, so the most violated constraint comes from a sort (or selection in $O(n)$). No search over the $\\binom nk$ points of $Z$ is needed."},{"sec":6,"q":"Rec 3's rents at 0.5, 1.0, …, 5.0 miles end with chord slope $-100$ per mile between 4.5 and 5.0 mi, with rent 2,050 at 5 mi. If rent is convex in distance, rent at 8 mi is at least:","o":["1,750","551","2,050","1,450"],"a":0,"x":"Convexity makes slopes nondecreasing, so past 5 mi the slope is at least $-100$ per mile: $2050 - 3\\cdot100 = 1750$. 551 is the least-squares line's extrapolation, which the smiling residuals already reject."},{"sec":6,"q":"HW2 Q1(a): the data $(x_i, f(x_i))$ come from a non-convex $f$. Does non-regularized convex regression always give a nonzero objective?","o":["Yes: $\\theta = y$ always violates some convexity constraint","No: a finite sample of a non-convex $f$ can look convex, giving 0","No: the problem becomes infeasible, so the objective is undefined","Yes: a max of tangent planes can never interpolate the data"],"a":1,"x":"Convexity is only checked at the sampled points, e.g. three points of $\\sin x$ taken on a convex stretch fit exactly. The problem is never infeasible, since any linear function satisfies every constraint."},{"sec":6,"q":"Full convex regression with $n = 10{,}000$ points has how many pairwise convexity constraints?","o":["100,000,000","49,995,000","99,990,000","10,000"],"a":2,"x":"One constraint per ordered pair $i \\ne j$: $n(n-1) = 10{,}000\\cdot9{,}999$. 49,995,000 counts unordered pairs, but the constraints for $(i,j)$ and $(j,i)$ differ because each uses its own subgradient."},{"sec":6,"q":"HW2 Q3, $p = 1$, points sorted $x_1 < \\dots < x_n$. Dividing the forward constraint $\\theta_k + \\xi_k(x_{k+1}-x_k) \\le \\theta_{k+1}$ by $h_k = x_{k+1}-x_k$ gives:","o":["$\\xi_k \\ge c_k$: the slope at $x_k$ is at least the chord slope","$\\xi_{k+1} \\ge c_k$","$c_k \\le c_{k+1}$","$\\xi_k \\le c_k$: the slope at $x_k$ is at most the chord slope"],"a":3,"x":"$\\xi_k h_k \\le \\theta_{k+1}-\\theta_k$ gives $\\xi_k \\le c_k$. The backward constraint gives $c_k \\le \\xi_{k+1}$; only both together chain into $\\xi_1 \\le c_1 \\le \\xi_2 \\le c_2 \\le \\dots$, which is why one direction alone leaves violations."},{"sec":6,"q":"HW2 Q3(b): with $p = 2$, imposing both directions on Delaunay-neighbour pairs does not guarantee all $n(n-1)$ constraints, unlike adjacent pairs for $p = 1$. Why?","o":["The $p=1$ proof telescopes along an order $\\mathbb R^2$ lacks","A Delaunay triangulation has fewer than $n-1$ edges to impose","Subgradients in $\\mathbb R^2$ cannot be bounded by chord slopes","The slope penalty stops being strictly convex in two dimensions"],"a":0,"x":"For $p=1$ the distance and height difference telescope over the links between $i$ and $j$, and monotone slopes finish the argument. In the plane there is no left-to-right order, so local conditions do not chain into global ones."},{"sec":6,"q":"What happens to convex regression $\\tfrac12\\sum(y_i-\\theta_i)^2 + \\tfrac1{2\\gamma}\\sum\\|\\xi_i\\|^2$ as $\\gamma \\to 0$?","o":["The slope penalty vanishes and the fit interpolates the data points","All $\\xi_i \\to 0$, so all $\\theta_i$ are equal and the fit is $\\bar y$","The fit converges to the ordinary least-squares regression line","The constraints conflict and the problem becomes infeasible"],"a":1,"x":"A huge slope penalty drives every $\\xi_i \\to 0$; then $\\theta_i \\le \\theta_j$ for all pairs means all $\\theta$ are equal, and least squares picks the mean. Interpolation (for convex data) is the $\\gamma \\to \\infty$ end."},{"sec":6,"q":"A convex regression fit has $\\theta = (4, 1, 2)$ at $x = (0, 1, 3)$ with subgradients $\\xi = (-4, -1, 1)$. The fitted value $f(2)$ is:","o":["0","$-4$","1","1.5"],"a":2,"x":"$f(x) = \\max_i\\{\\theta_i + \\xi_i(x - x_i)\\}$; the three tangents give $-4$, $0$ and $1$ at $x = 2$, so $f(2) = 1$. 1.5 interpolates linearly between $x=1$ and $x=3$, but the fit is a max of tangents, not a chord."},{"sec":6,"q":"Separation for point $i$ with $x_i = 1$, $\\hat\\theta_i = 1$, $\\hat\\xi_i = 0.5$; the other points are at $x = 0, 2, 3$ with $\\hat\\theta = 3, 0, 2$. Which constraint is added for $i$?","o":["The pair $(i, j)$ with $x_j = 3$, violation 1","The pair $(i, j)$ with $x_j = 0$, violation 2.5","None: no constraint for $i$ is violated","The pair $(i, j)$ with $x_j = 2$, violation 1.5"],"a":3,"x":"The violation $\\hat\\theta_i - \\hat\\theta_k + \\hat\\xi_i(x_k - x_i)$ is $-2.5$, $1.5$ and $0$ for $x_k = 0, 2, 3$. The tangent at $x_i$ passes 1.5 above the point at $x = 2$, so that constraint is added; the point at $x=3$ lies exactly on the tangent."},{"sec":6,"q":"Rec 3 describes convex regression's inductive bias as 'shape only'. What does it NOT ask you to choose?","o":["A polynomial degree, knots, kernel or bandwidth","Whether the relationship should be convex or concave","The weight $\\gamma$ of the slope penalty","The starting chain of constraints for generation"],"a":0,"x":"Convex regression fixes only the shape and lets the data set the rest, so there is no degree, knot or bandwidth. You still pick the shape direction, $\\gamma$ (which stops near-vertical pieces) and an initial constraint set."},{"sec":6,"q":"What scale does Lec 5 report for convex regression with delayed constraint generation?","o":["$(10^5, 10^2)$ in seconds; $(10^6, 10^3)$ in minutes","$(10^4, 10)$ in minutes; $(10^5, 10^2)$ in hours","Only $n \\le 1{,}000$, since the QP has $n^2$ constraints","$(10^3, 10)$ at most; larger $n$ is out of reach"],"a":1,"x":"Because only violated constraints are added, the master QP stays small even though the full problem has $n(n-1)$ constraints, about $10^{10}$ at $n = 10^5$."},{"sec":7,"q":"What does LQAD, $\\min_\\beta|r_{(q)}|$, become when $q = n$?","o":["LMAD, the median fit with 50% breakdown","LAD, $\\min_\\beta\\sum_i|y_i - x_i^\\top\\beta|$","The Chebyshev fit $\\min_\\beta\\|y - X\\beta\\|_\\infty$","Ordinary least squares, $\\min_\\beta\\|y-X\\beta\\|_2$"],"a":2,"x":"$|r_{(n)}|$ is the largest residual, so $q = n$ minimizes the maximum error and a single outlier controls the fit. LMAD is $q = \\lceil n/2\\rceil$."},{"sec":7,"q":"You have $n = 150$ points and believe up to 45 may be arbitrarily corrupted. Following Rec 4, which $q$ should LQAD use?","o":["75","45","150","105"],"a":3,"x":"The band must be able to hold only clean points, so $q \\le 150 - 45 = 105$, and taking the largest such $q$ keeps the most data. LMAD's 75 is safe but discards points that may be clean; 150 is the Chebyshev fit."},{"sec":7,"q":"Geometrically, LQAD with parameter $q$ finds:","o":["the thinnest band around a hyperplane that contains at least $q$ points","the hyperplane minimizing the sum of the $q$ smallest squared residuals","the band containing the $q$ points farthest from the median","the hyperplane passing exactly through $q$ points"],"a":0,"x":"$|r_{(q)}| \\le \\gamma$ iff at least $q$ points lie within $\\gamma$ of the fit, so minimizing $\\gamma$ gives the thinnest $q$-point band. The other $n - q$ points can move anywhere without widening it."},{"sec":7,"q":"In the LQAD MIO ($\\gamma \\ge |r_i| - \\mu_i$, $\\mu_i \\le M(1 - z_i)$, $\\sum z_i = q$), what goes wrong if $M$ is smaller than the largest residual at the LQAD-optimal $\\beta$?","o":["The MIO becomes infeasible, because no binary $z$ satisfies it","Dropped points can't be fully excused, so the answer is wrong","Nothing changes; $M$ only affects the solve time","The relaxation tightens and the answer is unchanged"],"a":1,"x":"With $\\mu_i \\le M < |r_i|$, the constraint $\\gamma \\ge |r_i| - M$ still binds for a dropped point and distorts the objective. As in best subset, too small an $M$ silently changes the problem; too large only weakens the relaxation."},{"sec":7,"q":"In Rec 4's example (twelve stores on $y \\approx 1 + 0.5x$, plus three records near $x = 9.5$ entered wrong), what happened?","o":["Least squares and LAD both recovered the slope; LMAD was unstable","LAD recovered the slope because it is robust to outliers","LS flipped the slope's sign, LAD did no better, LMAD fit the twelve","All three gave nearly the same line since 3 of 15 is a small fraction"],"a":2,"x":"The bad records sit at extreme $x$ (leverage points), which pull both squared and absolute losses; LAD's breakdown point is still 0. LMAD's objective never sees the worst half of the residuals."},{"sec":7,"q":"In LQAD's subgradient method, $\\partial f_q(\\beta) = -\\mathrm{sgn}(y_{(q)} - x_{(q)}^\\top\\beta)\\,x_{(q)}$. Which statement is correct?","o":["All points with residual below $|r_{(q)}|$ contribute equally","Each step is guaranteed to decrease $|r_{(q)}|$, so keep the last iterate","Each iteration solves one LP over $(\\theta, \\nu, \\beta)$","Only the $q$-th residual's point drives a step; keep the best iterate"],"a":3,"x":"$|r_{(q)}|$ depends locally on a single point, so the subgradient uses only that point. Subgradient steps are not monotone, so the best iterate seen is returned; the LP-per-iteration method is SLO."},{"sec":7,"q":"In the SLO step for $|r_{(q)}| = H_q(\\beta) - H_{q+1}(\\beta)$, how are the two pieces handled?","o":["Dualize $H_q$; replace $-H_{q+1}$ by minus its tangent at $\\beta^k$","Linearize $H_q$ at $\\beta^k$; write $H_{q+1}$ through its LP dual","Linearize both $H_q$ and $H_{q+1}$ at $\\beta^k$","Dualize both and solve the difference exactly as one LP"],"a":0,"x":"Dualizing $H_q$ turns it into a min that merges with the outer min. A convex function lies above its tangent, so $-H_{q+1} \\le -(\\text{tangent})$ and the surrogate upper-bounds the objective. Linearizing $H_q$ instead would give a lower bound and lose monotone descent."},{"sec":7,"q":"Absolute residuals at some $\\beta$ are $0.5, 3, 1, 7, 2, 4$ ($n = 6$). With $q = 4$, $H_4(\\beta)$, the sum of the $n - q + 1$ largest absolute residuals, is:","o":["11","14","3","16"],"a":1,"x":"Sorted: $0.5, 1, 2, 3, 4, 7$. $H_4$ sums the 3 largest, $3 + 4 + 7 = 14$; $H_5 = 4 + 7 = 11$, and $H_4 - H_5 = 3 = |r_{(4)}|$ as the DC decomposition requires. 16 sums the four largest."},{"sec":7,"q":"HW2 Q1(b): minimizing the sum of the $k$ lowest absolute residuals $|y_i - x_i^\\top\\beta|$ can be formulated as a linear MIO. True or false?","o":["False: it is convex, so the top-$k$ LP dual already gives an LP","False: the objective is nonlinear in $\\beta$ even for a fixed selection","True: binaries pick which $k$ points count; big-M excuses the rest","True, but the binaries can be relaxed because the selection set is TU"],"a":2,"x":"The sum of the $k$ smallest is a min over subsets, nonconvex in $\\beta$, so the top-$k$ dual (which handles the $k$ largest) does not apply and binaries stay. For a fixed selection the objective is piecewise linear, which linearizes with $t_i \\ge \\pm r_i$."},{"sec":7,"q":"Why does the sum of the $k$ largest absolute residuals (Lec 4) dualize into one LP while LQAD (Lec 5) needs an MIO?","o":["LQAD selects features, while Lec 4 selects samples","LQAD's objective is quadratic in the residuals","The top-$k$ sum ignores the outliers, so no selection is needed at all","The sum of the $k$ largest is convex in $\\beta$; $|r_{(q)}|$ is not"],"a":3,"x":"$\\max_z\\sum z_i|r_i|$ over the TU polytope is a max of convex functions, so it is convex and its inner LP dualizes into a single min. A $q$-th order statistic is a difference of convex functions, and LMS/LQAD is NP-hard."},{"sec":7,"q":"In Lec 5's large-scale LQAD results ($n$ up to 10,001, $p$ up to 20), what were the methods' roles?","o":["Cold MIO 230–420% off; Alg. 3 hit the optimum; warm MIO certified it","Cold-start MIO solved every instance to proven optimality within the limit","Algorithm 3 was 10–105% off, as inaccurate as MASS `lqs`","Warm-started MIO improved Algorithm 3's solution by 10–20%"],"a":0,"x":"At scale the subgradient + SLO hybrid does the finding (14–546 s) and the MIO only proves optimality. The 10–105% gap belongs to MASS `lqs`, which is fast but inaccurate."},{"sec":8,"q":"Quality-of-care model: logit $= -2.65 + 0.082\\,\\text{OfficeVisits} + 0.076\\,\\text{Narcotics}$. For a patient with 10 office visits and 5 narcotics prescriptions, $P(\\text{poor care})$ is about:","o":["0.23","0.19","0.81","0.50"],"a":1,"x":"Logit $= -2.65 + 0.82 + 0.38 = -1.45$, so $P = 1/(1 + e^{1.45}) \\approx 0.19$. 0.23 is the odds $e^{-1.45}$, not the probability. At $t = 0.5$ this patient is classified as good care."},{"sec":8,"q":"In the same model, one extra narcotics prescription multiplies the odds of poor care by about:","o":["1.076, since odds rise by the coefficient","1.507","1.079, i.e. odds up about 7.9%","1.0, because probabilities change but odds do not"],"a":2,"x":"Odds $= e^{\\beta_0 + \\beta^\\top x}$, so a unit increase multiplies them by $e^{0.076} \\approx 1.079$. 1.507 is $e^{0.082\\cdot5}$, five extra office visits; the change in probability itself is not constant."},{"sec":8,"q":"Training confusion matrix at $t = 0.2$: TN 54, FP 20, FN 9, TP 16. Sensitivity and specificity are:","o":["0.73 and 0.64","0.44 and 0.86","0.64 and 0.27","0.64 and 0.73"],"a":3,"x":"Sensitivity $= TP/(TP+FN) = 16/25 = 0.64$ and specificity $= TN/(TN+FP) = 54/74 \\approx 0.73$. 0.27 is the false positive rate $20/74$; 0.44 and 0.86 are precision and negative predictive value."},{"sec":8,"q":"On the 32-patient test set at $t = 0.5$ (TN 23, FP 1, FN 5, TP 3), how does the model compare with the test-set baseline?","o":["81.3% vs 75.0%: it beats predicting good care for everyone","81.3% vs 74.8%: the test baseline is the full-data baseline","37.5% vs 75.0%: it misses most poor-care cases, so it loses","71.9% vs 75.0%: it loses to the baseline"],"a":0,"x":"Accuracy $= (23+3)/32 = 81.3\\%$. The test set has 24 good-care patients, so its baseline is $24/32 = 75\\%$; 74.8% is the full-data baseline (98/131). 37.5% is sensitivity, a different metric."},{"sec":8,"q":"At $t = 0.7$ (training: TN 73, FP 1, FN 17, TP 8), the false positive rate plotted on the ROC x-axis is:","o":["0.32","0.014","0.99","0.11"],"a":1,"x":"FPR $= FP/(FP+TN) = 1/74 \\approx 0.014$, one minus specificity (0.99). 0.32 is sensitivity $8/25$, the ROC y-coordinate; 0.11 is $FP/(FP+TP)$. High $t$ sits near the bottom-left of the curve."},{"sec":8,"q":"The logistic loss is $\\log(1 + e^{-m})$ for margin $m$. For points with margins $+2$ and $-2$ the losses are about:","o":["0 and 2","0.69 and 0.69","0.13 and 2.13","0.13 and 0.87"],"a":2,"x":"$\\log(1+e^{-2}) \\approx 0.127$ and $\\log(1+e^{2}) \\approx 2.127$. For very negative margins the loss grows like $-m$; a confident correct point costs little but not exactly 0, unlike the hinge loss past margin 1."},{"sec":8,"q":"On the ROC curve, where does the threshold $t \\approx 1$ sit?","o":["Near $(1,1)$: every patient is predicted positive","Near $(0,1)$: perfect classification","Where the curve crosses the diagonal","Near $(0,0)$: almost nothing is predicted positive"],"a":3,"x":"Predict $+1$ iff $P \\ge t$; with $t \\approx 1$ there are almost no positive predictions, so TP and FP (hence TPR and FPR) are near 0. Sweeping $t$ down to 0 moves the curve to $(1,1)$."},{"sec":8,"q":"Why is logistic regression fit by Newton–Raphson (IRLS) or SGD instead of in closed form?","o":["It is concave but its maximizer has no closed form","The log-likelihood is nonconvex with many local optima","It is an LP that is too large for simplex","Labels in $\\{-1,+1\\}$ make the gradient undefined"],"a":0,"x":"Setting the gradient $\\sum_i y_ix_i\\sigma(-m_i)$ to zero gives nonlinear equations with no explicit solution, so iterative methods are used. Concavity means they reach the global optimum."},{"sec":8,"q":"(Book) Why does the book add $\\tfrac1{2\\gamma}\\|\\beta\\|_2^2$ to the logistic negative log-likelihood in regularized classification?","o":["It turns the problem into a linear program","It ensures strict convexity and existence of an optimum","It enforces sparsity in the coefficient vector $\\beta$","It is the robust counterpart of label flips"],"a":1,"x":"The book says the regularizer ensures strict convexity and existence of an optimal solution; without it, separable data let $\\|\\beta\\| \\to \\infty$ improve the likelihood forever. Sparsity needs $\\|\\beta\\|_0$, and label robustness gives the $\\mu, \\nu$ dual terms."},{"sec":9,"q":"Label-robust LR: point $i$ has margin $m_i = 3$. Flipping its label changes its log-likelihood term by $c_i = \\log\\frac{1+e^{-m_i}}{1+e^{m_i}}$, which equals:","o":["$-0.05$","$+3$","$-3$","$-6$"],"a":2,"x":"$1 + e^{-m} = e^{-m}(1 + e^{m})$, so the ratio is $e^{-m}$ and $c_i = -m_i$ (Rec 4's 'fun fact'). A flip costs exactly the margin, so confidently correct points are the most damaging to flip."},{"sec":9,"q":"Margins are $(2.5, -1, 0.3, 4, 1.2)$ and $\\Gamma = 2$. Which labels does the adversary flip, and by how much does the log-likelihood fall?","o":["The points with margins $-1$ and 0.3; it falls by 0.7","The points with margins 4 and 2.5; it falls by 0.1","The points with margins $-1$ and 4; it falls by 5","The points with margins 4 and 2.5; it falls by 6.5"],"a":3,"x":"Each flip changes the term by $-m_i$, so the adversary takes the two largest margins: $4 + 2.5 = 6.5$. Flipping a misclassified point ($m = -1$) would raise the likelihood by 1."},{"sec":9,"q":"Feature-robust LR with box uncertainty $\\|\\Delta x_i\\|_\\infty \\le 0.1$ and $\\beta = (2, -1)$. A point with nominal margin 1.5 has worst-case margin:","o":["1.2","1.276","1.3","1.8"],"a":0,"x":"The box ($q = \\infty$) pairs with the dual norm $q^* = 1$: the shrink is $\\rho\\|\\beta\\|_1 = 0.1\\cdot3 = 0.3$. 1.276 uses $\\|\\beta\\|_2$ and 1.3 uses $\\|\\beta\\|_\\infty$; the adversary lowers the margin, never raises it."},{"sec":9,"q":"HW2 Q1(d) claims the feature-robust counterpart is $\\max -\\sum_i\\log(1 + e^{-y_i(\\beta^\\top x_i+\\beta_0) + \\rho\\|\\beta\\|_q})$, with the same norm $q$ as the uncertainty set. This is:","o":["True: robustness and penalty always use the same norm","False: the term uses the dual norm $\\|\\beta\\|_{q^*}$","False: the term belongs outside the log as $+\\rho\\|\\beta\\|_{q^*}$","True, because $y_i = \\pm1$ makes the norm symmetric"],"a":1,"x":"$\\min_{\\|\\Delta x_i\\|_q\\le\\rho}y_i\\beta^\\top\\Delta x_i = -\\rho\\|\\beta\\|_{q^*}$ by the definition of the dual norm. The two agree only for the self-dual $q = 2$, so the general claim is false; the term does sit inside the exponent."},{"sec":9,"q":"For feature-robust LR with $\\|\\Delta x_i\\|_\\infty \\le \\rho$, the worst-case perturbation of point $i$ is:","o":["$\\Delta x_i = -\\rho\\,y_i\\,\\beta/\\|\\beta\\|_2$","$\\Delta x_i = +\\rho\\,y_i\\,\\mathrm{sgn}(\\beta)$","$\\Delta x_i = -\\rho\\,y_i\\,\\mathrm{sgn}(\\beta)$","All of $\\rho$ on the coordinate with the largest $|\\beta_j|$"],"a":2,"x":"Each coordinate moves $\\rho$ against the margin, lowering it by $\\rho\\|\\beta\\|_1$. $-\\rho y_i\\beta/\\|\\beta\\|_2$ is the $\\ell_2$ case, and concentrating everything on the largest $|\\beta_j|$ is the $\\ell_1$ case."},{"sec":9,"q":"A dataset has nominal in-sample accuracy $a = 70\\%$ and $p = 8$ features. Does the rule $\\log_{10}(p) \\ge 0.05a - 2.5$ recommend robust LR?","o":["Yes: $\\log_{10}8 \\approx 0.90 \\ge 0.5$","Yes: any accuracy below 80% qualifies","No: it would need $p \\ge 31.6$","No: $\\log_{10}8 \\approx 0.90 < 1.0$"],"a":3,"x":"$0.05\\cdot70 - 2.5 = 1.0$, so the threshold is $p \\ge 10^{1.0} = 10$. 31.6 is the threshold at $a = 80\\%$."},{"sec":9,"q":"In robust-in-both LR, why doesn't the flip cost simplify to $-m_i$ as in the label-only case?","o":["Both margins carry $-\\rho\\|\\beta\\|_{q^*}$, so the ratio isn't $e^{-m_i}$","Feature robustness turns the binary labels into continuous variables","The budget $\\Gamma$ must be relaxed to a continuous value","The logistic loss gets replaced by the hinge loss in both of the terms"],"a":0,"x":"The kept label has margin $m_i - \\rho\\|\\beta\\|_{q^*}$ and the flipped one $-m_i - \\rho\\|\\beta\\|_{q^*}$. With the common $+\\rho\\|\\beta\\|$ in both exponents, $\\log\\frac{1+e^{-m_i+\\rho\\|\\beta\\|}}{1+e^{m_i+\\rho\\|\\beta\\|}} \\ne -m_i$."},{"sec":9,"q":"Rec 4 replaces $f_i(\\Delta y_i) = -\\log(1 + e^{-(1-2\\Delta y_i)m_i})$ by its chord on $[0,1]$. Why does relaxing $\\Delta y_i$ to $[0,1]$ not help the adversary?","o":["$f_i$ is convex in $\\Delta y_i$, so it lies below its chord","$f_i$ is concave in $\\Delta y_i$, so it is minimized at an endpoint","$f_i$ is constant in $\\Delta y_i$ whenever $m_i > 0$","The adversary maximizes $f_i$, and convex maxima sit at endpoints"],"a":1,"x":"The adversary minimizes the likelihood, and a concave function on an interval attains its minimum at an endpoint, so a split flip never beats a full flip. With the chord the inner problem is an LP over a polytope with integral vertices."},{"sec":9,"q":"(Book) How does the solve time of feature-robust and label-robust logistic regression compare with nominal LR?","o":["Both run in about the same time as nominal LR","Feature-robust 1–2 orders slower; label-robust ≈ nominal","Feature-robust ≈ nominal; label-robust 1–2 orders slower","Both become MIOs and run 1–2 orders slower"],"a":2,"x":"Feature robustness only adds a norm term to each margin; label robustness adds the $\\mu, \\nu$ duals and $n$ coupled constraints. Only the label-robust SVM becomes an MIO."},{"sec":9,"q":"In the label-robust counterpart ($\\max \\dots + \\Gamma\\mu + \\sum_i\\nu_i$ s.t. $\\mu + \\nu_i \\le c_i$, $\\mu, \\nu_i \\le 0$), what are $\\mu$ and $\\nu_i$?","o":["$\\mu$: dual of $\\Delta y_i \\le 1$; $\\nu_i$: duals of the budget $\\sum\\Delta y_i \\le \\Gamma$","Slack variables measuring how far each robust margin is below 1","$\\mu$: multiplier of the intercept $\\beta_0$; $\\nu_i$: of each $\\beta_j$","$\\mu$: dual of the budget $\\sum\\Delta y_i \\le \\Gamma$; $\\nu_i$: duals of $\\Delta y_i \\le 1$"],"a":3,"x":"Same structure as Lec 4's $\\theta, u$: $\\Gamma\\mu + \\sum\\nu_i$ equals the sum of the $\\Gamma$ most negative $c_i$, the adversary's best flips. Both are $\\le 0$ because the adversary can only lower the likelihood."},{"sec":10,"q":"(Book) In practice the cardinality-constrained classification problem is usually replaced by an $\\ell_1$-penalized proxy. In the book's view, what does that proxy really provide?","o":["Robustness, rather than true sparsity","Exact sparsity once $\\lambda$ is large enough","A certificate of optimality for the $\\ell_0$ problem","Protection against label flips"],"a":0,"x":"As in regre
