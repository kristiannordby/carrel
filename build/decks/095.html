t change its count of nonzeros, $\\|\\cdot\\|_0$ fails homogeneity. It is also nonconvex, which is why the problem is combinatorial.","bk":false},{"s":4,"t":"term","f":"SOS-1 constraint (special ordered set type 1)","b":"$(1 - z_i)\\beta_i = 0$: either $z_i = 1$ or $\\beta_i = 0$. No $M$ needed; solvers handle it by special branching.","x":"SOS-1 avoids choosing $M$ entirely, but solvers can't use it in the LP relaxation directly; they branch on it instead.","bk":false},{"s":4,"t":"term","f":"Big-M sparsity constraint","b":"$-M z_i \\le \\beta_i \\le M z_i$, $z_i\\in\\{0,1\\}$, $\\sum_i z_i \\le k$. Linear, but needs a valid bound $M \\ge |\\beta_i^*|$.","x":"The big-M version is linear and easy to write, but its strength depends entirely on how tight $M$ is.","bk":false},{"s":4,"t":"term","f":"$S_k$ (support set)","b":"$\\{s \\in \\{0,1\\}^p : e^\\top s \\le k\\}$, the binary supports with at most $k$ features.","x":"$S_k$ is the feasible region of the dual reformulation: binary vectors with at most $k$ ones. Its size is what makes enumeration hopeless.","bk":false},{"s":4,"t":"term","f":"Lipschitz continuous gradient","b":"$\\|\\nabla g(\\beta) - \\nabla g(\\beta')\\| \\le \\ell\\|\\beta - \\beta'\\|$. For $g = \\tfrac12\\|y-X\\beta\\|^2 + \\tfrac1{2\\gamma}\\|\\beta\\|^2$: $\\ell = \\lambda_{\\max}(X^\\top X + I/\\gamma)$.","x":"A Lipschitz gradient means the function curves at most as fast as $\\ell$, which justifies the quadratic upper bound that the first-order method minimizes.","bk":false},{"s":4,"t":"term","f":"Hard-thresholding operator $H_k(u)$","b":"Keeps the $k$ largest-magnitude entries of $u$ and zeroes the rest. It solves $\\min_\\beta \\|\\beta - u\\|_2^2$ s.t. $\\|\\beta\\|_0 \\le k$ exactly.","x":"Projecting onto the $\\ell_0$ ball is easy even though the set is nonconvex: keep the $k$ biggest entries. That is the whole trick behind the discrete first-order method.","bk":false},{"s":4,"t":"term","f":"First-order stationary point (sparse)","b":"$\\bar\\beta$ with $\\|\\bar\\beta\\|_0 \\le k$ and $\\bar\\beta = H_k\\big(\\bar\\beta - \\tfrac1L\\nabla g(\\bar\\beta)\\big)$, a fixed point of the discrete first-order algorithm.","x":"Stationarity here means a gradient step followed by hard thresholding returns the same point. It is a local condition, not proof of global optimality.","bk":false},{"s":4,"t":"term","f":"Kernel matrix $K_j$","b":"$K_j = X_j X_j^\\top \\in \\mathbb{R}^{n\\times n}$ for column $X_j$. $\\sum_j s_j K_j = X S X^\\top$ is the kernel of the selected features.","x":"Each $K_j$ is the rank-one contribution of feature $j$ to the kernel $XX^\\top$. Selecting features means summing the selected $K_j$.","bk":false},{"s":4,"t":"term","f":"Gram (kernel) matrix $K$","b":"$K = XX^\\top$, where $K_{ij} = x_i^\\top x_j$ is the inner product between samples. Symmetric PSD.","x":"The Gram matrix only depends on inner products between samples, so methods written in terms of $K$ scale with $n$ rather than $p$.","bk":false},{"s":4,"t":"term","f":"Convex integer optimization (CIO)","b":"Minimizing a convex function over binary/integer points, e.g. $\\min_{s\\in S_k} c(s)$.","x":"CIO combines convex objectives with integrality. Sparse regression's dual form is CIO, and outer approximation is the standard way to solve it.","bk":false},{"s":4,"t":"term","f":"Outer approximation (OA)","b":"Solving a convex integer problem by minimizing the max of tangent cuts $\\eta \\ge c(s_i) + \\nabla c(s_i)^\\top(s - s_i)$ and adding a cut at each new point. A piecewise-linear lower bound that tightens each round.","x":"Each cut is a tangent plane of the convex function, so the max of the cuts always underestimates it. Minimizing that underestimate gives a valid lower bound that improves every round.","bk":false},{"s":4,"t":"term","f":"Lazy constraint (single-tree OA)","b":"Add cuts from inside one branch-and-bound tree whenever an integer-feasible solution is found, instead of re-solving a new MIO per cut (multi-tree).","x":"Lazy constraints avoid restarting branch-and-bound after each cut, which is the main engineering reason the dual method is fast.","bk":false},{"s":4,"t":"term","f":"Accuracy $A\\%$ (support recovery)","b":"$100 \\times |\\mathrm{Supp}(\\beta^*) \\cap \\mathrm{Supp}(\\beta_{\\text{true}})| / k$: the share of true features found (\"the whole truth\").","x":"Accuracy asks \"did you find all the true features?\" It ignores how many extras you added, which is why it is paired with $F\\%$.","bk":false},{"s":4,"t":"term","f":"False alarm / false discovery $F\\%$","b":"$100 \\times |\\mathrm{Supp}(\\beta^*) \\setminus \\mathrm{Supp}(\\beta_{\\text{true}})| / |\\mathrm{Supp}(\\beta^*)|$: the share of selected features that are fake (\"nothing but the truth\").","x":"False discovery asks \"how many selected features are fake?\" Lasso tends to score well on accuracy but poorly on this.","bk":false},{"s":4,"t":"term","f":"Phase transition","b":"A sharp change in behavior as $n$ grows past a threshold: support recovery jumps to perfect, false alarms drop to 0, and solve time collapses.","x":"Phase transitions show sharp regime changes: below a sample-size threshold, recovery fails and solving is slow; above it, recovery is perfect and solving is fast.","bk":false},{"s":4,"t":"q","f":"Why is the sparsity constraint \"not a luxury but a necessity\" when $n < p$? And when $n > p$?","b":"If $n < p$, $\\mathrm{rank}(X) \\le n$, so the null space of $X$ is nontrivial: infinitely many $\\beta$ fit exactly and training error can't tell them apart, so the problem is ill-posed without sparsity. If $n > p$, the problem is well defined, but sparsity gives simpler, more interpretable models.","x":"With $n < p$, OLS has infinitely many exact fits, so you need a constraint like sparsity to pick one. With $n > p$ the fit is unique, but sparsity still buys interpretability.","bk":false},{"s":4,"t":"q","f":"Rec 2 poll: $n = 200$ patients, $p = 20{,}000$ genes, OLS. How many $\\beta$ fit the training data exactly?","b":"Infinitely many. $\\mathrm{rank}(X) \\le 200$, so $\\dim\\ker X \\ge 19{,}800$; add any null-space vector to a perfect fit and you get another perfect fit.","x":"The null space of $X$ has dimension at least $p - n = 19{,}800$, and adding any null-space vector to a perfect fit keeps it perfect.","bk":false},{"s":4,"t":"q","f":"History of best subset vs. Lasso.","b":"Furnival & Wilson (1974): implicit enumeration (\"leaps\" in R), which can't scale past $p \\approx 30$. Tibshirani (1996): Lasso, a convex $\\ell_1$ relaxation that scales to huge problems. Candès–Tao: under regularity conditions on $X$ (low column correlation / incoherence), Lasso gives sparse models with good prediction. The belief that best subset is intractable pushed the field to Lasso.","x":"Best subset was abandoned because exact enumeration hit a wall around $p = 30$, not because it was a bad estimator. Lasso won on computation.","bk":false},{"s":4,"t":"q","f":"Write the big-M MIO for sparse regression.","b":"$$\\min_{\\beta, z}\\ \\tfrac12\\|y - X\\beta\\|_2^2 \\ \\ \\text{s.t.}\\ \\ |\\beta_i| \\le M_i z_i,\\ \\ \\sum_{i=1}^p z_i \\le k,\\ \\ z_i \\in \\{0,1\\}$$\n(The book adds $+\\tfrac1{2\\gamma}\\|\\beta\\|_2^2$.) A convex quadratic objective with $p$ binaries: an MIQO.","x":"The binary $z_i$ switches coefficient $i$ on or off, and the cardinality constraint caps the number switched on. The objective is a convex quadratic, so it is an MIQO.","bk":false},{"s":4,"t":"q","f":"Two problems with the big-M formulation (Rec 2).","b":"(1) $M$ must be found first; there is no free bound on $|\\beta_j|$ like the clock gave in Rec 1. (2) The relaxation is weak: with $s_j \\in [0,1]$, a tiny $s_j = |\\beta_j|/M$ \"buys\" a fully active coefficient, so the lower bound sits far below the optimum.","x":"The two problems are practical (you need a valid $M$) and computational (the relaxation is weak), and both get worse as $p$ grows.","bk":false},{"s":4,"t":"q","f":"What happens if big-M is too **small** ($M < |\\beta_j^*|$)? (Rec 2 poll)","b":"The solver reports a **suboptimal** solution as \"optimal\". $\\beta = 0$ is always feasible, so the problem never becomes infeasible. It silently becomes a different problem (no $|\\beta_j| > M$) and the solver proves optimality for that problem. No warning.","x":"Because $\\beta = 0$ is always feasible, the solver never detects an infeasibility. It optimizes a different, more constrained problem and reports success.","bk":false},{"s":4,"t":"q","f":"What happens if big-M is too **large**?","b":"The model is still correct, but the LP relaxation is weak, lower bounds are loose, and branch-and-bound crawls.","x":"A large $M$ keeps the model correct but lets fractional $z$ cheaply \"turn on\" coefficients in the relaxation, which wrecks the lower bound.","bk":false},{"s":4,"t":"q","f":"How do you compute a valid big-M for sparse regression when $n > p$?","b":"Get an upper bound UB on the optimal value from a heuristic. Then solve two convex problems per $j$: $u_j^+ = \\max \\beta_j$ and $u_j^- = \\min \\beta_j$ s.t. $\\tfrac12\\|y - X\\beta\\|^2 + \\tfrac1{2\\gamma}\\|\\beta\\|^2 \\le \\text{UB}$ (no cardinality constraint, so these bound $\\beta_j^*$). Set $M = \\max\\{|u_j^+|, |u_j^-|\\}$.","x":"Any solution better than UB must satisfy the loss constraint, so maximizing and minimizing each $\\beta_j$ over that set bounds the optimal coefficient. This is valid when $n > p$ (the set is bounded).","bk":true},{"s":4,"t":"q","f":"Diabetes data in Lec 3: how were $p = 64$ features built?","b":"442 patients with 10 baseline measurements (age, sex, BMI, blood pressure, six blood serum measures); subsample $n = 350$. Features: 10 originals + $\\binom{10}{2} = 45$ pairwise interactions + 9 squares. $x_{\\text{sex}}^2$ is dropped because sex is binary ($x^2 = x$, perfectly collinear).","x":"Adding interactions and squares creates correlated features, which is exactly where exact subset selection outperforms Lasso.","bk":false},{"s":4,"t":"q","f":"Overall strategy for solving the primal MIO (Lec 3).","b":"Use a discrete first-order method to find good feasible solutions quickly, then warm-start the MIO (with an improved formulation, e.g. tight $M$). The MIO then mostly has to **certify** optimality.","x":"The heuristic supplies a strong incumbent cheaply; the MIO then spends its time proving that no better solution exists.","bk":false},{"s":4,"t":"q","f":"Typical upper/lower bound behavior of MIO for sparse regression?","b":"The upper bound (best feasible solution) hits the global optimum early. Most of the run time is spent raising the lower bound to prove optimality.","x":"Finding the optimum is fast; proving it is slow. This pattern shows up in every MIO plot in the course.","bk":false},{"s":4,"t":"q","f":"Derive the quadratic upper bound used by the first-order method.","b":"If $\\nabla g$ is $\\ell$-Lipschitz, then for any $L \\ge \\ell$:\n$$g(\\beta) \\le Q(\\beta) = g(\\beta_0) + \\langle\\nabla g(\\beta_0), \\beta - \\beta_0\\rangle + \\tfrac L2\\|\\beta - \\beta_0\\|_2^2$$\nwith equality at $\\beta = \\beta_0$. Minimize $Q$ instead of $g$ subject to $\\|\\beta\\|_0 \\le k$.","x":"The Lipschitz condition caps the curvature, so the quadratic with curvature $L \\ge \\ell$ sits above $g$ everywhere and touches it at $\\beta_0$. Minimizing it guarantees $g$ does not increase.","bk":false},{"s":4,"t":"q","f":"Why does minimizing $Q(\\beta)$ s.t. $\\|\\beta\\|_0 \\le k$ have a closed form?","b":"Complete the square: $Q(\\beta) = \\tfrac L2\\|\\beta - (\\beta_0 - \\tfrac1L\\nabla g(\\beta_0))\\|_2^2 + \\text{const}$. That is $\\min\\|\\beta - u\\|_2^2$ s.t. $\\|\\beta\\|_0 \\le k$ with $u = \\beta_0 - \\tfrac1L\\nabla g(\\beta_0)$, solved by $H_k(u)$ (keep the $k$ largest $|u_i|$).","x":"Completing the square turns the surrogate into \"closest $k$-sparse vector to a gradient step,\" which hard thresholding solves exactly.","bk":false},{"s":4,"t":"q","f":"Discrete first-order algorithm (Algorithm 1 / book Alg. 3.1).","b":"Start with $\\|\\beta_1\\|_0 \\le k$. Iterate $\\beta_{m+1} \\in H_k\\big(\\beta_m - \\tfrac1L\\nabla g(\\beta_m)\\big)$ (projected gradient step onto the sparsity set) until $g(\\beta_m) - g(\\beta_{m+1}) \\le \\varepsilon$. Output: a first-order stationary point.","x":"Each iteration is a gradient step followed by projection onto the sparsity constraint. It is projected gradient descent with a nonconvex but easy projection.","bk":false},{"s":4,"t":"q","f":"Convergence of the discrete first-order algorithm.","b":"$g(\\beta_m)$ decreases and converges. After $M$ iterations, $\\min_{m\\le M}\\|\\beta_{m+1} - \\beta_m\\|_2^2 \\le \\dfrac{2(g(\\beta_1) - g(\\bar\\beta))}{M(L - \\ell)}$, so $O(1/\\varepsilon)$ iterations suffice. (Book) The support stabilizes after finitely many steps, after which it behaves like GD on that support with a linear rate (strong convexity).","x":"The bound says the step sizes shrink at rate $O(1/M)$, so the iterates settle. Once the support stops changing, the method is ordinary gradient descent on a strongly convex problem and converges linearly.","bk":false},{"s":4,"t":"q","f":"Two practical refinements of the first-order method.","b":"**Polishing**: once the active set stabilizes (tolerance ~$10^{-4}$), fix it and solve the small convex problem on those coordinates. **Line search** (Alg. 3.2): take $\\eta_m = H_k(\\cdot)$, then $\\beta_m = \\lambda_m\\eta_m + (1-\\lambda_m)\\beta_{m-1}$ with $\\lambda_m$ minimizing $g$ along the segment. Better empirically.","x":"Polishing gets accurate coefficients on the chosen support, and line search improves each step. Both make the warm start stronger for the MIO.","bk":true},{"s":4,"t":"q","f":"Quality of solutions table (diabetes, $n=350$, $p=64$, 500 s limit): what's the message?","b":"First-order alone: ~13–19% relative gap, in 1 s. MIO cold start: small gap but hits the 500 s limit without proving optimality. MIO warm-started from first-order: reaches the optimum (0 gap) and certifies it faster. Warm starts matter.","x":"The table shows the division of labor: a fast heuristic gets close, the warm-started MIO closes the gap and proves optimality.","bk":false},{"s":4,"t":"q","f":"Sparsity detection, $n = 50$, $p = 2000$: Lasso vs. MIO.","b":"First-order + MIO selects close to the true number of nonzeros. Lasso selects far more (dense, many false features). MIO also has lower prediction error across SNRs.","x":"With $p = 2000$ and $n = 50$, Lasso must use many variables to fit well, while exact subset selection finds a small support with better prediction.","bk":false},{"s":4,"t":"q","f":"Dual reformulation, step 1: how do you eliminate big-M?","b":"Substitute $\\beta \\to S\\beta$ with $S = \\mathrm{Diag}(s)$, $s \\in S_k$. Switching $s_j$ off zeroes the coefficient by construction:\n$$\\min_{s\\in S_k} \\min_{\\beta\\in\\mathbb{R}^p}\\ \\tfrac12\\|y - XS\\beta\\|_2^2 + \\tfrac1{2\\gamma}\\|\\beta\\|_2^2.$$\nThe inner problem is unconstrained and convex, so it has a closed form.","x":"Multiplying $\\beta$ by a 0/1 diagonal matrix enforces \"off means zero\" algebraically, so no bound on $|\\beta_j|$ is needed.","bk":false},{"s":4,"t":"q","f":"Closed-form inner solution and resulting $c(s)$.","b":"$\\beta^*(s) = (I_p/\\gamma + SX^\\top XS)^{-1}SX^\\top y$. Substituting and applying the matrix inversion lemma:\n$$c(s) = \\tfrac12\\, y^\\top\\Big(I_n + \\gamma\\sum_{j=1}^p s_j K_j\\Big)^{-1} y,\\quad K_j = X_jX_j^\\top.$$\nSparse regression is equivalent to $\\min_{s \\in S_k} c(s)$.","x":"For fixed $s$ the inner problem is ridge regression on the selected columns, with a closed-form value. The matrix inversion lemma rewrites it in terms of an $n\\times n$ matrix.","bk":false},{"s":4,"t":"q","f":"Why is the binary convex reformulation better than big-M?","b":"No $\\beta$, no big-M, and no weak relaxation. $c(s)$ is convex in $s$, giving a pure binary convex problem over supports. Once $s^*$ is known, recover $\\beta^* = \\beta^*(s^*)$.","x":"Removing big-M removes both of its problems: no $M$ to guess and no weak relaxation. The remaining nonlinearity is a convex function of $s$, which cutting planes handle.","bk":false},{"s":4,"t":"q","f":"Lemma 3.1: two closed forms of the ridge regression loss $c$.","b":"$c = \\tfrac12 y^\\top\\big(I_n - X(I_p/\\gamma + X^\\top X)^{-1}X^\\top\\big)y = \\tfrac12 y^\\top(I_n + \\gamma XX^\\top)^{-1}y$. The two are linked by the matrix inversion lemma. The second depends on $X$ only through the $n\\times n$ kernel $XX^\\top$.","x":"The second form needs only the $n\\times n$ matrix $XX^\\top$, which is why the dual approach scales with $n$, not $p$.","bk":true},{"s":4,"t":"q","f":"Kernel dual of ridge regression (Thm 3.3) and why it matters.","b":"$$c = \\max_{\\alpha\\in\\mathbb{R}^n}\\ -\\tfrac\\gamma2\\alpha^\\top K\\alpha - \\tfrac12\\alpha^\\top\\alpha + y^\\top\\alpha,\\quad K = XX^\\top,\\ \\ \\beta^* = \\gamma X^\\top\\alpha^*.$$\nIt scales with $n$, not $p$. That is the source of the dual approach's power when $p \\gg n$, and it makes sparse regression \"subset selection over kernels\".","x":"The kernel dual is an unconstrained concave QP in $n$ variables, so its size doesn't grow with the number of features.","bk":true},{"s":4,"t":"q","f":"Gradient of $c(s)$ (Rec 2).","b":"With $A(s) = I_n + \\gamma\\sum_j s_jK_j$: $c(s) = \\tfrac12 y^\\top A(s)^{-1}y$ and $[\\nabla c(s)]_j = -\\tfrac\\gamma2\\, y^\\top A(s)^{-1}K_jA(s)^{-1}y = -\\tfrac\\gamma2\\,(X_j^\\top A(s)^{-1}y)^2$.","x":"The gradient comes from differentiating a matrix inverse: $\\partial A^{-1}/\\partial s_j = -A^{-1}(\\gamma K_j)A^{-1}$. Each entry is a squared inner product, so all entries are $\\le 0$ (adding a feature never hurts the fit).","bk":false},{"s":4,"t":"q","f":"Why not enumerate all supports?","b":"$|S_k| = \\sum_{j\\le k}\\binom pj$: about $2.2\\times10^4$ for $(p,k) = (20,5)$, $1.9\\times10^{13}$ for $(100,10)$, $2.7\\times10^{23}$ for $(1000,10)$. Each evaluation costs a matrix inverse.","x":"The counts grow combinatorially in $p$ and $k$; at $(1000, 10)$ there are more supports than atoms in a grain of sand.","bk":false},{"s":4,"t":"q","f":"Key convexity fact behind the cutting-plane method.","b":"A convex function lies above its tangents: $c(s) \\ge c(\\bar s) + \\nabla c(\\bar s)^\\top(s - \\bar s)$ for all $s, \\bar s$. So $c(s) = \\max_{\\bar s\\in S_k}\\{c(\\bar s) + \\nabla c(\\bar s)^\\top(s - \\bar s)\\}$: the max of all tangent cuts recovers $c$. Each evaluation is one linear cut, which an MIO solver handles.","x":"A convex function is the max of its tangent planes. Evaluating at a few points gives a piecewise-linear lower bound that's exact at those points.","bk":false},{"s":4,"t":"q","f":"Cutting-plane / outer approximation algorithm for sparse regression.","b":"1. Start from $s_1 = \\mathrm{Supp}(\\beta_1)$ (warm start), $\\eta_1 = 0$, $t = 1$.\n2. While $\\eta_t < c(s_t)$: solve $(s_{t+1}, \\eta_{t+1}) = \\arg\\min \\eta$ s.t. $\\eta \\ge c(s_i) + \\nabla c(s_i)^\\top(s - s_i)\\ \\forall i \\le t$, $s \\in S_k$; set $t \\leftarrow t+1$.\n3. Return $s^*$ and $\\beta^* = (I_p/\\gamma + S^*X^\\top XS^*)^{-1}S^*X^\\top y$.\nThe lower bound $\\eta$ rises each round and meets $c$ from below.","x":"Each round solves a MIO over the cuts collected so far, evaluates $c$ at the new support, and adds that tangent. The bound $\\eta$ climbs until it meets $c(s_t)$.","bk":false},{"s":4,"t":"q","f":"Does the cutting-plane method give an exact solution? Worst case?","b":"Yes: it terminates after finitely many cuts with the exact sparse regression solution (Thm 3.4). The worst case is exponentially many cuts, each an MIO solve, as expected for an NP-hard problem. Empirically the count is tiny (often a single cut when $n$ is large).","x":"Finite termination follows because $S_k$ is finite and each cut removes the current point unless it's optimal. The worst case is exponential, but in practice few cuts are needed.","bk":false},{"s":4,"t":"q","f":"Multi-tree vs. single-tree outer approximation.","b":"Multi-tree: re-solve a fresh MIO (new branch-and-bound tree) after each cut. Single-tree: one B&B tree, with cuts added as **lazy constraints** whenever an integer-feasible solution appears. Avoids rebuilding trees (the Rec 2 notebook uses a JuMP lazy constraint callback).","x":"Rebuilding a branch-and-bound tree per cut wastes work. Lazy constraints add cuts inside the same tree whenever a new integer solution appears.","bk":true},{"s":4,"t":"q","f":"Cost of generating one cut, naive vs. tailored?","b":"Naive: $O(n^3)$ (an $n\\times n$ inverse). Tailored: $O(k^3 + nk)$, exploiting that only $k$ features are active.","x":"Exploiting that only $k$ columns are active reduces the expensive inverse from $n \\times n$ to $k\\times k$.","bk":true},{"s":4,"t":"q","f":"Scalability of the dual / cutting-plane method vs. Lasso.","b":"Provably optimal for $n, p$ in the 100,000s in seconds to minutes, often **faster than Lasso** (glmnet). E.g. $p = 50$k, $n = 10$k, $k = 10$: 21.2 s exact vs. 69.5 s Lasso. Primal big-M MIO by comparison: $n,p$ in the 1,000s to optimality.","x":"Exact sparse regression being faster than Lasso at $n,p \\sim 10^5$ removes the main reason to use the heuristic.","bk":false},{"s":4,"t":"q","f":"Three phase transitions in exact sparse regression.","b":"(1) **Accuracy**: $A\\%$ jumps to 100. (2) **False discovery**: $F\\%$ drops to 0. (3) **Complexity**: solve time and number of cuts collapse. All three happen around the same sample size, so they are intimately related.","x":"All three transitions occur around the same $n$: when there is enough data, the problem becomes easy to solve and its solution becomes correct.","bk":false},{"s":4,"t":"q","f":"Lasso's support-recovery threshold, and how it compares with exact sparse regression (p = 2000, k = 10).","b":"Lasso needs $n_1 \\approx (2k + \\sigma^2)\\log(p - k)$ samples; theory gives 152, and empirically it needs ~180. Exact sparse regression transitions at $n_0 \\approx 125$. Both thresholds grow only logarithmically in $p$; the exact one also depends on SNR.","x":"Exact sparse regression needs fewer samples than Lasso to recover the support (125 vs ~180 here). Both thresholds depend only logarithmically on $p$.","bk":true},{"s":4,"t":"q","f":"What governs the phase transition, per the book's parametric study?","b":"Mainly $n/k$: above a threshold you get full recovery ($A = 100\\%$, $F = 0\\%$) with solve time in seconds that grows linearly in $n$. Below it, recovery fails and time grows combinatorially ($\\sim\\binom pk$). Dependence on $p$ is only logarithmic, and lower SNR shifts the transition later.","x":"What matters is samples per relevant feature. More noise (lower SNR) pushes the transition to larger $n$.","bk":false},{"s":4,"t":"q","f":"\"Remark on complexity\" in Lec 3.","b":"Traditional theory says difficulty grows with dimension. Sparse regression does the opposite in $n$: with few samples the dual approach is slow **and** the optimum doesn't recover the truth; with many samples it is extremely fast **and** recovers 100% of the support.","x":"Usually bigger problems are harder; here more data makes the problem easier and the answer more reliable. That contradicts the intuition from worst-case complexity.","bk":false},{"s":4,"t":"q","f":"Lasso vs. exact sparse regression on false discoveries.","b":"With $k$ chosen by cross-validation, Lasso keeps a high $F\\%$ even where its $A\\%$ is perfect: it finds the truth but adds many irrelevant features. Exact sparse regression reaches full recovery at nearly $F\\% = 0$. Lasso's strength is robustness, not sparsity.","x":"Lasso includes the true features plus many irrelevant ones, so its selection is not interpretable. Exact methods get the truth without the extras.","bk":false},{"s":4,"t":"q","f":"Three claims to remember from Lec 3's summary.","b":"(1) The dual method solves sparse regression with $n, p$ in the 100,000s to provable optimality in minutes. (2) MIO solutions detect sparsity better and beat Lasso in prediction. (3) Reconsider deeply rooted beliefs about complexity and the \"need\" for relaxations like Lasso.","x":"Scale, statistical edge, and a challenge to conventional wisdom: that is the lecture in three lines.","bk":false},{"s":4,"t":"q","f":"Is Lasso equivalent to sparse regression? (HW1 Q1f)","b":"No. Lasso is a convex problem (an $\\ell_1$ penalty, equivalent to robustness against feature-wise perturbations). Best subset is a cardinality-constrained, NP-hard problem. They generally have different solutions and Lasso typically selects extra false features. Statement \"Lasso is not equivalent\" is **true**.","x":"Lasso is a convex surrogate; the $\\ell_1$ penalty and the $\\ell_0$ constraint generally select different supports, and Lasso tends to add false features.","bk":false},{"s":4,"t":"q","f":"Scale best subset to $n, p$ in the 100,000s: run cutting planes on the big-M formulation? (HW1 Q1e)","b":"No. The scalable cutting-plane method runs on the **binary convex reformulation** $\\min_{s\\in S_k} c(s)$ (no $\\beta$, no big-M), cutting on $c$. The big-M primal MIO tops out around $n,p$ in the 1,000s. Statement **false**.","x":"The scalable method needs the binary convex reformulation, where cuts are on the convex function $c(s)$. The big-M form has a weak relaxation and no closed-form inner problem to cut on.","bk":false},{"s":5,"t":"term","f":"Stable regression (subpopulation-robust regression)","b":"Train against the **hardest** training set of size $k$ instead of a random split: $\\min_\\beta \\max_{z\\in\\mathcal Z}\\sum_i z_i|y_i - x_i^\\top\\beta| + \\lambda\\sum_j\\Gamma(\\beta_j)$.","x":"Instead of a random training set, you train on the worst-case training set. The model must fit the hard points, which reduces dependence on the luck of the split.","bk":false},{"s":5,"t":"term","f":"$\\mathcal Z$ (training-set selector)","b":"$\\{z \\in \\{0,1\\}^n : \\sum_i z_i = k\\}$. $z_i = 1$ means point $i$ is in the training set, $z_i = 0$ the validation set. $k = 0.7n$ gives a 70/30 split.","x":"$z$ encodes the train/validation split as a decision. Fixing $\\sum z_i = k$ keeps the training size at the desired fraction.","bk":false},{"s":5,"t":"term","f":"$\\Gamma(\\cdot)$ in stable regression","b":"The chosen regularizer applied per coefficient: $|\\beta_j|$ (Lasso), $\\beta_j^2$ (ridge), or both (elastic net).","x":"The regularizer sits outside the inner max because it doesn't depend on which points are selected.","bk":false},{"s":5,"t":"term","f":"$\\mathrm{conv}(\\mathcal Z)$","b":"$\\{z : \\sum_i z_i = k,\\ 0 \\le z_i \\le 1\\}$. Its vertices are exactly the binary points of $\\mathcal Z$ (integral polytope).","x":"The convex hull drops integrality, but because the inner objective is linear in $z$, its max is at a vertex, and every vertex is binary.","bk":false},{"s":5,"t":"term","f":"Totally unimodular (TU) matrix","b":"Every square submatrix has determinant in $\\{-1, 0, 1\\}$. With integer right-hand sides, the polytope has integral vertices, so an LP over it returns integer solutions. Used for the time-series uncertainty set.","x":"TU guarantees integer vertices for integer right-hand sides, so the LP relaxation solves the binary problem exactly. The time-series contiguity set relies on it.","bk":false},{"s":5,"t":"term","f":"Hardest training set","b":"The $z^*$ at the optimum: the $k$ points with the largest residuals under the learned $\\beta$.","x":"The hardest set is the $k$ points with the largest residuals at the optimal $\\beta$. It is also an object you can study and interpret.","bk":false},{"s":5,"t":"term","f":"Structural stability","b":"Low variability of the support and coefficients across random seeds/splits.","x":"Structural stability means the same features and similar coefficients appear regardless of the split, which is what makes a model interpretable and trustworthy.","bk":false},{"s":5,"t":"term","f":"Output stability","b":"Low variability of predictions (and of prediction error) across splits.","x":"Output stability means predictions don't swing with the random seed, which matters for any decision built on the model.","bk":false},{"s":5,"t":"q","f":"What is the standard train/validation/test paradigm, and what is wrong with it?","b":"Hold out a random ~10% test set, then randomly split the rest into train/validation (e.g. 70/30), fit on train, tune $\\lambda$ on validation, report on test. The model (coefficients, **even the support**, and $\\lambda$) depends on the luck of the random split; different splits give very different validation MSEs (7.3, 11.2, …, 17.9). That hurts interpretability and trust.","x":"Random splits introduce variance in everything downstream: coefficients, chosen support, and the selected $\\lambda$. Stable regression replaces the random choice with an optimized one.","bk":false},{"s":5,"t":"q","f":"Motivating analogy for stable regression (Lec 4)?","b":"How do you prepare for exams or a marathon? You train on the hardest material/conditions, not a random sample. Stable regression trains the model on the hardest subset.","x":"Preparing on the hardest material makes performance robust; the analogy motivates training against the hardest subset.","bk":false},{"s":5,"t":"q","f":"Write the stable regression formulation.","b":"$$\\min_\\beta \\max_{z\\in\\mathcal Z} \\sum_{i=1}^n z_i|y_i - x_i^\\top\\beta| + \\lambda\\sum_{j=1}^p\\Gamma(\\beta_j),\\quad \\mathcal Z = \\{z\\in\\{0,1\\}^n : \\textstyle\\sum_i z_i = k\\}$$\nThe adversary picks which $k$ points form the training set; the learner fits $\\beta$ against that worst case.","x":"It is a robust optimization problem over training sets. For fixed $\\beta$ the adversary chooses the subset; the learner chooses $\\beta$ to minimize the worst-case training loss.","bk":false},{"s":5,"t":"q","f":"Why can you replace $\\mathcal Z$ by $\\mathrm{conv}(\\mathcal Z)$ without changing the problem?","b":"For fixed $\\beta$ the inner objective is **linear** in $z$, so its max over the polytope is attained at a vertex, and the vertices of $\\{\\sum z_i = k, 0 \\le z \\le 1\\}$ are binary. So $\\max_{\\mathcal Z} = \\max_{\\mathrm{conv}\\mathcal Z}$.","x":"Linear objective over a polytope with integral vertices: relaxation is exact. This is the step that makes dualization legitimate.","bk":false},{"s":5,"t":"q","f":"For fixed $\\beta$, what does the inner max compute?","b":"The sum of the $k$ largest absolute residuals: grab the $k$ hardest points.","x":"With weights in $[0,1]$ summing to $k$, the best the adversary can do is put weight 1 on the $k$ largest residuals.","bk":false},{"s":5,"t":"q","f":"Dualize the inner LP $\\max_z \\sum_i z_i r_i$ s.t. $\\sum_i z_i = k$, $0 \\le z_i \\le 1$ ($r_i = |y_i - x_i^\\top\\beta|$).","b":"Multiplier $\\theta$ (free) on the equality, $u_i \\ge 0$ on $z_i \\le 1$:\n$$\\min_{\\theta, u}\\ k\\theta + \\sum_i u_i \\ \\ \\text{s.t.}\\ \\ \\theta + u_i \\ge r_i,\\ u_i \\ge 0.$$\nStrong LP duality gives equal values.","x":"The equality constraint gets a free multiplier $\\theta$, the upper bounds $z_i \\le 1$ get $u_i \\ge 0$, and each primal variable $z_i \\ge 0$ gives a dual constraint $\\theta + u_i \\ge r_i$.","bk":false},{"s":5,"t":"q","f":"Interpret $\\theta$ and $u_i$ in the stable regression dual.","b":"$\\theta$ is a threshold (the $k$-th largest residual at the optimum), and $u_i = \\max(r_i - \\theta, 0)$ is how far residual $i$ sits above it. So $k\\theta + \\sum_i u_i$ = $k\\cdot$threshold + excesses = the sum of the top-$k$ residuals.","x":"If $\\theta$ is the $k$-th largest residual, only residuals above it need $u_i > 0$, and $k\\theta + \\sum u_i$ adds up exactly the top $k$.","bk":false},{"s":5,"t":"q","f":"Final single-level stable regression problem.","b":"$$\\min_{\\beta,\\theta,u}\\ k\\theta + \\sum_i u_i + \\lambda\\sum_j\\Gamma(\\beta_j)\\ \\ \\text{s.t.}\\ \\ \\theta + u_i \\ge y_i - x_i^\\top\\beta,\\ \\ \\theta + u_i \\ge -(y_i - x_i^\\top\\beta),\\ \\ u_i \\ge 0.$$\nThe min–min merges into one min. Splitting the absolute value into $\\pm$ linearizes it. LP for Lasso, convex QP for ridge/elastic net.","x":"Replacing the inner max by its dual min turns min–max into min–min, which collapses into one convex problem: an LP for Lasso, a QP for ridge.","bk":false},{"s":5,"t":"q","f":"Computational results of stable regression (Lec 4 summary).","b":"Across training regimes (50/50 … 90/10, 5-CV, 10-CV): accuracy improves ~3–5%, output stability ~40–80%, structural stability ~20–50%, hyperparameter stability ~60–80%. Cost: only **2–3× slower** than standard training.","x":"The modest accuracy gain is less important than the large stability gains, and the cost is only 2–3× compute.","bk":false},{"s":5,"t":"q","f":"How do the gains depend on the train/validation split?","b":"Bigger gains with smaller training fractions. Unregularized MSE improvements average 15.1% (50/50), 10.1% (60/40), 5.5% (70/30); Lasso: 10.8%, 5.3%, 3.5%. Setup: 10 UCI datasets, 1,000 repetitions with a random 10% test set.","x":"Smaller training fractions leave more room for an unlucky random split, so optimization helps most when you train on less data.","bk":true},{"s":5,"t":"q","f":"Six metrics on which Lec 4 evaluates stable regression.","b":"(1) Prediction error. (2) Prediction std. dev. (3) Coefficient std. dev. (4) Hyperparameter std. dev. (5) Support recovery. (6) Interpretability of the \"hardest subset\".","x":"These metrics cover accuracy, stability of outputs, coefficients and tuning, correctness of the support, and interpretability.","bk":false},{"s":5,"t":"q","f":"Why does training on the hardest set give robustness to *all* subpopulations of size $k$?","b":"The objective is the worst case over every size-$k$ subset. Immunizing against the hardest one bounds the training loss on every other subset of that size.","x":"The worst-case loss over all subsets of size $k$ bounds the loss on each of them, so you are protected against every subpopulation of that size.","bk":false},{"s":5,"t":"q","f":"Support recovery experiment for stable regression: formulation.","b":"Add primal MIO sparsity (Ch. 3) to the stable model:\n$\\min_\\beta \\max_z \\sum_i z_i|y_i - x_i^\\top\\beta| + \\lambda\\sum_j\\Gamma(\\beta_j)$ s.t. $\\sum_i z_i = k$, $\\sum_j\\delta_j = s$, $|\\beta_j| \\le M\\delta_j$, $\\delta_j \\in \\{0,1\\}$, $0 \\le z_i \\le 1$. Compare with the same sparse model trained on a random $\\mathcal T_{\\text{train}}$.","x":"Adding the Ch. 3 big-M sparsity constraints to the stable formulation lets you compare support recovery under optimized vs. random training.","bk":false},{"s":5,"t":"q","f":"Support recovery results (stable vs. random training).","b":"Known $s$: optimization starts with higher accuracy and lower false-alarm rate and keeps the edge as $n$ grows until both are perfect. Unknown $s$ (CV): random training has a slight early edge in accuracy that optimization quickly overtakes; optimization has a clear, persistent edge in false-discovery rate.","x":"Optimized training tends to keep fewer false features, especially when the sparsity level is chosen by cross-validation.","bk":false},{"s":5,"t":"q","f":"How do you interpret the \"hardest training set\"?","b":"Run stable regression to get the 0/1 vector $z^*$ (hard vs. easy points), use $z^*$ as labels, fit an (optimal) classification tree on $X$, and read the splits to see what makes points hard.","x":"The labels $z^*$ turn \"hard vs. easy\" into a classification target, and an interpretable tree shows which feature values make points hard.","bk":false},{"s":5,"t":"q","f":"Diabetes \"hardest set\" findings (book).","b":"Hard: (a) large gaps among past HbA1c, current HbA1c, and the 25th-percentile historical HbA1c (inconsistent measurements); (b) high current HbA1c despite >221 days on medication with low past HbA1c (treatment not working: compliance or genetics); (c) kidney complications (disease progression makes future HbA1c volatile).","x":"The hard points are clinically meaningful: inconsistent HbA1c histories, treatment not working, and complications. The method surfaces subpopulations worth attention.","bk":false},{"s":5,"t":"q","f":"Emergency department (BIDMC) \"hardest set\" findings (book).","b":"Easy: spring-break weekends (predictably high arrivals). Hard: Red Sox home games interacting with how many people are in the city (a big game like the Yankees is predictable; lesser games aren't); non-afternoon weekends in October.","x":"The hard periods are those where demand depends on interacting factors (games, crowds, holidays), while predictable surges like spring break are easy.","bk":false},{"s":5,"t":"q","f":"Time-series extension: what does the uncertainty set select?","b":"Contiguous segments instead of arbitrary points: pick $k$ \"anchors\" $t$ and take $h$ (or $r$) contiguous points after each, so the model trains against the hardest **stretches** of the series for an AR model $x_t \\approx \\gamma + \\zeta_1x_{t-1} + \\dots + \\zeta_px_{t-p}$.","x":"In time series, random point selection breaks temporal structure. Selecting contiguous segments keeps the training data as realistic stretches.","bk":false},{"s":5,"t":"q","f":"How is the time-series stable model made tractable?","b":"(1) Generalize to segments of unequal length and move the contiguity constraint into the objective as a penalty $-\\lambda\\sum_t|z_{t+1} - z_t|$. (2) Linearize $|\\cdot|$ with $v^+, v^-$ and move the cardinality constraint into the objective ($-\\Gamma\\sum_t z_t$). (3) The constraint matrix is **totally unimodular**, so optimize over $\\mathrm{conv}$. (4) Dualize the inner LP to get a single robust counterpart.","x":"Penalizing changes in $z$ encourages contiguous segments while keeping the problem linear. Total unimodularity makes the relaxation exact, and duality removes the inner max.","bk":false},{"s":5,"t":"q","f":"Time-series stable regression results.","b":"16 datasets from BIDMC (Harvard teaching hospital): accuracy +2–9%, structural stability +20–70%. Gains are inversely proportional to refitting frequency. Strong performance in turbulent regimes comes at no cost in calm regimes.","x":"The method helps most when the model is refit rarely and during turbulent periods, without hurting calm ones.","bk":false},{"s":5,"t":"q","f":"Lec 3 → Lec 4 → Lec 5 thread: subset selection over what?","b":"Lec 3: best subset of **features** (min). Lec 4: worst (hardest) subset of **samples** (max), handled by LP duality. Lec 5 median regression: best subset of **samples** (min), handled by MIO.","x":"The same \"subset\" idea appears three times, and the min/max direction decides the method: a max over samples dualizes easily, while a min over samples needs MIO.","bk":false},{"s":6,"t":"term","f":"Convex regression","b":"Nonparametric fit of a convex $f:\\mathbb{R}^p\\to\\mathbb{R}$: $\\min_{f\\in\\mathcal C}\\tfrac12\\sum_i(y_i - f(x_i))^2$ over all convex functions $\\mathcal C$.","x":"Convex regression is nonparametric: no functional form is assumed beyond convexity, which suits cost curves, production functions and similar shapes.","bk":false},{"s":6,"t":"term","f":"Subgradient $\\xi$ of $f$ at $x$","b":"A vector with $f(z) \\ge f(x) + \\xi^\\top(z - x)$ for all $z$. The supporting hyperplane at $x$ lies below $f$ everywhere.","x":"The subgradient generalizes the gradient to nonsmooth convex functions; its supporting hyperplane is what the convexity constraints encode.","bk":false},{"s":6,"t":"term","f":"$\\theta_i$ (convex regression)","b":"Decision variable for the fitted value $f(x_i)$. The function exists only through its values and slopes at the data.","x":"You never represent $f$ as a formula. Its values at the data points are decision variables.","bk":false},{"s":6,"t":"term","f":"$\\xi_i$ (convex regression)","b":"Decision variable for the subgradient (slope vector) of $f$ at $x_i$.","x":"Pairing each fitted value with a slope lets the constraints express \"this tangent plane stays below the other points.\"","bk":false},{"s":6,"t":"term","f":"Convex piecewise-linear reconstruction","b":"$f(x) = \\max_{i\\in[n]}\\{\\theta_i + \\xi_i^\\top(x - x_i)\\}$, the max of the $n$ fitted tangent planes.","x":"A maximum of affine functions is always convex, and it passes through every $(x_i, \\theta_i)$ when the pairwise constraints hold.","bk":false},{"s":6,"t":"term","f":"Reduced master problem","b":"The QP with only a small subset of the $n(n-1)$ convexity constraints, which grows as violated ones are added.","x":"The reduced master problem is the same QP with fewer constraints; its optimal value is a lower bound on the full problem.","bk":false},{"s":6,"t":"term","f":"Delayed constraint generation","b":"Start with few constraints, solve, find constraints the solution violates (separation), add them, re-solve; stop when nothing is violated beyond $\\varepsilon$.","x":"Most of the $n(n-1)$ constraints are slack at the optimum, so generating only violated ones keeps the QP small.","bk":false},{"s":6,"t":"term","f":"Sparse convex regression","b":"Convex regression where the union of supports of all subgradients $\\xi_i$ has at most $k$ features (common support $\\le k$).","x":"Requiring a common support across all subgradients means the fitted function depends on only $k$ features, the convex-regression analogue of best subset.","bk":false},{"s":6,"t":"term","f":"(HW2 term) Delaunay triangulation","b":"A triangulation of points in $\\mathbb{R}^2$ in which no point lies inside any triangle's circumcircle. Its edges define \"Delaunay neighbours\", the 2-D analogue of adjacent points on a line.","x":"Delaunay edges connect natural neighbors in the plane. It is a definition you need for HW2; the course uses it as the 2-D analogue of \"adjacent\" points.","bk":false},{"s":6,"t":"q","f":"What is the key convexity condition that makes convex regression a finite-dimensional QP?","b":"$f$ convex implies, for every pair: $f(x_i) + \\xi_i^\\top(x_j - x_i) \\le f(x_j)$ (the tangent at $x_i$ lies below the value at $x_j$). Conversely, any $(\\theta_i, \\xi_i)$ satisfying this for all pairs defines a convex $f$ (the max of tangents) through those values. So it suffices to impose it on all $n(n-1)$ ordered pairs.","x":"Necessity: tangent planes of a convex function lie below it. Sufficiency: the max of the tangents is convex and interpolates the fitted values. So the infinite-dimensional problem reduces to finite variables and pairwise constraints.","bk":false},{"s":6,"t":"q","f":"Write the convex regression QP (with regularization).","b":"$$\\min_{\\theta, \\{\\xi_i\\}}\\ \\tfrac12\\sum_{i=1}^n(y_i - \\theta_i)^2 + \\tfrac1{2\\gamma}\\sum_{i=1}^n\\|\\xi_i\\|_2^2\\ \\ \\text{s.t.}\\ \\ \\theta_i + \\xi_i^\\top(x_j - x_i) \\le \\theta_j\\ \\ \\forall i,j\\in[n]$$\nwith $\\theta\\in\\mathbb{R}^n$, $\\xi_i\\in\\mathbb{R}^p$.","x":"The objective fits the data and penalizes slopes; the constraints enforce convexity. It is a convex QP.","bk":false},{"s":6,"t":"q","f":"Why add $\\tfrac1{2\\gamma}\\sum_i\\|\\xi_i\\|^2$ to convex regression?","b":"Ridge on the slopes: without it, convex fits overfit badly at the edges of the data (slopes blow up) and the $\\xi_i$ are not unique. Smaller $\\gamma$ gives a flatter $f$.","x":"Without slope regularization, the subgradients at boundary points can be huge and non-unique; a small penalty fixes both.","bk":false},{"s":6,"t":"q","f":"Why is the full convex regression QP hard at scale?","b":"It has $n(n-1)$ potentially dense constraints, about $10^{10}$ at $n = 10^5$. Most are slack at the optimum, which motivates cutting planes.","x":"The constraint count grows as $n^2$, which is the bottleneck, not the number of variables.","bk":false},{"s":6,"t":"q","f":"How is the initial reduced master problem built? ($p = 1$ vs. $p > 1$)","b":"$p = 1$ (book): sort the $x_i$; constraints between adjacent points suffice to compute the problem. $p > 1$: build a nearest-neighbour chain: start at $x_{i_1}$, go to its closest point $x_{i_2}$, then the closest unused point, and so on; the last point links to its nearest neighbour. Impose the $n$ chain constraints $\\theta_{i_t} + \\xi_{i_t}^\\top(x_{i_{t+1}} - x_{i_t}) \\le \\theta_{i_{t+1}}$.","x":"Starting with a chain gives every point at least one constraint so the first QP is well-behaved. Nearest-neighbor chaining approximates \"adjacency\" in higher dimensions.","bk":false},{"s":6,"t":"q","f":"Separation step in convex regression cutting planes.","b":"Given $(\\hat\\theta, \\hat\\xi)$, for each $i$ find the point its tangent overshoots most:\n$$j(i) = \\arg\\max_{k\\in[n]}\\{\\hat\\theta_i - \\hat\\theta_k + \\hat\\xi_i^\\top(x_k - x_i)\\}.$$\nIf that value exceeds $\\varepsilon$, add $\\theta_i + \\xi_i^\\top(x_{j(i)} - x_i) \\le \\theta_{j(i)}$ (one constraint per violating $i$; the reverse pair is not added) and re-solve.","x":"For each $i$, scanning all $k$ to find the worst violation is $O(np)$ and cheap compared with solving the QP.","bk":false},{"s":6,"t":"q","f":"Stopping rule and guarantee for the convex regression cutting-plane algorithm.","b":"Stop when $\\max_k\\{\\hat\\theta_i - \\hat\\theta_k + \\hat\\xi_i^\\top(x_k - x_i)\\} \\le \\varepsilon$ for all $i$: the current solution is optimal (to tolerance) for the full problem. Converges in finitely many steps. At iteration $k+1$, solve with constraint set $T_0\\cup T_1\\cup\\dots\\cup T_k$.","x":"When no tangent overshoots any point by more than $\\varepsilon$, all $n(n-1)$ constraints hold (up to tolerance), so the reduced solution solves the full problem.","bk":false},{"s":6,"t":"q","f":"Scale achieved for convex regression via cutting planes.","b":"$(n,p) = (10^4, 10)$ in minutes; $(10^5, 10^2)$ in hours.","x":"Cutting planes turn a problem with ~$10^{10}$ constraints at $n = 10^5$ into one solvable in hours.","bk":false},{"s":6,"t":"q","f":"Extensions of convex regression (Lec 5 / book).","b":"(a) **Coordinate-wise monotone** $f$: sign constraints, $\\xi_i \\ge 0$ (or $\\le 0$). (b) **Bounded subgradients / Lipschitz**: $\\|\\xi_i\\|_r \\le L$ ($r\\in\\{1,2,\\infty\\}$ gives conic constraints, which can also be added lazily). (c) **Sparse convex regression**: subgradients share a support of size $\\le k$.","x":"Shape constraints are easy to add because they are constraints on the $\\xi_i$: signs for monotonicity, norms for Lipschitz bounds.","bk":false},{"s":6,"t":"q","f":"Sparse convex regression: primal MIO.","b":"Add binaries $z_j$ per feature: $|(\\xi_i)_j| \\le Mz_j\\ \\forall i, j$, $\\sum_j z_j \\le k$, on top of the convex regression QP. An MIQO, warm-started by convex heuristics as in Ch. 3.","x":"A binary per feature with big-M on every subgradient coordinate gives an MIQO, with the same warm-start-then-certify strategy as Ch. 3.","bk":false},{"s":6,"t":"q","f":"Sparse convex regression: dual approach.","b":"As in Ch. 3, reformulate as a binary convex problem $\\min_{z\\in S_k} g(z)$ (with $g$ given by an inner max over dual variables) and solve with cutting planes $\\eta \\ge g(z_i) + \\nabla g(z_i)^\\top(z - z_i)$ via dynamic constraint generation. Scale: $(n,p,k) = (10^4,10^2,10)$ in minutes, $(10^5,10^2,10)$ in hours, with good false-discovery control.","x":"The dual approach mirrors sparse regression: write the problem as a convex function of the binary support and solve it with outer approximation.","bk":true},{"s":7,"t":"term","f":"Breakdown point","b":"The fraction of contaminated data that can drive an estimator arbitrarily far. Higher means more robust; the maximum possible is 50%.","x":"Breakdown point measures robustness to gross outliers: how much bad data an estimator tolerates before it can be pulled anywhere.","bk":false},{"s":7,"t":"term","f":"Least squares (LS) estimator","b":"$\\hat\\beta^{LS}\\in\\arg\\min_\\beta\\sum_i r_i^2$, $r_i = y_i - x_i^\\top\\beta$. Breakdown point 0: one outlier can move it arbitrarily.","x":"Squaring residuals lets a single extreme point dominate the objective, so one outlier can move the fit arbitrarily.","bk":false},{"s":7,"t":"term","f":"Least absolute deviation (LAD) estimator","b":"$\\hat\\beta^{LAD}\\in\\arg\\min_\\beta\\sum_i|r_i|$. Also breakdown point 0: not resistant to large deviations in the covariates (leverage points).","x":"LAD downweights large $y$ errors but a leverage point (extreme $x$) can still pull the fit, so its breakdown point is also zero.","bk":false},{"s":7,"t":"term","f":"Least median of squares (LMS)","b":"Rousseeuw (1984): minimize the median of $r_i^2$.","x":"LMS replaces the sum with the median, so up to half the points can be outliers without breaking the fit.","bk":false},{"s":7,"t":"term","f":"Least median of absolute deviations (LMAD)","b":"$\\hat\\beta^{LMAD}\\in\\arg\\min_\\beta\\ \\mathrm{median}_i|r_i|$. Limiting breakdown point 50% (the first equivariant estimator to attain the maximum as $n\\to\\infty$ with $p$ fixed).","x":"Using absolute deviations instead of squares gives the same robustness as LMS with a formulation that fits MIO well.","bk":false},{"s":7,"t":"term","f":"Least quantile of absolute deviations (LQAD / LQS)","b":"$\\min_\\beta|r_{(q)}|$, the $q$-th smallest absolute residual ($|r_{(1)}|\\le\\dots\\le|r_{(n)}|$). $q \\approx n/2$ gives median regression.","x":"$q$ trades robustness for efficiency: smaller $q$ ignores more points. $q \\approx n/2$ is median regression.","bk":false},{"s":7,"t":"term","f":"Difference of convex (DC) functions","b":"$f = H_1 - H_2$ with $H_1, H_2$ convex. Minimize by repeatedly linearizing $H_2$ and solving the convex remainder.","x":"Writing a nonconvex function as a difference of convex functions lets you linearize the subtracted part and solve a convex problem each iteration.","bk":false},{"s":7,"t":"term","f":"Subdifferential $\\partial f$","b":"The set of subgradients of $f$ at a point (generalizes the gradient to nonsmooth $f$).","x":"For nonsmooth functions you need a subgradient (or subdifferential) to take descent steps.","bk":false},{"s":7,"t":"q","f":"Why median regression?","b":"To get a regression fit that is immune to outliers. LS and LAD both have breakdown point 0; LMAD/LQAD tolerate up to ~50% outliers.","x":"The goal is robustness to many outliers, which neither LS nor LAD provides.","bk":false},{"s":7,"t":"q","f":"Key structural theorem about LQAD.","b":"$$\\min_\\beta |r_{(q)}| = \\min_{I\\in\\Omega_q}\\ \\min_\\beta\\ \\|y_I - X_I\\beta\\|_\\infty,\\quad \\Omega_q = \\{I\\subseteq[n] : |I| = q\\}$$\nLQAD finds the best Chebyshev ($\\ell_\\infty$) fit on the best size-$q$ subset: **subset selection over samples**.","x":"LQAD effectively chooses the best $q$ samples and fits them in the $\\ell_\\infty$ sense, a combinatorial choice that motivates MIO.","bk":false},{"s":7,"t":"q","f":"Complexity of LMS/LQAD and prior state of the art.","b":"NP-hard (Bernholt 2005). Exact methods enumerate in $O(n^p)$ and don't scale past ~$n = 50$, $p = 5$. Heuristics scale but are ad hoc (e.g. LQS in R's MASS package).","x":"Enumeration grows as $O(n^p)$, so exact methods were limited to tiny problems, and heuristics had no guarantees.","bk":false},{"s":7,"t":"q","f":"Binary variables in the LQAD MIO and their meaning.","b":"$z_i = 1$ if $|r_i| \\le |r_{(q)}|$ (point is among the $q$ smallest residuals), else 0. Auxiliary $\\mu_i \\ge 0$ with $|r_i| - \\mu_i \\le |r_{(q)}|$, and $\\mu_i = 0$ whenever $|r_i| \\le |r_{(q)}|$. So $\\mu_i$ \"forgives\" the large residuals.","x":"The binaries mark which residuals count toward the $q$ smallest; $\\mu_i$ forgives the residuals that don't.","bk":false},{"s":7,"t":"q","f":"Write the LQAD MIO from Lec 5.","b":"$$\\min_{\\beta,r,\\gamma,z,\\mu}\\ \\gamma\\ \\ \\text{s.t.}\\ \\ r = y - X\\beta,\\ \\ \\gamma \\ge |r_i| - \\mu_i,\\ \\ M(1 - z_i) \\ge \\mu_i,\\ \\ \\sum_i z_i = q,\\ \\ \\mu_i \\ge 0,\\ \\ z_i\\in\\{0,1\\}$$\n($|r_i|$ is linearized as usual.)","x":"Minimizing $\\gamma$ with $\\gamma \\ge |r_i| - \\mu_i$ and $\\mu_i = 0$ forced for exactly $q$ points makes $\\gamma$ the smallest value that covers $q$ residuals.","bk":false},{"s":7,"t":"q","f":"Why does the LQAD MIO give $\\gamma^* = |r_{(q)}|$?","b":"If $M \\ge \\max_i|r_i|$: $q$ of the $z_i$ equal 1, which forces those $\\mu_i = 0$, so $\\gamma \\ge$ at least $q$ of the $|r_i|$, i.e. $\\gamma \\ge |r_{(q)}|$. The other $n - q$ residuals can be forgiven via $\\mu_i$. Minimizing $\\gamma$ makes it exactly $|r_{(q)}|$. (Think of minimizing $\\max_i(|r_i| - \\mu_i)$.)","x":"Exactly $q$ points have no slack, so $\\gamma$ must be at least the $q$-th smallest residual, and minimization drives it down to exactly that value.","bk":false},{"s":7,"t":"q","f":"How does the textbook MIO differ from the slide version?","b":"It uses two-sided slack: $|r_i| - \\mu_i \\le \\gamma \\le |r_i| + \\bar\\mu_i$ with $\\mu_i, \\bar\\mu_i \\ge 0$, $M_1z_i \\ge \\bar\\mu_i$, $M_2(1 - z_i) \\ge \\mu_i$, $\\sum_i z_i = q$. Then $\\gamma$ is at least $q$ residuals **and** at most $n - q$ residuals, pinning $\\gamma^* = |r_{(q)}|$ exactly.","x":"The two-sided version adds upper slack so $\\gamma$ is also below the remaining residuals, pinning it exactly even without relying on minimization.","bk":true},{"s":7,"t":"q","f":"Overall solution strategy for LQAD.","b":"Fast heuristics (nonlinear/convex optimization) give high-quality upper bounds, which warm-start the MIO, which then certifies optimality (lower bounds). The same playbook as sparse regression.","x":"It is the course's standard playbook: fast heuristics for good solutions, MIO for proof.","bk":false},{"s":7,"t":"q","f":"Algorithm 1 (sequential linear optimization): the DC decomposition.","b":"$|r_{(q)}| = H_q(\\beta) - H_{q+1}(\\beta)$, where $H_m(\\beta) = \\sum_{i=m}^n|r_{(i)}|$ is the sum of the $n - m + 1$ largest absolute residuals. Each $H_m$ is convex, so $|r_{(q)}|$ is a difference of convex functions.","x":"The $q$-th smallest residual equals \"sum of the largest $n-q+1$\" minus \"sum of the largest $n-q$.\" Each such top-$m$ sum is convex in $\\beta$.","bk":false},{"s":7,"t":"q","f":"Why is $H_m(\\beta)$ convex, and what is its LP form?","b":"$H_m(\\beta) = \\max_w \\sum_i w_i|y_i - x_i^\\top\\beta|$ s.t. $\\sum_i w_i = n - m + 1$, $0 \\le w_i \\le 1$: a pointwise max of convex functions of $\\beta$. Its LP dual: $H_m(\\beta) = \\min_{\\theta,\\nu}\\ \\theta(n - m + 1) + \\sum_i\\nu_i$ s.t. $\\theta + \\nu_i \\ge |y_i - x_i^\\top\\beta|$, $\\nu_i \\ge 0$ (the same \"top-$k$ sum\" dual as stable regression).","x":"$H_m$ is a max over weight vectors of convex functions, hence convex. Its dual is the same top-$k$ dual as stable regression.","bk":false},{"s":7,"t":"q","f":"Algorithm 1 (SLO) iteration.","b":"Dualize $H_q$ and linearize $H_{q+1}$ at $\\beta_k$ with a subgradient: solve the LP\n$$\\min_{\\nu,\\theta,\\beta}\\ \\theta(n - q + 1) + \\sum_i\\nu_i - \\langle\\partial H_{q+1}(\\beta_k), \\beta\\rangle\\ \\ \\text{s.t.}\\ \\ \\theta + \\nu_i \\ge |y_i - x_i^\\top\\beta|,\\ \\nu_i\\ge0$$\nto get $\\beta_{k+1}$; repeat. Objective values decrease and converge to a stationary point at rate $O(1/K)$.","x":"Linearizing the subtracted convex term gives a convex upper bound on the objective; minimizing it decreases the true objective each iteration.","bk":false},{"s":7,"t":"q","f":"Algorithm 2 (subgradient descent) for LQAD.","b":"Minimize $f_q(\\beta) = |y_{(q)} - x_{(q)}^\\top\\beta|$ by $\\beta_{k+1} = \\beta_k - \\alpha_k\\,\\partial f_q(\\beta_k)$ with $\\partial f_q(\\beta) = -\\mathrm{sgn}(y_{(q)} - x_{(q)}^\\top\\beta)\\,x_{(q)}$ (the $q$-th ordered point at the current $\\beta$). Return the best iterate seen. Cheap per iteration.","x":"Subgradient steps only need the current $q$-th ordered point, so each step is very cheap, but convergence is slow and not monotone.","bk":false},{"s":7,"t":"q","f":"Algorithm 3 and which upper-bound method wins?","b":"Algorithm 3 = run Alg. 2 (subgradient), then feed its output to Alg. 1 (SLO). This hybrid reached 0% relative error on all test examples. SLO alone was sensitive to initialization (LAD vs. Chebyshev starts); subgradient alone was fast but ~0.2–1.5% off.","x":"Subgradient steps give a fast, decent starting point; SLO then refines it to a local optimum. The combination beat both alone.","bk":false},{"s":7,"t":"q","f":"Results vs. state of the art for LQAD.","b":"R's MASS LQS: very fast but 10–150% worse objective. MIO cold start: poor within its time limit. MIO warm-started by Alg. 3: optimal (0 error) and certifies optimality. Scales to $n = 10{,}001$, $p = 20$.","x":"MASS is fast but far from optimal; the warm-started MIO reaches the optimum and certifies it.","bk":false},{"s":7,"t":"q","f":"What to do for large LQAD problems ($n > 5000$, $p > 10$)?","b":"SLO's LPs get expensive. Run the cheap subgradient method (Alg. 2/4.3) from several random starts and keep the best; it gets within ~1% of the MIO solution in minutes.","x":"For large problems SLO's LPs become expensive, so you use the cheap subgradient method with restarts.","bk":true},{"s":7,"t":"q","f":"Lec 5 takeaways on median regression.","b":"(1) LQAD is a classical, highly robust tool for regression with large outliers. (2) It admits a tractable MIO formulation. (3) Nonlinear optimization gives fast, high-quality upper bounds; MIO certifies optimality. (4) Scales to $n \\approx 10$k or more.","x":"LQAD is very robust and, with modern MIO, solvable to optimality at practical sizes.","bk":false},{"s":8,"t":"term","f":"Binary classification","b":"Given $(x_i, y_i)$, $x_i\\in\\mathbb{R}^p$, $y_i\\in\\{-1,+1\\}$, find $f:\\mathbb{R}^p\\to\\{-1,+1\\}$ to classify new points.","x":"Using $\\pm1$ labels (instead of 0/1) is what makes the margin $y(\\beta^\\top x + \\beta_0)$ and the compact logistic loss possible.","bk":false},{"s":8,"t":"term","f":"Logistic model","b":"$P(Y = 1) = \\dfrac{1}{1 + e^{-(\\beta_0 + \\beta^\\top x)}}$, the sigmoid of a linear score.","x":"The sigmoid maps any real score to $(0,1)$. The score is linear in $x$, so the decision boundary $P = 0.5$ is a hyperplane.","bk":false},{"s":8,"t":"term","f":"Odds","b":"$\\dfrac{P(Y=1)}{P(Y=-1)} = e^{\\beta_0 + \\beta^\\top x}$. Above 1 means $y = 1$ is more likely; below 1 means $y = -1$ is more likely.","x":"Odds rescale probability to $(0, \\infty)$; each unit of $x_j$ multiplies the odds by $e^{\\beta_j}$.","bk":false},{"s":8,"t":"term","f":"Logit","b":"$\\log(\\text{Odds}) = \\beta_0 + \\beta_1x_1 + \\dots + \\beta_px_p$, linear in $x$. A bigger logit means a bigger $P(Y=1)$.","x":"The logit is the linear part of the model, so coefficient signs tell you the direction of each feature's effect on $P(Y=1)$.","bk":false},{"s":8,"t":"term","f":"Margin $m_i$","b":"$y_i(\\beta^\\top x_i + \\beta_0)$. Positive means correctly classified at $t = 0.5$; larger means more confident.","x":"The margin combines the score and the label: positive means the point is on the correct side, and its size is the confidence.","bk":false},{"s":8,"t":"term","f":"Logistic loss","b":"$\\ell(y, u) = \\log(1 + e^{-yu})$ with $u = \\beta^\\top x + \\beta_0$. Roughly 0 for large positive margin, roughly $-m$ (linear) for large negative margin.","x":"The loss is smooth and convex in the margin, close to linear for badly misclassified points, so outliers hurt less than with squared loss.","bk":false},{"s":8,"t":"term","f":"Hinge loss (SVM)","b":"$\\ell(y, u) = \\max(0, 1 - yu)$. Penalizes points that are misclassified or inside the margin.","x":"Points with margin above 1 contribute nothing, so only points near or past the boundary (support vectors) shape the solution.","bk":false},{"s":8,"t":"term","f":"Misclassification (0–1) loss","b":"$\\mathbb 1\\{y(\\beta^\\top x + \\beta_0) \\le 0\\}$: one unit per point on the wrong side. Nonconvex and discontinuous.","x":"The 0–1 loss is what you actually care about but it is nonconvex and discontinuous, which is why convex surrogates (logistic, hinge) are used.","bk":false},{"s":8,"t":"term","f":"Threshold $t$","b":"Predict $+1$ iff $P(Y = 1) \\ge t$.","x":"The threshold converts probabilities into decisions; moving it trades one error type for the other.","bk":false},{"s":8,"t":"term","f":"Confusion matrix","b":"Rows = actual, columns = predicted. Actual $-1$: TN, FP. Actual $+1$: FN, TP.","x":"The confusion matrix separates the two error types, which accuracy alone hides.","bk":false},{"s":8,"t":"term","f":"Sensitivity (TPR, recall)","b":"$\\dfrac{TP}{TP + FN}$, the share of actual positives caught.","x":"Sensitivity is about the positive class: of all who truly have poor care, how many did we flag.","bk":false},{"s":8,"t":"term","f":"Specificity (TNR)","b":"$\\dfrac{TN}{TN + FP}$, the share of actual negatives correctly cleared.","x":"Specificity is about the negative class: of all who truly had good care, how many did we clear.","bk":false},{"s":8,"t":"term","f":"False positive rate","b":"$1 - \\text{specificity} = \\dfrac{FP}{FP + TN}$, the x-axis of the ROC curve.","x":"FPR is the false-alarm rate, the ROC curve's x-axis.","bk":false},{"s":8,"t":"term","f":"Accuracy","b":"$\\dfrac{TN + TP}{TN + TP + FN + FP}$.","x":"Accuracy can be misleading with imbalanced classes, which is why it is always compared with the baseline.","bk":false},{"s":8,"t":"term","f":"Baseline (classification)","b":"Predict the most common class for everyone. The classification analogue of the $R^2$ baseline (predict the mean).","x":"A model must beat the majority-class rate to add value; in the quality-of-care data that is 74.8%.","bk":false},{"s":8,"t":"term","f":"ROC curve","b":"True positive rate (y) vs. false positive rate (x) traced over all thresholds $t$.","x":"Each point on the curve is one threshold; the curve shows the full sensitivity–specificity trade-off at once.","bk":false},{"s":8,"t":"term","f":"AUC","b":"Area under the ROC curve: the probability that a random positive gets a higher score than a random negative. Max 1, and 0.5 = random guessing.","x":"AUC is threshold-free and has a ranking interpretation, making it a good summary of discrimination.","bk":false},{"s":8,"t":"term","f":"Fenchel conjugate $\\hat\\ell(y,\\alpha)$","b":"$\\max_{u\\in\\mathbb{R}}\\big(u\\alpha - \\ell(y,u)\\big)$. It appears in the dual of regularized classification.","x":"The conjugate packages the loss into the dual problem; its domain restrictions become linear constraints on the dual variables.","bk":true},{"s":8,"t":"q","f":"Logistic regression MLE objective with $\\pm1$ labels.","b":"$$\\max_{\\beta,\\beta_0}\\ \\sum_{i=1}^n \\log P(Y_i = y_i) = \\max_{\\beta,\\beta_0}\\ -\\sum_{i=1}^n\\log\\big(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)}\\big)$$\nWith $\\pm1$ labels, $P(Y = y_i) = \\sigma(m_i)$ for both classes, so one formula covers both.","x":"Maximizing log-likelihood is the same as minimizing logistic loss. With $\\pm1$ labels both classes use one formula.","bk":false},{"s":8,"t":"q","f":"What kind of optimization problem is logistic regression, and how is it solved?","b":"A convex, nonlinear problem (concave maximization; no closed form). Solved by Newton–Raphson (IRLS) or stochastic gradient descent.","x":"There is no closed form like OLS, but the problem is smooth and convex, so Newton's method or SGD converge to the global optimum.","bk":false},{"s":8,"t":"q","f":"Quality-of-care example: model and interpretation.","b":"Trained on 99 patients (75%). Logit $= -2.65 + 0.082\\cdot\\text{OfficeVisits} + 0.076\\cdot\\text{Narcotics}$. Both coefficients are positive, so more visits/narcotics mean higher odds of **poor** care ($+1$).","x":"Positive coefficients increase the logit and therefore the probability of the $+1$ class (poor care).","bk":false},{"s":8,"t":"q","f":"How does the threshold $t$ trade off errors?","b":"High $t$: predict poor care rarely, giving high specificity and low sensitivity (more FN; catches only the worst cases). Low $t$: high sensitivity, low specificity (more FP). No preference between error types: $t = 0.5$ (predict the more likely class). Otherwise weigh the cost of missed positives against false alarms.","x":"The best threshold depends on the relative costs of missed positives vs. false alarms; 0.5 is right only if they're equal.","bk":false},{"s":8,"t":"q","f":"Quality-of-care confusion matrices at $t = 0.2, 0.5, 0.7$ (train, 74 neg / 25 pos).","b":"$t = 0.2$: TN 54, FP 20, FN 9, TP 16, giving sens 0.64, spec 0.73.\n$t = 0.5$: TN 70, FP 4, FN 15, TP 10, giving sens 0.40, spec 0.95.\n$t = 0.7$: TN 73, FP 1, FN 17, TP 8, giving sens 0.32, spec 0.99.","x":"As $t$ rises, FP drops (spec ↑) and FN rises (sens ↓). The three tables are the same model at different thresholds.","bk":false},{"s":8,"t":"q","f":"Accuracy and baseline in the quality-of-care example.","b":"Train accuracy at $t = 0.5$: $80/99 = 80.8\\%$. Baseline (predict good care for all 131): $98/131 = 74.8\\%$. Test set (32 patients) at $t = 0.5$: TN 23, FP 1, FN 5, TP 3, so $26/32 = 81.3\\%$.","x":"80.8% train accuracy sounds good, but the baseline is 74.8%, so the model's real gain is modest.","bk":false},{"s":8,"t":"q","f":"How do you use the ROC curve to pick a threshold?","b":"It shows all thresholds at once (high $t$ at the bottom-left: high specificity, low sensitivity; low $t$ at the top-right). Choose the point that best trades off the cost of failing to detect positives against the cost of false alarms.","x":"Pick the ROC point that matches your cost trade-off; there is no single best threshold without costs.","bk":false},{"s":8,"t":"q","f":"Regularized classification: general form, and which loss gives which method.","b":"$$\\min_\\beta\\ \\sum_{i=1}^n\\ell(y_i, \\beta^\\top x_i) + \\tfrac1{2\\gamma}\\|\\beta\\|_2^2$$\nLogistic loss $\\log(1 + e^{-yu})$ gives regularized logistic regression (negative log-likelihood + regularizer, which ensures strict convexity and existence of an optimum). Hinge loss $\\max(0, 1 - yu)$ gives the SVM ($\\|\\beta\\|_2^2$ relates to the margin).","x":"Both methods are \"loss + ridge penalty\" and differ only in the loss, which lets one dual framework cover both.","bk":true},{"s":8,"t":"q","f":"Dual of regularized classification (Thm 6.1).","b":"If $\\ell(y,\\cdot)$ is convex, strong duality holds:\n$$\\max_{\\alpha\\in\\mathbb{R}^n}\\ -\\sum_i\\hat\\ell(y_i,\\alpha_i) - \\tfrac\\gamma2\\alpha^\\top XX^\\top\\alpha\\ \\ \\text{s.t.}\\ \\ e^\\top\\alpha = 0,$$\nwith $\\hat\\ell$ the Fenchel conjugate and $\\beta^* = -\\gamma X^\\top\\alpha^*$.","x":"The dual depends on the data only through the Gram matrix $XX^\\top$, so a kernel can replace inner products. The loss enters only through its conjugate.","bk":true},{"s":8,"t":"q","f":"What does $\\beta^* = -\\gamma X^\\top\\alpha^*$ explain?","b":"$\\beta^*$ is a linear combination of data points, the ones with $\\alpha_i \\ne 0$ (\"support vectors\", hence the name SVM). The data enter the dual only through the Gram matrix $XX^\\top$, which can be swapped for any kernel $K$ (nonlinear classification).","x":"The optimal $\\beta$ is a weighted combination of training points; only points with nonzero $\\alpha_i$ (support vectors) contribute.","bk":true},{"s":8,"t":"q","f":"Fenchel conjugates of the logistic and hinge losses.","b":"Logistic: $\\hat\\ell(y,\\alpha) = (1 + y\\alpha)\\log(1 + y\\alpha) - y\\alpha\\log(-y\\alpha)$ if $y\\alpha\\in[-1,0]$, else $+\\infty$. Hinge: $\\hat\\ell(y,\\alpha) = y\\alpha$ if $y\\alpha\\in[-1,0]$, else $+\\infty$. The domain condition $y\\alpha_i\\in[-1,0]$ becomes linear constraints on $\\alpha$.","x":"These conjugates are what you plug into the dual; their domain $y\\alpha \\in [-1, 0]$ becomes simple box constraints on $\\alpha$.","bk":true},{"s":9,"t":"term","f":"Feature uncertainty set $\\mathcal U_x$","b":"$\\{\\Delta X\\in\\mathbb{R}^{n\\times p} : \\|\\Delta x_i\\|_q \\le \\rho,\\ i = 1,\\dots,n\\}$: each data point can be perturbed within an $\\ell_q$ ball of radius $\\rho$ (row-wise).","x":"Row-wise uncertainty models each observation's features being measured with error up to $\\rho$ in $\\ell_q$ norm.","bk":false},{"s":9,"t":"term","f":"Label uncertainty set $\\mathcal U_y$","b":"$\\{\\Delta y\\in\\{0,1\\}^n : \\sum_i\\Delta y_i \\le \\Gamma\\}$. $\\Delta y_i = 1$ means label $i$ was flipped; at most $\\Gamma$ flips (an integer parameter).","x":"At most $\\Gamma$ labels may be wrong; the binary set is integral, which is what allows an exact LP relaxation.","bk":false},{"s":9,"t":"term","f":"Label flip as algebra","b":"A flipped label is $y_i(1 - 2\\Delta y_i)$: $\\Delta y_i = 0$ keeps $y_i$, $\\Delta y_i = 1$ gives $-y_i$.","x":"Multiplying by $1 - 2\\Delta y_i$ flips the sign exactly when $\\Delta y_i = 1$, making label flips linear in $\\Delta y$ inside the margin.","bk":false},{"s":9,"t":"term","f":"Robust-in-both","b":"Logistic regression (or SVM) robustified against $\\mathcal U_x$ and $\\mathcal U_y$ simultaneously.","x":"Combining both protections gives the most improvement in experiments, because real data often has errors in both.","bk":false},{"s":9,"t":"term","f":"Robustness decision rule","b":"Use robust classification if $\\log_{10}(p) \\ge 0.05a - 2.5$, with $p$ = dimension and $a$ = nominal in-sample accuracy (%).","x":"The rule says robustness pays when the problem is high-dimensional and the nominal model fits poorly, both signs of noisy, hard data.","bk":false},{"s":9,"t":"q","f":"Motivating questions of robust logistic regression (Lec 6).","b":"(1) Can we guard logistic regression against uncertainty? (2) Is robust LR tractable and scalable? (3) Does it improve out-of-sample accuracy significantly? (4) Can we predict when robust methods add the most value?","x":"These four questions structure the lecture: model, tractability, benefit, and when to use it.","bk":false},{"s":9,"t":"q","f":"Feature-robust logistic regression: problem and robust counterpart.","b":"$$\\max_{\\beta,\\beta_0}\\ \\min_{\\Delta X\\in\\mathcal U_x}\\ -\\sum_i\\log\\big(1 + e^{-y_i(\\beta^\\top(x_i + \\Delta x_i) + \\beta_0)}\\big)$$\nequals\n$$\\max_{\\beta,\\beta_0}\\ -\\sum_i\\log\\big(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0) + \\rho\\|\\beta\\|_{q^*}}\\big).$$\nThe penalty sits **inside the exponent** and uses the **dual** norm $q^*$.","x":"The adversary shrinks each margin by $\\rho\\|\\beta\\|_{q^*}$ (dual norm, by definition), and because the logistic log-likelihood is increasing in the margin, that worst case is applied inside the exponent.","bk":false},{"s":9,"t":"q","f":"Proof sketch of feature-robust logistic regression.","b":"Let $\\omega_i = y_i(\\beta^\\top(x_i + \\Delta x_i) + \\beta_0)$, $g(\\omega) = -\\log(1 + e^{-\\omega})$. Since $g'(\\omega) = 1/(1 + e^{\\omega}) > 0$, $g$ is increasing, so the adversary minimizes each margin: $\\min_{\\|\\Delta x_i\\|_q\\le\\rho}\\omega_i = y_i(\\beta^\\top x_i + \\beta_0) - \\max_{\\|\\Delta x_i\\|_q\\le\\rho}y_i\\beta^\\top\\Delta x_i = y_i(\\beta^\\top x_i + \\beta_0) - \\rho\\|\\beta\\|_{q^*}$ (dual norm definition). Substitute back.","x":"Monotonicity of the loss in the margin reduces the inner problem to minimizing each margin separately, which is the dual-norm problem.","bk":false},{"s":9,"t":"q","f":"Intuition for feature-robust logistic regression.","b":"Every point's margin is shrunk by $\\rho\\|\\beta\\|_{q^*}$, so the classifier must separate with a cushion. Large $\\|\\beta\\|$ gets penalized, a regularization effect, but through the loss rather than as an additive $\\ell_1$ term. (Book: RO for classification does **not** produce the usual $\\ell_1$-penalized formulation.)","x":"Shrinking every margin forces a cushion around the boundary and penalizes large $\\|\\beta\\|$, a regularization that comes from robustness rather than being bolted on.","bk":false},{"s":9,"t":"q","f":"Label-robust logistic regression: robust counterpart.","b":"$$\\max_{\\beta,\\beta_0,\\mu,\\nu}\\ -\\sum_i\\log\\big(1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)}\\big) + \\Gamma\\mu + \\sum_i\\nu_i$$\n$$\\text{s.t.}\\ \\ \\mu + \\nu_i \\le \\log\\frac{1 + e^{-y_i(\\beta^\\top x_i + \\beta_0)}}{1 + e^{y_i(\\beta^\\top x_i + \\beta_0)}},\\ \\ \\nu_i \\le 0,\\ \\ \\mu \\le 0.$$\nA single continuous problem: no integer variables remain.","x":"The binary inner minimization becomes an LP, and its dual brings in $\\mu$ (for the budget $\\Gamma$) and $\\nu_i$ (for each $\\Delta y_i \\le 1$), leaving one continuous convex problem.","bk":false},{"s":9,"t":"q","f":"Proof sketch of label-robust logistic regression (three steps).","b":"(1) $\\Delta y_i\\in\\{0,1\\}$, so each term is linear in $\\Delta y_i$: $f_i(\\Delta y_i) = [f_i(1) - f_i(0)]\\Delta y_i + f_i(0)$. (2) The polytope $\\{0\\le\\Delta y\\le1, \\sum\\Delta y_i\\le\\Gamma\\}$ has **integer extreme points**, so the inner binary min equals its LP relaxation. (3) Strong LP duality replaces the inner min with its dual max ($\\mu$ for the budget, $\\nu_i$ for $\\Delta y_i\\le1$), which merges with the outer max.","x":"Linearity in each binary, integral vertices, then strong duality: the same three-step recipe as stable regression.","bk":false},{"s":9,"t":"q","f":"Robust-in-both logistic regression counterpart.","b":"The label-robust formulation with every margin $y_i(\\beta^\\top x_i + \\beta_0)$ replaced by the shrunk margin $y_i(\\beta^\\top x_i + \\beta_0) - \\rho\\|\\beta\\|_{q^*}$ (inside both the objective's log term and the constraint's log ratio). $\\rho$ and $\\Gamma$ come from domain knowledge or cross-validation.","x":"The feature-robust shrinkage simply replaces the margin everywhere in the label-robust formulation.","bk":false},{"s":9,"t":"q","f":"Robust SVM: what changes compared with robust logistic regression?","b":"Feature robustness again shrinks margins by $\\rho\\|\\beta\\|_{q^*}$. But label robustness for the hinge loss leads to a counterpart with big-M constraints and binaries $s, t\\in\\{0,1\\}^n$: the SVM goes from an LP to an **MIO**, so it is much slower.","x":"The hinge loss's kinks make the label-robust counterpart need binaries, so robust SVM becomes an MIO and is much slower than robust logistic regression.","bk":true},{"s":9,"t":"q","f":"Experimental setup for robust classification (Lec 6 / book).","b":"75 UCI datasets (n from 47 to ~245k, p from 3 to ~856), one-vs-rest. Split 60/20/20 train/val/test; pick robustness parameters on validation, retrain on train+val, report test accuracy; repeat 5 splits. Compare nominal vs. feature-robust, label-robust, robust-in-both.","x":"Selecting robustness parameters on validation data, then retraining on train + validation, mirrors standard model selection.","bk":false},{"s":9,"t":"q","f":"Main empirical results of robust classification.","b":"Every robust variant beats nominal more often than it loses; robust-in-both helps most. Robust LR is about twice as likely as nominal to be the best. Gains are largest when nominal in-sample accuracy is low: below 60%, +7.7% (LR) / +10.7% (SVM); at 90–100%, ~0.","x":"Robust methods win more often than they lose, and the gains concentrate where nominal accuracy is low.","bk":false},{"s":9,"t":"q","f":"Decision rule for when to use robust classification, and its payoff.","b":"$\\log_{10}(p) \\ge 0.05a - 2.5$ (high dimension, low nominal accuracy: \"harder\" problems). In that region robust-in-both LR went 17 wins / 2 losses / 1 tie, with +4.0 ± 1.0% accuracy (SVM: +5.3%). Below the line, robust is competitive but not clearly better.","x":"The rule lets you decide in advance, using only training-set information, whether robustness is likely to help.","bk":false},{"s":9,"t":"q","f":"Robust vs. *regularized* classifiers.","b":"In the \"above the line\" region robust-in-both still beats $\\ell_1$-regularized LR by ~1.9% and regularized SVM by ~0.5%. Below the line they are comparable (regularized SVM slightly better). Principled RO adds value over ad hoc regularization.","x":"Robust models still edge out ad hoc regularization on hard problems, supporting the principled RO approach.","bk":true},{"s":9,"t":"q","f":"Computational cost of robust classification.","b":"Feature-robust ≈ nominal solve time. Label-robust is 1–2 orders of magnitude slower (and for SVM it becomes an MIO). Robust-in-both is similar to label-robust. Lec 6: tractable at $n \\ge 240{,}000$, $p \\ge 800$.","x":"Feature robustness is nearly free; label robustness adds a dual LP structure (and binaries for SVM), which costs time.","bk":true},{"s":9,"t":"q","f":"Lec 6 conclusions (4).","b":"(1) Robust LR is computationally tractable. (2) It scales ($n \\ge 240$k, $p \\ge 800$). (3) It improves accuracy and is about twice as likely as nominal to perform best. (4) You can predict when it helps most: low nominal accuracy, high $p$.","x":"These conclusions mirror the four motivating questions: yes it's tractable, it scales, it helps, and you can predict when.","bk":false},{"s":10,"t":"q","f":"Sparse classification problem.","b":"$$\\min_\\beta\\ \\sum_{i=1}^n\\ell(y_i, \\beta^\\top x_i) + \\tfrac1{2\\gamma}\\|\\beta\\|_2^2\\ \\ \\text{s.t.}\\ \\ \\|\\beta\\|_0 \\le k$$\nNP-hard; usually replaced in practice by the $\\ell_1$-penalized proxy, which gives robustness rather than sparsity.","x":"The cardinality constraint makes classification combinatorial just like regression; the ridge term again gives strong convexity.","bk":false},{"s":10,"t":"q","f":"How does the book extend the Ch. 3 dual method to classification (no closed form)?","b":"Theorem 6.2: sparse classification equals $\\min_{s\\in S_k} c(s)$ with $c(s) = \\max_{\\alpha: e^\\top\\alpha = 0}\\ -\\sum_i\\hat\\ell(y_i,\\alpha_i) - \\tfrac\\gamma2\\sum_j s_j\\alpha^\\top X_jX_j^\\top\\alpha$, convex in $s$. Evaluate $c(s)$ by solving the dual numerically; the gradient comes for free: $\\partial c/\\partial s_j = -\\tfrac\\gamma2(\\alpha^*(s)^\\top X_j)^2$. Then run outer approximation with lazy constraints.","x":"Without a closed form, the dual is solved numerically for each support; its optimal $\\alpha$ also gives the gradient, so outer approximation still works.","bk":false},{"s":10,"t":"q","f":"Sparse logistic regression / sparse SVM vs. Lasso (book findings).","b":"Both converge to the true support as $n$ grows, but exact sparse needs fewer samples and has better AUC/misclassification. With $k$ chosen by CV, Lasso's support stays much larger than the truth while exact sparse converges to $k_{\\text{true}}$ (\"the truth and nothing but the truth\"). The number of cuts **drops** as $n$ grows (a phase transition); hinge loss needs ~3× fewer cuts than logistic.","x":"The pattern from regression repeats: exact methods select the true support with fewer false features and predict better.","bk":false},{"s":10,"t":"q","f":"Lung cancer example (book): exact sparse vs. Lasso.","b":"$n = 1{,}145$ patients, $p = 14{,}858$ genes. Sparse SVM: 30 genes vs. 172 for Lasso SVM, with higher AUC (0.975 vs. 0.970). Sparse logistic: 50 vs. 171 genes at similar accuracy.","x":"On real high-dimensional data, exact sparse classifiers use far fewer genes at similar or better AUC, which matters for interpretability.","bk":false},{"s":10,"t":"q","f":"Practical details of the sparse classification algorithm (book).","b":"Lazy constraints in a single branch-and-bound tree. Hyperparameters $\\gamma$ (log-spaced grid, CV) and $k$. Warm start from the Lasso estimator (GLMNet). The upper bound is found fast; most time goes to proving the lower bound.","x":"The engineering is the same as sparse regression: lazy constraints, cross-validated hyperparameters, and a Lasso warm start.","bk":false},{"s":11,"t":"term","f":"Holistic regression","b":"One MIO that imposes every desirable property of a linear regression model at once: sparsity, group sparsity, limited multicollinearity, nonlinear transformations, robustness, and statistical significance. It finds a model satisfying all of them or proves none exists.","x":"The word \"holistic\" means all properties are imposed jointly in one model, rather than
