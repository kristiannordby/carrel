 for b₁ = 3.9 and b₁ = 4.1.", "pts": 10, "t": 5, "rubric": ["(a) Three active constraints at a point in ℝ² (rows 1, 2 and x₂ = 0); some basic variable is 0 — 2 pts", "(b) Dual min 4y₁ + 8y₂ s.t. y₁ + 2y₂ ≥ 3, y₁ + y₂ ≥ 2, y ≥ 0 — 2 pts", "(b) Feasibility and value 12 of (3 − 2s, s) for s ∈ [0, 1] — 2 pts", "(c) Several optimal duals ⇒ one-sided shadow prices: rate 1 upward, 3 downward — 2 pts", "(c) Values 11.7 at b₁ = 3.9 and 12.1 at b₁ = 4.1 — 2 pts"], "model": "(a) At (4, 0): x₁ + x₂ = 4, 2x₁ + x₂ = 8 and x₂ = 0 are all active: 3 active constraints in ℝ², more than n = 2. In standard form, any basis has a basic variable equal to 0 (e.g., basis {x₁, x₂} with x₂ = 0, or {x₁, s₂} with s₂ = 0). (b) Dual: min 4y₁ + 8y₂ s.t. y₁ + 2y₂ ≥ 3, y₁ + y₂ ≥ 2, y ≥ 0. For y = (3 − 2s, s): y₁ + 2y₂ = 3 ✓; y₁ + y₂ = 3 − s ≥ 2 iff s ≤ 1 ✓; y ≥ 0 iff s ∈ [0, 1.5] ✓; value 4(3 − 2s) + 8s = 12 = primal value, so all are optimal. Endpoints (3, 0) and (1, 1) come from the bases {x₁, s₂} and {x₁, x₂}; (0, 3/2) from {x₁, s₁} is infeasible (y₁ + y₂ = 1.5 < 2). (c) Because the primal optimum is degenerate, the dual is not unique and there is no single shadow price for b₁: increasing b₁ the value rises at rate min y₁ = 1 (12.1 at b₁ = 4.1, x = (3.9, 0.2)); decreasing b₁ it falls at rate max y₁ = 3 (11.7 at b₁ = 3.9, x = (3.9, 0)). The ranges of the two bases meet at b₁ = 4.", "src": "L5 p.38; Rec4 p.8"}]}, {"id": "l6", "title": "Applications of Duality: Farkas, Dual Simplex, Sensitivity", "deck": "Fall_2026_15_C57-L6.pdf", "brief": "L6 puts duality to work in three ways. As a proof technique, it gives Farkas' lemma: either Ax = b has a solution x ≥ 0 or a vector p certifies infeasibility, which in finance becomes the no-arbitrage ⇔ state-prices theorem used to price options. As an algorithm, the dual simplex keeps reduced costs nonnegative and pivots toward primal feasibility, which makes it the natural warm start after a RHS change or an added cut, while primal simplex handles cost changes and new columns. As sensitivity analysis, it gives ranges for costs (via reduced costs and the basic variable's tableau row) and for right-hand sides (via B⁻¹), within which the dual variables are exact shadow prices. On the exam, expect tableau interpretation (practice exam P2), a dual simplex pivot after a Gomory cut (1i), the monotonicity T/F (1k), and shadow-price questions with units and validity ranges.", "keyPoints": ["Farkas: exactly one of {∃x ≥ 0: Ax = b} and {∃p: pᵀA ≥ 0ᵀ, pᵀb < 0}", "No arbitrage ⇔ ∃q ≥ 0 with Rᵀq = p; call = q₁(Su − K)⁺ + q₂(Sd − K)⁺, q₁ = (r − d)/(r(u − d))", "Dual simplex: keep c̄ ≥ 0; leave row with x_B(l) < 0; enter argmin c̄ₖ/|vₖ| over vₖ < 0; v ≥ 0 ⇒ infeasible", "Dual simplex cost rises (min); primal simplex cost falls", "Change c / add column ⇒ primal simplex; change b / add row ⇒ dual simplex", "Cost range (basic xₖ): max{c̄ⱼ/αₖⱼ: αₖⱼ < 0} ≤ Δ ≤ min{c̄ⱼ/αₖⱼ: αₖⱼ > 0}", "RHS range: B⁻¹(b + Δeₗ) ≥ 0; inside, Δcost = Δpₗ; outside, re-optimize", "Slack's reduced cost = −pᵢ; slack row ⇒ pᵢ = 0; quote units and direction"], "topics": [{"name": "Farkas lemma & arbitrage", "explain": "Exactly one holds: ∃x ≥ 0 with Ax = b, or ∃p with pᵀA ≥ 0ᵀ and pᵀb < 0. Proof: max 0 s.t. Ax = b, x ≥ 0 has dual min pᵀb s.t. pᵀA ≥ 0ᵀ, which is feasible (p = 0), so if the primal is infeasible the dual is unbounded. Finance: no arbitrage ⇔ ∃ state prices q ≥ 0 with Rᵀq = p; binomial call price = q₁(Su − K)⁺ + q₂(Sd − K)⁺.", "slides": [{"file": "Fall_2026_15_C57-L6.pdf", "page": 3, "label": "Farkas: geometric view"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 4, "label": "Farkas: algebraic proof"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 27, "label": "Asset pricing application"}, {"file": "Recitation4.pdf", "page": 31, "label": "Farkas and state prices"}, {"file": "Recitation4.pdf", "page": 32, "label": "Solving for the option price"}]}, {"name": "Dual simplex mechanics", "explain": "Keep c̄ ≥ 0 (dual feasible), work toward B⁻¹b ≥ 0. Pick a row l with x_B(l) < 0; if its entries v ≥ 0 the primal is infeasible; otherwise entering j minimizes c̄ₖ/|vₖ| over vₖ < 0. The dual objective c_BᵀB⁻¹b never decreases (min problem), opposite to primal simplex.", "slides": [{"file": "Fall_2026_15_C57-L6.pdf", "page": 8, "label": "Primal vs dual simplex"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 9, "label": "Worked example"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 10, "label": "Algorithm statement"}]}, {"name": "Warm starts & degeneracy", "explain": "Change c or add a column: old basis stays primal feasible ⇒ primal simplex. Change b or add a row (e.g., a Gomory cut): old basis stays dual feasible ⇒ dual simplex. Primal degeneracy = a basic variable at 0; dual degeneracy = a nonbasic c̄ⱼ = 0 (alternative optima possible).", "slides": [{"file": "Fall_2026_15_C57-L6.pdf", "page": 11, "label": "Simplex vs dual simplex summary"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 12, "label": "Empirical study"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 13, "label": "Warm start"}]}, {"name": "Cost ranging", "explain": "cₖ → cₖ + Δ never affects B⁻¹b. Nonbasic xₖ: optimal iff Δ ≥ −c̄ₖ. Basic xₖ (row α_k·): max{c̄ⱼ/α_kj : α_kj < 0} ≤ Δ ≤ min{c̄ⱼ/α_kj : α_kj > 0}. Inside the range x is unchanged and cost moves by Δxₖ; mind sign flips when the original problem is a max.", "slides": [{"file": "Fall_2026_15_C57-L6.pdf", "page": 15, "label": "Cost perturbation"}]}, {"name": "RHS ranging & shadow prices", "explain": "bₗ → bₗ + Δ never affects c̄. The basis stays optimal iff B⁻¹(b + Δeₗ) ≥ 0, using column l of B⁻¹; inside the range cost changes by Δpₗ and x_B moves to B⁻¹(b + Δeₗ). Outside, re-optimize with dual simplex; the shadow price overstates the gain.", "slides": [{"file": "Fall_2026_15_C57-L6.pdf", "page": 16, "label": "Change in b: intuition"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 17, "label": "Constraint perturbation and range"}, {"file": "Recitation4.pdf", "page": 4, "label": "Shadow prices as sensitivity"}, {"file": "Recitation4.pdf", "page": 5, "label": "Shadow prices and CS"}]}, {"name": "Interpreting duals & reduced costs", "explain": "Dual pᵢ = marginal value of resource i (zero if slack, by CS); in a min model ≤ capacity rows have pᵢ ≤ 0. Reduced cost = loss per unit of forcing in a nonbasic activity; price out a new product with π − pᵀA. Filatoi: capacity −2.12 $/h, fine demand 14.96 $/kg.", "slides": [{"file": "Fall_2026_15_C57-L6.pdf", "page": 19, "label": "Filatoi capacity dual"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 20, "label": "Filatoi fine demand dual"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 23, "label": "Duals as shadow prices"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 24, "label": "Reduced costs and product design"}]}], "mc": [{"d": "easy", "q": "Farkas: if Ax = b, x ≥ 0 has no solution, then:", "o": ["Some p has pᵀA ≥ 0ᵀ and pᵀb < 0", "Some p has pᵀA ≤ 0ᵀ and pᵀb ≤ 0", "Ax = b has no solution at all", "Some x ≤ 0 satisfies Ax = b"], "e": "Exactly one Farkas alternative holds. Ax = b may well have solutions, just none with x ≥ 0.", "t": 0, "src": "L6 p.3"}, {"d": "medium", "q": "x₁ + x₂ = 2, x₁ + 2x₂ = 1, x ≥ 0 has no solution. Which p is a Farkas certificate?", "o": ["p = (−1, 1): pᵀA = (0, 1) ≥ 0, pᵀb = −1 < 0", "p = (1, −1): pᵀA = (0, −1), pᵀb = 1", "p = (1, 1): pᵀA = (2, 3) ≥ 0, pᵀb = 3", "p = (−1, 0): pᵀA = (−1, −1), pᵀb = −2"], "e": "The unique solution of Ax = b is (3, −1), so x ≥ 0 fails. p = (−1, 1) satisfies both certificate conditions; the others fail pᵀA ≥ 0 or pᵀb < 0.", "t": 0, "src": "L6 p.4"}, {"d": "hard", "q": "One period: stock S = 50 moves to 65 (u = 1.3) or 40 (d = 0.8); the bond returns r = 1.1. No-arbitrage price of a call with strike K = 55?", "o": ["≈ $5.45", "≈ $5.00", "≈ $6.00", "≈ $9.09"], "e": "q₁ = (1.1 − 0.8)/(1.1 × 0.5) = 6/11, q₂ = 4/11; price = (6/11)(65 − 55) = 60/11 ≈ 5.45. $6.00 forgets to discount; $5.00 uses 50/50 real probabilities. Check: 0.4 shares minus a $14.55 bond also costs 5.45.", "t": 0, "src": "Rec4 p.32 (BT 4.33)"}, {"d": "easy", "q": "A min-cost model has capacity row Σᵢ hᵢxᵢ ≤ 500 with dual value −3. Interpretation?", "o": ["One more hour lowers cost by about 3 (inside the range)", "One more hour of capacity raises cost by about 3", "The capacity row has slack at the optimum", "The dual must be wrong: duals are never negative"], "e": "Min primal with a ≤ row ⇒ dual ≤ 0. Δcost ≈ Δb × p = +1 × (−3). A slack row would have dual 0.", "t": 5, "src": "L6 p.16"}, {"d": "easy", "q": "Dual simplex maintains ___ and works toward ___.", "o": ["c̄ ≥ 0 (dual feasible); B⁻¹b ≥ 0 (primal feasible)", "B⁻¹b ≥ 0 (primal feasible); c̄ ≥ 0 (dual feasible)", "Both feasibilities at every single iteration", "Primal feasibility; integrality of the solution"], "e": "Mirror image of primal simplex, which keeps B⁻¹b ≥ 0 and chases c̄ ≥ 0. A basis with both is optimal and ends either algorithm.", "t": 1, "src": "L6 p.6"}, {"d": "medium", "q": "min 3x₁ + 2x₂ s.t. x₁ + x₂ ≥ 4, x₁ + 3x₂ ≥ 6, x ≥ 0. Start tableau (surplus basis): row 0: 0 | 3 2 0 0; s₁: −4 | −1 −1 1 0; s₂: −6 | −1 −3 0 1. Pivoting on the most negative row:", "o": ["s₂ leaves, x₂ enters (ratios 3 and 2/3)", "s₂ leaves, x₁ enters (ratios 3 and 2/3)", "s₁ leaves, x₂ enters", "s₁ leaves, x₁ enters (most negative entry −1)"], "e": "Row s₂ (−6) leaves. Over negative entries: x₁: 3/|−1| = 3, x₂: 2/|−3| = 2/3, so x₂ enters. Picking x₁ would make c̄₂ negative.", "t": 1, "src": "L6 p.10"}, {"d": "hard", "q": "Continuing: after x₂ enters, row 0: −4 | 7/3 0 0 2/3; s₁: −2 | −2/3 0 1 −1/3; x₂: 2 | 1/3 1 0 −1/3. Next pivot and final optimum?", "o": ["s₁ leaves, s₂ enters (ratios 7/2, 2); x = (0, 4), cost 8", "s₁ leaves, x₁ enters; optimum x = (3, 1), cost 11", "x₂ leaves, s₂ enters; optimum x = (6, 0), cost 18", "Stop: x₂ = 2 ≥ 0, so the basis is optimal with cost 4"], "e": "Row s₁ is still negative. Ratios: x₁ (7/3)/(2/3) = 7/2, s₂ (2/3)/(1/3) = 2 ⇒ s₂ enters. Result x₂ = 4, s₂ = 6, all reduced costs ≥ 0. The dual objective climbs 0 → 4 → 8.", "t": 1, "src": "L6 p.10"}, {"d": "easy", "q": "In dual simplex, a row with x_B(l) < 0 has every entry vₖ ≥ 0. Conclusion?", "o": ["Primal infeasible (dual unbounded)", "The primal is unbounded below", "The current basis is already optimal", "The most positive vₖ enters the basis"], "e": "Row l reads x_B(l) = (negative) − Σ vₖxₖ with vₖ ≥ 0 and xₖ ≥ 0, so it can never be met. Mirror of u ≤ 0 meaning unbounded in primal simplex.", "t": 1, "src": "L6 p.8, p.10"}, {"d": "hard", "q": "Dual simplex on a min problem. Over the iterations, c_BᵀB⁻¹b:", "o": ["Never decreases: a lower bound climbing to z*", "Never increases; it is an upper bound on z*", "Stays constant until primal feasibility is reached", "Can move either way, since x is primal infeasible"], "e": "It equals the dual objective pᵀb at a dual feasible p, which rises by θ*|x_B(l)| ≥ 0 per pivot (strictly if θ* > 0). Weak duality makes it a lower bound.", "t": 1, "src": "L6 p.10; Practice exam 1k"}, {"d": "easy", "q": "After solving an LP, the RHS of one constraint changes enough that B⁻¹b gets a negative entry. Best warm start?", "o": ["Dual simplex from the old basis (still dual feasible)", "Primal simplex from the old basis (still optimal)", "Phase 1 from scratch on the new RHS", "Primal simplex after negating the violated row"], "e": "Changing b does not affect c̄ = cᵀ − c_BᵀB⁻¹A, so dual feasibility survives and only primal feasibility is lost.", "t": 2, "src": "L6 p.13"}, {"d": "medium", "q": "At an optimal tableau, a nonbasic variable has c̄ⱼ = 0. This is:", "o": ["Dual degeneracy: alternative optima may exist", "Primal degeneracy: the dual has multiple optima", "A sign that the basis is not yet optimal", "Impossible at an optimal, nondegenerate basis"], "e": "Zero reduced cost on a nonbasic variable = dual degeneracy (L6). Entering it changes cost by θ*c̄ⱼ = 0, so a positive step gives another optimum.", "t": 2, "src": "L6 p.11"}, {"d": "medium", "q": "LP M: max 3x₁ + 2x₂ s.t. x₁ + x₂ ≤ 7, 2x₁ + x₂ ≤ 11, x₁ + 3x₂ ≤ 15, x ≥ 0; optimum x = (4, 3), profit 18. For which profits c₁ (c₂ = 2) does x = (4, 3) stay optimal?", "o": ["2 ≤ c₁ ≤ 4", "3 ≤ c₁ ≤ 4", "1 ≤ c₁ ≤ 5", "2 ≤ c₁ ≤ 6"], "e": "x₁'s tableau row has −1 under s₁ and +1 under s₂, both reduced costs 1, so Δ ∈ [−1, 1]. Geometrically c₁/c₂ must stay between the slopes of the two binding rows, 1 and 2.", "t": 3, "src": "L6 p.15"}, {"d": "hard", "q": "LP M, optimal tableau (columns x₁ x₂ s₁ s₂ s₃): row 0: 18 | 0 0 1 1 0; x₁: 4 | 1 0 −1 1 0; x₂: 3 | 0 1 2 −1 0; s₃: 2 | 0 0 −5 2 1. Range of the profit c₂ (c₁ = 3) keeping x = (4, 3) optimal?", "o": ["1.5 ≤ c₂ ≤ 3", "1 ≤ c₂ ≤ 3", "1.5 ≤ c₂ ≤ 2.5", "2 ≤ c₂ ≤ 4"], "e": "Min-form cost −2 + Δ. x₂'s row: α = 2 (s₁), −1 (s₂): Δ ≤ 1/2 and Δ ≥ −1, so the min cost lies in [−3, −1.5], i.e. profit c₂ ∈ [1.5, 3]. Mind the sign flip between min and max form.", "t": 3, "src": "L6 p.15"}, {"d": "easy", "q": "In a min-cost LP, nonbasic x₅ has c̄₅ = 3. Its cost c₅ drops by 2. Then:", "o": ["The basis stays optimal; c̄₅ becomes 1", "x₅ enters and cost falls by 2 per unit", "The basis becomes primal infeasible", "All reduced costs change, so re-solve"], "e": "For a nonbasic variable only its own reduced cost moves: 3 − 2 = 1 ≥ 0. It would enter only if c₅ dropped by more than 3.", "t": 3, "src": "L6 p.15"}, {"d": "medium", "q": "LP M: labor RHS 7 → 7 + Δ. Labor's column of B⁻¹ is (−1, 2, −5) for rows (x₁, x₂, s₃), and B⁻¹b = (4, 3, 2). Range of Δ keeping the basis optimal?", "o": ["−1.5 ≤ Δ ≤ 0.4", "−4 ≤ Δ ≤ 1.5", "−0.4 ≤ Δ ≤ 1.5", "−1.5 ≤ Δ ≤ 4"], "e": "Need (4 − Δ, 3 + 2Δ, 2 − 5Δ) ≥ 0: Δ ≤ 4, Δ ≥ −1.5, Δ ≤ 0.4. The binding limit on the right is s₃ (material) hitting 0.", "t": 4, "src": "L6 p.17"}, {"d": "hard", "q": "LP M: labor's shadow price is 1 and the optimal profit is 18. Labor rises from 7 to 8. Optimal profit?", "o": ["18.4: past Δ = 0.4 material binds", "19: shadow price 1 times Δ = 1", "18: labor is not a binding constraint", "21: machine time stops binding"], "e": "The shadow price holds only on [−1.5, 0.4]. At Δ = 0.4 material becomes tight; beyond it extra labor is useless and the optimum stays at (3.6, 3.8) with profit 18.4 (HiGHS).", "t": 4, "src": "L6 p.17 (re-solve)"}, {"d": "hard", "q": "LP M with labor cut to 5 (Δ = −2): B⁻¹b = (6, −1, 12). x₂'s row reads (0, 1, 2, −1, 0) and the reduced costs are (0, 0, 1, 1, 0). One dual simplex pivot gives:", "o": ["x₂ leaves, s₂ enters; x = (5, 0), profit 15", "x₂ leaves, s₁ enters; x = (6, 0), profit 18", "s₃ leaves, x₂ enters; x = (4, 3), profit 18", "No pivot exists: the LP is now infeasible"], "e": "Row x₂ = −1 < 0; its only negative entry is under s₂ (ratio 1/1), so s₂ enters. New point (5, 0), profit 15, primal feasible. The shadow price would predict 18 − 2 = 16: wrong outside the range.", "t": 4, "src": "L6 p.17, p.10"}, {"d": "medium", "q": "LP M: machine-hours RHS 11 rises to 14, inside its range [10, 14] (B⁻¹ column (1, −1, 2)). New optimal plan and profit?", "o": ["x = (7, 0), profit 21", "x = (4, 3), profit 21", "x = (4, 3), profit 18", "x = (8, 0), profit 24"], "e": "New x_B = (4 + 3, 3 − 3, 2 + 6) = (7, 0, 8). Profit 18 + 3 × 1 = 21. Inside the range the basis stays optimal, but the values of the basic variables change.", "t": 4, "src": "L6 p.17"}, {"d": "easy", "q": "LP M: material (RHS 15) has slack 2 at the optimum. Its shadow price, and the value of 5 more units?", "o": ["0; worth nothing", "1; worth 5", "2; worth 10", "Negative; adding it lowers profit"], "e": "Complementary slackness: a non-binding row has dual 0. More of a resource that is not used up cannot raise profit.", "t": 4, "src": "L6 p.23"}, {"d": "medium", "q": "LP M (shadow prices: labor 1, machine 1, material 0). A new product earns 4 per unit and uses 1 labor, 1 machine-hour and 2 material. Introduce it?", "o": ["Yes: 4 − (1 + 1 + 0) = 2 > 0; warm-start primal simplex from the old basis", "No: 4 − (1 + 1 + 2) = 0, so it is indifferent", "Yes, because 4 exceeds both existing profits; warm-start dual simplex", "No: adding a variable makes the old basis infeasible"], "e": "Pricing out with p: the inputs are worth 2 at current shadow prices, so the new column has positive reduced profit. The old basis stays feasible, hence primal simplex (re-solve: profit rises to 28).", "t": 5, "src": "L6 p.24"}, {"d": "easy", "q": "Geometrically, the Farkas alternative '∃x ≥ 0 with Ax = b' says:", "o": ["b lies in the cone generated by the columns A₁, …, Aₙ", "b is orthogonal to every column of A", "Some column Aⱼ is parallel to b", "A hyperplane with normal p separates b from the columns"], "e": "Ax = Σⱼ xⱼAⱼ with x ≥ 0 is a conic combination. The other alternative is the separating hyperplane: pᵀAⱼ ≥ 0 for all j but pᵀb < 0.", "t": 0, "src": "L6 p.3"}, {"d": "easy", "q": "After solving an LP, one cost coefficient changes and a nonbasic reduced cost turns negative. Best warm start?", "o": ["Primal simplex from the old basis (still primal feasible)", "Dual simplex from the old basis (still dual feasible)", "Phase 1 from scratch", "No re-solve needed: costs never affect the optimal basis"], "e": "Changing c leaves B⁻¹b ≥ 0 untouched, so x stays feasible but loses optimality (c̄ < 0). Primal simplex restores dual feasibility. Changing b is the mirror case for dual simplex.", "t": 2, "src": "L6 p.13"}, {"d": "easy", "q": "L6's Gurobi study on 383 MIPLIB LP instances found:", "o": ["Dual simplex was generally more effective (e.g., 89 vs 75 medium instances solved)", "Primal simplex solved every instance faster than dual simplex", "Neither method handled instances above 1M non-zeros", "Both methods solved exactly the same instances in the same time"], "e": "Small: 269 vs 268 solved, but dual faster (3.53 s vs 5.19 s). Medium: 89 vs 75, 27 s vs 100 s. Large (up to 100M non-zeros): 19 vs 18. Both scale; dual tends to win.", "t": 1, "src": "L6 p.12"}, {"d": "hard", "q": "Practice exam 1i: after the Gomory cut, the tableau is row 0: 13 | 0 0 2/3 1/3 0; x₂: 5/2 | 0 1 1/6 −1/6 0; x₁: 3 | 1 0 0 1 0; s₃: −1/2 | 0 0 −1/6 −5/6 1. One dual simplex pivot gives:", "o": ["s₃ leaves, s₂ enters (ratios 4 vs 2/5); x = (12/5, 13/5), cost −12.8", "s₃ leaves, s₁ enters (ratios 4 vs 2/5); x = (3, 2), cost −11", "s₃ leaves, s₂ enters; x = (3, 5/2), cost −13 unchanged", "x₂ leaves, s₁ enters, because x₂ is fractional"], "e": "Only s₃ < 0. Ratios over negative entries: s₁ (2/3)/(1/6) = 4, s₂ (1/3)/(5/6) = 2/5 ⇒ s₂ enters at 3/5. x₁ = 3 − 3/5, x₂ = 5/2 + (1/6)(3/5) = 13/5. Cost rises by θ*·|−1/2| = 1/5 (HiGHS with cut x₁ + x₂ ≤ 5: −12.8).", "t": 1, "src": "Practice exam 1i"}, {"d": "hard", "q": "Furniture LP (practice exam P2), optimal basis {x₁, x₄, x₂} with B⁻¹b = (3/2, 7/6, 5/6); the hours column of B⁻¹ is (−1/4, 7/12, 5/12). Hours dual = 1/6 (≈ $16.67/h). For how many EXTRA hours does that wage stay valid?", "o": ["Up to 600 extra hours (hours RHS ≤ 10 hundred)", "Up to 200 extra hours (hours RHS ≤ 6 hundred)", "Any amount: hours stay binding forever", "Up to 117 extra hours, the paint slack 7/6"], "e": "Need (3/2 − Δ/4, 7/6 + 7Δ/12, 5/6 + 5Δ/12) ≥ 0 ⇒ −2 ≤ Δ ≤ 6 (hundreds). At Δ = 6 chairs hit 0; beyond, revenue stays at 10/3 (HiGHS: −10/3 at 10 and 10.5).", "t": 4, "src": "Practice exam P2(e) (re-solve)"}, {"d": "hard", "q": "Same furniture tableau; x₁'s row is (1, 0, 1/4, 0, −1/4) and c̄ = (0, 0, 1/6, 0, 1/6). Table price fixed at $100. For which chair prices does x = (150 chairs, 83.3 tables) stay optimal?", "o": ["$33.33 ≤ price ≤ $166.67", "$83.33 ≤ price ≤ $116.67", "$100 ≤ price ≤ $166.67", "$50 ≤ price ≤ $150"], "e": "c₁ = −1 + Δ: Δ ≤ (1/6)/(1/4) = 2/3 and Δ ≥ (1/6)/(−1/4) = −2/3 ⇒ c₁ ∈ [−5/3, −1/3], i.e., $33.33–$166.67 per chair. Geometry: c₁/c₂ between the slopes of hours (1/3) and wood (5/3).", "t": 3, "src": "Practice exam P2(b); L6 p.15"}, {"d": "hard", "q": "Binomial market S = 50, u = 1.3, d = 0.8, r = 1.1, call K = 55 (fair price ≈ $5.45). The call trades at $7. An arbitrage:", "o": ["Sell the call, buy 0.4 share, borrow $14.55: +$1.55 now, 0 in both states", "Buy the call, short 0.4 share, lend $14.55: +$1.55 now, 0 in both states", "None: $7 lies between 0 and the discounted payoff 10/1.1", "Buy the call and short the bond: guaranteed $10 payoff"], "e": "0.4 share − $14.55 bond pays 26 − 16 = 10 (up) and 16 − 16 = 0 (down), replicating the call for $5.45. Selling the overpriced call against it nets 7 − 5.45 = 1.55 now. The reverse trade costs 1.55. No q ≥ 0 with Rᵀq = p exists at $7.", "t": 0, "src": "Rec4 p.31-32; L6 p.27"}], "or": [{"q": "BT 4.33 (Recitation 4). One period; stock S = 50 goes to Su = 65 or Sd = 40; bond returns r = 1.1 per $1; a call with strike K = 55. (a) Write the return matrix R (scenarios × assets) and the no-arbitrage condition. (b) State the Farkas alternative and conclude that state prices q ≥ 0 with Rᵀq = p exist. (c) Solve for q and the call price. (d) If the call traded at $7, construct an explicit arbitrage.", "pts": 10, "t": 0, "rubric": ["(a) R = [[65, 1.1, 10], [40, 1.1, 0]] and no arbitrage: Rx ≥ 0 ⇒ pᵀx ≥ 0 — 2 pts", "(b) Farkas: either ∃q ≥ 0 with Rᵀq = p, or ∃x with Rx ≥ 0 and pᵀx < 0; no arbitrage rules out the second — 2 pts", "(c) q₁ = (r − d)/(r(u − d)) = 6/11, q₂ = (u − r)/(r(u − d)) = 4/11, both ≥ 0 — 2 pts", "(c) Call price = 6/11 × 10 = 60/11 ≈ $5.45 — 2 pts", "(d) Sell the call at 7, buy 0.4 share, borrow ≈ $14.55: +$1.55 now, zero payoff in both states — 2 pts"], "model": "(a) Assets: stock, bond, call. Payoffs: up state (65, 1.1, max{0, 65 − 55} = 10); down state (40, 1.1, 0). R = [[65, 1.1, 10], [40, 1.1, 0]], prices p = (50, 1, p₃). A portfolio x (negative = short) pays Rx. No arbitrage: every x with Rx ≥ 0 has pᵀx ≥ 0. (b) Farkas with A = Rᵀ, b = p: exactly one holds: (i) ∃q ≥ 0 with Rᵀq = p, or (ii) ∃x with xᵀRᵀ ≥ 0ᵀ (Rx ≥ 0) and xᵀp < 0, i.e., an arbitrage. No arbitrage excludes (ii), so (i) holds: nonnegative state prices exist, and then pᵀx = qᵀ(Rx) ≥ 0. (c) 50 = 65q₁ + 40q₂ and 1 = 1.1q₁ + 1.1q₂ ⇒ q₁ + q₂ = 1/1.1; 65q₁ + 40(1/1.1 − q₁) = 50 ⇒ 25q₁ = 50 − 36.36 = 13.64 ⇒ q₁ = 6/11 ≈ 0.545, q₂ = 4/11 ≈ 0.364 (formula (r − d)/(r(u − d)) = 0.3/0.55, (u − r)/(r(u − d)) = 0.2/0.55). Call price = q₁·10 + q₂·0 = 60/11 ≈ $5.45. (d) Replicate the call: Δ = (10 − 0)/(65 − 40) = 0.4 shares and a bond position B with 0.4·40 + 1.1B = 0 ⇒ B = −14.55 (borrow). Cost 0.4·50 − 14.55 = 5.45; payoff 10 (up) and 0 (down). Sell the call at $7 and buy the replica: cash +7 − 5.45 = +$1.55 today, net payoff 0 in both states: arbitrage, consistent with no q ≥ 0 solving Rᵀq = p when p₃ = 7.", "src": "Rec4 p.26-32; L6 p.27"}, {"q": "Practice exam 1i. P₂: min −x₁ − 4x₂ s.t. x₁ + 6x₂ + s₁ = 18, x₁ + s₂ = 3, x, s ≥ 0, with optimal tableau row 0: 13 | 0 0 2/3 1/3; x₂: 5/2 | 0 1 1/6 −1/6; x₁: 3 | 1 0 0 1. (a) Is this optimal for P₂ and for the integer problem P₁? (b) Derive the Gomory cut from the x₂ row. (c) Add it to the tableau and explain why dual simplex (not primal) is used. (d) Perform one dual simplex pivot and report the new solution and cost.", "pts": 10, "t": 1, "rubric": ["(a) Optimal for P₂ (all c̄ ≥ 0) but not P₁ since x₂ = 5/2 — 1 pts", "(b) Cut: x₂ + ⌊1/6⌋s₁ + ⌊−1/6⌋s₂ ≤ ⌊5/2⌋ ⇒ x₂ − s₂ ≤ 2 (equivalently (1/6)s₁ + (5/6)s₂ ≥ 1/2) — 2 pts", "(c) New row s₃: −1/2 | 0 0 −1/6 −5/6 1; basis is dual feasible (c̄ unchanged, c̄(s₃) = 0) but primal infeasible ⇒ dual simplex — 2 pts", "(d) Ratios s₁: (2/3)/(1/6) = 4, s₂: (1/3)/(5/6) = 2/5 ⇒ s₂ enters, s₃ leaves — 2 pts", "(d) s₂ = 3/5, x₁ = 12/5, x₂ = 13/5, cost −12.8 (row 0 value 12.8, up 1/5); primal feasible ⇒ optimal for the cut LP, still fractional — 3 pts"], "model": "(a) All reduced costs (0, 0, 2/3, 1/3) ≥ 0 and B⁻¹b ≥ 0, so (x₁, x₂) = (3, 5/2) is optimal for P₂ with cost −13. It is not feasible for P₁ because x₂ = 5/2 ∉ ℤ. (b) Row x₂ + (1/6)s₁ − (1/6)s₂ = 5/2. For x, s ≥ 0, rounding coefficients down gives x₂ + 0·s₁ − 1·s₂ ≤ 5/2, and since the LHS is integer at integer points, x₂ − s₂ ≤ 2. Subtracting from the row: (1/6)s₁ + (5/6)s₂ ≥ 1/2, i.e., −(1/6)s₁ − (5/6)s₂ + s₃ = −1/2 with s₃ ≥ 0. In original variables (s₂ = 3 − x₁): x₁ + x₂ ≤ 5. (c) The new row s₃ = −1/2 makes the basis primal infeasible, but reduced costs are unchanged and c̄(s₃) = 0, so it is still dual feasible: exactly the dual simplex starting condition (adding a constraint is the warm-start case for dual simplex). (d) Leaving row s₃ (−1/2 < 0); negative entries s₁ (−1/6) and s₂ (−5/6); ratios c̄/|v|: 4 and 2/5 ⇒ s₂ enters, θ* = 2/5. New values: s₂ = (−1/2)/(−5/6) = 3/5; x₁ = 3 − 3/5 = 12/5; x₂ = 5/2 + (1/6)(3/5) = 13/5. Updated reduced costs: s₁: 2/3 − (2/5)(1/6) = 3/5, s₃: 2/5, all ≥ 0. Cost = −12/5 − 52/5 = −12.8 (it increased by θ*·1/2 = 1/5 from −13, as dual simplex cost rises). All basics ≥ 0 ⇒ optimal for P₂ + cut; still fractional, so further cuts or branching are needed.", "src": "Practice exam 1i"}, {"q": "Warm starts. A min LP in standard form has been solved with optimal basis B. For each modification, state whether the old basis remains primal feasible and/or dual feasible, and which algorithm you would warm-start: (a) one cost cₖ changes; (b) one RHS bₗ changes; (c) a new variable is added; (d) a new constraint is added. Then (e) answer practice exam 1k: is cᵀx⁽ᵗ⁺¹⁾ ≤ cᵀx⁽ᵗ⁾ for (i) primal simplex and (ii) dual simplex? Justify.", "pts": 10, "t": 2, "rubric": ["(a) B⁻¹b unchanged ⇒ primal feasible; c̄ may turn negative ⇒ primal simplex — 2 pts", "(b) c̄ unchanged ⇒ dual feasible; B⁻¹b may get a negative entry ⇒ dual simplex — 2 pts", "(c) New column nonbasic at 0 ⇒ primal feasible; its c̄ may be negative ⇒ primal simplex — 2 pts", "(d) Old basis + new slack: c̄ unchanged ⇒ dual feasible, may be primal infeasible ⇒ dual simplex — 2 pts", "(e) (i) TRUE: primal simplex weakly decreases cost; (ii) FALSE: dual simplex weakly increases cᵀx (= pᵀb) toward z* — 2 pts"], "model": "(a) Changing cₖ does not change B or b, so x_B = B⁻¹b ≥ 0 stays primal feasible; the reduced costs c̄ = c − c_BᵀB⁻¹A may become negative, so optimality (dual feasibility) can be lost: warm-start primal simplex. (b) Changing bₗ leaves c̄ unchanged (dual feasible), but B⁻¹(b + Δeₗ) may have a negative component: warm-start dual simplex, which keeps c̄ ≥ 0 and restores primal feasibility. (c) A new variable enters as nonbasic at 0, so the old x stays feasible; its reduced cost c_new − pᵀA_new may be negative: primal simplex (price it out first; if c̄ ≥ 0, the old solution is still optimal). (d) Adding a row with its slack in the basis leaves existing reduced costs unchanged and gives the slack c̄ = 0, so the basis is dual feasible; the current x may violate the new constraint (negative slack): dual simplex. This is why branch-and-bound and cutting planes re-solve with dual simplex. (e)(i) TRUE: primal simplex moves between BFSs with step θ*c̄ⱼ ≤ 0, so cost never increases. (ii) FALSE: in dual simplex the iterate x⁽ᵗ⁾ is primal infeasible and its cost equals the dual objective pᵀb, which weakly increases each pivot (by θ*|x_B(l)| ≥ 0) up to z*.", "src": "L6 p.10-13; Practice exam 1k"}, {"q": "Furniture LP (practice exam P2): min −x₁ − x₂ (chairs and tables in hundreds, revenue in $10,000, both priced at $100), wood 5x₁ + 3x₂ ≤ 10, paint 4x₁ + x₂ ≤ 8, hours x₁ + 3x₂ ≤ 4. Optimal tableau (basis order x₁, x₄, x₂): row 0: 7/3 | 0 0 1/6 0 1/6; x₁: 3/2 | 1 0 1/4 0 −1/4; x₄: 7/6 | 0 0 −11/12 1 7/12; x₂: 5/6 | 0 1 −1/12 0 5/12. (a) Find the range of the chair coefficient c₁ for which the basis stays optimal and translate it into a chair price. (b) What happens just outside each end? (c) A marketing team proposes raising the chair price to $150. What is the new revenue?", "pts": 10, "t": 3, "rubric": ["(a) x₁ basic; uses its row α = (1/4 under x₃, −1/4 under x₅) and c̄ = 1/6 for both — 2 pts", "(a) −2/3 ≤ Δ ≤ 2/3 ⇒ c₁ ∈ [−5/3, −1/3] ⇒ chair price $33.33 to $166.67 — 3 pts", "(b) Above $166.67: x₅ (hours slack) enters, optimum moves to 200 chairs, 0 tables; below $33.33: x₃ (wood slack) enters, optimum moves to 0 chairs, 133.3 tables — 3 pts", "(c) $150 is inside the range: same plan, revenue 1.5 × 1.5 + 5/6 = 37/12 ⇒ ≈ $30,833 — 2 pts"], "model": "(a) x₁ is basic with tableau row (1, 0, 1/4, 0, −1/4); nonbasic x₃ (wood slack) and x₅ (hours slack) both have c̄ = 1/6. With c₁ = −1 + Δ, new reduced costs are c̄ⱼ − Δα₁ⱼ: x₃: 1/6 − Δ/4 ≥ 0 ⇒ Δ ≤ 2/3; x₅: 1/6 + Δ/4 ≥ 0 ⇒ Δ ≥ −2/3. So c₁ ∈ [−5/3, −1/3]; since −1 represents $100 per chair, the chair price may range from $33.33 to $166.67 with x = (1.5, 0.833) (150 chairs, 83.3 tables) optimal. Geometric check: c₁/c₂ must lie between the slopes of the binding rows, hours (1/3) and wood (5/3). (b) If the price exceeds $166.67, x₅'s reduced cost turns negative; pivoting moves to x = (2, 0): 200 chairs, wood and paint binding (HiGHS at c₁ = −1.7: x = (2, 0)). If it drops below $33.33, x₃ enters and the optimum becomes x = (0, 4/3): 133.3 tables, hours binding (c₁ = −0.3: x = (0, 1.333)). (c) $150 ⇒ c₁ = −1.5, inside the range: plan unchanged, revenue changes by Δx₁ = 0.5 × 1.5 = 0.75 ⇒ 7/3 + 3/4 = 37/12 ≈ 3.083, i.e., ≈ $30,833.", "src": "Practice exam P2(b); L6 p.15"}, {"q": "Same furniture tableau. (a) Read off the optimal dual p from the tableau and explain the rule you used. (b) How much would you pay per liter of paint, and how many liters? (c) What is the maximum hourly wage for extra workers, and over what range of total hours is it valid? Use the B⁻¹ columns (hours column (−1/4, 7/12, 5/12)). (d) What is the revenue if total hours rise from 400 to 1,100?", "pts": 10, "t": 4, "rubric": ["(a) Reduced cost of slack x_{i+2} = −pᵢ ⇒ p = (−1/6, 0, −1/6) — 2 pts", "(b) Paint dual 0 (7/6 slack) ⇒ pay nothing, buy none — 2 pts", "(c) Hours dual 1/6 per 100 h of $10,000 ⇒ ≈ $16.67/h — 2 pts", "(c) Range from B⁻¹(b + Δe₃) ≥ 0: −2 ≤ Δ ≤ 6 ⇒ total hours 200 to 1,000 — 2 pts", "(d) Beyond 1,000 h extra hours are worthless: revenue capped at 10/3 ⇒ ≈ $33,333 (not 7/3 + 7/6) — 2 pts"], "model": "(a) The slack columns of A form I, so their reduced costs are 0 − pᵀeᵢ = −pᵢ. Row 0 shows (1/6, 0, 1/6) under x₃, x₄, x₅ ⇒ p = (−1/6, 0, −1/6) (equivalently pᵀ = c_BᵀB⁻¹). (b) Paint's dual is 0: its slack x₄ = 7/6 (116.7 L unused) is basic, so by CS extra paint has no value: pay $0, acquire none. (c) p₃ = −1/6: one more unit of hours (100 h) lowers the min cost by 1/6, i.e., raises revenue by $10,000/6 ≈ $1,667, so the break-even wage is ≈ $16.67/h. Range: B⁻¹(b + Δe₃) = (3/2 − Δ/4, 7/6 + 7Δ/12, 5/6 + 5Δ/12) ≥ 0 ⇒ Δ ≤ 6, Δ ≥ −2, Δ ≥ −2 ⇒ hours RHS ∈ [2, 10], i.e., 200 to 1,000 total hours; within it the wage is valid. (d) 1,100 h is Δ = 7 > 6, outside the range. Up to 1,000 h revenue grows to 7/3 + 6/6 = 10/3; at that point chairs drop to 0 and the plan is 333.3 tables with wood binding, so further hours add nothing. Revenue ≈ 10/3 × $10,000 ≈ $33,333 (HiGHS: −10/3 at 10 and 10.5), not 7/3 + 7/6 = 3.5.", "src": "Practice exam P2(c)-(e); L6 p.17"}]}, {"id": "l7", "title": "Case study: airline revenue management", "deck": "Fall_2026_15_C57-L7.pdf", "brief": "Lecture 7 is a case study in airline network revenue management. Demand is defined by origin-destination itinerary and fare class, but capacity sits on individual flights, so seat allocation becomes a linear program that trades local against connecting passengers. The exam-relevant core is LP duality: the dual of each flight's capacity constraint is its bid price, the opportunity cost of a seat. Complementary slackness turns those duals into a decentralized accept/reject rule: accept a class when its fare exceeds the sum of bid prices on its itinerary. Expect to formulate the LP and its dual, count variables and constraints, apply CS to explain which classes are fully served, closed or marginal, compute net values for a flight manager, and recognize that duals are marginal values valid only locally.", "keyPoints": ["RM = quantity control within fare classes (open/close); pricing sets the fares and restrictions", "LP: max Σ pⱼᵏxⱼᵏ s.t. Σ_{j∈Jᵢ}Σₖ xⱼᵏ ≤ Cᵢ (dual λᵢ), xⱼᵏ ≤ Dⱼᵏ (dual μⱼᵏ), x ≥ 0", "Size: nK variables; m + nK constraints excluding x ≥ 0", "Bid price = λᵢ = dual of capacity row = opportunity cost of the last seat", "Dual rows: Σ (bid prices on j) + μⱼᵏ ≥ pⱼᵏ", "CS rule: p > bid sum ⇒ x = D; p < bid sum ⇒ x = 0; p = bid sum ⇒ marginal, 0 ≤ x ≤ D", "Flight manager: net value = fare − other flights' bid prices; accept if > own bid price", "Delta 2007: +1.04M/day (+1.6%), non-stop −2.13%, one-stop +8.80%; network RM gains ≈ 1–2%"], "topics": [{"name": "RM background", "explain": "Pricing creates fare classes (fare level + restrictions); revenue management is quantity control within them, opening and closing classes over time. Leisure travelers book early with low willingness to pay, business travelers late with high willingness to pay, so seats are protected via booking limits on low classes. Single-leg rule: sell a low fare only while it exceeds the expected revenue lost from turning away later high-fare requests.", "slides": [{"file": "Fall_2026_15_C57-L7.pdf", "page": 4, "label": "Pricing vs. revenue management"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 5, "label": "Market segmentation, reserved capacity"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 6, "label": "Leg-based booking limits; toward network RM"}]}, {"name": "Network RM formulation", "explain": "Demand is by origin-destination itinerary and fare class; supply is by flight leg. Variables xⱼᵏ = seats sold on itinerary j in class k. LP: max Σⱼ Σₖ pⱼᵏ xⱼᵏ s.t. Σ_{j∈Jᵢ} Σₖ xⱼᵏ ≤ Cᵢ for each flight i, xⱼᵏ ≤ Dⱼᵏ, x ≥ 0. Size: nK variables, m + nK constraints (excluding x ≥ 0).", "slides": [{"file": "Fall_2026_15_C57-L7.pdf", "page": 8, "label": "Data and decisions (small instance)"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 9, "label": "Small-instance formulation"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 12, "label": "Large-scale network RM LP"}]}, {"name": "Optimal solution & edge", "explain": "The small-instance optimum fills all four flights to 200 and rations Q demand on itineraries where the fare equals the sum of bid prices. Delta 2007 (≈200,000 variables and constraints): optimized 65.37M/day vs 64.33M for a sequential non-stop-first benchmark (+1.04M, +1.6%), with non-stop revenue −2.13% and one-stop +8.80%. The gain comes from trading low-yield local seats for high-fare connecting traffic.", "slides": [{"file": "Fall_2026_15_C57-L7.pdf", "page": 10, "label": "Small-instance optimal sales"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 13, "label": "Delta 2007: edge of optimization"}]}, {"name": "Bid prices as duals", "explain": "Bid price of flight i = λᵢ, the dual of its capacity row: the opportunity cost of the last seat. Dual: min Σ Cᵢλᵢ + Σ Dⱼᵏμⱼᵏ s.t. λ_f(j) + μⱼᵏ ≥ pⱼᵏ (direct), λ_g(j) + λ_h(j) + μⱼᵏ ≥ pⱼᵏ (connecting), λ, μ ≥ 0. Small instance: λ = 160 (BOS-ORD), 250 (JFK-ORD), 160 (ORD-SFO), 200 (ORD-LAX). λᵢ is a marginal value valid only while the basis is unchanged.", "slides": [{"file": "Fall_2026_15_C57-L7.pdf", "page": 16, "label": "Opportunity cost intuition and duals"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 17, "label": "Bid price definition, net value"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 18, "label": "Dual formulation"}]}, {"name": "Bid-price control", "explain": "Complementary slackness gives the rule: if pⱼᵏ > Σ bid prices on j, then μ > 0 and x = D (accept all); if pⱼᵏ < Σ bid prices, x = 0; at equality μ = 0 and any 0 ≤ x ≤ D is allowed (the marginal class). A flight manager compares net value = fare − bid prices of the other flights against the own bid price; ranking by raw fare is the wrong approach.", "slides": [{"file": "Fall_2026_15_C57-L7.pdf", "page": 19, "label": "Bid price control via CS"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 20, "label": "Complementary slackness in action"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 21, "label": "BUF-ATL-LAX/FLL example"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 22, "label": "Wrong approach: rank by fare"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 23, "label": "Correct approach: net value"}]}, {"name": "RM in practice", "explain": "Deterministic network LPs rely on noisy forecasts, many markets have tiny demand, and bookings arrive dynamically. Bid prices decentralize control: the central LP sends λ₁…λₘ to flight-level RM systems (e.g., EMSRb), re-optimized periodically. Network RM gains are about 1–2% over flight-based RM; Crandall credits yield management with $1.4B over three years at American.", "slides": [{"file": "Fall_2026_15_C57-L7.pdf", "page": 15, "label": "Limitations; decentralized rules"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 25, "label": "Network RM loop, 1–2% gains"}, {"file": "Fall_2026_15_C57-L7.pdf", "page": 26, "label": "Crandall quote"}]}], "mc": [{"d": "easy", "q": "In network revenue management, the bid price of a flight is:", "o": ["The dual variable of its capacity constraint", "The lowest fare class currently open on the flight", "The dual variable of a market's demand constraint", "The average fare paid by passengers already booked"], "e": "Bid price = λᵢ, the shadow price of seat capacity on flight i. The demand-constraint duals μ are the forecast-dependent quantities the rule avoids.", "t": 3, "src": "L7 p.17"}, {"d": "easy", "q": "What makes network RM harder than managing each flight separately?", "o": ["Demand is by itinerary while capacity is by flight", "Fare classes cannot be nested on a single flight leg", "Capacity constraints become nonlinear in the number of seats", "Connecting passengers pay nothing for their second flight"], "e": "A BOS-ORD-SFO passenger consumes seats on two flights. Flight-by-flight control ignores that interaction.", "t": 1, "src": "L7 p.8"}, {"d": "easy", "q": "Why do airlines hold back seats from early low-fare sales?", "o": ["Late bookers pay more, so seats are protected for them", "Early-booking leisure travelers pay more, so seats are held for them", "Regulation requires a fixed share of seats in each fare class", "Unsold seats lower the operating cost of the flight"], "e": "Willingness to pay rises as departure approaches. Booking limits on low classes avoid selling out before the high-fare demand arrives.", "t": 0, "src": "L7 p.5"}, {"d": "easy", "q": "A network RM LP has 8 O-D itineraries, 2 fare classes and 4 flights. How many decision variables?", "o": ["16", "8", "32", "12"], "e": "One variable xⱼᵏ per itinerary and class: 8 × 2 = 16. The 4 flights add capacity constraints, not variables.", "t": 1, "src": "L7 p.8"}, {"d": "easy", "q": "Revenue gain of network RM over flight-based RM, per the lecture:", "o": ["About 1–2%", "About 10–15%", "About 0.1%", "About 25%"], "e": "Slide 25: gains around 1–2%. Delta's +1.6% fits. Small in percent, large in dollars at near-zero marginal cost.", "t": 5, "src": "L7 p.25"}, {"d": "easy", "q": "Revenue management, as opposed to pricing, increases revenue by:", "o": ["Opening and closing existing fare classes over time", "Setting each class's fare level and restrictions", "Choosing which aircraft type flies each route", "Assigning crews to flights"], "e": "Pricing defines the classes; RM is quantity control within them.", "t": 0, "src": "L7 p.4"}, {"d": "easy", "q": "Slide 6's single-leg table shows Y, B, M open and Q, V closed. This is implemented through:", "o": ["Booking limits on the lower fare classes", "Raising the Q and V fare levels", "Overbooking the higher fare classes", "Removing Q and V from the fare structure"], "e": "Leg-based RM sells a low fare only while it exceeds the expected loss from rejecting later high-fare requests; closing Q and V is quantity control (a booking limit), not a price change. Fare levels are set by pricing, not RM.", "t": 0, "src": "L7 p.6"}, {"d": "easy", "q": "Size of the Delta 2007 network RM model on the slides:", "o": ["About 200,000 variables and 200,000 constraints", "About 2,000 variables and 2,000 constraints", "About 20 million variables and 200 constraints", "About 200 variables and 200,000 constraints"], "e": "Thousands of flights, tens of thousands of itineraries and dozens of fare classes give roughly 200,000 of each. One variable per itinerary-class; one demand bound per itinerary-class plus one capacity row per flight.", "t": 2, "src": "L7 p.13"}, {"d": "easy", "q": "On slide 17 (BOS-ORD flight, bid price 160), the cost charged to a BOS-LAX booking is 200. That number is:", "o": ["The ORD-LAX bid price, the other flight's opportunity cost", "The BOS-ORD bid price, the flight's own seat cost", "The gap between the BOS-LAX Y and Q fares", "The demand dual μ of the BOS-LAX Q class"], "e": "Net value of a connecting booking = fare − bid price of the other flight (ORD-LAX, 200). It is then compared with the own-flight bid price 160. The Y–Q fare gap for BOS-LAX is 90.", "t": 4, "src": "L7 p.17"}, {"d": "easy", "q": "Per Crandall (American Airlines, 1992), yield management gave airlines a third alternative to:", "o": ["Match deep discounts on only part of the inventory", "Match every competitor discount on all seats", "Refuse to match discounts and cede market share", "Replace fare classes with a single fare level"], "e": "The two bad options were matching discounts everywhere (diluting all inventory) or not matching (losing share). RM matches on a portion and closes discount inventory when saving seats for later high-value demand pays.", "t": 5, "src": "L7 p.26"}, {"d": "medium", "q": "A network RM model has m = 50 flights, n = 300 itineraries and K = 6 fare classes. How many constraints, excluding x ≥ 0?", "o": ["1,850", "1,800", "350", "90,000"], "e": "m capacity rows + nK demand bounds = 50 + 300·6 = 1,850. Counting only demand bounds (1,800) forgets the flights.", "t": 1, "src": "L7 p.12"}, {"d": "medium", "q": "Bid prices: BOS-ORD 160, ORD-LAX 200. The BOS-LAX Q class has fare 400 and demand 65. Under bid-price control this class is:", "o": ["Open: 400 > 360 (sum of bid prices), so all 65 are accepted", "Closed: 400 is below the sum of the BOS-ORD and ORD-LAX Y fares (530)", "Open for only 40 requests, the fare minus the two bid prices", "Closed: BOS-ORD is full, so no new connecting traffic is accepted"], "e": "Fare 400 > 160 + 200, so μ > 0 and the demand bound binds: x = 65 (matches the LP optimum). Comparing against other fares is the wrong benchmark; the opportunity cost is the bid prices.", "t": 4, "src": "L7 p.16"}, {"d": "medium", "q": "From the BOS-ORD flight's view, what is the net value of a BOS-SFO Y booking (fare 420; ORD-SFO bid price 160)?", "o": ["260", "420", "100", "580"], "e": "Net value = fare − bid price of the other flight = 420 − 160 = 260, compared with BOS-ORD's own bid price 160. Subtracting both bid prices (100) double-counts your own flight.", "t": 4, "src": "L7 p.17"}, {"d": "medium", "q": "Small instance: the JFK-ORD bid price is 250. Assuming the basis does not change, one extra JFK-ORD seat changes optimal revenue by:", "o": ["+250", "+290, the JFK-ORD Y fare", "0, since all Y demand is already served", "+125, half the bid price"], "e": "A capacity dual is the marginal revenue of one seat. Re-solving with 201 seats gives exactly +250: the seat goes to a JFK-ORD Q passenger (fare 250).", "t": 3, "src": "L7 p.16"}, {"d": "medium", "q": "Dual constraint for connecting itinerary j (flights g(j), h(j)) and class k:", "o": ["λ_g(j) + λ_h(j) + μⱼᵏ ≥ pⱼᵏ", "λ_g(j) + λ_h(j) ≤ pⱼᵏ + μⱼᵏ", "max(λ_g(j), λ_h(j)) + μⱼᵏ ≥ pⱼᵏ", "λ_g(j) + μⱼᵏ ≥ pⱼᵏ and λ_h(j) + μⱼᵏ ≥ pⱼᵏ separately"], "e": "The variable xⱼᵏ appears in both capacity rows and its own demand bound, so the dual row sums both bid prices plus μⱼᵏ.", "t": 3, "src": "L7 p.18"}, {"d": "medium", "q": "Why does the bid-price rule rely on capacity duals λ rather than demand duals μ?", "o": ["μ depends on unreliable demand forecasts; λ does not", "μ is always zero at an optimal network RM solution", "λ can be computed without solving the network LP", "μ is undefined for direct (non-stop) itineraries"], "e": "Forecasts for many markets are tiny and noisy. λ gives each flight a threshold it can apply locally.", "t": 3, "src": "L7 p.19"}, {"d": "medium", "q": "Bookings arrive dynamically. In the bid-price architecture this is handled by:", "o": ["Periodic re-optimization feeding new bid prices to flight-level RM", "Solving the LP once per season and freezing all booking limits", "Closing every connecting itinerary once a flight is half full", "Using the demand duals μ as the accept thresholds"], "e": "Slide 25 loop: sales data → forecast → network optimization → bid prices → flight-level RM, with an update arrow back.", "t": 5, "src": "L7 p.25"}, {"d": "hard", "q": "In the small-instance optimum, JFK-ORD Q sells 19 of 24 requested seats. Which statement matches complementary slackness?", "o": ["Fare 250 = JFK-ORD bid price, so μ = 0 and partial service is allowed", "Fare 250 exceeds the JFK-ORD bid price, so μ > 0 and the bound binds", "Its demand bound is binding, so μ > 0 and all requests are met", "The JFK-ORD capacity row is slack, so its bid price is 0"], "e": "Bid price 250 = fare, so μ = 0 is consistent with x < D. The flight is full (200 seats), so its capacity row binds.", "t": 2, "src": "L7 p.10, p.16"}, {"d": "hard", "q": "Delta 2007: optimized daily revenue 65.37M vs 64.33M for the sequential benchmark, while non-stop revenue fell 2.13%. What explains the gain?", "o": ["More high-fare connecting sales that the sequential plan blocked", "Raising non-stop fares by 1.6% across the whole network", "Removing unprofitable flights from the daily schedule", "Overbooking non-stop flights to cover expected no-shows"], "e": "The benchmark serves non-stop demand first and leaves connecting demand the leftovers. The network LP trades some local sales for connecting revenue (+8.80%).", "t": 2, "src": "L7 p.13"}, {"d": "hard", "q": "BUF-ATL bid price 151; ATL-FLL bid price 254. A BUF-FLL request in class 9 pays 248. Under the correct bid-price approach, the BUF-ATL manager should:", "o": ["Reject: its net value 248 − 254 = −6 is below 151", "Accept: 248 exceeds the BUF-ATL bid price 151", "Accept: 248 exceeds the BUF-ATL class 9 fare of 151", "Accept: connecting fares always outrank local fares on a feeder flight"], "e": "Net value = fare − downstream bid price. Comparing the raw fare with your own bid price is the \"wrong approach\" of slide 22.", "t": 4, "src": "L7 p.23"}, {"d": "hard", "q": "An itinerary uses flights 1 and 2 with bid prices 120 and 95. Its classes have fares 260, 215 and 190, each with forecast demand 10. The bid-price solution typically sells:", "o": ["All at 260; 0–10 at 215 (fare = bid sum); none at 190", "All 30 seats, since every fare exceeds the 120 bid price", "Only the 260 class; the 215 class must be fully closed", "All 10 at 260 and all 10 at 215; none at 190"], "e": "Bid sum = 215. Fare > 215 ⇒ μ > 0 ⇒ accept all; fare < 215 ⇒ closed; fare = 215 ⇒ μ = 0 allows any x between 0 and D.", "t": 4, "src": "L7 p.19"}, {"d": "hard", "q": "A flight's capacity constraint is slack at the network RM optimum. Then:", "o": ["Its bid price is 0, so local demand on it is fully accepted", "Its bid price equals the lowest fare sold on that flight", "Its bid price is undefined because the row is not tight", "Its bid price is positive but below every fare on it"], "e": "CS: slack row ⇒ λ = 0. For a local itinerary, μ = p − 0 > 0, so x = D (slide 20 shows such flights, e.g., 132/140 seats).", "t": 3, "src": "L7 p.20"}, {"d": "hard", "q": "BUF-ATL bid price 151. Local BUF-ATL class 9 (fare 151, demand 9) sells only 2 seats. Why?", "o": ["Fare = bid price, so μ = 0 and it fills only leftover seats", "Its demand forecast for class 9 is only 2 seats", "Its fare is below the ATL-FLL bid price of 254", "Nesting caps every fare class at 2 seats on this flight"], "e": "At fare = bid price, CS allows partial service; this class is the marginal one, which is why its fare sets the flight's bid price.", "t": 4, "src": "L7 p.21"}, {"d": "hard", "q": "Small instance, bid prices BOS-ORD 160, JFK-ORD 250, ORD-SFO 160, ORD-LAX 200. Which Q class must be fully served (x = D)?", "o": ["ORD-LAX Q (fare 250 vs bid sum 200)", "JFK-SFO Q (fare 410 vs bid sum 410)", "BOS-SFO Q (fare 320 vs bid sum 320)", "JFK-LAX Q (fare 450 vs bid sum 450)"], "e": "Only a strictly positive margin forces μ > 0 and x = D. The three distractors sit at equality and are indeed partially served in the optimum.", "t": 2, "src": "L7 p.10, p.16"}, {"d": "hard", "q": "Small instance: four 200-seat flights with bid prices 160, 250, 160, 200, and Σ Dⱼᵏμⱼᵏ = 28,280 at the dual optimum. The optimal revenue is:", "o": ["182,280", "154,000", "28,280", "210,560"], "e": "Dual objective = Σ Cᵢλᵢ + Σ Dⱼᵏμⱼᵏ = 200·(160+250+160+200) + 28,280 = 154,000 + 28,280 = 182,280; strong duality makes it the primal optimum (LP re-solve confirms 182,280). 154,000 keeps only the capacity term.", "t": 3, "src": "L7 p.16, p.18"}, {"d": "hard", "q": "Small instance: ORD-LAX Q demand rises from 25 to 26 (fare 250; bid prices JFK-ORD 250, ORD-LAX 200). Optimal revenue changes by:", "o": ["+50: a JFK-LAX Q seat is displaced, refilled by JFK-ORD Q", "+250: the new passenger pays the ORD-LAX Q fare", "0: ORD-LAX is full, so the extra request is rejected", "+200: the extra seat is worth the ORD-LAX bid price"], "e": "μ = 250 − 200 = 50 is the marginal value of one more unit of that demand. Chain: +250 (ORD-LAX Q) − 450 (JFK-LAX Q, the marginal class at 450 = 250 + 200) + 250 (freed JFK-ORD seat goes to JFK-ORD Q, which has 5 unserved requests). Re-solve: +50.", "t": 2, "src": "L7 p.10, p.16"}, {"d": "hard", "q": "At the network RM optimum, a connecting class has 0 < xⱼᵏ < Dⱼᵏ. Complementary slackness implies:", "o": ["pⱼᵏ = λ_g(j) + λ_h(j) exactly, with μⱼᵏ = 0", "pⱼᵏ > λ_g(j) + λ_h(j), with μⱼᵏ > 0", "pⱼᵏ < λ_g(j) + λ_h(j), with μⱼᵏ = 0", "λ_g(j) = λ_h(j) = 0, with μⱼᵏ = pⱼᵏ"], "e": "x < D makes the demand row slack, so μ = 0; x > 0 makes the dual row tight: λ_g + λ_h + μ = p. Hence p equals the bid-price sum. μ > 0 would force x = D; p < sum would force x = 0.", "t": 4, "src": "L7 p.19, p.20"}], "or": [{"q": "Write the general network revenue management LP (sets, data, decision variables, objective, constraints). Then write its dual, distinguishing direct and connecting itineraries, and define the bid price of a flight.", "pts": 10, "t": 1, "rubric": ["Sets (flights i, itineraries j, Jᵢ, classes k), data (pⱼᵏ, Dⱼᵏ, Cᵢ) and variables xⱼᵏ defined — 2 pts", "Objective max Σⱼ Σₖ pⱼᵏ xⱼᵏ — 1 pts", "Capacity rows Σ_{j∈Jᵢ} Σₖ xⱼᵏ ≤ Cᵢ for every flight — 2 pts", "Demand bounds xⱼᵏ ≤ Dⱼᵏ and x ≥ 0 — 1 pts", "Dual objective min Σ Cᵢλᵢ + Σ Dⱼᵏμⱼᵏ with λ, μ ≥ 0 — 2 pts", "Dual rows λ_f(j) + μⱼᵏ ≥ pⱼᵏ (direct) and λ_g(j) + λ_h(j) + μⱼᵏ ≥ pⱼᵏ (connecting); bid price = λᵢ — 2 pts"], "model": "Sets: flights i = 1..m, itineraries j = 1..n, Jᵢ = itineraries using flight i, fare classes k = 1..K. Data: fare pⱼᵏ, demand Dⱼᵏ, capacity Cᵢ. Variables: xⱼᵏ ≥ 0 seats sold on itinerary j in class k. Primal: max Σⱼ Σₖ pⱼᵏ xⱼᵏ s.t. Σ_{j∈Jᵢ} Σₖ xⱼᵏ ≤ Cᵢ ∀i (dual λᵢ ≥ 0); xⱼᵏ ≤ Dⱼᵏ ∀j,k (dual μⱼᵏ ≥ 0); x ≥ 0. Dual: min Σᵢ Cᵢλᵢ + Σⱼ Σₖ Dⱼᵏμⱼᵏ s.t. for direct j ∈ J^D using flight f(j): λ_f(j) + μⱼᵏ ≥ pⱼᵏ; for connecting j ∈ J^C using g(j), h(j): λ_g(j) + λ_h(j) + μⱼᵏ ≥ pⱼᵏ; λ, μ ≥ 0. Each dual row comes from the column of xⱼᵏ, which has a 1 in every capacity row the itinerary uses and a 1 in its own demand row. The bid price of flight i is λᵢ, the shadow price of its capacity: the marginal revenue of one more seat (opportunity cost of the last seat sold), valid while the optimal basis does not change. Rewritten: μⱼᵏ + (sum of bid prices on j) ≥ pⱼᵏ.", "src": "L7 p.12, p.18"}, {"q": "You manage BUF-ATL (bid price 151). Bid prices: ATL-LAX 244, ATL-FLL 254. Decide accept/reject for each request and justify: (i) BUF-LAX class 7, fare 424; (ii) BUF-LAX class 8, fare 386; (iii) BUF-FLL class 4, fare 673; (iv) BUF-FLL class 8, fare 265; (v) BUF-ATL class 8, fare 169. Then explain why ranking requests by fare (the 'wrong approach') fails.", "pts": 10, "t": 4, "rubric": ["Uses net value = fare − bid price of the downstream flight, compared with 151 — 2 pts", "(i) 424 − 244 = 180 > 151 accept; (ii) 386 − 244 = 142 < 151 reject — 2 pts", "(iii) 673 − 254 = 419 accept; (iv) 265 − 254 = 11 reject — 2 pts", "(v) local fare 169 > 151 accept — 1 pts", "Wrong approach: high-fare connecting requests also consume a seat on ATL-LAX/ATL-FLL whose opportunity cost is ignored; e.g., 386 outranks 169 by fare but is worth less to the network — 3 pts"], "model": "Net value for a connecting booking = fare − bid price of the other flight; for a local booking it is the fare. Accept if net value exceeds the BUF-ATL bid price 151. (i) BUF-LAX cl.7: 424 − 244 = 180 > 151 → accept (LP sells 1 of 1). (ii) BUF-LAX cl.8: 386 − 244 = 142 < 151 → reject (LP sells 0 of 4). (iii) BUF-FLL cl.4: 673 − 254 = 419 > 151 → accept (1 of 1). (iv) BUF-FLL cl.8: 265 − 254 = 11 < 151 → reject (0 of 1). (v) BUF-ATL cl.8: 169 > 151 → accept (5 of 5). The decisions match the LP solution on slides 21–23. Ranking by raw fare treats a 386 BUF-LAX ticket as better than a 169 local ticket, but the connecting passenger also takes an ATL-LAX seat worth 244 at the margin, so the network gains only 142 from it versus 169 from the local passenger. Ranking by fare ignores the opportunity cost on the downstream flight and over-sells connecting traffic.", "src": "L7 p.21–23"}, {"q": "True or false? Justify each. (a) If a flight's capacity constraint is slack at the network RM optimum, every fare class on every itinerary using that flight is fully accepted. (b) In the small instance (BOS-ORD bid price 160), adding 30 seats to BOS-ORD raises optimal revenue by 30 × 160 = 4,800.", "pts": 10, "t": 3, "rubric": ["(a) False — 1 pts", "(a) Slack row ⇒ λ = 0, but a connecting itinerary also pays the other flight's bid price; class closed if fare < that bid price — 2 pts", "(a) Cites example: JAX-ATL (141/180, λ = 0) + ATL-PDX (λ = 450), fare 180, x = 0 — 2 pts", "(b) False — 1 pts", "(b) Dual is a local marginal value; basis changes as seats are added, so λ falls (160 for 5 seats, then 120, then 110) — 2 pts", "(b) Correct total gain 3,760 < 4,800, with explanation of the displacement chain ending — 2 pts"], "model": "(a) False. CS gives λᵢ = 0 for the slack flight, so local itineraries on it have μ = p > 0 and x = D. But a connecting itinerary needs p ≥ λ_g + λ_h; the other flight can be full with a high bid price. Slide 20: JAX-ATL has 141/180 seats (λ = 0) but ATL-PDX is full with λ = 450; the JAX-ATL-PDX class with fare 180 has 0 + 450 > 180, so μ = 0 and x = 0 even though D = 1. (b) False. A capacity dual is the derivative of optimal revenue only while the optimal basis stays the same. Re-solving the LP: the first 5 extra BOS-ORD seats are worth 160 each (each seat lets a BOS-SFO Q passenger in, displacing a JFK-SFO Q on ORD-SFO, whose freed JFK-ORD seat goes to JFK-ORD Q; 320 − 410 + 250 = 160). That chain ends when the 5 unserved JFK-ORD Q requests are filled; then the marginal value drops to 120 (seats 6–26) and 110 (27–30). Total gain for 30 seats = 5·160 + 21·120 + 4·110 = 3,760, not 4,800. Beyond 230 seats the BOS-ORD row becomes slack (total demand 230) and λ = 0.", "src": "L7 p.16, p.20"}, {"q": "Delta 2007: optimized daily revenue 65.37M (non-stop 41.35M, one-stop 24.02M) vs a sequential benchmark 64.33M (non-stop 42.25M, one-stop 22.08M). (a) Compute the absolute and percentage changes. (b) Describe the benchmark and explain why it is suboptimal. (c) Relate the result to the three goals of network RM.", "pts": 10, "t": 2, "rubric": ["(a) Total +1.04M (+1.6%); non-stop −0.90M (−2.13%); one-stop +1.94M (+8.80%) — 3 pts", "(b) Benchmark: non-stop RM first, then one-stop RM on leftover capacity — 2 pts", "(b) Suboptimal because it ignores that a connecting fare can exceed the sum of displaced local revenue; LP solves jointly — 2 pts", "(c) Goals: protect high-fare classes; enable high-fare connecting sales by avoiding sellouts; prioritize high-yield locals over low-yield connections — 2 pts", "Notes 1.6% is small in percent but ≈ $380M/yr at near-zero marginal cost — 1 pts"], "model": "(a) Total: 65.37 − 64.33 = +1.04M/day = +1.62%. Non-stop: 41.35 − 42.25 = −0.90M = −2.13%. One-stop: 24.02 − 22.08 = +1.94M = +8.80%. (b) The benchmark is sequential: run non-stop RM first, then one-stop RM with whatever capacity remains on each flight. It gives locals absolute priority, so a connecting passenger whose fare exceeds the bid prices (opportunity costs) of both legs can still be blocked by a lower-yield local. The network LP chooses all itinerary-class sales jointly, accepting each class whose fare exceeds the sum of its legs' bid prices, so it gives up some local revenue for more connecting revenue. (c) Network RM aims to (1) protect demand from high-fare classes, (2) enable sales to high-fare connecting passengers by avoiding sellouts, (3) prioritize high-yield local passengers over low-yield connecting passengers. Delta's result is goal 2 at work. The 1.6% gain (≈1.04M × 365 ≈ $380M/year) costs almost nothing to operate, consistent with the 1–2% gains cited for network over flight-based RM.", "src": "L7 p.13, p.25"}, {"q": "Small instance (all four flights 200 seats; bid prices BOS-ORD 160, JFK-ORD 250, ORD-SFO 160, ORD-LAX 200). (a) For each of the eight Q classes compute μ = max(0, fare − Σ bid prices) and predict whether it is fully served, closed, or the marginal (partially served) class. Q fares: BOS-ORD 200, BOS-SFO 320, BOS-LAX 400, JFK-ORD 250, JFK-SFO 410, JFK-LAX 450, ORD-SFO 200, ORD-LAX 250. (b) Given that the Y classes contribute Σ Dμ = 22,590, verify the optimal revenue by strong duality.", "pts": 10, "t": 3, "rubric": ["Correct bid-price sums for all 8 itineraries — 2 pts", "μ: BOS-ORD 40, BOS-LAX 40, ORD-SFO 40, ORD-LAX 50; others 0 — 2 pts", "Fully served: BOS-ORD, BOS-LAX, ORD-SFO, ORD-LAX; marginal: BOS-SFO, JFK-ORD, JFK-SFO, JFK-LAX; matches slide 10 sales — 2 pts", "Q contribution Σ Dμ = 25·40 + 65·40 + 21·40 + 25·50 = 5,690 — 2 pts", "Dual objective 200·770 + 5,690 + 22,590 = 182,280 = optimal revenue — 2 pts"], "model": "Bid-price sums: BOS-ORD 160; BOS-SFO 160+160 = 320; BOS-LAX 160+200 = 360; JFK-ORD 250; JFK-SFO 250+160 = 410; JFK-LAX 250+200 = 450; ORD-SFO 160; ORD-LAX 200. μ (Q): BOS-ORD 200−160 = 40; BOS-SFO 0; BOS-LAX 400−360 = 40; JFK-ORD 0; JFK-SFO 0; JFK-LAX 0; ORD-SFO 40; ORD-LAX 50. μ > 0 ⇒ demand row binds ⇒ x = D: BOS-ORD 25, BOS-LAX 65, ORD-SFO 21, ORD-LAX 25, as on slide 10. Fare = bid sum ⇒ μ = 0, marginal classes that absorb leftover capacity: BOS-SFO 25/55, JFK-ORD 19/24, JFK-SFO 44/65, JFK-LAX 36/40. No Q class has fare below its bid sum, so none is fully closed. (b) Dual objective = Σ Cᵢλᵢ + Σ Dμ = 200·(160+250+160+200) + (25·40 + 65·40 + 21·40 + 25·50) + 22,590 = 154,000 + 5,690 + 22,590 = 182,280. By strong duality this equals the optimal revenue (LP re-solve: 182,280).", "src": "L7 p.10, p.16, p.19"}]}, {"id": "l8", "title": "Network flow optimization", "deck": "Fall_2026_15_C57-L8.pdf", "brief": "Lecture 8 introduces the minimum-cost network flow problem: ship a commodity from supply to demand nodes at least cost subject to flow balance and arc capacities. Shortest path, assignment, transportation and maximum flow are special cases obtained by choosing b, c and u. Because the constraint matrix is a node-arc incidence matrix, basic feasible solutions are spanning-tree solutions, and the simplex method becomes the network simplex: compute potentials on the tree, price non-tree arcs with c̄ᵢⱼ = cᵢⱼ − (pᵢ − pⱼ), push flow around the cycle, and drop the arc that hits zero. The integrality theorem (integral b and u ⇒ integral optimal flow) is why network models solve combinatorial problems as LPs. Exam items: write incidence matrices and balance rows, run a pivot by hand, check optimality via reduced costs, and decide whether a model (leakage, utilization weights, joint capacity) is still a network.", "keyPoints": ["min Σ cᵢⱼxᵢⱼ s.t. Σout − Σin = bᵢ, 0 ≤ x ≤ u; column of (i,j): +1 at i, −1 at j", "Excess supply: Σout − Σin ≤ bᵢ; excess demand: ≥ bᵢ", "Max flow: virtual arc (t,s), cost −1, capacity ∞; max flow = min cut", "BFS ⇔ spanning-tree solution (n − 1 arcs); degenerate = zero-flow tree arc", "Potentials: pᵢ − pⱼ = cᵢⱼ on tree, p_root = 0; c̄ᵢⱼ = cᵢⱼ − (pᵢ − pⱼ)", "Pivot: θ* = min backward-arc flow; Δcost = θ*·c̄; θ* = 0 ⇒ degenerate pivot", "Optimal: primal-feasible tree with c̄ ≥ 0 on all non-tree arcs; Σcx = Σbp", "Integral b, u ⇒ integral optimal flow; non-±1 coefficients (leakage, weights) break it"], "topics": [{"name": "Min-cost flow model", "explain": "Directed graph, net supply bᵢ (>0 supply, 0 transshipment, <0 demand), unit costs cᵢⱼ, capacities uᵢⱼ. LP: min Σ cᵢⱼxᵢⱼ s.t. Σ_out xᵢⱼ − Σ_in xⱼᵢ = bᵢ, 0 ≤ x ≤ u. The node-arc incidence matrix A has +1 at the tail and −1 at the head of each arc's column. With Σbᵢ > 0 use ≤ bᵢ; with Σbᵢ < 0 use ≥ bᵢ.", "slides": [{"file": "Fall_2026_15_C57-L8.pdf", "page": 10, "label": "Min-cost flow formulation"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 13, "label": "Incidence matrix example"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 18, "label": "Generalized flow balance"}, {"file": "Recitation5.pdf", "page": 6, "label": "Incidence matrix definition"}]}, {"name": "Special cases", "explain": "Shortest path: b_s = 1, b_t = −1, others 0. Assignment: n supply-1 nodes, n demand-1 nodes, n² variables, 2n equality rows. Transportation: warehouses to stores. Max flow: add virtual arc (t,s) with cost −1 and infinite capacity, other costs 0, all bᵢ = 0; max flow = min s-t cut capacity.", "slides": [{"file": "Fall_2026_15_C57-L8.pdf", "page": 22, "label": "Shortest path formulation"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 25, "label": "Assignment formulation"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 28, "label": "Max flow via virtual arc"}, {"file": "Recitation5.pdf", "page": 11, "label": "Max flow as network flow"}, {"file": "Recitation5.pdf", "page": 14, "label": "Transportation problem"}]}, {"name": "Trees and BFS", "explain": "Tree: connected, acyclic, n − 1 arcs. A tree solution has zero flow on non-tree arcs; x is a BFS iff it is a tree solution. Tree columns can be permuted to a triangular matrix with ±1 diagonal (invertible). If positive-flow arcs contained a cycle, the circulation y (Ay = 0) gives x ± εy feasible, so x would not be basic. Degenerate tree solution = a tree arc carries zero flow.", "slides": [{"file": "Fall_2026_15_C57-L8.pdf", "page": 30, "label": "Tree definitions"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 32, "label": "BFS ⇔ tree solution"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 51, "label": "Triangular basis (appendix)"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 56, "label": "Cycle ⇒ circulation (appendix)"}]}, {"name": "Network simplex", "explain": "Entering non-tree arc creates a unique cycle; forward arcs gain θ, backward arcs lose θ; θ* = min flow on backward arcs (and residual capacity in capacitated problems). Cost change = θ*·c̄ᵢⱼ where c̄ᵢⱼ = Σ_F c − Σ_B c. θ* = 0 is a degenerate pivot. O(m) work per iteration vs O(mn) for the tableau; benchmark CPU 7.37 s vs 334.59 s (2.2%).", "slides": [{"file": "Fall_2026_15_C57-L8.pdf", "page": 33, "label": "Change of basis"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 34, "label": "Cycle, θ*, cost change"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 36, "label": "Iteration 1 (degenerate)"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 43, "label": "Summary and benchmark"}, {"file": "Recitation5.pdf", "page": 29, "label": "Recitation iteration 1"}]}, {"name": "Potentials & reduced costs", "explain": "Dual: max Σ bᵢpᵢ s.t. pᵢ − pⱼ ≤ cᵢⱼ (p free). Reduced cost c̄ᵢⱼ = cᵢⱼ − (pᵢ − pⱼ). Set c̄ = 0 on tree arcs and p_root = 0, then solve down the tree. Uncapacitated optimality: primal feasible tree with c̄ ≥ 0 on every non-tree arc (CS holds). At optimum Σ cᵢⱼxᵢⱼ = Σ bᵢpᵢ.", "slides": [{"file": "Fall_2026_15_C57-L8.pdf", "page": 35, "label": "Dual and reduced costs"}, {"file": "Recitation5.pdf", "page": 28, "label": "Computing potentials"}, {"file": "Recitation5.pdf", "page": 32, "label": "Optimality after two iterations"}]}, {"name": "Integrality & modeling", "explain": "Integral b and u ⇒ every BFS (and hence an optimal solution) is integral; costs do not matter for primal integrality but integral costs give integral potentials. Integrality breaks when columns are not ±1 incidence columns: leakage factors, utilization weights, joint capacity across commodities. Convex piecewise-linear arc costs stay network via parallel arcs.", "slides": [{"file": "Fall_2026_15_C57-L8.pdf", "page": 46, "label": "Integrality theorem"}, {"file": "Fall_2026_15_C57-L8.pdf", "page": 47, "label": "Non-network counterexample"}, {"file": "Recitation5.pdf", "page": 22, "label": "Tutor matching Model 2"}, {"file": "Recitation5.pdf", "page": 34, "label": "Integrality question"}, {"file": "practice-exam-2026-solutions.pdf", "page": 5, "label": "Leaky pipes T/F"}, {"file": "practice-exam-2026-solutions.pdf", "page": 23, "label": "Non-decreasing unit costs"}]}], "mc": [{"d": "easy", "q": "A node has bᵢ = −3 and receives 10 units in total. How much does it ship out?", "o": ["7", "13", "3", "10"], "e": "Out − in = bᵢ ⇒ out = 10 − 3 = 7. Getting 13 means treating bᵢ = −3 as a supply.", "t": 0, "src": "L8 p.9"}, {"d": "easy", "q": "The column of arc (2,5) in the node–arc incidence matrix has:", "o": ["+1 in row 2, −1 in row 5, zeros elsewhere", "−1 in row 2, +1 in row 5, zeros elsewhere", "+1 in rows 2 and 5", "+1 in row 2 and zeros elsewhere"], "e": "+1 at the tail (flow leaves node 2), −1 at the head, matching out − in = bᵢ.", "t": 0, "src": "L8 p.13"}, {"d": "easy", "q": "To write max flow from s to t as a min-cost flow, the virtual arc (t,s) gets:", "o": ["Cost −1 and infinite capacity", "Cost +1 and infinite capacity", "Cost 0 and capacity equal to the max flow", "Cost −1 and capacity 1"], "e": "Each unit returning t→s earns −1, so minimizing cost maximizes the circulation. A positive cost would make zero flow optimal.", "t": 1, "src": "L8 p.27"}, {"d": "easy", "q": "A spanning tree of a connected network with 9 nodes has how many arcs?", "o": ["8", "9", "10", "It depends on how many arcs the network has"], "e": "A tree on n nodes has n − 1 arcs, which is also the size of a basis (rank of A is n − 1).", "t": 2, "src": "L8 p.30"}, {"d": "easy", "q": "Which data must be integral to guarantee an integral optimal flow?", "o": ["Supplies/demands and arc capacities", "Arc costs only", "Costs, supplies and capacities together", "Only the supply at the source node"], "e": "Flows come from B⁻¹b with det B = ±1, so b and u matter; costs only select which tree is optimal.", "t": 5, "src": "L8 p.46"}, {"d": "easy", "q": "Slide benchmark (10,000 nodes, 25,000 arcs): network simplex CPU time relative to standard simplex is about:", "o": ["2%", "54%", "25%", "100%, the same"], "e": "7.37 s vs 334.59 s = 2.2%. The 54% figure is the ratio of iteration counts.", "t": 3, "src": "L8 p.43"}, {"d": "easy", "q": "To model a shortest s–t path as a min-cost flow, set:", "o": ["b_s = 1, b_t = −1, and bᵢ = 0 elsewhere", "b_s = −1, b_t = 1, and bᵢ = 0 elsewhere", "b_s = n − 1 and bᵢ = −1 at every other node", "bᵢ = 1 at every node on the chosen path"], "e": "One unit leaves s and arrives at t; intermediate nodes conserve flow. Out − in = bᵢ, so the source has +1. Reversing signs sends the unit from t to s. b_s = n − 1 gives a shortest-path tree to all nodes, a different problem.", "t": 1, "src": "L8 p.21"}, {"d": "easy", "q": "An assignment problem with 6 workers and 6 jobs (all pairs allowed) has:", "o": ["36 variables and 12 equality constraints", "12 variables and 36 equality constraints", "36 variables and 6 equality constraints", "6 variables and 12 equality constraints"], "e": "One xᵢⱼ per worker-job pair: 6² = 36. One row per worker (Σⱼ xᵢⱼ = 1) and one per job (Σᵢ xᵢⱼ = 1): 2·6 = 12.", "t": 1, "src": "L8 p.25"}, {"d": "easy", "q": "The dual of the uncapacitated min-cost flow min cᵀx s.t. Ax = b, x ≥ 0 is:", "o": ["max Σ bᵢpᵢ s.t. pᵢ − pⱼ ≤ cᵢⱼ, p free", "max Σ bᵢpᵢ s.t. pᵢ − pⱼ ≥ cᵢⱼ, p ≥ 0", "min Σ bᵢpᵢ s.t. pᵢ + pⱼ ≤ cᵢⱼ, p free", "max Σ cᵢⱼpᵢⱼ s.t. pᵢ − pⱼ ≤ bᵢ, p ≥ 0"], "e": "Column of xᵢⱼ has +1 in row i and −1 in row j, so pᵀAⱼ = pᵢ − pⱼ ≤ cᵢⱼ. Equality rows give free duals.", "t": 4, "src": "L8 p.35"}, {"d": "easy", "q": "Slide 26's system x + y = 1, x − y = 0 shows that:", "o": ["Integer data alone do not guarantee integral LP vertices", "Network matrices can have fractional basic solutions", "Every LP with integer data has an integral optimum", "Equality constraints always produce fractional solutions"], "e": "The unique solution is x = y = 0.5. The column of y has +1 and −1 but the column of x has +1 twice, so this is not an incidence matrix. Network integrality is a structural property, not a property of integer data.", "t": 5, "src": "L8 p.47"}, {"d": "medium", "q": "Total supply exceeds total demand. The correct balance constraint is:", "o": ["Σout − Σin ≤ bᵢ", "Σout − Σin ≥ bᵢ", "Σout − Σin = bᵢ, unchanged", "Σin − Σout ≤ bᵢ"], "e": "With excess supply, not all supply has to ship, so outflow minus inflow can fall short of bᵢ. Keeping equality makes the problem infeasible.", "t": 0, "src": "L8 p.16"}, {"d": "medium", "q": "Nodes A–E with b = (5, 2, 0, −4, −3). Tree arcs A→B (cost 1), B→C (1), C→D (2), D→E (1). With pᵢ − pⱼ = cᵢⱼ on tree arcs and p_E = 0, what is p_A?", "o": ["5", "−5", "4", "1"], "e": "p_D = 1, p_C = 3, p_B = 4, p_A = 5. The answer −5 comes from the opposite sign convention (πⱼ = πᵢ + cᵢⱼ).", "t": 4, "src": "L8 p.35"}, {"d": "medium", "q": "Same network: tree A→B, B→C, C→D, D→E gives p = (5, 4, 3, 1, 0). Non-tree arc C→E has cost 2. Its reduced cost is:", "o": ["−1", "1", "5", "−3"], "e": "c̄ = c − (p_C − p_E) = 2 − 3 = −1 < 0, so C→E should enter. The cycle view agrees: C→E (2) minus C→D→E (3).", "t": 4, "src": "L8 p.35"}, {"d": "medium", "q": "Arcs (capacity): s→a 4, s→b 3, a→b 1, a→t 2, b→t 5. Maximum s-t flow:", "o": ["6", "7", "5", "9"], "e": "Cut {s, a} | {b, t} contains s→b, a→b, a→t: 3 + 1 + 2 = 6, and 6 units can be routed. The source cut gives 7, which is not the minimum.", "t": 1, "src": "Rec5 p.10"}, {"d": "medium", "q": "The cycle created by an entering arc has backward arcs with flows 4 and 0. Then:", "o": ["θ* = 0: degenerate pivot; tree changes, flows and cost do not", "θ* = 4: the arc carrying 4 units leaves the tree", "The problem is unbounded along this cycle", "The arc cannot enter because its reduced cost is zero"], "e": "θ* = min over backward arcs = 0. Same as L8's iteration 1, where x₄₃ enters and x₄₅ (flow 0) leaves.", "t": 3, "src": "L8 p.36"}, {"d": "medium", "q": "A tree solution is primal feasible and every non-tree arc has c̄ ≥ 0 (uncapacitated). Then:", "o": ["Optimal, since CS holds: tree arcs c̄ = 0, non-tree x = 0", "Optimal only if the tree solution is nondegenerate", "Not yet: tree arcs must also have positive reduced cost", "Optimal only if the root node has potential p = 0"], "e": "Recitation 5, Q3(D). Tree arcs always have c̄ = 0 by construction, so statement B of that question is false.", "t": 4, "src": "Rec5 p.33"}, {"d": "medium", "q": "Water pipes lose a fraction of flow: node balances multiply inflow by (1 − ℓⱼᵢ). The model is:", "o": ["LP, not network flow: non-±1 coefficients break the structure", "Still a network flow, because all costs remain linear", "A network flow once capacities are scaled by (1 − ℓ)", "An integer program, because the losses are discrete"], "e": "Practice exam 1e (generalized flow). Each column must have exactly one +1 and one −1.", "t": 5, "src": "Practice exam 1e"}, {"d": "hard", "q": "Same network: tree flows A→B 5, B→C 7, C→D 7, D→E 3 (cost 29). Arc C→E (cost 2, c̄ = −1) enters. Result of the pivot:", "o": ["θ* = 3, D→E leaves, cost falls from 29 to 26", "θ* = 7, C→D leaves, cost falls from 29 to 22", "θ* = 3, C→D leaves, cost falls from 29 to 26", "θ* = 5, A→B leaves, cost falls from 29 to 24"], "e": "Cycle C→E forward, D→E and C→D backward; θ* = min(3, 7) = 3, so D→E leaves. Cost change θ*·c̄ = −3. HiGHS confirms 26 is optimal.", "t": 3, "src": "L8 p.34"}, {"d": "hard", "q": "Same pivot, but arc C→E now has capacity 2. What happens?", "o": ["θ* = 2: C→E flips to its upper bound; tree unchanged; cost 27", "θ* = 3: D→E leaves the tree as before; cost 26", "The pivot is degenerate (θ* = 0); cost stays 29", "C→E cannot enter because it is capacitated"], "e": "The entering arc's own room (2) is smaller than the backward limit (3), so it flips to its upper bound without a basis change. Re-solve gives 27.", "t": 3, "src": "L8 p.34"}, {"d": "hard", "q": "Same network (max flow 6). Raising which single capacity by 1 raises the max flow?", "o": ["s→b", "s→a", "b→t", "None, since all cuts have slack"], "e": "Only arcs in the unique minimum cut (s→b, a→b, a→t) help. Re-solving with u(s→b) = 4 gives 7; raising s→a or b→t leaves 6.", "t": 1, "src": "Rec5 p.10"}, {"d": "hard", "q": "Why can the positive-flow arcs of a basic feasible solution not contain a cycle?", "o": ["Its cycle is a circulation y (Ay = 0), so x is the midpoint of x ± εy", "Cycles always have negative cost, so x could not be optimal", "Flow balance forbids any positive flow around a cycle", "A cycle would need more than n − 1 nodes in the tree"], "e": "Dependent columns in a network are exactly cycles. Cycles can have any cost; that is a statement about optimality, not basicness.", "t": 2, "src": "L8 p.55"}, {"d": "hard", "q": "The lecture sets pᵢ − pⱼ = cᵢⱼ on tree arcs; a vault note sets πⱼ = πᵢ + cᵢⱼ and c̄ᵢⱼ = cᵢⱼ + πᵢ − πⱼ. How are they related?", "o": ["π = −p, and both give the same reduced costs", "π = p, but the reduced costs flip sign", "π = p + c, and reduced costs differ by cᵢⱼ", "They agree only when the root is a supply node"], "e": "Substitute π = −p: cᵢⱼ + πᵢ − πⱼ = cᵢⱼ − (pᵢ − pⱼ). Mixing one convention's potentials with the other's reduced-cost formula flips signs.", "t": 4, "src": "L8 p.35"}, {"d": "hard", "q": "Tutor matching values vᵢⱼ = αkᵢⱼ + (1 − α)dᵢⱼ are fractional; supplies and capacities are 0/1. Which must hold?", "o": ["An integral optimal flow exists; duals may be fractional", "Both primal and dual optima must be integral", "No integral optimum exists, because the values are fractional", "Duals are integral, but the optimal flow may be fractional"], "e": "Primal integrality depends on b and u only. Potentials are sums of costs along tree paths, so fractional costs give fractional duals.", "t": 5, "src": "Rec5 p.34"}, {"d": "hard", "q": "Recitation 5 final tree (arcs 12, 13, 14, 15) has p = (0, −4, −4, −3, −3). A new arc (3,4) with cost 2 is added. Its reduced cost:", "o": ["3, so it does not enter", "−1, so it enters", "1, so it does not enter", "−3, so it enters"], "e": "c̄₃₄ = 2 − (p₃ − p₄) = 2 − (−4 + 3) = 3 ≥ 0. Re-solving with the new arc keeps cost 14 and zero flow on it.", "t": 4, "src": "Rec5 p.32"}, {"d": "hard", "q": "Arc (i,j) costs cᵢⱼ per unit up to vᵢⱼ units and dᵢⱼ beyond (practice exam P3). Replacing it with two parallel arcs, (capacity vᵢⱼ, cost cᵢⱼ) and (capacity ∞, cost dᵢⱼ), is exact because:", "o": ["dᵢⱼ ≥ cᵢⱼ, so the cheap arc fills before the expensive one", "Network simplex always fills parallel arcs in index order", "The LP forces the expensive arc to zero at every vertex", "Integrality makes the cheap arc's flow either 0 or vᵢⱼ"], "e": "With non-decreasing unit costs the cost is convex, so a minimizer never uses the d-arc while the c-arc has room. If dᵢⱼ < cᵢⱼ (concave cost) the LP would use the d-arc first and undercharge; that case needs binaries.", "t": 5, "src": "Practice exam P3"}, {"d": "hard", "q": "HW2 P4 assigns 1,000 jobs to 20 machines (Σⱼ xᵢⱼ = 1). Version (b) caps job counts, Σᵢ xᵢⱼ ≤ capⱼ; version (e) caps utilization, Σᵢ uᵢⱼxᵢⱼ ≤ Uⱼ. Which is correct?", "o": ["(b) is a transportation problem with an integral optimum; (e) is not a network and may split jobs", "Both are transportation problems, so both have integral optimal vertices", "(e) is a network flow because all of its coefficients are nonnegative", "Neither is a network flow, because each job has a supply of exactly 1"], "e": "(b): jobs supply 1, machines absorb ≤ capⱼ, unit coefficients, so integral b, u give an integral BFS (41,416.5 energy). (e): weights uᵢⱼ ≠ 1 break the incidence structure, so vertices can be fractional (46,693.6; 885 jobs not fully on their cheapest machine).", "t": 5, "src": "HW2 P4"}, {"d": "hard", "q": "Σbᵢ > 0, so flow balance is written Σout − Σin ≤ bᵢ, with integral bᵢ and uᵢⱼ. Is an integral optimal flow still guaranteed?", "o": ["Yes: slacks act as arcs to a dummy sink of demand −Σbᵢ, a standard network", "No: inequality rows destroy the incidence-matrix structure", "Only if every supply node has bᵢ = 1", "Yes, but only when all arc costs are integral as well"], "e": "Slack sᵢ ≥ 0 turns row i into an equality; give sᵢ a −1 in a new dummy row with b = −Σbᵢ. Each slack column is then +1 at i, −1 at the dummy: an arc. Integral b, u ⇒ integral BFS; costs are irrelevant to primal integrality.", "t": 0, "src": "L8 p.16; Rec5 p.35"}], "or": [{"q": "Nodes A–E with b = (5, 2, 0, −4, −3). Arcs (cost): A→B (1), B→C (1), C→D (2), D→E (1), C→E (2), A→C (3), B→D (4); uncapacitated. Start from the tree A→B, B→C, C→D, D→E. (a) Compute the tree flows and cost. (b) Compute potentials with p_E = 0 and pᵢ − pⱼ = cᵢⱼ on tree arcs. (c) Compute all non-tree reduced costs. (d) Perform one pivot. (e) Show the new tree is optimal and verify strong duality.", "pts": 10, "t": 3, "rubric": ["(a) Flows A→B 5, B→C 7, C→D 7, D→E 3; cost 29 — 2 pts", "(b) p = (5, 4, 3, 1, 0) — 2 pts", "(c) c̄_AC = 1, c̄_BD = 1, c̄_CE = −1 — 2 pts", "(d) C→E enters; cycle backward arcs D→E (3), C→D (7); θ* = 3; D→E leaves; cost 26 — 2 pts", "(e) New p = (4, 3, 2, 0, 0); c̄_DE = 1, c̄_AC = 1, c̄_BD = 1 ≥ 0 ⇒ optimal; Σbᵢpᵢ = 26 — 2 pts"], "model": "(a) Leaf-to-root balance: A→B = 5; B→C = 5 + 2 = 7; C→D = 7; D→E = 7 − 4 = 3. Cost = 5·1 + 7·1 + 7·2 + 3·1 = 29. (b) p_E = 0; D→E: p_D = 1; C→D: p_C = 3; B→C: p_B = 4; A→B: p_A = 5. (c) c̄ = c − (pᵢ − pⱼ): A→C: 3 − (5 − 3) = 1; B→D: 4 − (4 − 1) = 1; C→E: 2 − (3 − 0) = −1. (d) C→E enters. Cycle: C→E forward; E←D and D←C traversed backward, so D→E and C→D are backward arcs. θ* = min(3, 7) = 3; D→E drops to 0 and leaves. New flows: A→B 5, B→C 7, C→D 4, C→E 3. Cost 29 + 3·(−1) = 26. (e) New tree A→B, B→C, C→D, C→E with p_E = 0: p_C = 2, p_D = 0, p_B = 3, p_A = 4. Non-tree: D→E: 1 − (0 − 0) = 1; A→C: 3 − (4 − 2) = 1; B→D: 4 − (3 − 0) = 1. All ≥ 0 and the tree is primal feasible, so it is optimal (CS: tree arcs c̄ = 0, non-tree x = 0). Dual objective Σbᵢpᵢ = 5·4 + 2·3 + 0·2 − 4·0 − 3·0 = 26 = primal cost. LP solver confirms 26.", "src": "L8 p.34–35"}, {"q": "Practice exam P3: each arc (i,j) of an uncapacitated network has unit cost cᵢⱼ for the first vᵢⱼ units and dᵢⱼ ≥ cᵢⱼ beyond, i.e., fᵢⱼ(x) = cᵢⱼx if x ≤ vᵢⱼ, cᵢⱼvᵢⱼ + dᵢⱼ(x − vᵢⱼ) otherwise. (a) Reformulate min Σ fᵢⱼ(xᵢⱼ) subject to flow balance as an LP. (b) Show it is a network flow problem and give the network. (c) Explain what goes wrong if dᵢⱼ < cᵢⱼ and whether integrality holds in (b).", "pts": 10, "t": 5, "rubric": ["(a) fᵢⱼ = max{cᵢⱼx, cᵢⱼvᵢⱼ + dᵢⱼ(x − vᵢⱼ)} (convex) — 1 pts", "(a) Epigraph LP: min Σ yᵢⱼ, yᵢⱼ ≥ both pieces, flow balance, x ≥ 0 — 3 pts", "(b) Two parallel arcs per (i,j): capacity vᵢⱼ cost cᵢⱼ; capacity ∞ cost dᵢⱼ; same b — 3 pts", "(c) d < c makes f concave; LP would fill the cheap d-arc first and undercharge; max-of-pieces reformulation also invalid; needs binaries — 2 pts", "(c) Integral b and v ⇒ integral optimal flow in (b) — 1 pts"], "model": "(a) Since dᵢⱼ ≥ cᵢⱼ, fᵢⱼ(x) = max{cᵢⱼx, cᵢⱼvᵢⱼ + dᵢⱼ(x − vᵢⱼ)}, a convex piecewise-linear function. LP: min Σ yᵢⱼ s.t. Σ_out xᵢⱼ − Σ_in xⱼᵢ = bᵢ ∀i; yᵢⱼ ≥ cᵢⱼxᵢⱼ; yᵢⱼ ≥ cᵢⱼvᵢⱼ + dᵢⱼ(xᵢ
