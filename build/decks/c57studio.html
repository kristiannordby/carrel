and distinctness (dⱼ = 1).", "slides": [{"file": "Fall_2026_15_C57-L3.pdf", "page": 6, "label": "Characterization of optimal solutions"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 12, "label": "Proving optimality in the example"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 28, "label": "Proof: c̄ ≥ 0 ⇒ optimal"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 29, "label": "Proof: nondegenerate optimum ⇒ c̄ ≥ 0"}]}, {"name": "Ratio test & pivot", "explain": "With entering column u = B⁻¹Aⱼ, basic variables move as x_B − θu. Only rows with uᵢ > 0 limit the step: θ* = min_{uᵢ>0} x_B(i)/uᵢ, and the minimizing row leaves. If u ≤ 0 and c̄ⱼ < 0, the cost is unbounded along d. The new BFS has yⱼ = θ*, y_B(i) = x_B(i) − θ*uᵢ, and the cost changes by θ*c̄ⱼ.", "slides": [{"file": "Fall_2026_15_C57-L3.pdf", "page": 7, "label": "Minimum ratio rule"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 10, "label": "Example: how far can we go?"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 14, "label": "One iteration"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 15, "label": "The simplex algorithm"}]}, {"name": "Tableau mechanics", "explain": "Tableau layout: cell 0 = −c_Bᵀx_B, row 0 = reduced costs, column 0 = x_B = B⁻¹b, body = B⁻¹A. Pivot: pick a column with c̄ⱼ < 0, run the ratio test over positive entries, scale the pivot row to 1, and eliminate the column from every other row, row 0 included. Read the basis from the unit columns with 0 in row 0; for a max converted to min, the top-left cell is the max objective value.", "slides": [{"file": "Fall_2026_15_C57-L3.pdf", "page": 21, "label": "The simplex tableau"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 22, "label": "Pivot operations"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 23, "label": "Complete example"}]}, {"name": "Degeneracy & termination", "explain": "If every BFS is nondegenerate, each pivot has θ* > 0 and strictly lowers cost, so no basis repeats and finitely many bases give termination. At a degenerate BFS, a pivot can have θ* = 0 (basis changes, point does not), which allows cycling unless an anti-cycling rule (Bland's smallest-index or lexicographic) is used. A degenerate point does not force a zero step: θ* = 0 only if a zero basic variable has a positive pivot entry. Variables can re-enter after leaving, and can leave right after entering.", "slides": [{"file": "Fall_2026_15_C57-L3.pdf", "page": 4, "label": "Degenerate BFS: θ > 0 may be infeasible"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 16, "label": "Convergence theorem"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 30, "label": "Pivoting rules and Bland's rule"}, {"file": "Recitation2.pdf", "page": 22, "label": "Simplex T/F exercises"}]}, {"name": "Bounded-variable simplex", "explain": "With bounds 0 ≤ x ≤ u, nonbasic variables sit at a lower or upper bound. Lower entry raises xⱼ: x_B′ = x_B − θq; upper entry lowers it: x_B′ = x_B + θq, with q = B⁻¹Aⱼ. θ* is the min of the entering variable's own travel uⱼ and, for each basic variable, the distance to whichever bound it moves toward. If uⱼ is strictly smallest, the variable flips bounds with no basis change. For a min, c̄ⱼ < 0 is improving at a lower bound and c̄ⱼ > 0 at an upper bound; the cost changes by θc̄ⱼ or −θc̄ⱼ respectively.", "slides": [{"file": "Fall_2026_15_C57-L3.pdf", "page": 7, "label": "Ratio rule from the bounds being approached"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 15, "label": "Algorithm steps to generalize (HW1 P3)"}]}, {"name": "Revised simplex & Phase 1", "explain": "Revised simplex follows the same pivots but updates B⁻¹ by elementary row operations (B̄⁻¹ = QB⁻¹) instead of inverting, costing O(m²) to O(mn) per iteration versus O(m³ + mn). An initial BFS is free when the constraints are Ax ≤ b with b ≥ 0 (x = 0, s = b). Otherwise solve Phase 1, min Σyᵢ s.t. Ax + y = b, x, y ≥ 0 (b ≥ 0): optimum 0 gives a feasible start for Phase 2, and a positive optimum proves infeasibility.", "slides": [{"file": "Fall_2026_15_C57-L3.pdf", "page": 18, "label": "Updating B⁻¹"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 20, "label": "Revised simplex method"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 24, "label": "Cost per iteration"}, {"file": "Fall_2026_15_C57-L3.pdf", "page": 30, "label": "Initial BFS and Phase 1"}]}], "mc": [{"d": "easy", "q": "The reduced cost of a basic variable is always:", "o": ["0", "Negative", "Equal to its cost cⱼ", "Equal to the shadow price of its row"], "e": "For j ∈ B, B⁻¹Aⱼ = eᵢ, so c̄ⱼ = cⱼ − c_Bᵀeᵢ = cⱼ − cⱼ = 0.", "t": 0, "src": "L3 p.5"}, {"d": "medium", "q": "min −3x₁ − 2x₂ s.t. x₁ + x₂ + s₁ = 4, 2x₁ + x₂ + s₂ = 6, all variables ≥ 0. Basis {s₁, x₁} gives x = (3, 0) and pᵀ = c_BᵀB⁻¹ = (0, −3/2). Reduced cost of x₂?", "o": ["−1/2", "1/2", "−2", "−7/2"], "e": "c̄₂ = c₂ − pᵀA₂ = −2 − (0·1 + (−3/2)·1) = −1/2 < 0, so x₂ can enter. 1/2 is a sign slip; −2 forgets the pᵀA₂ term.", "t": 0, "src": "L3 p.5"}, {"d": "medium", "q": "In a min-cost LP, a new activity has direct cost cⱼ = 10 and c_BᵀB⁻¹Aⱼ = 12. Interpretation?", "o": ["c̄ⱼ = −2: the savings elsewhere (12) exceed its cost (10), so xⱼ should enter", "c̄ⱼ = 2: it costs 2 more per unit than the current plan, so leave it out", "c̄ⱼ = 22: the total cost of adding one unit of xⱼ", "It cannot be judged without knowing B⁻¹b as well"], "e": "c̄ⱼ = cⱼ − c_BᵀB⁻¹Aⱼ = 10 − 12 = −2: cost minus savings elsewhere (Rec 2). Negative ⇒ candidate to enter.", "t": 0, "src": "Rec2 p.20"}, {"d": "easy", "q": "A BFS has all reduced costs ≥ 0. Then:", "o": ["It is optimal", "It is optimal only if nondegenerate", "It is the unique optimum", "Some basic variable must be zero"], "e": "c̄ ≥ 0 is a sufficient certificate at any BFS. Nondegeneracy is needed only for the converse; uniqueness would need c̄ > 0 on all nonbasics.", "t": 1, "src": "L3 p.6"}, {"d": "hard", "q": "max 3x₁ + 2x₂ s.t. x₁ + x₂ ≤ 4, 2x₁ + x₂ ≤ 8, x ≥ 0 (as a min with slacks). Basis {x₁, s₁} gives x = (4, 0) and c̄(x₂) = −1/2. What follows?", "o": ["Inconclusive: (4, 0) is degenerate, and it is in fact optimal (value 12)", "(4, 0) is not optimal, since a reduced cost in this basis is negative", "Pivoting x₂ in raises the objective by 1/2 per unit of x₂", "The LP is unbounded, since x₂ can grow without limit"], "e": "(4, 0) has s₁ = s₂ = x₂ = 0 (degenerate). x₂ enters with u = (1/2, 1/2); row s₁ has value 0 and positive entry, so θ* = 0. The basis {x₁, x₂} then shows c̄ ≥ 0. A negative c̄ disproves optimality only at a nondegenerate BFS.", "t": 1, "src": "L3 p.6; HW1 P1"}, {"d": "medium", "q": "At a nondegenerate optimal BFS, nonbasic x₅ has c̄₅ = 0. Which is true?", "o": ["Another optimal solution exists along x₅'s direction", "The optimal solution is unique, since c̄ ≥ 0", "The BFS must be degenerate, since c̄₅ = 0", "The dual problem is infeasible at this basis"], "e": "Nondegeneracy allows θ > 0; the cost change is θc̄₅ = 0; d₅ = 1 makes the point distinct. Hence an alternative optimum (dual degeneracy).", "t": 1, "src": "HW1 P1e"}, {"d": "easy", "q": "x_B = (10, 7, 4) and the entering column is u = (2, 1, 1). Which row leaves?", "o": ["Row 3 (ratio 4)", "Row 1 (ratio 5)", "Row 2 (ratio 7)", "Row 1 (largest entry 2)"], "e": "Ratios x_B(i)/uᵢ over uᵢ > 0: 10/2 = 5, 7/1 = 7, 4/1 = 4. The minimum, 4, is in row 3. The largest pivot entry is irrelevant.", "t": 2, "src": "L3 p.15"}, {"d": "medium", "q": "x_B = (2, 3, 4) and the entering column is u = (−2, 1, 1). Step θ* and leaving row?", "o": ["θ* = 3, row 2 leaves", "θ* = 1, row 1 leaves", "θ* = −1, row 1 leaves", "θ* = 4, row 3 leaves"], "e": "Row 1 has u₁ < 0: that basic variable grows, so it gives no ratio. Ratios 3/1 and 4/1: θ* = 3 in row 2. Using |−2| for row 1 is the common mistake.", "t": 2, "src": "L3 p.15"}, {"d": "easy", "q": "The entering column satisfies u = B⁻¹Aⱼ ≤ 0 and c̄ⱼ < 0. Conclusion?", "o": ["Unbounded: cost → −∞ along the basic direction", "The current BFS is optimal for the LP", "The LP is infeasible, by Farkas' lemma", "The row with the most negative uᵢ leaves"], "e": "No basic variable decreases as xⱼ grows, so x + θd is feasible for every θ ≥ 0 and the cost changes by θc̄ⱼ < 0.", "t": 2, "src": "L3 pp.15–16"}, {"d": "easy", "q": "A min-form tableau for max 4x₁ + 3x₂ has row 0 equal to 16 | 0 −3 0 0 4. The current value of 4x₁ + 3x₂ is:", "o": ["16", "−16", "4", "3"], "e": "The top-left cell is −c_Bᵀx_B. The min cost is −16, so the max objective 4x₁ + 3x₂ equals 16. The −3 shows x₂ can still improve it.", "t": 3, "src": "L3 p.21"}, {"d": "hard", "q": "Final tableau (columns x₁ x₂ s₁ s₂ s₃), row 0: 24 | 0 0 1 2 0; rows: 4 | 0 1 −1 2 0; 1 | 0 0 −1 1 1; 3 | 1 0 1 −1 0. Row labels are missing. Basis and solution?", "o": ["Rows (x₂, s₃, x₁); x = (3, 4), s₃ = 1", "Rows (x₁, x₂, s₃); x = (4, 1), s₃ = 3", "Rows (x₂, s₂, x₁); x = (3, 4), s₂ = 1", "Rows (s₁, s₂, s₃); x = (0, 0)"], "e": "Unit columns: x₂ = e₁, s₃ = e₂, x₁ = e₃ (each with 0 in row 0). Values from the RHS: x₂ = 4, s₃ = 1, x₁ = 3. s₂'s column (2, 1, −1) is not a unit vector.", "t": 3, "src": "L3 p.21"}, {"d": "medium", "q": "Same final tableau: row 0 under (s₁, s₂, s₃) reads (1, 2, 0). The dual vector p of the min-form LP is:", "o": ["(−1, −2, 0)", "(1, 2, 0)", "(24, 0, 0)", "(0, 0, 1)"], "e": "Slack sᵢ has cost 0 and column eᵢ, so c̄(sᵢ) = −pᵢ. In max terms the shadow prices are 1 and 2; resource 3 has slack 1, hence price 0.", "t": 3, "src": "L3 p.21"}, {"d": "hard", "q": "Tableau (columns x₁ x₂ s₁ s₂ s₃), row 0: 16 | 0 −3 0 0 4; rows s₁: 2 | 0 1 1 0 −2; s₂: 3 | 0 1 0 1 −1; x₁: 4 | 1 0 0 0 1. x₂ enters. After the pivot, the row-0 entry under s₃ is:", "o": ["−2", "4", "10", "−6"], "e": "Ratios 2/1 and 3/1, so s₁ leaves. Row 0 ← row 0 + 3 × (s₁ row): 4 + 3(−2) = −2 (and the cost goes 16 → 22). s₃ left the basis one pivot earlier and now has a negative reduced cost, so it re-enters.", "t": 3, "src": "L3 p.22"}, {"d": "medium", "q": "At a degenerate BFS, x_B = (0, 5) and the entering column is u = (−1, 2). The step is:", "o": ["θ* = 5/2, since row 1 (u₁ < 0) does not block", "θ* = 0, since a degenerate BFS always stalls", "θ* = 0, from the ratio 0/(−1) in row 1", "Unbounded, since one entry of u is negative"], "e": "Only rows with uᵢ > 0 enter the ratio test. The zero basic variable grows as θ rises; the step is 5/2 and the cost strictly improves. Degenerate point ≠ zero-length pivot.", "t": 4, "src": "HW1 Practice 05"}, {"d": "hard", "q": "A variable that leaves the basis at some simplex iteration:", "o": ["Can re-enter at a later iteration", "Can never re-enter under Bland's rule", "Can never re-enter if every BFS is nondegenerate", "Can re-enter only after a degenerate pivot"], "e": "Only the objective is monotone. In max 4x₁ + 3x₂ s.t. 2x₁ + x₂ ≤ 10, x₁ + x₂ ≤ 7, x₁ ≤ 4, slack s₃ leaves at pivot 1 and re-enters at pivot 3, all nondegenerate. If variables never re-entered, simplex would need at most n pivots, contradicting its exponential worst case.", "t": 4, "src": "Practice exam 1c; Rec2 p.22"}, {"d": "hard", "q": "Bounded simplex: basic x_B = (1, 6) with bounds [0, 5] and [0, 10]. Nonbasic xⱼ is at its lower bound 0, upper bound 4, c̄ⱼ = −2, q = B⁻¹Aⱼ = (−1, 2). Step and outcome?", "o": ["θ* = 3; x₂ leaves at its lower bound 0; cost falls by 6", "θ* = 4; x₁ leaves at its upper bound 5; cost falls by 8", "θ* = 4; bound flip with the basis unchanged", "θ* = 1; x₁ leaves at 0; cost falls by 2"], "e": "Lower entry: x_B(θ) = x_B − θq = (1 + θ, 6 − 2θ). Limits: x₁ ≤ 5 ⇒ θ ≤ 4; x₂ ≥ 0 ⇒ θ ≤ 3; own travel 4. θ* = 3, new x_B part (4, 0) with xⱼ = 3 basic; Δcost = θc̄ⱼ = −6. The last option uses the upper-entry sign x_B + θq.", "t": 5, "src": "HW1 P3"}, {"d": "hard", "q": "Same data, but xⱼ's upper bound is 2 instead of 4. Outcome?", "o": ["Bound flip to xⱼ = 2; basis unchanged; x_B = (3, 2)", "x₂ leaves at its lower bound 0 after θ* = 3", "x₁ leaves at its upper bound 5 after θ* = 2", "Degenerate pivot with θ* = 0; only the basis changes"], "e": "Own travel 2 is strictly below the basic limits 4 and 3, so xⱼ switches bounds and no basic variable leaves: x_B = (1 + 2, 6 − 4) = (3, 2), cost falls by 4.", "t": 5, "src": "HW1 P3"}, {"d": "medium", "q": "Min problem, bounded simplex: nonbasic xⱼ sits at its upper bound with c̄ⱼ = +3. Which move is eligible, and what is the cost change for a step θ?", "o": ["Decrease xⱼ; cost changes by −3θ", "Increase xⱼ; cost changes by +3θ", "Decrease xⱼ; cost changes by +3θ", "Not eligible: only negative reduced costs improve"], "e": "Moving xⱼ down by θ changes cost by −θc̄ⱼ = −3θ < 0. At an upper bound the improving sign is reversed: c̄ⱼ > 0 is the eligible case.", "t": 5, "src": "HW1 P3"}, {"d": "easy", "q": "Phase 1, min Σyᵢ s.t. Ax + y = b, x, y ≥ 0, ends with optimal value 3. Conclusion?", "o": ["The original LP is infeasible", "The original LP is unbounded", "Phase 1's x is a feasible start for Phase 2", "The original optimal cost equals 3"], "e": "Ax = b, x ≥ 0 is feasible iff some point has y = 0, i.e. iff the Phase 1 optimum is 0. A positive optimum proves infeasibility.", "t": 6, "src": "L3 p.30"}, {"d": "easy", "q": "Nonbasic xⱼ enters from a BFS with basis B. The basic direction d satisfies:", "o": ["dⱼ = 1, other nonbasic dᵢ = 0, d_B = −B⁻¹Aⱼ, so Ad = 0", "dⱼ = 1, other nonbasic dᵢ = 0, d_B = B⁻¹Aⱼ, so Ad = 2Aⱼ", "d_B = −B⁻¹b, so the basic variables drop to zero", "dⱼ = c̄ⱼ, so the step length equals the reduced cost"], "e": "Feasibility needs A(x + θd) = b, i.e. Ad = Bd_B + Aⱼ = 0 (L3 p.4). The basic variables move by −θu with u = B⁻¹Aⱼ. The reduced cost is the rate cᵀd, not a component of d.", "t": 0, "src": "L3 p.4"}, {"d": "easy", "q": "In the simplex tableau, column 0 (below the top-left cell) contains:", "o": ["x_B = B⁻¹b, the current basic values", "The reduced costs c̄ⱼ", "−c_Bᵀx_B, the negated current cost", "B⁻¹Aⱼ for the entering column"], "e": "L3 p.21: column 0 holds B⁻¹b, row 0 the reduced costs, cell 0 the value −c_Bᵀx_B, and columns 1..n hold B⁻¹A₁ … B⁻¹Aₙ.", "t": 3, "src": "L3 p.21"}, {"d": "easy", "q": "For which feasible set does simplex get a starting BFS without Phase 1?", "o": ["Ax ≤ b, x ≥ 0 with b ≥ 0: start at x = 0, s = b", "Ax ≥ b, x ≥ 0 with b ≥ 0: start at x = 0, s = b", "Ax = b, x ≥ 0 with b ≥ 0: start at x = 0", "Ax ≤ b, x ≥ 0 with b ≤ 0: start at x = 0, s = b"], "e": "L3 p.30: slacks of ≤ rows give an identity basis, and b ≥ 0 makes s = b feasible. For ≥ rows, s = −b ≤ 0 (surplus negative); Ax = b with x = 0 needs b = 0; with b ≤ 0, s = b is negative.", "t": 6, "src": "L3 p.30"}, {"d": "easy", "q": "Compared with the naive implementation, the revised simplex method:", "o": ["Updates B⁻¹ by elementary row operations instead of re-inverting B; the pivots are the same", "Uses a different entering rule that visits fewer vertices", "Avoids degenerate pivots, so it cannot cycle", "Stores the full B⁻¹A, which makes each iteration O(m³)"], "e": "L3 pp.20, 24: B̄⁻¹ = QB⁻¹, so per-iteration work falls from O(m³ + mn) to between O(m²) and O(mn), with the same progress and convergence. The full tableau is what stores B⁻¹A (O(mn)).", "t": 6, "src": "L3 pp.20, 24"}, {"d": "hard", "q": "L3 tableau example: min −10x₁ − 12x₂ − 12x₃ with three ≤ 20 rows, slack basis (x₄, x₅, x₆). x₁ enters with column (1, 2, 2), so rows x₅ and x₆ tie at ratio 10. After x₅ leaves:", "o": ["x₆ stays basic at 0, so the new BFS is degenerate; the cost fell from 0 to −100", "Both x₅ and x₆ leave, so the basis temporarily has two entering variables", "The step is θ* = 0 because of the tie, so the cost stays 0", "The tie shows the LP has multiple optimal solutions"], "e": "θ* = 10 > 0 and c̄₁ = −10, so the cost drops by 100 (top-left cell 0 → 100). Both tied rows hit zero, but only one leaves; x₆ remains basic at 0. A tied positive ratio creates a degenerate destination after a strictly improving step.", "t": 4, "src": "L3 p.23; HW1 Practice 05"}, {"d": "hard", "q": "Same example, later tableau. Row 0: 120 | 0 −4 0 2 4 0; rows x₃: 10 | 0 1.5 1 1 −0.5 0; x₁: 0 | 1 −1 0 −1 1 0; x₆: 10 | 0 2.5 0 1 −1.5 1. x₂ enters. What happens?", "o": ["x₆ leaves with θ* = 4; x₁ rises from 0 to 4; cost goes to −136", "θ* = 0 because basic x₁ = 0, so only the basis changes", "x₃ leaves with θ* = 20/3, the first ratio", "x₁ leaves with ratio 0/(−1) = 0"], "e": "Row x₁ has u = −1 < 0, so it does not block (x₁ grows: 0 + 4·1 = 4). Ratios: 10/1.5 = 20/3 and 10/2.5 = 4, so θ* = 4, x₆ leaves; cost change θc̄₂ = 4(−4) = −16, top-left 136. The degenerate point does not produce a zero step.", "t": 3, "src": "L3 p.23"}, {"d": "hard", "q": "Bounded simplex (min). Nonbasic xⱼ is at its upper bound 5 with c̄ⱼ = +2, q = B⁻¹Aⱼ = (2, −1). Basic x_B = (4, 2), bounds [0, 10] and [0, 6]. Step and outcome?", "o": ["θ* = 2; basic 2 leaves at 0; xⱼ = 3; cost falls by 4", "θ* = 3; basic 1 leaves at its upper bound 10; cost falls by 6", "θ* = 5; xⱼ flips to 0 with the basis unchanged; cost falls by 10", "θ* = 2; basic 1 leaves at 0 (using x_B − θq); cost falls by 4"], "e": "Upper entry decreases xⱼ, so x_B′ = x_B + θq = (4 + 2θ, 2 − θ). Limits: basic 1 to 10 ⇒ θ ≤ 3; basic 2 to 0 ⇒ θ ≤ 2; own travel 5. θ* = 2, x_B′ = (8, 0), xⱼ = 5 − 2 = 3, Δcost = −θc̄ⱼ = −4. The last option uses the lower-entry sign.", "t": 5, "src": "HW1 P3; Practice 06"}, {"d": "hard", "q": "max 2x₁ + 3x₂ s.t. x₁ + x₂ ≤ 1, x ≥ 0, solved as a min from the origin, entering variable chosen by smallest index among negative reduced costs. Which is true?", "o": ["x₁ enters at pivot 1 and leaves at pivot 2: a variable can leave right after entering", "x₂ enters first because −3 is the most negative reduced cost", "The run cycles, since the smallest-index rule ignores the most negative c̄", "x₁ cannot leave at pivot 2 because the pivot at pivot 1 was nondegenerate"], "e": "Pivot 1: c̄ = (−2, −3), smallest index x₁ enters, s leaves: x = (1, 0), cost −2. Pivot 2: p = −2, c̄₂ = −3 − (−2)(1) = −1 < 0; x₂ enters, and the only row (x₁'s) leaves: x = (0, 1), cost −3, optimal. This answers Rec 2 T/F 3 (False). Bland's rule never cycles.", "t": 4, "src": "Rec2 p.22"}], "or": [{"q": "L3 optimality theorem. Let x be a BFS of min cᵀx s.t. Ax = b, x ≥ 0 with basis B and reduced costs c̄. (a) Prove: if c̄ ≥ 0 then x is optimal. (b) State the converse and the extra hypothesis it needs, and explain with an example why that hypothesis is necessary.", "pts": 10, "t": 1, "rubric": ["(a) Takes arbitrary feasible y, d = y − x, uses Ad = 0 to get d_B = −Σ_{j∈N} B⁻¹Aⱼdⱼ — 2 pts", "(a) Uses d_N ≥ 0 (x_N = 0, y ≥ 0) and shows cᵀd = Σ_{j∈N} c̄ⱼdⱼ ≥ 0 — 3 pts", "(b) Converse: if x is optimal AND nondegenerate then c̄ ≥ 0 — 2 pts", "(b) Degenerate example where an optimal BFS has some c̄ⱼ < 0 in its basis (e.g. corner (4,0) of max 3x₁ + 2x₂, x₁ + x₂ ≤ 4, 2x₁ + x₂ ≤ 8 with basis {x₁, s₁}) — 3 pts"], "model": "(a) Let y be any feasible point and d = y − x. Since Ay = Ax = b, Ad = 0, i.e. Bd_B + Σ_{j∈N} Aⱼdⱼ = 0, so d_B = −Σ_{j∈N} B⁻¹Aⱼdⱼ. Since x_N = 0 and y ≥ 0, d_N = y_N ≥ 0. Then cᵀy − cᵀx = cᵀd = c_Bᵀd_B + Σ_{j∈N} cⱼdⱼ = Σ_{j∈N} (cⱼ − c_BᵀB⁻¹Aⱼ)dⱼ = Σ_{j∈N} c̄ⱼdⱼ ≥ 0. So x is optimal. (b) Converse: if x is optimal and nondegenerate, then c̄ ≥ 0. Proof sketch: if c̄ⱼ < 0, move along the basic direction; x_B > 0 allows a small θ > 0 with x + θd feasible, and the cost changes by θc̄ⱼ < 0, contradicting optimality. Without nondegeneracy this fails: for max 3x₁ + 2x₂ s.t. x₁ + x₂ ≤ 4, 2x₁ + x₂ ≤ 8, x ≥ 0 (min −3x₁ − 2x₂ with slacks), the optimal corner (4, 0) is degenerate (x₂ = s₁ = s₂ = 0). In basis {x₁, s₁}, c̄(x₂) = −1/2 < 0, but the ratio test gives θ* = 0 (s₁ = 0 with positive entry), so no improvement is possible; basis {x₁, x₂} then shows c̄ ≥ 0.", "src": "L3 pp.6, 28–29"}, {"q": "Solve max 4x₁ + 3x₂ s.t. 2x₁ + x₂ ≤ 10, x₁ + x₂ ≤ 7, x₁ ≤ 4, x ≥ 0 with the tableau simplex (min form, slacks s₁, s₂, s₃, Dantzig's most-negative rule). Report the entering and leaving variable and the objective value at each pivot, the final solution, and the dual vector p of the min-form LP. What does this run show about variables leaving and re-entering?", "pts": 12, "t": 3, "rubric": ["Pivot 1: x₁ enters (c̄ = −4), ratios 5, 7, 4 ⇒ s₃ leaves; value 16 — 3 pts", "Pivot 2: x₂ enters (c̄ = −3), ratios 2, 3 ⇒ s₁ leaves; value 22 — 3 pts", "Pivot 3: s₃ enters (c̄ = −2), ratios over positive entries (s₂ row 1, x₁ row 4) ⇒ s₂ leaves; value 24, all c̄ ≥ 0 — 3 pts", "Final x = (3, 4), s₃ = 1, p = (−1, −2, 0) (shadow prices 1, 2, 0 in max terms), and notes s₃ left at pivot 1 and re-entered at pivot 3 — 3 pts"], "model": "min −4x₁ − 3x₂; initial basis (s₁, s₂, s₃) = (10, 7, 4), row 0: 0 | −4 −3 0 0 0. Pivot 1: x₁ enters (most negative −4); column (2, 1, 1), ratios 10/2 = 5, 7/1 = 7, 4/1 = 4 ⇒ s₃ leaves. New basis (s₁, s₂, x₁) = (2, 3, 4), row 0: 16 | 0 −3 0 0 4, objective 16. Pivot 2: x₂ enters (−3); column (1, 1, 0), ratios 2, 3 ⇒ s₁ leaves. Basis (x₂, s₂, x₁) = (2, 1, 4), row 0: 22 | 0 0 3 0 −2, objective 22. Pivot 3: s₃ enters (−2); column (−2, 1, 1), x₂'s row has a negative entry and does not block; ratios 1/1 = 1 (s₂), 4/1 = 4 (x₁) ⇒ s₂ leaves. Basis (x₂, s₃, x₁) = (4, 1, 3), row 0: 24 | 0 0 1 2 0, all reduced costs ≥ 0 ⇒ optimal: x = (3, 4), value 24, s₃ = 1. Since c̄(sᵢ) = 0 − pᵢ, p = (−1, −2, 0); in max terms labor and material are worth 1 and 2 per unit, and the slack x₁ ≤ 4 row is worth 0. Every pivot was nondegenerate, yet s₃ left at pivot 1 and re-entered at pivot 3: only the objective is monotone, so a leaving variable can return (practice exam 1c is False).", "src": "L3 pp.21–23; Practice exam 1c"}, {"q": "Bounded-variable simplex (HW1 3). Consider min cᵀx s.t. Ax = b, 0 ≤ x ≤ u, with nonbasic variables at a bound and q = B⁻¹Aⱼ for the entering variable xⱼ. (a) Derive how x_B changes when xⱼ enters from its lower bound and from its upper bound, and give the step-length formula in each case. (b) Apply it: xⱼ at lower bound 0 with uⱼ = 2, c̄ⱼ = −1, q = (1, −2), x_B = (3, 5), bounds [0, 8] and [0, 10]. (c) Redo (b) with uⱼ = 4.", "pts": 10, "t": 5, "rubric": ["(a) From BΔx_B + AⱼΔxⱼ = 0: lower entry x_B′ = x_B − θq, upper entry x_B′ = x_B + θq — 2 pts", "(a) Correct θ* formulas with the right sign index sets and the uⱼ travel term — 3 pts", "(b) θ* = 2 = uⱼ strictly first ⇒ bound flip, basis unchanged, x_B = (1, 9), cost −2 — 3 pts", "(c) θ* = 2.5 from basic 2 hitting its upper bound 10; it leaves at its upper bound; basic 1 = 0.5, xⱼ = 2.5 basic, cost −2.5 — 2 pts"], "model": "(a) Holding other nonbasics fixed, A(x′ − x) = 0 gives BΔx_B + AⱼΔxⱼ = 0, so Δx_B = −qΔxⱼ. Lower entry (xⱼ increases by θ): x_B′ = x_B − θq; basic i decreases if qᵢ > 0 (toward 0) and increases if qᵢ < 0 (toward u_Bᵢ). θ* = min{uⱼ, min_{qᵢ>0} x_Bᵢ/qᵢ, min_{qᵢ<0} (u_Bᵢ − x_Bᵢ)/(−qᵢ)}. Upper entry (xⱼ decreases by θ): x_B′ = x_B + θq; θ* = min{uⱼ, min_{qᵢ<0} x_Bᵢ/(−qᵢ), min_{qᵢ>0} (u_Bᵢ − x_Bᵢ)/qᵢ}. Empty minima are +∞; cost change is θc̄ⱼ (lower) or −θc̄ⱼ (upper). If uⱼ is strictly smallest, xⱼ switches bounds and B is unchanged; otherwise the blocking basic variable leaves at the bound it hit. (b) x_B(θ) = (3 − θ, 5 + 2θ). Limits: basic 1 to 0 ⇒ θ ≤ 3; basic 2 to 10 ⇒ θ ≤ 2.5; own travel 2. θ* = 2 is strictly first: bound flip, xⱼ = 2 at its upper bound, basis unchanged, x_B = (1, 9), Δcost = 2(−1) = −2. (c) Now own travel is 4, so θ* = 2.5 from basic 2: it leaves the basis at its upper bound 10, xⱼ = 2.5 becomes basic, basic 1 = 3 − 2.5 = 0.5, Δcost = 2.5(−1) = −2.5.", "src": "HW1 P3; Practice 06"}, {"q": "(a) Prove that if P ≠ ∅ and every BFS is nondegenerate, simplex terminates in finitely many iterations, either with an optimal basis or with a direction of unboundedness. Identify exactly where nondegeneracy is used. (b) Explain what can go wrong at a degenerate BFS and how pivoting rules address it.", "pts": 10, "t": 4, "rubric": ["Identifies the two stopping conditions (c̄ ≥ 0 ⇒ optimal; u ≤ 0 ⇒ unbounded with d ≥ 0, Ad = 0, cᵀd < 0) — 2 pts", "Nondegeneracy ⇒ x_B > 0 ⇒ θ* > 0 ⇒ cost strictly decreases by θ*c̄ⱼ < 0 — 3 pts", "Strict decrease ⇒ no basis/BFS revisited; finitely many bases ⇒ finite termination — 2 pts", "(b) Degenerate ⇒ θ* = 0 possible, basis changes without cost change, cycling possible; Bland's / lexicographic rule prevents it — 3 pts"], "model": "(a) Each iteration either stops or pivots. If all c̄ ≥ 0, the current BFS is optimal by the optimality theorem. If some c̄ⱼ < 0 and u = B⁻¹Aⱼ ≤ 0, then d (dⱼ = 1, d_B = −u ≥ 0) satisfies Ad = 0, d ≥ 0, cᵀd = c̄ⱼ < 0, so x + θd is feasible for all θ ≥ 0 and the cost → −∞. Otherwise θ* = min_{uᵢ>0} x_B(i)/uᵢ. Nondegeneracy is used here: x_B > 0, so θ* > 0, and the new cost is cᵀx + θ*c̄ⱼ < cᵀx. Strict decrease means no BFS (and hence no basis, since nondegenerate BFSs have unique bases) can be visited twice. There are at most C(n, m) bases, so the algorithm stops after finitely many pivots. Finiteness alone is not enough; the strict decrease is what rules out revisits. (b) At a degenerate BFS, a basic variable with value 0 and uᵢ > 0 makes θ* = 0: the basis changes but the point and cost do not. A sequence of such pivots can return to an earlier basis and cycle forever. Anti-cycling rules (Bland's smallest-index rule for entering and leaving, or the lexicographic rule) guarantee no basis repeats, restoring finite termination (L3 p.30).", "src": "L3 pp.16, 30; HW1 P3d"}, {"q": "Phase 1. Find an initial BFS for x₁ + 2x₂ + x₃ = 4, 3x₁ + x₂ − x₄ = 3, x ≥ 0. (a) Write the Phase 1 problem and its starting basis. (b) Compute the initial reduced costs and carry out Phase 1 (enter the most negative reduced cost, smallest index on ties). (c) State the BFS you obtain and explain how you would have concluded infeasibility instead.", "pts": 10, "t": 6, "rubric": ["(a) min y₁ + y₂ s.t. rows + yᵢ = bᵢ, all ≥ 0; starting basis {y₁, y₂} = (4, 3) — 2 pts", "(b) Initial c̄ = (−4, −3, −1, 1) for (x₁..x₄), phase cost 7 — 2 pts", "(b) Pivot 1: x₁ enters, y₂ leaves (ratios 4, 1), cost 3; pivot 2: x₂ enters, y₁ leaves (ratios 9/5, 3), cost 0 — 4 pts", "(c) BFS x = (2/5, 9/5, 0, 0) with basis {x₁, x₂}; a positive Phase 1 optimum would prove infeasibility — 2 pts"], "model": "(a) b = (4, 3) ≥ 0. Phase 1: min y₁ + y₂ s.t. x₁ + 2x₂ + x₃ + y₁ = 4, 3x₁ + x₂ − x₄ + y₂ = 3, x, y ≥ 0. Start with basis {y₁, y₂}, y = (4, 3), cost 7. (b) c_B = (1, 1), B = I, so c̄ⱼ = 0 − (column sum): x₁: −4, x₂: −3, x₃: −1, x₄: +1. Pivot 1: x₁ enters, column (1, 3), ratios 4/1 = 4, 3/3 = 1 ⇒ y₂ leaves. x₁ = 1, y₁ = 3, cost 3; new c̄ for x₂ = −5/3. Pivot 2: x₂ enters, column (5/3, 1/3), ratios 3/(5/3) = 9/5, 1/(1/3) = 3 ⇒ y₁ leaves. x₂ = 9/5, x₁ = 1 − (1/3)(9/5) = 2/5, cost 0, and all reduced costs are ≥ 0. (c) Phase 1 optimum is 0 with no artificials in the basis, so x = (2/5, 9/5, 0, 0) with basis {x₁, x₂} is a BFS of the original problem (check: 2/5 + 18/5 = 4, 6/5 + 9/5 = 3). Phase 2 starts from this basis with the true costs. If the Phase 1 optimum were positive, no point with y = 0 exists, so Ax = b, x ≥ 0 would be infeasible. If it is 0 but an artificial stays basic at 0, pivot it out (or drop a redundant row) before Phase 2.", "src": "L3 p.30"}]}, {"id": "l4", "title": "Case Study: Optimizing Production at Filatoi Riuniti", "deck": "Fall_2026_15_C57-L4.pdf", "brief": "L4 is a full modeling case: Filatoi Riuniti must allocate monthly production of four cotton yarns between its own capacity-limited spinning mill and six outside mills at minimum production, purchase and transport cost. The LP has demand rows by yarn, capacity rows by mill, and two compatibility fixes; its March optimum ($1,382,544) is described verbally as a basis, and a February back-test shows $45,868/month of savings. The second half moves from operational to strategic use: five characters ask what-if questions that are all answered by asking what the marginal unit displaces (De Blasi medium at $12.30 is the marginal source, so Filatoi hours are worth $2.12). The lecture closes by naming these numbers shadow prices, which L5–L6 derive from duality. On the exam, expect practice-exam 1j style T/F on Filatoi duals: binding vs slack capacities, why coarse saves $9.80 not $8.90, and when a shadow price stops being valid.", "keyPoints": ["min Σᵢⱼ (Cᵢⱼ + Tᵢⱼ)xᵢⱼ s.t. Σᵢ xᵢⱼ ≥ Dⱼ (4), Σⱼ Hᵢⱼxᵢⱼ ≤ Mᵢ (7), x(A, XF) = x(D, XF) = 0, x ≥ 0", "March optimum $1,382,544; De Blasi (714 of 2,600 h) is the only slack mill and sets medium at $12.30", "Filatoi hour = (12.30 − 11.40)/0.425 = $2.12; valid for ~867 extra hours", "Marginal cost = direct cost + hours × value of an hour: fine 14.96, XF 19.57, coarse 9.80", "CS on every xᵢⱼ > 0: cᵢⱼ = πⱼ − Hᵢⱼλᵢ; slack capacity ⇒ λ = 0", "Compare against the marginal supplier being displaced, not the in-house cost (procurement: $3,855 > $3,500)", "Non-marginal changes leave the range: 6,000 kg medium > 5,389 kg De Blasi slack ⇒ re-optimize ($12.45/kg)", "February back-test: $45,868/month saved (3.4%), ≈ $550,000/year"], "topics": [{"name": "Model structure", "explain": "Sets: 7 mills i, 4 yarns j. Data with units: Mᵢ (h/month), Dⱼ (kg/month), Cᵢⱼ + Tᵢⱼ ($/kg), Hᵢⱼ (h/kg). Variables xᵢⱼ (kg). Demand rows sum over mills, capacity rows sum over yarns, and x(Ambrosi, XF) = x(De Blasi, XF) = 0 encodes incompatibility; unit checks catch indexing errors.", "slides": [{"file": "Fall_2026_15_C57-L4.pdf", "page": 15, "label": "Sets, data and units"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 19, "label": "Filatoi LP formulation"}, {"file": "Recitation4.pdf", "page": 13, "label": "Formulation (Rec 4)"}]}, {"name": "Reading the solution", "explain": "The verbal plan is the optimal basis: Bresciani/Castri/Estensi all XF, Ambrosi all fine, Giuliani all medium, Filatoi all coarse plus remaining XF and fine and as much medium as hours allow, De Blasi the rest of medium. Binding: XF demand, Ambrosi and Filatoi capacity; De Blasi uses 714 of 2,600 h, so it is the marginal medium supplier.", "slides": [{"file": "Fall_2026_15_C57-L4.pdf", "page": 23, "label": "Optimal solution, binding rows"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 25, "label": "Solution = basis"}, {"file": "Recitation4.pdf", "page": 14, "label": "Full data and solution table"}]}, {"name": "Value of optimization", "explain": "Back-test: run the model on February's data and compare with the historical plan: $1,396,450 vs $1,350,582, saving $45,868/month (3.4%), about $550,000/year. Operational use (decision-maker or support) vs strategic use (explain drivers, what-ifs, investments).", "slides": [{"file": "Fall_2026_15_C57-L4.pdf", "page": 26, "label": "February back-test"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 29, "label": "Operational vs strategic use"}]}, {"name": "Strategic what-ifs", "explain": "Each character's question is answered by asking what the marginal unit displaces. Filatoi hours are worth (12.30 − 11.40)/0.425 = $2.12 because they would insource De Blasi medium; marginal fine = 13.90 + 0.5 × 2.12 = $14.96; Ambrosi medium costs +$0.36 net; new machines save 706 × (12.30 − 0.6 × 11.40) = $3,855; a 6,000 kg medium order exceeds De Blasi's 5,389 kg slack, so re-optimize ($12.45/kg).", "slides": [{"file": "Fall_2026_15_C57-L4.pdf", "page": 32, "label": "Opportunistic manager"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 35, "label": "Concerned operator"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 38, "label": "Jealous colleague"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 41, "label": "Doubtful procurement manager"}, {"file": "Fall_2026_15_C57-L4.pdf", "page": 44, "label": "Enthusiastic salesperson"}]}, {"name": "Shadow prices & validity", "explain": "Shadow price = marginal effect of a RHS on the optimal cost (min model: demand duals ≥ 0, capacity duals ≤ 0). Filatoi duals: XF 19.57, fine 14.96, medium 12.30, coarse 9.80 $/kg; capacity Filatoi −2.12, Ambrosi −4.15, De Blasi 0 $/h. Each follows from CS: cᵢⱼ = πⱼ − Hᵢⱼλᵢ for every positive xᵢⱼ. Valid only within the range (e.g., +867 Filatoi hours); beyond it re-optimize.", "slides": [{"file": "Fall_2026_15_C57-L4.pdf", "page": 46, "label": "Toward shadow prices"}, {"file": "Recitation4.pdf", "page": 20, "label": "Filatoi capacity dual −2.12"}, {"file": "Recitation4.pdf", "page": 23, "label": "Fine demand dual 14.96"}, {"file": "Fall_2026_15_C57-L6.pdf", "page": 19, "label": "Filatoi revisited with duality"}]}], "mc": [{"d": "easy", "q": "In the Filatoi LP, the capacity constraint of mill i is:", "o": ["Σⱼ Hᵢⱼxᵢⱼ ≤ Mᵢ", "Σᵢ Hᵢⱼxᵢⱼ ≤ Mᵢ", "Σⱼ xᵢⱼ ≤ Mᵢ", "Σⱼ (Cᵢⱼ + Tᵢⱼ)xᵢⱼ ≤ Mᵢ"], "e": "Hours per kg times kg, summed over the yarns made at mill i, must not exceed its monthly hours. Σⱼ xᵢⱼ ≤ Mᵢ compares kg with hours.", "t": 0, "src": "L4 p.19"}, {"d": "easy", "q": "What do the constraints x(Ambrosi, XF) = x(De Blasi, XF) = 0 encode?", "o": ["Ambrosi and De Blasi cannot produce extra-fine yarn", "Ambrosi and De Blasi have no spare capacity", "Extra-fine demand is already covered in-house", "Those two mills are the most expensive for extra fine"], "e": "A compatibility (production) constraint from the case: those two mills lack the capability for extra fine. Their missing cost entries reflect the same fact.", "t": 0, "src": "L4 p.18"}, {"d": "medium", "q": "Hᵢⱼ is in h/kg and λᵢ, the value of an hour at mill i, is in $/h. The product Hᵢⱼλᵢ is:", "o": ["$/kg: cost of the machine time in one kg", "h/month: a capacity, comparable with Mᵢ", "kg/$: a demand quantity per dollar spent", "$·h: a transport cost per machine-hour"], "e": "h/kg × $/h = $/kg. That is why fine's marginal cost is 13.90 + 0.5 × 2.12: direct cost plus the hours it consumes at their shadow value.", "t": 0, "src": "Rec4 p.17; L4 p.35"}, {"d": "easy", "q": "Which constraint is NOT binding in the March solution?", "o": ["De Blasi's capacity (714 of 2,600 h used)", "Ambrosi's capacity (2,500 of 2,500 h)", "Extra-fine demand (25,000 kg delivered)", "Filatoi's capacity (38,000 h used)"], "e": "De Blasi makes 2,040 kg of medium at 0.35 h/kg = 714 h. Ambrosi (2,500 h), Filatoi (38,000 h) and the XF demand row (25,000 kg) are all tight.", "t": 1, "src": "L4 p.23"}, {"d": "medium", "q": "Which mill sets the marginal cost of medium yarn in March, and why?", "o": ["De Blasi: it makes medium and has spare hours, so it sets $12.30", "Filatoi: it makes most of the medium, at $11.40/kg", "Giuliani: it spends its full capacity on medium, at $11.50", "Ambrosi: it is the cheapest medium producer, at $11.10"], "e": "The marginal unit comes from the supplier that can expand: De Blasi has slack, so the medium demand dual is exactly $12.30. Filatoi and Giuliani are full; Ambrosi makes fine instead.", "t": 1, "src": "L4 p.32"}, {"d": "medium", "q": "Bresciani, Castri and Estensi put all their capacity into extra fine at $17.80–$18.20/kg, barely below Filatoi's $18.25. Why is this clearly worth it?", "o": ["Outsourcing frees Filatoi hours: in-house XF really costs ≈ $19.57/kg", "Outside mills have lower transport costs on every type of yarn", "Filatoi's own mill cannot spin extra-fine yarn at all", "The LP always prefers to run every mill at full capacity"], "e": "The XF demand dual is 18.25 + 0.625 × 2.12 ≈ 19.57. Against that, each outside kg saves $1.37–$1.77. Filatoi still makes 13,164 kg of XF itself.", "t": 1, "src": "Rec4 p.14"}, {"d": "easy", "q": "February: historical plan $1,396,450, optimized plan $1,350,582. The monthly saving is about:", "o": ["$45,900, reported as 3.4%", "$4,590 per month, about 0.34%", "$550,000 per month, about 34%", "$13,900 per month, about 1%"], "e": "1,396,450 − 1,350,582 = 45,868 per month (≈ $550,000 a year). L4 quotes 3.4%, which is relative to the optimized cost.", "t": 2, "src": "L4 p.26"}, {"d": "easy", "q": "How did L4 assess the value of the optimization model?", "o": ["Ran it on February's data and compared with February's actual plan", "Compared March's optimal cost with the March operating budget", "Compared the LP with a greedy heuristic on synthetic data", "Compared solver time with the planners' manual time"], "e": "Back-testing on a past month isolates the model's contribution: same demand and prices, different decisions.", "t": 2, "src": "L4 p.26"}, {"d": "easy", "q": "Renting 600 extra Filatoi hours costs $1,500/month. L4's verdict?", "o": ["Don't rent: 600 h × $2.12 ≈ $1,271 < $1,500", "Rent: 600 h × $11.40 of savings far exceeds $1,500", "Rent: binding capacity should always be expanded", "Don't rent: Filatoi's capacity is not binding"], "e": "Extra hours would replace De Blasi medium: (12.30 − 11.40)/0.425 = $2.12/h. Binding capacity has positive value, but not necessarily enough to cover the rent.", "t": 3, "src": "L4 p.32"}, {"d": "medium", "q": "Concerned operator: what does one more kg of fine yarn cost at the margin?", "o": ["$14.96 = 13.90 + 0.5 × 2.12", "$13.90, Filatoi's unit cost", "$15.00, De Blasi's fine price", "$13.30, Ambrosi's fine price"], "e": "Filatoi is full, so the extra kg of fine uses 0.5 h that must be freed by moving medium to De Blasi at $2.12/h. Ambrosi is full too. This equals the fine-demand dual.", "t": 3, "src": "L4 p.35"}, {"d": "hard", "q": "Jealous colleague: moving 1 kg of medium from De Blasi to Ambrosi changes total cost by:", "o": ["+$0.36", "−$1.20", "+$1.56", "−$0.36"], "e": "Saves 12.30 − 11.10 = 1.20, but the 0.375 h it uses at Ambrosi displaces 0.375/0.40 = 0.9375 kg of fine, replaced at 14.96 instead of 13.30: cost 1.56. Net +0.36, the reduced cost of Ambrosi-medium.", "t": 3, "src": "L4 p.38"}, {"d": "hard", "q": "New machines: 300 h/month, medium at 40% below Filatoi's $11.40, rent $3,500/month. Which comparison is right?", "o": ["706 kg × (12.30 − 0.6 × 11.40) ≈ $3,855 > $3,500: rent", "706 kg × 0.4 × 11.40 ≈ $3,219 < $3,500: don't rent", "300 h × $2.12 ≈ $636 < $3,500: don't rent", "706 kg × (12.30 − 11.40) ≈ $635 < $3,500: don't rent"], "e": "300/0.425 ≈ 706 kg of new medium replaces De Blasi's $12.30 medium (the marginal source), not Filatoi's own production. Interdependence between operational and strategic decisions.", "t": 3, "src": "L4 p.41"}, {"d": "hard", "q": "A client wants 6,000 extra kg of medium. What should Filatoi quote?", "o": ["≥ $12.45/kg: De Blasi absorbs only ~5,389 kg, so re-optimize", "$12.30/kg: De Blasi has slack, so its price is the marginal cost", "$11.40/kg: Filatoi's own medium cost", "$12.30/kg: shadow prices are exact for any demand change"], "e": "De Blasi's spare capacity is 2,600/0.35 − 2,040 ≈ 5,389 kg, so beyond that a costlier source is needed. Re-solving: (1,457,238 − 1,382,544)/6,000 ≈ $12.45/kg.", "t": 3, "src": "L4 p.44"}, {"d": "medium", "q": "Medium demand rises by 1,000 kg. Cost increase?", "o": ["$12,300: within De Blasi's spare capacity", "$11,400: Filatoi makes the extra kg in-house", "$12,450: the 6,000-kg average rate applies", "$0: the medium demand row is not binding"], "e": "Inside the range, the change is Δ × dual = 1,000 × 12.30 (HiGHS re-solve: exactly $12,300). The $12.45 average applies only to the larger 6,000-kg change.", "t": 3, "src": "L4 p.46 (re-solve)"}, {"d": "easy", "q": "De Blasi gets 200 extra hours. Cost change?", "o": ["$0: its capacity has slack, so its shadow price is 0", "−$424: 200 h × $2.12", "−$2,460: 200 h of medium at $12.30", "Cost rises, since more capacity means more production"], "e": "De Blasi uses 714 of 2,600 h. By complementary slackness a slack constraint has dual 0: more of an unused resource is worthless.", "t": 4, "src": "Practice exam 1j(b)"}, {"d": "medium", "q": "Coarse yarn is made only at Filatoi, at $8.90/kg. Coarse demand drops by 100 kg. Savings?", "o": ["About $980", "$890", "About $1,230", "$0"], "e": "Each kg of coarse frees 0.425 Filatoi hours, which then insource De Blasi medium at $2.12/h: 8.90 + 0.425 × 2.12 = $9.80/kg (re-solve: exactly $980).", "t": 4, "src": "Practice exam 1j(d)"}, {"d": "hard", "q": "Castri is full, making extra fine at $18.20/kg with 0.675 h/kg. It gains 50 hours. Savings?", "o": ["≈ $102: (19.57 − 18.20)/0.675 per hour", "≈ $106: 50 h × Filatoi's $2.12 per hour", "≈ $68: 50 × (19.57 − 18.20) per hour", "$0: Castri makes only extra-fine yarn"], "e": "An extra Castri hour makes 1/0.675 kg of XF replacing in-house XF worth $19.57/kg. The per-kg gain must be divided by hours per kg; Filatoi's $2.12 is a different mill's price (re-solve: −$101.74).", "t": 4, "src": "Rec4 p.14 (re-solve)"}, {"d": "hard", "q": "Why is the $2.12/h value of Filatoi hours valid for +600 h but not for +1,000 h?", "o": ["Only ~867 h of De Blasi medium is left to insource", "Dual prices hold only for changes below 10% of capacity", "Beyond 600 h Filatoi's capacity stops binding", "1,000 h would exceed the $1,500 rental budget"], "e": "Past ~867 h the extra hours have nothing as valuable left to replace, so the slope drops: +600 h saves $1,270.59 (= 600 × 2.1176) but +1,000 h saves only $1,867.", "t": 4, "src": "L4 p.32 (re-solve)"}, {"d": "medium", "q": "De Blasi can make fine yarn at $15.00/kg, has spare hours, yet makes none. Its reduced cost is about:", "o": ["+$0.04/kg: a price cut of a few cents would bring it in", "−$0.04/kg: it should be producing fine", "+$1.10/kg: 15.00 − 13.90", "$0: all De Blasi variables price out at zero because its capacity is slack"], "e": "c̄ = 15.00 − 14.96 + 0.45 × 0 ≈ 0.04 (fine's dual 14.9588, De Blasi's hour worth 0). Slack capacity zeroes λ, not the reduced cost.", "t": 4, "src": "Rec4 p.14 (re-solve)"}, {"d": "hard", "q": "Ambrosi's capacity dual, about −$4.15/h, is the largest in magnitude. Where does it come from?", "o": ["(14.96 − 13.30)/0.40: fine's marginal cost minus Ambrosi's, per hour", "Ambrosi is the cheapest mill for every yarn it is able to make", "(12.30 − 11.10)/0.375 ≈ $3.20, scaled up for transport", "Filatoi's $2.12/h times the ratio of the two capacities"], "e": "CS on x(Ambrosi, fine) > 0: 13.30 = 14.96 − 0.40λ ⇒ λ ≈ 4.15. An extra Ambrosi hour makes 2.5 kg of fine, each saving $1.66 against the marginal source.", "t": 4, "src": "Rec4 p.14 (CS)"}, {"d": "easy", "q": "Counting rows in the Filatoi LP (7 mills, 4 yarns), excluding nonnegativity:", "o": ["4 demand rows, 7 capacity rows, 2 compatibility fixes", "7 demand rows, 4 capacity rows, 2 compatibility fixes", "28 rows: one per (mill, yarn) pair", "4 demand rows and 1 aggregate capacity row"], "e": "Demand is indexed by yarn j (Σᵢ xᵢⱼ ≥ Dⱼ), capacity by mill i (Σⱼ Hᵢⱼxᵢⱼ ≤ Mᵢ), plus x(Ambrosi, XF) = x(De Blasi, XF) = 0. 28 is the number of variables, not rows.", "t": 0, "src": "L4 p.19"}, {"d": "easy", "q": "Why does Filatoi outsource spinning at all?", "o": ["In-house spinning capacity cannot be expanded quickly (long machine lead times)", "Outside mills are cheaper than Filatoi for every yarn type", "Transport costs make in-house production unprofitable", "Filatoi cannot spin coarse yarn in-house"], "e": "Spinning is the bottleneck and new machines take long to install, so demand beyond in-house hours goes to the six local mills. Filatoi is actually the cheapest producer of coarse, fine and medium.", "t": 0, "src": "L4 p.4"}, {"d": "easy", "q": "Which question is a STRATEGIC (not operational) use of the Filatoi model?", "o": ["Should we rent new machines for $1,500/month?", "What should each mill produce this March?", "How should February's demand have been allocated?", "Which mills should receive which purchase orders?"], "e": "L4: operational use = decisions in current conditions (automated or decision support). Strategic use = explainability, what-ifs and investments (capacity, technology, products, markets).", "t": 2, "src": "L4 p.29"}, {"d": "hard", "q": "Estensi (full, extra fine at $18.20/kg, 0.65 h/kg) loses 100 machine-hours. Cost change?", "o": ["+≈ $211: each hour is worth (19.57 − 18.20)/0.65 ≈ $2.11", "+$0: other mills can absorb Estensi's extra fine", "+≈ $137: 100 × (19.57 − 18.20)", "−≈ $211: less outside capacity lowers purchases"], "e": "Binding row, nondegenerate ⇒ dual < 0 (practice exam 1j a). Each lost hour removes 1/0.65 kg of XF that must be replaced at the XF marginal cost $19.57: +$2.11/h. Re-solve: +$211.31. $137 forgets to divide by hours per kg.", "t": 4, "src": "Practice exam 1j(a) (re-solve)"}, {"d": "hard", "q": "Bresciani could make medium at $11.80/kg (0.35 h/kg) instead of De Blasi's $12.30, yet makes none. Its reduced cost?", "o": ["≈ +$0.39 = 11.80 − 12.30 + 0.35 × 2.53", "−$0.50 = 11.80 − 12.30: it should be producing", "≈ +$0.24 = 11.80 − 12.30 + 0.35 × 2.12", "$0: Bresciani's capacity is binding"], "e": "c̄ = c − π_medium + H·λ_Bresciani, with λ_B = (19.57 − 17.80)/0.70 ≈ 2.53 $/h (its hours make XF). The 0.35 h would displace 0.5 kg of XF worth 0.887. Using Filatoi's $2.12 prices the wrong mill's hour. HiGHS: 0.387.", "t": 3, "src": "Rec4 p.14 (re-solve)"}, {"d": "hard", "q": "A client wants 2,000 extra kg of fine yarn. Cost increase, and is the shadow price valid?", "o": ["≈ $29,918 = 2,000 × 14.96; valid, only ~2,353 kg of medium moves to De Blasi", "$27,800 = 2,000 × 13.90; Filatoi makes it at its own cost", "$30,000 = 2,000 × 15.00; De Blasi makes the fine yarn", "≈ $29,918, but invalid: De Blasi only has 714 h of slack"], "e": "Each kg of fine takes 0.5 Filatoi h, freed by pushing 0.5/0.425 kg of medium to De Blasi: 2,000 × 1.176 ≈ 2,353 kg < 5,389 kg spare. Re-solve: +$29,917.65. De Blasi has 1,886 h of slack, not 714 (714 is its usage).", "t": 4, "src": "L4 p.35; L6 p.20 (re-solve)"}, {"d": "hard", "q": "Medium demand +6,000 kg: De Blasi covers the first ~5,389 kg at $12.30. What is the marginal cost of the remaining ~611 kg (re-solve), and why?", "o": ["≈ $13.76/kg: Bresciani shifts hours from XF to medium; Filatoi makes that XF instead of medium", "$12.45/kg: the average re-optimized cost applies to every kg", "$12.45/kg: Estensi starts producing medium at its list price", "$11.80/kg: Bresciani's medium price, as it has spare capacity"], "e": "Per kg of Bresciani medium: −0.5 kg XF at Bresciani, +0.5 kg XF at Filatoi, −0.735 kg Filatoi medium ⇒ net +0.265 kg medium for $3.64 ⇒ $13.76/kg (new medium dual 13.761). Check: 5,389 × 12.30 + 611 × 13.76 ≈ 74,694 = 6,000 × 12.45. Bresciani has no spare hours.", "t": 3, "src": "L4 p.44 (re-solve)"}], "or": [{"q": "Formulate the Filatoi March production problem as an LP. Define sets, parameters (with units) and decision variables, write the objective and every constraint family, and explain in one line what each constraint family enforces. State how many demand and capacity constraints there are.", "pts": 10, "t": 0, "rubric": ["Sets i = 1..7 mills, j = 1..4 yarns and variable xᵢⱼ = kg of yarn j made/bought at mill i per month — 2 pts", "Parameters with correct units: Mᵢ h/month, Dⱼ kg/month, Cᵢⱼ and Tᵢⱼ $/kg, Hᵢⱼ h/kg — 2 pts", "Objective min Σᵢⱼ (Cᵢⱼ + Tᵢⱼ)xᵢⱼ — 1 pts", "Demand Σᵢ xᵢⱼ ≥ Dⱼ ∀j (4 rows) and capacity Σⱼ Hᵢⱼxᵢⱼ ≤ Mᵢ ∀i (7 rows), with the correct summation index — 3 pts", "Compatibility x(Ambrosi, XF) = x(De Blasi, XF) = 0 and x ≥ 0, with interpretation — 2 pts"], "model": "Sets: mills i ∈ {Ambrosi, Bresciani, Castri, De Blasi, Estensi, Filatoi, Giuliani} (7), yarns j ∈ {extra fine, fine, medium, coarse} (4). Parameters: Mᵢ machine capacity (h/month), Dⱼ demand (kg/month), Cᵢⱼ production or purchase cost ($/kg), Tᵢⱼ transport cost ($/kg), Hᵢⱼ machine time (h/kg). Variables: xᵢⱼ ≥ 0, kg of yarn j produced by mill i per month. Objective: min Σᵢ Σⱼ (Cᵢⱼ + Tᵢⱼ)xᵢⱼ, total production/purchase plus transport cost. Demand: Σᵢ xᵢⱼ ≥ Dⱼ for each yarn j (4 constraints): all mills together must cover demand for each yarn. Capacity: Σⱼ Hᵢⱼxᵢⱼ ≤ Mᵢ for each mill i (7 constraints): hours/kg × kg summed over the yarns a mill makes cannot exceed its monthly hours (units h). Compatibility: x(Ambrosi, XF) = x(De Blasi, XF) = 0 because those mills cannot spin extra fine. Nonnegativity xᵢⱼ ≥ 0. The model is an LP with 28 variables (26 free to be positive).", "src": "L4 p.15, p.19; Rec4 p.13"}, {"q": "Practice-exam style. Using the March Filatoi solution (primal and dual nondegenerate), state TRUE or FALSE and justify each: (a) If Estensi's capacity decreases by 100 h/month, cost strictly increases. (b) If De Blasi's capacity increases by 200 h/month, cost strictly decreases. (c) If medium demand increases a little, cost rises by at most $12.30/kg. (d) If coarse demand decreases, cost decreases by $8.90/kg.", "pts": 10, "t": 4, "rubric": ["(a) TRUE: Estensi capacity binding, nondegeneracy ⇒ dual strictly negative (≈ −2.11 $/h), so losing hours raises cost (≈ +$211) — 3 pts", "(b) FALSE: De Blasi uses 714 of 2,600 h; slack row ⇒ dual 0 by complementary slackness — 2 pts", "(c) TRUE: De Blasi has slack and makes medium at $12.30, so the extra kg can always be bought there; the medium dual is exactly 12.30 — 2 pts", "(d) FALSE: each kg of coarse frees 0.425 Filatoi hours worth $2.12, which insource De Blasi medium; saving is 8.90 + 0.425 × 2.12 ≈ $9.80/kg — 3 pts"], "model": "(a) TRUE. Estensi uses all 2,500 h (3,846 kg of XF × 0.65 h/kg). Its capacity row is binding and, under nondegeneracy, complementary slackness plus uniqueness force a strictly negative dual: λ_E = −(19.57 − 18.20)/0.65 ≈ −2.11 $/h. A RHS decrease of 100 h changes cost by (−100)(−2.11) ≈ +$211 (re-solve: +$211.31). (b) FALSE. De Blasi produces 2,040 kg of medium at 0.35 h/kg = 714 h < 2,600 h. The row is slack, so by CS its dual is 0 and extra hours are worthless: cost change $0. (c) TRUE. De Blasi has 1,886 spare hours and makes medium at $12.30, so one more kg can always be met there for $12.30; the optimizer might do even better, so the increase is at most $12.30 (the dual equals 12.30 exactly, since x(De Blasi, medium) > 0 and λ_D = 0 give π_medium = 12.30). (d) FALSE. Filatoi makes all the coarse yarn at $8.90/kg, but each kg uses 0.425 h of Filatoi's binding capacity. Freed hours insource medium from De Blasi, worth (12.30 − 11.40)/0.425 = $2.12/h. Savings per kg = 8.90 + 0.425 × 2.12 ≈ $9.80 (coarse dual 9.80; re-solve −100 kg saves $980).", "src": "Practice exam 1j"}, {"q": "Doubtful procurement manager: new machines give 300 h/month and make medium yarn at 40% below Filatoi's $11.40/kg (same 0.425 h/kg); rent is $3,500/month. (a) Show the 'basic math' that rejects the deal. (b) Show the correct comparison and the decision. (c) Explain why (b) is the right comparison and check that it is valid for the full 300 h.", "pts": 10, "t": 3, "rubric": ["(a) 300/0.425 ≈ 706 kg; naive saving 706 × 0.4 × 11.40 ≈ $3,219 < $3,500 ⇒ reject — 2 pts", "(b) Correct saving 706 × (12.30 − 0.6 × 11.40) ≈ $3,855 > $3,500 ⇒ rent — 3 pts", "(c) The new medium displaces the marginal source, De Blasi at $12.30, not Filatoi's own medium — 3 pts", "(c) Validity: 706 kg ≤ 2,040 kg of De Blasi medium available to displace, so the $12.30 comparison holds for the whole amount — 2 pts"], "model": "(a) 300 h / 0.425 h/kg ≈ 706 kg/month. Basic math compares with Filatoi's own cost: saving 706 × 40% × 11.40 ≈ $3,219 < $3,500, so it looks not worth it. (b) Filatoi's own medium production is already limited by its capacity; the additional 706 kg would replace medium currently bought from De Blasi at $12.30/kg. New cost is 0.6 × 11.40 = $6.84/kg, so saving = 706 × (12.30 − 6.84) ≈ $3,855 > $3,500: rent. (c) The value of a change is measured against the marginal supplier being displaced. De Blasi has slack and sets medium's marginal cost at $12.30 (medium demand dual = 12.30). The comparison is valid only while De Blasi medium remains to be displaced: 706 kg < 2,040 kg, so the basis does not change and the computation holds. Takeaway (L4): operational and strategic decisions are interdependent.", "src": "L4 p.41-42"}, {"q": "Enthusiastic salesperson: a client wants 6,000 extra kg of medium yarn and the salesperson proposes quoting $12.30/kg. (a) Why is $12.30 the natural first guess? (b) Show why it fails. (c) The re-optimized cost is $1,457,238 vs $1,382,544. What is the minimum break-even quote, and what general lesson about shadow prices does this illustrate?", "pts": 10, "t": 3, "rubric": ["(a) $12.30 is De Blasi's medium cost = medium demand shadow price, since De Blasi has slack — 2 pts", "(b) De Blasi's spare capacity is 2,600/0.35 − 2,040 ≈ 5,389 kg < 6,000 kg, so the shadow price leaves its range — 3 pts", "(c) (1,457,238 − 1,382,544)/6,000 ≈ $12.45/kg; any quote in [$12.30, $12.45) loses money — 3 pts", "Lesson: shadow prices are valid only for marginal changes within the basis range; non-marginal changes require re-optimization — 2 pts"], "model": "(a) De Blasi is the marginal medium supplier: its capacity has slack (714 of 2,600 h used), so one more kg of medium is bought there at $12.30, which is exactly the medium demand dual. (b) De Blasi can make at most 2,600/0.35 ≈ 7,429 kg of medium and already makes 2,040, leaving ≈ 5,389 kg. The remaining ≈ 611 kg must come from a costlier reshuffle (Bresciani shifts hours from XF to medium, Filatoi produces the displaced XF; marginal cost ≈ $13.76/kg), so the dual 12.30 no longer applies to the whole order. (c) Re-optimizing gives an incremental cost of 1,457,238 − 1,382,544 = $74,694, i.e., $12.45/kg on average. The quote must be at least $12.45/kg; any quote between $12.30 and $12.45 induces losses (the marginal cost is 1.2% above the guess). Lesson: the shadow price is the slope of the optimal cost only within the range where the basis stays optimal; non-marginal changes can require global re-optimization.", "src": "L4 p.44-45 (re-solve)"}, {"q": "Derive the March Filatoi shadow prices from complementary slackness. Let πⱼ ≥ 0 be the demand duals and λᵢ ≥ 0 the value of an hour at mill i (dual of capacity = −λᵢ). Positive variables include x(De Blasi, medium), x(Filatoi, j) for all four yarns, x(Ambrosi, fine) and x(Castri, XF). Compute λ_Filatoi, π for all four yarns, λ_Ambrosi and λ_Castri, and interpret π_fine.", "pts": 10, "t": 4, "rubric": ["CS condition for xᵢⱼ > 0 stated: cᵢⱼ = πⱼ − Hᵢⱼλᵢ; De Blasi slack ⇒ λ_D = 0 ⇒ π_medium = 12.30 — 2 pts", "λ_F from Filatoi medium: 11.40 = 12.30 − 0.425λ_F ⇒ λ_F ≈ 2.12 — 2 pts", "π_fine = 13.90 + 0.5 × 2.12 ≈ 14.96, π_XF = 18.25 + 0.625 × 2.12 ≈ 19.57, π_coarse = 8.90 + 0.425 × 2.12 ≈ 9.80 — 3 pts", "λ_A = (14.96 − 13.30)/0.40 ≈ 4.15 and λ_C = (19.57 − 18.20)/0.675 ≈ 2.03 — 2 pts", "Interpretation of π_fine as the cost of one more kg of fine demand including freed Filatoi hours — 1 pts"], "model": "For every basic xᵢⱼ > 0, the dual constraint is tight: cᵢⱼ = πⱼ − Hᵢⱼλᵢ (demand price minus hours used valued at the mill's hour price). De Blasi capacity is slack ⇒ λ_D = 0 ⇒ from x(D, medium) > 0: π_medium = 12.30. Filatoi medium: 11.40 = 12.30 − 0.425λ_F ⇒ λ_F = 0.90/0.425 ≈ 2.1176 $/h (dual of the capacity row −2.12). Filatoi fine: π_fine = 13.90 + 0.5 × 2.1176 ≈ 14.96. Filatoi XF: π_XF = 18.25 + 0.625 × 2.1176 ≈ 19.57. Filatoi coarse: π_coarse = 8.90 + 0.425 × 2.1176 ≈ 9.80. Ambrosi fine: 13.30 = 14.96 − 0.40λ_A ⇒ λ_A ≈ 4.15 $/h. Castri XF: 18.20 = 19.57 − 0.675λ_C ⇒ λ_C ≈ 2.03 $/h. Interpretation: π_fine = $14.96 is the increase in optimal cost per extra kg of fine demand: Filatoi makes it at $13.90 but must free 0.5 h by pushing medium to De Blasi at $2.12/h. These match the solver duals (19.5735, 14.9588, 12.30, 9.80; −2.1176, −4.1471, −2.0349).", "src": "Rec4 p.14, p.20, p.23; L6 p.19-20"}]}, {"id": "l5", "title": "Duality in Linear Optimization", "deck": "Fall_2026_15_C57-L5.pdf", "brief": "L5 builds the dual of a linear program by relaxing the constraints with prices p: the relaxed problem g(p) is a lower bound on the optimal cost, and maximizing that bound gives the dual. From that derivation come the construction rules (one dual variable per constraint, one dual constraint per variable, sign table by row type and variable sign), weak duality, and strong duality, proven with pᵀ = c_BᵀB⁻¹ at an optimal simplex basis. Complementary slackness ties the two problems together and is the practical tool for testing a candidate optimum and recovering dual prices. The lecture closes with the basis view (B⁻¹b ≥ 0 is primal feasibility, c̄ ≥ 0 is dual feasibility) and how degeneracy creates multiple dual solutions. Exam items: write a dual with mixed signs, classify primal/dual outcomes (practice exam 1d), and use CS on a tableau or a modeled problem like HW2's cloud LP.", "keyPoints": ["min cᵀx, Ax = b, x ≥ 0 ⟷ max pᵀb, pᵀA ≤ cᵀ (p free)", "Min primal: ≥ row ⇒ p ≥ 0, ≤ ⇒ p ≤ 0, = ⇒ free; x ≥ 0 ⇒ ≤ cⱼ, x ≤ 0 ⇒ ≥ cⱼ, free ⇒ = cⱼ", "Weak duality pᵀb ≤ cᵀx; equal values certify optimality of both", "Strong duality: pᵀ = c_BᵀB⁻¹ at an optimal basis, no duality gap", "Outcomes: optimal–optimal, unbounded–infeasible, infeasible–infeasible; never optimal with anything else", "CS: pᵢ(aᵢᵀx − bᵢ) = 0, xⱼ(cⱼ − pᵀAⱼ) = 0; at least one zero per pair", "Basis: primal feasible ⇔ B⁻¹b ≥ 0, dual feasible ⇔ c̄ ≥ 0; both ⇒ optimal", "Degenerate primal ⇒ possibly several optimal duals ⇒ one-sided shadow prices"], "topics": [{"name": "Deriving the dual", "explain": "Relax Ax = b with prices p: g(p) = min over x ≥ 0 of cᵀx + pᵀ(b − Ax) ≤ cᵀx*. g(p) = pᵀb if pᵀA ≤ cᵀ, else −∞, so the best bound is max pᵀb s.t. pᵀA ≤ cᵀ. For Ax ≥ b the penalty must be ≤ 0 at feasible x, forcing p ≥ 0; a free x forces pᵀA = cᵀ.", "slides": [{"file": "Fall_2026_15_C57-L5.pdf", "page": 5, "label": "Relaxing Ax = b"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 8, "label": "Standard-form dual from g(p)"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 12, "label": "General-form derivation"}]}, {"name": "Dual construction rules", "explain": "One dual variable per primal row, one dual constraint per primal variable; c ↔ b, min ↔ max. Min primal: ≥ row ⇒ p ≥ 0, ≤ ⇒ p ≤ 0, = ⇒ free; x ≥ 0 ⇒ pᵀAⱼ ≤ cⱼ, x ≤ 0 ⇒ ≥, free ⇒ =. Max primal flips the row-sign and column-sense rules. The dual of the dual is the primal.", "slides": [{"file": "Fall_2026_15_C57-L5.pdf", "page": 13, "label": "Standard-form dual rules"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 14, "label": "General form (min)"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 15, "label": "General form (max)"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 17, "label": "Manufacturing dual interpretation"}]}, {"name": "Weak & strong duality", "explain": "Weak: x, p feasible ⇒ pᵀb ≤ cᵀx (pᵀb = pᵀAx ≤ cᵀx). Equal values certify both optimal. Strong: if the primal has an optimum, pᵀ = c_BᵀB⁻¹ at an optimal basis is dual feasible (c̄ ≥ 0) with pᵀb = cᵀx, so there is no duality gap.", "slides": [{"file": "Fall_2026_15_C57-L5.pdf", "page": 19, "label": "Weak duality"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 20, "label": "Corollaries: bound and certificate"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 21, "label": "Strong duality proof"}]}, {"name": "Primal–dual outcomes", "explain": "Possible: both optimal (equal values); primal unbounded with dual infeasible; dual unbounded with primal infeasible; both infeasible. Impossible: optimal with unbounded or infeasible, and unbounded with unbounded. Infeasible primal + feasible dual ⇒ dual unbounded (practice exam 1d).", "slides": [{"file": "Fall_2026_15_C57-L5.pdf", "page": 22, "label": "Four possible outcomes"}]}, {"name": "Complementary slackness", "explain": "Feasible x, p are optimal iff pᵢ(aᵢᵀx − bᵢ) = 0 ∀i and xⱼ(cⱼ − pᵀAⱼ) = 0 ∀j. Use it to test a candidate x (slack rows ⇒ pᵢ = 0, positive xⱼ ⇒ tight dual rows, then check dual feasibility) or to recover duals. CS is 'at least one zero': binding rows can have pᵢ = 0.", "slides": [{"file": "Fall_2026_15_C57-L5.pdf", "page": 23, "label": "CS theorem"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 24, "label": "CS interpretation"}, {"file": "Recitation4.pdf", "page": 5, "label": "Shadow prices and CS"}]}, {"name": "Bases, geometry & degeneracy", "explain": "A basis gives x_B = B⁻¹b and pᵀ = c_BᵀB⁻¹; primal feasible iff B⁻¹b ≥ 0, dual feasible iff c̄ ≥ 0, both ⇒ optimal. Geometrically a nondegenerate corner is optimal iff c is a nonnegative combination of its active normals. A degenerate optimum can have several duals (one per active subset), giving one-sided shadow prices.", "slides": [{"file": "Fall_2026_15_C57-L5.pdf", "page": 28, "label": "Feasibility and optimality conditions"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 31, "label": "Cone condition at a corner"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 36, "label": "Primal and dual feasible = optimal"}, {"file": "Fall_2026_15_C57-L5.pdf", "page": 38, "label": "Duality and degeneracy"}, {"file": "Recitation4.pdf", "page": 8, "label": "Degeneracy (Rec 4)"}]}], "mc": [{"d": "easy", "q": "For a min LP, any dual feasible p provides:", "o": ["A lower bound pᵀb on the optimal cost", "An upper bound pᵀb on the optimal cost", "A feasible primal solution", "The exact optimal cost"], "e": "Weak duality: pᵀb ≤ cᵀx for every primal feasible x, so pᵀb ≤ z*. It equals z* only for an optimal p.", "t": 0, "src": "L5 p.19-20"}, {"d": "medium", "q": "In g(p) = min over x ≥ 0 of cᵀx + pᵀ(b − Ax), why must pᵀA ≤ cᵀ for g(p) to be a useful bound?", "o": ["If some cⱼ − pᵀAⱼ < 0, letting xⱼ → ∞ drives g(p) to −∞", "Otherwise g(p) exceeds the primal optimum", "Because p must be nonnegative", "Because x* must be a basic feasible solution"], "e": "g(p) = pᵀb + min over x ≥ 0 of (cᵀ − pᵀA)x. The inner min is 0 if every coefficient is ≥ 0 and −∞ otherwise.", "t": 0, "src": "L5 p.7"}, {"d": "hard", "q": "Primal: min cᵀx s.t. Ax ≥ b, x free. Relaxing with the penalty pᵀ(b − Ax), which sign keeps g(p) ≤ cᵀx*, and what dual constraint results?", "o": ["p ≥ 0, since b − Ax* ≤ 0; dual constraint pᵀA = cᵀ", "p ≤ 0, since b − Ax* ≤ 0; dual constraint pᵀA = cᵀ", "p ≥ 0, since b − Ax* ≥ 0; dual constraint pᵀA ≤ cᵀ", "p free, since x is free; dual constraint pᵀA ≥ cᵀ"], "e": "At feasible x*, b − Ax* ≤ 0, so pᵀ(b − Ax*) ≤ 0 needs p ≥ 0. With x free, min_x (cᵀ − pᵀA)x is finite only if cᵀ − pᵀA = 0 (L5 general-form derivation).", "t": 0, "src": "L5 p.10-12"}, {"d": "easy", "q": "In a min primal, the dual variable of a ≤ constraint is:", "o": ["≤ 0", "≥ 0", "Free", "Always 0"], "e": "Min primal: ≥ row ⇒ pᵢ ≥ 0, ≤ row ⇒ pᵢ ≤ 0, equality ⇒ free. This is why capacity duals in cost-minimization models (Filatoi) are negative.", "t": 1, "src": "L5 p.14"}, {"d": "medium", "q": "Primal: min 2x₁ + 3x₂ s.t. x₁ + x₂ ≥ 4 (p₁), x₁ − x₂ = 1 (p₂), x₁ ≥ 0, x₂ free. The dual is:", "o": ["max 4p₁ + p₂ s.t. p₁ + p₂ ≤ 2, p₁ − p₂ = 3, p₁ ≥ 0, p₂ free", "max 4p₁ + p₂ s.t. p₁ + p₂ ≤ 2, p₁ − p₂ ≤ 3, p₁ ≥ 0, p₂ ≥ 0", "min 4p₁ + p₂ s.t. p₁ + p₂ ≥ 2, p₁ − p₂ = 3, p₁ ≥ 0, p₂ free", "max 4p₁ + p₂ s.t. p₁ + p₂ = 2, p₁ − p₂ ≤ 3, p₁ ≤ 0, p₂ free"], "e": "≥ row ⇒ p₁ ≥ 0; equality ⇒ p₂ free; x₁ ≥ 0 ⇒ ≤ constraint; x₂ free ⇒ equality. Both problems have optimal value 9.5 (x = (2.5, 1.5), p = (2.5, −0.5)).", "t": 1, "src": "L5 p.14"}, {"d": "easy", "q": "The dual of the manufacturing LP max πᵀx s.t. Ax ≤ b, x ≥ 0 is:", "o": ["min bᵀp s.t. Aᵀp ≥ π, p ≥ 0", "min bᵀp s.t. Aᵀp ≤ π, p ≥ 0", "max bᵀp s.t. Aᵀp ≥ π, p ≥ 0", "min bᵀp s.t. Aᵀp ≥ π, p ≤ 0"], "e": "Max primal: ≤ rows ⇒ p ≥ 0; x ≥ 0 ⇒ dual constraints ≥. Reading: resource prices that value each product's inputs at least at its profit.", "t": 1, "src": "L5 p.16"}, {"d": "medium", "q": "A min primal has a variable x₃ ≤ 0. The corresponding dual constraint is:", "o": ["pᵀA₃ ≥ c₃", "pᵀA₃ ≤ c₃", "pᵀA₃ = c₃", "p₃ ≤ 0"], "e": "For a min primal: xⱼ ≥ 0 ⇒ pᵀAⱼ ≤ cⱼ, xⱼ ≤ 0 ⇒ ≥, free ⇒ =. Variable signs map to dual constraints, not to dual variable signs.", "t": 1, "src": "L5 p.14"}, {"d": "easy", "q": "min 3x₁ + 2x₂ + 5x₃ s.t. x₁ + x₂ + x₃ ≥ 5, 2x₁ + x₂ + 3x₃ ≥ 8, x ≥ 0. p = (0, 1) is dual feasible. What does it certify?", "o": ["The optimal cost is at least 8", "The optimal cost is at most 8", "The optimal cost equals 8", "Nothing, because p₁ = 0"], "e": "pᵀA = (2, 1, 3) ≤ (3, 2, 5) and p ≥ 0, so weak duality gives z* ≥ pᵀb = 8. The true optimum is 13.", "t": 2, "src": "L5 p.19"}, {"d": "medium", "q": "Same LP. x = (3, 2, 0) costs 13, and p = (1, 1) is dual feasible with pᵀb = 13. Conclusion?", "o": ["Both are optimal, by the weak-duality certificate", "x is optimal, but p need not be", "Neither is proven optimal until CS is checked separately", "The LP must be degenerate because the values match"], "e": "Feasible x and p with equal objective values are both optimal (L5 corollary). CS then holds automatically.", "t": 2, "src": "L5 p.20"}, {"d": "hard", "q": "In the strong duality proof, why is pᵀ = c_BᵀB⁻¹ dual feasible at an optimal basis B?", "o": ["pᵀAⱼ ≤ cⱼ is exactly c̄ⱼ ≥ 0, the simplex stopping rule", "Because B⁻¹b ≥ 0 at any primal feasible basis", "Because p must be nonnegative in standard form", "Because the dual of the dual is the primal problem"], "e": "Simplex stops with c̄ = cᵀ − c_BᵀB⁻¹A ≥ 0, i.e. pᵀA ≤ cᵀ. Equal values follow from pᵀb = c_BᵀB⁻¹b = c_Bᵀx_B. Primal feasibility plays no role in dual feasibility.", "t": 2, "src": "L5 p.21"}, {"d": "easy", "q": "The primal is unbounded. The dual is:", "o": ["Infeasible", "Unbounded", "Optimal", "Feasible, with a positive duality gap"], "e": "A dual feasible p would bound the primal from below (weak duality), contradicting unboundedness.", "t": 3, "src": "L5 p.22"}, {"d": "medium", "q": "A min LP is infeasible, and its dual has a feasible solution. Then the dual is:", "o": ["Unbounded", "Optimal", "Infeasible", "Optimal with value +∞"], "e": "If the dual had an optimum, strong duality (applied to the dual) would give the primal one too. Feasible but not optimal means unbounded (practice exam 1d).", "t": 3, "src": "Practice exam 1d; L5 p.22"}, {"d": "hard", "q": "Which primal–dual pair of outcomes is possible?", "o": ["Primal infeasible, dual infeasible", "Primal optimal, dual unbounded", "Primal unbounded, dual unbounded", "Primal optimal, dual infeasible"], "e": "Example: min x₁ s.t. x₁ + x₂ ≥ 1, −x₁ − x₂ ≥ 1 (x free) is infeasible, and its dual (p₁ − p₂ = 1, p₁ − p₂ = 0, p ≥ 0) is too. A finite optimum on one side forces one on the other.", "t": 3, "src": "L5 p.22"}, {"d": "easy", "q": "At an optimal primal–dual pair, constraint i is slack (aᵢᵀx > bᵢ). Then:", "o": ["pᵢ = 0", "pᵢ > 0", "xᵢ = 0", "aᵢ must be parallel to c"], "e": "Complementary slackness: pᵢ(aᵢᵀx − bᵢ) = 0. A resource that is not used up has zero marginal value.", "t": 4, "src": "L5 p.23-24"}, {"d": "medium", "q": "Same LP (min 3x₁ + 2x₂ + 5x₃, rows ≥ 5 and ≥ 8). Candidate x = (0, 5, 1) with cost 15. Result of the CS test?", "o": ["Fails: p₁ = 0 (row 1 slack), but x₂, x₃ > 0 need p₂ = 2 and 5/3", "Passes with p = (0, 2), so x is optimal for the LP", "Passes with p = (0, 5/3), so x is optimal for the LP", "Fails only because x₁ = 0 forces c̄₁ > 0 by CS"], "e": "Row 1: 6 > 5 (slack); row 2: 8 = 8. The CS equations are inconsistent, so no dual solution matches x: not optimal (cost 15 > 13). x₁ = 0 imposes nothing.", "t": 4, "src": "L5 p.23"}, {"d": "hard", "q": "Same LP. Use CS to recover the dual from the optimal x = (3, 2, 0):", "o": ["p = (1, 1); c̄₃ = 5 − 4 = 1 > 0", "p = (3, 0); c̄₃ = 2", "p = (1, 1); c̄₃ = 0, so x₃ can enter at no cost", "p = (0, 1); c̄₃ = 2"], "e": "x₁, x₂ > 0 ⇒ p₁ + 2p₂ = 3 and p₁ + p₂ = 2 ⇒ p = (1, 1) ≥ 0. Remaining dual constraint: p₁ + 3p₂ = 4 ≤ 5 ✓. Dual value 5 + 8 = 13 = primal cost.", "t": 4, "src": "L5 p.23"}, {"d": "hard", "q": "True or false: at an optimal primal–dual pair, every binding primal constraint has a nonzero dual price.", "o": ["False: CS only requires one zero per pair; a binding row can have pᵢ = 0", "True: binding means the resource is scarce, so its price is positive", "True whenever the primal optimum is nondegenerate", "False: binding rows always have pᵢ = 0"], "e": "CS is 'at least one zero'. A binding row with zero price occurs at degenerate vertices and under dual degeneracy, even with a nondegenerate primal (its slack is nonbasic with reduced cost 0).", "t": 4, "src": "L5 p.24"}, {"d": "easy", "q": "A basis has B⁻¹b ≥ 0 but some c̄ⱼ < 0. Its primal and dual basic solutions are:", "o": ["Primal feasible, dual infeasible", "Primal infeasible, dual feasible", "Both feasible, hence optimal", "Both infeasible"], "e": "B⁻¹b ≥ 0 is primal feasibility; c̄ ≥ 0 is dual feasibility for pᵀ = c_BᵀB⁻¹. This is where primal simplex lives.", "t": 5, "src": "L5 p.28"}, {"d": "hard", "q": "max 3x₁ + 2x₂ s.t. x₁ + x₂ ≤ 4, 2x₁ + x₂ ≤ 8, x ≥ 0 has the degenerate optimum (4, 0), value 12. Dual: min 4y₁ + 8y₂ s.t. y₁ + 2y₂ ≥ 3, y₁ + y₂ ≥ 2, y ≥ 0. Which two dual vectors are both optimal?", "o": ["(1, 1) and (3, 0)", "(1, 1) and (0, 3/2)", "(3, 0) and (0, 3/2)", "Only (1, 1): an LP optimum has a unique dual"], "e": "Both (1, 1) and (3, 0) are feasible with value 12. (0, 3/2) also has value 12 but violates y₁ + y₂ ≥ 2: it comes from the basis {x₁, s₁}, which shows c̄(x₂) = −1/2. Degenerate primal ⇒ several duals.", "t": 5, "src": "L5 p.38; Rec4 p.8"}, {"d": "medium", "q": "min cᵀx s.t. aᵢᵀx ≥ bᵢ. At a feasible, nondegenerate corner with active rows 1 and 2, c = 2a₁ − a₂. The corner is:", "o": ["Not optimal: c needs a negative weight on a₂", "Optimal: c is a combination of the active normals", "Optimal, because the corner is primal feasible", "Degenerate, because c uses two active normals"], "e": "Dual feasibility at a nondegenerate corner requires c = Σ pᵢaᵢ over i ∈ I with p ≥ 0. The unique weights are (2, −1), so p₂ < 0: primal feasible, dual infeasible.", "t": 5, "src": "L5 p.31"}, {"d": "easy", "q": "A primal LP has m constraints (excluding sign restrictions) and n variables. Its dual has:", "o": ["m variables and n constraints", "n variables and m constraints", "m + n variables and m constraints", "m variables and m + n constraints"], "e": "One dual variable per primal constraint, one dual constraint per primal variable (L5 summary). The primal costs become the dual RHS and b becomes the dual objective.", "t": 1, "src": "L5 p.13, p.40"}, {"d": "easy", "q": "In a MAX primal, the dual variable of a ≥ constraint is:", "o": ["≤ 0", "≥ 0", "Free", "Always 0"], "e": "Max table: ≤ row ⇒ pᵢ ≥ 0 (natural), ≥ row ⇒ pᵢ ≤ 0, = row ⇒ free. Mirror of the min table, where the ≥ row is the natural one.", "t": 1, "src": "L5 p.15"}, {"d": "easy", "q": "x* and p* are optimal, and x*ⱼ > 0. Complementary slackness implies:", "o": ["p*ᵀAⱼ = cⱼ: the j-th dual constraint is tight", "p*ⱼ = 0", "The j-th primal constraint is binding", "cⱼ − p*ᵀAⱼ > 0"], "e": "xⱼ(cⱼ − pᵀAⱼ) = 0: a positive variable has zero reduced cost. Dual variables are indexed by constraints, not variables, so 'p*ⱼ = 0' mixes up the pairing.", "t": 4, "src": "L5 p.23-24"}, {"d": "hard", "q": "Practice-exam furniture LP: min −x₁ − x₂ s.t. 5x₁ + 3x₂ ≤ 10 (wood), 4x₁ + x₂ ≤ 8 (paint), x₁ + 3x₂ ≤ 4 (hours), x ≥ 0. The optimum is x = (3/2, 5/6). Use CS to recover the dual p:", "o": ["p = (−1/6, 0, −1/6); dual value −7/3", "p = (1/6, 0, 1/6); dual value 7/3", "p = (−1/6, −1/6, 0); dual value −3", "p = (0, −1/6, −1/6); dual value −2"], "e": "Paint: 4(3/2) + 5/6 = 41/6 < 8 ⇒ p₂ = 0. x₁, x₂ > 0 ⇒ 5p₁ + p₃ = −1 and 3p₁ + 3p₃ = −1 ⇒ p₁ = p₃ = −1/6 (≤ 0, as ≤ rows in a min require). pᵀb = −10/6 − 4/6 = −7/3 = primal cost.", "t": 4, "src": "Practice exam P2(c)"}, {"d": "hard", "q": "Practice exam 1d dual: max 2y₁ + 2y₂ + 2y₃ s.t. y₁ + 3y₂ + y₃ = 1, 2y₁ + y₂ + y₃ = 1, y₁ ≤ 0, y₂ ≤ 0, y₃ ≥ 0. Which family proves it is unbounded?", "o": ["y = (2t, t, 1 − 5t), t → −∞; objective 2 − 4t", "y = (2t, t, 1 − 5t), t → +∞; objective 2 − 4t", "y = (−t, −t, 1 + 4t), t → +∞; objective 2 + 4t", "y = (0, 0, 1) alone; objective 2"], "e": "Subtracting the equalities gives y₁ = 2y₂; then y₃ = 1 − 5y₂. Signs need t ≤ 0, and the objective 2(1 − 2t) → +∞ as t → −∞. (−t, −t, 1 + 4t) violates the second row (gives 1 + t). (0, 0, 1) shows feasibility only.", "t": 3, "src": "Practice exam 1d"}, {"d": "hard", "q": "HW2 P4: min Σᵢⱼ eᵢⱼxᵢⱼ s.t. Σⱼ xᵢⱼ = 1 ∀ jobs i (dual qᵢ), Σᵢ uᵢⱼxᵢⱼ ≤ Uⱼ ∀ machines j (dual pⱼ), x ≥ 0. The dual is:", "o": ["max Σᵢ qᵢ + Σⱼ Uⱼpⱼ s.t. qᵢ + uᵢⱼpⱼ ≤ eᵢⱼ ∀i, j; pⱼ ≤ 0, qᵢ free", "max Σᵢ qᵢ + Σⱼ Uⱼpⱼ s.t. qᵢ + uᵢⱼpⱼ ≤ eᵢⱼ ∀i, j; pⱼ ≥ 0, qᵢ free", "max Σᵢ qᵢ + Σⱼ Uⱼpⱼ s.t. qᵢ + uᵢⱼpⱼ ≥ eᵢⱼ ∀i, j; pⱼ ≤ 0, qᵢ ≥ 0", "min Σᵢ qᵢ + Σⱼ Uⱼpⱼ s.t. qᵢ + uᵢⱼpⱼ ≤ eᵢⱼ ∀i, j; pⱼ ≤ 0, qᵢ free"], "e": "Min primal: = rows ⇒ free qᵢ; ≤ rows ⇒ pⱼ ≤ 0; xᵢⱼ ≥ 0 ⇒ dual constraint ≤ eᵢⱼ. Column xᵢⱼ appears in job row i (coef 1) and machine row j (coef uᵢⱼ). HW2 code: p[1:20] ≤ 0, utilization[i,j]·p[j] + q[i] ≤ energy[i,j].", "t": 1, "src": "HW2 P4(f)"}, {"d": "hard", "q": "max 2x₁ − x₂ s.t. x₁ + x₂ ≤ 3, x₁ − x₂ ≥ −1, x₁ ≥ 0, x₂ ≤ 0. Dual and its status?", "o": ["min 3p₁ − p₂ s.t. p₁ + p₂ ≥ 2, p₁ − p₂ ≤ −1, p₁ ≥ 0, p₂ ≤ 0: infeasible", "min 3p₁ − p₂ s.t. p₁ + p₂ ≥ 2, p₁ − p₂ ≥ −1, p₁ ≥ 0, p₂ ≥ 0: optimal", "min 3p₁ − p₂ s.t. p₁ + p₂ ≥ 2, p₁ − p₂ ≤ −1, p₁ ≥ 0, p₂ ≤ 0: unbounded", "min 3p₁ − p₂ s.t. p₁ + p₂ ≤ 2, p₁ − p₂ ≥ −1, p₁ ≤ 0, p₂ ≥ 0: infeasible"], "e": "Max table: ≤ row ⇒ p₁ ≥ 0, ≥ row ⇒ p₂ ≤ 0, x₁ ≥ 0 ⇒ ≥ c₁, x₂ ≤ 0 ⇒ ≤ c₂. With p₁ ≥ 0, p₂ ≤ 0, p₁ − p₂ ≥ 0 > −1: infeasible. Consistent: the primal is unbounded along x = (3 + t, −t), value 6 + 3t.", "t": 3, "src": "L5 p.15, p.22"}], "or": [{"q": "HW2 P4 (cloud computing). Jobs i are assigned fractionally to machines j: min Σᵢⱼ eᵢⱼxᵢⱼ s.t. Σⱼ xᵢⱼ = 1 ∀i, Σᵢ uᵢⱼxᵢⱼ ≤ Uⱼ ∀j, x ≥ 0 (eᵢⱼ energy, uᵢⱼ utilization, Uⱼ max utilization). (a) Write the dual with qᵢ for job rows and pⱼ for machine rows, with signs. (b) Interpret pⱼ and qᵢ. (c) In HW2 every optimal pⱼ lay between about −1.1 and −0.4. What does CS let you conclude, and what can you NOT conclude from a binding row?", "pts": 10, "t": 1, "rubric": ["(a) Objective max Σᵢ qᵢ + Σⱼ Uⱼpⱼ — 1 pts", "(a) Constraints qᵢ + uᵢⱼpⱼ ≤ eᵢⱼ ∀i, j with pⱼ ≤ 0 and qᵢ free, each sign justified by the min-primal rules — 3 pts", "(b) pⱼ = change in optimal energy per extra unit of Uⱼ (≤ 0: capacity can only help); qᵢ = marginal energy of serving job i — 2 pts", "(c) pⱼ ≠ 0 ⇒ by CS every machine's utilization constraint is binding — 2 pts", "(c) Converse fails: a binding row can have pⱼ = 0 (degeneracy), so binding alone does not imply a nonzero dual — 2 pts"], "model": "(a) Dual: max Σᵢ qᵢ + Σⱼ Uⱼpⱼ s.t. qᵢ + uᵢⱼpⱼ ≤ eᵢⱼ for all i, j; pⱼ ≤ 0; qᵢ free. Reasons (min primal): equality rows give free duals; ≤ rows give nonpositive duals; each xᵢⱼ ≥ 0 gives a ≤ dual constraint whose LHS collects xᵢⱼ's column (1 in job row i, uᵢⱼ in machine row j) and whose RHS is its cost eᵢⱼ. (b) pⱼ is the shadow price of machine j's utilization cap: the change in minimum total energy per extra unit of Uⱼ. It is ≤ 0 because relaxing a capacity can only lower cost. qᵢ is the marginal energy of job i: by CS, if xᵢⱼ > 0 then qᵢ = eᵢⱼ − uᵢⱼpⱼ, i.e., the job's energy on machine j plus the opportunity cost −uᵢⱼpⱼ ≥ 0 of the capacity it consumes; qᵢ is the minimum over machines of this effective cost. (c) CS: pⱼ(Σᵢ uᵢⱼxᵢⱼ − Uⱼ) = 0. Since every pⱼ is strictly negative, every machine's utilization constraint is binding at the optimum. The reverse inference is invalid: a binding constraint may still have pⱼ = 0 (CS requires at least one zero per pair, not exactly one). Duals closer to 0 for large Uⱼ mean an extra unit of capacity is worth less on a large machine.", "src": "HW2 P4(f)"}, {"q": "Practice exam 1d. Consider min x₁ + x₂ s.t. x₁ + 2x₂ ≤ 2, 3x₁ + x₂ ≤ 2, x₁ + x₂ ≥ 2, with x₁, x₂ free. TRUE or FALSE: the problem is infeasible and its dual is unbounded. Justify both parts, writing the dual explicitly.", "pts": 10, "t": 3, "rubric": ["Infeasibility shown with a valid combination: 2·row 1 + row 2 gives 5x₁ + 5x₂ ≤ 6, i.e., x₁ + x₂ ≤ 1.2 < 2 — 3 pts", "Dual written correctly: max 2y₁ + 2y₂ + 2y₃ s.t. y₁ + 3y₂ + y₃ = 1, 2y₁ + y₂ + y₃ = 1, y₁ ≤ 0, y₂ ≤ 0, y₃ ≥ 0 — 3 pts", "Dual feasible point, e.g., y = (0, 0, 1) — 1 pts", "Unboundedness: primal infeasible ⇒ dual infeasible or unbounded; feasible ⇒ unbounded, or explicit ray (2t, t, 1 − 5t), t → −∞ — 2 pts", "Final verdict TRUE — 1 pts"], "model": "TRUE. Infeasibility: 2·(x₁ + 2x₂ ≤ 2) + (3x₁ + x₂ ≤ 2) gives 5x₁ + 5x₂ ≤ 6, i.e., x₁ + x₂ ≤ 1.2, which contradicts x₁ + x₂ ≥ 2. Dual (min primal, x free ⇒ equality dual constraints; ≤ rows ⇒ y ≤ 0; ≥ row ⇒ y ≥ 0): max 2y₁ + 2y₂ + 2y₃ s.t. y₁ + 3y₂ + y₃ = 1, 2y₁ + y₂ + y₃ = 1, y₁ ≤ 0, y₂ ≤ 0, y₃ ≥ 0. y = (0, 0, 1) is feasible. Since the primal is infeasible, the dual cannot have an optimum (strong duality), so it is infeasible or unbounded; being feasible, it is unbounded. Explicitly: the equalities give y₁ = 2y₂ and y₃ = 1 − 5y₂; with y₂ = t ≤ 0, y = (2t, t, 1 − 5t) is feasible and has objective 2(2t + t + 1 − 5t) = 2 − 4t → +∞ as t → −∞. (The ray direction (−2, −1, 5) is exactly the infeasibility certificate: weights 2 and 1 on the ≤ rows and 5 on the ≥ row.)", "src": "Practice exam 1d"}, {"q": "Furniture LP (practice exam P2): min −x₁ − x₂ s.t. 5x₁ + 3x₂ ≤ 10 (wood), 4x₁ + x₂ ≤ 8 (paint), x₁ + 3x₂ ≤ 4 (hours), x ≥ 0. A colleague claims x = (3/2, 5/6) is optimal. (a) Verify with complementary slackness (find p and check all conditions). (b) Confirm with strong duality. (c) Interpret p₂ and p₃ in units of the original problem (x in hundreds of units, objective in $10,000).", "pts": 10, "t": 4, "rubric": ["(a) Feasibility of x checked; wood and hours binding, paint slack (41/6 < 8) ⇒ p₂ = 0 — 2 pts", "(a) x₁, x₂ > 0 ⇒ 5p₁ + 4p₂ + p₃ = −1 and 3p₁ + p₂ + 3p₃ = −1 ⇒ p = (−1/6, 0, −1/6) — 3 pts", "(a) Dual feasibility: p ≤ 0 as required for ≤ rows of a min — 1 pts", "(b) pᵀb = −10/6 − 4/6 = −7/3 = cᵀx — 2 pts", "(c) Paint worth $0; one hundred more hours raise revenue by $10,000/6 ≈ $1,667, i.e., ≈ $16.67/h — 2 pts"], "model": "(a) Feasibility: wood 5(3/2) + 3(5/6) = 7.5 + 2.5 = 10 (binding); paint 4(3/2) + 5/6 = 6.833 < 8 (slack); hours 3/2 + 3(5/6) = 4 (binding); x ≥ 0. CS: paint slack ⇒ p₂ = 0. x₁ > 0 ⇒ 5p₁ + 4p₂ + p₃ = −1; x₂ > 0 ⇒ 3p₁ + p₂ + 3p₃ = −1. With p₂ = 0: p₃ = −1 − 5p₁ and 3p₁ − 3 − 15p₁ = −1 ⇒ p₁ = −1/6, p₃ = −1/6. Dual feasibility: the dual is max 10p₁ + 8p₂ + 4p₃ s.t. 5p₁ + 4p₂ + p₃ ≤ −1, 3p₁ + p₂ + 3p₃ ≤ −1, p ≤ 0; both constraints hold with equality and p ≤ 0. All CS conditions hold for feasible x and p ⇒ both optimal. (b) Dual value 10(−1/6) + 0 + 4(−1/6) = −14/6 = −7/3 = −(3/2 + 5/6) = cᵀx, so by weak duality both are optimal. (c) p₂ = 0: extra paint is worthless (it is not used up). p₃ = −1/6: 1 unit of the hours RHS (100 h) lowers the min cost by 1/6, i.e., raises revenue by $10,000/6 ≈ $1,667, so the break-even wage is ≈ $16.67/h (valid within the RHS range).", "src": "Practice exam P2(b)-(e)"}, {"q": "For the primal min cᵀx s.t. Ax ≥ b, x ≥ 0 and its dual max pᵀb s.t. pᵀA ≤ cᵀ, p ≥ 0: (a) prove weak duality, pointing out exactly where each sign condition is used; (b) derive the two corollaries used as certificates; (c) use weak duality to show that a primal unbounded below forces the dual to be infeasible.", "pts": 10, "t": 2, "rubric": ["(a) Chain pᵀb ≤ pᵀAx ≤ cᵀx — 2 pts", "(a) First ≤ uses p ≥ 0 and Ax ≥ b; second uses x ≥ 0 and pᵀA ≤ cᵀ — 2 pts", "(b) Any dual feasible p gives the lower bound pᵀb ≤ z*; feasible x, p with pᵀb = cᵀx are both optimal — 3 pts", "(c) If some p were dual feasible, every primal feasible x would satisfy cᵀx ≥ pᵀb, contradicting unboundedness — 3 pts"], "model": "(a) Let x be primal feasible and p dual feasible. Since p ≥ 0 and Ax − b ≥ 0, pᵀ(Ax − b) ≥ 0, so pᵀb ≤ pᵀAx. Since x ≥ 0 and cᵀ − pᵀA ≥ 0ᵀ, (cᵀ − pᵀA)x ≥ 0, so pᵀAx ≤ cᵀx. Hence pᵀb ≤ cᵀx. (b) Corollary 1: taking the min over x, every dual feasible p gives pᵀb ≤ z*, a lower bound on the optimal cost (and the max over p gives max pᵀb ≤ min cᵀx). Corollary 2: if x and p are feasible with pᵀb = cᵀx, then for any feasible x', cᵀx' ≥ pᵀb = cᵀx, so x is optimal; symmetrically p is optimal. (c) If the primal is unbounded, for every M there is feasible x with cᵀx < M. If some dual feasible p existed, cᵀx ≥ pᵀb for all feasible x, a finite lower bound, contradiction. Hence the dual is infeasible. (Symmetrically, an unbounded dual forces an infeasible primal.)", "src": "L5 p.19-20, p.22"}, {"q": "max 3x₁ + 2x₂ s.t. x₁ + x₂ ≤ 4, 2x₁ + x₂ ≤ 8, x ≥ 0 has optimum (4, 0), value 12. (a) Explain why (4, 0) is degenerate. (b) Write the dual and show that every y = (3 − 2s, s), s ∈ [0, 1], is dual optimal. (c) What does this imply for the shadow price of the first constraint? Compute the optimal value
