  if (SW.file !== file){
    SW.file = file; SW.doc=null; SW.pages=0; $("#swOf").textContent="of –";
    $("#swStage").innerHTML = `<div class="msg">Loading ${esc(fileShort(file))} slides…</div>`;
    const tok = ++SW.token;
    try{
      const L = await pdfLib();
      const doc = docCache[file] || (docCache[file] = await L.getDocument({url, isEvalSupported:false}).promise);
      if (tok!==SW.token) return;
      SW.doc = doc; SW.pages = doc.numPages;
    }catch(e){
      delete docCache[file];
      $("#swStage").innerHTML = `<div class="msg">Couldn't render the slides here. Use “Open PDF in new tab”.</div>`; return;
    }
  }
  drawPage();
}
async function drawPage(){
  if (!SW.doc) return;
  SW.page = Math.min(Math.max(1,SW.page), SW.pages);
  $("#swPage").value = SW.page; $("#swOf").textContent = "of "+SW.pages;
  $("#swOpen").href = SLIDES[SW.file]+"#page="+SW.page;
  const tok = ++SW.token;
  const page = await SW.doc.getPage(SW.page); if (tok!==SW.token) return;
  const stage = $("#swStage"); const avail = Math.max(260, stage.clientWidth-24);
  const base = page.getViewport({scale:1}); const scale = avail/base.width*SW.zoom;
  const dpr = Math.min(2, window.devicePixelRatio||1);
  const vp = page.getViewport({scale:scale*dpr});
  const canvas = document.createElement("canvas"); canvas.width=Math.floor(vp.width); canvas.height=Math.floor(vp.height);
  canvas.style.width = Math.floor(vp.width/dpr)+"px";
  if (SW.renderTask) { try{ SW.renderTask.cancel(); }catch(e){} }
  SW.renderTask = page.render({canvasContext:canvas.getContext("2d"), viewport:vp});
  try{ await SW.renderTask.promise; }catch(e){ return; }
  if (tok!==SW.token) return;
  stage.innerHTML=""; stage.appendChild(canvas); stage.scrollTo(0,0);
}
(function dragWindow(){
  const bar=$("#swBar"), sw=$("#sw"); let sx,sy,ox,oy,drag=false;
  bar.addEventListener("pointerdown", e=>{ if (e.target.closest("button")||window.innerWidth<=640) return; drag=true; sx=e.clientX; sy=e.clientY; const r=sw.getBoundingClientRect(); ox=r.left; oy=r.top; bar.setPointerCapture(e.pointerId); });
  bar.addEventListener("pointermove", e=>{ if(!drag) return; const x=Math.min(window.innerWidth-80,Math.max(-200,ox+e.clientX-sx)), y=Math.min(window.innerHeight-40,Math.max(0,oy+e.clientY-sy)); sw.style.left=x+"px"; sw.style.top=y+"px"; });
  bar.addEventListener("pointerup", ()=>{ drag=false; });
  let rt; new ResizeObserver(()=>{ clearTimeout(rt); rt=setTimeout(()=>{ if(!sw.hidden && SW.doc) drawPage(); },150); }).observe(sw);
})();

// ---------- events ----------
document.addEventListener("click", e=>{
  if (e.target.id==="scrim"){ closeDrawer(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, d = el.dataset;
  if (a==="view"){ UI.view=d.v; saveUI(); render(); window.scrollTo(0,0); }
  else if (a==="unit"){ UI.view="study"; UI.unit=d.u; saveUI(); render(); window.scrollTo(0,0); }
  else if (a==="tab"){ UI.tab=d.t; saveUI(); render(); }
  else if (a==="filter"){ UI.filter=d.f; saveUI(); render(); }
  else if (a==="logfilter"){ UI.logFilter=d.f; saveUI(); render(); }
  else if (a==="pick"){ const st=unitState(d.u); st.mc[d.i]={p:+d.o, ts:now()}; persist("unit-"+d.u); render(); }
  else if (a==="retry"){ const st=unitState(d.u); st.mc[d.i]={p:null, ts:now()}; persist("unit-"+d.u); render(); }
  else if (a==="reset-mc"){ if (el.dataset.confirm!=="1"){ el.dataset.confirm="1"; el.textContent="confirm reset?"; setTimeout(()=>{ if(el.isConnected){ el.dataset.confirm=""; el.textContent="reset"; } },3000); return; }
    const st=unitState(d.u); const t=now(); UM[d.u].mc.forEach((q,i)=>st.mc[i]={p:null,ts:t}); persist("unit-"+d.u); render(); }
  else if (a==="clarify"){ const e2=addToLog(d.u, +d.t, d.k); openDrawer({unit:d.u, t:+d.t, k:d.k, added:e2.n}); render(); }
  else if (a==="overview"){ openDrawer({unit:d.u, t:null, k:null, added:0}); }
  else if (a==="close-drawer"){ closeDrawer(); }
  else if (a==="ask"){ askClaude(d.k); }
  else if (a==="grade"){ grade(d.u, +d.i); }
  else if (a==="slides"){ openSlides(d.f, +d.p||1); }
  else if (a==="sw-close"){ $("#sw").hidden=true; }
  else if (a==="sw-step"){ SW.page += +d.s; drawPage(); }
  else if (a==="sw-zoom"){ SW.zoom = Math.min(3, Math.max(.5, SW.zoom*(+d.z>0?1.25:0.8))); drawPage(); }
  else if (a==="logopen"){ const ent=S.log[d.key]; if(ent) openDrawer({unit:ent.unit, t:ent.t, k:(ent.qs&&ent.qs.length)?ent.qs[ent.qs.length-1].k:null, added:0}); }
  else if (a==="logdel"){ const ent=S.log[d.key]; if(ent){ ent.del=true; ent.ts=now(); persist("log"); render(); } }
});
document.addEventListener("change", e=>{
  const el=e.target; if (el.dataset && el.dataset.act==="logdone"){ const ent=S.log[el.dataset.key]; if(ent){ ent.done=el.checked; ent.ts=now(); persist("log"); render(); } }
  if (el.id==="swPage"){ SW.page=parseInt(el.value,10)||1; drawPage(); }
});
let typeTimer=null;
document.addEventListener("input", e=>{
  const el=e.target; if (el.tagName!=="TEXTAREA" || !el.dataset.u) return;
  const st=unitState(el.dataset.u); const i=el.dataset.i; const cur=st.or[i]||{};
  st.or[i]=Object.assign(cur,{a:el.value, ats:now()});
  clearTimeout(typeTimer); typeTimer=setTimeout(()=>persist("unit-"+el.dataset.u), 500);
});
document.addEventListener("keydown", e=>{
  if (e.key==="Escape"){ if (!$("#sw").hidden) $("#sw").hidden=true; else if (drawerState) closeDrawer(); }
});
render();
setInterval(renderCountdown, 60000);
})();

</script>
