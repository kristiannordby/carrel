ⱼ − vᵢⱼ); xᵢⱼ ≥ 0. At an optimum each yᵢⱼ equals the larger piece. (b) Duplicate every arc: arc (i,j)¹ with capacity vᵢⱼ and cost cᵢⱼ, arc (i,j)² with infinite capacity and cost dᵢⱼ; keep nodes and bᵢ. Flow xᵢⱼ = x¹ + x². Because cᵢⱼ ≤ dᵢⱼ, an optimal solution never routes on (i,j)² while (i,j)¹ has spare capacity (shifting a unit lowers cost by dᵢⱼ − cᵢⱼ ≥ 0), so the cost equals fᵢⱼ(xᵢⱼ). Each new arc's column is +1 at i, −1 at j: a pure min-cost flow. (c) If dᵢⱼ < cᵢⱼ the cost is concave (economies of scale): the LP would use the cheaper d-arc from the first unit and undercharge, and the max-of-pieces epigraph no longer equals f. Modeling it exactly needs a binary indicating whether x exceeds vᵢⱼ. In (b), integral bᵢ and vᵢⱼ give an integral optimal flow by the integrality theorem.", "src": "Practice exam P3"}, {"q": "Recitation 5 network: arcs (capacity) s→a 3, s→b 2, a→b 1, a→t 2, b→t 2. (a) Write max flow as a min-cost network flow using a virtual arc. (b) Find the maximum flow and a flow achieving it. (c) Prove no larger flow exists. (d) Which single capacity increase by 1 would raise the max flow, and which would not?", "pts": 10, "t": 1, "rubric": ["(a) Add arc (t,s) with cost −1, capacity ∞; all other costs 0; bᵢ = 0 for all nodes — 3 pts", "(b) Max flow 4 with a valid flow (e.g., s→a 2, a→t 2, s→b 2, b→t 2) — 2 pts", "(c) Cut {s,a,b}|{t} has capacity 2 + 2 = 4; any s-t flow ≤ any cut capacity — 3 pts", "(d) Min cut {s,a,b} is unique: raising a→t or b→t gives 5; raising s→a, s→b or a→b leaves 4 — 2 pts"], "model": "(a) Add a virtual arc (t,s) with cost −1 and infinite capacity; set all real arc costs to 0, keep capacities, and set bᵢ = 0 at every node (a circulation). min Σ cᵢⱼxᵢⱼ = −x_ts, so minimizing cost maximizes the flow returning from t to s, i.e., the s-t flow. (b) Send 2 on s→a→t and 2 on s→b→t: flow 4 (a→b carries 0). (c) Cut S = {s,a,b}, T = {t}: arcs leaving S are a→t (2) and b→t (2), capacity 4. Every unit of s-t flow crosses the cut, so flow ≤ 4; the flow in (b) attains it. (d) Cut capacities: {s} = 5, {s,a} = 2 + 1 + 2 = 5, {s,b} = 3 + 2 = 5, {s,a,b} = 4; the min cut {s,a,b} is unique. Raising a→t to 3: cut {s,a,b} becomes 5, others stay 5, and the flow s→a 3, a→t 3, s→b 2, b→t 2 achieves 5. Same for b→t: route s→a 3, a→t 2, a→b 1, s→b 2, b→t 3 = 5. Raising s→a, s→b or a→b does not touch the unique min cut, so the max flow stays 4.", "src": "Rec5 p.10–11; L8 p.27–28"}, {"q": "True or false? Justify each in 1–3 sentences. (a) Every basic feasible solution of a min-cost flow problem on n nodes has exactly n − 1 arcs with positive flow. (b) If all arc costs are integers, there is an optimal dual vector p with integer entries. (c) A tree solution whose non-tree arcs all have nonnegative reduced cost is optimal (uncapacitated). (d) The leaky-pipe model with balance Σ xᵢⱼ − Σ ℓⱼᵢxⱼᵢ = bᵢ is a network flow problem.", "pts": 10, "t": 2, "rubric": ["(a) False: degenerate tree solutions have a zero-flow tree arc; at most n − 1 positive — 2 pts", "(b) True: potentials from p_root = 0 and pᵢ − pⱼ = cᵢⱼ on an optimal tree are sums/differences of integer costs — 3 pts", "(c) False as stated: needs primal feasibility (x ≥ 0); then CS gives optimality — 3 pts", "(d) False: coefficients ℓⱼᵢ ≠ ±1 break the incidence structure (generalized flow) — 2 pts"], "model": "(a) False. A BFS is a tree solution: non-tree arcs carry 0 and the n − 1 tree arcs carry x = B⁻¹b, but some tree arcs can carry 0 (degenerate tree solution, e.g., L8 iteration 1 with x₄₅ = 0). So at most n − 1 arcs are positive. (b) True. At an optimal tree, potentials solve p_root = 0 and pᵢ − pⱼ = cᵢⱼ on tree arcs; going down the tree each pᵢ is a signed sum of integer costs along the tree path to the root, so p is integral and dual feasible (c̄ ≥ 0). (Conversely, fractional costs, as in tutor matching with α, can give fractional duals.) (c) False as stated. Reduced costs ≥ 0 make p dual feasible, but optimality also needs the tree solution to be primal feasible (all tree flows ≥ 0). A tree solution with a negative tree flow is not feasible, so it cannot be optimal. If it is primal feasible, CS holds (tree arcs c̄ = 0, non-tree arcs x = 0) and it is optimal (Rec5 Q3 D). (d) False (practice exam 1e). The column of xⱼᵢ has +1 in row j and −ℓⱼᵢ in row i, not ±1, so A is not a node-arc incidence matrix; this is a generalized flow LP and integrality is not guaranteed.", "src": "L8 p.32, p.35; Rec5 p.33; Practice exam 1e"}, {"q": "Recitation 5 tutor matching: tutors Arthur, Alex, Julia; classes Math and Reading at 10–11 AM, Science and Spanish at 1–2 PM; value vₜc = αkₜc + (1 − α)dₜc. (a) Why does Model 1 (source → tutor → class) not capture the problem as a pure network flow? (b) Describe Model 2 (nodes, arcs, capacities, supplies) and write its objective. (c) What does the integrality theorem guarantee for primal and dual? (d) How can Model 2 be turned into an assignment problem?", "pts": 10, "t": 5, "rubric": ["(a) A tutor node cannot prevent two classes in the same time slot; the no-conflict rule is a side constraint, not flow balance or arc capacity — 2 pts", "(b) Source supply 4; tutor-hour nodes; class nodes demand −1; arcs s→(t,h) cap 1, (t,h)→c cap 1 if available; balance rows — 3 pts", "(b) Objective max Σ vₜc xₜc (or min of −v) — 1 pts", "(c) Integral b, u ⇒ integral optimal matching exists; duals may be fractional since v is fractional — 2 pts", "(d) Add 2 artificial class nodes with value 0 and demand 1 (6 tutor-hours × 6 classes), each tutor-hour supply 1 — 2 pts"], "model": "(a) Model 1 sends flow source → tutor → class with arc capacities 1. A tutor node aggregates all of the tutor's hours, so nothing in flow balance or arc capacities stops the same tutor from being sent to two classes held at the same time. The rule Σ_{c at hour h} xₜc ≤ 1 is a valid linear constraint, but it is a side constraint, so the model becomes an LP that is no longer a pure network flow. (b) Model 2 splits each tutor into tutor-hour nodes (Arthur 10–11, Arthur 1–2, Alex 10–11, …, 6 nodes). Source s has supply |C| = 4; tutor-hour nodes are transshipment (b = 0); class nodes have b = −1. Arcs s→(t,h) with capacity 1 (one class per tutor per hour) and (t,h)→c with capacity 1 when tutor t can teach class c held at hour h. Balance: Σₜ x_st = 4; x_st − Σ_c xₜc = 0; −Σₜ xₜc = −1. Objective: max Σ vₜc xₜc. (c) Supplies, demands and capacities are integral, so some optimal BFS is integral: a genuine 0/1 matching. The values vₜc are fractional, and potentials are sums of costs along tree paths, so optimal duals need not be integral. (d) With 6 tutor-hour nodes and 4 classes, add 2 artificial class nodes of value 0 and demand 1, connected to every tutor-hour, and give each tutor-hour supply 1 (removing the source). This is a 6 × 6 assignment problem; dummy classes absorb the two idle tutor-hours without changing the value. Removing supply nodes could cut off needed tutors; a value of −M on dummies only adds the constant −2M since both dummies must be matched.", "src": "Rec5 p.18–23, p.34"}]}, {"id": "l9", "title": "Case study: World Food Programme", "deck": "Fall_2026_15_C57_Lec9.pdf", "brief": "Lecture 9 is a case study of the UN World Food Programme's supply chain (Syria 2016). It shows how a formulation grows step by step: a single-commodity network flow (Model 1), a multicommodity flow with demand per food (Model 2), and finally the full model, which combines the multicommodity flow with a diet model in which ration composition is itself a decision. The mini example (3 suppliers, 2 hubs, 3 demand nodes, 3 foods) is where exam-style calculations live: counting variables and constraints, computing landed costs, and reading duals as the landed cost per kcal of the marginal food. The results show transport dominating cost (about 97%), near-sourcing, and baskets with nearly the same nutritional value at 74% of the cost, which fed about one million more people. Know why each model fails, why joint constraints break network structure, and how to model extensions linearly.", "keyPoints": ["Bottleneck is transport, not food supply; transport ≈ 97% of Syria cost", "Model 1: one commodity ⇒ fails; Model 2: xᵢⱼₖ per commodity, separable ⇒ fails (needs are nutrients)", "Full model: Σᵢ xᵢⱼₖ ≥ Dⱼrₖⱼ and Σₖ Vₖₗ rₖⱼ ≥ minₗ; LP, not a network", "Syria: 7 × 7 × 14 = 686 flow variables; 7 × 11 = 77 nutrition rows", "Mini: 12 arcs × 3 foods = 36 variables; 6 balance + 9 nutrition rows; optimum 9,569", "Energy dual = cheapest landed cost per kcal (H: 98/340 = 0.288); slack protein ⇒ dual 0", "Compare foods per nutrient unit, not per kg; ties ⇒ alternative optima", "Syria: 96.0% NV at 74% cost chosen ⇒ 4M → 5M fed; Iraq: −17% cost"], "topics": [{"name": "WFP context & data", "explain": "Enough food exists globally; the bottleneck is moving it to beneficiaries. WFP feeds about 80M people a year. Syria 2016 data: procurement cost per supply node and commodity (14 commodities), transport cost per arc ($/kg), targeted population per demand node, nutrient content per food and daily requirements per person (11 nutrients, e.g., 2,100 kcal).", "slides": [{"file": "Fall_2026_15_C57_Lec9.pdf", "page": 6, "label": "Enough food, transport issue"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 11, "label": "Procurement costs"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 12, "label": "Transport costs, demand"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 13, "label": "Nutrition data"}]}, {"name": "Network → multicommodity", "explain": "Model 1 (single-commodity min-cost flow) cannot tell foods apart. Model 2 (multicommodity flow) indexes flows xᵢⱼₖ by commodity and imposes demand per commodity; without joint constraints it separates into one network per commodity. It still fails because beneficiaries need nutrients, not specific foods, and foods substitute for each other.", "slides": [{"file": "Fall_2026_15_C57_Lec9.pdf", "page": 15, "label": "Model 1: network flows"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 16, "label": "Model 2: multicommodity flows"}]}, {"name": "Diet model & full model", "explain": "Full model = multicommodity flow + diet model. Variables: flows xᵢⱼₖ and ration rₖⱼ (kg per person). Constraints: balance at intermediate nodes per commodity; deliveries at terminal j meet Dⱼ·rₖⱼ (linear, since Dⱼ is data); Σₖ Vₖₗ rₖⱼ ≥ minₗ per nutrient. Objective: procurement + transport + handling. The nutrition rows couple commodities, so the full model is an LP but not a network.", "slides": [{"file": "Fall_2026_15_C57_Lec9.pdf", "page": 22, "label": "Full model inputs"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 23, "label": "Full model formulation"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 25, "label": "Model components"}]}, {"name": "Mini example", "explain": "Supply A, B, C; transshipment D, E; demand F, G, H; beans, milk, lentils; 12 arcs × 3 = 36 variables; 6 balance + 9 nutrition constraints. Optimum 9,569: energy is bought with the cheapest food per kcal at each node (beans at F, lentils at G and H), milk only for vitamin A. Duals: energy price = landed cost per kcal of the marginal food; protein duals 0 (slack).", "slides": [{"file": "Fall_2026_15_C57_Lec9.pdf", "page": 17, "label": "Network"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 18, "label": "Costs"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 19, "label": "Nutrition"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 20, "label": "Formulation"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 21, "label": "Optimal solution"}]}, {"name": "Results & impact", "explain": "Syria: transport ≈ 97% of cost, so near-sourcing (one supplier per node and commodity) emerges. Basket mostly beans, bulgur, lentils, milk, oil, salt. Current basket 95.8% NV; options 96.0% NV at 74% cost (chosen) and 97.5% at 85%; same budget feeds 5M instead of 4M. Iraq 2015: 17% cost reduction ($1.12M/month, 85,000 more people).", "slides": [{"file": "Fall_2026_15_C57_Lec9.pdf", "page": 28, "label": "Optimal cost breakdown"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 29, "label": "Food basket composition"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 30, "label": "Near-sourcing"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 35, "label": "Syria 2016 impact"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 36, "label": "Iraq 2015"}]}, {"name": "Extensions & deployment", "explain": "Extensions: multi-period (prices, lead times), beneficiary groups, financing modalities, capacity and uncertainty on transport, min/max food-group shares, equity. Ratio constraints stay linear after multiplying out; joint capacities make the model non-network. Deployment via the Optimus platform (inputs → engine → optimal plan and scenario analyses) faces data, scalability, disruption and re-optimization challenges.", "slides": [{"file": "Fall_2026_15_C57_Lec9.pdf", "page": 26, "label": "Model extensions"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 32, "label": "Deployment challenges"}, {"file": "Fall_2026_15_C57_Lec9.pdf", "page": 33, "label": "Optimus architecture"}]}], "mc": [{"d": "easy", "q": "Per the WFP case, why do people go hungry even though there is enough food globally?", "o": ["Moving food to beneficiaries is the bottleneck", "Global food production falls short of total need", "Procurement prices are prohibitive in every market", "Nutritional requirements of beneficiaries are unknown"], "e": "Slide 5: enough food globally, but a food transportation issue. The results confirm it: transport is about 97% of cost.", "t": 0, "src": "Lec9 p.6"}, {"d": "easy", "q": "Syria 2016 model: 7 supply nodes, 7 demand nodes, 14 commodities, no transshipment. How many flow variables?", "o": ["686", "98", "49", "1,372"], "e": "One xᵢⱼₖ per supply node, demand node and commodity: 7 × 7 × 14 = 686. 98 = 7 × 14 would be the ration variables.", "t": 0, "src": "Lec9 p.24"}, {"d": "easy", "q": "Why does Model 1 (a single-commodity network flow) fail for WFP?", "o": ["WFP ships many different food commodities", "Its arc costs are nonlinear in distance traveled", "Supply nodes have no capacity limits in Model 1", "It cannot represent transshipment (hub) nodes"], "e": "Model 1 has one flow variable per arc, so it cannot tell beans from milk.", "t": 1, "src": "Lec9 p.15"}, {"d": "easy", "q": "In the full WFP model, the diet-model constraint is:", "o": ["Σₖ Vₖₗ rₖⱼ ≥ minₗ for all terminals j, nutrients l", "Σᵢ xᵢⱼₖ = Σᵢ xⱼᵢₖ at every intermediate node j", "Σⱼ xᵢⱼₖ ≤ Sᵢₖ at every source i and commodity k", "rₖⱼ ≤ Dⱼ for every commodity k and node j"], "e": "The ration must meet each nutrient requirement. The balance rows are the flow part of the model.", "t": 2, "src": "Lec9 p.23"}, {"d": "easy", "q": "Mini example: 12 arcs and 3 commodities. How many decision variables?", "o": ["36", "12", "15", "45"], "e": "One variable per arc and commodity: 12 × 3 = 36. The 15 is the constraint count (6 balances + 9 nutrition rows).", "t": 3, "src": "Lec9 p.20"}, {"d": "easy", "q": "Syria results: approximate share of total cost due to transportation:", "o": ["97%", "50%", "20%", "75%"], "e": "About 1.07M of transport vs 28.7k of procurement.", "t": 4, "src": "Lec9 p.28"}, {"d": "easy", "q": "Mini example: why are there only 6 flow-balance constraints?", "o": ["Balance is imposed only at hubs D and E, once per commodity", "Balance is imposed at supply nodes A, B, C, once per hub", "Demand nodes F, G, H need balance only for energy and protein", "One balance row per arc entering D or E, ignoring commodity"], "e": "2 transshipment nodes × 3 commodities = 6. Supply nodes are uncapacitated sources and demand nodes carry nutrition rows (9) instead of balance rows. There are also 6 arcs into D/E, but rows are per node and commodity, not per arc.", "t": 3, "src": "Lec9 p.20"}, {"d": "easy", "q": "In the 'model components' slide, food basket optimization corresponds to:", "o": ["The diet model", "The multicommodity flow model", "The shortest path model", "The assignment model"], "e": "Supply chain optimization = multicommodity flow; food basket optimization = diet model (choose rations to meet nutrient requirements). The full WFP model combines both.", "t": 2, "src": "Lec9 p.25"}, {"d": "easy", "q": "Syria 2016: with the same budget, the chosen food basket let WFP feed:", "o": ["About 5 million people instead of 4 million", "About 4 million people instead of 3 million", "About 821 million people instead of 80 million", "About 85,000 more people than before"], "e": "Slide 34: 96.0% nutritional value at 74% of cost, so one million more people fed. 85,000 is the Iraq 2015 figure; 821M is the global hunger count.", "t": 4, "src": "Lec9 p.35"}, {"d": "easy", "q": "In the Optimus architecture, the optimization engine's outputs are:", "o": ["An optimal plan and scenario analyses", "Procurement prices and nutrition data", "Beneficiary counts and funding levels", "Shipping and warehousing records"], "e": "Inputs: WFP data (shipping, transport, warehousing, procurement, funding, beneficiaries, nutrition) plus field experts. Outputs: optimal plan and scenario analyses.", "t": 5, "src": "Lec9 p.33"}, {"d": "medium", "q": "Same Syria model with 11 nutrient requirements. How many nutrition constraints?", "o": ["77", "154", "686", "11"], "e": "One row per demand node and nutrient: 7 × 11 = 77, matching slide 23.", "t": 0, "src": "Lec9 p.24"}, {"d": "medium", "q": "Why does Model 2 (multicommodity flow with demand per commodity) still fail?", "o": ["Needs are in nutrients, and foods substitute for each other", "It cannot represent several supply nodes at once", "Its objective cannot sum transport cost over commodities", "It forces every shipment quantity to be integral"], "e": "Model 2 fixes the kilograms of each food in advance. The diet model makes the basket a decision.", "t": 1, "src": "Lec9 p.16"}, {"d": "medium", "q": "Why is the delivery constraint Σᵢ xᵢⱼₖ ≥ Dⱼ·rₖⱼ linear?", "o": ["Dⱼ is data, so Dⱼ·rₖⱼ is a constant times a variable", "rₖⱼ is fixed before the optimization is run", "Both are variables, but their product is convex", "It is linear only when Dⱼ = 1 at every node"], "e": "Only rₖⱼ is a decision variable. If the number served were also a decision, the product would be bilinear.", "t": 2, "src": "Lec9 p.23"}, {"d": "medium", "q": "Mini example: only milk contains vitamin A (280 µg/kg) and F needs 500 µg. How much milk reaches F?", "o": ["1.79 kg", "5.6 kg", "0.56 kg", "2.80 kg"], "e": "500/280 = 1.786 kg; the constraint binds because milk is the dearest energy source. 0.56 inverts the ratio.", "t": 3, "src": "Lec9 p.19, p.21"}, {"d": "medium", "q": "Landed cost of lentils at H via C→E→H (procurement 51 at C, C→E 16, E→H 31):", "o": ["98 per kg", "67 per kg", "82 per kg", "119 per kg"], "e": "51 + 16 + 31 = 98. The route via D costs 51 + 21 + 47 = 119; 67 stops at the hub.", "t": 3, "src": "Lec9 p.18"}, {"d": "medium", "q": "Syria 2016: the basket WFP chose gave 96.0% nutritional value at what share of the current cost?", "o": ["74%", "85%", "95.8%", "83%"], "e": "96.0% NV at 74% of cost (chosen); 97.5% at 85% was the alternative; 95.8% was the current basket's NV.", "t": 4, "src": "Lec9 p.35"}, {"d": "medium", "q": "Extension: at least 40% of each node's energy must come from cereals. How is it modeled?", "o": ["Σ_{k∈cereals} V_{k,E} rₖⱼ ≥ 0.4·Σₖ V_{k,E} rₖⱼ (linear)", "It needs a binary variable for each cereal commodity", "It is a nonlinear ratio constraint on the rations", "It cannot be modeled because rations are variables"], "e": "Multiply the ratio out: both sides are linear in r, so the model stays an LP (but no longer a network).", "t": 5, "src": "Lec9 p.26"}, {"d": "hard", "q": "Model 2 contains no constraint linking different commodities. Then it:", "o": ["Separates into one network flow per commodity", "Is infeasible unless all commodities share one source", "Becomes a diet model with nutrient-level demand", "Requires binary variables to link the commodities"], "e": "Every row involves a single k, so the LP decomposes by commodity. A joint capacity Σₖ xᵢⱼₖ ≤ uᵢⱼ would couple them.", "t": 1, "src": "Lec9 p.16"}, {"d": "hard", "q": "Adding a joint truck capacity Σₖ xᵢⱼₖ ≤ uᵢⱼ to a multicommodity flow:", "o": ["Breaks the network matrix, so integrality is no longer guaranteed", "Keeps a network matrix, since all of its coefficients are +1", "Makes the problem nonlinear in the flow variables", "Has no effect on the LP relaxation or its solution"], "e": "The row puts several +1s in the same row across commodity blocks, so columns get a third nonzero. All +1 coefficients are not enough: each column needs exactly one +1 and one −1.", "t": 1, "src": "Lec9 p.16"}, {"d": "hard", "q": "Mini example: H's energy constraint has a dual of 0.288 per kcal. What is it?", "o": ["Lentils' landed cost per kcal at H: 98/340", "Milk's landed cost per kcal at H: 111/360", "The average cost per kcal of H's basket", "Lentils' procurement cost per kcal: 51/340"], "e": "Extra energy at H is bought with the cheapest marginal food, lentils, at landed cost 98 per 340 kcal. Milk (0.308) is only bought for vitamin A.", "t": 3, "src": "Lec9 p.21"}, {"d": "hard", "q": "Mini example: H's vitamin A requirement doubles from 5,000 to 10,000 µg. Cost rises by about:", "o": ["129 (5,000 × 0.0258, the vitamin A shadow price)", "0, since milk is already being delivered to H", "1,982 (17.86 kg more milk at 111 per kg)", "9,569, since the whole cost roughly doubles"], "e": "Re-solve: +129.20. Extra milk also supplies energy, so lentils drop (42.86 → 23.95 kg); pricing the milk alone ignores that credit.", "t": 3, "src": "Lec9 p.21"}, {"d": "hard", "q": "Mini example: transport cost E→H rises from 31 to 40 per kg. What happens?", "o": ["Same basket and routes; cost rises by about 546", "H switches to beans from A; total cost unchanged", "H's lentils are rerouted through hub D instead", "Cost rises by exactly 9 for the whole plan"], "e": "Lentils via E still land at 107 vs 119 via D, and milk/beans stay dearer per kcal, so nothing changes except cost: 9,568.86 → 10,115.29.", "t": 3, "src": "Lec9 p.18"}, {"d": "hard", "q": "Mini example: why do the protein constraints have zero duals?", "o": ["They are slack (protein oversupplied), so CS gives 0", "Protein has no procurement cost of its own", "Protein is measured in grams rather than kcal", "Milk alone supplies all the protein required"], "e": "G gets 36·7.14 + 20·17.14 = 600 g vs 208 required. Extra protein requirement costs nothing at the margin.", "t": 3, "src": "Lec9 p.21"}, {"d": "hard", "q": "Why does near-sourcing (one supplier per commodity and node) emerge in the Syria solution?", "o": ["Transport dominates, and uncapacitated costs pick one cheapest path", "WFP policy requires a single supplier per demand node", "Network integrality forces each node to use one supplier", "Procurement prices are identical at every supply node"], "e": "Linear uncapacitated costs pick one cheapest path per pair; splits need ties or binding capacities. Integrality concerns integer flows, not single sourcing.", "t": 4, "src": "Lec9 p.30"}, {"d": "hard", "q": "Mini example: a solver reports procurement 5,009 while slide 20 reports 4,996; both totals are 9,569. Why?", "o": ["Milk lands at F for 120/kg via B→D, C→D and C→E: alternative optima", "The solver's solution is suboptimal by about 13", "Slide 20 omits a handling cost on milk passing through D", "Rounding of the 1.79 kg of milk shifts procurement by 13"], "e": "Landed milk at F: B→D: 71+14+35 = 120; C→D: 64+21+35 = 120; C→E: 64+16+40 = 120. Ties give alternative optima with the same total but a different split: buying 1.786 kg at C instead of B saves 7·1.786 ≈ 12.5 in procurement and adds the same amount in transport.", "t": 3, "src": "Lec9 p.18, p.21"}, {"d": "hard", "q": "Mini example: lentil procurement at C rises from 51 to 60 per kg. What happens at the optimum?", "o": ["Lentils drop out: H turns to all milk, G to beans plus milk; cost +338", "Same basket; cost rises by 9 per kg of lentils, about +540", "H keeps lentils, since 107 per kg still beats milk's 111 per kg", "H switches to beans from A; G keeps lentils; cost rises by about 120"], "e": "Compare per kcal, not per kg. At H: lentils 107/340 = 0.315 > milk 111/360 = 0.308, so milk supplies energy (and vitamin A, whose H dual drops to 0). At G: beans via A→D 109/335 = 0.325 < milk 0.336 < lentils 0.344. Re-solve: 9,906.75 (+337.89).", "t": 3, "src": "Lec9 p.18, p.19"}, {"d": "hard", "q": "Is the full WFP model (multicommodity flow + diet model) a network flow with guaranteed integral solutions?", "o": ["No: nutrition rows weight rations by Vₖₗ and couple commodities", "Yes: each flow still has one +1 and one −1 in the balance rows", "Yes: ≥ nutrition rows preserve the incidence-matrix structure", "No, but only because procurement costs differ by supply node"], "e": "Rows Σₖ Vₖₗ rₖⱼ ≥ minₗ and Σᵢ xᵢⱼₖ ≥ Dⱼrₖⱼ have non-±1 coefficients across commodities, so the matrix is not an incidence matrix. Integrality is not needed anyway: kilograms are continuous. Costs never affect the matrix structure.", "t": 2, "src": "Lec9 p.23"}], "or": [{"q": "Formulate the full WFP model (slide 22–23) with transshipment: define sets, parameters and decision variables, write the objective and all constraints, and state which parts are the multicommodity flow and which are the diet model.", "pts": 10, "t": 2, "rubric": ["Sets: supply, intermediate, terminal nodes, arcs, commodities k, nutrients l — 1 pts", "Parameters: procurement pᵢₖ, transport tᵢⱼ (handling), demand Dⱼ, nutrient values Vₖₗ, requirements minₗ — 1 pts", "Variables xᵢⱼₖ ≥ 0 and rations rₖⱼ ≥ 0 — 2 pts", "Objective: procurement + transport (+ handling) summed over arcs and commodities — 2 pts", "Balance at intermediate nodes per commodity; delivery Σᵢ xᵢⱼₖ ≥ Dⱼrₖⱼ at terminals — 2 pts", "Diet rows Σₖ Vₖₗ rₖⱼ ≥ minₗ per terminal and nutrient; identifies flow vs diet parts — 2 pts"], "model": "Sets: supply nodes S, intermediate nodes I, terminal (demand) nodes T, arcs A, commodities K, nutrients L. Parameters: procurement cost pᵢₖ at i ∈ S, transport (plus handling) cost tᵢⱼ per kg on (i,j) ∈ A, beneficiaries Dⱼ at j ∈ T, nutrient content Vₖₗ per kg, requirement minₗ per person. Variables: xᵢⱼₖ ≥ 0 kg of k shipped on (i,j); rₖⱼ ≥ 0 kg of k in the daily ration at j. Objective: min Σ_{(i,j)∈A, i∈S} Σₖ pᵢₖ xᵢⱼₖ + Σ_{(i,j)∈A} Σₖ tᵢⱼ xᵢⱼₖ. Constraints: (1) intermediate balance Σᵢ xᵢⱼₖ = Σᵢ xⱼᵢₖ ∀j ∈ I, k (what comes in comes out); (2) terminal delivery Σᵢ xᵢⱼₖ ≥ Dⱼ rₖⱼ ∀j ∈ T, k (meets the ration; linear because Dⱼ is data); (3) nutrition Σₖ Vₖₗ rₖⱼ ≥ minₗ ∀j ∈ T, l; optional supply limits Σⱼ xᵢⱼₖ ≤ Sᵢₖ. (1)–(2) with the flow costs are the multicommodity flow part (supply chain optimization); (3) with r is the diet model (food basket optimization). The rations link commodities, so the basket is a decision rather than fixed per-commodity demand.", "src": "Lec9 p.22–23, p.25"}, {"q": "Explain the modeling progression Model 1 → Model 2 → full model. For each step state what the model captures, why it fails for WFP, and the structural consequence (network or not; separable or not). Then explain what happens to Model 2 if a joint truck capacity Σₖ xᵢⱼₖ ≤ uᵢⱼ is added.", "pts": 10, "t": 1, "rubric": ["Model 1: single-commodity min-cost flow; fails because WFP ships many commodities — 2 pts", "Model 2: flows per commodity, demand per commodity; separates into |K| independent networks — 2 pts", "Model 2 fails: needs are nutrients; foods substitute; fixed per-food demand forces a basket — 2 pts", "Full model adds rations + diet rows; LP but not a network — 2 pts", "Joint capacity couples commodities, breaks network structure/separability; integrality no longer guaranteed — 2 pts"], "model": "Model 1 is a pure min-cost flow: one variable per arc, balance at every node, capacities and demands in kg. It cannot distinguish beans from milk, so it cannot represent a multi-food supply chain. Model 2 indexes flows by commodity, xᵢⱼₖ, with balance and demand constraints for each k and costs summed over k. Since no constraint mixes commodities, it decomposes into one independent network flow per commodity (each integral if its data are). It fails because demand is specified per food, while beneficiaries need nutrients and foods are substitutes; fixing kg per food removes the main lever (choosing the basket). The full model adds ration variables rₖⱼ, delivery rows Σᵢ xᵢⱼₖ ≥ Dⱼrₖⱼ and diet rows Σₖ Vₖₗ rₖⱼ ≥ minₗ. These rows couple commodities with coefficients Vₖₗ, so the model is an LP but not a network. Adding Σₖ xᵢⱼₖ ≤ uᵢⱼ to Model 2 puts each flow variable in a third row (one per arc shared across commodities), so columns no longer have exactly one +1 and one −1. The problem no longer separates by commodity and integrality is not guaranteed; it must be solved as a general LP.", "src": "Lec9 p.15–16, p.23"}, {"q": "Mini example optimum (cost 9,569): F gets beans via A→D plus 1.79 kg milk; G and H get lentils from C via E plus milk. Solver duals: H energy 0.288, H vitamin A 0.0258, G energy 0.318, F energy 0.313, all protein duals 0. (a) Derive the H energy dual from landed costs. (b) Derive the H vitamin A dual. (c) Estimate the cost of 1,000 extra kcal at G and justify. (d) Explain the zero protein duals.", "pts": 10, "t": 3, "rubric": ["(a) Landed lentils at H via C→E→H = 51+16+31 = 98; 98/340 = 0.288 — 3 pts", "(b) Milk at H 64+16+31 = 111/kg gives 360 kcal + 280 µg; (111 − 360·0.288)/280 = 0.0258 — 3 pts", "(c) Lentils at G 51+16+41 = 108; 108/340 = 0.318 per kcal; +1,000 kcal ≈ +318 (re-solve 317.6) — 2 pts", "(d) Protein rows slack (e.g., G 600 g vs 208), CS ⇒ dual 0 — 2 pts"], "model": "(a) The marginal kcal at H is bought with the cheapest food per kcal. Lentils from C via E: 51 + 16 + 31 = 98 per kg, 340 kcal/kg → 98/340 = 0.288 per kcal (milk via E: 111/360 = 0.308; beans: ≥ 117/335 = 0.349). So the energy dual is 0.288. (b) Vitamin A comes only from milk. One kg of milk at H costs 111 and also supplies 360 kcal, which saves 360·0.288 = 103.8 of lentils. Net cost of 280 µg = 111 − 103.8 = 7.2, so the dual is 7.2/280 = 0.0258 per µg. (c) At G the energy dual equals lentils' landed cost per kcal: (51 + 16 + 41)/340 = 108/340 = 0.318. With the basis unchanged, 1,000 kcal more costs ≈ 1,000·0.318 = 318 (≈ 2.94 kg lentils); re-solving gives +317.6. (d) Protein requirements are oversupplied: G receives 7.14·36 + 17.14·20 = 600 g vs 208 g required; H receives 1,500 g vs 520. Slack constraints have zero dual by complementary slackness, so tightening protein slightly costs nothing.", "src": "Lec9 p.18–21"}, {"q": "Syria 2016 results. (a) Using the cost table (transport ≈ 1.07M, procurement ≈ 28.7k), compute the transport share and explain why near-sourcing emerges. (b) WFP chose 96.0% NV at 74% cost over 97.5% NV at 85% cost (current basket: 95.8% NV). Quantify the trade-off and argue for the choice. (c) Why do per-person costs vary so much (e.g., Idleb 0.99 vs Qamishli 27.14)?", "pts": 10, "t": 4, "rubric": ["(a) Share ≈ 1.07M/(1.07M + 0.029M) ≈ 97% — 2 pts", "(a) Near-sourcing: transport dominates; linear uncapacitated costs pick the single cheapest path per node and commodity — 2 pts", "(b) Extra 1.5 NV points cost 11 points of budget; with fixed budget, people fed ∝ 1/cost (1/0.74 ≈ 1.35× vs 1/0.85 ≈ 1.18×) — 3 pts", "(b) Chosen option: nearly same nutrition as current, ~1M more people fed (4M → 5M) — 1 pts", "(c) Cost/person driven by transport distance from supply (Idleb near Aleppo; Qamishli, Dayr Az Zor far) — 2 pts"], "model": "(a) Transport ≈ 41.6k + 309.5k + 367.9k + 174.2k + 172.9k ≈ 1.066M; procurement ≈ 28.7k; share ≈ 1.066/(1.066 + 0.029) ≈ 97%. Because transport dominates and costs are linear with no binding capacities, each demand node takes each commodity from the supplier with the cheapest landed cost, usually the nearest one; splits only arise from ties or binding limits. (b) Going from 96.0% to 97.5% NV (+1.5 points) raises cost from 74% to 85% of current (+11 points, about 15% more). Under a fixed budget the number served scales roughly with 1/cost: 1/0.74 ≈ 1.35 vs 1/0.85 ≈ 1.18 times today's beneficiaries. The 74% basket already matches the current basket's nutrition (95.8%), so the extra 1.5 points are not worth feeding far fewer people; slide 34 reports about 1 million more people fed (4M → 5M). (c) Procurement per person is similar across nodes; transport is not. Idleb is close to Aleppo/Hama (Aleppo→Idleb 0.13 $/kg), while Qamishli and Dayr Az Zor are far from all suppliers (Aleppo→Qamishli 0.85, Hama→Dayr Az Zor 0.82 $/kg), so their cost per person is more than 25× higher.", "src": "Lec9 p.12, p.28, p.30, p.35"}, {"q": "Model three extensions from slide 25 in the full WFP model and state for each whether the model stays an LP and whether it stays a network: (a) at least 40% of each node's energy from cereals; (b) a truck capacity uᵢⱼ shared by all commodities on arc (i,j); (c) a two-period version with warehouse inventory at intermediate nodes and lead time of one period on arcs into terminals.", "pts": 10, "t": 5, "rubric": ["(a) Σ_{k∈cereals} V_{k,E} rₖⱼ ≥ 0.4 Σₖ V_{k,E} rₖⱼ; linear after multiplying out — 2 pts", "(a) LP yes, network no (it already was not) — 1 pts", "(b) Σₖ xᵢⱼₖ ≤ uᵢⱼ; LP yes; couples commodities — 2 pts", "(c) Time-indexed x and inventory sⱼₖₜ with balance sⱼₖ,ₜ₋₁ + inflow − outflow = sⱼₖₜ; lead time via xᵢⱼₖ,ₜ₋₁ arriving at t — 3 pts", "(c) Stays an LP; inventory carryover is an arc in a time-expanded network — 2 pts"], "model": "(a) Let E denote energy. Constraint: Σ_{k∈cereals} V_{k,E} rₖⱼ ≥ 0.4·Σ_{k∈K} V_{k,E} rₖⱼ for every terminal j, i.e., Σ_{k∈cereals} 0.6 V_{k,E} rₖⱼ − Σ_{k∉cereals} 0.4 V_{k,E} rₖⱼ ≥ 0. Both sides are linear in r, so it remains an LP; it is not a network row (the full model is not a network anyway). (b) Σₖ xᵢⱼₖ ≤ uᵢⱼ for each arc: linear, so still an LP, but it couples commodities on the arc, so even the flow part loses its per-commodity network structure and separability; integrality would not be guaranteed. (c) Index flows and rations by period t ∈ {1, 2}: xᵢⱼₖₜ, rₖⱼₜ, inventory sⱼₖₜ ≥ 0 at intermediate j. Balance at intermediate j: sⱼₖ,ₜ₋₁ + Σᵢ xᵢⱼₖₜ = Σᵢ xⱼᵢₖₜ + sⱼₖₜ (with given s at t = 0). Lead time: shipments into terminal j leaving in t − 1 arrive in t: Σᵢ xᵢⱼₖ,ₜ₋₁ ≥ Dⱼₜ rₖⱼₜ. Nutrition rows per period, time-varying prices pᵢₖₜ, and holding costs on s in the objective. All constraints are linear, so it stays an LP; the flow part is a time-expanded network (inventory = arc from (j,t−1) to (j,t)), but the diet rows still make the full model a non-network LP.", "src": "Lec9 p.26"}]}, {"id": "l10", "title": "Integer optimization modeling", "deck": "Fall_2026_15_C57-L10.pdf", "brief": "Lecture 10 introduces integer and mixed-integer optimization as a modeling language: binary variables capture go/no-go decisions, logical relations, and fixed costs, which LP cannot express. It walks through canonical models (knapsack, facility location, network design, vehicle routing) and the standard logic and big-M constraints. The second half is about formulation quality: many formulations share the same integer feasible set but have different LP relaxations, and the tighter relaxation gives better bounds and faster solves. An ideal formulation has an integral relaxation (P = conv(F)) and can be solved as an LP. MST and TSP show formulations with exponentially many constraints whose strength differs. Exam questions test writing correct logic/big-M rows, comparing relaxations, and justifying T/F statements about ideal formulations (HW3 P1).", "keyPoints": ["BO x ∈ {0,1}ⁿ; IO x ∈ Zⁿ₊; MIO x ∈ Zᵖ₊ × ℝⁿ⁻ᵖ₊", "Logic: prerequisite xⱼ ≤ xₖ; exclusion xₖ + xₗ ≤ 1; k or l ⇒ j: xₖ + xₗ ≤ 2xⱼ", "Big-M: yⱼ ≤ Mxⱼ; smallest valid M = max LHS − RHS over the bounded domain", "Same F, smaller P ⇒ (min) Z_LO(weak) ≤ Z_LO(strong) ≤ Z_IO", "FL (xᵢⱼ ≤ yⱼ) beats AFL (Σᵢ xᵢⱼ ≤ m·yⱼ): more rows, tighter LP, faster", "Ideal: P = conv(F) ⇔ integral optimum for every c with finite min; not every optimum integral", "MST: P_sub ⊆ P_cut and subtour is ideal; TSP: P_sub = P_cut, no ideal formulation known"], "topics": [{"name": "Classes & canonical models", "explain": "Binary (x ∈ {0,1}ⁿ), integer (x ∈ Zⁿ₊) and mixed-integer (x ∈ Zᵖ₊ × ℝⁿ⁻ᵖ₊) problems look like LPs but are much harder. Canonical models: knapsack, capacitated facility location (build xⱼ, produce yⱼ ≤ Cⱼxⱼ, ship zᵢⱼ, unmet uᵢ), network design (arc activation, Σₖ yᵢⱼₖ ≤ uᵢⱼxᵢⱼ), and vehicle routing. Know what each constraint does and what is missing (VRP slide has no subtour elimination).", "slides": [{"file": "Fall_2026_15_C57-L10.pdf", "page": 3, "label": "Binary, integer, mixed-integer"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 5, "label": "Knapsack"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 11, "label": "Facility location formulation"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 15, "label": "Network design formulation"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 17, "label": "Vehicle routing formulation"}]}, {"name": "Binary logic", "explain": "Binary variables encode logic: at most one Σxⱼ ≤ 1, exactly k Σxⱼ = k, prerequisite xⱼ ≤ xₖ, either prerequisite xⱼ ≤ xₖ + xₗ, together xₖ = xₗ, exclusion xₖ + xₗ ≤ 1, and 'k or l ⇒ j' xₖ + xₗ ≤ 2xⱼ. Products of binaries linearize with w ≤ x₁, w ≤ x₂, w ≥ x₁ + x₂ − 1. Always check every 0/1 combination; disaggregated rows (xₖ ≤ xⱼ, xₗ ≤ xⱼ) are tighter than the aggregated one.", "slides": [{"file": "Fall_2026_15_C57-L10.pdf", "page": 19, "label": "Modeling power of binary variables"}, {"file": "Recitation6.pdf", "page": 4, "label": "Rec 6 binary modeling"}, {"file": "Recitation6.pdf", "page": 8, "label": "Rec 6 Q1 logic constraint"}]}, {"name": "Big-M & fixed costs", "explain": "Link continuous to binary: yⱼ ≤ Mxⱼ forces yⱼ = 0 when xⱼ = 0; using M = Cⱼ also enforces capacity. Fixed cost F zⱼ + c yⱼ needs yⱼ ≤ Mzⱼ. Choose the smallest valid M (max of the constraint's LHS over the bounded domain minus the RHS): a huge M lets the LP set z = y/M and nearly erases the fixed cost from the bound. Piecewise costs that decrease per unit (concave) need binaries; parallel arcs only work for convex costs.", "slides": [{"file": "Fall_2026_15_C57-L10.pdf", "page": 20, "label": "Linking binary and continuous; big-M"}, {"file": "Recitation6.pdf", "page": 7, "label": "BT 10.6 formulation with min/max lots"}]}, {"name": "Formulation strength", "explain": "Different formulations can share the integer set F but have different relaxations P. If P₁ ⊂ P₂ then for a min, Z_LO(2) ≤ Z_LO(1) ≤ Z_IO: the tighter formulation gives a better bound and usually far fewer B&B nodes. FL (xᵢⱼ ≤ yⱼ ∀i,j) is stronger than AFL (Σᵢ xᵢⱼ ≤ m·yⱼ) though it has more constraints; proving F equality uses integrality, proving P_FL ⊆ P_AFL just sums rows.", "slides": [{"file": "Fall_2026_15_C57-L10.pdf", "page": 22, "label": "Relaxations of the same F"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 25, "label": "FL vs AFL"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 27, "label": "Proof P_FL ⊆ P_AFL"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 29, "label": "Computation times FL vs AFL"}]}, {"name": "Ideal formulations", "explain": "A polyhedron is integral if all its extreme points are integer; a formulation is ideal if its LP relaxation is integral, i.e. P = conv(F). Equivalently, min cᵀx over P is attained at an integral point for every c with finite minimum. An ideal formulation can be solved as an LP (network flows, shortest path, assignment), but some non-vertex optima may still be fractional. In practice aim for a good, not ideal, formulation.", "slides": [{"file": "Fall_2026_15_C57-L10.pdf", "page": 23, "label": "Integral polyhedron, ideal formulation"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 24, "label": "Ideal ⇒ solve by LO"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 45, "label": "Summary takeaways"}]}, {"name": "Exponential families", "explain": "MST and TSP use one constraint per subset S (≈2ⁿ). MST: cutset Σ_{δ(S)} xₑ ≥ 1 vs subtour Σ_{E(S)} xₑ ≤ |S| − 1; subtour is stronger (P_sub ⊆ P_cut) and ideal. TSP: degree Σ_{δ({i})} xₑ = 2 plus cutset ≥ 2 or subtour ≤ |S| − 1; with degree constraints P_sub = P_cut, and no ideal TSP formulation is known. Such models are solved by row generation; MTZ is a polynomial but weak alternative (Rec 6).", "slides": [{"file": "Fall_2026_15_C57-L10.pdf", "page": 33, "label": "MST cutset"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 36, "label": "MST subtour: stronger and ideal"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 38, "label": "TSP enumeration counts"}, {"file": "Fall_2026_15_C57-L10.pdf", "page": 42, "label": "TSP subtour = cutset"}, {"file": "Recitation6.pdf", "page": 25, "label": "MTZ formulation"}]}], "mc": [{"d": "easy", "q": "Facility location: which constraint allows production only at built facilities, up to capacity?", "o": ["yⱼ ≤ Cⱼxⱼ", "Σᵢ zᵢⱼ ≤ yⱼ", "Σⱼ zᵢⱼ + uᵢ ≥ dᵢ", "xⱼ ≤ Cⱼyⱼ"], "e": "With xⱼ = 0 the row forces yⱼ = 0; with xⱼ = 1 it caps production at Cⱼ. The second row only limits shipments to production.", "t": 0, "src": "L10 p.17"}, {"d": "easy", "q": "Projects 3 and 4 cannot both be selected:", "o": ["x₃ + x₄ ≤ 1", "x₃ = x₄", "x₃ ≤ x₄", "x₃ + x₄ ≥ 1"], "e": "At most one of the two can be 1. x₃ + x₄ ≥ 1 instead forces at least one.", "t": 1, "src": "L10 p.19"}, {"d": "easy", "q": "Project 5 requires project 2:", "o": ["x₅ ≤ x₂", "x₂ ≤ x₅", "x₂ + x₅ ≤ 1", "x₂ + x₅ = 1"], "e": "x₅ = 1 forces x₂ = 1; x₂ alone is allowed. x₂ ≤ x₅ reverses the prerequisite.", "t": 1, "src": "L10 p.19"}, {"d": "easy", "q": "Formulations A and B have the same integer points, and A's LP relaxation is a strict subset of B's. For a minimization:", "o": ["Z_LO(B) ≤ Z_LO(A) ≤ Z_IO", "Z_LO(A) ≤ Z_LO(B) ≤ Z_IO", "Z_LO(A) = Z_LO(B)", "Z_IO(A) < Z_IO(B)"], "e": "Minimizing over a smaller set gives a larger (tighter) lower bound. The IP values are equal because F is the same.", "t": 3, "src": "L10 p.22"}, {"d": "easy", "q": "An integer optimization formulation is ideal when:", "o": ["Its LP relaxation equals conv(F): all vertices integral", "Its LP relaxation has a unique optimal solution", "It uses the fewest constraints of any valid formulation", "Its LP and IP optima coincide for one objective"], "e": "L10 p.23. Agreement for one objective is far weaker than for every objective.", "t": 4, "src": "L10 p.23"}, {"d": "easy", "q": "Routes from a fixed start for 8 cities, using the slide's count (n − 1)!:", "o": ["5,040", "40,320", "2,520", "362,880"], "e": "7! = 5,040. 8! = 40,320 forgets the fixed start; 362,880 = 9! is the slide's 10-city figure.", "t": 5, "src": "L10 p.38"}, {"d": "easy", "q": "Rec 6 Q1: plant 3 must produce k₀ if neither plant 1 nor plant 2 does. Correct constraint:", "o": ["z₃ ≥ 1 − (z₁ + z₂)", "z₃ ≥ z₁ + z₂", "z₃ ≤ z₁ + z₂", "z₃ ≤ 1 − (z₁ + z₂)"], "e": "When z₁ = z₂ = 0 the right side is 1, forcing z₃ = 1; otherwise it is ≤ 0. z₃ ≥ z₁ + z₂ forces plant 3 in the opposite case.", "t": 1, "src": "Rec 6 Q1 (p.8)"}, {"d": "easy", "q": "min cᵀx s.t. Ax = b, x ∈ Zᵖ₊ × ℝⁿ⁻ᵖ₊ is a:", "o": ["Mixed-integer optimization problem", "Binary optimization problem", "Pure integer optimization problem", "Linear optimization problem with integer data"], "e": "L10 p.3. Only the first p variables are integer; binary means x ∈ {0,1}ⁿ and pure IO means x ∈ Zⁿ₊.", "t": 0, "src": "L10 p.3"}, {"d": "easy", "q": "Fixed cost F plus unit cost c at facility j, production yⱼ, binary zⱼ. Correct cost and linking:", "o": ["Cost F·zⱼ + c·yⱼ with yⱼ ≤ M·zⱼ", "Cost F·yⱼ + c·zⱼ with yⱼ ≤ M·zⱼ", "Cost (F + c)·yⱼ with zⱼ ≤ yⱼ", "Cost F·zⱼ + c·yⱼ with zⱼ ≤ M·yⱼ"], "e": "L10 p.20. zⱼ pays F once; yⱼ ≤ Mzⱼ forces zⱼ = 1 whenever yⱼ > 0. zⱼ ≤ Myⱼ only forces production when zⱼ = 1, so F could be avoided.", "t": 2, "src": "L10 p.20"}, {"d": "easy", "q": "In the MST and TSP subtour formulations, Σ_{e∈E(S)} xₑ ≤ |S| − 1 for every S ⊂ V says:", "o": ["Edges inside S contain no cycle, so S is not an island", "At least one edge leaves every subset S", "Every node in S has degree at most |S| − 1", "The tree has exactly |S| − 1 edges in total"], "e": "L10 p.35. A cycle on k nodes of S uses k internal edges, violating ≤ |S| − 1 for that subset. Leaving S is the cutset condition Σ_{δ(S)} xₑ ≥ 1.", "t": 5, "src": "L10 p.35"}, {"d": "medium", "q": "The vehicle routing formulation on the L10 VRP slide lacks:", "o": ["Subtour elimination: detached customer loops are feasible", "Constraints that serve each customer exactly once", "Flow conservation constraints for each vehicle", "Constraints that each vehicle leaves the depot once"], "e": "It has coverage, depot and conservation rows, but a cycle among customers satisfies conservation without touching the depot.", "t": 0, "src": "L10 p.17"}, {"d": "medium", "q": "If project 1 or project 2 is selected, project 6 must be selected. Which single row is correct?", "o": ["x₁ + x₂ ≤ 2x₆", "x₁ + x₂ ≤ x₆", "x₆ ≤ x₁ + x₂", "x₁ + x₂ ≥ 2x₆"], "e": "x₆ = 1 allows up to two; x₆ = 0 forces both to 0. x₁ + x₂ ≤ x₆ wrongly forbids picking both 1 and 2.", "t": 1, "src": "L10 p.19"}, {"d": "medium", "q": "Linearize w = x₁·x₂ for binaries x₁, x₂:", "o": ["w ≤ x₁, w ≤ x₂, w ≥ x₁ + x₂ − 1", "w ≥ x₁, w ≥ x₂, w ≤ x₁ + x₂", "w = x₁ + x₂ − 1", "w ≤ x₁ + x₂ − 1"], "e": "The first set reproduces the AND truth table. The second set models OR.", "t": 1, "src": "L10 p.19 logic, extended to products"}, {"d": "medium", "q": "Plant capacity 300, fixed cost 600, linking y ≤ M·z. In the LP relaxation with y = 150, the fixed cost charged with M = 300 vs M = 3,000 is:", "o": ["300 vs 30", "600 vs 600", "150 vs 15", "300 vs 300"], "e": "The LP sets z = y/M, charging 600·150/300 = 300 or 600·150/3000 = 30. A big M nearly erases the fixed cost from the bound.", "t": 2, "src": "L10 p.20"}, {"d": "medium", "q": "Uncapacitated FL with m = 5 customers. In the AFL relaxation, 2 customers are fully assigned to facility 1 (fixed cost 20) and no one else. The smallest y₁ and the fixed cost charged:", "o": ["y₁ = 0.4, charging 8", "y₁ = 1, charging 20", "y₁ = 0.2, charging 4", "y₁ = 2, charging 40"], "e": "AFL: Σᵢ xᵢ₁ = 2 ≤ 5y₁ ⇒ y₁ ≥ 0.4. FL's xᵢ₁ ≤ y₁ would force y₁ = 1 and charge the full 20.", "t": 3, "src": "L10 p.25–27"}, {"d": "medium", "q": "Why can shortest path or assignment be solved as LPs with no integrality constraints?", "o": ["Their network formulations are ideal (integral vertices)", "Their optimal solutions are always unique", "Their cost coefficients are always integers", "LP solvers round fractional solutions automatically"], "e": "Network matrices have integral extreme points for integral b and u. Costs do not matter.", "t": 4, "src": "L10 p.24"}, {"d": "medium", "q": "Minimum spanning tree: which statement matches the slides?", "o": ["Subtour is stronger (P_sub ⊆ P_cut) and ideal", "Cutset is stronger (P_cut ⊆ P_sub) and ideal", "The two are equivalent and both are ideal", "Both have polynomially many constraints"], "e": "L10 p.36. For TSP, by contrast, the two families give the same relaxation.", "t": 5, "src": "L10 p.36"}, {"d": "hard", "q": "Compare x₁ + x₂ ≤ 2x₆ with the pair {x₁ ≤ x₆, x₂ ≤ x₆}:", "o": ["Same 0/1 solutions; the pair has a tighter LP relaxation", "Same 0/1 solutions and identical LP relaxations", "The single row is tighter because it has fewer constraints", "They have different 0/1 solutions"], "e": "Summing the pair gives the single row, not conversely: (1, 0, ½) satisfies the single row but not x₁ ≤ x₆.", "t": 1, "src": "L10 p.19"}, {"d": "hard", "q": "An arc costs 4 per unit for the first 5 units and 2 per unit beyond. Modeling it with two parallel arcs (capacity 5 at cost 4, uncapacitated at cost 2) in an LP:", "o": ["Underprices: the LP uses only the cost-2 arc; needs a binary", "Works, as it does for any piecewise-linear cost", "Works, but only if the flows are required integral", "Overprices: the LP fills the cost-4 arc first"], "e": "Shipping 10 units: LP cost 20 vs true 5·4 + 5·2 = 30. Parallel arcs work only when unit cost rises (convex).", "t": 2, "src": "PE P3 (non-decreasing unit costs)"}, {"d": "hard", "q": "u, v ∈ [0, 5]. Require 2u + v ≤ 8 or u + 2v ≤ 6 via δ ∈ {0,1}: 2u + v ≤ 8 + M₁(1 − δ) and u + 2v ≤ 6 + M₂δ. Smallest valid (M₁, M₂)?", "o": ["(7, 9)", "(15, 15)", "(8, 6)", "(9, 7)"], "e": "Over the box, max(2u + v) = 15 ⇒ M₁ = 15 − 8 = 7; max(u + 2v) = 15 ⇒ M₂ = 15 − 6 = 9. (15, 15) is valid but not smallest.", "t": 2, "src": "L10 p.20"}, {"d": "hard", "q": "Which point lies in P_AFL but not in P_FL (m = 4 customers)?", "o": ["y₁ = 1/4, x₁₁ = 1, customers 2–4 served elsewhere", "y₁ = 1 with x₁₁ = x₂₁ = 1, others served elsewhere", "y₁ = 0 with x₁₁ = 1, others served elsewhere", "y₁ = 1/2 with x₁₁ = x₂₁ = 1/2, others elsewhere"], "e": "AFL: 1 ≤ 4·¼ holds; FL: x₁₁ = 1 > ¼ fails. The last option satisfies both (½ ≤ ½), and y₁ = 0 with x₁₁ = 1 violates both.", "t": 3, "src": "L10 p.25–27"}, {"d": "hard", "q": "Optional parcel of area A with binary ζ. Option 1: Σⱼ xⱼ ≤ Aζ. Option 2: Σⱼ xⱼ ≤ A and xⱼ ≤ Aζ for every j. Which is tighter?", "o": ["Option 1: it implies every row of option 2 when ζ ≤ 1", "Option 2: disaggregated linking is always tighter", "They have identical LP relaxations", "Option 2, because it has more constraints"], "e": "Practice exam P2b. Option 1 with ζ ≤ 1 gives Σⱼ xⱼ ≤ A and each xⱼ ≤ Σⱼ xⱼ ≤ Aζ. Conversely, with A = 10 and two crops, option 2 admits ζ = ½ with 5 acres each; option 1 caps total acreage at 5.", "t": 3, "src": "PE P2b"}, {"d": "hard", "q": "A formulation's LP relaxation has integral optima for c = (1, 1) and c = (2, 1). Is it ideal?", "o": ["Not necessarily: it must hold for every c with finite min", "Yes, two objectives suffice in two dimensions", "Yes, provided the integer program is feasible", "No, ideal formulations do not exist in two dimensions"], "e": "Two objectives probe at most two vertices; another vertex can be fractional.", "t": 4, "src": "L10 p.23"}, {"d": "hard", "q": "TSP subtour vs cutset formulations (with degree-2 constraints):", "o": ["P_sub = P_cut, and no ideal TSP formulation is known", "P_sub ⊊ P_cut, and the subtour formulation is ideal", "The cutset formulation is ideal", "The subtour formulation has polynomially many constraints"], "e": "With degree 2, Σ_{δ(S)} xₑ = 2|S| − 2Σ_{E(S)} xₑ, so the two families coincide. The MST result does not carry over.", "t": 5, "src": "L10 p.42"}, {"d": "hard", "q": "HW3 P1(a): binaries x₁..xₙ, y; if at least k projects are selected then y = 1. Which single inequality is exact?", "o": ["Σᵢ xᵢ − k + 1 ≤ (n − k + 1)·y", "Σᵢ xᵢ − k ≤ (n − k)·y", "Σᵢ xᵢ ≥ k·y", "Σᵢ xᵢ − k + 1 ≤ y"], "e": "If Σ ≤ k − 1 the left side is ≤ 0, so y is free; if Σ ≥ k it is between 1 and n − k + 1, forcing y = 1. The second allows y = 0 at Σ = k; the third models y = 1 ⇒ Σ ≥ k; the last is infeasible when Σ > k.", "t": 2, "src": "HW3 P1(a)"}, {"d": "hard", "q": "HW3 P1(b): a formulation is ideal and its LP relaxation has finite optimum. Which is guaranteed?", "o": ["Some LP optimum is integral, but not necessarily every one", "Every LP optimum is integral", "The LP has a unique optimal solution", "The LP optimum is integral only if c is integral"], "e": "Ideal ⇒ every vertex integral, so a vertex optimum is integral. If c is parallel to an edge, e.g. min 0·x over [0,1], the midpoint ½ is also optimal. The cost vector's integrality is irrelevant.", "t": 4, "src": "HW3 P1(b)"}, {"d": "hard", "q": "min cᵀx + fᵀy, Ux + Vy ≥ b, x ∈ Zᵖ, y ∈ ℝⁿ⁻ᵖ, with unique optimum (x*, y*). Which is guaranteed?", "o": ["y* is a vertex of {y : Vy ≥ b − Ux*}", "(x*, y*) is a vertex of {(x, y) : Ux + Vy ≥ b}", "x* is the rounded LP-relaxation solution", "(x*, y*) is also optimal for the LP relaxation"], "e": "Practice exam 1g. Fixing x* leaves an LP in y, whose unique optimum is a vertex. The integer optimum generally lies strictly inside the relaxation polyhedron, not at its vertices.", "t": 0, "src": "PE 1g"}], "or": [{"q": "HW3 P2 (relief logistics). Over periods t = 1..T, a convoy dispatched in period t costs cₜ (fixed); demand dₜ, unit delivery cost pₜ, unit storage cost hₜ. (a) Formulate an IO model minimizing total cost with demand met each period and no backlog. (b) Unmet demand is allowed in t < T at penalty bₜ per unit (lost, not carried). Modify. (c) Convoys can go in at most five periods and never in two consecutive periods. Modify.", "pts": 10, "t": 2, "rubric": ["Variables: deliveries xₜ ≥ 0, inventory Iₜ ≥ 0, binary zₜ, with objective Σₜ (cₜzₜ + pₜxₜ + hₜIₜ) — 2 pts", "Balance Iₜ₋₁ + xₜ − Iₜ = dₜ with I₀ given (e.g. 0) and Iₜ ≥ 0 so no backlog — 2 pts", "Big-M link xₜ ≤ Mzₜ with a valid, justified M (e.g. Σₛ≥ₜ dₛ) — 2 pts", "(b) Lost-sales variable uₜ ≥ 0 for t < T, balance Iₜ₋₁ + xₜ + uₜ − Iₜ = dₜ, uₜ ≤ dₜ, u_T = 0, objective adds Σ bₜuₜ — 2 pts", "(c) Σₜ zₜ ≤ 5 and zₜ + zₜ₊₁ ≤ 1 for t = 1..T−1 — 2 pts"], "model": "(a) Variables: xₜ ≥ 0 units delivered in t, Iₜ ≥ 0 units held at end of t, zₜ ∈ {0,1} = 1 if a convoy is dispatched in t. min Σₜ (cₜzₜ + pₜxₜ + hₜIₜ) s.t. Iₜ₋₁ + xₜ − Iₜ = dₜ ∀t (I₀ = 0), xₜ ≤ Mₜzₜ ∀t with Mₜ = Σ_{s=t..T} dₛ (no reason to deliver more than remaining demand; this is the smallest natural M and keeps the relaxation tight), xₜ, Iₜ ≥ 0, zₜ binary. Iₜ ≥ 0 rules out backlogging. (b) Add uₜ ≥ 0 lost demand: Iₜ₋₁ + xₜ + uₜ − Iₜ = dₜ for t < T with uₜ ≤ dₜ, and Iₜ₋₁ + xₜ − Iₜ = d_T at T (u_T = 0); objective adds Σ_{t<T} bₜuₜ. Since unmet demand is lost, it never re-enters later balances. (c) Add Σₜ zₜ ≤ 5 and zₜ + zₜ₊₁ ≤ 1 for t = 1..T−1 (cannot dispatch in consecutive periods). Big-M is still valid since Mₜ bounds deliveries regardless of these limits.", "src": "HW3 P2"}, {"q": "True or false, with proof: for binaries x₁..xₙ, y and integer 1 ≤ k ≤ n, the requirement 'if at least k projects are selected then y = 1' can be modeled with a single linear inequality in x and y, without extra variables (HW3 P1a). Check all cases.", "pts": 10, "t": 1, "rubric": ["States TRUE — 2 pts", "Gives a correct inequality, e.g. Σᵢ xᵢ − (k − 1) ≤ (n − k + 1)y — 3 pts", "Case Σ ≤ k − 1: left side ≤ 0, so y ∈ {0,1} both allowed (no false restriction) — 2 pts", "Case Σ ≥ k: left side ∈ [1, n − k + 1], forcing y = 1 and remaining feasible with y = 1 — 2 pts", "Justifies the coefficient n − k + 1 as the smallest valid big-M (maximum of LHS) — 1 pts"], "model": "TRUE. Use Σᵢ xᵢ − (k − 1) ≤ (n − k + 1)·y. If fewer than k projects are selected, Σᵢ xᵢ ≤ k − 1, so the left side is ≤ 0 and the inequality holds for y = 0 and y = 1: nothing is forced. If at least k are selected, the left side is between 1 and n − (k − 1) = n − k + 1 > 0, so y = 0 violates it and y = 1 satisfies it since the left side never exceeds n − k + 1. The coefficient n − k + 1 is the largest value the left side can take, i.e. the smallest valid M; a smaller coefficient (e.g. 1) makes Σ = n infeasible, and a larger one is valid but weakens the relaxation. Equivalent form: y ≥ (Σᵢ xᵢ − k + 1)/(n − k + 1).", "src": "HW3 P1(a)"}, {"q": "Uncapacitated facility location: FL uses xᵢⱼ ≤ yⱼ ∀i,j; AFL uses Σᵢ xᵢⱼ ≤ m·yⱼ ∀j (both with Σⱼ xᵢⱼ = 1, binaries). (a) Show F_FL = F_AFL. (b) Show P_FL ⊆ P_AFL and give a point in P_AFL \\ P_FL for m = 4. (c) State the ordering of Z_LO(FL), Z_LO(AFL), Z_IO and explain why FL solves faster despite having more constraints.", "pts": 10, "t": 3, "rubric": ["(a) F_FL ⊆ F_AFL by summing; F_AFL ⊆ F_FL by cases yⱼ = 1 (xᵢⱼ ≤ 1 trivially) and yⱼ = 0 (sum 0 forces each xᵢⱼ = 0) — 3 pts", "(b) Summing xᵢⱼ ≤ yⱼ over i gives Σᵢ xᵢⱼ ≤ myⱼ, so P_FL ⊆ P_AFL — 2 pts", "(b) Valid point, e.g. y₁ = ¼, x₁₁ = 1, other customers served by open facilities: AFL 1 ≤ 4·¼ holds, FL x₁₁ ≤ y₁ fails — 2 pts", "(c) Z_LO(AFL) ≤ Z_LO(FL) ≤ Z_IO(AFL) = Z_IO(FL) — 2 pts", "(c) Tighter bound ⇒ more pruning, fewer B&B nodes; constraint count is not what drives solve time — 1 pts"], "model": "(a) If xᵢⱼ ≤ yⱼ for all i, summing over i gives Σᵢ xᵢⱼ ≤ m·yⱼ, so F_FL ⊆ F_AFL. Conversely take integer (x, y) feasible for AFL: if yⱼ = 1 then xᵢⱼ ≤ 1 = yⱼ holds; if yⱼ = 0 then Σᵢ xᵢⱼ ≤ 0 with xᵢⱼ ≥ 0 forces every xᵢⱼ = 0 ≤ yⱼ. So F_AFL ⊆ F_FL; this direction uses integrality of yⱼ. (b) The summing argument holds for fractional points too, so P_FL ⊆ P_AFL. With m = 4: y₁ = ¼, x₁₁ = 1, y₂ = 1, x₂₂ = x₃₂ = x₄₂ = 1, other x = 0. AFL: Σᵢ xᵢ₁ = 1 ≤ 4·¼ = 1 holds; FL: x₁₁ = 1 > y₁ = ¼ fails. Inclusion is strict. (c) For a minimization over nested relaxations, Z_LO(AFL) ≤ Z_LO(FL) ≤ Z_IO(AFL) = Z_IO(FL). AFL can charge only a fraction of a facility's fixed cost (yⱼ = share of customers), so its bound is weak. FL's bound is closer to Z_IO, so branch and bound prunes far more nodes; L10 p.29 shows FL much faster as size grows, although FL has mn linking rows vs n for AFL.", "src": "L10 p.25–29"}, {"q": "True or false, with proof or counterexample (HW3 P1b): if an integer optimization formulation is ideal and its LP relaxation has a finite optimal value, then every optimal solution of the relaxation satisfies the integrality requirements. Then state what IS guaranteed.", "pts": 10, "t": 4, "rubric": ["States FALSE — 2 pts", "Recalls ideal ⇔ P integral (all extreme points integer) — 2 pts", "Valid counterexample in the stated form: ideal P, finite optimum, a fractional optimal point (e.g. P = [0,1], min 0·x, x = ½) — 4 pts", "States the guarantee: an optimal extreme point exists and is integral, so LP solved by simplex returns an integer optimum — 2 pts"], "model": "FALSE. Ideal means the relaxation P is an integral polyhedron, i.e. all extreme points are integer, equivalently min cᵀx over P is attained by an integral vector for every c with finite minimum. 'Attained by an integral vector' does not mean every optimizer is integral. Counterexample: F = {x ∈ Z : 0 ≤ x ≤ 1}, P = [0,1], whose vertices 0 and 1 are integer, so the formulation is ideal. Take min 0·x: the optimal value is 0 (finite), and x = ½ is optimal but fractional. A 2-D version: P = conv{(0,0),(1,0),(0,1)} with min −x₁ − x₂; the whole edge from (1,0) to (0,1), including (½, ½), is optimal. What is guaranteed: when the optimum is finite (and P has a vertex), some optimal solution is an extreme point and is integral, so the simplex method (which returns a BFS) solves the IO as an LP.", "src": "HW3 P1(b)"}, {"q": "Minimum spanning tree on G = (V, E), |V| = n. Show that the subtour formulation (Σₑ xₑ = n − 1, Σ_{e∈E(S)} xₑ ≤ |S| − 1 ∀S) is at least as strong as the cutset formulation (Σₑ xₑ = n − 1, Σ_{e∈δ(S)} xₑ ≥ 1 ∀S), i.e. P_sub ⊆ P_cut. Then state what L10 says about ideality for MST and how the TSP case differs.", "pts": 10, "t": 5, "rubric": ["Partition E into E(S), E(V∖S), δ(S) for any proper nonempty S — 2 pts", "Apply subtour rows to S and V∖S and Σₑ xₑ = n − 1 to obtain Σ_{δ(S)} xₑ ≥ (n − 1) − (|S| − 1) − (n − |S| − 1) = 1 — 4 pts", "Concludes P_sub ⊆ P_cut since the argument holds for fractional x — 1 pts", "MST: subtour formulation is ideal, P_sub = conv(F) — 1 pts", "TSP: with degree-2 rows P_sub = P_cut and no ideal formulation is known — 2 pts"], "model": "Take x ∈ P_sub and any S ⊂ V with S ≠ ∅, V. Every edge lies in exactly one of E(S), E(V∖S) or δ(S), so n − 1 = Σₑ xₑ = Σ_{E(S)} xₑ + Σ_{E(V∖S)} xₑ + Σ_{δ(S)} xₑ. Subtour rows for S and for V∖S (also proper and nonempty) give Σ_{E(S)} xₑ ≤ |S| − 1 and Σ_{E(V∖S)} xₑ ≤ n − |S| − 1. Hence Σ_{δ(S)} xₑ ≥ (n − 1) − (|S| − 1) − (n − |S| − 1) = 1, which is the cutset row. No integrality was used, so P_sub ⊆ P_cut. L10 p.36: for MST the subtour formulation is moreover ideal (P_sub = conv(F)), so its LP relaxation solves MST. For TSP (degree Σ_{δ({i})} xₑ = 2), Σ_{δ(S)} xₑ = 2|S| − 2Σ_{E(S)} xₑ, so the subtour and cutset rows are equivalent and P_sub = P_cut (L10 p.42); no ideal TSP formulation is known, so B&B / row generation is required.", "src": "L10 p.33–36, 42"}]}, {"id": "l11", "title": "Integer optimization algorithms", "deck": "Fall_2026_15_C57-L11.pdf", "brief": "Lecture 11 shows how to solve integer programs by solving LPs repeatedly. The LP relaxation bounds the optimum from one side and any feasible integer point from the other; branch and bound splits on a fractional variable (xⱼ ≤ ⌊xⱼ*⌋ or xⱼ ≥ ⌈xⱼ*⌉) and prunes leaves by infeasibility, bound, or integrality until the bounds meet. Cutting planes instead add valid inequalities that remove the fractional LP optimum without removing integer points; Gomory cuts are read directly off a simplex tableau row and re-optimized with dual simplex. Modern solvers combine both in branch-and-cut, and huge models such as TSP are solved by generating subtour constraints only as needed. Exams ask you to run B&B by hand, decide pruning, derive a Gomory cut from a tableau (practice exam 1i), and justify T/F claims about bounds (practice exam 1h, HW3 P1).", "keyPoints": ["Min: feasible x ⇒ UB; LP relaxation ⇒ LB (swap for max)", "Branch xⱼ ≤ ⌊xⱼ*⌋ | xⱼ ≥ ⌈xⱼ*⌉; child LP never better than parent", "Prune: infeasible, z_k ≥ UB (round with integer data), or integral (update incumbent)", "Valid cut: holds on F, violated at x*; F and Z_IO unchanged, P shrinks", "Gomory: xᵢ + Σ⌊āᵢⱼ⌋xⱼ ≤ ⌊āᵢ₀⌋ ⇔ Σ f(āᵢⱼ)xⱼ ≥ f(āᵢ₀); re-solve by dual simplex", "Gomory converges finitely for pure IO, not MIO", "Branch-and-cut: fewer, slower nodes; TSP row generation solves an IP master per round"], "topics": [{"name": "Bounds & relaxations", "explain": "For min Z_MIO: any feasible point gives an upper bound (Z_MIO ≤ cᵀx), and the LP relaxation over P ⊇ F gives a lower bound (Z_LO ≤ Z_MIO). Roles flip for a maximization. If the LP optimum is integral it solves the MIO. B&B and cutting planes both solve MIO by solving LPs repeatedly and closing the gap between these bounds.", "slides": [{"file": "Fall_2026_15_C57-L11.pdf", "page": 2, "label": "Feasible solution → upper bound"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 3, "label": "Relaxation → lower bound"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 36, "label": "Integral LP optimum solves MIO"}]}, {"name": "Branch and bound", "explain": "If xⱼ* is fractional, split into xⱼ ≤ ⌊xⱼ*⌋ and xⱼ ≥ ⌈xⱼ*⌉: the disjunction keeps every integer point but removes x*. Each child adds a constraint, so its LP is no better than the parent's (min: ≥ parent). Z_MIO = min of the children's MIO values; the children's LP values give a lower bound. Know the L11 examples by hand: knapsack 21.375 root, min x₁ − 2x₂ root (1.5, 2.5).", "slides": [{"file": "Fall_2026_15_C57-L11.pdf", "page": 22, "label": "Root LP (1.5, 2.5), z = −3.5"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 25, "label": "Branch on x₁ at x₂ ≤ 2"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 37, "label": "Branching subproblems"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 38, "label": "Disjunction tightens the LO"}, {"file": "Recitation6.pdf", "page": 29, "label": "Branching picture"}]}, {"name": "Pruning & bookkeeping", "explain": "Prune by infeasibility (LP infeasible), by bound (LP value no better than incumbent; with integer data round the LP value first), or by integrality (LP integral: update incumbent). Global bounds: incumbent and best open-leaf LP value; stop when they meet. A fractional node whose LP equals the incumbent is pruned by bound (HW3 P1e). Worst case is exponential (HW3 P3).", "slides": [{"file": "Fall_2026_15_C57-L11.pdf", "page": 18, "label": "Prune by bound / infeasibility"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 39, "label": "Branching, bounding, pruning, terminating"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 40, "label": "Generic B&B flowchart"}]}, {"name": "Cutting planes", "explain": "A valid inequality αᵀx ≤ β holds on all of F; it is a cut if αᵀx* > β for the current LP optimum. Adding it leaves F (and Z_MIO) unchanged but shrinks P, so the LP bound can only tighten (not necessarily strictly). Finding a cut is the separation problem; strong cuts are hard, weak ones cheap. Example 2 (max 5.5x₁ + 2.1x₂) needs four cuts to reach (1, 3).", "slides": [{"file": "Fall_2026_15_C57-L11.pdf", "page": 42, "label": "Cutting planes example 1"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 48, "label": "Cutting planes example 2"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 59, "label": "Valid inequality definition"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 60, "label": "Cut tightens LO, not MIO"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 64, "label": "Separation problem"}]}, {"name": "Gomory cuts", "explain": "From a tableau row xᵢ + Σⱼ āᵢⱼxⱼ = āᵢ₀ with āᵢ₀ fractional: x ≥ 0 gives xᵢ + Σ⌊āᵢⱼ⌋xⱼ ≤ āᵢ₀; integrality gives ≤ ⌊āᵢ₀⌋. Equivalent fractional form Σ fᵢⱼxⱼ ≥ fᵢ₀ (f = fractional part, so ⌊−0.25⌋ = −1, f = 0.75). Add a slack row and re-optimize with dual simplex (dual feasible, primal infeasible). Converges finitely for pure IO, not MIO.", "slides": [{"file": "Fall_2026_15_C57-L11.pdf", "page": 69, "label": "Derivation: floor the RHS"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 71, "label": "Gomory fractional cut and algorithm"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 74, "label": "Second tableau of the example"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 75, "label": "Cut −3x₁ + 5x₂ ≤ 7"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 77, "label": "Remarks: dual simplex, IO only"}, {"file": "practice-exam-2026-solutions.pdf", "page": 9, "label": "Practice exam Gomory cut"}]}, {"name": "Branch-and-cut & row generation", "explain": "Branch-and-cut adds cuts at each node and branches when cuts stall: fewer, slower nodes with tighter LPs, heavy cutting at the root. For TSP, row generation solves a master IP with degree rows and a subset S₀ of subtour constraints, finds a subtour in the solution (subproblem), adds it, and repeats until the solution is a tour. Adding up to K = 20 subtours per round was fastest on the slides.", "slides": [{"file": "Fall_2026_15_C57-L11.pdf", "page": 79, "label": "Generic branch-and-cut"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 80, "label": "Remarks on branch-and-cut"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 84, "label": "TSP row generation master/subproblem"}, {"file": "Fall_2026_15_C57-L11.pdf", "page": 87, "label": "TSP results by K"}]}], "mc": [{"d": "easy", "q": "In a minimization MIO, the LP relaxation value provides:", "o": ["A lower bound on Z_MIO", "An upper bound on Z_MIO", "The exact value of Z_MIO", "No bound unless its solution is integral"], "e": "F ⊆ P, so minimizing over P can only do better. Feasible integer points give upper bounds.", "t": 0, "src": "L11 p.3"}, {"d": "easy", "q": "In a maximization IP, a feasible integer solution with value 40 provides:", "o": ["A lower bound of 40 on the optimum", "An upper bound of 40 on the optimum", "A bound only if it came from the root LP", "No information until branch and bound ends"], "e": "The optimum is at least as good as any feasible point. Bounds switch roles in a max problem.", "t": 0, "src": "L11 p.39"}, {"d": "easy", "q": "The LP solution has x₂ = 3.6. Branching on x₂ creates:", "o": ["x₂ ≤ 3 and x₂ ≥ 4", "x₂ ≤ 3.6 and x₂ ≥ 3.6", "x₂ = 3 and x₂ = 4", "x₂ ≤ 4 and x₂ ≥ 3"], "e": "The disjunction removes the open interval (3, 4), which contains no integers but contains x*. Splitting at 3.6 keeps x* in both children.", "t": 1, "src": "L11 p.37–38"}, {"d": "easy", "q": "A minimization root LP has value −3.5. After branching on x₂, a child's LP value is:", "o": ["≥ −3.5", "≤ −3.5", "Either side of −3.5", "Exactly −3.5"], "e": "The child adds a constraint to the parent LP, so its minimum cannot decrease. Reversed for maximization.", "t": 1, "src": "PE 1h"}, {"d": "easy", "q": "A node's LP solution is integral and better than the incumbent. Action:", "o": ["Prune by integrality; update the incumbent", "Branch on the most fractional variable", "Prune by bound, keeping the old incumbent", "Prune by infeasibility"], "e": "An integral LP optimum is the best integer point in that subtree, so nothing below it needs exploring.", "t": 2, "src": "L11 p.39–40"}, {"d": "easy", "q": "A valid inequality for an integer program:", "o": ["Holds at every integer feasible point", "Holds at every point of the LP relaxation", "Must pass through the current LP optimum", "Must be a facet of conv(F)"], "e": "Valid means it never removes a point of F. A cut is a valid inequality that the current LP optimum violates.", "t": 3, "src": "L11 p.59"}, {"d": "easy", "q": "Compared with plain branch and bound, branch-and-cut explores:", "o": ["Fewer, slower nodes with tighter LPs", "More, faster nodes with weaker LPs", "No branches at all", "Cuts only at leaf nodes"], "e": "Slide 23. Implementations cut heavily at the root and branch more deeper down.", "t": 5, "src": "L11 p.80"}, {"d": "easy", "q": "Rec 6 example (max x₁ + 2x₂): LP optimum (2, 2.5) with value 7. The IP optimum value is:", "o": ["6, at (2, 2)", "7, at (2, 3)", "5, at (3, 1)", "6.33, at (7/3, 2)"], "e": "Enumerating the 8 integer feasible points gives (2, 2) with 6. (2, 3) violates −3x₁ + 4x₂ ≤ 4.", "t": 1, "src": "Rec 6 p.13–16"}, {"d": "easy", "q": "For a maximization IP, a node's LP value is 6.33 and the incumbent is 6. With integer objective coefficients:", "o": ["Prune: ⌊6.33⌋ = 6 cannot beat the incumbent", "Branch: 6.33 > 6, so it may improve", "Prune by infeasibility", "Stop the whole search: 6 is optimal everywhere"], "e": "Integer data make objective values integer, so this subtree's best is at most 6. The Rec 6 tree prunes this way at x₁ ≥ 3 as well (value 5).", "t": 2, "src": "Rec 6 B&B"}, {"d": "easy", "q": "The separation problem, given polyhedron P and point x*, asks to:", "o": ["Certify x* ∈ P or find α, β with αᵀx ≤ β on P and αᵀx* > β", "Find the integer point of P closest to x*", "Split P into two subproblems along a fractional coordinate of x*", "Solve the LP relaxation over P and return its optimum"], "e": "L11 p.64. In theory separation is as hard as optimization; Gomory cuts make it easy by reading a violated inequality off the tableau. Splitting P is branching, not cutting.", "t": 3, "src": "L11 p.64"}, {"d": "medium", "q": "max 4x₁ + 5x₂ s.t. 2x₁ + 3x₂ ≤ 12, 4x₁ + 2x₂ ≤ 13, x ∈ Z²₊. The root LP solution is:", "o": ["x = (1.875, 2.75), z = 21.25", "x = (2, 2.75), z = 21.75", "x = (3.25, 0), z = 13", "x = (0, 4), z = 20"], "e": "Both constraints bind: from 2x₁ + 3x₂ = 12 and 4x₁ + 2x₂ = 13, x₂ = 2.75, x₁ = 1.875. (0, 4) is the IP optimum, not the LP optimum.", "t": 1, "src": "L11 B&B (exercise)"}, {"d": "medium", "q": "Same IP (max 4x₁ + 5x₂, 2x₁ + 3x₂ ≤ 12, 4x₁ + 2x₂ ≤ 13). The optimal integer solution is:", "o": ["(0, 4) with value 20", "(2, 2) with value 18", "(1, 3) with value 19", "(2, 3) with value 23"], "e": "Branch and bound and enumeration agree on (0, 4). Rounding the LP point (1.875, 2.75) up to (2, 3) is infeasible (13 > 12).", "t": 2, "src": "L11 B&B (exercise)"}, {"d": "medium", "q": "Binary knapsack: max 10x₁ + 9x₂ + 5x₃ + 3x₄ s.t. 5x₁ + 6x₂ + 4x₃ + 3x₄ ≤ 10. Root LP value:", "o": ["17.5", "15", "19", "14"], "e": "Greedy by value/weight (2, 1.5, 1.25, 1): x₁ = 1, x₂ = 5/6 ⇒ 10 + 7.5 = 17.5. The IP optimum is 15 ({1, 3}); 19 ignores capacity.", "t": 1, "src": "L11 p.6 (knapsack variant)"}, {"d": "medium", "q": "Adding a cut to an integer formulation changes:", "o": ["P shrinks; F and conv(F) do not change", "F and conv(F) shrink; P does not change", "F, conv(F) and P all shrink", "Only the objective function changes"], "e": "A cut removes fractional points only. Branching, by contrast, splits F into two pieces.", "t": 3, "src": "L11 p.60–61"}, {"d": "medium", "q": "Tableau row (all variables integer): x₁ − (2/7)s₁ + (3/7)s₂ = 15/7. Gomory cut in floor form:", "o": ["x₁ − s₁ ≤ 2", "x₁ ≤ 2", "x₁ + s₂ ≤ 2", "x₁ − s₁ + s₂ ≤ 3"], "e": "⌊−2/7⌋ = −1, ⌊3/7⌋ = 0, ⌊15/7⌋ = 2. Treating ⌊−2/7⌋ as 0 gives x₁ ≤ 2, a weaker inequality.", "t": 4, "src": "L11 p.71"}, {"d": "medium", "q": "After appending a Gomory cut to the optimal tableau, re-optimize with:", "o": ["Dual simplex: still dual feasible, new slack negative", "Primal simplex restarted from scratch", "Primal simplex, since the basis stays primal feasible", "A new branch-and-bound tree from the root"], "e": "Reduced costs are unchanged (the new slack has reduced cost 0), but the new basic slack equals −f₀ < 0.", "t": 4, "src": "L11 p.77"}, {"d": "medium", "q": "In TSP row generation, what is solved at each master iteration?", "o": ["An IP with degree rows and the subtours found so far", "The LP relaxation with every subtour constraint included", "A shortest-path problem between consecutive cities", "An LP with Gomory cuts added at each round"], "e": "The master is an integer program over a growing constraint set; the subproblem searches its solution for a violated subtour.", "t": 5, "src": "L11 p.84"}, {"d": "hard", "q": "Same IP (max 4x₁ + 5x₂). The branch x₂ ≤ 2 has LP solution (2.25, 2) with z = 19. What does this say about integer solutions in that subtree?", "o": ["None is worth more than 19", "None is worth less than 19", "The best one is worth exactly 19", "None is worth more than 21.25 but at least 19"], "e": "A max node's LP value is an upper bound for its subtree. The best integer point there is (2, 2) with 18.", "t": 2, "src": "L11 B&B (exercise)"}, {"d": "hard", "q": "Same IP. Suppose the incumbent is (1, 3) with value 19, and the open node x₂ ≥ 3, x₁ ≤ 1 has LP (1, 3.33), z = 20.67. Prune it?", "o": ["No: ⌊20.67⌋ = 20 > 19, so it may contain a better solution", "Yes: its LP solution is fractional, so it is pruned", "Yes: 20.67 exceeds the root bound, so it is pruned", "No: nodes are pruned only when their LP is infeasible"], "e": "Integer coefficients make 20 the best possible value there, and (0, 4) with 20 is in fact found in that subtree.", "t": 2, "src": "L11 B&B (exercise)"}, {"d": "hard", "q": "A valid cut removes the current LP optimum. Must the LP bound strictly improve?", "o": ["No: an alternative LP optimum can survive the cut", "Yes: removing the optimum always worsens the LP value", "Yes, because the cut is valid", "No: cuts never change the LP value"], "e": "max x₁ + x₂ with x₁ + x₂ ≤ 1.5, 0 ≤ x ≤ 1: the cut x₁ + 0.2x₂ ≤ 1 removes (1, 0.5) but (0.875, 0.625) still gives 1.5.", "t": 3, "src": "L11 p.59–60"}, {"d": "hard", "q": "Same row x₁ − (2/7)s₁ + (3/7)s₂ = 15/7. Gomory cut in fractional form:", "o": ["(5/7)s₁ + (3/7)s₂ ≥ 1/7", "(2/7)s₁ + (3/7)s₂ ≥ 1/7", "−(2/7)s₁ + (3/7)s₂ ≥ 1/7", "(5/7)s₁ + (3/7)s₂ ≥ 15/7"], "e": "Fractional parts: −2/7 − (−1) = 5/7, 3/7, and 15/7 − 2 = 1/7. It is violated at the LP point, where s₁ = s₂ = 0.", "t": 4, "src": "L11 p.71"}, {"d": "hard", "q": "The row came from min −2x₁ − 3x₂ with x₁ + 3x₂ + s₁ = 9 and 3x₁ + 2x₂ + s₂ = 11. Substituting s₁ = 9 − x₁ − 3x₂ into x₁ − s₁ ≤ 2 gives:", "o": ["2x₁ + 3x₂ ≤ 11", "3x₂ ≤ 11", "2x₁ − 3x₂ ≤ 11", "2x₁ + 3x₂ ≤ 7"], "e": "x₁ − 9 + x₁ + 3x₂ ≤ 2. It is valid for every integer point, cuts off the LP point (15/7, 16/7) where 2x₁ + 3x₂ = 78/7, and moves the LP value from −78/7 to −11.", "t": 4, "src": "L11 p.75 method"}, {"d": "hard", "q": "Why can't the Gomory derivation be applied to a row containing a continuous nonbasic variable?", "o": ["Rounding the RHS needs an integer left side, which then fails", "Continuous variables have no reduced cost in the tableau", "The resulting row would make the LP infeasible", "The floor of a continuous variable is undefined"], "e": "Step 2 (LHS integer ⇒ round RHS) breaks; this is why Gomory convergence holds for IO, not MIO.", "t": 4, "src": "L11 p.77"}, {"d": "hard", "q": "Maximization IP with integer objective coefficients. Incumbent value 18; open leaves have LP values 19.8 and 17.6; every other leaf is pruned. Tightest valid bounds on Z_IO:", "o": ["18 ≤ Z_IO ≤ 19", "18 ≤ Z_IO ≤ 19.8", "17.6 ≤ Z_IO ≤ 19.8", "18 ≤ Z_IO ≤ 21.375"], "e": "For a max, the incumbent is the lower bound and the best open LP value the upper bound (19.8); integer objective values lower it to ⌊19.8⌋ = 19. The 17.6 leaf can already be pruned; the root value 21.375 is superseded.", "t": 0, "src": "L11 p.13–15, 39"}, {"d": "hard", "q": "L11 knapsack: max 15x₁ + 12x₂ + 4x₃ + 2x₄ s.t. 8x₁ + 5x₂ + 3x₃ + 2x₄ ≤ 10, binary. Incumbent (0, 1, 1, 1) = 18. LP value at node x₁ = 1, x₂ = 0, and the action:", "o": ["17.67; prune by bound", "19.8; branch on x₃", "18; prune by integrality", "Infeasible; prune by infeasibility"], "e": "With x₁ = 1 and x₂ = 0, 3x₃ ≤ 2 gives x₃ = 2/3 and z = 15 + 8/3 = 17.67 < 18 (the slide prints x₃ as 0.33, but z = 17.67). 19.8 is the parent x₁ = 1; the sibling x₂ = 1 is the infeasible one.", "t": 2, "src": "L11 p.15–18"}, {"d": "hard", "q": "Practice exam (P1): min −x₁ − 4x₂, x₁ + 6x₂ + s₁ = 18, x₁ + s₂ = 3. Row x₂ + (1/6)s₁ − (1/6)s₂ = 5/2. The Gomory cut in the original variables is:", "o": ["x₁ + x₂ ≤ 5", "x₂ ≤ 2", "x₁ + x₂ ≤ 4", "x₂ − x₁ ≤ 2"], "e": "Floor form x₂ − s₂ ≤ 2; s₂ = 3 − x₁ gives x₁ + x₂ ≤ 5, violated at (3, 2.5). x₂ ≤ 2 looks natural but cuts off the integer point (0, 3), the optimum; x₁ + x₂ ≤ 4 also removes (3, 2).", "t": 4, "src": "PE 1i (p.9–10)"}, {"d": "hard", "q": "HW3 P3: min xₙ₊₁ s.t. 2x₁ + … + 2xₙ + xₙ₊₁ = n, binary, n odd. Why can't B&B prune a node with at most (n − 1)/2 variables fixed to 1 and at most (n − 1)/2 fixed to 0?", "o": ["Its LP is feasible with value 0 and fractional, but every integer point has value 1", "Its LP is infeasible, but infeasibility is detected only at the leaves", "Its LP solution is integral, so it must be compared with the incumbent", "Its LP value is 1, which ties with the incumbent and forces branching"], "e": "n odd ⇒ xₙ₊₁ = 1 in every integer solution, so UB = 1. With xₙ₊₁ = 0 the free xᵢ can sum to n/2 (a half-integer), so LP = 0 < 1 with a fractional solution. Hence ≥ 2^((n−1)/2) nodes.", "t": 2, "src": "HW3 P3"}], "or": [{"q": "Branch and bound by hand (Rec 6): max x₁ + 2x₂ s.t. −3x₁ + 4x₂ ≤ 4, 3x₁ + 2x₂ ≤ 11, 2x₁ − x₂ ≤ 5, x ≥ 0 integer. The root LP optimum is (2, 2.5) with value 7. Branch on x₂ first, then as needed. For each node give the LP solution, value, and pruning reason; state the optimal solution and the final bounds.", "pts": 10, "t": 1, "rubric": ["Root branch x₂ ≤ 2 / x₂ ≥ 3; x₂ ≥ 3 infeasible (needs x₁ ≥ 8/3 and x₁ ≤ 5/3) — 2 pts", "x₂ ≤ 2 node: LP (7/3, 2), value 19/3 ≈ 6.33 — 2 pts", "Branch x₁ ≤ 2: LP (2, 2), value 6, integral → incumbent, prune by integrality — 2 pts", "Branch x₁ ≥ 3: LP (3, 1), value 5 < 6 → prune by bound (also integral) — 2 pts", "Optimum (2, 2) with Z = 6; upper bound fell 7 → 6.33 → 6, equal to incumbent, terminate — 2 pts"], "model": "Root: (2, 2.5), z = 7, upper bound 7, no incumbent. Branch on x₂. Node x₂ ≥ 3: −3x₁ + 12 ≤ 4 needs x₁ ≥ 8/3, but 3x₁ + 6 ≤ 11 needs x₁ ≤ 5/3 → infeasible, prune by infeasibility. Node x₂ ≤ 2: x₂ = 2 binds and 3x₁ + 4 ≤ 11 gives x₁ = 7/3 (2x₁ − 2 ≤ 5 allows 3.5), so LP (7/3, 2), z = 19/3 ≈ 6.33; fractional, branch on x₁. Node x₁ ≤ 2: LP (2, 2), z = 6, integral → incumbent 6, prune by integrality. Node x₁ ≥ 3: 2x₁ − x₂ ≤ 5 forces x₂ ≥ 1 and 3x₁ + 2x₂ ≤ 11 forces x₂ ≤ 1, so LP (3, 1), z = 5 < 6 → prune by bound (it is integral but worse). No open leaves remain: lower bound = upper bound = 6. Optimal IP solution (2, 2) with value 6. (Also, with integer objective data, 6.33 could only yield ≤ 6.)", "src": "Rec 6 p.13–16, 29"}, {"q": "Justify each as true or false (HW3 P1d–e). (d) If the LP relaxation of a mixed-integer minimization has an optimal solution that is integral in all integer-constrained variables, it is optimal for the MIO. (e) In branch and bound for a minimization, a node whose LP relaxation has a fractional optimum with value equal to the incumbent's value must be branched on because its solution is fractional.", "pts": 10, "t": 2, "rubric": ["(d) TRUE — 1 pts", "(d) Proof: x* ∈ F so Z_MIO ≤ cᵀx* = Z_LO; F ⊆ P so Z_LO ≤ Z_MIO; hence equality and x* optimal — 4 pts", "(e) FALSE — 1 pts", "(e) The node's LP value is a lower bound for every integer point in its subtree; equal to the incumbent ⇒ nothing better below — 3 pts", "(e) Names it p
